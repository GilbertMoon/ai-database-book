name: Apply Chapter 04 final publication review once

on:
  push:
    paths:
      - 'scripts/ch04_final_publication_review_once.py'
      - '.github/workflows/ch04-final-publication-review-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Chapter 04 publication refinements
        run: python scripts/ch04_final_publication_review_once.py
      - name: Commit Chapter 04 publication refinements
        run: |
          rm -f scripts/ch04_final_publication_review_once.py
          rm -f .github/workflows/ch04-final-publication-review-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add book/chapter04 code/chapter04 notes/chapter04_review_checklist.md publish/full_manuscript.md scripts/ch04_final_publication_review_once.py .github/workflows/ch04-final-publication-review-once.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Refine Chapter 04 final publication content'
          git push
