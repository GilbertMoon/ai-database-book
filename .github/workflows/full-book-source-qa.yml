name: Full book Source QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'book/**/*.html'
      - 'book/chapter*/chapter*.md'
      - 'assets/css/*.css'
      - 'images/**/*.jpg'
      - 'scripts/validate_publication_styles.py'
      - 'scripts/validate_book_index.py'
      - 'scripts/validate_full_book_source.py'
      - '.github/workflows/full-book-source-qa.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate publication styles
        run: python scripts/validate_publication_styles.py

      - name: Validate publication index
        run: python scripts/validate_book_index.py

      - name: Validate full book Source QA
        id: source_qa
        shell: bash
        run: |
          set +e
          python scripts/validate_full_book_source.py 2>&1 | tee full_book_source_qa_report.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Commit QA report
        run: |
          mkdir -p publish
          cp full_book_source_qa_report.txt publish/full_book_source_qa_report.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publish/full_book_source_qa_report.txt
          if git diff --cached --quiet; then
            echo 'QA report unchanged.'
          else
            git commit -m 'Update full book Source QA report'
            git push
          fi

      - name: Enforce full book Source QA result
        if: steps.source_qa.outputs.failed == 'true'
        run: exit 1
