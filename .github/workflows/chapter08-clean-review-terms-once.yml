name: Clean Chapter 08 Review Terms Once

on:
  push:
    paths:
      - '.github/workflows/chapter08-clean-review-terms-once.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove stale literal from review-only prose
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          review = Path('book/chapter08/chapter08_review_revision.md')
          text = review.read_text(encoding='utf-8')
          text = text.replace('`paid_amount` 구용어', '과거 결제형 금액 열 이름')
          text = text.replace('과거 `paid_amount`가 남아 있었습니다', '과거 결제형 금액 열 이름이 남아 있었습니다')
          text = text.replace('paid_amount\n→ recorded_amount', '과거 금액 열 이름\n→ recorded_amount')
          text = text.replace('발표 강의안의 paid_amount 제거', '발표 강의안의 과거 금액 열 이름 제거')
          text = text.replace('`paid_amount`를 `recorded_amount`로 수정했습니다', '과거 금액 열 이름을 `recorded_amount`로 수정했습니다')
          text = text.replace('paid_amount 잔존 차단', '과거 금액 열 이름 잔존 차단')
          review.write_text(text, encoding='utf-8')

          image = Path('images/chapter08/README.md')
          text = image.read_text(encoding='utf-8')
          text = text.replace('`paid_amount` 구용어', '과거 결제형 금액 열 이름')
          text = text.replace('paid_amount 구용어 없음', '과거 결제형 금액 열 이름 없음')
          image.write_text(text, encoding='utf-8')

          for path in [review, image]:
              if 'paid_amount' in path.read_text(encoding='utf-8'):
                  raise SystemExit(f'stale literal still remains in {path}')
          PY

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chapter08-clean-review-terms-once.yml
          git add book/chapter08/chapter08_review_revision.md images/chapter08/README.md
          git commit -m "Clean Chapter 08 review terminology"
          git push
