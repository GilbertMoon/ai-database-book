              '`ch01_03_ai_db_learning_flow.svg`는 최종 Chapter 01 본문에서는 사용하지 않지만 자산으로 보관합니다. 도식은 도구 이름을 단순 나열하지 않고 다음 작업을 중심으로 구성합니다.',
              'image README flow status',
          )
          text = replace_once(text, '| `ch01_03_ai_db_learning_flow.mmd` | `ch01_03_ai_db_learning_flow.svg` | 사용 |', '| `ch01_03_ai_db_learning_flow.mmd` | `ch01_03_ai_db_learning_flow.svg` | 미사용 보관 |', 'image README mermaid status')
          text = replace_once(text, 'GitHub·Word·PDF·eBook에서 그림 1-1~1-3이 정상 표시되는가?', 'GitHub·Word·PDF·eBook에서 그림 1-1~1-2가 정상 표시되는가?', 'image README rendering range')
          p.write_text(text, encoding='utf-8')

          # Regenerate canonical merged manuscript.
          subprocess.run(['python', '-m', 'py_compile', 'scripts/merge_chapters.py'], check=True)
          subprocess.run(['python', 'scripts/merge_chapters.py'], check=True)

          # Final textual invariants.
          chapter = Path('book/chapter01/chapter01.md').read_text(encoding='utf-8')
          numbered = re.findall(r'^## (\d+)\.', chapter, flags=re.M)
          if numbered != [str(i) for i in range(1, 15)]:
              raise SystemExit(f'Chapter 01 section numbering mismatch: {numbered}')
          forbidden = [
              '## 10. 이 책을 학습하는 방법',
              '<img ',
              '<br>',
              'book/chapter01/chapter01_activity.md',
              'ch01_03_ai_db_learning_flow.svg',
              '몇 초 안에 SQL',
              '오히려 반대입니다.',
          ]
          for needle in forbidden:
              if needle in chapter:
                  raise SystemExit(f'Forbidden Chapter 01 residue: {needle}')
          required = [
              '## 9. AI가 도울 수 있는 일과 사람이 확인할 일',
              '## 10. 직접 판단해 보기',
              '## 12. 스스로 확인하기',
              '## 14. 다음 장에서는',
              '특정 업무 판단에서 공식 기준으로 삼는 데이터',
              '[Chapter 01 독자 워크북](chapter01_activity.md)',
              '지금은 `JOIN` 문법을 외울 필요가 없습니다.',
              '`GENERATED BY DEFAULT AS IDENTITY`의 자세한 문법은 Chapter 04에서 다룹니다.',
          ]
          for needle in required:
              if needle not in chapter:
                  raise SystemExit(f'Required Chapter 01 text missing: {needle}')

          merged = Path('publish/full_manuscript.md').read_text(encoding='utf-8')
          if '## 14. 다음 장에서는' not in merged:
              raise SystemExit('Merged manuscript missing updated Chapter 01')
          if '](../book/chapter01/chapter01_activity.md)' not in merged:
              raise SystemExit('Merged manuscript did not normalize Chapter 01 workbook link')

          # Remove this one-time workflow from final repository state.
          Path('.github/workflows/ch01-final-publication-review-once.yml').unlink()
          PY
