name: Apply Chapter 01 final publication review once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ch01-final-publication-review-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Chapter 01 publication refinements
        run: python scripts/ch01_final_publication_review_once.py
      - name: Commit Chapter 01 publication refinements
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add book/chapter01/chapter01.md \
                  book/chapter01/chapter01_activity.md \
                  book/chapter01/chapter01_outline.md \
                  book/chapter01/chapter01_review_revision.md \
                  notes/chapter01_review_checklist.md \
                  images/chapter01/README.md \
                  publish/full_manuscript.md \
                  .github/workflows/ch01-final-publication-review-once.yml \
                  scripts/ch01_final_publication_review_once.py
          git commit -m 'Refine Chapter 01 final publication content'
          git push
