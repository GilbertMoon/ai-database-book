name: Apply Chapter 01 final publication review once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ch01-final-publication-review-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Chapter 01 publication refinements
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          def regex_once(text: str, pattern: str, repl: str, label: str) -> str:
              new_text, count = re.subn(pattern, repl, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 regex match, found {count}")
              return new_text

          # ----------------------------------------------------------
          # Main manuscript
          # ----------------------------------------------------------
          p = Path('book/chapter01/chapter01.md')
          text = p.read_text(encoding='utf-8')

          text = replace_once(
              text,
              'ChatGPT와 Codex 같은 AI 도구는 테이블 구조와 SQL 초안을 빠르게 만들어 줍니다. 그렇다면 데이터베이스를 직접 배울 필요가 줄어든 것일까요?\n\n오히려 반대입니다. AI가 만드는 결과가 많아질수록 사람은 데이터의 의미와 관계를 이해하고, 생성된 구조와 숫자가 실제 요구사항에 맞는지 판단해야 합니다. SQL이 오류 없이 실행된다는 사실만으로 결과가 올바르다고 볼 수 없으며, 테이블이 만들어졌다는 사실만으로 오래 사용할 수 있는 구조라고 판단할 수도 없습니다.',
              'ChatGPT와 Codex 같은 AI 도구는 요구사항을 정리하고 테이블 구조와 SQL 초안을 만드는 작업을 지원할 수 있습니다. 그렇다면 데이터베이스를 직접 배울 필요가 줄어든 것일까요?\n\n데이터베이스 지식의 필요성이 사라진 것은 아닙니다. AI가 만드는 설계와 SQL 초안이 많아질수록 사람은 데이터의 의미와 관계를 이해하고, 생성된 구조와 숫자가 실제 요구사항에 맞는지 판단해야 합니다. SQL이 오류 없이 실행된다는 사실만으로 결과가 올바르다고 볼 수 없으며, 테이블이 만들어졌다는 사실만으로 오래 사용할 수 있는 구조라고 판단할 수도 없습니다.',
              'intro AI wording',
          )
          text = replace_once(
              text,
              '- AI가 잘하는 일과 사람이 확인해야 할 일',
              '- AI가 도울 수 있는 일과 사람이 확인해야 할 일',
              'intro bullet AI role',
          )
          text = replace_once(
              text,
              '- 기본키와 외래키: 행을 구분하고 테이블 사이의 관계를 연결하는 값',
              '- 기본키와 외래키: 행을 구분하고 참조 관계를 표현하는 키',
              'preview key wording',
          )
          text = replace_once(
              text,
              'AI에게 다음과 같이 요청하면 몇 초 안에 SQL을 받을 수 있습니다.',
              'AI에게 다음과 같이 요청하면 SQL 초안을 빠르게 받을 수 있습니다.',
              'remove time-bound AI speed claim',
          )
          text = replace_once(
              text,
              'AI 기능도 실제 서비스가 되면 사용자, 요청, 상태와 결과를 지속적으로 관리해야 합니다. 데이터베이스는 이러한 정보를 구조적으로 저장하고 연결하는 기반입니다.',
              'AI 기능을 서비스에 통합하면 사용자, 요청, 상태와 결과 같은 정보를 지속적으로 관리해야 하는 경우가 많습니다. 데이터베이스는 이러한 정보를 구조적으로 저장하고 연결하는 기반이 될 수 있습니다.',
              'AI service DB claim',
          )

          join_sql = '''```sql
          SELECT COUNT(*) AS student_count
          FROM students AS s
          INNER JOIN questions AS q
              ON q.student_id = s.id;
          ```'''.replace('          ', '')
          join_note = join_sql + '''

지금은 `JOIN` 문법을 외울 필요가 없습니다. 이 예제에서는 SQL이 실행되는 것과 질문의 의미에 맞는 결과가 나오는 것이 별개의 문제라는 점만 확인합니다. `JOIN`은 Chapter 08에서 자세히 다룹니다.'''
          text = replace_once(text, join_sql, join_note, 'JOIN beginner scope note')

          create_sql = '''```sql
          CREATE TABLE enrollments (
              id INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
              student_name VARCHAR(50),
              course_title VARCHAR(100),
              instructor_name VARCHAR(50),
              recorded_amount INTEGER
          );
          ```'''.replace('          ', '')
          create_note = create_sql + '''

`GENERATED BY DEFAULT AS IDENTITY`의 자세한 문법은 Chapter 04에서 다룹니다. 지금은 `id`가 각 신청 행을 구분하는 값이라는 점만 보면 됩니다.'''
          text = replace_once(text, create_sql, create_note, 'IDENTITY beginner scope note')

          old_quality = '''| 문제 유형 | 구체적인 문제 | SQL 결과의 문제 | AI 또는 업무 결과의 문제 |
          | --- | --- | --- | --- |
          | 데이터 품질 | 주문이 중복 저장됨 | 금액이 실제보다 크게 계산됨 | 성과가 증가했다고 잘못 설명함 |
          | `JOIN` 로직 | `INNER JOIN`으로 고객이 누락됨 | 활동 고객만 전체 고객처럼 집계됨 | 고객 현황을 잘못 판단함 |
          | 필터 기준 | 취소 주문을 제외하지 않음 | 합계가 과대 계산됨 | 잘못된 예산과 목표를 세움 |
          | 데이터 최신성 | 오래된 상태값을 사용함 | 현재 현황과 다른 결과가 나옴 | 이전 상태를 현재처럼 설명함 |
          | 값의 해석 | 의미를 확인하지 않고 `NULL`을 0으로 바꿈 | 미입력과 실제 0이 구분되지 않음 | 결측 원인을 잘못 해석함 |'''.replace('          ', '')
          new_quality = '''| 문제 | 데이터·SQL 결과 | 업무·AI 영향 |
          | --- | --- | --- |
          | 중복 주문 | 금액이 실제보다 크게 집계됨 | 성과를 과대 해석할 수 있음 |
          | 잘못된 `JOIN` | 일부 고객이 누락되어 활동 고객만 남음 | 전체 고객 현황을 잘못 판단할 수 있음 |
          | 잘못된 필터 | 취소 주문이 포함되어 합계가 커짐 | 예산·목표가 잘못 설정될 수 있음 |
          | 오래된 상태값 | 현재 현황과 다른 결과가 나옴 | 이전 상태를 현재처럼 설명할 수 있음 |
          | `NULL` 해석 오류 | 미입력과 실제 0이 구분되지 않음 | 결측 원인을 잘못 해석할 수 있음 |'''.replace('          ', '')
          text = replace_once(text, old_quality, new_quality, 'PDF-friendly quality table')

          relation_block = '''```text
          학생 → 질문 → 답변 → 튜터
          회원 → 주문 → 주문 항목 → 상품
          환자 → 예약 → 진료 → 처방
          학생 → 수강신청 → 강의
          ```'''.replace('          ', '')
          relation_note = relation_block + '''

여기서 화살표는 데이터가 서로 관련되어 있다는 **개념적 연결**만 나타냅니다. 외래키 방향과 1:N 같은 관계의 정확한 표현은 Chapter 05에서 다룹니다.'''
          text = replace_once(text, relation_block, relation_note, 'relationship arrow clarification')
          text = replace_once(
              text,
              '데이터베이스 설계는 현실의 업무를 테이블로 옮기는 작업입니다. 동시에 업무 규칙을 구체적인 관계와 제약조건으로 표현하는 과정입니다.',
              '관계형 데이터베이스 설계는 현실의 업무 대상을 테이블과 관계로 표현하는 작업입니다. 동시에 업무 규칙을 구체적인 관계와 제약조건으로 표현하는 과정입니다.',
              'relational design wording',
          )

          old_storage_header = '| 비교 항목 | <img src="../../images/common/icon_file.svg" alt="파일 아이콘" width="20"> 단순 파일 중심 관리 | <img src="../../images/common/icon_spreadsheet.svg" alt="스프레드시트 아이콘" width="20"> 스프레드시트 중심 관리 | <img src="../../images/common/icon_database.svg" alt="데이터베이스 아이콘" width="20"> DBMS 중심 관리 |'
          new_storage_header = '| 비교 항목 | 단순 파일 중심 관리 | 스프레드시트 중심 관리 | DBMS 중심 관리 |'
          text = replace_once(text, old_storage_header, new_storage_header, 'remove HTML icons from table')
          text = replace_once(
              text,
              '| 정확성 | 프로그램·사용자가 직접 확인 | 데이터 검증과 수식으로 일부 관리 | 제약조건과 트랜잭션으로 일관성 관리 |',
              '| 정확성 | 프로그램·사용자가 직접 확인 | 데이터 검증과 수식으로 일부 관리 | 제약조건과 트랜잭션으로 일관성 관리 지원 |',
              'DBMS accuracy wording',
          )

          text = replace_once(
              text,
              '데이터를 관리할 때는 업무 판단의 기준이 되는 데이터와 이를 가공해 만든 결과를 구분해야 합니다.',
              '데이터를 관리할 때는 특정 업무 판단에서 공식 기준으로 삼는 데이터와 이를 가공해 만든 결과를 구분해야 합니다.',
              'source of truth intro',
          )
          old_source_table = '''| 구분 | 설명 | 예시 |
          | --- | --- | --- |
          | 기준 데이터<br>(Source of Truth) | 업무에서 직접 발생하고 판단의 기준이 되는 데이터 | 회원, 주문, 신청, 출석 원본 |
          | 파생 데이터<br>(Derived Data) | 정해진 계산식으로 기준 데이터를 가공한 결과 | 월별 집계, 대시보드 지표, 캐시 |
          | AI 생성 결과 | 모델과 입력 데이터·지시문을 사용해 만든 결과 | 요약, 분류, 추천, 생성 답변 |'''.replace('          ', '')
          new_source_table = '''| 구분 | 설명 | 예시 |
          | --- | --- | --- |
          | 기준 데이터 (Source of Truth) | 특정 업무 판단에서 공식 기준으로 삼는 데이터 | 회원, 주문, 신청, 출석 기록 |
          | 파생 데이터 (Derived Data) | 기준 데이터를 규칙이나 계산으로 가공한 결과 | 월별 집계, 대시보드 지표, 캐시 |
          | AI 생성 결과 | 모델·입력 데이터·지시에 따라 만들어진 결과 | 요약, 분류, 추천, 생성 답변 |'''.replace('          ', '')
          text = replace_once(text, old_source_table, new_source_table, 'source table and HTML br removal')
          text = replace_once(
              text,
              '파생 데이터는 같은 기준 데이터와 계산식이 있으면 다시 만들 수 있는 경우가 많습니다.',
              '여기서 Source of Truth는 단순히 **가장 먼저 만들어진 파일**을 뜻하지 않습니다. 어떤 데이터를 공식 기준으로 삼을지는 업무 범위와 책임에 따라 정해야 합니다.\n\n파생 데이터는 같은 기준 데이터와 계산식이 있으면 다시 만들 수 있는 경우가 많습니다.',
              'source of truth caveat',
          )

          text = replace_once(text, '## 9. AI가 잘하는 일과 사람이 확인할 일', '## 9. AI가 도울 수 있는 일과 사람이 확인할 일', 'section 9 title')
          text = replace_once(text, '| 작업 | AI가 잘하는 일 | 사람이 확인할 일 |', '| 작업 | AI가 지원할 수 있는 일 | 사람이 확인할 일 |', 'AI role table header')
          text = replace_once(
              text,
              'AI가 만든 결과를 검토할 때는 다음 흐름을 사용합니다.',
              '실제 SQL을 실행하는 장에서는 다음 흐름으로 AI 결과를 검토합니다. Chapter 01에서는 작은 예제의 예상 결과를 손으로 먼저 확인하고, 실제 PostgreSQL 실행은 Chapter 04부터 적용합니다.',
              'AI validation execution scope',
          )
          text = replace_once(
              text,
              'AI는 빠른 초안을 만드는 데 강합니다. 데이터의 의미와 결과를 최종적으로 판단하는 일은 사람의 책임입니다.',
              'AI는 초안을 정리하고 만드는 작업을 지원할 수 있습니다. 데이터의 의미와 결과를 최종적으로 판단하는 일은 사람의 책임입니다.',
              'AI strength wording',
          )

          # Overview already contains the book-wide learning method. Remove duplicate section 10.
          text = regex_once(
              text,
              r'\n---\n\n## 10\. 이 책을 학습하는 방법\n.*?\n---\n\n## 11\. 직접 판단해 보기',
              '\n---\n\n## 10. 직접 판단해 보기',
              'remove overview-duplicate learning section',
          )
          text = replace_once(text, '## 12. 자주 하는 오해', '## 11. 자주 하는 오해', 'renumber section 11')
          text = replace_once(text, '## 13. 스스로 확인하기', '## 12. 스스로 확인하기', 'renumber section 12')
          text = replace_once(text, '### 13.1 개념 확인', '### 12.1 개념 확인', 'renumber 12.1')
          text = replace_once(text, '### 13.2 AI 결과 검토', '### 12.2 AI 결과 검토', 'renumber 12.2')
          text = replace_once(text, '### 13.3 한 문장으로 정리하기', '### 12.3 한 문장으로 정리하기', 'renumber 12.3')
          text = replace_once(text, '13.2의 AI 답변은', '12.2의 AI 답변은', 'renumber answer reference 12.2')
          text = replace_once(text, '13.3은 다음처럼 정리할 수 있습니다.', '12.3은 다음처럼 정리할 수 있습니다.', 'renumber answer reference 12.3')
          text = replace_once(text, '## 14. 핵심 정리', '## 13. 핵심 정리', 'renumber section 13')
          text = replace_once(text, '## 15. 다음 장에서는', '## 14. 다음 장에서는', 'renumber section 14')

          text = replace_once(
              text,
              '더 다양한 사례는 `book/chapter01/chapter01_activity.md`의 독자 워크북에서 다룹니다.',
              '더 다양한 사례는 [Chapter 01 독자 워크북](chapter01_activity.md)에서 다룹니다.',
              'reader-facing workbook link',
          )
          text = replace_once(
              text,
              'SQL도 필터링, `JOIN`, 집계와 데이터 품질 확인에 강력합니다. Python은 SQL로 준비한 분석 데이터를 추가로 가공하고 시각화할 때 선택적으로 사용할 수 있습니다.',
              'SQL도 필터링, `JOIN`, 집계와 데이터 품질 확인에 강력합니다. Python은 SQL로 준비한 분석 데이터를 추가로 가공하고 시각화할 때 사용할 수 있습니다.',
              'Python extension wording',
          )
          text = replace_once(
              text,
              '4. 기준 데이터는 업무 판단의 근거이고, 파생 데이터는 기준 데이터를 계산해 만든 결과입니다. AI 결과는 모델, 입력 데이터와 지시에 따라 달라질 수 있습니다.',
              '4. 기준 데이터는 특정 업무 판단에서 공식 기준으로 삼는 데이터이고, 파생 데이터는 기준 데이터를 계산해 만든 결과입니다. AI 결과는 모델, 입력 데이터와 지시에 따라 달라질 수 있습니다.',
              'recommended answer source definition',
          )
          text = replace_once(
              text,
              '7. 이 책에서는 AI가 만든 초안을 직접 실행하고 기준 데이터와 비교해 검증합니다.',
              '7. 후속 실습에서는 AI가 만든 초안을 직접 실행하고 기준 데이터와 비교해 검증합니다.',
              'summary execution scope',
          )
          text = replace_once(
