name: Validate Chapter 13

on:
  push:
    branches: [main]
    paths:
      - book/chapter13/**
      - code/chapter13/**
      - images/chapter13/**
      - presentation/chapter13/**
      - presentation/common/tts_pronunciation.js
      - presentation/common/script_content_enhancer.js
      - notes/chapter13_review_checklist.md
      - .github/workflows/validate-chapter13.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Chapter 13 JavaScript syntax
        run: |
          node --check presentation/chapter13/chapter13_slides.js
          node --check presentation/chapter13/chapter13_navigation.js
          node --check presentation/chapter13/chapter13_player.js
          node --check presentation/chapter13/chapter13_script.js
          node --check presentation/common/tts_pronunciation.js
          node --check presentation/common/script_content_enhancer.js

      - name: Check Chapter 13 source alignment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          chapter = Path('book/chapter13/chapter13.md').read_text(encoding='utf-8')
          outline = Path('book/chapter13/chapter13_outline.md').read_text(encoding='utf-8')
          activity = Path('book/chapter13/chapter13_activity.md').read_text(encoding='utf-8')
          theory = Path('presentation/chapter13/chapter13_theory_lecture_plan.md').read_text(encoding='utf-8')
          practice = Path('presentation/chapter13/chapter13_practice_lecture_plan.md').read_text(encoding='utf-8')
          nav = Path('presentation/chapter13/chapter13_navigation.js').read_text(encoding='utf-8')
          slides_js = Path('presentation/chapter13/chapter13_slides.js').read_text(encoding='utf-8')
          player_js = Path('presentation/chapter13/chapter13_player.js').read_text(encoding='utf-8')
          script_js = Path('presentation/chapter13/chapter13_script.js').read_text(encoding='utf-8')
          script_html = Path('presentation/chapter13/chapter13_script.html').read_text(encoding='utf-8')
          theory_html = Path('presentation/chapter13/chapter13_theory_presentation.html').read_text(encoding='utf-8')
          practice_html = Path('presentation/chapter13/chapter13_practice_presentation.html').read_text(encoding='utf-8')
          code_readme = Path('code/chapter13/README.md').read_text(encoding='utf-8')
          prompt_templates = Path('code/chapter13/PROMPT_TEMPLATES.md').read_text(encoding='utf-8')
          report_template = Path('code/chapter13/AI_REVIEW_REPORT_TEMPLATE.md').read_text(encoding='utf-8')
          image_readme = Path('images/chapter13/README.md').read_text(encoding='utf-8')

          numbered = [int(x) for x in re.findall(r'^##\s+(\d+)\.\s+', chapter, re.M)]
          if numbered != list(range(1, 29)):
              raise SystemExit(f'Chapter 13 body numbering mismatch: {numbered}')

          def parse_plan(label, text):
              sections = list(re.finditer(r'^##\s+(\d+)\.\s+(.+)$', text, re.M))
              nums = [int(m.group(1)) for m in sections]
              if nums != list(range(1, 21)):
                  raise SystemExit(f'{label} numbering mismatch: {nums}')
              titles = []
              for i, match in enumerate(sections):
                  end = sections[i + 1].start() if i + 1 < len(sections) else len(text)
                  block = text[match.end():end]
                  if '**화면 구성**' not in block or '**발표 스크립트**' not in block:
                      raise SystemExit(f'{label} section {match.group(1)} missing screen/script')
                  titles.append(match.group(2).strip())
              return titles

          theory_titles = parse_plan('theory', theory)
          practice_titles = parse_plan('practice', practice)
          for title in theory_titles + practice_titles:
              if title not in nav:
                  raise SystemExit(f'navigation missing title: {title}')

          published = {
              'chapter': chapter,
              'outline': outline,
              'activity': activity,
              'theory': theory,
              'practice': practice,
              'code README': code_readme,
              'prompt templates': prompt_templates,
              'report template': report_template,
              'image README': image_readme,
          }
          for name, text in published.items():
              if 'agreed_amount' in text:
                  raise SystemExit(f'{name} contains stale agreed_amount')

          for name, text in [('chapter', chapter), ('outline', outline), ('activity', activity), ('practice', practice), ('code README', code_readme)]:
              if 'recorded_amount' not in text:
                  raise SystemExit(f'{name} missing recorded_amount')
          for token in ['NUMERIC(12,0)', '590000', '340000', '440000']:
              if token not in chapter and token not in code_readme:
                  raise SystemExit(f'Chapter 13 sources missing upstream canonical token {token}')
          for token in ['470000', '30/30', 'P13-T01', 'P13-T30']:
              if token not in chapter and token not in code_readme:
                  raise SystemExit(f'Chapter 13 sources missing lab evidence token {token}')
          for text_name, text in [('chapter', chapter), ('outline', outline), ('practice', practice), ('code README', code_readme)]:
              if 'ai_review_lab' not in text or 'course_project' not in text:
                  raise SystemExit(f'{text_name} missing isolated-scenario context')

          sql_root = Path('code/chapter13')
          required_sql = [
              '01_ai_review_lab_schema.sql', '02_bad_design_seed.sql',
              '03_good_design_schema.sql', '04_good_design_seed.sql',
              '05_metadata_validation.sql', '06_business_validation.sql',
              '07_negative_tests.sql', '08_ai_review_lab_validation.sql',
              'reset_ai_review_lab.sql', 'ai_db_design_review_practice.sql'
          ]
          sql = {}
          for filename in required_sql:
              path = sql_root / filename
              if not path.exists():
                  raise SystemExit(f'missing {path}')
              sql[filename] = path.read_text(encoding='utf-8')

          for token in ['recorded_amount', 'NUMERIC(12,0)', '590000', '340000', '440000', 'uq_course_enrollments_active']:
              if token not in sql['01_ai_review_lab_schema.sql']:
                  raise SystemExit(f'01 missing prerequisite token {token}')
          for token in ['recorded_amount NUMERIC(12,0)', 'payments', '29', 'uq_ai_review_enrollments_active']:
              if token not in sql['03_good_design_schema.sql']:
                  raise SystemExit(f'03 missing schema token {token}')
          for token in ['470000', 'recorded_amount', 'PAY-REVIEW-TEST-%']:
              if token not in sql['04_good_design_seed.sql']:
                  raise SystemExit(f'04 missing seed token {token}')
          for token in ['good_constraint_count <> 29', 'fk_signature_count <> 4', 'identity_count <> 6', 'money_type_count <> 3']:
              if token not in sql['05_metadata_validation.sql']:
                  raise SystemExit(f'05 missing metadata token {token}')
          for token in ['recorded_amount', 'price_difference_count <> 1', 'IS DISTINCT FROM', 'Chapter 13 business validation passed']:
              if token not in sql['06_business_validation.sql']:
                  raise SystemExit(f'06 missing business token {token}')
          for token in ['P13-T01~P13-T24', 'P13-T25~P13-T30', 'delete_referenced_instructor_restricted', 'delete_referenced_enrollment_restricted', 'case_variant_student_email_allowed', 'expected_failure_count <> 24', 'expected_success_count <> 6', '30/30']:
              if token not in sql['07_negative_tests.sql']:
                  raise SystemExit(f'07 missing test token {token}')
          for token in ['pg_temp.negative_test_results', 'temp_total <> 30', 'temp_failure_count <> 24', 'temp_success_count <> 6', '470000', '590000', 'Chapter 13 AI review lab validation passed: tests 30/30']:
              if token not in sql['08_ai_review_lab_validation.sql']:
                  raise SystemExit(f'08 missing final-gate token {token}')

          # agreed_amount is allowed only as a negative old-column presence check in 05/08.
          for filename, text in sql.items():
              if 'agreed_amount' not in text:
                  continue
              if filename not in {'05_metadata_validation.sql', '08_ai_review_lab_validation.sql'}:
                  raise SystemExit(f'{filename} contains stale agreed_amount')
              scrubbed = text.replace("column_name = 'agreed_amount'", '')
              if 'agreed_amount' in scrubbed:
                  raise SystemExit(f'{filename} uses agreed_amount outside negative schema check')

          reset_clean = re.sub(r'--.*$', '', sql['reset_ai_review_lab.sql'], flags=re.M).upper()
          if 'CASCADE' in reset_clean:
              raise SystemExit('reset_ai_review_lab.sql must not use CASCADE')
          if 'BEGIN;' not in sql['reset_ai_review_lab.sql'] or 'COMMIT;' not in sql['reset_ai_review_lab.sql']:
              raise SystemExit('reset_ai_review_lab.sql must be explicitly transactional')

          protected = re.compile(r'\b(?:INSERT\s+INTO|UPDATE|DELETE\s+FROM|ALTER\s+TABLE|DROP\s+TABLE|TRUNCATE(?:\s+TABLE)?)\s+(?:course_project|transaction_lab|performance_lab|security_lab|nosql_lab)\.', re.I)
          for filename, text in sql.items():
              clean = re.sub(r'/\*.*?\*/', '', text, flags=re.S)
              clean = re.sub(r'--.*$', '', clean, flags=re.M)
              if filename == '01_ai_review_lab_schema.sql':
                  # 01 only reads protected schemas.
                  pass
              if protected.search(clean):
                  raise SystemExit(f'Chapter 13 SQL modifies protected schema: {filename}')

          if "fetch(source, { cache: 'no-store' })" not in slides_js:
              raise SystemExit('Chapter 13 slide source must bypass stale Markdown cache')
          if 'window.PresentationTTS?.normalize' not in script_js:
              raise SystemExit('Chapter 13 script must use shared TTS normalization')
          if '../common/tts_pronunciation.js' not in script_html or '../common/script_content_enhancer.js' not in script_html:
              raise SystemExit('Chapter 13 script HTML missing shared presentation helpers')

          player_version = re.search(r"const ASSET_VERSION = '([^']+)';", player_js)
          script_version = re.search(r"const ASSET_VERSION = '([^']+)';", script_js)
          if not player_version or not script_version or player_version.group(1) != script_version.group(1):
              raise SystemExit('Chapter 13 player/script asset versions do not match')
          version = player_version.group(1)
          if version != '20260809a':
              raise SystemExit(f'Chapter 13 asset version must be 20260809a, got {version}')
          for name, text in [('theory HTML', theory_html), ('practice HTML', practice_html), ('script HTML', script_html)]:
              if version not in text:
                  raise SystemExit(f'{name} missing asset version {version}')

          mmds = sorted(Path('images/chapter13').glob('*.mmd'))
          svgs = sorted(Path('images/chapter13').glob('*.svg'))
          if len(mmds) != 8 or len(svgs) != 8 or {p.stem for p in mmds} != {p.stem for p in svgs}:
              raise SystemExit(f'expected 8 matching Mermaid/SVG pairs, got {len(mmds)}/{len(svgs)}')
          for path in svgs:
              root = ET.fromstring(path.read_text(encoding='utf-8'))
              if root.attrib.get('role') != 'img' or root.attrib.get('width') != '100%' or not root.attrib.get('viewBox'):
                  raise SystemExit(f'{path} missing responsive/accessibility attributes')
              tags = {elem.tag.split('}')[-1] for elem in root.iter()}
              if 'title' not in tags or 'desc' not in tags:
                  raise SystemExit(f'{path} missing title/desc')
              if path.name not in chapter:
                  raise SystemExit(f'{path.name} is not referenced by Chapter 13 body')

          print(f'Chapter 13 static alignment passed: body={len(numbered)}, theory=20, practice=20, assets={len(svgs)}, version={version}')
          PY

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql --version

      - name: Create Chapter 13 test database
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE ai_database_book;"
          test "$(psql -d postgres -Atc "SELECT current_setting('server_version_num')::int / 10000")" = "16"

      - name: Verify wrong database guard
        shell: bash
        run: |
          set +e
          psql -v ON_ERROR_STOP=1 -d postgres -f code/chapter13/01_ai_review_lab_schema.sql > /tmp/ch13_wrong_db.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "ai_database_book" /tmp/ch13_wrong_db.log
          test "$(psql -d postgres -Atc "SELECT to_regnamespace('ai_review_lab') IS NULL")" = "t"

      - name: Build Chapter 07 and verify Chapter 08 baseline
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter07/01_course_project_schema.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter07/02_course_project_seed.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter07/03_course_project_changes.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter07/04_course_project_validation.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter08/00_check_course_project.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter08/03_join_aggregation_validation.sql

      - name: Build Chapter 12 handoff state
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter12/01_nosql_lab_schema.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter12/02_nosql_lab_seed.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter12/03_document_jsonb_queries.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter12/04_key_value_cache_queries.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter12/05_storage_choice_review.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter12/06_jsonb_index_candidates.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter12/07_nosql_lab_validation.sql

      - name: Create protected-schema sentinels and capture fingerprints
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book <<'SQL'
          CREATE SCHEMA transaction_lab;
          CREATE SCHEMA performance_lab;
          CREATE SCHEMA security_lab;
          CREATE TABLE transaction_lab.chapter13_guard(id INTEGER PRIMARY KEY, note TEXT NOT NULL);
          CREATE TABLE performance_lab.chapter13_guard(id INTEGER PRIMARY KEY, note TEXT NOT NULL);
          CREATE TABLE security_lab.chapter13_guard(id INTEGER PRIMARY KEY, note TEXT NOT NULL);
          CREATE TABLE nosql_lab.chapter13_guard(id INTEGER PRIMARY KEY, note TEXT NOT NULL);
          INSERT INTO transaction_lab.chapter13_guard VALUES (1, 'transaction-protected');
          INSERT INTO performance_lab.chapter13_guard VALUES (1, 'performance-protected');
          INSERT INTO security_lab.chapter13_guard VALUES (1, 'security-protected');
          INSERT INTO nosql_lab.chapter13_guard VALUES (1, 'nosql-protected');
          SQL
          psql -d ai_database_book -Atc "SELECT md5((SELECT jsonb_agg(to_jsonb(s) ORDER BY id)::text FROM course_project.students s)||(SELECT jsonb_agg(to_jsonb(i) ORDER BY id)::text FROM course_project.instructors i)||(SELECT jsonb_agg(to_jsonb(c) ORDER BY id)::text FROM course_project.courses c)||(SELECT jsonb_agg(to_jsonb(e) ORDER BY id)::text FROM course_project.enrollments e));" > /tmp/ch13_course_fp.txt
          psql -d ai_database_book -Atc "SELECT md5((SELECT jsonb_agg(to_jsonb(d) ORDER BY id)::text FROM nosql_lab.course_documents d)||(SELECT jsonb_agg(to_jsonb(k) ORDER BY cache_key)::text FROM nosql_lab.key_value_cache_examples k)||(SELECT jsonb_agg(to_jsonb(s) ORDER BY id)::text FROM nosql_lab.storage_choice_cases s));" > /tmp/ch13_nosql_fp.txt

      - name: Verify Chapter 13 prerequisite drift detection
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book -c "UPDATE course_project.enrollments SET recorded_amount = 120001 WHERE id = 1005;"
          set +e
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter13/01_ai_review_lab_schema.sql > /tmp/ch13_prereq_drift.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -Eq "기록 금액|기준|recorded_amount" /tmp/ch13_prereq_drift.log
          test "$(psql -d ai_database_book -Atc "SELECT to_regnamespace('ai_review_lab') IS NULL")" = "t"
          psql -v ON_ERROR_STOP=1 -d ai_database_book -c "UPDATE course_project.enrollments SET recorded_amount = 120000 WHERE id = 1005;"
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter08/00_check_course_project.sql

      - name: Run Chapter 13 canonical path
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter13/01_ai_review_lab_schema.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter13/02_bad_design_seed.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter13/03_good_design_schema.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter13/04_good_design_seed.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book \
            -f code/chapter13/05_metadata_validation.sql \
            -f code/chapter13/06_business_validation.sql \
            -f code/chapter13/07_negative_tests.sql \
            -f code/chapter13/08_ai_review_lab_validation.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter13/ai_db_design_review_practice.sql

      - name: Verify Chapter 13 exact final state
        shell: bash
        run: |
          state="$(psql -d ai_database_book -Atc "SELECT (SELECT COUNT(*) FROM ai_review_lab.bad_enrollments)||':'||(SELECT COUNT(*) FROM ai_review_lab.students)||':'||(SELECT COUNT(*) FROM ai_review_lab.instructors)||':'||(SELECT COUNT(*) FROM ai_review_lab.courses)||':'||(SELECT COUNT(*) FROM ai_review_lab.enrollments)||':'||(SELECT COUNT(*) FROM ai_review_lab.payments)||':'||(SELECT SUM(recorded_amount) FROM ai_review_lab.enrollments)||':'||(SELECT SUM(amount) FROM ai_review_lab.payments)||':'||(SELECT COUNT(*) FROM ai_review_lab.enrollments WHERE status='완료')||':'||(SELECT COUNT(*) FROM ai_review_lab.enrollments WHERE status='신청')||':'||(SELECT COUNT(*) FROM ai_review_lab.enrollments WHERE status='취소')||':'||(SELECT COUNT(*) FROM ai_review_lab.enrollments WHERE status='수강중')||':'||(SELECT COUNT(*) FROM ai_review_lab.payments WHERE payment_status='결제완료')||':'||(SELECT COUNT(*) FROM ai_review_lab.payments WHERE payment_status='결제대기')||':'||(SELECT COUNT(*) FROM ai_review_lab.payments WHERE payment_status='환불')||':'||(SELECT COUNT(*) FROM ai_review_lab.payments WHERE payment_status='결제실패');")"
          echo "$state"
          test "$state" = "3:3:2:3:4:4:470000:470000:2:1:1:0:2:1:1:0"

      - name: Verify business-state drift detection
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book -c "UPDATE ai_review_lab.payments SET payment_status='결제대기', paid_at=NULL, refunded_at=NULL WHERE id=9001;"
          set +e
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter13/06_business_validation.sql > /tmp/ch13_business_drift.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -Eq "상태|업무 검증 실패" /tmp/ch13_business_drift.log
          psql -v ON_ERROR_STOP=1 -d ai_database_book -c "UPDATE ai_review_lab.payments SET payment_status='결제완료', paid_at='2026-07-01 10:00:00+09', refunded_at=NULL WHERE id=9001;"
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter13/06_business_validation.sql

      - name: Verify protected schemas remain unchanged
        shell: bash
        run: |
          test "$(cat /tmp/ch13_course_fp.txt)" = "$(psql -d ai_database_book -Atc "SELECT md5((SELECT jsonb_agg(to_jsonb(s) ORDER BY id)::text FROM course_project.students s)||(SELECT jsonb_agg(to_jsonb(i) ORDER BY id)::text FROM course_project.instructors i)||(SELECT jsonb_agg(to_jsonb(c) ORDER BY id)::text FROM course_project.courses c)||(SELECT jsonb_agg(to_jsonb(e) ORDER BY id)::text FROM course_project.enrollments e));")"
          test "$(cat /tmp/ch13_nosql_fp.txt)" = "$(psql -d ai_database_book -Atc "SELECT md5((SELECT jsonb_agg(to_jsonb(d) ORDER BY id)::text FROM nosql_lab.course_documents d)||(SELECT jsonb_agg(to_jsonb(k) ORDER BY cache_key)::text FROM nosql_lab.key_value_cache_examples k)||(SELECT jsonb_agg(to_jsonb(s) ORDER BY id)::text FROM nosql_lab.storage_choice_cases s));")"
          test "$(psql -d ai_database_book -Atc "SELECT note FROM transaction_lab.chapter13_guard WHERE id=1")" = "transaction-protected"
          test "$(psql -d ai_database_book -Atc "SELECT note FROM performance_lab.chapter13_guard WHERE id=1")" = "performance-protected"
          test "$(psql -d ai_database_book -Atc "SELECT note FROM security_lab.chapter13_guard WHERE id=1")" = "security-protected"
          test "$(psql -d ai_database_book -Atc "SELECT note FROM nosql_lab.chapter13_guard WHERE id=1")" = "nosql-protected"

      - name: Verify reset atomicity and isolation
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book -c "CREATE TABLE ai_review_lab.keep_me(id INTEGER PRIMARY KEY);"
          set +e
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter13/reset_ai_review_lab.sql > /tmp/ch13_reset_guard.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          test "$(psql -d ai_database_book -Atc "SELECT to_regclass('ai_review_lab.keep_me') IS NOT NULL")" = "t"
          test "$(psql -d ai_database_book -Atc "SELECT to_regclass('ai_review_lab.bad_enrollments') IS NOT NULL")" = "t"
          test "$(psql -d ai_database_book -Atc "SELECT to_regclass('ai_review_lab.students') IS NOT NULL")" = "t"
          test "$(psql -d ai_database_book -Atc "SELECT to_regclass('ai_review_lab.payments') IS NOT NULL")" = "t"
          psql -v ON_ERROR_STOP=1 -d ai_database_book -c "DROP TABLE ai_review_lab.keep_me;"
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter13/reset_ai_review_lab.sql
          test "$(psql -d ai_database_book -Atc "SELECT to_regnamespace('ai_review_lab') IS NULL")" = "t"
          test "$(cat /tmp/ch13_course_fp.txt)" = "$(psql -d ai_database_book -Atc "SELECT md5((SELECT jsonb_agg(to_jsonb(s) ORDER BY id)::text FROM course_project.students s)||(SELECT jsonb_agg(to_jsonb(i) ORDER BY id)::text FROM course_project.instructors i)||(SELECT jsonb_agg(to_jsonb(c) ORDER BY id)::text FROM course_project.courses c)||(SELECT jsonb_agg(to_jsonb(e) ORDER BY id)::text FROM course_project.enrollments e));")"
          test "$(cat /tmp/ch13_nosql_fp.txt)" = "$(psql -d ai_database_book -Atc "SELECT md5((SELECT jsonb_agg(to_jsonb(d) ORDER BY id)::text FROM nosql_lab.course_documents d)||(SELECT jsonb_agg(to_jsonb(k) ORDER BY cache_key)::text FROM nosql_lab.key_value_cache_examples k)||(SELECT jsonb_agg(to_jsonb(s) ORDER BY id)::text FROM nosql_lab.storage_choice_cases s));")"
          test "$(psql -d ai_database_book -Atc "SELECT note FROM transaction_lab.chapter13_guard WHERE id=1")" = "transaction-protected"
          test "$(psql -d ai_database_book -Atc "SELECT note FROM performance_lab.chapter13_guard WHERE id=1")" = "performance-protected"
          test "$(psql -d ai_database_book -Atc "SELECT note FROM security_lab.chapter13_guard WHERE id=1")" = "security-protected"
          test "$(psql -d ai_database_book -Atc "SELECT note FROM nosql_lab.chapter13_guard WHERE id=1")" = "nosql-protected"
