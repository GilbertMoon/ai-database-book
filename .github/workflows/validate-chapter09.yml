name: Validate Chapter 09

on:
  push:
    paths:
      - 'book/chapter09/**'
      - 'code/chapter09/**'
      - 'images/chapter09/**'
      - 'presentation/chapter09/**'
      - 'notes/chapter09_review_checklist.md'
      - '.github/workflows/validate-chapter09.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Chapter 09 JavaScript syntax
        run: |
          node --check presentation/chapter09/chapter09_slides.js
          node --check presentation/chapter09/chapter09_navigation.js
          node --check presentation/chapter09/chapter09_player.js
          node --check presentation/chapter09/chapter09_script.js

      - name: Check Chapter 09 source alignment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          chapter = Path('book/chapter09/chapter09.md').read_text(encoding='utf-8')
          outline = Path('book/chapter09/chapter09_outline.md').read_text(encoding='utf-8')
          activity = Path('book/chapter09/chapter09_activity.md').read_text(encoding='utf-8')
          theory = Path('presentation/chapter09/chapter09_theory_lecture_plan.md').read_text(encoding='utf-8')
          practice = Path('presentation/chapter09/chapter09_practice_lecture_plan.md').read_text(encoding='utf-8')
          slides_js = Path('presentation/chapter09/chapter09_slides.js').read_text(encoding='utf-8')
          nav_js = Path('presentation/chapter09/chapter09_navigation.js').read_text(encoding='utf-8')
          player_js = Path('presentation/chapter09/chapter09_player.js').read_text(encoding='utf-8')
          script_js = Path('presentation/chapter09/chapter09_script.js').read_text(encoding='utf-8')
          script_html = Path('presentation/chapter09/chapter09_script.html').read_text(encoding='utf-8')
          theory_html = Path('presentation/chapter09/chapter09_theory_presentation.html').read_text(encoding='utf-8')
          practice_html = Path('presentation/chapter09/chapter09_practice_presentation.html').read_text(encoding='utf-8')
          index_html = Path('presentation/chapter09/index.html').read_text(encoding='utf-8')
          code_readme = Path('code/chapter09/README.md').read_text(encoding='utf-8')
          image_readme = Path('images/chapter09/README.md').read_text(encoding='utf-8')

          numbered = re.findall(r'^##\s+(\d+)\.\s+', chapter, re.M)
          if numbered != [str(i) for i in range(1, 24)]:
              raise SystemExit(f'Chapter 09 body sections mismatch: {numbered}')

          for name, text in [('chapter', chapter), ('outline', outline), ('activity', activity), ('theory', theory), ('practice', practice)]:
              for token in ['recorded_amount', 'BEGIN', 'COMMIT', 'ROLLBACK']:
                  if token not in text:
                      raise SystemExit(f'{name} missing {token}')

          stale_term = 'paid' + '_amount'
          roots = [Path('book/chapter09'), Path('code/chapter09'), Path('presentation/chapter09'), Path('images/chapter09')]
          stale = []
          for root in roots:
              for path in root.rglob('*'):
                  if path.is_file() and path.suffix.lower() in {'.md', '.sql', '.js', '.html', '.mmd', '.svg'}:
                      if stale_term in path.read_text(encoding='utf-8', errors='ignore'):
                          stale.append(str(path))
          if stale:
              raise SystemExit('stale Chapter 09 amount term remains: ' + ', '.join(stale))

          if '.replace(/recorded_amount/g' in slides_js:
              raise SystemExit('chapter09_slides.js must not rewrite the canonical amount column at runtime')
          if 'recorded_amount|recorded_amount' in nav_js:
              raise SystemExit('chapter09_navigation.js contains duplicate amount normalization')

          def check_plan(label, text, expected):
              sections = list(re.finditer(r'^##\s+(\d+)\.\s+(.+)$', text, re.M))
              nums = [int(match.group(1)) for match in sections]
              if nums != list(range(1, expected + 1)):
                  raise SystemExit(f'{label} section numbers mismatch: {nums}')
              for index, match in enumerate(sections):
                  end = sections[index + 1].start() if index + 1 < len(sections) else len(text)
                  block = text[match.end():end]
                  if '**화면 구성**' not in block or '**발표 스크립트**' not in block:
                      raise SystemExit(f'{label} section {match.group(1)} missing screen/script')

          check_plan('theory', theory, 20)
          check_plan('practice', practice, 20)
          if index_html.count('20장') < 2:
              raise SystemExit('Chapter 09 index must advertise 20 theory and 20 practice slides')

          version = '20260809a'
          for name, text in [
              ('player js', player_js), ('script js', script_js), ('script html', script_html),
              ('theory html', theory_html), ('practice html', practice_html), ('index html', index_html),
          ]:
              if version not in text:
                  raise SystemExit(f'{name} missing asset version {version}')
          if f"const ASSET_VERSION = '{version}';" not in player_js:
              raise SystemExit('player.js missing Chapter 09 ASSET_VERSION')
          if f"const ASSET_VERSION = '{version}';" not in script_js:
              raise SystemExit('script.js missing Chapter 09 ASSET_VERSION')
          if '?v=${ASSET_VERSION}#' not in script_js:
              raise SystemExit('script.js does not propagate asset version to presentation windows')
          if '?block=${block}&v=${ASSET_VERSION}#' not in player_js:
              raise SystemExit('player.js does not propagate asset version to script window')

          if '../common/tts_pronunciation.js' not in script_html:
              raise SystemExit('shared TTS normalization is not loaded')
          if '../common/script_content_enhancer.js' not in script_html:
              raise SystemExit('shared script content enhancer is not loaded')
          if 'PresentationTTS?.normalize' not in script_js:
              raise SystemExit('Chapter 09 presenter does not use shared TTS normalization')

          required_sql = [
              '01_transaction_lab_schema.sql',
              '02_transaction_lab_seed.sql',
              '03_commit_transaction.sql',
              '04_rollback_transaction.sql',
              '05_commit_and_sold_out.sql',
              '06_transaction_validation.sql',
              '07_concurrency_two_sessions.sql',
              '08_cancel_and_restore.sql',
              '09_error_and_savepoint.sql',
              'reset_transaction_lab.sql',
              'transaction_consistency_practice.sql',
          ]
          for name in required_sql:
              if not (Path('code/chapter09') / name).exists():
                  raise SystemExit(f'missing code/chapter09/{name}')

          sql = {name: (Path('code/chapter09') / name).read_text(encoding='utf-8') for name in required_sql}

          for token in [
              "current_database() <> 'ai_database_book'",
              "numeric_precision = 12",
              "numeric_scale = 0",
              "v_requested_count <> 2",
              "v_learning_count <> 1",
              "v_completed_count <> 1",
              "v_cancelled_count <> 1",
              "v_total_amount <> 590000",
              "v_active_amount <> 340000",
              "v_non_cancelled_amount <> 440000",
              'Chapter 09 transaction lab schema validation passed',
          ]:
              if token not in sql['01_transaction_lab_schema.sql']:
                  raise SystemExit(f'01 prerequisite/schema gate missing {token}')

          expected_messages = {
              '02_transaction_lab_seed.sql': 'Chapter 09 transaction lab seed validation passed',
              '03_commit_transaction.sql': 'Chapter 09 first commit validation passed',
              '04_rollback_transaction.sql': 'Chapter 09 rollback validation passed',
              '05_commit_and_sold_out.sql': 'Chapter 09 sold-out validation passed',
              '06_transaction_validation.sql': 'Chapter 09 main transaction validation passed',
              '08_cancel_and_restore.sql': 'Chapter 09 cancel rollback validation passed',
              'reset_transaction_lab.sql': 'Chapter 09 transaction lab reset passed',
          }
          for name, message in expected_messages.items():
              if message not in sql[name]:
                  raise SystemExit(f'{name} missing success gate message')

          for token in ['SAVEPOINT before_duplicate_enrollment', 'ROLLBACK TO SAVEPOINT before_duplicate_enrollment', 'uq_transaction_enrollments_active']:
              if token not in sql['09_error_and_savepoint.sql']:
                  raise SystemExit(f'09 savepoint practice missing {token}')
          for token in ['SHOW transaction_isolation', "lock_timeout = '5s'", 'FOR UPDATE']:
              if token not in sql['07_concurrency_two_sessions.sql']:
                  raise SystemExit(f'07 concurrency practice missing {token}')

          forbidden_course_project_change = re.compile(
              r'\b(?:INSERT\s+INTO|UPDATE|DELETE\s+FROM|ALTER\s+TABLE|DROP\s+TABLE|TRUNCATE(?:\s+TABLE)?)\s+course_project\.',
              re.I,
          )
          for name, text in sql.items():
              without_comments = re.sub(r'/\*.*?\*/', '', text, flags=re.S)
              without_comments = re.sub(r'--.*$', '', without_comments, flags=re.M)
              if forbidden_course_project_change.search(without_comments):
                  raise SystemExit(f'Chapter 09 SQL modifies protected course_project: {name}')

          if 'BEGIN;' not in sql['reset_transaction_lab.sql'] or 'COMMIT;' not in sql['reset_transaction_lab.sql']:
              raise SystemExit('reset must be transactional')
          if 'DROP SCHEMA IF EXISTS transaction_lab;' not in sql['reset_transaction_lab.sql']:
              raise SystemExit('reset does not remove transaction_lab')

          for token in ['590000', '340000', '440000', '03_commit_transaction.sql', '06_transaction_validation.sql', 'validate-chapter09.yml']:
              if token not in code_readme:
                  raise SystemExit(f'code README missing {token}')
          if 'recorded_amount' not in image_readme:
              raise SystemExit('image README missing recorded_amount terminology')

          mmds = sorted(Path('images/chapter09').glob('*.mmd'))
          svgs = sorted(Path('images/chapter09').glob('*.svg'))
          if len(mmds) != 8 or len(svgs) != 8:
              raise SystemExit(f'expected 8 Mermaid/SVG pairs, got {len(mmds)}/{len(svgs)}')
          if {p.stem for p in mmds} != {p.stem for p in svgs}:
              raise SystemExit('Mermaid/SVG stems do not match')

          for path in svgs:
              raw = path.read_text(encoding='utf-8')
              root = ET.fromstring(raw)
              if root.attrib.get('role') != 'img':
                  raise SystemExit(f'{path} missing role=img')
              if not root.attrib.get('viewBox'):
                  raise SystemExit(f'{path} missing viewBox')
              if root.attrib.get('width') != '100%':
                  raise SystemExit(f'{path} width must be 100%')
              tags = {elem.tag.split('}')[-1] for elem in root.iter()}
              if 'title' not in tags or 'desc' not in tags:
                  raise SystemExit(f'{path} missing title/desc')
              if stale_term in raw:
                  raise SystemExit(f'{path} contains stale amount terminology')

          for index in range(1, 9):
              token = f'ch09_{index:02d}_'
              matches = [p.name for p in svgs if p.name.startswith(token)]
              if len(matches) != 1 or matches[0] not in chapter:
                  raise SystemExit(f'Chapter body missing current image for figure 9-{index}')

          print('Chapter 09 static alignment passed')
          PY

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create Chapter 09 test database
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE ai_database_book;"

      - name: Verify wrong database protection
        shell: bash
        run: |
          if psql -d postgres -v ON_ERROR_STOP=1 -f code/chapter09/01_transaction_lab_schema.sql > /tmp/ch9_wrong_db.log 2>&1; then
            cat /tmp/ch9_wrong_db.log
            echo "01 unexpectedly passed on postgres database"
            exit 1
          fi
          cat /tmp/ch9_wrong_db.log
          grep -q "ai_database_book" /tmp/ch9_wrong_db.log

      - name: Build Chapter 07 canonical baseline
        shell: bash
        run: |
          for file in \
            code/chapter07/01_course_project_schema.sql \
            code/chapter07/02_course_project_seed.sql \
            code/chapter07/03_course_project_changes.sql \
            code/chapter07/04_course_project_validation.sql
          do
            psql -d ai_database_book -v ON_ERROR_STOP=1 -f "$file" 2>&1 | tee -a /tmp/ch9_baseline.log
          done
          grep -q "Chapter 07 course project validation passed" /tmp/ch9_baseline.log
          psql -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter08/00_check_course_project.sql > /tmp/ch9_ch8_00.log 2>&1
          psql -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter08/03_join_aggregation_validation.sql > /tmp/ch9_ch8_03.log 2>&1
          grep -q "Chapter 08 prerequisite check passed" /tmp/ch9_ch8_00.log
          grep -q "Chapter 08 join and aggregation validation passed" /tmp/ch9_ch8_03.log

      - name: Capture protected project fingerprint
        shell: bash
        run: |
          PROJECT_BEFORE=$(psql -d ai_database_book -At -v ON_ERROR_STOP=1 <<'SQL'
          SELECT md5(
              COALESCE((SELECT jsonb_agg(to_jsonb(s) ORDER BY id)::text FROM course_project.students AS s), 'null') || '|' ||
              COALESCE((SELECT jsonb_agg(to_jsonb(i) ORDER BY id)::text FROM course_project.instructors AS i), 'null') || '|' ||
              COALESCE((SELECT jsonb_agg(to_jsonb(c) ORDER BY id)::text FROM course_project.courses AS c), 'null') || '|' ||
              COALESCE((SELECT jsonb_agg(to_jsonb(e) ORDER BY id)::text FROM course_project.enrollments AS e), 'null')
          );
          SQL
          )
          echo "PROJECT_BEFORE=$PROJECT_BEFORE" >> "$GITHUB_ENV"

      - name: Run Chapter 09 main transaction path
        shell: bash
        run: |
          for file in \
            code/chapter09/01_transaction_lab_schema.sql \
            code/chapter09/02_transaction_lab_seed.sql \
            code/chapter09/03_commit_transaction.sql \
            code/chapter09/04_rollback_transaction.sql \
            code/chapter09/05_commit_and_sold_out.sql \
            code/chapter09/06_transaction_validation.sql
          do
            psql -d ai_database_book -v ON_ERROR_STOP=1 -f "$file" 2>&1 | tee -a /tmp/ch9_main.log
          done
          for message in \
            "Chapter 09 transaction lab schema validation passed" \
            "Chapter 09 transaction lab seed validation passed" \
            "Chapter 09 first commit validation passed" \
            "Chapter 09 rollback validation passed" \
            "Chapter 09 sold-out validation passed" \
            "Chapter 09 main transaction validation passed"
          do
            grep -q "$message" /tmp/ch9_main.log
          done

      - name: Verify main path final state and protected data
        shell: bash
        run: |
          RESULT=$(psql -d ai_database_book -At -v ON_ERROR_STOP=1 -c "SELECT (SELECT COUNT(*) FROM transaction_lab.course_inventory) || ':' || (SELECT COUNT(*) FROM transaction_lab.enrollments) || ':' || (SELECT COUNT(*) FROM transaction_lab.payments) || ':' || (SELECT remaining_seats FROM transaction_lab.course_inventory WHERE course_id=301) || ':' || (SELECT remaining_seats FROM transaction_lab.course_inventory WHERE course_id=302) || ':' || (SELECT remaining_seats FROM transaction_lab.course_inventory WHERE course_id=303);")
          test "$RESULT" = "3:2:2:1:0:1"
          PROJECT_AFTER=$(psql -d ai_database_book -At -v ON_ERROR_STOP=1 <<'SQL'
          SELECT md5(
              COALESCE((SELECT jsonb_agg(to_jsonb(s) ORDER BY id)::text FROM course_project.students AS s), 'null') || '|' ||
              COALESCE((SELECT jsonb_agg(to_jsonb(i) ORDER BY id)::text FROM course_project.instructors AS i), 'null') || '|' ||
              COALESCE((SELECT jsonb_agg(to_jsonb(c) ORDER BY id)::text FROM course_project.courses AS c), 'null') || '|' ||
              COALESCE((SELECT jsonb_agg(to_jsonb(e) ORDER BY id)::text FROM course_project.enrollments AS e), 'null')
          );
          SQL
          )
          test "$PROJECT_BEFORE" = "$PROJECT_AFTER"

      - name: Verify schema and seed rerun guards
        shell: bash
        run: |
          if psql -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter09/01_transaction_lab_schema.sql > /tmp/ch9_rerun_01.log 2>&1; then
            cat /tmp/ch9_rerun_01.log
            echo "01 rerun unexpectedly passed"
            exit 1
          fi
          grep -q "transaction_lab" /tmp/ch9_rerun_01.log

          if psql -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter09/02_transaction_lab_seed.sql > /tmp/ch9_rerun_02.log 2>&1; then
            cat /tmp/ch9_rerun_02.log
            echo "02 rerun unexpectedly passed"
            exit 1
          fi
          grep -q "비어 있지 않습니다" /tmp/ch9_rerun_02.log

      - name: Verify cancel and seat restore rollback
        shell: bash
        run: |
          psql -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter09/08_cancel_and_restore.sql 2>&1 | tee /tmp/ch9_cancel.log
          grep -q "Chapter 09 cancel rollback validation passed" /tmp/ch9_cancel.log
          psql -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter09/06_transaction_validation.sql > /tmp/ch9_after_cancel.log 2>&1
          grep -q "Chapter 09 main transaction validation passed" /tmp/ch9_after_cancel.log

      - name: Verify SAVEPOINT recovery after constraint error
        shell: bash
        run: |
          cat > /tmp/ch9_savepoint.sql <<'SQL'
          BEGIN;
          SAVEPOINT before_duplicate_enrollment;
          UPDATE transaction_lab.course_inventory
          SET remaining_seats = remaining_seats - 1
          WHERE course_id = 301 AND remaining_seats > 0;
          INSERT INTO transaction_lab.enrollments (
              id, student_id, course_id, enrolled_at, status, recorded_amount
          ) VALUES (
              9003, 101, 301, CURRENT_TIMESTAMP, '수강중', 100000
          );
          ROLLBACK TO SAVEPOINT before_duplicate_enrollment;
          SELECT 'savepoint_restored=' ||
                 ((SELECT remaining_seats FROM transaction_lab.course_inventory WHERE course_id=301) = 1
                  AND NOT EXISTS (SELECT 1 FROM transaction_lab.enrollments WHERE id=9003))::text;
          RELEASE SAVEPOINT before_duplicate_enrollment;
          ROLLBACK;
          SQL
          psql -d ai_database_book -f /tmp/ch9_savepoint.sql > /tmp/ch9_savepoint.log 2>&1 || true
          cat /tmp/ch9_savepoint.log
          grep -q "uq_transaction_enrollments_active" /tmp/ch9_savepoint.log
          grep -q "savepoint_restored=true" /tmp/ch9_savepoint.log
          psql -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter09/06_transaction_validation.sql > /tmp/ch9_after_savepoint.log 2>&1
          grep -q "Chapter 09 main transaction validation passed" /tmp/ch9_after_savepoint.log

      - name: Verify two-session lock timeout and recovery
        shell: bash
        run: |
          cat > /tmp/ch9_lock_a.sql <<'SQL'
          BEGIN;
          SELECT * FROM transaction_lab.course_inventory WHERE course_id = 303 FOR UPDATE;
          SELECT pg_sleep(3);
          ROLLBACK;
          SQL
          psql -d ai_database_book -v ON_ERROR_STOP=1 -f /tmp/ch9_lock_a.sql > /tmp/ch9_lock_a.log 2>&1 &
          A_PID=$!
          sleep 1

          cat > /tmp/ch9_lock_b.sql <<'SQL'
          BEGIN;
          SET LOCAL lock_timeout = '1s';
          SELECT * FROM transaction_lab.course_inventory WHERE course_id = 303 FOR UPDATE;
          ROLLBACK;
          SQL
          psql -d ai_database_book -f /tmp/ch9_lock_b.sql > /tmp/ch9_lock_b.log 2>&1 || true
          wait "$A_PID"
          cat /tmp/ch9_lock_b.log
          grep -q "lock timeout" /tmp/ch9_lock_b.log
          test "$(psql -d ai_database_book -At -v ON_ERROR_STOP=1 -c "SELECT remaining_seats FROM transaction_lab.course_inventory WHERE course_id=303;")" = "1"
          psql -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter09/06_transaction_validation.sql > /tmp/ch9_after_lock.log 2>&1
          grep -q "Chapter 09 main transaction validation passed" /tmp/ch9_after_lock.log

      - name: Verify reset is isolated to transaction_lab
        shell: bash
        run: |
          psql -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter09/reset_transaction_lab.sql 2>&1 | tee /tmp/ch9_reset.log
          grep -q "Chapter 09 transaction lab reset passed" /tmp/ch9_reset.log
          test "$(psql -d ai_database_book -At -v ON_ERROR_STOP=1 -c "SELECT to_regnamespace('transaction_lab') IS NULL;")" = "t"
          PROJECT_AFTER_RESET=$(psql -d ai_database_book -At -v ON_ERROR_STOP=1 <<'SQL'
          SELECT md5(
              COALESCE((SELECT jsonb_agg(to_jsonb(s) ORDER BY id)::text FROM course_project.students AS s), 'null') || '|' ||
              COALESCE((SELECT jsonb_agg(to_jsonb(i) ORDER BY id)::text FROM course_project.instructors AS i), 'null') || '|' ||
              COALESCE((SELECT jsonb_agg(to_jsonb(c) ORDER BY id)::text FROM course_project.courses AS c), 'null') || '|' ||
              COALESCE((SELECT jsonb_agg(to_jsonb(e) ORDER BY id)::text FROM course_project.enrollments AS e), 'null')
          );
          SQL
          )
          test "$PROJECT_BEFORE" = "$PROJECT_AFTER_RESET"
          psql -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter08/00_check_course_project.sql > /tmp/ch9_final_ch8.log 2>&1
          grep -q "Chapter 08 prerequisite check passed" /tmp/ch9_final_ch8.log
