name: Clean Chapter 12 duplicate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ch12-cleanup-duplicate.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate prompt line
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('book/chapter12/chapter12.md')
          text = p.read_text(encoding='utf-8')
          duplicate = '- 별도 결제·환불 원장은 현재 프로젝트 범위 밖\n- 별도 결제·환불 원장은 현재 프로젝트 범위 밖'
          if text.count(duplicate) != 1:
              raise SystemExit(f'Expected one duplicate block, found {text.count(duplicate)}')
          p.write_text(text.replace(duplicate, '- 별도 결제·환불 원장은 현재 프로젝트 범위 밖', 1), encoding='utf-8')
          PY
      - name: Commit cleanup and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ch12-cleanup-duplicate.yml
          git add book/chapter12/chapter12.md
          git commit -m "Remove duplicate Chapter 12 AI prompt line"
          git push
