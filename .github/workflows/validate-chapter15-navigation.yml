name: Validate Chapter 15 navigation

on:
  push:
    branches: [main]
    paths:
      - presentation/chapter15/**
      - code/chapter15/**
      - presentation/common/tts_pronunciation.js
      - .github/workflows/validate-chapter15-navigation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Chapter 15 JavaScript and Python syntax
        run: |
          node --check presentation/chapter15/chapter15_slides.js
          node --check presentation/chapter15/chapter15_navigation.js
          node --check presentation/chapter15/chapter15_player.js
          node --check presentation/chapter15/chapter15_script.js
          node --check presentation/common/tts_pronunciation.js
          python -m py_compile code/chapter15/templates/python/*.py

      - name: Check Chapter 15 navigation and project evidence
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          root = Path('presentation/chapter15')
          nav_text = (root / 'chapter15_navigation.js').read_text(encoding='utf-8')
          marker = 'const PLANS = {'
          if marker not in nav_text:
              raise SystemExit('Chapter 15 PLANS not found')
          plans = nav_text.split(marker, 1)[1].split('\n  };', 1)[0]
          if 'theory: {' not in plans or 'practice: {' not in plans:
              raise SystemExit('Chapter 15 theory/practice plan blocks not found')
          theory_plan = plans.split('theory: {', 1)[1].split('\n    },\n    practice: {', 1)[0]
          practice_plan = plans.split('\n    practice: {', 1)[1]

          cases = [
              ('theory', 'chapter15_theory_lecture_plan.md', theory_plan, 20),
              ('practice', 'chapter15_practice_lecture_plan.md', practice_plan, 20),
          ]
          for block, filename, plan_text, expected in cases:
              text = (root / filename).read_text(encoding='utf-8')
              slide_titles = re.findall(r'^##\s+\d+\.\s+(.+)$', text, flags=re.M)
              plan_titles = re.findall(r"^\s{6}'([^']+)':", plan_text, flags=re.M)
              if len(slide_titles) != expected:
                  raise SystemExit(f'Expected {expected} Chapter 15 {block} slides, found {len(slide_titles)}')
              if len(set(slide_titles)) != len(slide_titles):
                  raise SystemExit(f'Duplicate Chapter 15 {block} slide titles found')
              if len(set(plan_titles)) != len(plan_titles):
                  raise SystemExit(f'Duplicate Chapter 15 {block} navigation titles found')
              missing = sorted(set(slide_titles) - set(plan_titles))
              extra = sorted(set(plan_titles) - set(slide_titles))
              if missing or extra:
                  raise SystemExit(f'Chapter 15 {block} navigation mismatch: missing={missing}, extra={extra}')
              sections = re.split(r'(?=^##\s+\d+\.\s+)', text, flags=re.M)[1:]
              for index, section in enumerate(sections, start=1):
                  if '**화면 구성**' not in section or '**발표 스크립트**' not in section:
                      raise SystemExit(f'Chapter 15 {block} slide {index} is missing screen or script content')
              print(f'Chapter 15 {block} navigation coverage OK: {len(slide_titles)} / {expected} slides')

          script_text = (root / 'chapter15_script.js').read_text(encoding='utf-8')
          if 'const ttsRules' in script_text or 'ttsRules.reduce' in script_text:
              raise SystemExit('Chapter 15 still contains duplicated local TTS rules')
          if 'window.PresentationTTS?.normalize' not in script_text:
              raise SystemExit('Chapter 15 script is not using shared PresentationTTS')

          tts_text = Path('presentation/common/tts_pronunciation.js').read_text(encoding='utf-8')
          required_terms = [
              'P15-R', 'P15-D', 'P15-T', 'P15-V', 'tutor_project_restore', 'tutor_project',
              'question_materials', 'learning_materials', 'SQLSTATE', 'IDENTITY', 'CASCADE',
              'Seq Scan', 'ACL', 'PUBLIC', 'PGPASSFILE', 'pg_dump', 'pg_restore',
              'READ ONLY', 'REPEATABLE READ', 'assert_frame_equal'
          ]
          missing_terms = [term for term in required_terms if term not in tts_text]
          if missing_terms:
              raise SystemExit(f'Chapter 15 shared TTS terms missing: {missing_terms}')
          print('Chapter 15 shared TTS terms OK')

          for filename in ['chapter15_theory_presentation.html', 'chapter15_practice_presentation.html']:
              html = (root / filename).read_text(encoding='utf-8')
              order = [html.find('chapter15_slides.js'), html.find('chapter15_navigation.js'), html.find('chapter15_player.js')]
              if any(value < 0 for value in order) or order != sorted(order):
                  raise SystemExit(f'{filename} asset order is invalid')
          script_html = (root / 'chapter15_script.html').read_text(encoding='utf-8')
          order = [
              script_html.find('chapter15_slides.js'),
              script_html.find('chapter15_navigation.js'),
              script_html.find('../common/tts_pronunciation.js'),
              script_html.find('chapter15_script.js'),
          ]
          if any(value < 0 for value in order) or order != sorted(order):
              raise SystemExit('Chapter 15 script asset order is invalid')
          print('Chapter 15 asset order OK')

          code_root = Path('code/chapter15/templates')
          required_sql = [
              '01_schema.sql','02_seed.sql','03_metadata_validation.sql','04_requirement_queries.sql',
              '05_transaction_checks.sql','06_negative_tests.sql','07_performance_checks.sql',
              '08_operations_checks.sql','09_analysis_dataset.sql','10_completion_gate.sql',
              '11_restore_validation.sql'
          ]
          required_py = ['01_load_postgresql.py','02_pandas_analysis.py','03_result_validation.py','validation_utils.py']
          missing = [name for name in required_sql if not (code_root / name).exists()]
          missing += [f'python/{name}' for name in required_py if not (code_root / 'python' / name).exists()]
          if missing:
              raise SystemExit(f'Chapter 15 project files missing: {missing}')

          gate = (code_root / '10_completion_gate.sql').read_text(encoding='utf-8')
          negative = (code_root / '06_negative_tests.sql').read_text(encoding='utf-8')
          result_validation = (code_root / 'python' / '03_result_validation.py').read_text(encoding='utf-8')
          utils = (code_root / 'python' / 'validation_utils.py').read_text(encoding='utf-8')
          checks = {
              'tables/views/constraints/fk/identity/indexes': all(token in gate for token in [
                  'table_count <> 6', 'view_count <> 4', 'constraint_count <> 36',
                  'fk_count <> 5', 'identity_count <> 5', 'index_count <> 3'
              ]),
              'seed row counts': all(token in gate for token in [
                  'tutor_project.students) <> 4', 'tutor_project.tutors) <> 3',
                  'tutor_project.questions) <> 5', 'tutor_project.answers) <> 5',
                  'tutor_project.learning_materials) <> 6', 'tutor_project.question_materials) <> 7'
              ]),
              'core negative tests 14': 'passed_count <> 14' in gate,
              'full negative boundary tests 23': 'total_count <> 23 OR passed_count <> 23 OR unexpected_count <> 0' in negative,
              'analysis dataset rows 5': 'tutor_project.question_analysis_dataset) <> 5' in gate,
              'analysis answer sum 5': 'SUM(answer_count) FROM tutor_project.question_analysis_dataset) <> 5' in gate,
              'analysis material sum 7': 'SUM(material_count) FROM tutor_project.question_analysis_dataset) <> 7' in gate,
              'student zero question case': 'question_count = 0) <> 1' in gate,
              'completion pass notice': 'Chapter 15 database completion gate passed' in gate,
              'pandas sql comparison': 'assert_frame_equal' in result_validation,
              'cross validation pass': 'Chapter 15 SQL and pandas cross-validation passed' in result_validation,
              'repeatable read only snapshot': 'REPEATABLE READ, READ ONLY' in utils,
              'expected dataset rows': 'EXPECTED_ROWS = 5' in utils,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit(f'Chapter 15 project evidence mismatch: {failed}')
          print('Chapter 15 project evidence OK')
          PY
