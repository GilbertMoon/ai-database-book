name: Apply Chapter 13 final publication review once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ch13-final-publication-review-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Chapter 13 publication review
        run: python scripts/ch13_final_publication_review_once.py
      - name: Keep permanent workflow unchanged in this commit
        run: git restore .github/workflows/validate-chapter13.yml
      - name: Regenerate full manuscript
        run: python scripts/merge_chapters.py
      - name: Check Chapter 13 JavaScript syntax
        run: |
          node --check presentation/chapter13/chapter13_slides.js
          node --check presentation/chapter13/chapter13_navigation.js
          node --check presentation/chapter13/chapter13_player.js
          node --check presentation/chapter13/chapter13_script.js
      - name: Remove one-off patch script
        run: rm -f scripts/ch13_final_publication_review_once.py
      - name: Commit reviewed Chapter 13
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add book/chapter13 code/chapter13 images/chapter13 presentation/chapter13 notes/chapter13_review_checklist.md publish/full_manuscript.md
          git add -u scripts/ch13_final_publication_review_once.py
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Refine Chapter 13 final publication content'
          git push
