name: Validate Chapter 10

on:
  push:
    paths:
      - 'book/chapter10/**'
      - 'code/chapter10/**'
      - 'images/chapter10/**'
      - 'presentation/chapter10/**'
      - 'notes/chapter10_review_checklist.md'
      - 'notes/chapter10_validation_result.md'
      - '.github/workflows/validate-chapter10.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Chapter 10 JavaScript syntax
        run: |
          node --check presentation/chapter10/chapter10_slides.js
          node --check presentation/chapter10/chapter10_navigation.js
          node --check presentation/chapter10/chapter10_player.js
          node --check presentation/chapter10/chapter10_script.js

      - name: Check Chapter 10 source alignment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          chapter = Path('book/chapter10/chapter10.md').read_text(encoding='utf-8')
          outline = Path('book/chapter10/chapter10_outline.md').read_text(encoding='utf-8')
          activity = Path('book/chapter10/chapter10_activity.md').read_text(encoding='utf-8')
          theory = Path('presentation/chapter10/chapter10_theory_lecture_plan.md').read_text(encoding='utf-8')
          practice = Path('presentation/chapter10/chapter10_practice_lecture_plan.md').read_text(encoding='utf-8')
          nav_js = Path('presentation/chapter10/chapter10_navigation.js').read_text(encoding='utf-8')
          player_js = Path('presentation/chapter10/chapter10_player.js').read_text(encoding='utf-8')
          script_js = Path('presentation/chapter10/chapter10_script.js').read_text(encoding='utf-8')
          script_html = Path('presentation/chapter10/chapter10_script.html').read_text(encoding='utf-8')
          theory_html = Path('presentation/chapter10/chapter10_theory_presentation.html').read_text(encoding='utf-8')
          practice_html = Path('presentation/chapter10/chapter10_practice_presentation.html').read_text(encoding='utf-8')
          index_html = Path('presentation/chapter10/index.html').read_text(encoding='utf-8')
          code_readme = Path('code/chapter10/README.md').read_text(encoding='utf-8')

          numbered = [int(x) for x in re.findall(r'^##\s+(\d+)\.\s+', chapter, re.M)]
          if not numbered or numbered != list(range(1, max(numbered) + 1)) or len(numbered) < 20:
              raise SystemExit(f'Chapter 10 body section numbering mismatch: {numbered}')

          for name, text in [
              ('chapter', chapter), ('outline', outline), ('activity', activity),
              ('theory', theory), ('practice', practice), ('code README', code_readme)
          ]:
              for token in ['recorded_amount', 'PostgreSQL 16']:
                  if token not in text:
                      raise SystemExit(f'{name} missing {token}')

          for name, text in [('chapter', chapter), ('theory', theory), ('code README', code_readme)]:
              if 'PostgreSQL 18+' not in text or 'Skip Scan' not in text:
                  raise SystemExit(f'{name} missing PostgreSQL 18+ Skip Scan version distinction')

          stale = 'paid' + '_amount'
          bad = []
          for root in [Path('book/chapter10'), Path('presentation/chapter10'), Path('code/chapter10')]:
              for path in root.rglob('*'):
                  if path.is_file() and path.suffix.lower() in {'.md', '.sql', '.js', '.html'}:
                      text = path.read_text(encoding='utf-8', errors='ignore')
                      if stale in text and path.name != '07_result_validation.sql':
                          bad.append(str(path))
          if bad:
              raise SystemExit('stale Chapter 10 amount term remains: ' + ', '.join(bad))

          def plan_titles(label, text):
              sections = list(re.finditer(r'^##\s+(\d+)\.\s+(.+)$', text, re.M))
              nums = [int(m.group(1)) for m in sections]
              if nums != list(range(1, 21)):
                  raise SystemExit(f'{label} section numbers mismatch: {nums}')
              titles = []
              for i, match in enumerate(sections):
                  end = sections[i + 1].start() if i + 1 < len(sections) else len(text)
                  block = text[match.end():end]
                  if '**화면 구성**' not in block or '**발표 스크립트**' not in block:
                      raise SystemExit(f'{label} section {match.group(1)} missing screen/script')
                  titles.append(match.group(2).strip())
              return titles

          for title in plan_titles('theory', theory) + plan_titles('practice', practice):
              if title not in nav_js:
                  raise SystemExit(f'navigation missing slide title: {title}')
          if index_html.count('20장') < 2:
              raise SystemExit('Chapter 10 index must advertise 20 theory and 20 practice slides')

          version = '20260809a'
          for name, text in [
              ('player js', player_js), ('script js', script_js), ('script html', script_html),
              ('theory html', theory_html), ('practice html', practice_html)
          ]:
              if version not in text:
                  raise SystemExit(f'{name} missing asset version {version}')
          if f"const ASSET_VERSION = '{version}';" not in player_js:
              raise SystemExit('player.js missing current ASSET_VERSION')
          if f"const ASSET_VERSION = '{version}';" not in script_js:
              raise SystemExit('script.js missing current ASSET_VERSION')
          if '../common/tts_pronunciation.js' not in script_html:
              raise SystemExit('shared TTS normalization is not loaded')
          if '../common/script_content_enhancer.js' not in script_html:
              raise SystemExit('shared script content enhancer is not loaded')
          if 'PresentationTTS?.normalize' not in script_js:
              raise SystemExit('presenter script does not use shared TTS normalization')

          required_sql = [
              '01_performance_lab_schema.sql',
              '02_performance_lab_seed.sql',
              '03_baseline_explain.sql',
              '04_create_candidate_indexes.sql',
              '05_after_index_explain.sql',
              '06_index_review.sql',
              '07_result_validation.sql',
              'reset_performance_lab.sql',
              'index_performance_practice.sql',
          ]
          sql = {}
          for name in required_sql:
              path = Path('code/chapter10') / name
              if not path.exists():
                  raise SystemExit(f'missing {path}')
              sql[name] = path.read_text(encoding='utf-8')

          expected_messages = {
              '01_performance_lab_schema.sql': 'Chapter 10 performance lab schema validation passed',
              '02_performance_lab_seed.sql': 'Chapter 10 performance lab seed validation passed',
              '03_baseline_explain.sql': 'Chapter 10 baseline explain validation passed',
              '04_create_candidate_indexes.sql': 'Chapter 10 candidate index creation passed',
              '05_after_index_explain.sql': 'Chapter 10 after-index explain validation passed',
              '06_index_review.sql': 'Chapter 10 index review validation passed',
              '07_result_validation.sql': 'Chapter 10 performance result validation passed',
              'reset_performance_lab.sql': 'Chapter 10 performance lab reset passed',
          }
          for name, message in expected_messages.items():
              if message not in sql[name]:
                  raise SystemExit(f'{name} missing success message')

          for name in ['01_performance_lab_schema.sql', '02_performance_lab_seed.sql', '04_create_candidate_indexes.sql', 'reset_performance_lab.sql']:
              if 'BEGIN;' not in sql[name] or 'COMMIT;' not in sql[name]:
                  raise SystemExit(f'{name} must be transactional')

          for token in ['590000', '340000', '440000', 'v_requested_count <> 2', 'v_learning_count <> 1']:
              if token not in sql['01_performance_lab_schema.sql']:
                  raise SystemExit(f'01 missing Chapter 07/08 gate {token}')
          for token in ['30002', '30001', 'v_amount_mismatch', 'v_bad_student_distribution', 'v_bad_course_distribution']:
              if token not in sql['02_performance_lab_seed.sql']:
                  raise SystemExit(f'02 missing seed validation {token}')

          explain_re = re.compile(r'EXPLAIN\s*\([^)]*\)\s*(SELECT[\s\S]*?;)', re.I)
          normalize = lambda text: [re.sub(r'\s+', ' ', q.strip()).lower() for q in explain_re.findall(text)]
          before = normalize(sql['03_baseline_explain.sql'])
          after = normalize(sql['05_after_index_explain.sql'])
          if len(before) != 8 or before != after:
              raise SystemExit(f'03/05 EXPLAIN query mismatch: {len(before)} vs {len(after)}')

          clean04 = re.sub(r'/\*.*?\*/', '', sql['04_create_candidate_indexes.sql'], flags=re.S)
          clean04 = re.sub(r'--.*$', '', clean04, flags=re.M)
          create_names = re.findall(r'CREATE\s+INDEX\s+([a-zA-Z0-9_]+)', clean04, re.I)
          expected_candidates = {
              'idx_performance_courses_title',
              'idx_performance_enrollments_student_id',
              'idx_performance_enrollments_course_status',
          }
          if set(create_names) != expected_candidates:
              raise SystemExit(f'04 candidate index set mismatch: {create_names}')
          if re.search(r'\bANALYZE\s+performance_lab\.', clean04, re.I):
              raise SystemExit('04 must not ANALYZE performance_lab after index creation')

          forbidden = re.compile(
              r'\b(?:INSERT\s+INTO|UPDATE|DELETE\s+FROM|ALTER\s+TABLE|DROP\s+TABLE|TRUNCATE(?:\s+TABLE)?)\s+course_project\.',
              re.I,
          )
          for name, text in sql.items():
              clean = re.sub(r'/\*.*?\*/', '', text, flags=re.S)
              clean = re.sub(r'--.*$', '', clean, flags=re.M)
              if forbidden.search(clean):
                  raise SystemExit(f'Chapter 10 SQL modifies course_project: {name}')

          mmds = sorted(Path('images/chapter10').glob('*.mmd'))
          svgs = sorted(Path('images/chapter10').glob('*.svg'))
          if len(mmds) != 8 or len(svgs) != 8 or {p.stem for p in mmds} != {p.stem for p in svgs}:
              raise SystemExit(f'expected matching 8 Mermaid/SVG pairs, got {len(mmds)}/{len(svgs)}')
          for path in svgs:
              root = ET.fromstring(path.read_text(encoding='utf-8'))
              if root.attrib.get('role') != 'img' or not root.attrib.get('viewBox') or root.attrib.get('width') != '100%':
                  raise SystemExit(f'{path} missing SVG accessibility/layout attributes')
              tags = {elem.tag.split('}')[-1] for elem in root.iter()}
              if 'title' not in tags or 'desc' not in tags or path.name not in chapter:
                  raise SystemExit(f'{path} missing title/desc or body reference')

          print(f'Chapter 10 static alignment passed with {len(numbered)} body sections')
          PY

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create Chapter 10 test database
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE ai_database_book;"
          test "$(psql -d postgres -Atc "SELECT current_setting('server_version_num')::int / 10000")" = "16"

      - name: Verify wrong database protection
        shell: bash
        run: |
          set +e
          psql -v ON_ERROR_STOP=1 -d postgres -f code/chapter10/01_performance_lab_schema.sql > /tmp/ch10_wrong_db.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "ai_database_book" /tmp/ch10_wrong_db.log
          test "$(psql -d postgres -Atc "SELECT to_regnamespace('performance_lab') IS NULL")" = "t"

      - name: Build Chapter 07 and verify Chapter 08 baseline
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter07/01_course_project_schema.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter07/02_course_project_seed.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter07/03_course_project_changes.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter07/04_course_project_validation.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter08/00_check_course_project.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter08/03_join_aggregation_validation.sql
          test "$(psql -d ai_database_book -Atc "SELECT to_regnamespace('transaction_lab') IS NULL")" = "t"

      - name: Capture protected project fingerprint
        shell: bash
        run: |
          psql -d ai_database_book -Atc "
            SELECT md5(
              (SELECT jsonb_agg(to_jsonb(s) ORDER BY id)::text FROM course_project.students AS s) ||
              (SELECT jsonb_agg(to_jsonb(i) ORDER BY id)::text FROM course_project.instructors AS i) ||
              (SELECT jsonb_agg(to_jsonb(c) ORDER BY id)::text FROM course_project.courses AS c) ||
              (SELECT jsonb_agg(to_jsonb(e) ORDER BY id)::text FROM course_project.enrollments AS e)
            );
          " > /tmp/ch10_project_fingerprint.txt
          cat /tmp/ch10_project_fingerprint.txt

      - name: Run Chapter 10 schema and seed
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter10/01_performance_lab_schema.sql 2>&1 | tee /tmp/ch10_01.log
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter10/02_performance_lab_seed.sql 2>&1 | tee /tmp/ch10_02.log
          grep -q "Chapter 10 performance lab schema validation passed" /tmp/ch10_01.log
          grep -q "Chapter 10 performance lab seed validation passed" /tmp/ch10_02.log
          test "$(psql -d ai_database_book -Atc "SELECT COUNT(*) FROM pg_indexes WHERE schemaname='performance_lab'")" = "6"

      - name: Capture baseline plans and run baseline measurement
        shell: bash
        run: |
          psql -d ai_database_book -Atc "EXPLAIN (FORMAT JSON) SELECT id,title,level,price FROM performance_lab.courses WHERE title='성능 테스트 강의 00500';" > /tmp/ch10_before_title.json
          psql -d ai_database_book -Atc "EXPLAIN (FORMAT JSON) SELECT id,student_id,course_id,status,recorded_amount FROM performance_lab.enrollments WHERE student_id=5000;" > /tmp/ch10_before_student.json
          psql -d ai_database_book -Atc "EXPLAIN (FORMAT JSON) SELECT id,student_id,course_id,status,recorded_amount FROM performance_lab.enrollments WHERE course_id=1500 AND status='수강중';" > /tmp/ch10_before_course_status.json
          ! grep -q "idx_performance_" /tmp/ch10_before_title.json
          ! grep -q "idx_performance_" /tmp/ch10_before_student.json
          ! grep -q "idx_performance_" /tmp/ch10_before_course_status.json
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter10/03_baseline_explain.sql 2>&1 | tee /tmp/ch10_03.log
          grep -q "Chapter 10 baseline explain validation passed" /tmp/ch10_03.log

      - name: Create candidates and capture after-index plans
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter10/04_create_candidate_indexes.sql 2>&1 | tee /tmp/ch10_04.log
          grep -q "Chapter 10 candidate index creation passed" /tmp/ch10_04.log
          psql -d ai_database_book -Atc "EXPLAIN (FORMAT JSON) SELECT id,title,level,price FROM performance_lab.courses WHERE title='성능 테스트 강의 00500';" > /tmp/ch10_after_title.json
          psql -d ai_database_book -Atc "EXPLAIN (FORMAT JSON) SELECT id,student_id,course_id,status,recorded_amount FROM performance_lab.enrollments WHERE student_id=5000;" > /tmp/ch10_after_student.json
          psql -d ai_database_book -Atc "EXPLAIN (FORMAT JSON) SELECT id,student_id,course_id,status,recorded_amount FROM performance_lab.enrollments WHERE course_id=1500 AND status='수강중';" > /tmp/ch10_after_course_status.json
          psql -d ai_database_book -Atc "EXPLAIN (FORMAT JSON) SELECT id,student_id,course_id,status FROM performance_lab.enrollments WHERE status='수강중';" > /tmp/ch10_pg16_status_only.json
          grep -q "idx_performance_courses_title" /tmp/ch10_after_title.json
          grep -q "idx_performance_enrollments_student_id" /tmp/ch10_after_student.json
          grep -q "idx_performance_enrollments_course_status" /tmp/ch10_after_course_status.json
          echo "PostgreSQL 16 status-only plan:"
          cat /tmp/ch10_pg16_status_only.json

      - name: Run Chapter 10 after-index review and final validation
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter10/05_after_index_explain.sql 2>&1 | tee /tmp/ch10_05.log
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter10/06_index_review.sql 2>&1 | tee /tmp/ch10_06.log
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter10/07_result_validation.sql 2>&1 | tee /tmp/ch10_07.log
          grep -q "Chapter 10 after-index explain validation passed" /tmp/ch10_05.log
          grep -q "Chapter 10 index review validation passed" /tmp/ch10_06.log
          grep -q "Chapter 10 performance result validation passed" /tmp/ch10_07.log

      - name: Verify final performance state and protected data
        shell: bash
        run: |
          state="$(psql -d ai_database_book -Atc "
            SELECT
              (SELECT COUNT(*) FROM performance_lab.students) || ':' ||
              (SELECT COUNT(*) FROM performance_lab.instructors) || ':' ||
              (SELECT COUNT(*) FROM performance_lab.courses) || ':' ||
              (SELECT COUNT(*) FROM performance_lab.enrollments) || ':' ||
              (SELECT COUNT(*) FROM pg_indexes WHERE schemaname='performance_lab') || ':' ||
              (SELECT COUNT(*) FROM pg_indexes WHERE schemaname='performance_lab' AND indexname LIKE 'idx_performance_%');
          ")"
          echo "$state"
          test "$state" = "10003:2:2003:100005:9:3"
          after="$(psql -d ai_database_book -Atc "
            SELECT md5(
              (SELECT jsonb_agg(to_jsonb(s) ORDER BY id)::text FROM course_project.students AS s) ||
              (SELECT jsonb_agg(to_jsonb(i) ORDER BY id)::text FROM course_project.instructors AS i) ||
              (SELECT jsonb_agg(to_jsonb(c) ORDER BY id)::text FROM course_project.courses AS c) ||
              (SELECT jsonb_agg(to_jsonb(e) ORDER BY id)::text FROM course_project.enrollments AS e)
            );
          ")"
          test "$after" = "$(cat /tmp/ch10_project_fingerprint.txt)"

      - name: Verify rerun guards
        shell: bash
        run: |
          expect_fail() {
            local file="$1"
            local out="$2"
            set +e
            psql -v ON_ERROR_STOP=1 -d ai_database_book -f "$file" > "$out" 2>&1
            local status=$?
            set -e
            test "$status" -ne 0
          }
          expect_fail code/chapter10/01_performance_lab_schema.sql /tmp/ch10_01_rerun.log
          expect_fail code/chapter10/02_performance_lab_seed.sql /tmp/ch10_02_rerun.log
          expect_fail code/chapter10/04_create_candidate_indexes.sql /tmp/ch10_04_rerun.log
          grep -q "performance_lab" /tmp/ch10_01_rerun.log
          grep -q "비어 있지" /tmp/ch10_02_rerun.log
          grep -q "실험 후보" /tmp/ch10_04_rerun.log

      - name: Verify reset is isolated to performance_lab
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter10/reset_performance_lab.sql 2>&1 | tee /tmp/ch10_reset.log
          grep -q "Chapter 10 performance lab reset passed" /tmp/ch10_reset.log
          test "$(psql -d ai_database_book -Atc "SELECT to_regnamespace('performance_lab') IS NULL")" = "t"
          after_reset="$(psql -d ai_database_book -Atc "
            SELECT md5(
              (SELECT jsonb_agg(to_jsonb(s) ORDER BY id)::text FROM course_project.students AS s) ||
              (SELECT jsonb_agg(to_jsonb(i) ORDER BY id)::text FROM course_project.instructors AS i) ||
              (SELECT jsonb_agg(to_jsonb(c) ORDER BY id)::text FROM course_project.courses AS c) ||
              (SELECT jsonb_agg(to_jsonb(e) ORDER BY id)::text FROM course_project.enrollments AS e)
            );
          ")"
          test "$after_reset" = "$(cat /tmp/ch10_project_fingerprint.txt)"
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter08/00_check_course_project.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter08/03_join_aggregation_validation.sql
