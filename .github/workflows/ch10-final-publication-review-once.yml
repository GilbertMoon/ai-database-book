name: Restore Chapter 10 validated asset version once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ch10-final-publication-review-once.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore Chapter 10 asset version
        run: python scripts/ch10_restore_asset_versions_once.py
      - name: Remove one-off restore script
        run: rm -f scripts/ch10_restore_asset_versions_once.py
      - name: Commit Chapter 10 asset version restore
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Restore Chapter 10 validated asset version'
          git push
