name: Apply Chapter 02 final publication review once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ch02-final-publication-review-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply Chapter 02 publication refinements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          # ------------------------------------------------------------------
          # Main manuscript
          # ------------------------------------------------------------------
          p = Path('book/chapter02/chapter02.md')
          text = p.read_text(encoding='utf-8')

          text = replace_once(
              text,
              '외래키는 다른 행을 참조한다.',
              '외래키는 참조 대상 키와 연결된다.',
              'chapter02 intro foreign-key wording',
          )

          text = replace_once(
              text,
              '### 4.1 서버\n\nPostgreSQL DBMS가 실행되는 환경입니다. 한 서버에서 여러 데이터베이스를 관리할 수 있습니다.',
              '### 4.1 서버\n\n이 책에서는 PostgreSQL DBMS가 실행되는 하나의 인스턴스를 이해하기 쉽게 **PostgreSQL 서버**라고 부릅니다. 로컬 PC에서 실행하든 원격 환경에서 실행하든 같은 계층 구조로 이해할 수 있습니다. 한 PostgreSQL 서버에서는 여러 데이터베이스를 관리할 수 있습니다.',
              'chapter02 server terminology',
          )

          text = replace_once(
              text,
              '표에 표시된 첫째·둘째·셋째 행의 순서는 설명을 위한 예시입니다. 관계형 데이터베이스의 조회 결과는 `ORDER BY`로 정렬 기준을 지정하지 않으면 순서가 보장되지 않습니다.',
              '표에 표시된 첫째·둘째·셋째 행의 순서는 설명을 위한 예시입니다. 테이블 자체에 업무적으로 보장된 행 순서가 있다고 가정하지 않으며, 조회 결과도 `ORDER BY`로 정렬 기준을 지정하지 않으면 순서가 보장되지 않습니다.',
              'chapter02 row order',
          )

          text = replace_once(
              text,
              '값의 겉모양만 보고 타입을 결정하지 않고 업무에서 어떻게 사용하는지도 함께 고려해야 합니다. PostgreSQL의 구체적인 데이터 타입과 변환 방법은 Chapter 04에서 다룹니다.',
              '값의 겉모양만 보고 타입을 결정하지 않고 업무에서 어떻게 사용하는지도 함께 고려해야 합니다. 데이터 타입은 저장할 값의 큰 범위를 정하고, 더 구체적인 업무 규칙은 제약조건으로 보완할 수 있습니다. PostgreSQL의 구체적인 데이터 타입과 변환 방법은 Chapter 04, 제약조건은 Chapter 06에서 다룹니다.',
              'chapter02 datatype and constraints',
          )

          text = replace_once(
              text,
              '외래키(Foreign Key, FK)는 다른 행을 참조하는 하나 이상의 열입니다.',
              '외래키(Foreign Key, FK)는 다른 테이블 또는 같은 테이블의 **참조 대상 키와 연결되는 하나 이상의 열**입니다. 이 책의 초급 예제에서는 다른 테이블의 기본키를 참조하는 경우를 중심으로 살펴봅니다.',
              'chapter02 foreign-key definition',
          )

          text = replace_once(
              text,
              '기본키\n→ 자신의 테이블에서 행을 구분\n\n외래키\n→ 참조 대상 행의 존재를 확인하고 업무 관계를 표현',
              '기본키\n→ 자신의 테이블에서 행을 구분\n\n외래키\n→ 참조 대상 키와의 연결을 표현\n\n외래키 제약조건\n→ 존재하지 않는 참조가 저장되지 않도록 검사',
              'chapter02 foreign-key constraint distinction',
          )

          text = replace_once(
              text,
              '카디널리티(Cardinality)는 한쪽 데이터가 상대편의 데이터와 최대 몇 개까지 연결될 수 있는지를 나타냅니다.',
              '카디널리티(Cardinality)는 한쪽의 한 행이 상대편의 몇 행과 연결될 수 있는지를 나타내는 관계의 수입니다. Chapter 02에서는 먼저 1:1, 1:N, N:M처럼 **최대 연결 수**를 중심으로 읽습니다. 연결 대상이 0개여도 되는지와 같은 선택·필수 여부는 별도의 업무 규칙입니다.',
              'chapter02 cardinality definition',
          )

          text = replace_once(
              text,
              '실제 업무에서는 0개를 허용하는지, 반드시 하나 이상이 필요한지도 별도로 결정해야 합니다. 관계와 연결 테이블을 실제로 설계하는 방법은 Chapter 05에서 다룹니다.',
              '실제 업무에서는 최대 연결 수뿐 아니라 0개를 허용하는지, 반드시 하나 이상이 필요한지도 별도로 결정해야 합니다. 이러한 선택·필수 관계와 연결 테이블을 실제로 설계하는 방법은 Chapter 05에서 다룹니다.',
              'chapter02 optional mandatory relationship',
          )

          text = replace_once(
              text,
              '학생 이름은 비어 있을 수 없다.\n이메일은 중복될 수 없다.\n존재하지 않는 학생의 수강신청은 저장할 수 없다.\n상품 가격은 0보다 작을 수 없다.',
              '학생 이름은 NULL일 수 없다.\n이메일은 중복될 수 없다.\n존재하지 않는 학생의 수강신청은 저장할 수 없다.\n상품 가격은 0보다 작을 수 없다.',
              'chapter02 constraint example null wording',
          )

          text = replace_once(
              text,
              '대표적인 제약조건에는 `PRIMARY KEY`, `FOREIGN KEY`, `NOT NULL`, `UNIQUE`, `CHECK`가 있습니다. 실제 SQL은 Chapter 06에서 다룹니다.',
              '대표적인 제약조건에는 `PRIMARY KEY`, `FOREIGN KEY`, `NOT NULL`, `UNIQUE`, `CHECK`가 있습니다. `NOT NULL`은 NULL을 막는 규칙이며 빈 문자열 자체를 막는 규칙은 아닙니다. 빈 문자열까지 제한해야 한다면 별도의 규칙이 필요합니다. 실제 제약조건 SQL은 Chapter 06에서 다룹니다.',
              'chapter02 not-null clarification',
          )

          text = replace_once(
              text,
              '| Delete | 데이터 삭제 기능 | `DELETE` 또는 상태 변경 |',
              '| Delete | 데이터 삭제 기능 | `DELETE` 또는 정책에 따른 `UPDATE` |',
              'chapter02 CRUD delete row',
          )

          text = replace_once(
              text,
              '- 기준 데이터: 업무 판단의 근거가 되는 데이터\n- 파생 데이터: 기준 데이터를 계산해 만든 결과\n- AI 결과: 모델과 입력·지시에 따라 생성된 결과',
              '- 기준 데이터: 특정 업무 판단에서 공식 기준으로 삼는 데이터\n- 파생 데이터: 기준 데이터를 계산해 만든 결과\n- AI 결과: 모델과 입력·지시에 따라 생성된 결과',
              'chapter02 source-of-truth recap',
          )

          text = replace_once(
              text,
              '- 외래키는 다른 행을 참조하며 1:N 관계에서는 같은 값이 반복될 수 있습니다.\n\n더 많은 활동은 `book/chapter02/chapter02_activity.md`에서 진행합니다.',
              '- 외래키는 참조 대상 키와 연결되며 1:N 관계에서는 같은 값이 반복될 수 있습니다. 외래키 제약조건이 설정되어 있다면 존재하지 않는 참조는 DBMS가 거부합니다.\n\n더 많은 활동은 [Chapter 02 독자 워크북](chapter02_activity.md)에서 진행합니다.',
              'chapter02 recommended answer and workbook link',
          )

          text = replace_once(
              text,
              '| 기본키 | 자신의 테이블에서 행을 고유하게 구분하는 열 조합 | `students.id` |\n| 외래키 | 다른 행을 참조하는 열 조합 | `enrollments.student_id` |\n| 카디널리티 | 데이터 사이의 최대 연결 개수 | 1:1, 1:N, N:M |',
              '| 기본키 | 자신의 테이블에서 행을 고유하게 구분하는 열 또는 열 조합 | `students.id` |\n| 외래키 | 참조 대상 키와 연결되는 열 또는 열 조합 | `enrollments.student_id` |\n| 카디널리티 | 한 행이 상대편의 몇 행과 연결될 수 있는지를 나타내는 관계의 수 | 1:1, 1:N, N:M |',
              'chapter02 summary key definitions',
          )

          text = replace_once(
              text,
              '→ 기본키와 외래키로 행과 관계를 구분\n→ 한 행의 의미와 타입을 확인해 구조를 검토',
              '→ 기본키로 행을 구분하고 외래키로 참조 관계를 연결\n→ 한 행의 의미와 타입을 확인해 구조를 검토',
              'chapter02 final flow precision',
          )

          p.write_text(text, encoding='utf-8')

          # ------------------------------------------------------------------
          # Reader workbook
          # ------------------------------------------------------------------
          p = Path('book/chapter02/chapter02_activity.md')
          text = p.read_text(encoding='utf-8')

          text = replace_once(
              text,
              '| 기본키 | 자신의 테이블에서 각 행을 고유하게 구분하는 열 조합 | `students.id` |\n| 외래키 | 다른 행을 참조하는 열 조합 | `enrollments.student_id` |',
              '| 기본키 | 자신의 테이블에서 각 행을 고유하게 구분하는 열 또는 열 조합 | `students.id` |\n| 외래키 | 참조 대상 키와 연결되는 열 또는 열 조합 | `enrollments.student_id` |',
              'chapter02 activity key definitions',
          )

          text = replace_once(
              text,
              'Delete → DELETE 또는 상태·삭제 시각 변경',
              'Delete → DELETE 또는 정책에 따른 UPDATE',
              'chapter02 activity CRUD delete',
          )

          text = replace_once(
              text,
              '외래키\n→ 다른 행을 참조\n```\n\n외래키 값은 1:N 관계에서 반복될 수 있으며, 별도의 `NOT NULL`과 `UNIQUE` 규칙이 있는지에 따라 NULL과 중복 허용 여부가 달라집니다.',
              '외래키\n→ 참조 대상 키와 연결\n```\n\n외래키 값은 1:N 관계에서 반복될 수 있으며, 별도의 `NOT NULL`과 `UNIQUE` 규칙이 있는지에 따라 NULL과 중복 허용 여부가 달라집니다. 실제로 존재하지 않는 참조를 DBMS가 막으려면 `FOREIGN KEY` 제약조건이 설정되어 있어야 합니다.',
              'chapter02 activity foreign-key explanation',
          )

          p.write_text(text, encoding='utf-8')

          # ------------------------------------------------------------------
          # Outline
          # ------------------------------------------------------------------
          p = Path('book/chapter02/chapter02_outline.md')
          text = p.read_text(encoding='utf-8')

          text = replace_once(
              text,
              '이 책의 계층과 용어는 PostgreSQL을 기준으로 설명한다. 다른 DBMS에서는 데이터베이스와 스키마의 사용 방식 또는 명칭이 다를 수 있음을 짧게 안내한다. 제품별 비교를 Chapter 02에서 상세하게 다루지 않는다.',
              '이 책의 계층과 용어는 PostgreSQL을 기준으로 설명한다. 다른 DBMS에서는 데이터베이스와 스키마의 사용 방식 또는 명칭이 다를 수 있음을 짧게 안내한다. 이 책에서 “PostgreSQL 서버”는 PostgreSQL DBMS가 실행되는 하나의 인스턴스를 이해하기 쉽게 부르는 표현이며 로컬 PC와 원격 환경 모두에 적용한다. 제품별 비교를 Chapter 02에서 상세하게 다루지 않는다.',
              'chapter02 outline server terminology',
          )

          text = replace_once(
              text,
              'Chapter 02에서는 테이블만 자세히 다룬다. 일반 VIEW의 생성과 사용은 Chapter 08로 이동한다.',
              'Chapter 02에서는 테이블만 자세히 다룬다. Chapter 08에서는 JOIN과 집계로 조회 결과를 만드는 방법을 확장하고, 분석용 VIEW의 생성과 활용은 Chapter 14에서 다룬다.',
              'chapter02 outline view destination',
          )

          text = replace_once(
              text,
              '외래키\n→ 다른 행을 참조하고 업무 관계를 표현',
              '외래키\n→ 참조 대상 키와 연결되어 업무 관계를 표현\n\n외래키 제약조건\n→ 존재하지 않는 참조가 저장되지 않도록 검사',
              'chapter02 outline foreign-key precision',
          )

          text = replace_once(
              text,
              '값의 허용 범위가 정해져 있는가?\n```\n\n## AI 구조 검토 질문',
              '값의 허용 범위가 정해져 있는가?\n```\n\n데이터 타입은 값의 큰 범위를 정하고, 더 구체적인 업무 규칙은 Chapter 06의 제약조건으로 보완한다.\n\n## AI 구조 검토 질문',
              'chapter02 outline datatype boundary',
          )

          text = replace_once(
              text,
              '| 일반 VIEW 생성과 활용 | Chapter 08 |\n| 트랜잭션과 동시성 | Chapter 09 |\n| Materialized View와 집계 저장 | Chapter 10 또는 14 |',
              '| JOIN·집계로 조회 결과 만들기 | Chapter 08 |\n| 트랜잭션과 동시성 | Chapter 09 |\n| Materialized View | 이 책의 필수 학습 범위에서 상세히 다루지 않음 |',
              'chapter02 outline advanced object destinations',
          )

          p.write_text(text, encoding='utf-8')

          # ------------------------------------------------------------------
          # Revision record
          # ------------------------------------------------------------------
          p = Path('book/chapter02/chapter02_review_revision.md')
          text = p.read_text(encoding='utf-8')

          text = replace_once(
              text,
              '외래키는 다른 행을 참조한다.\n외래키 값은 반복될 수 있다.',
              '외래키는 참조 대상 키와 연결된다.\n외래키 제약조건은 존재하지 않는 참조가 저장되지 않도록 검사한다.\n외래키 값은 반복될 수 있다.',
              'chapter02 revision FK wording',
          )

          text = replace_once(
              text,
              '일반 VIEW 생성과 활용\n→ Chapter 08\n\nMaterialized View와 집계 저장\n→ Chapter 10 또는 Chapter 14\n\n캐시와 파생 저장소\n→ Chapter 12',
              'Chapter 08\n→ JOIN과 집계로 조회 결과를 만드는 방법 확장\n\n분석용 VIEW 생성과 활용\n→ Chapter 14\n\nMaterialized View\n→ 이 책의 필수 학습 범위에서 상세히 다루지 않음\n\n캐시와 파생 저장소\n→ Chapter 12',
              'chapter02 revision view destinations',
          )

          text = replace_once(
              text,
              'Chapter 08\n→ VIEW, JOIN과 집계',
              'Chapter 08\n→ JOIN과 집계',
              'chapter02 revision chapter08 boundary',
          )

          insertion = '''---\n\n## 18. 최종 출판 정밀 검수 추가 반영\n\n최종 PDF/eBook 제작 전 정밀 검수에서 다음 표현을 추가로 보완했다.\n\n```text\nPostgreSQL 서버\n→ 원격 장비만 뜻하지 않고 PostgreSQL DBMS가 실행되는 인스턴스를 쉽게 부르는 표현으로 명확화\n\n행 순서\n→ 테이블 자체와 ORDER BY 없는 조회 결과에 보장된 업무 순서가 없음을 명확화\n\n외래키\n→ 단순히 “다른 행”이 아니라 참조 대상 키와 연결되는 열로 정의\n→ 외래키 열과 FOREIGN KEY 제약조건의 역할을 구분\n\n카디널리티\n→ 최대 연결 수와 0개 허용 여부를 구분\n\nNOT NULL\n→ NULL을 막지만 빈 문자열 자체를 막지는 않음을 명확화\n\nCRUD Delete\n→ SQL DELETE와 업무상 삭제 기능을 구분하고 정책에 따른 UPDATE 가능성을 명시\n\n기준 데이터\n→ 특정 업무 판단에서 공식 기준으로 삼는 데이터라는 표현으로 정밀화\n\nVIEW\n→ Chapter 08이라는 기존 안내를 제거하고 실제 분석용 VIEW는 Chapter 14로 정렬\n\nMaterialized View\n→ 실제 본문에 없는 장 번호를 약속하지 않고 필수 학습 범위 밖으로 정리\n```\n\n워크북의 기본키·외래키 정의와 CRUD 표현도 본문과 동일하게 동기화했다.\n\n---\n\n## 최종 반영 결과'''
          text = replace_once(
              text,
              '---\n\n## 최종 반영 결과',
              insertion,
              'chapter02 revision final review addendum',
          )

          p.write_text(text, encoding='utf-8')

          # ------------------------------------------------------------------
          # Publication checklist
          # ------------------------------------------------------------------
          p = Path('notes/chapter02_review_checklist.md')
          text = p.read_text(encoding='utf-8')

          text = replace_once(
              text,
              '| 실제 생성 순서 | 통과 | Chapter 03·04·07과 일치 |',
              '| 실제 생성 순서 | 통과 | Chapter 03·04·07과 일치 |\n| 서버 용어 범위 | 통과 | 로컬·원격과 무관하게 PostgreSQL 인스턴스를 쉽게 “서버”라고 부름 |',
              'chapter02 checklist server terminology',
          )

          text = replace_once(
              text,
              '| 외래키 역할 | 통과 | 다른 행 참조와 관계 표현 |',
              '| 외래키 역할 | 통과 | 참조 대상 키와 연결되어 관계를 표현 |\n| FK 제약조건 | 통과 | 존재하지 않는 참조를 DBMS가 거부하는 규칙과 FK 열의 역할을 구분 |',
              'chapter02 checklist FK precision',
          )

          text = replace_once(
              text,
              '| 0개 허용 | 통과 | 선택·필수 여부 별도 결정 안내 |',
              '| 0개 허용 | 통과 | 최대 연결 수와 선택·필수 여부를 별도 규칙으로 구분 |',
              'chapter02 checklist cardinality precision',
          )

          text = replace_once(
              text,
              '| 제약조건 | 통과 | 잘못된 값·참조 제한 |',
              '| 제약조건 | 통과 | 잘못된 값·참조 제한 |\n| NOT NULL 경계 | 통과 | NULL과 빈 문자열이 다른 상태임을 명확히 구분 |',
              'chapter02 checklist not-null boundary',
          )

          text = replace_once(
              text,
              '| 일반 VIEW | 통과 | 객체 예시만 언급, 생성·활용은 Chapter 08 |\n| Materialized View | 통과 | Chapter 10 또는 14로 이동 |',
              '| VIEW | 통과 | Chapter 02에서는 객체 예시만 언급하고 분석용 VIEW 생성·활용은 Chapter 14와 일치 |\n| Materialized View | 통과 | 실제 본문에 없는 장 번호를 약속하지 않고 필수 학습 범위 밖으로 정리 |',
              'chapter02 checklist view destinations',
          )

          p.write_text(text, encoding='utf-8')

          # Regenerate merged manuscript from the canonical chapter files.
          import subprocess
          subprocess.run(['python', 'scripts/merge_chapters.py'], check=True)

          # Remove this one-time workflow from the final repository state.
          Path('.github/workflows/ch02-final-publication-review-once.yml').unlink()
          PY

      - name: Validate Chapter 02 textual invariants
        shell: bash
