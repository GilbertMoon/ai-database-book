name: Chapter 15 asset version alignment once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ch15-asset-version-once.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align Chapter 15 asset version
        shell: bash
        run: |
          set -euo pipefail
          grep -RIl '20260808a' presentation/chapter15 | xargs -r sed -i 's/20260808a/20260809a/g'
          if grep -R '20260808a' presentation/chapter15; then
            echo 'stale Chapter 15 asset version remains'
            exit 1
          fi
      - name: Commit asset alignment
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add presentation/chapter15
          git commit -m 'Align Chapter 15 presentation asset version'
          git push
