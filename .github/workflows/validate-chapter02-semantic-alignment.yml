name: Validate Chapter 02 semantic alignment

on:
  push:
    branches: [main]
    paths:
      - presentation/chapter02/**
      - .github/workflows/validate-chapter02-semantic-alignment.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate screen-script semantic alignment
        run: |
          node presentation/chapter02/validate_chapter02_semantic_alignment.mjs
