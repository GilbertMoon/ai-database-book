name: Render Web Vibe Lab Diagrams

on:
  push:
    branches: [main]
    paths:
      - 'scripts/render_web_vibe_lab.py'
      - '.github/workflows/render-web-vibe-lab.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Korean fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Render diagrams
        run: python scripts/render_web_vibe_lab.py

      - name: Verify generated PNG files
        run: |
          test "$(find images/web-vibe-lab -maxdepth 1 -name '*.png' | wc -l)" -eq 10
          file images/web-vibe-lab/*.png

      - name: Commit generated images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/web-vibe-lab/*.png
          if git diff --cached --quiet; then
            echo 'No image changes to commit.'
          else
            git commit -m 'assets: add web vibe lab diagrams'
            git push
          fi
