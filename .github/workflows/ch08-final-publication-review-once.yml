name: Record Chapter 08 final validation once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ch08-final-publication-review-once.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record Chapter 08 validation
        run: python scripts/ch08_finalize_validation_once.py
      - name: Remove one-off record script
        run: rm -f scripts/ch08_finalize_validation_once.py
      - name: Commit Chapter 08 validation record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Record Chapter 08 final validation'
          git push
