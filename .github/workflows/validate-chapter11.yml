name: Validate Chapter 11

on:
  push:
    paths:
      - 'book/chapter11/**'
      - 'code/chapter11/**'
      - 'images/chapter11/**'
      - 'presentation/chapter11/**'
      - 'notes/chapter11_review_checklist.md'
      - 'notes/chapter11_validation_result.md'
      - '.env.example'
      - '.gitignore'
      - '.github/workflows/validate-chapter11.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Chapter 11 JavaScript syntax
        run: |
          node --check presentation/chapter11/chapter11_slides.js
          node --check presentation/chapter11/chapter11_navigation.js
          node --check presentation/chapter11/chapter11_player.js
          node --check presentation/chapter11/chapter11_script.js

      - name: Check Chapter 11 source alignment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          chapter = Path('book/chapter11/chapter11.md').read_text(encoding='utf-8')
          outline = Path('book/chapter11/chapter11_outline.md').read_text(encoding='utf-8')
          activity = Path('book/chapter11/chapter11_activity.md').read_text(encoding='utf-8')
          theory = Path('presentation/chapter11/chapter11_theory_lecture_plan.md').read_text(encoding='utf-8')
          practice = Path('presentation/chapter11/chapter11_practice_lecture_plan.md').read_text(encoding='utf-8')
          nav_js = Path('presentation/chapter11/chapter11_navigation.js').read_text(encoding='utf-8')
          player_js = Path('presentation/chapter11/chapter11_player.js').read_text(encoding='utf-8')
          script_js = Path('presentation/chapter11/chapter11_script.js').read_text(encoding='utf-8')
          script_html = Path('presentation/chapter11/chapter11_script.html').read_text(encoding='utf-8')
          theory_html = Path('presentation/chapter11/chapter11_theory_presentation.html').read_text(encoding='utf-8')
          practice_html = Path('presentation/chapter11/chapter11_practice_presentation.html').read_text(encoding='utf-8')
          index_html = Path('presentation/chapter11/index.html').read_text(encoding='utf-8')
          code_readme = Path('code/chapter11/README.md').read_text(encoding='utf-8')
          runbook = Path('code/chapter11/BACKUP_RESTORE_RUNBOOK.md').read_text(encoding='utf-8')
          env_example = Path('.env.example').read_text(encoding='utf-8')
          gitignore = Path('.gitignore').read_text(encoding='utf-8')

          numbered = [int(x) for x in re.findall(r'^##\s+(\d+)\.\s+', chapter, re.M)]
          if numbered != list(range(1, 29)):
              raise SystemExit(f'Chapter 11 body section numbering mismatch: {numbered}')

          for name, text in [
              ('chapter', chapter), ('outline', outline), ('activity', activity),
              ('theory', theory), ('practice', practice), ('code README', code_readme),
              ('runbook', runbook)
          ]:
              for token in ['recorded_amount', 'NUMERIC(12,0)', 'PostgreSQL 16']:
                  if token not in text:
                      raise SystemExit(f'{name} missing {token}')

          stale = 'paid' + '_amount'
          published = {
              'chapter': chapter,
              'outline': outline,
              'activity': activity,
              'theory': theory,
              'practice': practice,
              'code README': code_readme,
              'runbook': runbook,
          }
          for name, text in published.items():
              if stale in text:
                  raise SystemExit(f'{name} contains stale Chapter 11 amount term')

          def plan_titles(label, text):
              sections = list(re.finditer(r'^##\s+(\d+)\.\s+(.+)$', text, re.M))
              nums = [int(m.group(1)) for m in sections]
              if nums != list(range(1, 21)):
                  raise SystemExit(f'{label} section numbers mismatch: {nums}')
              titles = []
              for i, match in enumerate(sections):
                  end = sections[i + 1].start() if i + 1 < len(sections) else len(text)
                  block = text[match.end():end]
                  if '**화면 구성**' not in block or '**발표 스크립트**' not in block:
                      raise SystemExit(f'{label} section {match.group(1)} missing screen/script')
                  titles.append(match.group(2).strip())
              return titles

          for title in plan_titles('theory', theory) + plan_titles('practice', practice):
              if title not in nav_js:
                  raise SystemExit(f'navigation missing slide title: {title}')
          if index_html.count('20장') < 2:
              raise SystemExit('Chapter 11 index must advertise 20 theory and 20 practice slides')

          player_version = re.search(r"const ASSET_VERSION = '([^']+)';", player_js)
          script_version = re.search(r"const ASSET_VERSION = '([^']+)';", script_js)
          if not player_version or not script_version or player_version.group(1) != script_version.group(1):
              raise SystemExit('Chapter 11 player/script asset versions do not match')
          version = player_version.group(1)
          for name, text in [('theory html', theory_html), ('practice html', practice_html), ('script html', script_html)]:
              if version not in text:
                  raise SystemExit(f'{name} missing Chapter 11 asset version {version}')
          if '../common/tts_pronunciation.js' not in script_html:
              raise SystemExit('shared TTS normalization is not loaded')
          if '../common/script_content_enhancer.js' not in script_html:
              raise SystemExit('shared script content enhancer is not loaded')
          if 'PresentationTTS?.normalize' not in script_js:
              raise SystemExit('presenter script does not use shared TTS normalization')
          if "fetch(source, { cache: 'no-store' })" not in Path('presentation/chapter11/chapter11_slides.js').read_text(encoding='utf-8'):
              raise SystemExit('Chapter 11 slide source must bypass stale Markdown cache')

          required_sql = [
              '01_security_lab_schema.sql', '02_security_lab_seed.sql',
              '03_role_permission_plan.sql', '04_permission_checks.sql',
              '05_permission_behavior_tests.sql', '05_restore_validation.sql',
              '06_restore_validation.sql', 'reset_security_lab.sql',
              'security_backup_check.sql'
          ]
          sql = {}
          for name in required_sql:
              path = Path('code/chapter11') / name
              if not path.exists():
                  raise SystemExit(f'missing {path}')
              sql[name] = path.read_text(encoding='utf-8')

          expected_messages = {
              '01_security_lab_schema.sql': 'Chapter 11 security lab schema validation passed',
              '02_security_lab_seed.sql': 'Chapter 11 security lab seed validation passed',
              '05_permission_behavior_tests.sql': 'Chapter 11 permission behavior baseline preserved',
              '06_restore_validation.sql': 'Chapter 11 restore structure and data validation passed',
              'reset_security_lab.sql': 'Chapter 11 security lab reset passed',
          }
          for name, message in expected_messages.items():
              if message not in sql[name]:
                  raise SystemExit(f'{name} missing success message')

          for name in ['01_security_lab_schema.sql', '02_security_lab_seed.sql', 'reset_security_lab.sql']:
              if 'BEGIN;' not in sql[name] or 'COMMIT;' not in sql[name]:
                  raise SystemExit(f'{name} must be transactional')

          for token in ['590000', '340000', '440000', "v_requested_count <> 2", "v_learning_count <> 1", 'NUMERIC(12,0)']:
              if token not in sql['01_security_lab_schema.sql']:
                  raise SystemExit(f'01 missing Chapter 07/08 gate {token}')
          for token in ['310000', 'v_amount_mismatch', 'v_students_next <> 104', 'v_courses_next <> 204', 'v_enrollments_next <> 1004']:
              if token not in sql['02_security_lab_seed.sql']:
                  raise SystemExit(f'02 missing seed validation {token}')
          for token in ['lab_backup_user', 'WITH INHERIT TRUE, SET TRUE', 'SELECT ON SEQUENCE', '--enable-row-security']:
              if token not in sql['03_role_permission_plan.sql']:
                  raise SystemExit(f'03 missing role/backup concept {token}')
          for token in ['pg_auth_members', 'inherit_option', 'set_option', 'relrowsecurity', 'recorded_amount']:
              if token not in sql['04_permission_checks.sql']:
                  raise SystemExit(f'04 missing permission check {token}')
          for token in ['recorded_amount', '310000', 'ROLLBACK;']:
              if token not in sql['05_permission_behavior_tests.sql']:
                  raise SystemExit(f'05 missing permission behavior token {token}')
          for token in ['NUMERIC(12,0)', '310000', 'chk_security_enrollments_recorded_amount', 'indisvalid', 'indisready']:
              if token not in sql['06_restore_validation.sql']:
                  raise SystemExit(f'06 missing restore validation {token}')
          if 'CASCADE' in re.sub(r'--.*$', '', sql['reset_security_lab.sql'], flags=re.M).upper():
              raise SystemExit('reset_security_lab.sql must not use CASCADE')

          # Old amount name is allowed only as a negative schema-presence check in 01/02/06.
          for name, text in sql.items():
              if stale not in text:
                  continue
              if name not in {'01_security_lab_schema.sql', '02_security_lab_seed.sql', '06_restore_validation.sql'}:
                  raise SystemExit(f'{name} contains stale amount term')
              scrubbed = text.replace("column_name = '" + stale + "'", '')
              if stale in scrubbed:
                  raise SystemExit(f'{name} uses stale amount term outside negative schema check')

          forbidden = re.compile(
              r'\b(?:INSERT\s+INTO|UPDATE|DELETE\s+FROM|ALTER\s+TABLE|DROP\s+TABLE|TRUNCATE(?:\s+TABLE)?)\s+(?:course_project|transaction_lab|performance_lab)\.',
              re.I,
          )
          for name, text in sql.items():
              clean = re.sub(r'/\*.*?\*/', '', text, flags=re.S)
              clean = re.sub(r'--.*$', '', clean, flags=re.M)
              if forbidden.search(clean):
                  raise SystemExit(f'Chapter 11 SQL modifies protected lab/project: {name}')

          if 'PGPASSWORD=' in env_example or 'PGPASSFILE=' not in env_example:
              raise SystemExit('.env.example must use PGPASSFILE and must not expose PGPASSWORD')
          for token in ['.env', '*.backup', '*.dump', '.pgpass', 'pgpass.conf']:
              if token not in gitignore:
                  raise SystemExit(f'.gitignore missing protected artifact pattern {token}')

          # For custom archives, --no-owner belongs to pg_restore, not pg_dump.
          backup_blocks = re.findall(r'```bash\n([\s\S]*?)```', chapter + '\n' + runbook + '\n' + code_readme)
          for block in backup_blocks:
              compact = re.sub(r'\\\n\s*', ' ', block)
              compact = re.sub(r'\s+', ' ', compact)
              if 'pg_dump ' in compact and '-Fc' in compact and '--no-owner' in compact:
                  raise SystemExit('custom pg_dump command incorrectly uses --no-owner')
          for text_name, text in [('chapter', chapter), ('runbook', runbook), ('code README', code_readme)]:
              if 'pg_restore' not in text or '--no-owner' not in text or '--no-privileges' not in text or '--single-transaction' not in text:
                  raise SystemExit(f'{text_name} missing restore safety options')

          mmds = sorted(Path('images/chapter11').glob('*.mmd'))
          svgs = sorted(Path('images/chapter11').glob('*.svg'))
          if len(mmds) != 8 or len(svgs) != 8 or {p.stem for p in mmds} != {p.stem for p in svgs}:
              raise SystemExit(f'expected matching 8 Mermaid/SVG pairs, got {len(mmds)}/{len(svgs)}')
          for path in svgs:
              root = ET.fromstring(path.read_text(encoding='utf-8'))
              if root.attrib.get('role') != 'img' or not root.attrib.get('viewBox') or root.attrib.get('width') != '100%':
                  raise SystemExit(f'{path} missing SVG accessibility/layout attributes')
              tags = {elem.tag.split('}')[-1] for elem in root.iter()}
              if 'title' not in tags or 'desc' not in tags or path.name not in chapter:
                  raise SystemExit(f'{path} missing title/desc or body reference')

          print(f'Chapter 11 static alignment passed with {len(numbered)} body sections and asset version {version}')
          PY

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create Chapter 11 test database
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE ai_database_book;"
          test "$(psql -d postgres -Atc "SELECT current_setting('server_version_num')::int / 10000")" = "16"

      - name: Verify wrong database and restore guards
        shell: bash
        run: |
          set +e
          psql -v ON_ERROR_STOP=1 -d postgres -f code/chapter11/01_security_lab_schema.sql > /tmp/ch11_wrong_db.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "ai_database_book" /tmp/ch11_wrong_db.log
          test "$(psql -d postgres -Atc "SELECT to_regnamespace('security_lab') IS NULL")" = "t"

      - name: Build Chapter 07 and verify Chapter 08 baseline
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter07/01_course_project_schema.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter07/02_course_project_seed.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter07/03_course_project_changes.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter07/04_course_project_validation.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter08/00_check_course_project.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter08/03_join_aggregation_validation.sql

      - name: Capture protected project fingerprint
        shell: bash
        run: |
          psql -d ai_database_book -Atc "
            SELECT md5(
              (SELECT jsonb_agg(to_jsonb(s) ORDER BY id)::text FROM course_project.students AS s) ||
              (SELECT jsonb_agg(to_jsonb(i) ORDER BY id)::text FROM course_project.instructors AS i) ||
              (SELECT jsonb_agg(to_jsonb(c) ORDER BY id)::text FROM course_project.courses AS c) ||
              (SELECT jsonb_agg(to_jsonb(e) ORDER BY id)::text FROM course_project.enrollments AS e)
            );
          " > /tmp/ch11_project_fingerprint.txt
          cat /tmp/ch11_project_fingerprint.txt

      - name: Run Chapter 11 schema and seed
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter11/01_security_lab_schema.sql 2>&1 | tee /tmp/ch11_01.log
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter11/02_security_lab_seed.sql 2>&1 | tee /tmp/ch11_02.log
          grep -q "Chapter 11 security lab schema validation passed" /tmp/ch11_01.log
          grep -q "Chapter 11 security lab seed validation passed" /tmp/ch11_02.log
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter11/security_backup_check.sql

          set +e
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter11/06_restore_validation.sql > /tmp/ch11_wrong_restore_db.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "ai_database_book_restore" /tmp/ch11_wrong_restore_db.log

      - name: Create Chapter 11 roles and grants
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book <<'SQL'
          CREATE ROLE lab_role_security_owner NOLOGIN;
          CREATE ROLE lab_role_report_reader NOLOGIN;
          CREATE ROLE lab_role_enrollment_app NOLOGIN;
          CREATE ROLE lab_role_backup_reader NOLOGIN;
          CREATE ROLE lab_readonly_user LOGIN;
          CREATE ROLE lab_enrollment_user LOGIN;
          CREATE ROLE lab_backup_user LOGIN;

          GRANT lab_role_report_reader TO lab_readonly_user
              WITH INHERIT TRUE, SET TRUE;
          GRANT lab_role_enrollment_app TO lab_enrollment_user
              WITH INHERIT TRUE, SET TRUE;
          GRANT lab_role_backup_reader TO lab_backup_user
              WITH INHERIT TRUE, SET TRUE;

          GRANT CONNECT ON DATABASE ai_database_book
          TO lab_role_report_reader, lab_role_enrollment_app, lab_role_backup_reader;

          GRANT USAGE ON SCHEMA security_lab
          TO lab_role_report_reader, lab_role_enrollment_app, lab_role_backup_reader;

          GRANT SELECT ON TABLE
              security_lab.students,
              security_lab.courses,
              security_lab.enrollments
          TO lab_role_report_reader, lab_role_enrollment_app, lab_role_backup_reader;

          GRANT INSERT ON TABLE security_lab.enrollments
          TO lab_role_enrollment_app;

          GRANT UPDATE (status) ON TABLE security_lab.enrollments
          TO lab_role_enrollment_app;

          GRANT USAGE ON SEQUENCE security_lab.enrollments_id_seq
          TO lab_role_enrollment_app;

          GRANT SELECT ON SEQUENCE
              security_lab.students_id_seq,
              security_lab.courses_id_seq,
              security_lab.enrollments_id_seq
          TO lab_role_backup_reader;
          SQL

      - name: Verify PostgreSQL 16 memberships and effective privileges
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter11/04_permission_checks.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book <<'SQL'
          DO $$
          DECLARE
              v_membership_count INTEGER;
              v_bad_role_count INTEGER;
              v_rls_count INTEGER;
          BEGIN
              SELECT COUNT(*) INTO v_membership_count
              FROM pg_auth_members AS m
              JOIN pg_roles AS granted ON granted.oid = m.roleid
              JOIN pg_roles AS member ON member.oid = m.member
              WHERE (granted.rolname, member.rolname) IN (
                  ('lab_role_report_reader', 'lab_readonly_user'),
                  ('lab_role_enrollment_app', 'lab_enrollment_user'),
                  ('lab_role_backup_reader', 'lab_backup_user')
              )
                AND m.inherit_option
                AND m.set_option
                AND NOT m.admin_option;

              SELECT COUNT(*) INTO v_bad_role_count
              FROM pg_roles
              WHERE rolname IN (
                  'lab_role_security_owner', 'lab_role_report_reader',
                  'lab_role_enrollment_app', 'lab_role_backup_reader',
                  'lab_readonly_user', 'lab_enrollment_user', 'lab_backup_user'
              )
                AND (rolsuper OR rolcreatedb OR rolcreaterole);

              SELECT COUNT(*) INTO v_rls_count
              FROM pg_class AS c
              JOIN pg_namespace AS n ON n.oid = c.relnamespace
              WHERE n.nspname = 'security_lab'
                AND c.relkind = 'r'
                AND (c.relrowsecurity OR c.relforcerowsecurity);

              IF v_membership_count <> 3 OR v_bad_role_count <> 0 OR v_rls_count <> 0 THEN
                  RAISE EXCEPTION 'membership/role/RLS validation failed: %/%/%',
                      v_membership_count, v_bad_role_count, v_rls_count;
              END IF;

              IF NOT pg_has_role('lab_readonly_user', 'lab_role_report_reader', 'MEMBER')
                 OR NOT pg_has_role('lab_readonly_user', 'lab_role_report_reader', 'USAGE')
                 OR NOT pg_has_role('lab_enrollment_user', 'lab_role_enrollment_app', 'MEMBER')
                 OR NOT pg_has_role('lab_enrollment_user', 'lab_role_enrollment_app', 'USAGE')
                 OR NOT pg_has_role('lab_backup_user', 'lab_role_backup_reader', 'MEMBER')
                 OR NOT pg_has_role('lab_backup_user', 'lab_role_backup_reader', 'USAGE') THEN
                  RAISE EXCEPTION 'membership MEMBER/USAGE validation failed';
              END IF;

              IF NOT has_table_privilege('lab_readonly_user', 'security_lab.enrollments', 'SELECT')
                 OR has_table_privilege('lab_readonly_user', 'security_lab.enrollments', 'INSERT')
                 OR has_table_privilege('lab_readonly_user', 'security_lab.enrollments', 'UPDATE')
                 OR has_table_privilege('lab_readonly_user', 'security_lab.enrollments', 'DELETE') THEN
                  RAISE EXCEPTION 'readonly effective privileges are incorrect';
              END IF;

              IF NOT has_table_privilege('lab_enrollment_user', 'security_lab.enrollments', 'SELECT')
                 OR NOT has_table_privilege('lab_enrollment_user', 'security_lab.enrollments', 'INSERT')
                 OR has_table_privilege('lab_enrollment_user', 'security_lab.enrollments', 'UPDATE')
                 OR NOT has_column_privilege('lab_enrollment_user', 'security_lab.enrollments', 'status', 'UPDATE')
                 OR has_column_privilege('lab_enrollment_user', 'security_lab.enrollments', 'recorded_amount', 'UPDATE')
                 OR has_table_privilege('lab_enrollment_user', 'security_lab.enrollments', 'DELETE')
                 OR NOT has_sequence_privilege('lab_enrollment_user', 'security_lab.enrollments_id_seq', 'USAGE')
                 OR has_sequence_privilege('lab_enrollment_user', 'security_lab.enrollments_id_seq', 'SELECT') THEN
                  RAISE EXCEPTION 'application effective privileges are incorrect';
              END IF;

              IF NOT has_table_privilege('lab_backup_user', 'security_lab.students', 'SELECT')
                 OR NOT has_table_privilege('lab_backup_user', 'security_lab.courses', 'SELECT')
                 OR NOT has_table_privilege('lab_backup_user', 'security_lab.enrollments', 'SELECT')
                 OR has_table_privilege('lab_backup_user', 'security_lab.enrollments', 'INSERT')
                 OR NOT has_sequence_privilege('lab_backup_user', 'security_lab.students_id_seq', 'SELECT')
                 OR NOT has_sequence_privilege('lab_backup_user', 'security_lab.courses_id_seq', 'SELECT')
                 OR NOT has_sequence_privilege('lab_backup_user', 'security_lab.enrollments_id_seq', 'SELECT') THEN
                  RAISE EXCEPTION 'backup effective privileges are incorrect';
              END IF;

              RAISE NOTICE 'Chapter 11 effective permission validation passed';
          END
          $$;
          SQL

      - name: Run allowed permission behavior tests
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter11/05_permission_behavior_tests.sql 2>&1 | tee /tmp/ch11_05.log
          grep -q "Chapter 11 permission behavior baseline preserved" /tmp/ch11_05.log

      - name: Verify denied permission behavior
        shell: bash
        run: |
          expect_denied() {
            local label="$1"
            local role="$2"
            local sql="$3"
            set +e
            psql -v ON_ERROR_STOP=1 -d ai_database_book -c "SET ROLE ${role}; ${sql}" > "/tmp/${label}.log" 2>&1
            local status=$?
            set -e
            test "$status" -ne 0
            grep -qi "permission denied" "/tmp/${label}.log"
          }

          expect_denied ch11_readonly_insert lab_readonly_user "INSERT INTO security_lab.enrollments (student_id, course_id, status, recorded_amount, enrolled_at) VALUES (102, 201, '신청', 100000, CURRENT_DATE);"
          expect_denied ch11_readonly_update lab_readonly_user "UPDATE security_lab.enrollments SET status='완료' WHERE id=1001;"
          expect_denied ch11_readonly_delete lab_readonly_user "DELETE FROM security_lab.enrollments WHERE id=1001;"
          expect_denied ch11_app_amount_update lab_enrollment_user "UPDATE security_lab.enrollments SET recorded_amount=0 WHERE id=1001;"
          expect_denied ch11_app_delete lab_enrollment_user "DELETE FROM security_lab.enrollments WHERE id=1001;"
          expect_denied ch11_app_create lab_enrollment_user "CREATE TABLE security_lab.denied_table(id integer);"

          test "$(psql -d ai_database_book -Atc "SELECT COUNT(*) FROM security_lab.students")" = "3"
          test "$(psql -d ai_database_book -Atc "SELECT COUNT(*) FROM security_lab.courses")" = "3"
          test "$(psql -d ai_database_book -Atc "SELECT COUNT(*) FROM security_lab.enrollments")" = "3"
          test "$(psql -d ai_database_book -Atc "SELECT SUM(recorded_amount) FROM security_lab.enrollments")" = "310000"

      - name: Create custom archive with minimum backup role
        shell: bash
        run: |
          pg_dump \
            -U postgres \
            --role=lab_backup_user \
            -d ai_database_book \
            -Fc \
            --schema=security_lab \
            -f /tmp/security_lab.backup

          test -s /tmp/security_lab.backup
          pg_restore --list /tmp/security_lab.backup > /tmp/security_lab.list
          grep -q "SCHEMA.*security_lab" /tmp/security_lab.list
          grep -q "TABLE security_lab students" /tmp/security_lab.list
          grep -q "TABLE security_lab courses" /tmp/security_lab.list
          grep -q "TABLE security_lab enrollments" /tmp/security_lab.list
          grep -q "SEQUENCE security_lab students_id_seq" /tmp/security_lab.list
          grep -q "SEQUENCE security_lab courses_id_seq" /tmp/security_lab.list
          grep -q "SEQUENCE security_lab enrollments_id_seq" /tmp/security_lab.list
          grep -q "SEQUENCE SET security_lab students_id_seq" /tmp/security_lab.list
          grep -q "SEQUENCE SET security_lab courses_id_seq" /tmp/security_lab.list
          grep -q "SEQUENCE SET security_lab enrollments_id_seq" /tmp/security_lab.list
          grep -q "INDEX security_lab uq_security_enrollments_active" /tmp/security_lab.list
          grep -q "ACL" /tmp/security_lab.list
          sha256sum /tmp/security_lab.backup | tee /tmp/security_lab.sha256

      - name: Restore custom archive to isolated database
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE ROLE lab_restore_user NOLOGIN;"
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE ai_database_book_restore OWNER lab_restore_user TEMPLATE template0;"

          pg_restore \
            -U postgres \
            --role=lab_restore_user \
            -d ai_database_book_restore \
            --single-transaction \
            --no-owner \
            --no-privileges \
            /tmp/security_lab.backup

          test "$(psql -d ai_database_book_restore -Atc "SELECT to_regnamespace('course_project') IS NULL")" = "t"

      - name: Run isolated restore validation
        shell: bash
        run: |
          { echo "SET ROLE lab_restore_user;"; cat code/chapter11/06_restore_validation.sql; } \
            | psql -v ON_ERROR_STOP=1 -d ai_database_book_restore 2>&1 \
            | tee /tmp/ch11_restore_validation.log
          grep -q "Chapter 11 restore structure and data validation passed" /tmp/ch11_restore_validation.log

      - name: Verify source data and protected project remain unchanged
        shell: bash
        run: |
          test "$(psql -d ai_database_book -Atc "SELECT COUNT(*) FROM security_lab.students")" = "3"
          test "$(psql -d ai_database_book -Atc "SELECT COUNT(*) FROM security_lab.courses")" = "3"
          test "$(psql -d ai_database_book -Atc "SELECT COUNT(*) FROM security_lab.enrollments")" = "3"
          test "$(psql -d ai_database_book -Atc "SELECT SUM(recorded_amount) FROM security_lab.enrollments")" = "310000"

          psql -d ai_database_book -Atc "
            SELECT md5(
              (SELECT jsonb_agg(to_jsonb(s) ORDER BY id)::text FROM course_project.students AS s) ||
              (SELECT jsonb_agg(to_jsonb(i) ORDER BY id)::text FROM course_project.instructors AS i) ||
              (SELECT jsonb_agg(to_jsonb(c) ORDER BY id)::text FROM course_project.courses AS c) ||
              (SELECT jsonb_agg(to_jsonb(e) ORDER BY id)::text FROM course_project.enrollments AS e)
            );
          " > /tmp/ch11_project_fingerprint_after.txt
          diff -u /tmp/ch11_project_fingerprint.txt /tmp/ch11_project_fingerprint_after.txt

      - name: Verify reset atomicity and isolation
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book -c "CREATE TABLE security_lab.keep_me(id integer);"

          set +e
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter11/reset_security_lab.sql > /tmp/ch11_reset_blocked.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -qi "cannot drop schema security_lab" /tmp/ch11_reset_blocked.log
          test "$(psql -d ai_database_book -Atc "SELECT to_regclass('security_lab.students') IS NOT NULL")" = "t"
          test "$(psql -d ai_database_book -Atc "SELECT to_regclass('security_lab.courses') IS NOT NULL")" = "t"
          test "$(psql -d ai_database_book -Atc "SELECT to_regclass('security_lab.enrollments') IS NOT NULL")" = "t"
          test "$(psql -d ai_database_book -Atc "SELECT to_regclass('security_lab.keep_me') IS NOT NULL")" = "t"

          psql -v ON_ERROR_STOP=1 -d ai_database_book -c "DROP TABLE security_lab.keep_me;"
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter11/reset_security_lab.sql 2>&1 | tee /tmp/ch11_reset.log
          grep -q "Chapter 11 security lab reset passed" /tmp/ch11_reset.log
          test "$(psql -d ai_database_book -Atc "SELECT to_regnamespace('security_lab') IS NULL")" = "t"

          psql -d ai_database_book -Atc "
            SELECT md5(
              (SELECT jsonb_agg(to_jsonb(s) ORDER BY id)::text FROM course_project.students AS s) ||
              (SELECT jsonb_agg(to_jsonb(i) ORDER BY id)::text FROM course_project.instructors AS i) ||
              (SELECT jsonb_agg(to_jsonb(c) ORDER BY id)::text FROM course_project.courses AS c) ||
              (SELECT jsonb_agg(to_jsonb(e) ORDER BY id)::text FROM course_project.enrollments AS e)
            );
          " > /tmp/ch11_project_fingerprint_reset.txt
          diff -u /tmp/ch11_project_fingerprint.txt /tmp/ch11_project_fingerprint_reset.txt
          test "$(psql -d ai_database_book -Atc "SELECT COUNT(*) FROM pg_roles WHERE rolname IN ('lab_role_security_owner','lab_role_report_reader','lab_role_enrollment_app','lab_role_backup_reader','lab_readonly_user','lab_enrollment_user','lab_backup_user')")" = "7"
