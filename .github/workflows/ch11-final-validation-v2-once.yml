name: Chapter 11 final publication validation v2 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ch11-final-validation-v2-once.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Final static checks
        shell: bash
        run: |
          node --check presentation/chapter11/chapter11_slides.js
          node --check presentation/chapter11/chapter11_navigation.js
          node --check presentation/chapter11/chapter11_player.js
          node --check presentation/chapter11/chapter11_script.js
          python - <<'PY'
          from pathlib import Path
          import re

          chapter = Path('book/chapter11/chapter11.md').read_text(encoding='utf-8')
          schema = Path('code/chapter11/01_security_lab_schema.sql').read_text(encoding='utf-8')
          readme = Path('code/chapter11/README.md').read_text(encoding='utf-8')
          runbook = Path('code/chapter11/BACKUP_RESTORE_RUNBOOK.md').read_text(encoding='utf-8')
          script_html = Path('presentation/chapter11/chapter11_script.html').read_text(encoding='utf-8')

          numbered = [int(x) for x in re.findall(r'^##\s+(\d+)\.\s+', chapter, re.M)]
          assert numbered == list(range(1, 29)), numbered
          for token in ['명명 제약조건 15개', 'NOT NULL 열 20개', 'chmod 0600', 'PGPASSFILE']:
              assert token in chapter, token
          for token in [
              "has_database_privilege(current_user, current_database(), 'CREATE')",
              'v_project_named_constraint_count <> 15',
              'v_project_not_null_count <> 20',
          ]:
              assert token in schema, token
          assert schema.find('DO $$') < schema.find('BEGIN;')
          for source in [readme, runbook]:
              assert 'chmod 0600' in source
              assert 'PGPASSFILE' in source
          assert 'data-script-content-enhancer="off"' in script_html
          print('Chapter 11 v2 static checks passed')
          PY

      - name: Install PostgreSQL 16 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          test "$(pg_dump --version | awk '{print $3}' | cut -d. -f1)" = "16"

      - name: Create canonical database and Chapter 07 baseline
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE ai_database_book;"
          test "$(psql -d postgres -Atc "SELECT current_setting('server_version_num')::int / 10000")" = "16"
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter07/01_course_project_schema.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter07/02_course_project_seed.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter07/03_course_project_changes.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter07/04_course_project_validation.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter08/00_check_course_project.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter08/03_join_aggregation_validation.sql

      - name: Verify inherited 15 and 20 structure contract
        shell: bash
        run: |
          STRUCTURE=$(psql -d ai_database_book -At -v ON_ERROR_STOP=1 <<'SQL'
          SELECT
            (SELECT COUNT(*) FROM pg_constraint
             WHERE conrelid IN (
               'course_project.students'::regclass,
               'course_project.instructors'::regclass,
               'course_project.courses'::regclass,
               'course_project.enrollments'::regclass)
             AND conname IN (
               'uq_course_students_email','chk_course_students_name_not_blank','chk_course_students_email_not_blank',
               'uq_course_instructors_email','chk_course_instructors_name_not_blank','chk_course_instructors_email_not_blank',
               'chk_course_instructors_specialty_not_blank','fk_course_courses_instructor','chk_course_courses_title_not_blank',
               'chk_course_courses_level','chk_course_courses_price','fk_course_enrollments_student','fk_course_enrollments_course',
               'chk_course_enrollments_status','chk_course_enrollments_recorded_amount')) || ':' ||
            (SELECT COUNT(*) FROM information_schema.columns
             WHERE table_schema='course_project'
               AND table_name IN ('students','instructors','courses','enrollments')
               AND is_nullable='NO');
          SQL
          )
          echo "$STRUCTURE"
          test "$STRUCTURE" = "15:20"

      - name: Verify CREATE privilege preflight blocks before DDL
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book <<'SQL'
          CREATE ROLE ch11_no_create LOGIN PASSWORD 'chapter11-test';
          GRANT CONNECT ON DATABASE ai_database_book TO ch11_no_create;
          REVOKE CREATE ON DATABASE ai_database_book FROM ch11_no_create;
          GRANT USAGE ON SCHEMA course_project TO ch11_no_create;
          GRANT SELECT ON ALL TABLES IN SCHEMA course_project TO ch11_no_create;
          SQL
          set +e
          PGUSER=ch11_no_create PGPASSWORD=chapter11-test psql -h localhost -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter11/01_security_lab_schema.sql > /tmp/ch11_no_create.log 2>&1
          status=$?
          set -e
          cat /tmp/ch11_no_create.log
          test "$status" -ne 0
          grep -q "CREATE 권한" /tmp/ch11_no_create.log
          test "$(psql -d ai_database_book -Atc "SELECT to_regnamespace('security_lab') IS NULL")" = "t"

      - name: Capture protected project fingerprint
        run: |
          psql -d ai_database_book -Atc "SELECT md5((SELECT jsonb_agg(to_jsonb(s) ORDER BY id)::text FROM course_project.students s)||(SELECT jsonb_agg(to_jsonb(i) ORDER BY id)::text FROM course_project.instructors i)||(SELECT jsonb_agg(to_jsonb(c) ORDER BY id)::text FROM course_project.courses c)||(SELECT jsonb_agg(to_jsonb(e) ORDER BY id)::text FROM course_project.enrollments e));" > /tmp/ch11_project_before.txt

      - name: Build and validate security lab
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter11/01_security_lab_schema.sql 2>&1 | tee /tmp/ch11_01.log
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter11/02_security_lab_seed.sql 2>&1 | tee /tmp/ch11_02.log
          grep -q "Chapter 11 security lab schema validation passed" /tmp/ch11_01.log
          grep -q "Chapter 11 security lab seed validation passed" /tmp/ch11_02.log
          test "$(psql -d ai_database_book -Atc "SELECT (SELECT count(*) FROM security_lab.students)||':'||(SELECT count(*) FROM security_lab.courses)||':'||(SELECT count(*) FROM security_lab.enrollments)||':'||(SELECT sum(recorded_amount) FROM security_lab.enrollments)")" = "3:3:3:310000"

      - name: Create roles and minimum grants
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book <<'SQL'
          CREATE ROLE lab_role_security_owner NOLOGIN;
          CREATE ROLE lab_role_report_reader NOLOGIN;
          CREATE ROLE lab_role_enrollment_app NOLOGIN;
          CREATE ROLE lab_role_backup_reader NOLOGIN;
          CREATE ROLE lab_readonly_user LOGIN;
          CREATE ROLE lab_enrollment_user LOGIN;
          CREATE ROLE lab_backup_user LOGIN;
          GRANT lab_role_report_reader TO lab_readonly_user WITH INHERIT TRUE, SET TRUE;
          GRANT lab_role_enrollment_app TO lab_enrollment_user WITH INHERIT TRUE, SET TRUE;
          GRANT lab_role_backup_reader TO lab_backup_user WITH INHERIT TRUE, SET TRUE;
          GRANT CONNECT ON DATABASE ai_database_book TO lab_role_report_reader, lab_role_enrollment_app, lab_role_backup_reader;
          GRANT USAGE ON SCHEMA security_lab TO lab_role_report_reader, lab_role_enrollment_app, lab_role_backup_reader;
          GRANT SELECT ON TABLE security_lab.students, security_lab.courses, security_lab.enrollments TO lab_role_report_reader, lab_role_enrollment_app, lab_role_backup_reader;
          GRANT INSERT ON TABLE security_lab.enrollments TO lab_role_enrollment_app;
          GRANT UPDATE (status) ON TABLE security_lab.enrollments TO lab_role_enrollment_app;
          GRANT USAGE ON SEQUENCE security_lab.enrollments_id_seq TO lab_role_enrollment_app;
          GRANT SELECT ON SEQUENCE security_lab.students_id_seq, security_lab.courses_id_seq, security_lab.enrollments_id_seq TO lab_role_backup_reader;
          SQL
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter11/04_permission_checks.sql

      - name: Verify allowed and denied behavior
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter11/05_permission_behavior_tests.sql 2>&1 | tee /tmp/ch11_05.log
          grep -q "Chapter 11 permission behavior baseline preserved" /tmp/ch11_05.log
          expect_denied() {
            local role="$1"; local sql="$2"; local log="$3"
            set +e
            psql -v ON_ERROR_STOP=1 -d ai_database_book -c "SET ROLE ${role}; ${sql}" > "$log" 2>&1
            local status=$?
            set -e
            test "$status" -ne 0
            grep -qi "permission denied" "$log"
          }
          expect_denied lab_readonly_user "INSERT INTO security_lab.enrollments(student_id,course_id,status,recorded_amount,enrolled_at) VALUES(102,201,'신청',100000,CURRENT_DATE);" /tmp/readonly.log
          expect_denied lab_enrollment_user "UPDATE security_lab.enrollments SET recorded_amount=0 WHERE id=1001;" /tmp/app_amount.log
          expect_denied lab_enrollment_user "DELETE FROM security_lab.enrollments WHERE id=1001;" /tmp/app_delete.log
          expect_denied lab_enrollment_user "CREATE TABLE security_lab.denied_table(id integer);" /tmp/app_create.log

      - name: Verify protected password file mode
        shell: bash
        run: |
          printf '%s\n' 'localhost:5432:ai_database_book:lab_backup_user:not-a-real-book-password' > /tmp/ch11_pgpass
          chmod 0600 /tmp/ch11_pgpass
          test "$(stat -c '%a' /tmp/ch11_pgpass)" = "600"

      - name: Create custom archive using backup role
        shell: bash
        run: |
          pg_dump -U postgres --role=lab_backup_user -d ai_database_book -Fc --schema=security_lab -f /tmp/security_lab.backup
          test -s /tmp/security_lab.backup
          pg_restore --list /tmp/security_lab.backup > /tmp/security_lab.list
          grep -q "SCHEMA.*security_lab" /tmp/security_lab.list
          grep -q "TABLE security_lab students" /tmp/security_lab.list
          grep -q "TABLE security_lab courses" /tmp/security_lab.list
          grep -q "TABLE security_lab enrollments" /tmp/security_lab.list
          grep -q "SEQUENCE security_lab students_id_seq" /tmp/security_lab.list
          grep -q "SEQUENCE security_lab courses_id_seq" /tmp/security_lab.list
          grep -q "SEQUENCE security_lab enrollments_id_seq" /tmp/security_lab.list
          grep -q "INDEX security_lab uq_security_enrollments_active" /tmp/security_lab.list
          sha256sum /tmp/security_lab.backup | tee /tmp/security_lab.sha256

      - name: Restore custom archive and validate
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE ROLE lab_restore_user NOLOGIN;"
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE ai_database_book_restore OWNER lab_restore_user TEMPLATE template0;"
          pg_restore -U postgres --role=lab_restore_user -d ai_database_book_restore --single-transaction --no-owner --no-privileges /tmp/security_lab.backup
          { echo "SET ROLE lab_restore_user;"; cat code/chapter11/06_restore_validation.sql; } | psql -v ON_ERROR_STOP=1 -d ai_database_book_restore 2>&1 | tee /tmp/ch11_restore.log
          grep -q "Chapter 11 restore structure and data validation passed" /tmp/ch11_restore.log
          test "$(psql -d ai_database_book_restore -Atc "SELECT to_regnamespace('course_project') IS NULL")" = "t"

      - name: Verify original data and reset isolation
        shell: bash
        run: |
          psql -d ai_database_book -Atc "SELECT md5((SELECT jsonb_agg(to_jsonb(s) ORDER BY id)::text FROM course_project.students s)||(SELECT jsonb_agg(to_jsonb(i) ORDER BY id)::text FROM course_project.instructors i)||(SELECT jsonb_agg(to_jsonb(c) ORDER BY id)::text FROM course_project.courses c)||(SELECT jsonb_agg(to_jsonb(e) ORDER BY id)::text FROM course_project.enrollments e));" > /tmp/ch11_project_after.txt
          diff -u /tmp/ch11_project_before.txt /tmp/ch11_project_after.txt
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter11/reset_security_lab.sql 2>&1 | tee /tmp/ch11_reset.log
          grep -q "Chapter 11 security lab reset passed" /tmp/ch11_reset.log
          test "$(psql -d ai_database_book -Atc "SELECT to_regnamespace('security_lab') IS NULL")" = "t"
          psql -d ai_database_book -Atc "SELECT md5((SELECT jsonb_agg(to_jsonb(s) ORDER BY id)::text FROM course_project.students s)||(SELECT jsonb_agg(to_jsonb(i) ORDER BY id)::text FROM course_project.instructors i)||(SELECT jsonb_agg(to_jsonb(c) ORDER BY id)::text FROM course_project.courses c)||(SELECT jsonb_agg(to_jsonb(e) ORDER BY id)::text FROM course_project.enrollments e));" > /tmp/ch11_project_reset.txt
          diff -u /tmp/ch11_project_before.txt /tmp/ch11_project_reset.txt
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter08/00_check_course_project.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter08/03_join_aggregation_validation.sql
