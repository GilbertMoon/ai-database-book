name: Apply Chapter 14 final publication patch once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ch14-final-publication-patch-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic Chapter 14 patch
        run: python scripts/ch14_final_publication_patch_v2_once.py
      - name: Remove one-off patch scripts
        run: rm -f scripts/ch14_final_publication_patch_once.py scripts/ch14_final_publication_patch_v2_once.py
      - name: Commit Chapter 14 final publication changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add book/chapter14 code/chapter14 images/chapter14 presentation/chapter14 notes/chapter14_review_checklist.md publish/full_manuscript.md .github/workflows/validate-chapter14.yml .github/workflows/validate-chapter14-publishing.yml
          git add -u scripts/ch14_final_publication_patch_once.py scripts/ch14_final_publication_patch_v2_once.py
          git commit -m 'Refine Chapter 14 final publication content'
          git push
