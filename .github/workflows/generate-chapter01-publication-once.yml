name: Generate Chapter 01 publication HTML and JPG assets once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-chapter01-publication-once.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install publication dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk libcairo2
          python -m pip install --upgrade pillow markdown cairosvg
      - name: Generate Chapter 01 publication files
        run: python scripts/generate_chapter01_publication.py
      - name: Validate Chapter 01 publication output
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          html_path = Path('book/chapter01/chapter01.html')
          html = html_path.read_text(encoding='utf-8')
          required = [
              'AI 시대에 데이터베이스를 왜 배워야 하는가',
              '실행 성공 ≠ 올바른 결과',
              'AI가 만든 SQL은 정답이 아니라 검토할 변경 후보이다.',
              'ch01_01_storage_options.jpg',
              'ch01_04_ai_result_verification_cycle.jpg',
              '@media print',
              'size:A4',
          ]
          for token in required:
              if token not in html:
                  raise SystemExit(f'missing Chapter 01 publication token: {token}')

          if html.count('<h2') < 12:
              raise SystemExit('Chapter 01 HTML lost too many major sections')

          for name in [
              'images/chapter01/ch01_01_storage_options.jpg',
              'images/chapter01/ch01_04_ai_result_verification_cycle.jpg',
          ]:
              p = Path(name)
              if not p.exists() or p.stat().st_size < 30000:
                  raise SystemExit(f'invalid Chapter 01 JPG: {name}')
              with Image.open(p) as im:
                  if im.format != 'JPEG' or im.width != 1600:
                      raise SystemExit(f'unexpected image metadata: {name} {im.size} {im.format}')

          if '.svg' in html:
              raise SystemExit('Chapter 01 publication HTML still contains SVG references')

          print('Chapter 01 publication HTML/JPG validation passed')
          PY
      - name: Commit generated Chapter 01 publication files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add book/chapter01/chapter01.html images/chapter01/ch01_01_storage_options.jpg images/chapter01/ch01_04_ai_result_verification_cycle.jpg
          git commit -m 'Generate Chapter 01 publication HTML and JPG assets'
          git push
