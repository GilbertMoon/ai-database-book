name: Apply Chapter 12 final publication review once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ch12-final-publication-review-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Align Cassandra presentation source for deterministic patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('presentation/chapter12/chapter12_theory_lecture_plan.md')
          text = path.read_text(encoding='utf-8')
          marker = '새로운 조회 패턴이 생기면 기존 구조 하나로 해결되지 않을 수 있습니다. 별도 파생 테이블이나 파이프라인이 필요할 수 있다는 점을 고려해야 합니다.'
          bridge = '이 용어는 Cassandra 계열 중심 예시입니다. 다른 제품에 그대로 적용되는 공식이라고 생각하면 안 됩니다.'
          if bridge not in text:
              if text.count(marker) != 1:
                  raise SystemExit('Cassandra presentation marker mismatch')
              text = text.replace(marker, marker + '\n\n' + bridge, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Apply Chapter 12 publication review
        run: python scripts/ch12_final_publication_review_once.py
      - name: Remove one-off patch script
        run: rm -f scripts/ch12_final_publication_review_once.py
      - name: Regenerate full manuscript
        run: python scripts/merge_chapters.py
      - name: Check Chapter 12 JavaScript syntax
        run: |
          node --check presentation/chapter12/chapter12_slides.js
          node --check presentation/chapter12/chapter12_navigation.js
          node --check presentation/chapter12/chapter12_player.js
          node --check presentation/chapter12/chapter12_script.js
      - name: Commit reviewed Chapter 12
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add book/chapter12 code/chapter12 presentation/chapter12 notes/chapter12_review_checklist.md publish/full_manuscript.md
          git add -u scripts/ch12_final_publication_review_once.py
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Refine Chapter 12 final publication content'
          git push
