name: Clean final Chapter 13 publishing wording

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ch13-final-content-cleanup.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean Chapter 13 wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = (
              list(Path('book/chapter13').glob('*.md'))
              + list(Path('code/chapter13').glob('*.md'))
              + list(Path('images/chapter13').glob('*.md'))
              + list(Path('presentation/chapter13').glob('*.md'))
              + [Path('notes/chapter13_review_checklist.md')]
          )
          replacements = [
              ('외부 비민감 payment_reference만 저장', '원시 카드정보 대신 가상 payment_reference를 저장하고 실제 참조값의 보호 수준은 조직 정책으로 결정'),
              ('카드번호 미저장·외부 비민감 reference', '원시 카드정보 미저장·가상 외부 reference 사용'),
              ('외부 결제 시스템이 발급한 비민감 가상 참조값', '이 실습에서 사용하는 가상 외부 결제 참조값'),
              ('비민감한 외부 결제 참조값', '가상 외부 결제 참조값'),
              ('비민감 외부 결제 참조값', '가상 외부 결제 참조값'),
              ('신청 시점 신청 시점 기록 금액', '신청 시점 기록 금액'),
              ('경계값 5개', '경계값 6개'),
              ('정상 경계값 5개', '정상 경계값 6개'),
              ('전체 27 / 통과 27', '전체 30 / 통과 30'),
              ('전체 27개', '전체 30개'),
              ('27/27', '30/30'),
              ('Chapter 13 AI review lab validation passed`', 'Chapter 13 AI review lab validation passed: tests 30/30`'),
          ]
          for path in targets:
              if not path.exists():
                  continue
              s = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  s = s.replace(old, new)
              path.write_text(s, encoding='utf-8')

          # Correct the outline's file-role count if an old phrase remains.
          p = Path('book/chapter13/chapter13_outline.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('| 07 | SQLSTATE·constraint name 반례 24개·경계값 5개 |', '| 07 | SQLSTATE·constraint name 반례 24개·경계값 6개 |')
          p.write_text(s, encoding='utf-8')

          # The main chapter's requirement table gets the precise security wording.
          p = Path('book/chapter13/chapter13.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '| P13-R08 | 실제 카드번호를 저장하지 않는다 | 외부 비민감 `payment_reference`만 저장 | 컬럼·Seed·흐름 검토 |',
              '| P13-R08 | 실제 카드번호·CVV를 저장하지 않는다 | 가상 외부 `payment_reference`만 사용하며 실제 참조값의 보호 수준은 조직 정책으로 결정 | 컬럼·Seed·흐름 검토 |'
          )
          p.write_text(s, encoding='utf-8')

          # Verify stale publishing phrases are gone.
          problems = []
          for path in targets:
              if not path.exists():
                  continue
              s = path.read_text(encoding='utf-8')
              for bad in ['agreed_amount', '외부 비민감 payment_reference', '경계값 5개', '전체 27 / 통과 27', '27/27', '신청 시점 신청 시점']:
                  if bad in s:
                      problems.append((str(path), bad))
          if problems:
              raise SystemExit(f'Chapter 13 stale publishing wording remains: {problems}')
          PY

      - name: Commit cleanup and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ch13-final-content-cleanup.yml
          git add book/chapter13 code/chapter13 images/chapter13 presentation/chapter13 notes/chapter13_review_checklist.md
          git commit -m "Clean final Chapter 13 publishing wording"
          git push
