name: Validate Chapter 12

on:
  push:
    branches: [main]
    paths:
      - book/chapter12/**
      - code/chapter12/**
      - images/chapter12/**
      - presentation/chapter12/**
      - presentation/common/tts_pronunciation.js
      - presentation/common/script_content_enhancer.js
      - notes/chapter12_review_checklist.md
      - .github/workflows/validate-chapter12.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Chapter 12 JavaScript syntax
        run: |
          node --check presentation/chapter12/chapter12_slides.js
          node --check presentation/chapter12/chapter12_navigation.js
          node --check presentation/chapter12/chapter12_player.js
          node --check presentation/chapter12/chapter12_script.js
          node --check presentation/common/tts_pronunciation.js
          node --check presentation/common/script_content_enhancer.js

      - name: Check Chapter 12 source alignment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          chapter = Path('book/chapter12/chapter12.md').read_text(encoding='utf-8')
          outline = Path('book/chapter12/chapter12_outline.md').read_text(encoding='utf-8')
          activity = Path('book/chapter12/chapter12_activity.md').read_text(encoding='utf-8')
          theory = Path('presentation/chapter12/chapter12_theory_lecture_plan.md').read_text(encoding='utf-8')
          practice = Path('presentation/chapter12/chapter12_practice_lecture_plan.md').read_text(encoding='utf-8')
          nav = Path('presentation/chapter12/chapter12_navigation.js').read_text(encoding='utf-8')
          slides_js = Path('presentation/chapter12/chapter12_slides.js').read_text(encoding='utf-8')
          player_js = Path('presentation/chapter12/chapter12_player.js').read_text(encoding='utf-8')
          script_js = Path('presentation/chapter12/chapter12_script.js').read_text(encoding='utf-8')
          script_html = Path('presentation/chapter12/chapter12_script.html').read_text(encoding='utf-8')
          theory_html = Path('presentation/chapter12/chapter12_theory_presentation.html').read_text(encoding='utf-8')
          practice_html = Path('presentation/chapter12/chapter12_practice_presentation.html').read_text(encoding='utf-8')
          code_readme = Path('code/chapter12/README.md').read_text(encoding='utf-8')
          image_readme = Path('images/chapter12/README.md').read_text(encoding='utf-8')

          numbered = [int(x) for x in re.findall(r'^##\s+(\d+)\.\s+', chapter, re.M)]
          if numbered != list(range(1, 25)):
              raise SystemExit(f'Chapter 12 body numbering mismatch: {numbered}')

          def parse_plan(label, text):
              sections = list(re.finditer(r'^##\s+(\d+)\.\s+(.+)$', text, re.M))
              nums = [int(m.group(1)) for m in sections]
              if nums != list(range(1, 21)):
                  raise SystemExit(f'{label} numbering mismatch: {nums}')
              titles = []
              for i, match in enumerate(sections):
                  end = sections[i + 1].start() if i + 1 < len(sections) else len(text)
                  block = text[match.end():end]
                  if '**화면 구성**' not in block or '**발표 스크립트**' not in block:
                      raise SystemExit(f'{label} section {match.group(1)} missing screen/script')
                  titles.append(match.group(2).strip())
              return titles

          theory_titles = parse_plan('theory', theory)
          practice_titles = parse_plan('practice', practice)
          for title in theory_titles + practice_titles:
              if title not in nav:
                  raise SystemExit(f'navigation missing title: {title}')

          stale = 'paid' + '_amount'
          published = {
              'chapter': chapter,
              'outline': outline,
              'activity': activity,
              'theory': theory,
              'practice': practice,
              'code README': code_readme,
              'image README': image_readme,
          }
          for name, text in published.items():
              if stale in text:
                  raise SystemExit(f'{name} contains stale amount term')

          for name, text in [
              ('chapter', chapter), ('outline', outline), ('activity', activity),
              ('practice', practice), ('code README', code_readme)
          ]:
              for token in ['recorded_amount', 'NUMERIC(12,0)', '590000', '340000', '440000']:
                  if token not in text:
                      raise SystemExit(f'{name} missing canonical token {token}')

          sql_root = Path('code/chapter12')
          required_sql = [
              '01_nosql_lab_schema.sql', '02_nosql_lab_seed.sql', '03_document_jsonb_queries.sql',
              '04_key_value_cache_queries.sql', '05_storage_choice_review.sql',
              '06_jsonb_index_candidates.sql', '07_nosql_lab_validation.sql',
              'reset_nosql_lab.sql', 'nosql_jsonb_practice.sql'
          ]
          sql = {}
          for filename in required_sql:
              path = sql_root / filename
              if not path.exists():
                  raise SystemExit(f'missing {path}')
              sql[filename] = path.read_text(encoding='utf-8')

          expected_messages = {
              '01_nosql_lab_schema.sql': 'Chapter 12 nosql lab schema validation passed',
              '02_nosql_lab_seed.sql': 'Chapter 12 nosql lab seed validation passed',
              '03_document_jsonb_queries.sql': 'Chapter 12 document JSONB practice passed',
              '06_jsonb_index_candidates.sql': 'Chapter 12 JSONB index candidate validation passed',
              '07_nosql_lab_validation.sql': 'Chapter 12 nosql_lab validation passed',
              'reset_nosql_lab.sql': 'Chapter 12 nosql lab reset passed',
          }
          for filename, message in expected_messages.items():
              if message not in sql[filename]:
                  raise SystemExit(f'{filename} missing success message')

          for token in ['recorded_amount', 'NUMERIC(12,0)', '590000', '340000', '440000',
                        'v_requested_count <> 2', 'v_learning_count <> 1',
                        'uq_course_enrollments_active']:
              if token not in sql['01_nosql_lab_schema.sql']:
                  raise SystemExit(f'01 missing prerequisite token {token}')

          for token in ['recorded_amount', 'poc_planned', 'candidate', 'hold',
                        'Chapter 12 nosql lab seed validation passed']:
              if token not in sql['02_nosql_lab_seed.sql']:
                  raise SystemExit(f'02 missing seed token {token}')

          for token in ['document_version = 1', "'false'::jsonb", 'ROLLBACK;',
                        'Chapter 12 optimistic document update passed inside transaction']:
              if token not in sql['03_document_jsonb_queries.sql']:
                  raise SystemExit(f'03 missing optimistic-lock token {token}')

          for token in ['BEGIN;', 'USING GIN (metadata)', "metadata #>> '{options,online}'",
                        'indisvalid', 'indisready']:
              if token not in sql['06_jsonb_index_candidates.sql']:
                  raise SystemExit(f'06 missing index token {token}')

          for token in ['constraints=25', 'not_null=26', 'recorded_amount', '590000', '340000',
                        '440000', 'indisvalid', 'indisready', 'IS DISTINCT FROM']:
              if token not in sql['07_nosql_lab_validation.sql']:
                  raise SystemExit(f'07 missing final-gate token {token}')

          reset_clean = re.sub(r'--.*$', '', sql['reset_nosql_lab.sql'], flags=re.M).upper()
          if 'CASCADE' in reset_clean:
              raise SystemExit('reset_nosql_lab.sql must not use CASCADE')
          if 'BEGIN;' not in sql['reset_nosql_lab.sql'] or 'COMMIT;' not in sql['reset_nosql_lab.sql']:
              raise SystemExit('reset_nosql_lab.sql must be explicitly transactional')

          # Old amount name is allowed only as a negative column-presence check in 01 and 07.
          for filename, text in sql.items():
              if stale not in text:
                  continue
              if filename not in {'01_nosql_lab_schema.sql', '07_nosql_lab_validation.sql'}:
                  raise SystemExit(f'{filename} contains stale amount term')
              scrubbed = text.replace("column_name = '" + stale + "'", '')
              if stale in scrubbed:
                  raise SystemExit(f'{filename} uses stale amount term outside negative schema check')

          protected = re.compile(
              r'\b(?:INSERT\s+INTO|UPDATE|DELETE\s+FROM|ALTER\s+TABLE|DROP\s+TABLE|TRUNCATE(?:\s+TABLE)?)\s+'
              r'(?:course_project|transaction_lab|performance_lab|security_lab)\.', re.I
          )
          for filename, text in sql.items():
              clean = re.sub(r'/\*.*?\*/', '', text, flags=re.S)
              clean = re.sub(r'--.*$', '', clean, flags=re.M)
              if protected.search(clean):
                  raise SystemExit(f'Chapter 12 SQL modifies protected schema: {filename}')

          if "fetch(source, { cache: 'no-store' })" not in slides_js:
              raise SystemExit('Chapter 12 slide source must bypass stale Markdown cache')
          if 'window.PresentationTTS?.normalize' not in script_js:
              raise SystemExit('Chapter 12 script must use shared TTS normalization')
          if '../common/tts_pronunciation.js' not in script_html:
              raise SystemExit('Chapter 12 script HTML missing shared TTS normalization')
          if '../common/script_content_enhancer.js' not in script_html:
              raise SystemExit('Chapter 12 script HTML missing shared content enhancer')

          player_version = re.search(r"const ASSET_VERSION = '([^']+)';", player_js)
          script_version = re.search(r"const ASSET_VERSION = '([^']+)';", script_js)
          if not player_version or not script_version or player_version.group(1) != script_version.group(1):
              raise SystemExit('Chapter 12 player/script asset versions do not match')
          version = player_version.group(1)
          if version != '20260809a':
              raise SystemExit(f'Chapter 12 asset version must be 20260809a, got {version}')
          for name, text in [('theory HTML', theory_html), ('practice HTML', practice_html), ('script HTML', script_html)]:
              if version not in text:
                  raise SystemExit(f'{name} missing asset version {version}')

          mmds = sorted(Path('images/chapter12').glob('*.mmd'))
          svgs = sorted(Path('images/chapter12').glob('*.svg'))
          if len(mmds) != 8 or len(svgs) != 8 or {p.stem for p in mmds} != {p.stem for p in svgs}:
              raise SystemExit(f'expected 8 matching Mermaid/SVG pairs, got {len(mmds)}/{len(svgs)}')
          for path in svgs:
              root = ET.fromstring(path.read_text(encoding='utf-8'))
              if root.attrib.get('role') != 'img' or root.attrib.get('width') != '100%' or not root.attrib.get('viewBox'):
                  raise SystemExit(f'{path} missing responsive/accessibility attributes')
              tags = {elem.tag.split('}')[-1] for elem in root.iter()}
              if 'title' not in tags or 'desc' not in tags:
                  raise SystemExit(f'{path} missing title/desc')
              if path.name not in chapter:
                  raise SystemExit(f'{path.name} is not referenced by Chapter 12 body')

          print(f'Chapter 12 static alignment passed: body={len(numbered)}, theory=20, practice=20, assets={len(svgs)}, version={version}')
          PY

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql --version

      - name: Create Chapter 12 test database
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE ai_database_book;"
          test "$(psql -d postgres -Atc "SELECT current_setting('server_version_num')::int / 10000")" = "16"

      - name: Verify wrong database guard
        shell: bash
        run: |
          set +e
          psql -v ON_ERROR_STOP=1 -d postgres -f code/chapter12/01_nosql_lab_schema.sql > /tmp/ch12_wrong_db.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "ai_database_book" /tmp/ch12_wrong_db.log
          test "$(psql -d postgres -Atc "SELECT to_regnamespace('nosql_lab') IS NULL")" = "t"

      - name: Build Chapter 07 and verify Chapter 08 baseline
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter07/01_course_project_schema.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter07/02_course_project_seed.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter07/03_course_project_changes.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter07/04_course_project_validation.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter08/00_check_course_project.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter08/03_join_aggregation_validation.sql

      - name: Capture protected project fingerprint
        shell: bash
        run: |
          psql -d ai_database_book -Atc "
            SELECT md5(
              (SELECT jsonb_agg(to_jsonb(s) ORDER BY id)::text FROM course_project.students AS s) ||
              (SELECT jsonb_agg(to_jsonb(i) ORDER BY id)::text FROM course_project.instructors AS i) ||
              (SELECT jsonb_agg(to_jsonb(c) ORDER BY id)::text FROM course_project.courses AS c) ||
              (SELECT jsonb_agg(to_jsonb(e) ORDER BY id)::text FROM course_project.enrollments AS e)
            );
          " > /tmp/ch12_project_fingerprint.txt
          cat /tmp/ch12_project_fingerprint.txt

      - name: Verify Chapter 12 prerequisite drift detection
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book -c "UPDATE course_project.enrollments SET recorded_amount = 120001 WHERE id = 1005;"
          set +e
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter12/01_nosql_lab_schema.sql > /tmp/ch12_prereq_drift.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -Eq "기준 상태|기록 금액|amount" /tmp/ch12_prereq_drift.log
          test "$(psql -d ai_database_book -Atc "SELECT to_regnamespace('nosql_lab') IS NULL")" = "t"
          psql -v ON_ERROR_STOP=1 -d ai_database_book -c "UPDATE course_project.enrollments SET recorded_amount = 120000 WHERE id = 1005;"
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter08/00_check_course_project.sql

      - name: Run Chapter 12 canonical path
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter12/01_nosql_lab_schema.sql 2>&1 | tee /tmp/ch12_01.log
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter12/02_nosql_lab_seed.sql 2>&1 | tee /tmp/ch12_02.log
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter12/03_document_jsonb_queries.sql 2>&1 | tee /tmp/ch12_03.log
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter12/04_key_value_cache_queries.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter12/05_storage_choice_review.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter12/06_jsonb_index_candidates.sql 2>&1 | tee /tmp/ch12_06.log
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter12/07_nosql_lab_validation.sql 2>&1 | tee /tmp/ch12_07.log
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter12/nosql_jsonb_practice.sql
          grep -q "Chapter 12 nosql lab schema validation passed" /tmp/ch12_01.log
          grep -q "Chapter 12 nosql lab seed validation passed" /tmp/ch12_02.log
          grep -q "Chapter 12 document JSONB practice passed" /tmp/ch12_03.log
          grep -q "Chapter 12 JSONB index candidate validation passed" /tmp/ch12_06.log
          grep -q "Chapter 12 nosql_lab validation passed" /tmp/ch12_07.log

      - name: Verify Chapter 12 exact final state
        shell: bash
        run: |
          test "$(psql -d ai_database_book -Atc "SELECT COUNT(*) FROM nosql_lab.course_documents")" = "3"
          test "$(psql -d ai_database_book -Atc "SELECT COUNT(*) FROM nosql_lab.key_value_cache_examples")" = "4"
          test "$(psql -d ai_database_book -Atc "SELECT COUNT(*) FROM nosql_lab.storage_choice_cases")" = "6"
          test "$(psql -d ai_database_book -Atc "SELECT COUNT(*) FROM nosql_lab.key_value_cache_examples WHERE expired_at IS NULL OR expired_at > created_at")" = "3"
          test "$(psql -d ai_database_book -Atc "SELECT COUNT(*) FROM nosql_lab.key_value_cache_examples WHERE expired_at IS NOT NULL AND expired_at <= created_at")" = "1"
          test "$(psql -d ai_database_book -Atc "SELECT COUNT(*) FROM nosql_lab.storage_choice_cases WHERE decision_status='adopted'")" = "1"
          test "$(psql -d ai_database_book -Atc "SELECT COUNT(*) FROM pg_index i JOIN pg_class c ON c.oid=i.indexrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='nosql_lab' AND c.relname IN ('idx_nosql_course_documents_metadata_gin','idx_nosql_course_documents_online') AND i.indisvalid AND i.indisready")" = "2"
          test "$(psql -d ai_database_book -Atc "SELECT metadata #>> '{options,certificate}' || ':' || document_version FROM nosql_lab.course_documents WHERE course_code='COURSE-301'")" = "true:1"

      - name: Verify stale document version is rejected without mutation
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book <<'SQL'
          DO $$
          DECLARE
              v_updated INTEGER;
          BEGIN
              UPDATE nosql_lab.course_documents
              SET document_version = document_version + 1
              WHERE course_code = 'COURSE-301'
                AND document_version = 999;
              GET DIAGNOSTICS v_updated = ROW_COUNT;
              IF v_updated <> 0 THEN
                  RAISE EXCEPTION 'stale version unexpectedly updated % rows', v_updated;
              END IF;
              IF NOT EXISTS (
                  SELECT 1 FROM nosql_lab.course_documents
                  WHERE course_code='COURSE-301'
                    AND document_version=1
                    AND metadata #>> '{options,certificate}'='true'
              ) THEN
                  RAISE EXCEPTION 'stale version test changed baseline';
              END IF;
              RAISE NOTICE 'Chapter 12 stale document version boundary passed';
          END
          $$;
          SQL

      - name: Verify final validation catches derived-data drift
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book -c "UPDATE nosql_lab.course_documents SET title='DRIFT' WHERE source_course_id=301;"
          set +e
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter12/07_nosql_lab_validation.sql > /tmp/ch12_derived_drift.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "원본과 불일치" /tmp/ch12_derived_drift.log
          psql -v ON_ERROR_STOP=1 -d ai_database_book -c "UPDATE nosql_lab.course_documents SET title='데이터베이스 입문' WHERE source_course_id=301;"
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter12/07_nosql_lab_validation.sql 2>&1 | tee /tmp/ch12_07_restored.log
          grep -q "Chapter 12 nosql_lab validation passed" /tmp/ch12_07_restored.log

      - name: Verify protected project remains unchanged
        shell: bash
        run: |
          psql -d ai_database_book -Atc "
            SELECT md5(
              (SELECT jsonb_agg(to_jsonb(s) ORDER BY id)::text FROM course_project.students AS s) ||
              (SELECT jsonb_agg(to_jsonb(i) ORDER BY id)::text FROM course_project.instructors AS i) ||
              (SELECT jsonb_agg(to_jsonb(c) ORDER BY id)::text FROM course_project.courses AS c) ||
              (SELECT jsonb_agg(to_jsonb(e) ORDER BY id)::text FROM course_project.enrollments AS e)
            );
          " > /tmp/ch12_project_fingerprint_after.txt
          diff -u /tmp/ch12_project_fingerprint.txt /tmp/ch12_project_fingerprint_after.txt

      - name: Verify reset atomicity and isolation
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book -c "CREATE TABLE nosql_lab.keep_me(id integer);"
          set +e
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter12/reset_nosql_lab.sql > /tmp/ch12_reset_blocked.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -qi "cannot drop schema nosql_lab" /tmp/ch12_reset_blocked.log
          test "$(psql -d ai_database_book -Atc "SELECT to_regclass('nosql_lab.course_documents') IS NOT NULL")" = "t"
          test "$(psql -d ai_database_book -Atc "SELECT to_regclass('nosql_lab.key_value_cache_examples') IS NOT NULL")" = "t"
          test "$(psql -d ai_database_book -Atc "SELECT to_regclass('nosql_lab.storage_choice_cases') IS NOT NULL")" = "t"
          test "$(psql -d ai_database_book -Atc "SELECT to_regclass('nosql_lab.keep_me') IS NOT NULL")" = "t"
          psql -v ON_ERROR_STOP=1 -d ai_database_book -c "DROP TABLE nosql_lab.keep_me;"
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter12/reset_nosql_lab.sql 2>&1 | tee /tmp/ch12_reset.log
          grep -q "Chapter 12 nosql lab reset passed" /tmp/ch12_reset.log
          test "$(psql -d ai_database_book -Atc "SELECT to_regnamespace('nosql_lab') IS NULL")" = "t"

          psql -d ai_database_book -Atc "
            SELECT md5(
              (SELECT jsonb_agg(to_jsonb(s) ORDER BY id)::text FROM course_project.students AS s) ||
              (SELECT jsonb_agg(to_jsonb(i) ORDER BY id)::text FROM course_project.instructors AS i) ||
              (SELECT jsonb_agg(to_jsonb(c) ORDER BY id)::text FROM course_project.courses AS c) ||
              (SELECT jsonb_agg(to_jsonb(e) ORDER BY id)::text FROM course_project.enrollments AS e)
            );
          " > /tmp/ch12_project_fingerprint_reset.txt
          diff -u /tmp/ch12_project_fingerprint.txt /tmp/ch12_project_fingerprint_reset.txt
