name: Validate Chapter 14

on:
  push:
    branches: [main]
    paths:
      - book/chapter14/**
      - code/chapter14/**
      - images/chapter14/**
      - presentation/chapter14/**
      - presentation/common/tts_pronunciation.js
      - presentation/common/script_content_enhancer.js
      - notes/chapter14_review_checklist.md
      - .github/workflows/validate-chapter14.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Chapter 14 source alignment
        shell: bash
        run: |
          node --check presentation/chapter14/chapter14_slides.js
          node --check presentation/chapter14/chapter14_navigation.js
          node --check presentation/chapter14/chapter14_player.js
          node --check presentation/chapter14/chapter14_script.js
          node --check presentation/common/tts_pronunciation.js
          node --check presentation/common/script_content_enhancer.js
          python -m py_compile code/chapter14/python/*.py
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          import xml.etree.ElementTree as ET

          chapter = Path('book/chapter14/chapter14.md').read_text(encoding='utf-8')
          outline = Path('book/chapter14/chapter14_outline.md').read_text(encoding='utf-8')
          activity = Path('book/chapter14/chapter14_activity.md').read_text(encoding='utf-8')
          theory = Path('presentation/chapter14/chapter14_theory_lecture_plan.md').read_text(encoding='utf-8')
          practice = Path('presentation/chapter14/chapter14_practice_lecture_plan.md').read_text(encoding='utf-8')
          nav = Path('presentation/chapter14/chapter14_navigation.js').read_text(encoding='utf-8')
          player = Path('presentation/chapter14/chapter14_player.js').read_text(encoding='utf-8')
          script = Path('presentation/chapter14/chapter14_script.js').read_text(encoding='utf-8')
          script_html = Path('presentation/chapter14/chapter14_script.html').read_text(encoding='utf-8')
          slides = Path('presentation/chapter14/chapter14_slides.js').read_text(encoding='utf-8')
          code_readme = Path('code/chapter14/README.md').read_text(encoding='utf-8')
          checklist = Path('notes/chapter14_review_checklist.md').read_text(encoding='utf-8')

          numbered = [int(x) for x in re.findall(r'^##\s+(\d+)\.\s+', chapter, re.M)]
          if numbered != list(range(1, 33)):
              raise SystemExit(f'Chapter 14 body numbering mismatch: {numbered}')

          def parse_plan(label, text):
              sections = list(re.finditer(r'^##\s+(\d+)\.\s+(.+)$', text, re.M))
              nums = [int(m.group(1)) for m in sections]
              if nums != list(range(1, 21)):
                  raise SystemExit(f'{label} numbering mismatch: {nums}')
              titles = []
              for index, match in enumerate(sections):
                  end = sections[index + 1].start() if index + 1 < len(sections) else len(text)
                  block = text[match.end():end]
                  if '**화면 구성**' not in block or '**발표 스크립트**' not in block:
                      raise SystemExit(f'{label} section {match.group(1)} missing screen/script')
                  titles.append(match.group(2).strip())
              return titles

          theory_titles = parse_plan('theory', theory)
          practice_titles = parse_plan('practice', practice)
          for title in theory_titles + practice_titles:
              if title not in nav:
                  raise SystemExit(f'navigation missing title: {title}')

          published = {
              'chapter': chapter, 'outline': outline, 'activity': activity,
              'theory': theory, 'practice': practice, 'code README': code_readme,
              'checklist': checklist,
          }
          for name, text in published.items():
              if 'paid_amount' in text:
                  raise SystemExit(f'{name} contains stale paid_amount')

          for name, text in [('chapter', chapter),('outline',outline),('activity',activity),('code README',code_readme)]:
              for token in ['recorded_amount','NUMERIC(12,0)','3210000']:
                  if token not in text:
                      raise SystemExit(f'{name} missing canonical token {token}')

          if '취소 후에도 신청 시점 기록 금액' not in chapter and '상태가 `취소`로 바뀌어도 0으로 덮어쓰지 않습니다' not in chapter:
              raise SystemExit('Chapter 14 body missing cancellation amount preservation rule')
          if '합성 기준 데이터' not in chapter or 'course_project' not in chapter:
              raise SystemExit('Chapter 14 body missing isolated synthetic-lab boundary')

          sql_root = Path('code/chapter14')
          required_sql = [
              '01_analysis_lab_schema.sql','02_analysis_lab_seed.sql','03_data_quality_checks.sql',
              '04_summary_analysis.sql','05_period_category_analysis.sql','06_analysis_dataset.sql',
              '07_analysis_validation.sql','08_analysis_lab_validation.sql','reset_analysis_lab.sql'
          ]
          sql = {name:(sql_root/name).read_text(encoding='utf-8') for name in required_sql}
          for name, text in sql.items():
              if 'paid_amount' in text:
                  raise SystemExit(f'{name} contains stale paid_amount')

          for token in ['recorded_amount NUMERIC(12,0) NOT NULL','price NUMERIC(12,0) NOT NULL','590000','340000','440000','1001','1004','1005']:
              if token not in sql['01_analysis_lab_schema.sql']:
                  raise SystemExit(f'01 missing prerequisite/schema token {token}')
          if 'chk_analysis_enrollments_cancel_amount' in sql['01_analysis_lab_schema.sql']:
              raise SystemExit('01 still zeroes cancellation recorded_amount')
          for token in ['3210000','150000, NULL','140000, NULL','Chapter 14 analysis lab seed validation passed']:
              if token not in sql['02_analysis_lab_seed.sql']:
                  raise SystemExit(f'02 missing canonical seed token {token}')
          for token in ['BEGIN;','COMMIT;','3210000','Chapter 14 analysis dataset validation passed']:
              if token not in sql['06_analysis_dataset.sql']:
                  raise SystemExit(f'06 missing dataset gate token {token}')
          for token in ['constraint_count <> 20','identity_count <> 4','3210000','590000','340000','440000','NUMERIC(12,0)','Chapter 14 analysis_lab validation passed']:
              if token not in sql['08_analysis_lab_validation.sql']:
                  raise SystemExit(f'08 missing final gate token {token}')

          reset = sql['reset_analysis_lab.sql']
          reset_clean = re.sub(r'--.*$', '', reset, flags=re.M).upper()
          if 'CASCADE' in reset_clean:
              raise SystemExit('reset must not use CASCADE')
          for token in ['BEGIN;','COMMIT;','unexpected_count','course_project.enrollments','Chapter 14 analysis lab reset passed']:
              if token not in reset:
                  raise SystemExit(f'reset missing safety token {token}')

          protected = re.compile(
              r'\b(?:INSERT\s+INTO|UPDATE|DELETE\s+FROM|ALTER\s+TABLE|DROP\s+TABLE|TRUNCATE(?:\s+TABLE)?)\s+'
              r'(?:course_project|transaction_lab|performance_lab|security_lab|nosql_lab|ai_review_lab|public)\.', re.I
          )
          for name, text in sql.items():
              clean = re.sub(r'/\*.*?\*/', '', text, flags=re.S)
              clean = re.sub(r'--.*$', '', clean, flags=re.M)
              if protected.search(clean):
                  raise SystemExit(f'Chapter 14 SQL modifies protected schema: {name}')

          py_root = Path('code/chapter14/python')
          validation_utils = (py_root/'validation_utils.py').read_text(encoding='utf-8')
          result_validation = (py_root/'04_result_validation.py').read_text(encoding='utf-8')
          requirements = (py_root/'requirements.txt').read_text(encoding='utf-8')
          metrics = json.loads((py_root/'reference_metrics.json').read_text(encoding='utf-8'))
          for token in ['ID_COLUMNS','errors="raise"','recorded_amount는 정수 단위 금액','completion_days가 completed_at - enrolled_at과 일치하지 않습니다.','default_transaction_read_only=on','PGPASSFILE']:
              if token not in validation_utils:
                  raise SystemExit(f'validation_utils missing strict token {token}')
          for token in ['assert_frame_equal','REPEATABLE READ, READ ONLY','SQL_STATUS_QUERY','SQL_MONTHLY_QUERY','SQL_COMPLETION_QUERY']:
              if token not in result_validation:
                  raise SystemExit(f'04_result_validation missing token {token}')
          for package in ['pandas','matplotlib','SQLAlchemy','psycopg','python-dotenv']:
              if package not in requirements:
                  raise SystemExit(f'requirements missing {package}')
          if metrics.get('recorded_amount_sum') != 3210000 or metrics.get('row_count') != 24:
              raise SystemExit('reference_metrics total/row count mismatch')
          expected_monthly = [350000,520000,680000,550000,540000,570000]
          if [row['recorded_amount_sum'] for row in metrics['monthly']] != expected_monthly:
              raise SystemExit('reference_metrics monthly amounts mismatch')
          if sum(expected_monthly) != 3210000:
              raise SystemExit('monthly amount arithmetic mismatch')

          if "fetch(source, { cache: 'no-store' })" not in slides:
              raise SystemExit('slides source must bypass stale cache')
          if 'window.PresentationTTS?.normalize' not in script:
              raise SystemExit('script must use shared PresentationTTS')
          if '../common/script_content_enhancer.js' not in script_html:
              raise SystemExit('script HTML missing content enhancer')
          pv = re.search(r"const ASSET_VERSION = '([^']+)';", player)
          sv = re.search(r"const ASSET_VERSION = '([^']+)';", script)
          if not pv or not sv or pv.group(1) != '20260809a' or sv.group(1) != '20260809a':
              raise SystemExit('Chapter 14 asset version must be 20260809a')
          for filename in ['chapter14_theory_presentation.html','chapter14_practice_presentation.html','chapter14_script.html']:
              if '20260809a' not in (Path('presentation/chapter14')/filename).read_text(encoding='utf-8'):
                  raise SystemExit(f'{filename} missing 20260809a')

          mmds = sorted(Path('images/chapter14').glob('*.mmd'))
          svgs = sorted(Path('images/chapter14').glob('*.svg'))
          if len(mmds) != 8 or len(svgs) != 8 or {p.stem for p in mmds} != {p.stem for p in svgs}:
              raise SystemExit(f'expected 8 matching Mermaid/SVG pairs, got {len(mmds)}/{len(svgs)}')
          for path in svgs:
              root = ET.fromstring(path.read_text(encoding='utf-8'))
              if root.attrib.get('role') != 'img' or root.attrib.get('width') != '100%' or not root.attrib.get('viewBox'):
                  raise SystemExit(f'{path} missing responsive/accessibility attributes')
              tags = {elem.tag.split('}')[-1] for elem in root.iter()}
              if 'title' not in tags or 'desc' not in tags:
                  raise SystemExit(f'{path} missing title/desc')
              if path.name not in chapter:
                  raise SystemExit(f'{path.name} is not referenced by Chapter 14 body')

          print(f'Chapter 14 static alignment passed: body={len(numbered)}, theory=20, practice=20, amount=3210000, assets=8')
          PY

      - name: Install PostgreSQL client and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install --upgrade pip
          python -m pip install -r code/chapter14/python/requirements.txt
          psql --version
          python --version

      - name: Create Chapter 14 test database
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE ai_database_book;"
          test "$(psql -d postgres -Atc "SELECT current_setting('server_version_num')::int / 10000")" = "16"

      - name: Verify wrong database guard
        shell: bash
        run: |
          set +e
          psql -v ON_ERROR_STOP=1 -d postgres -f code/chapter14/01_analysis_lab_schema.sql > /tmp/ch14_wrong_db.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "ai_database_book" /tmp/ch14_wrong_db.log
          test "$(psql -d postgres -Atc "SELECT to_regnamespace('analysis_lab') IS NULL")" = "t"

      - name: Build Chapter 07 and verify Chapter 08 baseline
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter07/01_course_project_schema.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter07/02_course_project_seed.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter07/03_course_project_changes.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter07/04_course_project_validation.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter08/00_check_course_project.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter08/03_join_aggregation_validation.sql

      - name: Create protected sentinels and capture fingerprint
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book <<'SQL'
          CREATE SCHEMA transaction_lab; CREATE TABLE transaction_lab.keep_me(id integer PRIMARY KEY); INSERT INTO transaction_lab.keep_me VALUES (1);
          CREATE SCHEMA performance_lab; CREATE TABLE performance_lab.keep_me(id integer PRIMARY KEY); INSERT INTO performance_lab.keep_me VALUES (1);
          CREATE SCHEMA security_lab; CREATE TABLE security_lab.keep_me(id integer PRIMARY KEY); INSERT INTO security_lab.keep_me VALUES (1);
          CREATE SCHEMA nosql_lab; CREATE TABLE nosql_lab.keep_me(id integer PRIMARY KEY); INSERT INTO nosql_lab.keep_me VALUES (1);
          CREATE SCHEMA ai_review_lab; CREATE TABLE ai_review_lab.keep_me(id integer PRIMARY KEY); INSERT INTO ai_review_lab.keep_me VALUES (1);
          SQL
          psql -d ai_database_book -Atc "
            SELECT md5(
              (SELECT jsonb_agg(to_jsonb(s) ORDER BY id)::text FROM course_project.students s) ||
              (SELECT jsonb_agg(to_jsonb(i) ORDER BY id)::text FROM course_project.instructors i) ||
              (SELECT jsonb_agg(to_jsonb(c) ORDER BY id)::text FROM course_project.courses c) ||
              (SELECT jsonb_agg(to_jsonb(e) ORDER BY id)::text FROM course_project.enrollments e)
            );
          " > /tmp/ch14_project_fingerprint.txt
          cat /tmp/ch14_project_fingerprint.txt

      - name: Verify Chapter 14 prerequisite drift detection
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book -c "UPDATE course_project.enrollments SET recorded_amount = 120001 WHERE id = 1005;"
          set +e
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter14/01_analysis_lab_schema.sql > /tmp/ch14_prereq_drift.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -Eq "canonical|기준 상태" /tmp/ch14_prereq_drift.log
          test "$(psql -d ai_database_book -Atc "SELECT to_regnamespace('analysis_lab') IS NULL")" = "t"
          psql -v ON_ERROR_STOP=1 -d ai_database_book -c "UPDATE course_project.enrollments SET recorded_amount = 120000 WHERE id = 1005;"

      - name: Run Chapter 14 canonical SQL path
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter14/01_analysis_lab_schema.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter14/02_analysis_lab_seed.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter14/03_data_quality_checks.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter14/04_summary_analysis.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter14/05_period_category_analysis.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter14/06_analysis_dataset.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter14/07_analysis_validation.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter14/08_analysis_lab_validation.sql

      - name: Verify exact Chapter 14 SQL state
        shell: bash
        run: |
          test "$(psql -d ai_database_book -Atc "SELECT (SELECT COUNT(*) FROM analysis_lab.students)||':'||(SELECT COUNT(*) FROM analysis_lab.instructors)||':'||(SELECT COUNT(*) FROM analysis_lab.courses)||':'||(SELECT COUNT(*) FROM analysis_lab.enrollments)||':'||(SELECT COUNT(*) FROM analysis_lab.enrollment_analysis_dataset)")" = "8:3:5:24:24"
          test "$(psql -d ai_database_book -Atc "SELECT SUM(recorded_amount) FROM analysis_lab.enrollments")" = "3210000"
          test "$(psql -d ai_database_book -Atc "SELECT string_agg(status||':'||cnt,',' ORDER BY ord) FROM (SELECT status,COUNT(*) cnt, CASE status WHEN '신청' THEN 1 WHEN '수강중' THEN 2 WHEN '완료' THEN 3 WHEN '취소' THEN 4 END ord FROM analysis_lab.enrollments GROUP BY status) s")" = "신청:4,수강중:5,완료:12,취소:3"
          test "$(psql -d ai_database_book -Atc "SELECT string_agg(to_char(enrollment_month,'YYYY-MM')||':'||recorded_amount_sum,',' ORDER BY enrollment_month) FROM (SELECT enrollment_month,SUM(recorded_amount) recorded_amount_sum FROM analysis_lab.enrollment_analysis_dataset GROUP BY enrollment_month) m")" = "2026-01:350000,2026-02:520000,2026-03:680000,2026-04:550000,2026-05:540000,2026-06:570000"
          test "$(psql -d ai_database_book -Atc "SELECT COUNT(*)||':'||ROUND(AVG(completion_days),2)||':'||MIN(completion_days)||':'||MAX(completion_days) FROM analysis_lab.enrollment_analysis_dataset WHERE is_completed")" = "12:25.00:18:36"
          test "$(psql -d ai_database_book -Atc "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='analysis_lab' AND ((table_name='courses' AND column_name='price') OR (table_name='enrollments' AND column_name='recorded_amount')) AND data_type='numeric' AND numeric_precision=12 AND numeric_scale=0")" = "2"
          test "$(psql -d ai_database_book -Atc "SELECT COUNT(*) FROM pg_constraint WHERE connamespace='analysis_lab'::regnamespace")" = "20"
          test "$(psql -d ai_database_book -Atc "SELECT COUNT(*) FROM analysis_lab.enrollments WHERE status='취소' AND recorded_amount=0")" = "0"

      - name: Verify rerun guards
        shell: bash
        run: |
          for file in 01_analysis_lab_schema.sql 02_analysis_lab_seed.sql 06_analysis_dataset.sql; do
            set +e
            psql -v ON_ERROR_STOP=1 -d ai_database_book -f "code/chapter14/$file" > "/tmp/ch14_rerun_${file}.log" 2>&1
            status=$?
            set -e
            test "$status" -ne 0
          done
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter14/08_analysis_lab_validation.sql

      - name: Verify final gate detects analysis drift
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book -c "UPDATE analysis_lab.enrollments SET recorded_amount = recorded_amount + 1 WHERE id = 1001;"
          set +e
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter14/08_analysis_lab_validation.sql > /tmp/ch14_analysis_drift.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -Eq "3,210,000|월별|기준" /tmp/ch14_analysis_drift.log
          psql -v ON_ERROR_STOP=1 -d ai_database_book -c "UPDATE analysis_lab.enrollments SET recorded_amount = recorded_amount - 1 WHERE id = 1001;"
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter14/08_analysis_lab_validation.sql

      - name: Verify protected schemas remain unchanged
        shell: bash
        run: |
          psql -d ai_database_book -Atc "
            SELECT md5(
              (SELECT jsonb_agg(to_jsonb(s) ORDER BY id)::text FROM course_project.students s) ||
              (SELECT jsonb_agg(to_jsonb(i) ORDER BY id)::text FROM course_project.instructors i) ||
              (SELECT jsonb_agg(to_jsonb(c) ORDER BY id)::text FROM course_project.courses c) ||
              (SELECT jsonb_agg(to_jsonb(e) ORDER BY id)::text FROM course_project.enrollments e)
            );
          " > /tmp/ch14_project_fingerprint_after.txt
          cmp /tmp/ch14_project_fingerprint.txt /tmp/ch14_project_fingerprint_after.txt
          for schema in transaction_lab performance_lab security_lab nosql_lab ai_review_lab; do
            test "$(psql -d ai_database_book -Atc "SELECT COUNT(*) FROM ${schema}.keep_me")" = "1"
          done

      - name: Run Chapter 14 Python PostgreSQL and CSV validation
        shell: bash
        env:
          PGDATABASE: ai_database_book
          PGPASSFILE: /tmp/ch14.pgpass
        run: |
          printf 'localhost:5432:ai_database_book:postgres:postgres\n' > /tmp/ch14.pgpass
          chmod 600 /tmp/ch14.pgpass
          python code/chapter14/python/02_load_postgresql.py --export-csv /tmp/ch14_dataset.csv --manifest /tmp/ch14_manifest.json
          python code/chapter14/python/01_load_csv.py --csv /tmp/ch14_dataset.csv --manifest /tmp/ch14_manifest.json --require-manifest
          python code/chapter14/python/03_pandas_analysis.py --source postgresql --chart /tmp/ch14_postgresql_chart.png
          python code/chapter14/python/04_result_validation.py --source postgresql
          python code/chapter14/python/03_pandas_analysis.py --source csv --csv /tmp/ch14_dataset.csv --chart /tmp/ch14_csv_chart.png
          python code/chapter14/python/04_result_validation.py --source csv --csv /tmp/ch14_dataset.csv --manifest /tmp/ch14_manifest.json --reference code/chapter14/python/reference_metrics.json
          test -s /tmp/ch14_postgresql_chart.png
          test -s /tmp/ch14_csv_chart.png
          python - <<'PY'
          import pandas as pd
          p='/tmp/ch14_dataset.csv'
          q='/tmp/ch14_dataset_tampered.csv'
          df=pd.read_csv(p)
          df.loc[0,'recorded_amount']=int(df.loc[0,'recorded_amount'])+1
          df.to_csv(q,index=False)
          PY
          set +e
          python code/chapter14/python/01_load_csv.py --csv /tmp/ch14_dataset_tampered.csv --manifest /tmp/ch14_manifest.json --require-manifest > /tmp/ch14_tamper.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "SHA-256" /tmp/ch14_tamper.log
          set +e
          PGDATABASE=postgres python code/chapter14/python/02_load_postgresql.py > /tmp/ch14_wrong_python_db.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "ai_database_book" /tmp/ch14_wrong_python_db.log

      - name: Verify reset unexpected-object guard and isolation
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book -c "CREATE TABLE analysis_lab.keep_me(id integer PRIMARY KEY); INSERT INTO analysis_lab.keep_me VALUES (1);"
          set +e
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter14/reset_analysis_lab.sql > /tmp/ch14_reset_guard.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "예상 밖" /tmp/ch14_reset_guard.log
          test "$(psql -d ai_database_book -Atc "SELECT COUNT(*) FROM analysis_lab.enrollments")" = "24"
          test "$(psql -d ai_database_book -Atc "SELECT COUNT(*) FROM analysis_lab.keep_me")" = "1"
          psql -v ON_ERROR_STOP=1 -d ai_database_book -c "DROP TABLE analysis_lab.keep_me;"
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter14/reset_analysis_lab.sql
          test "$(psql -d ai_database_book -Atc "SELECT to_regnamespace('analysis_lab') IS NULL")" = "t"
          psql -d ai_database_book -Atc "
            SELECT md5(
              (SELECT jsonb_agg(to_jsonb(s) ORDER BY id)::text FROM course_project.students s) ||
              (SELECT jsonb_agg(to_jsonb(i) ORDER BY id)::text FROM course_project.instructors i) ||
              (SELECT jsonb_agg(to_jsonb(c) ORDER BY id)::text FROM course_project.courses c) ||
              (SELECT jsonb_agg(to_jsonb(e) ORDER BY id)::text FROM course_project.enrollments e)
            );
          " > /tmp/ch14_project_fingerprint_reset.txt
          cmp /tmp/ch14_project_fingerprint.txt /tmp/ch14_project_fingerprint_reset.txt
          for schema in transaction_lab performance_lab security_lab nosql_lab ai_review_lab; do
            test "$(psql -d ai_database_book -Atc "SELECT COUNT(*) FROM ${schema}.keep_me")" = "1"
          done
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter08/00_check_course_project.sql
