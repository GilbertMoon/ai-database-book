name: Validate Chapter 14

on:
  push:
    branches: [main]
    paths:
      - book/chapter14/**
      - code/chapter14/**
      - images/chapter14/**
      - presentation/chapter14/**
      - presentation/common/tts_pronunciation.js
      - presentation/common/script_content_enhancer.js
      - notes/chapter14_review_checklist.md
      - .github/workflows/validate-chapter14.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Static Chapter 14 checks
        shell: bash
        run: |
          node --check presentation/chapter14/chapter14_slides.js
          node --check presentation/chapter14/chapter14_navigation.js
          node --check presentation/chapter14/chapter14_player.js
          node --check presentation/chapter14/chapter14_script.js
          node --check presentation/common/tts_pronunciation.js
          node --check presentation/common/script_content_enhancer.js
          python -m py_compile code/chapter14/python/*.py
          python - <<'PY'
          from pathlib import Path
          import json, re, xml.etree.ElementTree as ET

          chapter = Path('book/chapter14/chapter14.md').read_text(encoding='utf-8')
          outline = Path('book/chapter14/chapter14_outline.md').read_text(encoding='utf-8')
          activity = Path('book/chapter14/chapter14_activity.md').read_text(encoding='utf-8')
          readme = Path('code/chapter14/README.md').read_text(encoding='utf-8')
          theory = Path('presentation/chapter14/chapter14_theory_lecture_plan.md').read_text(encoding='utf-8')
          practice = Path('presentation/chapter14/chapter14_practice_lecture_plan.md').read_text(encoding='utf-8')
          nav = Path('presentation/chapter14/chapter14_navigation.js').read_text(encoding='utf-8')
          player = Path('presentation/chapter14/chapter14_player.js').read_text(encoding='utf-8')
          script = Path('presentation/chapter14/chapter14_script.js').read_text(encoding='utf-8')
          script_html = Path('presentation/chapter14/chapter14_script.html').read_text(encoding='utf-8')
          slides = Path('presentation/chapter14/chapter14_slides.js').read_text(encoding='utf-8')

          nums = [int(x) for x in re.findall(r'^##\s+(\d+)\.\s+', chapter, re.M)]
          if nums != list(range(1, 33)):
              raise SystemExit(f'Chapter 14 body numbering mismatch: {nums}')

          def plan_titles(label, text):
              sections = list(re.finditer(r'^##\s+(\d+)\.\s+(.+)$', text, re.M))
              if [int(m.group(1)) for m in sections] != list(range(1, 21)):
                  raise SystemExit(f'{label} numbering mismatch')
              titles=[]
              for i,m in enumerate(sections):
                  end=sections[i+1].start() if i+1<len(sections) else len(text)
                  block=text[m.end():end]
                  if '**화면 구성**' not in block or '**발표 스크립트**' not in block:
                      raise SystemExit(f'{label} section {m.group(1)} missing screen/script')
                  titles.append(m.group(2).strip())
              return titles
          titles = plan_titles('theory', theory) + plan_titles('practice', practice)
          missing=[t for t in titles if t not in nav]
          if missing:
              raise SystemExit(f'navigation missing titles: {missing}')

          for name,text in [('chapter',chapter),('outline',outline),('activity',activity),('README',readme),('theory',theory),('practice',practice)]:
              if 'paid_amount' in text:
                  raise SystemExit(f'{name} contains stale paid_amount')
              if 'recorded_amount' not in text:
                  raise SystemExit(f'{name} missing recorded_amount')
          for name,text in [('chapter',chapter),('outline',outline),('README',readme)]:
              if 'NUMERIC(12,0)' not in text:
                  raise SystemExit(f'{name} missing NUMERIC(12,0)')
          if '합성 기준 데이터' not in chapter or 'course_project' not in chapter:
              raise SystemExit('Chapter 14 body missing synthetic-lab boundary')
          if '0으로 덮어쓰지 않습니다' not in chapter:
              raise SystemExit('Chapter 14 body missing cancellation preservation rule')

          sql_root=Path('code/chapter14')
          names=['01_analysis_lab_schema.sql','02_analysis_lab_seed.sql','03_data_quality_checks.sql','04_summary_analysis.sql','05_period_category_analysis.sql','06_analysis_dataset.sql','07_analysis_validation.sql','08_analysis_lab_validation.sql','reset_analysis_lab.sql']
          sql={n:(sql_root/n).read_text(encoding='utf-8') for n in names}
          for n,t in sql.items():
              if 'paid_amount' in t:
                  raise SystemExit(f'{n} contains stale paid_amount')
          for token in ['recorded_amount NUMERIC(12,0) NOT NULL','price NUMERIC(12,0) NOT NULL','590000','340000','440000','table_type = \'BASE TABLE\'']:
              if token not in sql['01_analysis_lab_schema.sql']:
                  raise SystemExit(f'01 missing {token}')
          if 'chk_analysis_enrollments_cancel_amount' in sql['01_analysis_lab_schema.sql']:
              raise SystemExit('01 still contains cancellation-zero constraint')
          for token in ['3210000','Chapter 14 analysis lab seed validation passed']:
              if token not in sql['02_analysis_lab_seed.sql']:
                  raise SystemExit(f'02 missing {token}')
          for token in ['BEGIN;','COMMIT;','3210000','Chapter 14 analysis dataset validation passed']:
              if token not in sql['06_analysis_dataset.sql']:
                  raise SystemExit(f'06 missing {token}')
          for token in ['constraint_count <> 20','identity_count <> 4','3210000','590000','340000','440000','NUMERIC(12,0)',"table_type = 'BASE TABLE'",'Chapter 14 analysis_lab validation passed']:
              if token not in sql['08_analysis_lab_validation.sql']:
                  raise SystemExit(f'08 missing {token}')
          reset=sql['reset_analysis_lab.sql']
          if 'CASCADE' in re.sub(r'--.*$','',reset,flags=re.M).upper():
              raise SystemExit('reset must not use CASCADE')
          for token in ['BEGIN;','COMMIT;','unexpected_count',"table_type = 'BASE TABLE'",'course_project.enrollments','Chapter 14 analysis lab reset passed']:
              if token not in reset:
                  raise SystemExit(f'reset missing {token}')

          protected=re.compile(r'\b(?:INSERT\s+INTO|UPDATE|DELETE\s+FROM|ALTER\s+TABLE|DROP\s+TABLE|TRUNCATE(?:\s+TABLE)?)\s+(?:course_project|transaction_lab|performance_lab|security_lab|nosql_lab|ai_review_lab)\.',re.I)
          for n,t in sql.items():
              clean=re.sub(r'/\*.*?\*/','',t,flags=re.S)
              clean=re.sub(r'--.*$','',clean,flags=re.M)
              if protected.search(clean):
                  raise SystemExit(f'{n} modifies protected schema')

          py=Path('code/chapter14/python')
          vu=(py/'validation_utils.py').read_text(encoding='utf-8')
          rv=(py/'04_result_validation.py').read_text(encoding='utf-8')
          for token in ['ID_COLUMNS','recorded_amount는 정수 단위 금액','completion_days가 completed_at - enrolled_at과 일치하지 않습니다.','default_transaction_read_only=on','PGPASSFILE']:
              if token not in vu: raise SystemExit(f'validation_utils missing {token}')
          for token in ['assert_frame_equal','REPEATABLE READ, READ ONLY','SQL_STATUS_QUERY','SQL_MONTHLY_QUERY','SQL_COMPLETION_QUERY']:
              if token not in rv: raise SystemExit(f'result_validation missing {token}')
          metrics=json.loads((py/'reference_metrics.json').read_text(encoding='utf-8'))
          if metrics['row_count']!=24 or metrics['recorded_amount_sum']!=3210000:
              raise SystemExit('reference metrics total mismatch')
          if [r['recorded_amount_sum'] for r in metrics['monthly']] != [350000,520000,680000,550000,540000,570000]:
              raise SystemExit('reference monthly amounts mismatch')

          if "fetch(source, { cache: 'no-store' })" not in slides: raise SystemExit('slides cache rule missing')
          if 'window.PresentationTTS?.normalize' not in script: raise SystemExit('shared TTS missing')
          if '../common/script_content_enhancer.js' not in script_html: raise SystemExit('enhancer missing')
          if "const ASSET_VERSION = '20260809a';" not in player or "const ASSET_VERSION = '20260809a';" not in script:
              raise SystemExit('asset version mismatch')
          for f in ['chapter14_theory_presentation.html','chapter14_practice_presentation.html','chapter14_script.html']:
              if '20260809a' not in (Path('presentation/chapter14')/f).read_text(encoding='utf-8'):
                  raise SystemExit(f'{f} version mismatch')

          mmd=sorted(Path('images/chapter14').glob('*.mmd')); svg=sorted(Path('images/chapter14').glob('*.svg'))
          if len(mmd)!=8 or len(svg)!=8 or {p.stem for p in mmd}!={p.stem for p in svg}:
              raise SystemExit('Chapter 14 Mermaid/SVG pair mismatch')
          for p in svg:
              root=ET.fromstring(p.read_text(encoding='utf-8'))
              tags={e.tag.split('}')[-1] for e in root.iter()}
              if root.attrib.get('role')!='img' or root.attrib.get('width')!='100%' or not root.attrib.get('viewBox') or not {'title','desc'}<=tags:
                  raise SystemExit(f'{p} accessibility metadata incomplete')
              if p.name not in chapter: raise SystemExit(f'{p.name} not referenced by body')
          print('Chapter 14 static alignment passed: body=32 theory=20 practice=20 amount=3210000 assets=8')
          PY

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install -r code/chapter14/python/requirements.txt
          psql --version

      - name: Create test database and verify wrong DB guard
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE ai_database_book;"
          test "$(psql -d postgres -Atc "SELECT current_setting('server_version_num')::int/10000")" = "16"
          set +e
          psql -v ON_ERROR_STOP=1 -d postgres -f code/chapter14/01_analysis_lab_schema.sql >/tmp/ch14_wrong_db.log 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q ai_database_book /tmp/ch14_wrong_db.log

      - name: Build protected Chapter 07 and Chapter 08 baseline
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter07/01_course_project_schema.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter07/02_course_project_seed.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter07/03_course_project_changes.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter07/04_course_project_validation.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter08/00_check_course_project.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter08/03_join_aggregation_validation.sql

      - name: Capture protected fingerprint and create sentinels
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book <<'SQL'
          CREATE SCHEMA transaction_lab; CREATE TABLE transaction_lab.keep_me(id int PRIMARY KEY); INSERT INTO transaction_lab.keep_me VALUES (1);
          CREATE SCHEMA performance_lab; CREATE TABLE performance_lab.keep_me(id int PRIMARY KEY); INSERT INTO performance_lab.keep_me VALUES (1);
          CREATE SCHEMA security_lab; CREATE TABLE security_lab.keep_me(id int PRIMARY KEY); INSERT INTO security_lab.keep_me VALUES (1);
          CREATE SCHEMA nosql_lab; CREATE TABLE nosql_lab.keep_me(id int PRIMARY KEY); INSERT INTO nosql_lab.keep_me VALUES (1);
          CREATE SCHEMA ai_review_lab; CREATE TABLE ai_review_lab.keep_me(id int PRIMARY KEY); INSERT INTO ai_review_lab.keep_me VALUES (1);
          SQL
          psql -d ai_database_book -Atc "SELECT md5((SELECT jsonb_agg(to_jsonb(s) ORDER BY id)::text FROM course_project.students s)||(SELECT jsonb_agg(to_jsonb(i) ORDER BY id)::text FROM course_project.instructors i)||(SELECT jsonb_agg(to_jsonb(c) ORDER BY id)::text FROM course_project.courses c)||(SELECT jsonb_agg(to_jsonb(e) ORDER BY id)::text FROM course_project.enrollments e));" >/tmp/ch14_fp.txt

      - name: Verify prerequisite drift detection
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book -c "UPDATE course_project.enrollments SET recorded_amount=120001 WHERE id=1005;"
          set +e
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter14/01_analysis_lab_schema.sql >/tmp/ch14_prereq.log 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -Eq 'canonical|기준 상태' /tmp/ch14_prereq.log
          test "$(psql -d ai_database_book -Atc "SELECT to_regnamespace('analysis_lab') IS NULL")" = t
          psql -v ON_ERROR_STOP=1 -d ai_database_book -c "UPDATE course_project.enrollments SET recorded_amount=120000 WHERE id=1005;"

      - name: Run Chapter 14 SQL 01 through 08
        run: |
          for f in 01_analysis_lab_schema.sql 02_analysis_lab_seed.sql 03_data_quality_checks.sql 04_summary_analysis.sql 05_period_category_analysis.sql 06_analysis_dataset.sql 07_analysis_validation.sql 08_analysis_lab_validation.sql; do
            psql -v ON_ERROR_STOP=1 -d ai_database_book -f "code/chapter14/$f"
          done

      - name: Verify exact SQL evidence
        shell: bash
        run: |
          test "$(psql -d ai_database_book -Atc "SELECT (SELECT COUNT(*) FROM analysis_lab.students)||':'||(SELECT COUNT(*) FROM analysis_lab.instructors)||':'||(SELECT COUNT(*) FROM analysis_lab.courses)||':'||(SELECT COUNT(*) FROM analysis_lab.enrollments)||':'||(SELECT COUNT(*) FROM analysis_lab.enrollment_analysis_dataset)")" = '8:3:5:24:24'
          test "$(psql -d ai_database_book -Atc "SELECT SUM(recorded_amount) FROM analysis_lab.enrollments")" = '3210000'
          test "$(psql -d ai_database_book -Atc "SELECT string_agg(status||':'||n,',' ORDER BY ord) FROM (SELECT status,COUNT(*) n,CASE status WHEN '신청' THEN 1 WHEN '수강중' THEN 2 WHEN '완료' THEN 3 WHEN '취소' THEN 4 END ord FROM analysis_lab.enrollments GROUP BY status)s")" = '신청:4,수강중:5,완료:12,취소:3'
          test "$(psql -d ai_database_book -Atc "SELECT string_agg(to_char(enrollment_month,'YYYY-MM')||':'||s,',' ORDER BY enrollment_month) FROM (SELECT enrollment_month,SUM(recorded_amount) s FROM analysis_lab.enrollment_analysis_dataset GROUP BY enrollment_month)m")" = '2026-01:350000,2026-02:520000,2026-03:680000,2026-04:550000,2026-05:540000,2026-06:570000'
          test "$(psql -d ai_database_book -Atc "SELECT COUNT(*)||':'||ROUND(AVG(completion_days),2)||':'||MIN(completion_days)||':'||MAX(completion_days) FROM analysis_lab.enrollment_analysis_dataset WHERE is_completed")" = '12:25.00:18:36'
          test "$(psql -d ai_database_book -Atc "SELECT COUNT(*) FROM pg_constraint WHERE connamespace='analysis_lab'::regnamespace")" = '20'
          test "$(psql -d ai_database_book -Atc "SELECT COUNT(*) FROM analysis_lab.enrollments WHERE status='취소' AND recorded_amount=0")" = '0'
          test "$(psql -d ai_database_book -Atc "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='analysis_lab' AND ((table_name='courses' AND column_name='price') OR (table_name='enrollments' AND column_name='recorded_amount')) AND data_type='numeric' AND numeric_precision=12 AND numeric_scale=0")" = '2'

      - name: Verify rerun and drift guards
        shell: bash
        run: |
          for f in 01_analysis_lab_schema.sql 02_analysis_lab_seed.sql 06_analysis_dataset.sql; do
            set +e; psql -v ON_ERROR_STOP=1 -d ai_database_book -f "code/chapter14/$f" >/tmp/rerun.log 2>&1; rc=$?; set -e; test "$rc" -ne 0
          done
          psql -v ON_ERROR_STOP=1 -d ai_database_book -c "UPDATE analysis_lab.enrollments SET recorded_amount=recorded_amount+1 WHERE id=1001;"
          set +e; psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter14/08_analysis_lab_validation.sql >/tmp/ch14_drift.log 2>&1; rc=$?; set -e
          test "$rc" -ne 0
          psql -v ON_ERROR_STOP=1 -d ai_database_book -c "UPDATE analysis_lab.enrollments SET recorded_amount=recorded_amount-1 WHERE id=1001;"
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter14/08_analysis_lab_validation.sql

      - name: Verify protected state unchanged
        shell: bash
        run: |
          psql -d ai_database_book -Atc "SELECT md5((SELECT jsonb_agg(to_jsonb(s) ORDER BY id)::text FROM course_project.students s)||(SELECT jsonb_agg(to_jsonb(i) ORDER BY id)::text FROM course_project.instructors i)||(SELECT jsonb_agg(to_jsonb(c) ORDER BY id)::text FROM course_project.courses c)||(SELECT jsonb_agg(to_jsonb(e) ORDER BY id)::text FROM course_project.enrollments e));" >/tmp/ch14_fp_after.txt
          cmp /tmp/ch14_fp.txt /tmp/ch14_fp_after.txt
          for s in transaction_lab performance_lab security_lab nosql_lab ai_review_lab; do test "$(psql -d ai_database_book -Atc "SELECT COUNT(*) FROM ${s}.keep_me")" = 1; done

      - name: Run PostgreSQL and CSV Python cross-validation
        shell: bash
        env:
          PGDATABASE: ai_database_book
          PGPASSFILE: /tmp/ch14.pgpass
        run: |
          printf 'localhost:5432:ai_database_book:postgres:postgres\n' >/tmp/ch14.pgpass
          chmod 600 /tmp/ch14.pgpass
          python code/chapter14/python/02_load_postgresql.py --export-csv /tmp/ch14.csv --manifest /tmp/ch14.manifest.json
          python code/chapter14/python/01_load_csv.py --csv /tmp/ch14.csv --manifest /tmp/ch14.manifest.json --require-manifest
          python code/chapter14/python/03_pandas_analysis.py --source postgresql --chart /tmp/ch14_pg.png
          python code/chapter14/python/04_result_validation.py --source postgresql
          python code/chapter14/python/03_pandas_analysis.py --source csv --csv /tmp/ch14.csv --chart /tmp/ch14_csv.png
          python code/chapter14/python/04_result_validation.py --source csv --csv /tmp/ch14.csv --manifest /tmp/ch14.manifest.json --reference code/chapter14/python/reference_metrics.json
          test -s /tmp/ch14_pg.png && test -s /tmp/ch14_csv.png
          python - <<'PY'
          import pandas as pd
          d=pd.read_csv('/tmp/ch14.csv'); d.loc[0,'recorded_amount']=int(d.loc[0,'recorded_amount'])+1; d.to_csv('/tmp/ch14_bad.csv',index=False)
          PY
          set +e; python code/chapter14/python/01_load_csv.py --csv /tmp/ch14_bad.csv --manifest /tmp/ch14.manifest.json --require-manifest >/tmp/ch14_sha.log 2>&1; rc=$?; set -e
          test "$rc" -ne 0 && grep -q 'SHA-256' /tmp/ch14_sha.log
          set +e; PGDATABASE=postgres python code/chapter14/python/02_load_postgresql.py >/tmp/ch14_py_wrong_db.log 2>&1; rc=$?; set -e
          test "$rc" -ne 0 && grep -q ai_database_book /tmp/ch14_py_wrong_db.log

      - name: Verify reset guard and isolation
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book -c "CREATE TABLE analysis_lab.keep_me(id int PRIMARY KEY); INSERT INTO analysis_lab.keep_me VALUES(1);"
          set +e; psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter14/reset_analysis_lab.sql >/tmp/ch14_reset_guard.log 2>&1; rc=$?; set -e
          test "$rc" -ne 0 && grep -q '예상 밖' /tmp/ch14_reset_guard.log
          test "$(psql -d ai_database_book -Atc "SELECT COUNT(*) FROM analysis_lab.enrollments")" = 24
          psql -v ON_ERROR_STOP=1 -d ai_database_book -c "DROP TABLE analysis_lab.keep_me;"
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter14/reset_analysis_lab.sql
          test "$(psql -d ai_database_book -Atc "SELECT to_regnamespace('analysis_lab') IS NULL")" = t
          psql -d ai_database_book -Atc "SELECT md5((SELECT jsonb_agg(to_jsonb(s) ORDER BY id)::text FROM course_project.students s)||(SELECT jsonb_agg(to_jsonb(i) ORDER BY id)::text FROM course_project.instructors i)||(SELECT jsonb_agg(to_jsonb(c) ORDER BY id)::text FROM course_project.courses c)||(SELECT jsonb_agg(to_jsonb(e) ORDER BY id)::text FROM course_project.enrollments e));" >/tmp/ch14_fp_reset.txt
          cmp /tmp/ch14_fp.txt /tmp/ch14_fp_reset.txt
          for s in transaction_lab performance_lab security_lab nosql_lab ai_review_lab; do test "$(psql -d ai_database_book -Atc "SELECT COUNT(*) FROM ${s}.keep_me")" = 1; done
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter08/00_check_course_project.sql
