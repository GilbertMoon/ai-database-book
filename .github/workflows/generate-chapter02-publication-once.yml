name: Generate Chapter 02 publication HTML and JPG assets once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-chapter02-publication-once.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install publication dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk libcairo2
          python -m pip install --upgrade pillow markdown cairosvg
      - name: Generate Chapter 02 publication files
        run: python scripts/generate_chapter02_publication.py
      - name: Validate Chapter 02 publication output
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from PIL import Image

          md = Path('book/chapter02/chapter02.md').read_text(encoding='utf-8')
          html = Path('book/chapter02/chapter02.html').read_text(encoding='utf-8')
          refs = sorted(set(re.findall(r'\.\./\.\./images/chapter02/([^\s)]+\.svg)', md)))
          if not refs:
              raise SystemExit('no Chapter 02 source SVG references found')

          required = [
              '데이터와 DBMS의 기본 개념',
              '사용자',
              'DBeaver',
              'PostgreSQL',
              '기본키',
              '외래키',
              'ORDER BY',
              '@media print',
              'size:A4',
          ]
          for token in required:
              if token not in html:
                  raise SystemExit(f'missing Chapter 02 publication token: {token}')

          if '.svg' in html:
              raise SystemExit('Chapter 02 publication HTML still contains SVG references')

          if html.count('<h2') < 10:
              raise SystemExit('Chapter 02 HTML lost too many major sections')

          for svg_name in refs:
              jpg = Path('images/chapter02') / Path(svg_name).with_suffix('.jpg').name
              if not jpg.exists() or jpg.stat().st_size < 25000:
                  raise SystemExit(f'invalid Chapter 02 JPG: {jpg}')
              with Image.open(jpg) as im:
                  if im.format != 'JPEG' or im.width != 1600:
                      raise SystemExit(f'unexpected image metadata: {jpg} {im.size} {im.format}')
              if jpg.name not in html:
                  raise SystemExit(f'HTML does not reference generated JPG: {jpg.name}')

          print(f'Chapter 02 publication validation passed: {len(refs)} JPG assets')
          PY
      - name: Commit generated Chapter 02 publication files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add book/chapter02/chapter02.html images/chapter02/*.jpg
          git commit -m 'Generate Chapter 02 publication HTML and JPG assets'
          git push
