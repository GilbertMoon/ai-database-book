name: Chapter 13 definitive final validation once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ch13-final-validation-v3-once.yml'

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Static publication checks
        run: |
          node --check presentation/chapter13/chapter13_slides.js
          node --check presentation/chapter13/chapter13_navigation.js
          node --check presentation/chapter13/chapter13_player.js
          node --check presentation/chapter13/chapter13_script.js
          python - <<'PY'
          from pathlib import Path
          import re
          chapter = Path('book/chapter13/chapter13.md').read_text(encoding='utf-8')
          activity = Path('book/chapter13/chapter13_activity.md').read_text(encoding='utf-8')
          theory = Path('presentation/chapter13/chapter13_theory_lecture_plan.md').read_text(encoding='utf-8')
          images = Path('images/chapter13/README.md').read_text(encoding='utf-8')
          schema = Path('code/chapter13/01_ai_review_lab_schema.sql').read_text(encoding='utf-8')
          gate = Path('code/chapter13/08_ai_review_lab_validation.sql').read_text(encoding='utf-8')
          script = Path('presentation/chapter13/chapter13_script.html').read_text(encoding='utf-8')
          assert [int(x) for x in re.findall(r'^##\s+(\d+)\.\s+', chapter, re.M)] == list(range(1,29))
          assert '### 예상 실패 24개' in activity and '| total | 30 |' in activity
          assert '예상 실패 22개' not in activity and '예상 실패 22개' not in theory
          assert '예상 실패 24개' in theory
          assert '반례 17' not in images and '예상 실패 24' in images and '정상 경계값 6' in images
          assert 'ChatGPT Work' in chapter and '2026년 8월 출판 검수 시점의 OpenAI 공식 안내' in chapter
          assert 'data-script-content-enhancer="off"' in script
          for token in ["has_database_privilege(current_user, current_database(), 'CREATE')", 'v_project_named_constraint_count <> 15', 'v_project_not_null_count <> 20']:
              assert token in schema
          for token in ['v_project_named_constraint_count <> 15', 'v_project_not_null_count <> 20', "column_name = 'recorded_amount'", 'uq_course_enrollments_active']:
              assert token in gate
          print('Chapter 13 definitive static checks passed')
          PY

      - name: Install PostgreSQL client and create database
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y postgresql-client >/dev/null
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE ai_database_book;"
          test "$(psql -d postgres -Atc "SELECT current_setting('server_version_num')::int / 10000")" = "16"

      - name: Build canonical Chapter 07 and Chapter 08 source
        run: |
          for f in \
            code/chapter07/01_course_project_schema.sql \
            code/chapter07/02_course_project_seed.sql \
            code/chapter07/03_course_project_changes.sql \
            code/chapter07/04_course_project_validation.sql \
            code/chapter08/00_check_course_project.sql \
            code/chapter08/03_join_aggregation_validation.sql; do
            psql -v ON_ERROR_STOP=1 -d ai_database_book -f "$f" >/dev/null
          done
          test "$(psql -d ai_database_book -Atc "SELECT (SELECT COUNT(*) FROM pg_constraint WHERE conrelid IN ('course_project.students'::regclass,'course_project.instructors'::regclass,'course_project.courses'::regclass,'course_project.enrollments'::regclass) AND conname IN ('uq_course_students_email','chk_course_students_name_not_blank','chk_course_students_email_not_blank','uq_course_instructors_email','chk_course_instructors_name_not_blank','chk_course_instructors_email_not_blank','chk_course_instructors_specialty_not_blank','fk_course_courses_instructor','chk_course_courses_title_not_blank','chk_course_courses_level','chk_course_courses_price','fk_course_enrollments_student','fk_course_enrollments_course','chk_course_enrollments_status','chk_course_enrollments_recorded_amount'))||':'||(SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='course_project' AND table_name IN ('students','instructors','courses','enrollments') AND is_nullable='NO')")" = "15:20"

      - name: Verify wrong database and CREATE privilege guards
        shell: bash
        run: |
          set +e
          psql -v ON_ERROR_STOP=1 -d postgres -f code/chapter13/01_ai_review_lab_schema.sql > /tmp/wrong_db.log 2>&1
          wrong_rc=$?
          set -e
          test "$wrong_rc" -ne 0
          grep -q 'ai_database_book' /tmp/wrong_db.log
          psql -v ON_ERROR_STOP=1 -d ai_database_book <<'SQL'
          CREATE ROLE ch13_no_create LOGIN PASSWORD 'chapter13-test';
          GRANT CONNECT ON DATABASE ai_database_book TO ch13_no_create;
          REVOKE CREATE ON DATABASE ai_database_book FROM ch13_no_create;
          GRANT USAGE ON SCHEMA course_project TO ch13_no_create;
          GRANT SELECT ON ALL TABLES IN SCHEMA course_project TO ch13_no_create;
          SQL
          set +e
          PGUSER=ch13_no_create PGPASSWORD=chapter13-test psql -h localhost -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter13/01_ai_review_lab_schema.sql > /tmp/no_create.log 2>&1
          create_rc=$?
          set -e
          test "$create_rc" -ne 0
          grep -q 'CREATE 권한' /tmp/no_create.log
          test "$(psql -d ai_database_book -Atc "SELECT to_regnamespace('ai_review_lab') IS NULL")" = "t"

      - name: Build Chapter 12 handoff and protected state
        run: |
          for f in 01_nosql_lab_schema.sql 02_nosql_lab_seed.sql 03_document_jsonb_queries.sql 04_key_value_cache_queries.sql 05_storage_choice_review.sql 06_jsonb_index_candidates.sql 07_nosql_lab_validation.sql; do
            psql -v ON_ERROR_STOP=1 -d ai_database_book -f "code/chapter12/$f" >/dev/null
          done
          psql -v ON_ERROR_STOP=1 -d ai_database_book <<'SQL'
          CREATE SCHEMA transaction_lab;
          CREATE SCHEMA performance_lab;
          CREATE SCHEMA security_lab;
          CREATE TABLE transaction_lab.chapter13_guard(id INTEGER PRIMARY KEY, note TEXT NOT NULL);
          CREATE TABLE performance_lab.chapter13_guard(id INTEGER PRIMARY KEY, note TEXT NOT NULL);
          CREATE TABLE security_lab.chapter13_guard(id INTEGER PRIMARY KEY, note TEXT NOT NULL);
          CREATE TABLE nosql_lab.chapter13_guard(id INTEGER PRIMARY KEY, note TEXT NOT NULL);
          INSERT INTO transaction_lab.chapter13_guard VALUES (1, 'transaction-protected');
          INSERT INTO performance_lab.chapter13_guard VALUES (1, 'performance-protected');
          INSERT INTO security_lab.chapter13_guard VALUES (1, 'security-protected');
          INSERT INTO nosql_lab.chapter13_guard VALUES (1, 'nosql-protected');
          SQL
          psql -d ai_database_book -Atc "SELECT md5((SELECT jsonb_agg(to_jsonb(s) ORDER BY id)::text FROM course_project.students s)||(SELECT jsonb_agg(to_jsonb(i) ORDER BY id)::text FROM course_project.instructors i)||(SELECT jsonb_agg(to_jsonb(c) ORDER BY id)::text FROM course_project.courses c)||(SELECT jsonb_agg(to_jsonb(e) ORDER BY id)::text FROM course_project.enrollments e));" > /tmp/course_before
          psql -d ai_database_book -Atc "SELECT md5((SELECT jsonb_agg(to_jsonb(d) ORDER BY id)::text FROM nosql_lab.course_documents d)||(SELECT jsonb_agg(to_jsonb(k) ORDER BY cache_key)::text FROM nosql_lab.key_value_cache_examples k)||(SELECT jsonb_agg(to_jsonb(s) ORDER BY id)::text FROM nosql_lab.storage_choice_cases s));" > /tmp/nosql_before

      - name: Verify prerequisite drift guard
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book -c "UPDATE course_project.enrollments SET recorded_amount=120001 WHERE id=1005;" >/dev/null
          set +e
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter13/01_ai_review_lab_schema.sql > /tmp/drift.log 2>&1
          drift_rc=$?
          set -e
          test "$drift_rc" -ne 0
          test "$(psql -d ai_database_book -Atc "SELECT to_regnamespace('ai_review_lab') IS NULL")" = "t"
          psql -v ON_ERROR_STOP=1 -d ai_database_book -c "UPDATE course_project.enrollments SET recorded_amount=120000 WHERE id=1005;" >/dev/null

      - name: Run Chapter 13 01 through 08 and exact-state checks
        run: |
          for f in 01_ai_review_lab_schema.sql 02_bad_design_seed.sql 03_good_design_schema.sql 04_good_design_seed.sql; do
            psql -v ON_ERROR_STOP=1 -d ai_database_book -f "code/chapter13/$f" >/dev/null
          done
          psql -v ON_ERROR_STOP=1 -d ai_database_book \
            -f code/chapter13/05_metadata_validation.sql \
            -f code/chapter13/06_business_validation.sql \
            -f code/chapter13/07_negative_tests.sql \
            -f code/chapter13/08_ai_review_lab_validation.sql > /tmp/ch13.log 2>&1
          grep -q 'Chapter 13 negative and boundary tests passed: 30/30' /tmp/ch13.log
          grep -q 'Chapter 13 AI review lab validation passed: tests 30/30' /tmp/ch13.log
          test "$(psql -d ai_database_book -Atc "SELECT (SELECT COUNT(*) FROM ai_review_lab.bad_enrollments)||':'||(SELECT COUNT(*) FROM ai_review_lab.students)||':'||(SELECT COUNT(*) FROM ai_review_lab.instructors)||':'||(SELECT COUNT(*) FROM ai_review_lab.courses)||':'||(SELECT COUNT(*) FROM ai_review_lab.enrollments)||':'||(SELECT COUNT(*) FROM ai_review_lab.payments)||':'||(SELECT SUM(recorded_amount) FROM ai_review_lab.enrollments)||':'||(SELECT SUM(amount) FROM ai_review_lab.payments)")" = "3:3:2:3:4:4:470000:470000"
          test "$(psql -d ai_database_book -Atc "SELECT COUNT(*) FROM pg_constraint WHERE connamespace='ai_review_lab'::regnamespace AND conrelid IN ('ai_review_lab.students'::regclass,'ai_review_lab.instructors'::regclass,'ai_review_lab.courses'::regclass,'ai_review_lab.enrollments'::regclass,'ai_review_lab.payments'::regclass)")" = "29"
          test "$(psql -d ai_database_book -Atc "SELECT COUNT(*) FROM information_schema.table_constraints WHERE constraint_schema='ai_review_lab' AND constraint_type='FOREIGN KEY'")" = "4"

      - name: Verify business drift, protected fingerprints, and reset isolation
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book -c "UPDATE ai_review_lab.payments SET payment_status='결제대기', paid_at=NULL, refunded_at=NULL WHERE id=9001;" >/dev/null
          set +e
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter13/06_business_validation.sql > /tmp/business_drift.log 2>&1
          business_rc=$?
          set -e
          test "$business_rc" -ne 0
          psql -v ON_ERROR_STOP=1 -d ai_database_book -c "UPDATE ai_review_lab.payments SET payment_status='결제완료', paid_at='2026-07-01 10:00:00+09', refunded_at=NULL WHERE id=9001;" >/dev/null
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter13/06_business_validation.sql >/dev/null
          test "$(cat /tmp/course_before)" = "$(psql -d ai_database_book -Atc "SELECT md5((SELECT jsonb_agg(to_jsonb(s) ORDER BY id)::text FROM course_project.students s)||(SELECT jsonb_agg(to_jsonb(i) ORDER BY id)::text FROM course_project.instructors i)||(SELECT jsonb_agg(to_jsonb(c) ORDER BY id)::text FROM course_project.courses c)||(SELECT jsonb_agg(to_jsonb(e) ORDER BY id)::text FROM course_project.enrollments e));")"
          test "$(cat /tmp/nosql_before)" = "$(psql -d ai_database_book -Atc "SELECT md5((SELECT jsonb_agg(to_jsonb(d) ORDER BY id)::text FROM nosql_lab.course_documents d)||(SELECT jsonb_agg(to_jsonb(k) ORDER BY cache_key)::text FROM nosql_lab.key_value_cache_examples k)||(SELECT jsonb_agg(to_jsonb(s) ORDER BY id)::text FROM nosql_lab.storage_choice_cases s));")"
          test "$(psql -d ai_database_book -Atc "SELECT note FROM transaction_lab.chapter13_guard WHERE id=1")" = 'transaction-protected'
          test "$(psql -d ai_database_book -Atc "SELECT note FROM performance_lab.chapter13_guard WHERE id=1")" = 'performance-protected'
          test "$(psql -d ai_database_book -Atc "SELECT note FROM security_lab.chapter13_guard WHERE id=1")" = 'security-protected'
          test "$(psql -d ai_database_book -Atc "SELECT note FROM nosql_lab.chapter13_guard WHERE id=1")" = 'nosql-protected'
          psql -v ON_ERROR_STOP=1 -d ai_database_book -c "CREATE TABLE ai_review_lab.keep_me(id INTEGER PRIMARY KEY);" >/dev/null
          set +e
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter13/reset_ai_review_lab.sql > /tmp/reset_blocked.log 2>&1
          reset_rc=$?
          set -e
          test "$reset_rc" -ne 0
          test "$(psql -d ai_database_book -Atc "SELECT to_regclass('ai_review_lab.keep_me') IS NOT NULL")" = 't'
          test "$(psql -d ai_database_book -Atc "SELECT to_regclass('ai_review_lab.bad_enrollments') IS NOT NULL")" = 't'
          psql -v ON_ERROR_STOP=1 -d ai_database_book -c "DROP TABLE ai_review_lab.keep_me;" >/dev/null
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter13/reset_ai_review_lab.sql > /tmp/reset.log 2>&1
          grep -q 'Chapter 13 ai_review_lab reset passed' /tmp/reset.log
          test "$(psql -d ai_database_book -Atc "SELECT to_regnamespace('ai_review_lab') IS NULL")" = 't'
          test "$(cat /tmp/course_before)" = "$(psql -d ai_database_book -Atc "SELECT md5((SELECT jsonb_agg(to_jsonb(s) ORDER BY id)::text FROM course_project.students s)||(SELECT jsonb_agg(to_jsonb(i) ORDER BY id)::text FROM course_project.instructors i)||(SELECT jsonb_agg(to_jsonb(c) ORDER BY id)::text FROM course_project.courses c)||(SELECT jsonb_agg(to_jsonb(e) ORDER BY id)::text FROM course_project.enrollments e));")"
          test "$(cat /tmp/nosql_before)" = "$(psql -d ai_database_book -Atc "SELECT md5((SELECT jsonb_agg(to_jsonb(d) ORDER BY id)::text FROM nosql_lab.course_documents d)||(SELECT jsonb_agg(to_jsonb(k) ORDER BY cache_key)::text FROM nosql_lab.key_value_cache_examples k)||(SELECT jsonb_agg(to_jsonb(s) ORDER BY id)::text FROM nosql_lab.storage_choice_cases s));")"
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter08/00_check_course_project.sql >/dev/null
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter08/03_join_aggregation_validation.sql >/dev/null
          echo 'Chapter 13 definitive PostgreSQL 16 validation passed'
