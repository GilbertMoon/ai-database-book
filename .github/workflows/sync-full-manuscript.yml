name: Sync full manuscript

on:
  push:
    branches:
      - main
    paths:
      - "book/chapter*/chapter*.md"
      - "code/chapter*/**"
      - "images/chapter*/**"
      - "scripts/migrate_project_image_assets.py"
      - "scripts/normalize_chapter_headers.py"
      - "scripts/sync_image_references.py"
      - "scripts/merge_chapters.py"
      - ".github/workflows/sync-full-manuscript.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Migrate project image assets
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/migrate_project_image_assets.py

      - name: Normalize chapter headers
        run: python scripts/normalize_chapter_headers.py

      - name: Synchronize image references
        run: python scripts/sync_image_references.py

      - name: Generate full manuscript
        run: python scripts/merge_chapters.py

      - name: Commit synchronized book assets
        shell: bash
        run: |
          if git diff --quiet -- book code images publish/full_manuscript.md; then
            echo "Book assets and full manuscript are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book code images publish/full_manuscript.md
          git commit -m "도서 자산 및 통합 원고 자동 동기화"
          git push
