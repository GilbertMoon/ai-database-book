name: Sync full manuscript

on:
  push:
    branches:
      - main
    paths:
      - "book/chapter*/chapter*.md"
      - "scripts/merge_chapters.py"
      - ".github/workflows/sync-full-manuscript.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate full manuscript
        run: python scripts/merge_chapters.py

      - name: Commit generated manuscript
        shell: bash
        run: |
          if git diff --quiet -- publish/full_manuscript.md; then
            echo "full_manuscript.md is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publish/full_manuscript.md
          git commit -m "1~15장 최신 원고로 통합 원고 재생성"
          git push
