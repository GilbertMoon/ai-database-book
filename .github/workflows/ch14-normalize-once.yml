name: Normalize Chapter 14 once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ch14-normalize-once.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize Chapter 14 sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          # 1) Canonical terminology, amount column, and asset version.
          files = []
          files += list(Path('book/chapter14').glob('*.md'))
          files += list(Path('code/chapter14').glob('*.sql'))
          files += list(Path('code/chapter14').glob('*.md'))
          files += list(Path('code/chapter14/python').glob('*.py'))
          files += list(Path('code/chapter14/python').glob('*.json'))
          files += list(Path('images/chapter14').glob('*.md'))
          files += list(Path('images/chapter14').glob('*.mmd'))
          files += list(Path('images/chapter14').glob('*.svg'))
          files += list(Path('presentation/chapter14').glob('*'))
          files += [Path('notes/chapter14_review_checklist.md')]
          files += [Path('.github/workflows/validate-chapter14-navigation.yml')]

          for path in files:
              if not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8')
              text = text.replace('paid_amount', 'recorded_amount')
              text = text.replace('신청 당시 기록 금액', '신청 시점 기록 금액')
              text = text.replace('20260808a', '20260809a')
              text = text.replace('-- P14-M03. 전체 신청 중 현재 완료 상태의 비중', '-- P14-Q01 보조 지표. 전체 신청 중 현재 완료 상태의 비중')
              path.write_text(text, encoding='utf-8')

          # Remove duplicate TTS requirement created by canonical replacement.
          p = Path('.github/workflows/validate-chapter14-navigation.yml')
          text = read(p)
          text = text.replace("              'recorded_amount', 'date spine', 'manifest'", "              'date spine', 'manifest'")
          write(p, text)

          # 2) Strengthen 01 prerequisite continuity and canonical money types.
          p = Path('code/chapter14/01_analysis_lab_schema.sql')
          text = read(p)
          text = text.replace('    price INTEGER NOT NULL,', '    price NUMERIC(12,0) NOT NULL,')
          text = text.replace('    recorded_amount INTEGER NOT NULL,', '    recorded_amount NUMERIC(12,0) NOT NULL,')

          old_guard = "\n".join([
              'DO $$',
              'BEGIN',
              "    IF current_database() <> 'ai_database_book' THEN",
              '        RAISE EXCEPTION',
              "            '실행 중단: 현재 데이터베이스는 %입니다. ai_database_book에 연결하세요.',",
              '            current_database();',
              '    END IF;',
              '',
              "    IF to_regnamespace('analysis_lab') IS NOT NULL THEN",
              '        RAISE EXCEPTION',
              "            '실행 중단: analysis_lab이 이미 존재합니다. 보존 여부를 확인한 뒤 reset_analysis_lab.sql 사용을 검토하세요.';",
              '    END IF;',
              'END',
              '$$;'
          ])
          new_guard = "\n".join([
              'DO $$',
              'DECLARE',
              '    status_requested BIGINT;',
              '    status_learning BIGINT;',
              '    status_completed BIGINT;',
              '    status_cancelled BIGINT;',
              'BEGIN',
              "    IF current_database() <> 'ai_database_book' THEN",
              '        RAISE EXCEPTION',
              "            '실행 중단: 현재 데이터베이스는 %입니다. ai_database_book에 연결하세요.',",
              '            current_database();',
              '    END IF;',
              '',
              "    IF to_regclass('course_project.students') IS NULL",
              "       OR to_regclass('course_project.instructors') IS NULL",
              "       OR to_regclass('course_project.courses') IS NULL",
              "       OR to_regclass('course_project.enrollments') IS NULL THEN",
              '        RAISE EXCEPTION',
              "            '실행 중단: Chapter 07·08 course_project 기준 상태가 없습니다.';",
              '    END IF;',
              '',
              "    IF NOT EXISTS (",
              '        SELECT 1',
              '        FROM information_schema.columns',
              "        WHERE table_schema = 'course_project'",
              "          AND table_name = 'enrollments'",
              "          AND column_name = 'recorded_amount'",
              "          AND data_type = 'numeric'",
              '          AND numeric_precision = 12',
              '          AND numeric_scale = 0',
              '    ) THEN',
              '        RAISE EXCEPTION',
              "            '실행 중단: course_project.enrollments.recorded_amount는 NUMERIC(12,0)이어야 합니다.';",
              '    END IF;',
              '',
              "    SELECT COUNT(*) FILTER (WHERE status = '신청'),",
              "           COUNT(*) FILTER (WHERE status = '수강중'),",
              "           COUNT(*) FILTER (WHERE status = '완료'),",
              "           COUNT(*) FILTER (WHERE status = '취소')",
              '    INTO status_requested, status_learning, status_completed, status_cancelled',
              '    FROM course_project.enrollments;',
              '',
              '    IF (SELECT COUNT(*) FROM course_project.students) <> 3',
              '       OR (SELECT COUNT(*) FROM course_project.instructors) <> 2',
              '       OR (SELECT COUNT(*) FROM course_project.courses) <> 3',
              '       OR (SELECT COUNT(*) FROM course_project.enrollments) <> 5',
              '       OR status_requested <> 2',
              '       OR status_learning <> 1',
              '       OR status_completed <> 1',
              '       OR status_cancelled <> 1',
              '       OR (SELECT SUM(recorded_amount) FROM course_project.enrollments) <> 590000',
              "       OR (SELECT SUM(recorded_amount) FROM course_project.enrollments WHERE status IN ('신청','수강중')) <> 340000",
              "       OR (SELECT SUM(recorded_amount) FROM course_project.enrollments WHERE status <> '취소') <> 440000",
              "       OR NOT EXISTS (SELECT 1 FROM course_project.enrollments WHERE id = 1001 AND status = '완료' AND recorded_amount = 100000)",
              "       OR NOT EXISTS (SELECT 1 FROM course_project.enrollments WHERE id = 1004 AND status = '취소' AND recorded_amount = 150000)",
              "       OR NOT EXISTS (SELECT 1 FROM course_project.enrollments WHERE id = 1005 AND status = '신청' AND recorded_amount = 120000) THEN",
              '        RAISE EXCEPTION',
              "            '실행 중단: Chapter 07·08 course_project canonical 기준 상태와 다릅니다.';",
              '    END IF;',
              '',
              "    IF to_regnamespace('analysis_lab') IS NOT NULL THEN",
              '        RAISE EXCEPTION',
              "            '실행 중단: analysis_lab이 이미 존재합니다. 보존 여부를 확인한 뒤 reset_analysis_lab.sql 사용을 검토하세요.';",
              '    END IF;',
              'END',
              '$$;'
          ])
          if old_guard not in text:
              raise SystemExit('01 prerequisite guard marker not found')
          text = text.replace(old_guard, new_guard, 1)
          text = text.replace(
              'COMMIT;\n\n-- 생성 결과 확인',
              "COMMIT;\n\nDO $$\nBEGIN\n    IF (SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'analysis_lab') <> 4\n       OR (SELECT COUNT(*) FROM information_schema.views WHERE table_schema = 'analysis_lab') <> 1 THEN\n        RAISE EXCEPTION 'Chapter 14 schema creation validation failed.';\n    END IF;\n    RAISE NOTICE 'Chapter 14 analysis lab schema validation passed';\nEND\n$$;\n\n-- 생성 결과 확인",
              1,
          )
          write(p, text)

          # 3) Seed success gate.
          p = Path('code/chapter14/02_analysis_lab_seed.sql')
          text = read(p)
          text = text.replace(
              'COMMIT;\n\n-- 기대 행 수:',
              "COMMIT;\n\nDO $$\nBEGIN\n    IF (SELECT COUNT(*) FROM analysis_lab.students) <> 8\n       OR (SELECT COUNT(*) FROM analysis_lab.instructors) <> 3\n       OR (SELECT COUNT(*) FROM analysis_lab.courses) <> 5\n       OR (SELECT COUNT(*) FROM analysis_lab.enrollments) <> 24\n       OR (SELECT SUM(recorded_amount) FROM analysis_lab.enrollments) <> 2770000 THEN\n        RAISE EXCEPTION 'Chapter 14 seed post-commit validation failed.';\n    END IF;\n    RAISE NOTICE 'Chapter 14 analysis lab seed validation passed';\nEND\n$$;\n\n-- 기대 행 수:",
              1,
          )
          write(p, text)

          # 4) Make dataset view creation transactional and self-validating.
          p = Path('code/chapter14/06_analysis_dataset.sql')
          text = read(p)
          text = text.replace('CREATE VIEW analysis_lab.enrollment_analysis_dataset AS', 'BEGIN;\n\nCREATE VIEW analysis_lab.enrollment_analysis_dataset AS', 1)
          marker = "  AND e.enrolled_at < p.end_date_exclusive;\n\n-- 1. 전체 데이터셋"
          replacement = "  AND e.enrolled_at < p.end_date_exclusive;\n\nDO $$\nBEGIN\n    IF (SELECT COUNT(*) FROM analysis_lab.enrollment_analysis_dataset) <> 24\n       OR (SELECT COUNT(DISTINCT enrollment_id) FROM analysis_lab.enrollment_analysis_dataset) <> 24\n       OR (SELECT SUM(recorded_amount) FROM analysis_lab.enrollment_analysis_dataset) <> 2770000 THEN\n        RAISE EXCEPTION 'Chapter 14 analysis dataset validation failed before COMMIT.';\n    END IF;\nEND\n$$;\n\nCOMMIT;\n\nDO $$ BEGIN RAISE NOTICE 'Chapter 14 analysis dataset validation passed'; END $$;\n\n-- 1. 전체 데이터셋"
          if marker not in text:
              raise SystemExit('06 view completion marker not found')
          text = text.replace(marker, replacement, 1)
          write(p, text)

          # 5) Strengthen final gate with upstream continuity and exact money types.
          p = Path('code/chapter14/08_analysis_lab_validation.sql')
          text = read(p)
          insert_marker = "    -- 정확한 테이블 집합 4개\n"
          insert = "\n".join([
              '    -- Chapter 07·08 protected source continuity',
              '    IF (SELECT COUNT(*) FROM course_project.students) <> 3',
              '       OR (SELECT COUNT(*) FROM course_project.instructors) <> 2',
              '       OR (SELECT COUNT(*) FROM course_project.courses) <> 3',
              '       OR (SELECT COUNT(*) FROM course_project.enrollments) <> 5',
              '       OR (SELECT SUM(recorded_amount) FROM course_project.enrollments) <> 590000',
              "       OR (SELECT SUM(recorded_amount) FROM course_project.enrollments WHERE status IN ('신청','수강중')) <> 340000",
              "       OR (SELECT SUM(recorded_amount) FROM course_project.enrollments WHERE status <> '취소') <> 440000 THEN",
              "        RAISE EXCEPTION '검증 실패: Chapter 07·08 protected source 기준 상태가 변경되었습니다.';",
              '    END IF;',
              '',
              '    -- 금액 컬럼은 Chapter 07 이후 기준과 같은 NUMERIC(12,0)을 사용합니다.',
              '    IF (',
              '        SELECT COUNT(*)',
              '        FROM information_schema.columns',
              "        WHERE table_schema = 'analysis_lab'",
              "          AND ((table_name = 'courses' AND column_name = 'price')",
              "            OR (table_name = 'enrollments' AND column_name = 'recorded_amount'))",
              "          AND data_type = 'numeric'",
              '          AND numeric_precision = 12',
              '          AND numeric_scale = 0',
              '    ) <> 2 THEN',
              "        RAISE EXCEPTION '검증 실패: analysis_lab 가격·기록 금액 타입은 NUMERIC(12,0)이어야 합니다.';",
              '    END IF;',
              ''
          ]) + '\n'
          if insert_marker not in text:
              raise SystemExit('08 insertion marker not found')
          text = text.replace(insert_marker, insert + insert_marker, 1)
          text = text.replace("RAISE NOTICE 'Chapter 14 analysis_lab validation passed';", "RAISE NOTICE 'Chapter 14 analysis_lab validation passed: rows 8/3/5/24/24, amount 2770000';")
          write(p, text)

          # 6) Strict DataFrame integer and derived completion validation.
          p = Path('code/chapter14/python/validation_utils.py')
          text = read(p)
          text = text.replace(
              'DATE_COLUMNS = ["enrolled_at", "enrollment_month", "completed_at"]\n',
              'DATE_COLUMNS = ["enrolled_at", "enrollment_month", "completed_at"]\nID_COLUMNS = ["enrollment_id", "student_id", "course_id", "instructor_id"]\n',
              1,
          )
          old = "\n".join([
              '    for column in DATE_COLUMNS:',
              '        normalized[column] = pd.to_datetime(',
              '            normalized[column],',
              '            errors="raise",',
              '        )',
              '',
              '    normalized["recorded_amount"] = pd.to_numeric(',
              '        normalized["recorded_amount"],',
              '        errors="raise",',
              '    )'
          ])
          new = "\n".join([
              '    for column in ID_COLUMNS:',
              '        values = pd.to_numeric(normalized[column], errors="raise")',
              '        if values.isna().any() or ((values % 1) != 0).any():',
              '            raise ValueError(f"{column}은 NULL 없는 정수여야 합니다.")',
              '        normalized[column] = values.astype("int64")',
              '',
              '    for column in DATE_COLUMNS:',
              '        normalized[column] = pd.to_datetime(',
              '            normalized[column],',
              '            errors="raise",',
              '        )',
              '',
              '    normalized["recorded_amount"] = pd.to_numeric(',
              '        normalized["recorded_amount"],',
              '        errors="raise",',
              '    )',
              '    if normalized["recorded_amount"].isna().any():',
              '        raise ValueError("recorded_amount에 NULL이 있습니다.")',
              '    if ((normalized["recorded_amount"] % 1) != 0).any():',
              '        raise ValueError("recorded_amount는 정수 단위 금액이어야 합니다.")',
              '    normalized["recorded_amount"] = normalized["recorded_amount"].astype("int64")'
          ])
          if old not in text:
              raise SystemExit('validation_utils numeric marker not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '    if normalized["recorded_amount"].isna().any():\n        raise ValueError("recorded_amount에 NULL이 있습니다.")\n',
              '',
              1,
          )
          completion_marker = '    if (normalized.loc[expected_completed, "completion_days"] < 0).any():\n        raise ValueError("completion_days에 음수가 있습니다.")\n'
          completion_add = completion_marker + "\n    actual_completion_days = (\n        normalized.loc[expected_completed, \"completed_at\"]\n        - normalized.loc[expected_completed, \"enrolled_at\"]\n    ).dt.days.astype(float)\n    stored_completion_days = normalized.loc[expected_completed, \"completion_days\"].astype(float)\n    if not stored_completion_days.equals(actual_completion_days):\n        raise ValueError(\"completion_days가 completed_at - enrolled_at과 일치하지 않습니다.\")\n"
          if completion_marker not in text:
              raise SystemExit('validation_utils completion marker not found')
          text = text.replace(completion_marker, completion_add, 1)
          write(p, text)

          # 7) Replace reset with exact-object, transactional, protected-source-safe reset.
          reset = "\n".join([
              '-- Chapter 14. analysis_lab 초기화',
              '-- 주의: 예상한 Chapter 14 객체만 삭제하며, 예상 밖 객체가 있으면 중단합니다.',
              '',
              'SELECT current_database();',
              'SELECT current_user;',
              'SELECT current_schema();',
              'SHOW search_path;',
              '',
              'DO $$',
              'DECLARE',
              '    unexpected_count INTEGER;',
              'BEGIN',
              "    IF current_database() <> 'ai_database_book' THEN",
              '        RAISE EXCEPTION',
              "            '초기화 중단: 현재 데이터베이스는 %입니다. ai_database_book에서만 실행하세요.',",
              '            current_database();',
              '    END IF;',
              '',
              "    IF to_regnamespace('analysis_lab') IS NULL THEN",
              "        RAISE EXCEPTION '초기화 중단: analysis_lab 스키마가 없습니다.';",
              '    END IF;',
              '',
              '    WITH expected(kind, name) AS (',
              "        VALUES ('table','students'), ('table','instructors'), ('table','courses'), ('table','enrollments'),",
              "               ('view','analysis_parameters'), ('view','enrollment_analysis_dataset')",
              '    ), actual(kind, name) AS (',
              "        SELECT 'table', table_name FROM information_schema.tables WHERE table_schema = 'analysis_lab'",
              '        UNION ALL',
              "        SELECT 'view', table_name FROM information_schema.views WHERE table_schema = 'analysis_lab'",
              '    )',
              '    SELECT COUNT(*) INTO unexpected_count',
              '    FROM actual a',
              '    LEFT JOIN expected e USING (kind, name)',
              '    WHERE e.name IS NULL;',
              '',
              '    IF unexpected_count <> 0 THEN',
              '        RAISE EXCEPTION',
              "            '초기화 중단: analysis_lab에 예상 밖 테이블/VIEW가 %개 있습니다.', unexpected_count;",
              '    END IF;',
              '',
              '    IF (SELECT COUNT(*) FROM course_project.enrollments) <> 5',
              '       OR (SELECT SUM(recorded_amount) FROM course_project.enrollments) <> 590000 THEN',
              "        RAISE EXCEPTION '초기화 중단: 보호 대상 course_project 기준 상태가 다릅니다.';",
              '    END IF;',
              'END',
              '$$;',
              '',
              'BEGIN;',
              'DROP VIEW analysis_lab.enrollment_analysis_dataset;',
              'DROP VIEW analysis_lab.analysis_parameters;',
              'DROP TABLE analysis_lab.enrollments;',
              'DROP TABLE analysis_lab.courses;',
              'DROP TABLE analysis_lab.instructors;',
              'DROP TABLE analysis_lab.students;',
              'DROP SCHEMA analysis_lab;',
              '',
              'DO $$',
              'BEGIN',
              "    IF to_regnamespace('analysis_lab') IS NOT NULL THEN",
              "        RAISE EXCEPTION '초기화 실패: analysis_lab이 남아 있습니다.';",
              '    END IF;',
              '    IF (SELECT COUNT(*) FROM course_project.enrollments) <> 5',
              '       OR (SELECT SUM(recorded_amount) FROM course_project.enrollments) <> 590000 THEN',
              "        RAISE EXCEPTION '초기화 실패: 보호 대상 course_project가 변경되었습니다.';",
              '    END IF;',
              'END',
              '$$;',
              'COMMIT;',
              '',
              "DO $$ BEGIN RAISE NOTICE 'Chapter 14 analysis lab reset passed'; END $$;",
              '',
              '-- 초기화 후 01_analysis_lab_schema.sql부터 다시 실행합니다.',
              ''
          ])
          write('code/chapter14/reset_analysis_lab.sql', reset)

          # 8) Clarify that analysis_lab is a synthetic analytics scenario, not copied project state.
          insertions = [
              ('book/chapter14/chapter14.md', '실습 객체:\n', '> **격리 분석 시나리오 주의**\n> `analysis_lab`의 8명·3명·5개·24건 데이터는 SQL·Python 분석을 학습하기 위해 만든 합성 기준 데이터입니다. `course_project`의 행을 확장하거나 복제한 운영 데이터가 아니며, 기존 `course_project.enrollments.recorded_amount NUMERIC(12,0)`의 의미를 그대로 이어 받아 신청 시점 기록 금액으로 사용합니다.\n\n실습 객체:\n'),
              ('book/chapter14/chapter14_outline.md', '## 기준 데이터\n', '## 격리 분석 시나리오\n\n`analysis_lab`은 분석 연습을 위한 합성 기준 데이터이며 `course_project`를 변경·복제한 운영 데이터가 아니다. 금액 의미는 `recorded_amount NUMERIC(12,0)` = 신청 시점 기록 금액으로 이어 간다.\n\n## 기준 데이터\n'),
              ('code/chapter14/README.md', '## 기준 데이터', '> `analysis_lab`은 분석 학습용 합성 데이터입니다. `course_project`를 복제·확장한 운영 데이터가 아니며, `recorded_amount NUMERIC(12,0)`는 앞 장과 동일하게 신청 시점 기록 금액입니다.\n\n## 기준 데이터'),
              ('presentation/chapter14/chapter14_theory_lecture_plan.md', 'analysis_lab', 'analysis_lab'),
          ]
          for path, marker, replacement in insertions:
              text = read(path)
              if path.endswith('theory_lecture_plan.md'):
                  # The terminology normalization is sufficient here; avoid altering title keys.
                  continue
              if marker not in text:
                  raise SystemExit(f'document insertion marker missing: {path}')
              text = text.replace(marker, replacement, 1)
              write(path, text)

          # Fix any accidental duplicate wording from earlier drafts.
          for path in [Path('book/chapter14/chapter14.md'), Path('book/chapter14/chapter14_outline.md'), Path('code/chapter14/README.md')]:
              text = read(path).replace('신청 시점 신청 시점 기록 금액', '신청 시점 기록 금액')
              write(path, text)

          # 9) Self-check key invariants before commit.
          checks = {
              '01 canonical amount': "recorded_amount NUMERIC(12,0) NOT NULL" in read('code/chapter14/01_analysis_lab_schema.sql'),
              '01 upstream gate': '590000' in read('code/chapter14/01_analysis_lab_schema.sql') and '340000' in read('code/chapter14/01_analysis_lab_schema.sql') and '440000' in read('code/chapter14/01_analysis_lab_schema.sql'),
              '08 money types': 'NUMERIC(12,0)' in read('code/chapter14/08_analysis_lab_validation.sql'),
              'reset transactional': 'BEGIN;' in read('code/chapter14/reset_analysis_lab.sql') and 'COMMIT;' in read('code/chapter14/reset_analysis_lab.sql'),
              'asset version': "ASSET_VERSION = '20260809a'" in read('presentation/chapter14/chapter14_player.js'),
              'strict ids': 'ID_COLUMNS' in read('code/chapter14/python/validation_utils.py'),
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit(f'Chapter 14 normalization self-check failed: {failed}')

          # No stale physical amount name may remain in Chapter 14 source scope.
          stale_hits = []
          for path in files:
              if path.is_file() and 'paid_amount' in path.read_text(encoding='utf-8'):
                  stale_hits.append(str(path))
          if stale_hits:
              raise SystemExit(f'stale paid_amount remains: {stale_hits}')
          PY

      - name: Commit normalized Chapter 14 and remove workflow
        shell: bash
        run: |
          rm .github/workflows/ch14-normalize-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add book/chapter14 code/chapter14 images/chapter14 presentation/chapter14 notes/chapter14_review_checklist.md .github/workflows/validate-chapter14-navigation.yml .github/workflows/ch14-normalize-once.yml
          git diff --cached --check
          git commit -m "Align Chapter 14 analysis semantics and validation"
          git push
