name: Apply Chapter 05 publication postfix once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ch05-postfix-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply postfix
        run: python scripts/ch05_postfix_once.py
      - name: Remove one-off workflow
        run: rm -f .github/workflows/ch05-postfix-once.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Polish Chapter 05 publication details'
          git push
