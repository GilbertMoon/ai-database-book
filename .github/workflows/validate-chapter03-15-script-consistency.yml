name: Validate Chapter 03-15 script consistency

on:
  push:
    branches: [main]
    paths:
      - presentation/chapter03/**
      - presentation/chapter04/**
      - presentation/chapter05/**
      - presentation/chapter06/**
      - presentation/chapter07/**
      - presentation/chapter08/**
      - presentation/chapter09/**
      - presentation/chapter10/**
      - presentation/chapter11/**
      - presentation/chapter12/**
      - presentation/chapter13/**
      - presentation/chapter14/**
      - presentation/chapter15/**
      - presentation/common/script_content_enhancer.js
      - .github/workflows/validate-chapter03-15-script-consistency.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate shared script behavior and enrichment
        run: |
          node --check presentation/common/script_content_enhancer.js
          for chapter in $(seq -w 3 15); do
            node --check presentation/chapter${chapter}/chapter${chapter}_script.js
          done
          node --check presentation/chapter08/chapter08_navigation.js
          node --check presentation/chapter08/chapter08_player.js

          python - <<'PY'
          from pathlib import Path

          errors = []
          root = Path('presentation')
          chapters = [f'{n:02d}' for n in range(3, 16)]

          enhancer = (root / 'common' / 'script_content_enhancer.js').read_text(encoding='utf-8')
          required_enhancer_terms = [
              "const VERSION = '20260808e'",
              'while (output.length < 2)',
              'stepParagraphs.every',
              'MutationObserver',
              'overviewText',
          ]
          for term in required_enhancer_terms:
              if term not in enhancer:
                  errors.append(f'shared enhancer missing: {term}')

          for chapter in chapters:
              folder = root / f'chapter{chapter}'
              script_html = folder / f'chapter{chapter}_script.html'
              script_js = folder / f'chapter{chapter}_script.js'
              if not script_html.exists():
                  errors.append(f'Chapter {chapter}: script HTML missing')
                  continue
              if not script_js.exists():
                  errors.append(f'Chapter {chapter}: script JS missing')
                  continue

              html = script_html.read_text(encoding='utf-8')
              js = script_js.read_text(encoding='utf-8')
              if '../common/script_content_enhancer.js?v=20260808e' not in html:
                  errors.append(f'Chapter {chapter}: shared script enhancer not loaded')
              if "stepIndex === 0 ? '전체 보기'" not in js:
                  errors.append(f'Chapter {chapter}: whole-view state missing')
              if "request-next" not in js or "request-prev" not in js:
                  errors.append(f'Chapter {chapter}: parent/child step delegation missing')
              if 'stepIndex + 1' not in js:
                  errors.append(f'Chapter {chapter}: sequential next-step behavior missing')

          ch8 = root / 'chapter08'
          nav8 = (ch8 / 'chapter08_navigation.js').read_text(encoding='utf-8')
          player8 = (ch8 / 'chapter08_player.js').read_text(encoding='utf-8')
          script8 = (ch8 / 'chapter08_script.html').read_text(encoding='utf-8')
          for presentation in ['chapter08_theory_presentation.html', 'chapter08_practice_presentation.html']:
              html = (ch8 / presentation).read_text(encoding='utf-8')
              if 'chapter08_navigation.js?v=20260808e' not in html:
                  errors.append(f'Chapter 08: semantic navigation missing from {presentation}')
              if html.index('chapter08_navigation.js') > html.index('chapter08_player.js'):
                  errors.append(f'Chapter 08: navigation loads after player in {presentation}')

          if 'Math.floor(index * total' in player8 or 'scriptSegments' in player8:
              errors.append('Chapter 08: legacy proportional focus or script segmentation remains')
          if 'data-focus-step' not in nav8 or 'balancedGroups' not in nav8:
              errors.append('Chapter 08: semantic focus preparation is incomplete')
          if 'ttsRules' in script8 or 'function segments' in script8:
              errors.append('Chapter 08: legacy local TTS/segment runtime remains in script HTML')
          if '../common/tts_pronunciation.js?v=20260808e' not in script8:
              errors.append('Chapter 08: common TTS module missing')

          theory = (ch8 / 'chapter08_theory_lecture_plan.md').read_text(encoding='utf-8')
          practice = (ch8 / 'chapter08_practice_lecture_plan.md').read_text(encoding='utf-8')
          theory_count = sum(1 for line in theory.splitlines() if line.startswith('## '))
          practice_count = sum(1 for line in practice.splitlines() if line.startswith('## '))
          if theory_count < 10 or practice_count < 10:
              errors.append(f'Chapter 08 lecture-plan slide counts look too small: theory={theory_count}, practice={practice_count}')

          if errors:
              print('FAIL:')
              for error in errors:
                  print('-', error)
              raise SystemExit(1)

          print('Chapter 03-15 shared whole-view and sequential step behavior OK')
          print('Chapter 03-15 shared 2+ sentence script enrichment loaded OK')
          print('Chapter 08 semantic navigation and common TTS migration OK')
          print(f'Chapter 08 lecture plans detected: theory={theory_count}, practice={practice_count}')
          PY
