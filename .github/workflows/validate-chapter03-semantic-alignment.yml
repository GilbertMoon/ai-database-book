name: Validate Chapter 03 semantic alignment

on:
  push:
    branches: [main]
    paths:
      - presentation/chapter03/**
      - .github/workflows/validate-chapter03-semantic-alignment.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Chapter 03 screen-script alignment
        run: |
          node --check presentation/chapter03/chapter03_semantic_plan.js
          node --check presentation/chapter03/chapter03_navigation.js
          node --check presentation/chapter03/chapter03_script.js
          node presentation/chapter03/validate_chapter03_semantic_alignment.mjs
