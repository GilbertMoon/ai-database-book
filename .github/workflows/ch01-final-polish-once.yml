name: Apply Chapter 01 final accuracy polish once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ch01-final-polish-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final accuracy polish
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          p = Path('book/chapter01/chapter01.md')
          text = p.read_text(encoding='utf-8')
          old = '실제 SQL을 실행하는 장에서는 다음 흐름으로 AI 결과를 검토합니다. Chapter 01에서는 작은 예제의 예상 결과를 손으로 먼저 확인하고, 실제 PostgreSQL 실행은 Chapter 04부터 적용합니다.'
          new = '실제 SQL을 실행하는 장에서는 다음 흐름으로 AI 결과를 검토합니다. Chapter 01에서는 작은 예제의 예상 결과를 손으로 먼저 확인합니다. Chapter 03에서는 PostgreSQL 연결과 현재 실행 위치를 확인하고, 테이블 생성과 데이터 처리 SQL은 Chapter 04부터 본격적으로 실습합니다.'
          if text.count(old) != 1:
              raise SystemExit('Chapter 03/04 execution scope sentence mismatch')
          text = text.replace(old, new, 1)
          old = '관계형 데이터베이스를 사용하는 것이 적절합니다. 학생·강사·강의·신청의 관계와 상태를 분리해서 관리하고, 중복·누락과 잘못된 관계를 제약조건으로 제한할 수 있기 때문입니다.'
          new = '관계형 데이터베이스를 사용하는 것이 적절합니다. 학생·강사·강의·신청의 관계와 상태를 분리해서 관리하고, 중복이나 잘못된 참조 같은 오류를 제약조건으로 줄일 수 있기 때문입니다.'
          if text.count(old) != 1:
              raise SystemExit('constraint capability sentence mismatch')
          text = text.replace(old, new, 1)
          old = 'AI가 분석을 더 많이 도와줄수록 데이터 품질, 조회 범위와 집계 기준은 사람이 직접 확인해야 합니다.'
          new = 'AI가 분석을 지원하더라도 데이터 품질, 조회 범위와 집계 기준은 사람이 직접 확인해야 합니다.'
          if text.count(old) != 1:
              raise SystemExit('analysis support wording mismatch')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          subprocess.run(['python', 'scripts/merge_chapters.py'], check=True)
          merged = Path('publish/full_manuscript.md').read_text(encoding='utf-8')
          if new not in merged:
              raise SystemExit('Merged manuscript missing final accuracy polish')
          Path('.github/workflows/ch01-final-polish-once.yml').unlink()
          PY
      - name: Commit final accuracy polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add book/chapter01/chapter01.md publish/full_manuscript.md .github/workflows/ch01-final-polish-once.yml
          git commit -m 'Polish Chapter 01 final accuracy'
          git push
