name: Validate Chapter 15

on:
  push:
    branches: [main]
    paths:
      - book/chapter15/**
      - code/chapter15/**
      - images/chapter15/**
      - presentation/chapter15/**
      - notes/chapter15_**
      - .github/workflows/validate-chapter15.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: ai_database_book
      PGPASSFILE: /tmp/ch15.pgpass

    steps:
      - uses: actions/checkout@v4

      - name: Static Chapter 15 checks
        shell: bash
        run: |
          set -euo pipefail
          node --check presentation/chapter15/chapter15_navigation.js
          node --check presentation/chapter15/chapter15_player.js
          node --check presentation/chapter15/chapter15_script.js
          node --check presentation/chapter15/chapter15_slides.js
          python -m compileall -q code/chapter15/templates/python
          python - <<'PY'
          from pathlib import Path
          import re, xml.etree.ElementTree as ET

          root=Path('.')
          chapter=(root/'book/chapter15/chapter15.md').read_text(encoding='utf-8')
          activity=(root/'book/chapter15/chapter15_activity.md').read_text(encoding='utf-8')
          outline=(root/'book/chapter15/chapter15_outline.md').read_text(encoding='utf-8')
          guide=(root/'book/chapter15/chapter15_project_guide.md').read_text(encoding='utf-8')
          review=(root/'book/chapter15/chapter15_review_revision.md').read_text(encoding='utf-8')
          checklist=(root/'notes/chapter15_review_checklist.md').read_text(encoding='utf-8')
          readme=(root/'code/chapter15/templates/README.md').read_text(encoding='utf-8')

          required_sql=[f'{i:02d}_' for i in range(1,12)]
          sql_files=sorted((root/'code/chapter15/templates').glob('[0-9][0-9]_*.sql'))
          names=[p.name for p in sql_files]
          for prefix in required_sql:
              if not any(n.startswith(prefix) for n in names):
                  raise SystemExit(f'missing Chapter 15 SQL prefix: {prefix}')

          for token in ['P15-R01','P15-R13','P15-Q01','P15-Q06','P15-V01','P15-V09']:
              if token not in chapter+activity+outline+guide+readme:
                  raise SystemExit(f'missing trace token: {token}')

          if 'DATABASE_URL' in ''.join(p.read_text(encoding='utf-8') for p in (root/'code/chapter15/templates').rglob('*') if p.is_file()):
              raise SystemExit('DATABASE_URL must not be used in Chapter 15 templates')

          protected=['course_project','transaction_lab','performance_lab','security_lab','nosql_lab','ai_review_lab','analysis_lab']
          for path in sql_files + [root/'code/chapter15/templates/reset_tutor_project.sql']:
              text=path.read_text(encoding='utf-8').lower()
              for schema in protected:
                  if re.search(rf'\b(create|alter|drop|truncate|insert\s+into|update|delete\s+from)\s+(schema\s+)?{schema}\b', text):
                      raise SystemExit(f'{path} mutates protected schema {schema}')

          theory=(root/'presentation/chapter15/chapter15_theory_lecture_plan.md').read_text(encoding='utf-8')
          practice=(root/'presentation/chapter15/chapter15_practice_lecture_plan.md').read_text(encoding='utf-8')
          for label,text in [('theory',theory),('practice',practice)]:
              nums=[int(x) for x in re.findall(r'^##\s+(\d+)\.',text,re.M)]
              if nums != list(range(1,21)):
                  raise SystemExit(f'{label} slide numbers are not 1..20: {nums}')
              sections=re.split(r'^##\s+\d+\.',text,flags=re.M)[1:]
              if any('**화면 구성**' not in s or '**발표 스크립트**' not in s for s in sections):
                  raise SystemExit(f'{label} has a slide without screen/script blocks')

          presentation_files=list((root/'presentation/chapter15').glob('*'))
          pres_text='\n'.join(p.read_text(encoding='utf-8') for p in presentation_files if p.is_file())
          if 'PresentationTTS' not in pres_text or 'script_content_enhancer' not in pres_text:
              raise SystemExit('Chapter 15 presentation TTS/enhancer wiring missing')

          mmd=sorted((root/'images/chapter15').glob('*.mmd'))
          svg=sorted((root/'images/chapter15').glob('*.svg'))
          if len(mmd) != len(svg) or len(svg) < 8:
              raise SystemExit(f'Chapter 15 image pair mismatch: mmd={len(mmd)}, svg={len(svg)}')
          if {p.stem for p in mmd}!={p.stem for p in svg}:
              raise SystemExit('Chapter 15 Mermaid/SVG stems differ')
          for p in svg:
              node=ET.parse(p).getroot()
              if node.attrib.get('role')!='img' or node.attrib.get('width')!='100%' or 'viewBox' not in node.attrib:
                  raise SystemExit(f'{p} missing accessible responsive SVG metadata')
              tags=[x.tag.split('}')[-1] for x in list(node)]
              if 'title' not in tags or 'desc' not in tags:
                  raise SystemExit(f'{p} missing title/desc')
              if p.name not in chapter:
                  raise SystemExit(f'{p.name} not referenced by Chapter 15 body')

          if 'CASCADE' in (root/'code/chapter15/templates/reset_tutor_project.sql').read_text(encoding='utf-8').upper():
              raise SystemExit('reset_tutor_project.sql must not use CASCADE')

          for token in ['실제 DB','Python','복원']:
              if token not in review+checklist:
                  raise SystemExit(f'review evidence missing: {token}')

          print(f'Chapter 15 static checks passed: SQL={len(sql_files)}, images={len(svg)}, theory=20, practice=20')
          PY

      - name: Install Python dependencies
        run: python -m pip install -r code/chapter15/templates/python/requirements.txt

      - name: Prepare PostgreSQL databases and protected sentinels
        shell: bash
        run: |
          set -euo pipefail
          printf 'localhost:5432:*:postgres:postgres\n' > "$PGPASSFILE"
          chmod 600 "$PGPASSFILE"
          createdb -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" ai_database_book
          psql -X -v ON_ERROR_STOP=1 -d ai_database_book <<'SQL'
          CREATE SCHEMA course_project; CREATE TABLE course_project.keep_me(id int primary key, note text); INSERT INTO course_project.keep_me VALUES(1,'course');
          CREATE SCHEMA transaction_lab; CREATE TABLE transaction_lab.keep_me(id int primary key, note text); INSERT INTO transaction_lab.keep_me VALUES(1,'transaction');
          CREATE SCHEMA performance_lab; CREATE TABLE performance_lab.keep_me(id int primary key, note text); INSERT INTO performance_lab.keep_me VALUES(1,'performance');
          CREATE SCHEMA security_lab; CREATE TABLE security_lab.keep_me(id int primary key, note text); INSERT INTO security_lab.keep_me VALUES(1,'security');
          CREATE SCHEMA nosql_lab; CREATE TABLE nosql_lab.keep_me(id int primary key, note text); INSERT INTO nosql_lab.keep_me VALUES(1,'nosql');
          CREATE SCHEMA ai_review_lab; CREATE TABLE ai_review_lab.keep_me(id int primary key, note text); INSERT INTO ai_review_lab.keep_me VALUES(1,'ai');
          CREATE SCHEMA analysis_lab; CREATE TABLE analysis_lab.keep_me(id int primary key, note text); INSERT INTO analysis_lab.keep_me VALUES(1,'analysis');
          SQL

      - name: Verify wrong database guard
        shell: bash
        run: |
          set -euo pipefail
          if psql -X -v ON_ERROR_STOP=1 -d postgres -f code/chapter15/templates/01_schema.sql >/tmp/ch15-wrong-db.log 2>&1; then
            cat /tmp/ch15-wrong-db.log
            echo '01_schema.sql unexpectedly succeeded in postgres DB'
            exit 1
          fi
          grep -q 'ai_database_book' /tmp/ch15-wrong-db.log

      - name: Run Chapter 15 SQL 01 through 10
        shell: bash
        run: |
          set -euo pipefail
          for f in code/chapter15/templates/{01_schema.sql,02_seed.sql,03_metadata_validation.sql,04_requirement_queries.sql,05_transaction_checks.sql,06_negative_tests.sql,07_performance_checks.sql,08_operations_checks.sql,09_analysis_dataset.sql,10_completion_gate.sql}; do
            echo "=== $f ==="
            psql -X -v ON_ERROR_STOP=1 -d ai_database_book -f "$f" 2>&1 | tee "/tmp/$(basename "$f").log"
          done
          grep -q 'Chapter 15 database completion gate passed' /tmp/10_completion_gate.sql.log

      - name: Verify exact database evidence and rerun guards
        shell: bash
        run: |
          set -euo pipefail
          state=$(psql -X -At -d ai_database_book -c "SELECT (SELECT count(*) FROM tutor_project.students)||':'||(SELECT count(*) FROM tutor_project.tutors)||':'||(SELECT count(*) FROM tutor_project.questions)||':'||(SELECT count(*) FROM tutor_project.answers)||':'||(SELECT count(*) FROM tutor_project.learning_materials)||':'||(SELECT count(*) FROM tutor_project.question_materials)||':'||(SELECT count(*) FROM tutor_project.question_analysis_dataset)||':'||(SELECT count(*) FROM pg_constraint WHERE connamespace='tutor_project'::regnamespace);")
          test "$state" = '4:3:5:5:6:7:5:36'
          summary=$(psql -X -At -d ai_database_book -c "SELECT count(*) FILTER (WHERE status='open')||':'||count(*) FILTER (WHERE status='answered')||':'||count(*) FILTER (WHERE status='closed')||':'||sum(answer_count)||':'||sum(material_count)||':'||round(avg(first_response_hours) FILTER (WHERE has_answer),2) FROM tutor_project.question_analysis_dataset;")
          test "$summary" = '1:3:1:5:7:2.00'
          if psql -X -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter15/templates/01_schema.sql >/tmp/ch15-rerun-01.log 2>&1; then exit 1; fi
          if psql -X -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter15/templates/02_seed.sql >/tmp/ch15-rerun-02.log 2>&1; then exit 1; fi

      - name: Verify protected schema isolation
        shell: bash
        run: |
          set -euo pipefail
          got=$(psql -X -At -d ai_database_book -c "SELECT string_agg(nspname||'='||(SELECT count(*) FROM pg_class c2 WHERE c2.relnamespace=n.oid AND c2.relname='keep_me'),',' ORDER BY nspname) FROM pg_namespace n WHERE nspname IN ('course_project','transaction_lab','performance_lab','security_lab','nosql_lab','ai_review_lab','analysis_lab');")
          test "$got" = 'ai_review_lab=1,analysis_lab=1,course_project=1,nosql_lab=1,performance_lab=1,security_lab=1,transaction_lab=1'

      - name: Run PostgreSQL and pandas cross-validation
        working-directory: code/chapter15/templates/python
        shell: bash
        run: |
          set -euo pipefail
          python 01_load_postgresql.py
          python 02_pandas_analysis.py
          python 03_result_validation.py | tee /tmp/ch15-python.log
          grep -q 'Chapter 15 SQL and pandas cross-validation passed' /tmp/ch15-python.log
          if PGDATABASE=postgres python 01_load_postgresql.py >/tmp/ch15-python-wrong-db.log 2>&1; then
            echo 'Python wrong DB guard unexpectedly succeeded'; exit 1
          fi
          grep -q 'ai_database_book' /tmp/ch15-python-wrong-db.log

      - name: Verify role allow and deny behavior
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -d ai_database_book <<'SQL'
          CREATE ROLE tutor_project_app NOLOGIN;
          CREATE ROLE tutor_project_report NOLOGIN;
          GRANT USAGE ON SCHEMA tutor_project TO tutor_project_app, tutor_project_report;
          GRANT SELECT ON tutor_project.students, tutor_project.tutors, tutor_project.questions, tutor_project.answers, tutor_project.learning_materials, tutor_project.question_materials TO tutor_project_app;
          GRANT INSERT ON tutor_project.questions, tutor_project.answers, tutor_project.question_materials TO tutor_project_app;
          GRANT UPDATE(status, updated_at) ON tutor_project.questions TO tutor_project_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA tutor_project TO tutor_project_app;
          GRANT SELECT ON tutor_project.question_analysis_dataset, tutor_project.student_question_summary, tutor_project.tutor_answer_summary, tutor_project.analysis_parameters TO tutor_project_report;
          SET ROLE tutor_project_report;
          SELECT count(*) FROM tutor_project.question_analysis_dataset;
          RESET ROLE;
          SET ROLE tutor_project_app;
          SELECT count(*) FROM tutor_project.questions;
          RESET ROLE;
          SQL
          if psql -X -v ON_ERROR_STOP=1 -d ai_database_book -c "SET ROLE tutor_project_report; INSERT INTO tutor_project.questions(student_id,question_code,title,body) VALUES(101,'CI-DENY-1','x','x');" >/tmp/ch15-role-report-deny.log 2>&1; then exit 1; fi
          if psql -X -v ON_ERROR_STOP=1 -d ai_database_book -c "SET ROLE tutor_project_app; DELETE FROM tutor_project.questions WHERE id=303;" >/tmp/ch15-role-app-delete.log 2>&1; then exit 1; fi
          if psql -X -v ON_ERROR_STOP=1 -d ai_database_book -c "SET ROLE tutor_project_app; CREATE TABLE tutor_project.nope(id int);" >/tmp/ch15-role-app-create.log 2>&1; then exit 1; fi
          psql -X -v ON_ERROR_STOP=1 -d ai_database_book <<'SQL'
          BEGIN;
          SET ROLE tutor_project_app;
          INSERT INTO tutor_project.questions(student_id,question_code,title,body,status,created_at,updated_at)
          VALUES(101,'CI-ALLOW-1','허용','권한 검증','open',TIMESTAMPTZ '2026-05-20 10:00:00+09',TIMESTAMPTZ '2026-05-20 10:00:00+09');
          ROLLBACK;
          SQL

      - name: Custom-format backup and template0 restore
        shell: bash
        run: |
          set -euo pipefail
          pg_dump -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d ai_database_book -Fc --schema=tutor_project --no-owner --no-privileges -f /tmp/tutor_project.backup
          test -s /tmp/tutor_project.backup
          sha256sum /tmp/tutor_project.backup | tee /tmp/tutor_project.backup.sha256
          pg_restore --list /tmp/tutor_project.backup > /tmp/tutor_project.list
          grep -q 'SCHEMA.*tutor_project' /tmp/tutor_project.list
          createdb -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -O postgres -T template0 tutor_project_restore
          pg_restore -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d tutor_project_restore --single-transaction --no-owner --no-privileges /tmp/tutor_project.backup
          psql -X -v ON_ERROR_STOP=1 -d tutor_project_restore -f code/chapter15/templates/11_restore_validation.sql 2>&1 | tee /tmp/ch15-restore.log
          grep -q 'Chapter 15 restore validation passed' /tmp/ch15-restore.log

      - name: Verify reset guard and isolation
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -d ai_database_book -c 'CREATE TABLE tutor_project.keep_me(id int primary key); INSERT INTO tutor_project.keep_me VALUES(1);'
          if psql -X -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter15/templates/reset_tutor_project.sql >/tmp/ch15-reset-guard.log 2>&1; then
            echo 'reset unexpectedly removed unknown object'; exit 1
          fi
          test "$(psql -X -At -d ai_database_book -c 'SELECT count(*) FROM tutor_project.questions;')" = '5'
          test "$(psql -X -At -d ai_database_book -c 'SELECT count(*) FROM tutor_project.keep_me;')" = '1'
          psql -X -v ON_ERROR_STOP=1 -d ai_database_book -c 'DROP TABLE tutor_project.keep_me;'
          psql -X -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter15/templates/reset_tutor_project.sql
          test "$(psql -X -At -d ai_database_book -c "SELECT to_regnamespace('tutor_project') IS NULL;")" = 't'
          got=$(psql -X -At -d ai_database_book -c "SELECT count(*) FROM pg_namespace WHERE nspname IN ('course_project','transaction_lab','performance_lab','security_lab','nosql_lab','ai_review_lab','analysis_lab');")
          test "$got" = '7'
