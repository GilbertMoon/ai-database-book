name: Chapter 12 final publication validation v2 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ch12-final-validation-v2-once.yml'

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Final static checks
        shell: bash
        run: |
          node --check presentation/chapter12/chapter12_slides.js
          node --check presentation/chapter12/chapter12_navigation.js
          node --check presentation/chapter12/chapter12_player.js
          node --check presentation/chapter12/chapter12_script.js
          python - <<'PY'
          from pathlib import Path
          import re
          chapter = Path('book/chapter12/chapter12.md').read_text(encoding='utf-8')
          outline = Path('book/chapter12/chapter12_outline.md').read_text(encoding='utf-8')
          activity = Path('book/chapter12/chapter12_activity.md').read_text(encoding='utf-8')
          schema = Path('code/chapter12/01_nosql_lab_schema.sql').read_text(encoding='utf-8')
          validation = Path('code/chapter12/07_nosql_lab_validation.sql').read_text(encoding='utf-8')
          readme = Path('code/chapter12/README.md').read_text(encoding='utf-8')
          theory = Path('presentation/chapter12/chapter12_theory_lecture_plan.md').read_text(encoding='utf-8')
          script_html = Path('presentation/chapter12/chapter12_script.html').read_text(encoding='utf-8')
          manuscript = Path('publish/full_manuscript.md').read_text(encoding='utf-8')

          assert [int(x) for x in re.findall(r'^##\s+(\d+)\.\s+', chapter, re.M)] == list(range(1, 25))
          for token in ['명명 제약조건 15개','NOT NULL 열 20개','expiration','eviction','MongoDB','Cassandra CQL','`jsonb_ops`','`jsonb_path_ops`','PostgreSQL 16']:
              assert token in chapter, token
          for token in ["has_database_privilege(current_user, current_database(), 'CREATE')",'v_project_named_constraint_count <> 15','v_project_not_null_count <> 20']:
              assert token in schema, token
          for token in ['v_project_named_constraint_count <> 15','v_project_not_null_count <> 20']:
              assert token in validation, token
          assert schema.find('DO $$') < schema.find('BEGIN;')
          assert 'data-script-content-enhancer="off"' in script_html
          assert 'expiration' in readme and 'eviction' in readme
          assert '`jsonb_ops`' in readme and '`jsonb_path_ops`' in readme
          assert '명명 제약조건 15개' in outline and 'NOT NULL 열 20개' in outline
          assert 'Chapter 07 명명 제약조건' in activity
          assert 'Cassandra CQL' in theory and 'eviction' in theory
          assert 'Chapter 12. 조회 패턴으로 RDBMS와 NoSQL 선택하기' in manuscript
          assert 'expiration' in manuscript and 'eviction' in manuscript
          print('Chapter 12 final static checks passed')
          PY

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql --version

      - name: Build canonical source
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE ai_database_book;"
          test "$(psql -d postgres -Atc "SELECT current_setting('server_version_num')::int / 10000")" = "16"
          for f in \
            code/chapter07/01_course_project_schema.sql \
            code/chapter07/02_course_project_seed.sql \
            code/chapter07/03_course_project_changes.sql \
            code/chapter07/04_course_project_validation.sql; do
            psql -v ON_ERROR_STOP=1 -d ai_database_book -f "$f"
          done
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter08/00_check_course_project.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter08/03_join_aggregation_validation.sql

      - name: Verify 15 and 20 inherited structure contract
        shell: bash
        run: |
          STRUCTURE=$(psql -d ai_database_book -At -v ON_ERROR_STOP=1 <<'SQL'
          SELECT
            (SELECT COUNT(*) FROM pg_constraint
             WHERE conrelid IN ('course_project.students'::regclass,'course_project.instructors'::regclass,'course_project.courses'::regclass,'course_project.enrollments'::regclass)
               AND conname IN (
                 'uq_course_students_email','chk_course_students_name_not_blank','chk_course_students_email_not_blank',
                 'uq_course_instructors_email','chk_course_instructors_name_not_blank','chk_course_instructors_email_not_blank','chk_course_instructors_specialty_not_blank',
                 'fk_course_courses_instructor','chk_course_courses_title_not_blank','chk_course_courses_level','chk_course_courses_price',
                 'fk_course_enrollments_student','fk_course_enrollments_course','chk_course_enrollments_status','chk_course_enrollments_recorded_amount'
               )) || ':' ||
            (SELECT COUNT(*) FROM information_schema.columns
             WHERE table_schema='course_project' AND table_name IN ('students','instructors','courses','enrollments') AND is_nullable='NO');
          SQL
          )
          echo "$STRUCTURE"
          test "$STRUCTURE" = "15:20"

      - name: Verify CREATE privilege guard before DDL
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book <<'SQL'
          CREATE ROLE ch12_no_create LOGIN PASSWORD 'chapter12-test';
          GRANT CONNECT ON DATABASE ai_database_book TO ch12_no_create;
          REVOKE CREATE ON DATABASE ai_database_book FROM ch12_no_create;
          GRANT USAGE ON SCHEMA course_project TO ch12_no_create;
          GRANT SELECT ON ALL TABLES IN SCHEMA course_project TO ch12_no_create;
          SQL
          set +e
          PGUSER=ch12_no_create PGPASSWORD=chapter12-test psql -h localhost -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter12/01_nosql_lab_schema.sql > /tmp/ch12_no_create.log 2>&1
          rc=$?
          set -e
          cat /tmp/ch12_no_create.log
          test "$rc" -ne 0
          grep -q 'CREATE 권한' /tmp/ch12_no_create.log
          test "$(psql -d ai_database_book -Atc "SELECT to_regnamespace('nosql_lab') IS NULL")" = "t"

      - name: Capture source fingerprint
        shell: bash
        run: |
          psql -d ai_database_book -Atc "SELECT md5((SELECT jsonb_agg(to_jsonb(s) ORDER BY id)::text FROM course_project.students s)||(SELECT jsonb_agg(to_jsonb(i) ORDER BY id)::text FROM course_project.instructors i)||(SELECT jsonb_agg(to_jsonb(c) ORDER BY id)::text FROM course_project.courses c)||(SELECT jsonb_agg(to_jsonb(e) ORDER BY id)::text FROM course_project.enrollments e));" > /tmp/ch12_before
          cat /tmp/ch12_before

      - name: Run Chapter 12 01 through 07
        shell: bash
        run: |
          for f in 01_nosql_lab_schema.sql 02_nosql_lab_seed.sql 03_document_jsonb_queries.sql 04_key_value_cache_queries.sql 05_storage_choice_review.sql 06_jsonb_index_candidates.sql 07_nosql_lab_validation.sql; do
            psql -v ON_ERROR_STOP=1 -d ai_database_book -f "code/chapter12/$f" 2>&1 | tee "/tmp/$f.log"
          done
          grep -q 'Chapter 12 nosql lab schema validation passed' /tmp/01_nosql_lab_schema.sql.log
          grep -q 'Chapter 12 nosql lab seed validation passed' /tmp/02_nosql_lab_seed.sql.log
          grep -q 'Chapter 12 document JSONB practice passed' /tmp/03_document_jsonb_queries.sql.log
          grep -q 'Chapter 12 JSONB index candidate validation passed' /tmp/06_jsonb_index_candidates.sql.log
          grep -q 'Chapter 12 nosql_lab validation passed' /tmp/07_nosql_lab_validation.sql.log

      - name: Verify exact lab state and stale-version boundary
        shell: bash
        run: |
          test "$(psql -d ai_database_book -Atc "SELECT (SELECT count(*) FROM nosql_lab.course_documents)||':'||(SELECT count(*) FROM nosql_lab.key_value_cache_examples)||':'||(SELECT count(*) FROM nosql_lab.storage_choice_cases)")" = '3:4:6'
          test "$(psql -d ai_database_book -Atc "SELECT count(*) FROM pg_constraint WHERE connamespace='nosql_lab'::regnamespace")" = '25'
          test "$(psql -d ai_database_book -Atc "SELECT count(*) FROM information_schema.columns WHERE table_schema='nosql_lab' AND is_nullable='NO'")" = '26'
          test "$(psql -d ai_database_book -Atc "WITH x AS (UPDATE nosql_lab.course_documents SET document_version=document_version+1 WHERE course_code='COURSE-301' AND document_version=999 RETURNING 1) SELECT count(*) FROM x")" = '0'
          test "$(psql -d ai_database_book -Atc "SELECT (metadata #>> '{options,certificate}')||':'||document_version FROM nosql_lab.course_documents WHERE course_code='COURSE-301'")" = 'true:1'
          test "$(psql -d ai_database_book -Atc "SELECT count(*) FROM pg_index i JOIN pg_class c ON c.oid=i.indexrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='nosql_lab' AND c.relname IN ('idx_nosql_course_documents_metadata_gin','idx_nosql_course_documents_online') AND i.indisvalid AND i.indisready")" = '2'

      - name: Verify document drift detection
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -d ai_database_book -c "UPDATE nosql_lab.course_documents SET title='DRIFT' WHERE source_course_id=301;"
          set +e
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter12/07_nosql_lab_validation.sql > /tmp/ch12_drift 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          psql -v ON_ERROR_STOP=1 -d ai_database_book -c "UPDATE nosql_lab.course_documents SET title='데이터베이스 입문' WHERE source_course_id=301;"
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter12/07_nosql_lab_validation.sql 2>&1 | tee /tmp/ch12_restored
          grep -q 'Chapter 12 nosql_lab validation passed' /tmp/ch12_restored

      - name: Verify fingerprint and reset isolation
        shell: bash
        run: |
          psql -d ai_database_book -Atc "SELECT md5((SELECT jsonb_agg(to_jsonb(s) ORDER BY id)::text FROM course_project.students s)||(SELECT jsonb_agg(to_jsonb(i) ORDER BY id)::text FROM course_project.instructors i)||(SELECT jsonb_agg(to_jsonb(c) ORDER BY id)::text FROM course_project.courses c)||(SELECT jsonb_agg(to_jsonb(e) ORDER BY id)::text FROM course_project.enrollments e));" > /tmp/ch12_after
          diff -u /tmp/ch12_before /tmp/ch12_after
          psql -v ON_ERROR_STOP=1 -d ai_database_book -c 'CREATE TABLE nosql_lab.keep_me(id integer);'
          set +e
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter12/reset_nosql_lab.sql > /tmp/ch12_reset_blocked 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          test "$(psql -d ai_database_book -Atc "SELECT to_regclass('nosql_lab.course_documents') IS NOT NULL")" = 't'
          test "$(psql -d ai_database_book -Atc "SELECT to_regclass('nosql_lab.keep_me') IS NOT NULL")" = 't'
          psql -v ON_ERROR_STOP=1 -d ai_database_book -c 'DROP TABLE nosql_lab.keep_me;'
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter12/reset_nosql_lab.sql 2>&1 | tee /tmp/ch12_reset
          grep -q 'Chapter 12 nosql lab reset passed' /tmp/ch12_reset
          test "$(psql -d ai_database_book -Atc "SELECT to_regnamespace('nosql_lab') IS NULL")" = 't'
          psql -d ai_database_book -Atc "SELECT md5((SELECT jsonb_agg(to_jsonb(s) ORDER BY id)::text FROM course_project.students s)||(SELECT jsonb_agg(to_jsonb(i) ORDER BY id)::text FROM course_project.instructors i)||(SELECT jsonb_agg(to_jsonb(c) ORDER BY id)::text FROM course_project.courses c)||(SELECT jsonb_agg(to_jsonb(e) ORDER BY id)::text FROM course_project.enrollments e));" > /tmp/ch12_reset_after
          diff -u /tmp/ch12_before /tmp/ch12_reset_after
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter08/00_check_course_project.sql
          psql -v ON_ERROR_STOP=1 -d ai_database_book -f code/chapter08/03_join_aggregation_validation.sql
          echo 'Chapter 12 final PostgreSQL 16 publication validation passed'
