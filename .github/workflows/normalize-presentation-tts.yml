name: Normalize presentation TTS terms

on:
  push:
    branches: [main]
    paths:
      - scripts/normalize_presentation_tts_terms.py
      - presentation/common/tts_pronunciation.js
      - presentation/course_overview_script.html
      - presentation/chapter*/chapter*_script.html
      - presentation/chapter*/chapter*_lecture_plan.md
      - presentation/chapter*/**/*.js
      - .github/workflows/normalize-presentation-tts.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: normalize-presentation-tts-main
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check presentation JavaScript syntax
        run: |
          node --check presentation/chapter01/chapter01_navigation.js
          node --check presentation/chapter05/chapter05_navigation.js
          node --check presentation/chapter05/chapter05_player.js
          node --check presentation/chapter05/chapter05_script.js
          node --check presentation/chapter06/chapter06_navigation.js
          node --check presentation/chapter06/chapter06_player.js
          node --check presentation/chapter06/chapter06_script.js
          node --check presentation/chapter07/chapter07_slides.js
          node --check presentation/chapter07/chapter07_navigation.js
          node --check presentation/chapter07/chapter07_player.js
          node --check presentation/chapter07/chapter07_script.js
          node --check presentation/chapter09/chapter09_slides.js
          node --check presentation/chapter09/chapter09_navigation.js
          node --check presentation/chapter09/chapter09_player.js
          node --check presentation/chapter09/chapter09_script.js
          node --check presentation/chapter10/chapter10_slides.js
          node --check presentation/chapter10/chapter10_navigation.js
          node --check presentation/chapter10/chapter10_player.js
          node --check presentation/chapter10/chapter10_script.js
          node --check presentation/common/tts_pronunciation.js

      - name: Check Chapter 01 navigation coverage
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          slides_text = Path('presentation/chapter01/chapter01_final_lecture_patch.js').read_text(encoding='utf-8')
          nav_text = Path('presentation/chapter01/chapter01_navigation.js').read_text(encoding='utf-8')

          slide_keys = re.findall(r"\bk:\s*'([^']+)'", slides_text)
          marker = 'const FOCUS_SEQUENCES = {'
          if marker not in nav_text:
              raise SystemExit('FOCUS_SEQUENCES not found')
          plan_text = nav_text.split(marker, 1)[1].split('\n  };', 1)[0]
          plan_keys = re.findall(r"^\s{4}'([^']+)':", plan_text, flags=re.M)

          if len(slide_keys) != 49:
              raise SystemExit(f'Expected 49 Chapter 01 slides, found {len(slide_keys)}')
          if len(set(slide_keys)) != len(slide_keys):
              raise SystemExit('Duplicate Chapter 01 slide keys found')
          if len(set(plan_keys)) != len(plan_keys):
              raise SystemExit('Duplicate Chapter 01 navigation plan keys found')

          missing = sorted(set(slide_keys) - set(plan_keys))
          extra = sorted(set(plan_keys) - set(slide_keys))
          if missing or extra:
              raise SystemExit(f'Chapter 01 navigation mismatch: missing={missing}, extra={extra}')

          print(f'Chapter 01 navigation coverage OK: {len(slide_keys)} / {len(slide_keys)} slides')
          PY

      - name: Check Chapter 05 navigation coverage
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          root = Path('presentation/chapter05')
          nav_text = (root / 'chapter05_navigation.js').read_text(encoding='utf-8')
          marker = 'const PLANS = {'
          if marker not in nav_text:
              raise SystemExit('Chapter 05 PLANS not found')
          plans = nav_text.split(marker, 1)[1].split('\n  };', 1)[0]
          if 'theory: {' not in plans or 'practice: {' not in plans:
              raise SystemExit('Chapter 05 theory/practice plan blocks not found')
          theory_plan = plans.split('theory: {', 1)[1].split('\n    },\n    practice: {', 1)[0]
          practice_plan = plans.split('\n    practice: {', 1)[1]

          cases = [
              ('theory', 'chapter05_theory_slides_raw.js', theory_plan, 26),
              ('practice', 'chapter05_practice_slides_raw.js', practice_plan, 29),
          ]
          for block, filename, plan_text, expected in cases:
              slides_text = (root / filename).read_text(encoding='utf-8')
              slide_keys = re.findall(r"\bk:\s*'([^']+)'", slides_text)
              plan_keys = re.findall(r"^\s{6}'([^']+)':", plan_text, flags=re.M)
              if len(slide_keys) != expected:
                  raise SystemExit(f'Expected {expected} Chapter 05 {block} slides, found {len(slide_keys)}')
              if len(set(slide_keys)) != len(slide_keys):
                  raise SystemExit(f'Duplicate Chapter 05 {block} slide keys found')
              if len(set(plan_keys)) != len(plan_keys):
                  raise SystemExit(f'Duplicate Chapter 05 {block} navigation plan keys found')
              missing = sorted(set(slide_keys) - set(plan_keys))
              extra = sorted(set(plan_keys) - set(slide_keys))
              if missing or extra:
                  raise SystemExit(f'Chapter 05 {block} navigation mismatch: missing={missing}, extra={extra}')
              print(f'Chapter 05 {block} navigation coverage OK: {len(slide_keys)} / {expected} slides')
          PY

      - name: Check Chapter 06 navigation coverage
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const root = 'presentation/chapter06';

          function load(files) {
            const context = { window: {}, console };
            context.window.window = context.window;
            vm.createContext(context);
            for (const file of files) {
              vm.runInContext(fs.readFileSync(`${root}/${file}`, 'utf8'), context, { filename: file });
            }
            vm.runInContext(fs.readFileSync(`${root}/chapter06_navigation.js`, 'utf8'), context, { filename: 'chapter06_navigation.js' });
            return { slides: context.window.CH6_SLIDES || [], navigation: context.window.CH6Navigation };
          }

          const cases = [
            ['theory', ['chapter06_theory_slides.js', 'chapter06_theory_patch.js'], 43],
            ['practice', ['chapter06_practice_slides.js', 'chapter06_practice_patch.js'], 16],
          ];

          for (const [block, files, expected] of cases) {
            const { slides, navigation } = load(files);
            if (slides.length !== expected) throw new Error(`Expected ${expected} Chapter 06 ${block} slides, found ${slides.length}`);
            if (!navigation) throw new Error('Chapter 06 navigation module did not load');
            const missing = slides.map((slide, index) => ({ index, slide, key: navigation.planKey(slide, block) }))
              .filter((entry) => !entry.key)
              .map((entry) => `${entry.index + 1}:${entry.slide.t || entry.slide.l || entry.slide.k || '?'}`);
            if (missing.length) throw new Error(`Chapter 06 ${block} missing navigation plans: ${missing.join(', ')}`);
            const emptyNarration = slides.filter((slide) => !String(slide.s || '').trim()).length;
            const emptyBody = slides.filter((slide) => !String(slide.h || '').trim()).length;
            if (emptyNarration || emptyBody) throw new Error(`Chapter 06 ${block} empty content: narration=${emptyNarration}, body=${emptyBody}`);
            console.log(`Chapter 06 ${block} navigation coverage OK: ${slides.length} / ${expected} slides`);
          }
          NODE

      - name: Check Chapter 07 navigation coverage
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          root = Path('presentation/chapter07')
          nav_text = (root / 'chapter07_navigation.js').read_text(encoding='utf-8')
          marker = 'const PLANS = {'
          if marker not in nav_text:
              raise SystemExit('Chapter 07 PLANS not found')
          plans = nav_text.split(marker, 1)[1].split('\n  };', 1)[0]
          if 'theory: {' not in plans or 'practice: {' not in plans:
              raise SystemExit('Chapter 07 theory/practice plan blocks not found')
          theory_plan = plans.split('theory: {', 1)[1].split('\n    },\n    practice: {', 1)[0]
          practice_plan = plans.split('\n    practice: {', 1)[1]

          cases = [
              ('theory', 'chapter07_theory_lecture_plan.md', theory_plan, 18),
              ('practice', 'chapter07_practice_lecture_plan.md', practice_plan, 20),
          ]
          for block, filename, plan_text, expected in cases:
              text = (root / filename).read_text(encoding='utf-8')
              slide_titles = re.findall(r'^##\s+\d+\.\s+(.+)$', text, flags=re.M)
              plan_titles = re.findall(r"^\s{6}'([^']+)':", plan_text, flags=re.M)
              if len(slide_titles) != expected:
                  raise SystemExit(f'Expected {expected} Chapter 07 {block} slides, found {len(slide_titles)}')
              if len(set(slide_titles)) != len(slide_titles):
                  raise SystemExit(f'Duplicate Chapter 07 {block} slide titles found')
              if len(set(plan_titles)) != len(plan_titles):
                  raise SystemExit(f'Duplicate Chapter 07 {block} navigation plan titles found')
              missing = sorted(set(slide_titles) - set(plan_titles))
              extra = sorted(set(plan_titles) - set(slide_titles))
              if missing or extra:
                  raise SystemExit(f'Chapter 07 {block} navigation mismatch: missing={missing}, extra={extra}')
              sections = re.split(r'(?=^##\s+\d+\.\s+)', text, flags=re.M)[1:]
              if len(sections) != expected:
                  raise SystemExit(f'Chapter 07 {block} section parse mismatch')
              for index, section in enumerate(sections, start=1):
                  if '**화면 구성**' not in section or '**발표 스크립트**' not in section:
                      raise SystemExit(f'Chapter 07 {block} slide {index} is missing screen or script content')
              print(f'Chapter 07 {block} navigation coverage OK: {len(slide_titles)} / {expected} slides')

          slides_js = (root / 'chapter07_slides.js').read_text(encoding='utf-8')
          required_fixes = [
              "paid_amount/g, 'recorded_amount'",
              "total_stored_paid_amount/g, 'total_recorded_amount'",
              "non_cancelled_paid_amount/g, 'non_cancelled_recorded_amount'",
          ]
          missing_fixes = [value for value in required_fixes if value not in slides_js]
          if missing_fixes:
              raise SystemExit(f'Chapter 07 recorded_amount compatibility fixes missing: {missing_fixes}')
          print('Chapter 07 recorded_amount compatibility fixes OK')
          PY

      - name: Check Chapter 09 navigation coverage
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          root = Path('presentation/chapter09')
          nav_text = (root / 'chapter09_navigation.js').read_text(encoding='utf-8')
          marker = 'const PLANS = {'
          if marker not in nav_text:
              raise SystemExit('Chapter 09 PLANS not found')
          plans = nav_text.split(marker, 1)[1].split('\n  };', 1)[0]
          if 'theory: {' not in plans or 'practice: {' not in plans:
              raise SystemExit('Chapter 09 theory/practice plan blocks not found')
          theory_plan = plans.split('theory: {', 1)[1].split('\n    },\n    practice: {', 1)[0]
          practice_plan = plans.split('\n    practice: {', 1)[1]

          cases = [
              ('theory', 'chapter09_theory_lecture_plan.md', theory_plan, 20),
              ('practice', 'chapter09_practice_lecture_plan.md', practice_plan, 20),
          ]
          for block, filename, plan_text, expected in cases:
              text = (root / filename).read_text(encoding='utf-8')
              slide_titles = re.findall(r'^##\s+\d+\.\s+(.+)$', text, flags=re.M)
              plan_titles = re.findall(r"^\s{6}'([^']+)':", plan_text, flags=re.M)
              if len(slide_titles) != expected:
                  raise SystemExit(f'Expected {expected} Chapter 09 {block} slides, found {len(slide_titles)}')
              if len(set(slide_titles)) != len(slide_titles):
                  raise SystemExit(f'Duplicate Chapter 09 {block} slide titles found')
              if len(set(plan_titles)) != len(plan_titles):
                  raise SystemExit(f'Duplicate Chapter 09 {block} navigation plan titles found')
              missing = sorted(set(slide_titles) - set(plan_titles))
              extra = sorted(set(plan_titles) - set(slide_titles))
              if missing or extra:
                  raise SystemExit(f'Chapter 09 {block} navigation mismatch: missing={missing}, extra={extra}')
              sections = re.split(r'(?=^##\s+\d+\.\s+)', text, flags=re.M)[1:]
              if len(sections) != expected:
                  raise SystemExit(f'Chapter 09 {block} section parse mismatch')
              for index, section in enumerate(sections, start=1):
                  if '**화면 구성**' not in section or '**발표 스크립트**' not in section:
                      raise SystemExit(f'Chapter 09 {block} slide {index} is missing screen or script content')
              print(f'Chapter 09 {block} navigation coverage OK: {len(slide_titles)} / {expected} slides')

          slides_js = (root / 'chapter09_slides.js').read_text(encoding='utf-8')
          if "replace(/paid_amount/g, 'recorded_amount')" not in slides_js:
              raise SystemExit('Chapter 09 recorded_amount compatibility fix missing')
          print('Chapter 09 recorded_amount compatibility fix OK')
          PY

      - name: Check Chapter 10 navigation coverage
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          root = Path('presentation/chapter10')
          nav_text = (root / 'chapter10_navigation.js').read_text(encoding='utf-8')
          marker = 'const PLANS = {'
          if marker not in nav_text:
              raise SystemExit('Chapter 10 PLANS not found')
          plans = nav_text.split(marker, 1)[1].split('\n  };', 1)[0]
          if 'theory: {' not in plans or 'practice: {' not in plans:
              raise SystemExit('Chapter 10 theory/practice plan blocks not found')
          theory_plan = plans.split('theory: {', 1)[1].split('\n    },\n    practice: {', 1)[0]
          practice_plan = plans.split('\n    practice: {', 1)[1]

          cases = [
              ('theory', 'chapter10_theory_lecture_plan.md', theory_plan, 20),
              ('practice', 'chapter10_practice_lecture_plan.md', practice_plan, 20),
          ]
          for block, filename, plan_text, expected in cases:
              text = (root / filename).read_text(encoding='utf-8')
              slide_titles = re.findall(r'^##\s+\d+\.\s+(.+)$', text, flags=re.M)
              plan_titles = re.findall(r"^\s{6}'([^']+)':", plan_text, flags=re.M)
              if len(slide_titles) != expected:
                  raise SystemExit(f'Expected {expected} Chapter 10 {block} slides, found {len(slide_titles)}')
              if len(set(slide_titles)) != len(slide_titles):
                  raise SystemExit(f'Duplicate Chapter 10 {block} slide titles found')
              if len(set(plan_titles)) != len(plan_titles):
                  raise SystemExit(f'Duplicate Chapter 10 {block} navigation plan titles found')
              missing = sorted(set(slide_titles) - set(plan_titles))
              extra = sorted(set(plan_titles) - set(slide_titles))
              if missing or extra:
                  raise SystemExit(f'Chapter 10 {block} navigation mismatch: missing={missing}, extra={extra}')
              sections = re.split(r'(?=^##\s+\d+\.\s+)', text, flags=re.M)[1:]
              if len(sections) != expected:
                  raise SystemExit(f'Chapter 10 {block} section parse mismatch')
              for index, section in enumerate(sections, start=1):
                  if '**화면 구성**' not in section or '**발표 스크립트**' not in section:
                      raise SystemExit(f'Chapter 10 {block} slide {index} is missing screen or script content')
              print(f'Chapter 10 {block} navigation coverage OK: {len(slide_titles)} / {expected} slides')

          tts_text = Path('presentation/common/tts_pronunciation.js').read_text(encoding='utf-8')
          required_terms = [
              'performance_lab', 'CREATE INDEX CONCURRENTLY', 'Index Cond', 'Execution Time',
              'actual rows', 'Buffers', 'Skip Scan', 'pg_stat_user_indexes', 'pg_indexes', 'idx_scan'
          ]
          missing_terms = [term for term in required_terms if term not in tts_text]
          if missing_terms:
              raise SystemExit(f'Chapter 10 shared TTS terms missing: {missing_terms}')
          print('Chapter 10 shared TTS terms OK')
          PY

      - name: Normalize narration sources and script pages
        run: python scripts/normalize_presentation_tts_terms.py --apply

      - name: Commit normalized presentation scripts
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No presentation TTS changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presentation scripts/normalize_presentation_tts_terms.py
          git commit -m "Normalize Korean pronunciations in presentation scripts"
          git push origin main
