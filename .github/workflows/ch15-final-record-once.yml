name: Align Chapter 15 final validation records once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ch15-final-record-once.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align final validation record wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          review = Path('book/chapter15/chapter15_review_revision.md')
          text = review.read_text(encoding='utf-8')
          old = '검토 기록과 체크리스트를 갱신한 최종 문서 상태에서 같은 전체 검증을 다시 실행해 definitive run으로 확정합니다.'
          new = '이후 검토 기록·체크리스트가 포함된 내용 기준 상태는 Run 9에서 다시 전체 통과했고, `chapter15_validation_result.md`까지 추가된 저장소 상태는 Run 10에서 다시 전체 통과했습니다.'
          if old not in text:
              raise SystemExit('review final-run marker not found')
          review.write_text(text.replace(old, new), encoding='utf-8')

          checklist = Path('notes/chapter15_review_checklist.md')
          text = checklist.read_text(encoding='utf-8')
          old = '''Workflow: Validate Chapter 15
Run: 7
Run ID: 31303633119
Commit: 06112f85de97fca14e4ebffcdba79c97db56d8d9
PostgreSQL: 16
Conclusion: success
```

검토 기록·체크리스트 반영 후 최종 문서 상태에서 definitive run을 다시 수행합니다.'''
          new = '''Workflow: Validate Chapter 15
내용 기준 definitive Run: 9
Run ID: 31303733804
Commit: d69c9d3c96aa0b9e4ee15993d1436103a66dae1c
PostgreSQL: 16
Conclusion: success
```

`chapter15_validation_result.md` 추가까지 포함한 저장소 상태는 Run 10 (`31303805542`, commit `c46bdf5194a8cc2d022dfb73320d4e662f8e044f`)에서 다시 전체 통과했습니다.'''
          if old not in text:
              raise SystemExit('checklist run marker not found')
          checklist.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit record alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add book/chapter15/chapter15_review_revision.md notes/chapter15_review_checklist.md
          git commit -m 'Align Chapter 15 final validation records'
          git push
