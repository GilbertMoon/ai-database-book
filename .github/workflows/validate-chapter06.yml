name: Validate Chapter 06

on:
  push:
    branches: [main]
    paths:
      - book/chapter06/**
      - code/chapter06/**
      - images/chapter06/**
      - presentation/chapter06/**
      - presentation/common/tts_pronunciation.js
      - presentation/common/script_content_enhancer.js
      - .github/workflows/validate-chapter06.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Chapter 06 JavaScript syntax
        run: |
          node --check presentation/chapter06/chapter06_navigation.js
          node --check presentation/chapter06/chapter06_player.js
          node --check presentation/chapter06/chapter06_script.js
          node --check presentation/chapter06/chapter06_theory_slides.js
          node --check presentation/chapter06/chapter06_theory_patch.js
          node --check presentation/chapter06/chapter06_practice_slides.js
          node --check presentation/chapter06/chapter06_practice_patch.js

      - name: Check Chapter 06 content alignment
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          root = Path('.')
          chapter = (root / 'book/chapter06/chapter06.md').read_text(encoding='utf-8')
          headings = re.findall(r'^##\s+(\d+)\.\s+', chapter, flags=re.M)
          if headings != [str(i) for i in range(1, 19)]:
              raise SystemExit(f'Chapter 06 section sequence mismatch: {headings}')

          required_book = [
              'C-01', 'C-02', 'C-03', 'C-04', 'C-05', 'C-06', 'C-07', 'C-08',
              '01_normalization_schema.sql', '02_normalization_seed.sql',
              '03_normalization_compare.sql', '04_add_integrity_rules.sql',
              '05_integrity_tests.sql', '대여 대상으로 관리하는 도서 한 건',
              'uq_loans_nf_active_book'
          ]
          missing = [term for term in required_book if term not in chapter]
          if missing:
              raise SystemExit(f'Chapter 06 book terms missing: {missing}')
          print('Chapter 06 book structure OK: 18 sections')

          practice = (root / 'presentation/chapter06/chapter06_practice_lecture_plan.md').read_text(encoding='utf-8')
          practice_sections = re.split(r'(?=^##\s+\d+\.\s+)', practice, flags=re.M)[1:]
          if len(practice_sections) != 16:
              raise SystemExit(f'Expected 16 Chapter 06 practice sections, found {len(practice_sections)}')
          for index, section in enumerate(practice_sections, start=1):
              if '**화면 구성**' not in section or '**발표 스크립트**' not in section:
                  raise SystemExit(f'Chapter 06 practice section {index} missing screen/script content')
          practice_terms = [
              '01_normalization_schema.sql', '02_normalization_seed.sql',
              '03_normalization_compare.sql', '04_add_integrity_rules.sql',
              '05_integrity_tests.sql', 'raw 3 / members 2 / books 2 / loans 3',
              '회원 101 대여 = 2', '도서 201 대여 = 2',
              '제약조건 8개 + NOT NULL 열 10개',
              'Chapter 06 integrity test baseline preserved'
          ]
          missing = [term for term in practice_terms if term not in practice]
          if missing:
              raise SystemExit(f'Chapter 06 practice alignment missing: {missing}')
          print('Chapter 06 practice lecture plan OK: 16 sections')

          patch = (root / 'presentation/chapter06/chapter06_practice_patch.js').read_text(encoding='utf-8')
          patch_titles = re.findall(r"\n\s*t:\s*'([^']+)'", patch)
          if len(patch_titles) != 16:
              raise SystemExit(f'Expected 16 Chapter 06 practice runtime slides, found {len(patch_titles)}')
          for term in [
              '01_normalization_schema.sql', '04_add_integrity_rules.sql',
              '05_integrity_tests.sql', '대여 대상으로 관리하는 도서 한 건',
              '회원 101 = 2건', '도서 201 = 2건',
              'Chapter 06 integrity test baseline preserved'
          ]:
              if term not in patch:
                  raise SystemExit(f'Chapter 06 practice runtime term missing: {term}')

          nav = (root / 'presentation/chapter06/chapter06_navigation.js').read_text(encoding='utf-8')
          for title in patch_titles:
              if title not in nav:
                  raise SystemExit(f'Chapter 06 navigation missing practice title: {title}')
          print('Chapter 06 practice runtime/navigation alignment OK')

          script_html = (root / 'presentation/chapter06/chapter06_script.html').read_text(encoding='utf-8')
          script_js = (root / 'presentation/chapter06/chapter06_script.js').read_text(encoding='utf-8')
          if '../common/tts_pronunciation.js' not in script_html:
              raise SystemExit('Chapter 06 TTS normalizer is not loaded')
          if '../common/script_content_enhancer.js' not in script_html:
              raise SystemExit('Chapter 06 script content enhancer is not loaded')
          if 'window.PresentationTTS?.normalize' not in script_js:
              raise SystemExit('Chapter 06 script does not use shared TTS normalization')
          for name in ['chapter06_theory_patch.js', 'chapter06_practice_patch.js']:
              if name not in script_js:
                  raise SystemExit(f'Chapter 06 script runtime missing {name}')
          print('Chapter 06 script/TTS wiring OK')

          code_root = root / 'code/chapter06'
          required_sql = [
              '01_normalization_schema.sql', '02_normalization_seed.sql',
              '03_normalization_compare.sql', '04_add_integrity_rules.sql',
              '05_integrity_tests.sql', 'normalization_schema.sql',
              'normalization_seed.sql', 'normalization_practice.sql',
              'integrity_tests.sql', 'reset_normalization.sql', 'README.md'
          ]
          missing = [name for name in required_sql if not (code_root / name).exists()]
          if missing:
              raise SystemExit(f'Chapter 06 SQL files missing: {missing}')

          for name in ['01_normalization_schema.sql', 'normalization_schema.sql']:
              text = (code_root / name).read_text(encoding='utf-8')
              for term in ['BEGIN;', 'COMMIT;', 'v_raw_count <> 0', 'CREATE TABLE public.loans_nf']:
                  if term not in text:
                      raise SystemExit(f'{name} safety term missing: {term}')

          for name in ['02_normalization_seed.sql', 'normalization_seed.sql']:
              text = (code_root / name).read_text(encoding='utf-8')
              for term in [
                  'BEGIN;', 'COMMIT;', 'v_raw_count <> 3', 'v_member_count <> 2',
                  'v_book_count <> 2', 'v_loan_count <> 3', 'v_open_count <> 2',
                  'v_member_101_count <> 2', 'v_book_201_count <> 2',
                  'RESTART WITH 1004', 'RESTART WITH 103', 'RESTART WITH 203'
              ]:
                  if term not in text:
                      raise SystemExit(f'{name} seed term missing: {term}')

          for name in ['03_normalization_compare.sql', 'normalization_practice.sql']:
              text = (code_root / name).read_text(encoding='utf-8')
              for term in [
                  'v_member_101_count <> 2', 'v_book_201_count <> 2',
                  'v_invalid_date_count <> 0', 'v_book_201_invalid_order <> 0',
                  'v_active_duplicate_count <> 0',
                  'Chapter 06 normalization comparison passed'
              ]:
                  if term not in text:
                      raise SystemExit(f'{name} compare term missing: {term}')

          rules = (code_root / '04_add_integrity_rules.sql').read_text(encoding='utf-8')
          for term in [
              "conrelid = 'public.members_nf'::regclass",
              "conrelid = 'public.books_nf'::regclass",
              "conrelid = 'public.loans_nf'::regclass",
              'v_constraint_count <> 8', 'v_not_null_count <> 10',
              'uq_loans_nf_active_book'
          ]:
              if term not in rules:
                  raise SystemExit(f'04 integrity rule term missing: {term}')

          tests = (code_root / '05_integrity_tests.sql').read_text(encoding='utf-8')
          for term in [
              'fk_loans_nf_member', 'fk_loans_nf_book',
              'chk_loans_nf_due_date', 'chk_loans_nf_returned_date',
              'uq_loans_nf_active_book', 'v_member_101_count <> 2',
              'Chapter 06 integrity test baseline preserved',
              'ISBN-BND-LOAN-001'
          ]:
              if term not in tests:
                  raise SystemExit(f'05 integrity test term missing: {term}')
          print('Chapter 06 SQL static safety checks OK')

          image_root = root / 'images/chapter06'
          stems = [
              'ch06_01_normalization_problem_overview',
              'ch06_02_anomaly_types',
              'ch06_03_first_normal_form',
              'ch06_04_second_normal_form',
              'ch06_05_third_normal_form',
              'ch06_06_library_normalization_flow',
              'ch06_07_before_after_join_tradeoff',
              'ch06_08_ai_normalization_review_flow'
          ]
          missing = []
          for stem in stems:
              for suffix in ['.mmd', '.svg']:
                  if not (image_root / f'{stem}{suffix}').exists():
                      missing.append(f'{stem}{suffix}')
          if missing:
              raise SystemExit(f'Chapter 06 diagram assets missing: {missing}')
          print('Chapter 06 Mermaid/SVG set OK: 8 pairs')
          PY

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create Chapter 06 test database
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE ai_database_book;"

      - name: Run numbered Chapter 06 path
        run: |
          psql -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter06/reset_normalization.sql
          psql -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter06/01_normalization_schema.sql
          psql -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter06/02_normalization_seed.sql
          psql -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter06/03_normalization_compare.sql
          psql -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter06/04_add_integrity_rules.sql
          psql -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter06/05_integrity_tests.sql

      - name: Verify boundary and expected failure tests
        shell: bash
        run: |
          set -euo pipefail
          psql -d ai_database_book -v ON_ERROR_STOP=1 -c "INSERT INTO public.books_nf (id,title,author,published_year,isbn) VALUES (1800,'경계값 테스트 도서','테스트 저자',2026,'ISBN-BND-LOAN-001');"
          psql -d ai_database_book -v ON_ERROR_STOP=1 -c "INSERT INTO public.loans_nf (id,member_id,book_id,borrowed_at,due_at,returned_at) VALUES (1801,101,1800,DATE '2026-05-01',DATE '2026-05-01',DATE '2026-05-01');"
          psql -d ai_database_book -v ON_ERROR_STOP=1 -c "DELETE FROM public.loans_nf WHERE id=1801; DELETE FROM public.books_nf WHERE id=1800;"
          psql -d ai_database_book -v ON_ERROR_STOP=1 -c "INSERT INTO public.books_nf (id,title,author,published_year,isbn) VALUES (1802,'연도 미상 도서','익명',NULL,'ISBN-BOUNDARY-001'); DELETE FROM public.books_nf WHERE id=1802;"
          psql -d ai_database_book -v ON_ERROR_STOP=1 -c "INSERT INTO public.members_nf (id,name,email,joined_at) VALUES (1803,'김','one-char@example.com',DATE '2026-03-20'); DELETE FROM public.members_nf WHERE id=1803;"

          expect_fail() {
            local label="$1"
            local expected="$2"
            local sql="$3"
            set +e
            output=$(psql -d ai_database_book -v ON_ERROR_STOP=1 -c "$sql" 2>&1)
            status=$?
            set -e
            echo "$output"
            if [ "$status" -eq 0 ]; then
              echo "Expected failure did not occur: $label" >&2
              exit 1
            fi
            echo "$output" | grep -F "$expected" >/dev/null || {
              echo "Expected marker not found for $label: $expected" >&2
              exit 1
            }
          }

          expect_fail "NOT NULL" "not-null constraint" "INSERT INTO public.members_nf (id,name,email,joined_at) VALUES (1901,NULL,'null-name@example.com',DATE '2026-03-20');"
          expect_fail "duplicate email" "uq_members_nf_email" "INSERT INTO public.members_nf (id,name,email,joined_at) VALUES (1902,'중복 이메일','junho@example.com',DATE '2026-03-20');"
          expect_fail "duplicate isbn" "uq_books_nf_isbn" "INSERT INTO public.books_nf (id,title,author,published_year,isbn) VALUES (1903,'중복 ISBN','테스트',2026,'ISBN-001');"
          expect_fail "blank member" "chk_members_nf_name_not_blank" "INSERT INTO public.members_nf (id,name,email,joined_at) VALUES (1904,'   ','blank-name@example.com',DATE '2026-03-20');"
          expect_fail "blank book" "chk_books_nf_title_not_blank" "INSERT INTO public.books_nf (id,title,author,published_year,isbn) VALUES (1905,'   ','테스트',2026,'ISBN-BLANK-001');"
          expect_fail "missing member" "fk_loans_nf_member" "INSERT INTO public.loans_nf (id,member_id,book_id,borrowed_at,due_at,returned_at) VALUES (1906,999,201,DATE '2026-04-10',DATE '2026-04-24',DATE '2026-04-12');"
          expect_fail "missing book" "fk_loans_nf_book" "INSERT INTO public.loans_nf (id,member_id,book_id,borrowed_at,due_at,returned_at) VALUES (1910,101,999,DATE '2026-04-10',DATE '2026-04-24',DATE '2026-04-12');"
          expect_fail "bad due date" "chk_loans_nf_due_date" "INSERT INTO public.loans_nf (id,member_id,book_id,borrowed_at,due_at,returned_at) VALUES (1907,101,202,DATE '2026-04-20',DATE '2026-04-10',DATE '2026-04-21');"
          expect_fail "bad returned date" "chk_loans_nf_returned_date" "INSERT INTO public.loans_nf (id,member_id,book_id,borrowed_at,due_at,returned_at) VALUES (1908,101,202,DATE '2026-04-20',DATE '2026-05-04',DATE '2026-04-10');"
          expect_fail "active duplicate" "uq_loans_nf_active_book" "INSERT INTO public.loans_nf (id,member_id,book_id,borrowed_at,due_at,returned_at) VALUES (1909,101,201,DATE '2026-04-10',DATE '2026-04-24',NULL);"
          expect_fail "restrict parent delete" "fk_loans_nf_member" "DELETE FROM public.members_nf WHERE id=101;"
          psql -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter06/05_integrity_tests.sql

      - name: Verify seed transaction rollback
        shell: bash
        run: |
          set -euo pipefail
          psql -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter06/reset_normalization.sql
          psql -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter06/01_normalization_schema.sql
          psql -d ai_database_book -v ON_ERROR_STOP=1 -c "ALTER TABLE public.loans_nf ADD CONSTRAINT chk_seed_force_fail CHECK (false);"
          set +e
          psql -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter06/02_normalization_seed.sql
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "02 seed should have failed for rollback test" >&2
            exit 1
          fi
          counts=$(psql -d ai_database_book -Atc "SELECT (SELECT COUNT(*) FROM public.library_records_raw)||','||(SELECT COUNT(*) FROM public.members_nf)||','||(SELECT COUNT(*) FROM public.books_nf)||','||(SELECT COUNT(*) FROM public.loans_nf);")
          test "$counts" = "0,0,0,0" || { echo "Partial seed state remained: $counts" >&2; exit 1; }
          psql -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter06/reset_normalization.sql

      - name: Verify integrity-rule rejection is atomic
        shell: bash
        run: |
          set -euo pipefail
          psql -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter06/01_normalization_schema.sql
          psql -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter06/02_normalization_seed.sql
          psql -d ai_database_book -v ON_ERROR_STOP=1 -c "INSERT INTO public.members_nf (id,name,email,joined_at) VALUES (1999,'중복 사전검사','minji@example.com',DATE '2026-03-21');"
          set +e
          psql -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter06/04_add_integrity_rules.sql
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "04 rules should have rejected duplicate pre-existing data" >&2
            exit 1
          fi
          constraints=$(psql -d ai_database_book -Atc "SELECT COUNT(*) FROM pg_constraint WHERE conrelid IN ('public.members_nf'::regclass,'public.books_nf'::regclass,'public.loans_nf'::regclass) AND conname IN ('uq_members_nf_email','chk_members_nf_name_not_blank','uq_books_nf_isbn','chk_books_nf_title_not_blank','fk_loans_nf_member','fk_loans_nf_book','chk_loans_nf_due_date','chk_loans_nf_returned_date');")
          test "$constraints" = "0" || { echo "Partial constraints remained: $constraints" >&2; exit 1; }
          active_index=$(psql -d ai_database_book -Atc "SELECT to_regclass('public.uq_loans_nf_active_book') IS NULL;")
          test "$active_index" = "t" || { echo "Partial active index remained" >&2; exit 1; }
          psql -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter06/reset_normalization.sql

      - name: Run compatibility Chapter 06 path
        run: |
          psql -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter06/normalization_schema.sql
          psql -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter06/normalization_seed.sql
          psql -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter06/normalization_practice.sql
          psql -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter06/04_add_integrity_rules.sql
          psql -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter06/integrity_tests.sql
