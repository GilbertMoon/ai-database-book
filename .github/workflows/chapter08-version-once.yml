name: Version Chapter 08 Once

on:
  push:
    paths:
      - '.github/workflows/chapter08-version-once.yml'

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align presentation asset versions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          version = '20260809a'
          for name in [
              'chapter08_script.html',
              'chapter08_theory_presentation.html',
              'chapter08_practice_presentation.html',
          ]:
              path = Path('presentation/chapter08') / name
              text = path.read_text(encoding='utf-8')
              text = text.replace('20260808e', version)
              path.write_text(text, encoding='utf-8')

          path = Path('presentation/chapter08/chapter08_script.js')
          text = path.read_text(encoding='utf-8')
          if "const ASSET_VERSION = '20260809a';" not in text:
              text = text.replace(
                  "  const CHANNEL = 'chapter08-presentation-sync';\n",
                  "  const CHANNEL = 'chapter08-presentation-sync';\n  const ASSET_VERSION = '20260809a';\n"
              )
          text = text.replace(
              "`${presentationFile()}#${block}/${slideIndex + 1}/${stepIndex}`",
              "`${presentationFile()}?v=${ASSET_VERSION}#${block}/${slideIndex + 1}/${stepIndex}`"
          )
          text = text.replace(
              "`${target === 'practice' ? 'chapter08_practice_presentation.html' : 'chapter08_theory_presentation.html'}#${target}/1/0`",
              "`${target === 'practice' ? 'chapter08_practice_presentation.html' : 'chapter08_theory_presentation.html'}?v=${ASSET_VERSION}#${target}/1/0`"
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chapter08-version-once.yml
          git add presentation/chapter08
          git commit -m "Align Chapter 08 presentation cache versions"
          git push
