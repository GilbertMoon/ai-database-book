name: Record Chapter 13 final validation once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ch13-record-final-validation-once.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record final Chapter 13 validation
        run: python scripts/ch13_record_final_validation_once.py
      - name: Remove one-off record script
        run: rm -f scripts/ch13_record_final_validation_once.py
      - name: Commit validation record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notes/chapter13_validation_result.md notes/chapter13_review_checklist.md
          git add -u scripts/ch13_record_final_validation_once.py
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Record Chapter 13 final publication validation'
          git push
