name: Validate Chapter 02 presentation

on:
  push:
    branches: [main]
    paths:
      - presentation/chapter02/**
      - presentation/common/presentation_runtime.js
      - presentation/common/presentation.css
      - .github/workflows/validate-chapter02-presentation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Chapter 02 source and syntax
        run: |
          node presentation/chapter02/validate_chapter02.mjs
          node --check presentation/common/presentation_runtime.js
          python - <<'PY'
          from pathlib import Path

          chapter = Path('presentation/chapter02')
          html = (chapter / 'chapter02_presentation.html').read_text(encoding='utf-8')
          css = (chapter / 'chapter02.css').read_text(encoding='utf-8')
          runtime = Path('presentation/common/presentation_runtime.js').read_text(encoding='utf-8')

          if 'cursor-halo' in html or 'id="cursor"' in html:
              raise SystemExit('Chapter 02 presentation still contains legacy cursor elements')
          if 'pointermove' in runtime or 'native-cursor' in runtime:
              raise SystemExit('Presentation runtime still contains custom cursor tracking')
          if 'script-button-icon' not in runtime or '발표 스크립트 열기' not in runtime:
              raise SystemExit('Chapter 02 document script icon is missing')
          required_css = [
              'cursor: auto !important',
              'right: 20px !important',
              'top: 18px !important',
              'width: 34px !important',
              'height: 34px !important',
              '.script-button-icon',
          ]
          missing = [item for item in required_css if item not in css]
          if missing:
              raise SystemExit(f'Chapter 02 script icon layout is incomplete: {missing}')
          if 'v=20260808b' not in html:
              raise SystemExit('Chapter 02 presentation cache version was not bumped')

          print('Chapter 02 cursor removal OK')
          print('Chapter 02 34x34 top-right document script icon OK')
          print('Chapter 02 cache version OK')
          PY
