name: Fix publication Korean images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/publication_svg_utils.py'
      - 'scripts/migrate_publication_svg_pipeline.py'
      - '.github/workflows/fix-publication-korean-images.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Korean fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-nanum
          fc-cache -fv
          fc-match 'Noto Sans CJK KR'

      - name: Install publication dependencies
        run: python -m pip install --upgrade markdown cairosvg pillow

      - name: Migrate all chapter generators to Korean-safe renderer
        run: python scripts/migrate_publication_svg_pipeline.py

      - name: Rebuild overview publication images
        run: python scripts/generate_overview_jpg.py

      - name: Rebuild Chapter 01-15 publication HTML and JPG images
        shell: bash
        run: |
          set -euo pipefail
          for chapter in $(seq -w 1 15); do
            echo "=== Rebuilding Chapter ${chapter} ==="
            python "scripts/generate_chapter${chapter}_publication.py"
          done

      - name: Refresh publication index
        run: python scripts/generate_book_index.py

      - name: Validate publication source
        run: |
          python scripts/validate_publication_styles.py
          python scripts/validate_book_index.py
          python scripts/validate_full_book_source.py

      - name: Upload Korean rendering QA samples
        uses: actions/upload-artifact@v4
        with:
          name: korean-image-rendering-samples
          path: |
            images/overview/*.jpg
            images/chapter02/*.jpg
          retention-days: 14

      - name: Commit migrated generators and regenerated publication files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/generate_chapter??_publication.py
          git add book/index.html book/overview/overview.html book/chapter*/chapter*.html
          git add images/overview/*.jpg images/chapter*/*.jpg
          if git diff --cached --quiet; then
            echo 'No publication image changes to commit.'
            exit 0
          fi
          git commit -m 'Fix Korean publication image rendering'
          git push
