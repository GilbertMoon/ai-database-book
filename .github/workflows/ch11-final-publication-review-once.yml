name: Record Chapter 11 final validation once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ch11-final-publication-review-once.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record Chapter 11 final validation
        run: python scripts/ch11_record_final_validation_once.py
      - name: Regenerate full manuscript
        run: |
          python scripts/merge_chapters.py
          python -m py_compile scripts/merge_chapters.py
      - name: Remove one-off record script
        run: rm -f scripts/ch11_record_final_validation_once.py
      - name: Commit validation record and manuscript
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Record Chapter 11 final validation'
          git push
