name: Apply Chapter 11 final publication review once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ch11-final-publication-review-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Chapter 11 publication review
        run: python scripts/ch11_final_publication_review_once.py
      - name: Remove one-off patch script
        run: rm -f scripts/ch11_final_publication_review_once.py
      - name: Commit reviewed Chapter 11
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Refine Chapter 11 final publication content'
          git push
