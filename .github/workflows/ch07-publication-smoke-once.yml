name: Chapter 07 publication SQL smoke once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ch07-publication-smoke-once.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create test database
        run: psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE ai_database_book;"

      - name: Verify database CREATE privilege protection
        shell: bash
        run: |
          set -euo pipefail
          psql -d ai_database_book -v ON_ERROR_STOP=1 -c "CREATE ROLE ch07_no_create;"
          set +e
          output=$(psql -d ai_database_book -v ON_ERROR_STOP=1 \
            -c "SET ROLE ch07_no_create;" \
            -f code/chapter07/01_course_project_schema.sql 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo '01 should fail without database CREATE privilege' >&2
            exit 1
          fi
          echo "$output" | grep -F 'CREATE 권한이 없습니다' >/dev/null
          absent=$(psql -d ai_database_book -Atc "SELECT to_regnamespace('course_project') IS NULL;")
          test "$absent" = "t"
          psql -d ai_database_book -v ON_ERROR_STOP=1 -c "DROP ROLE ch07_no_create;"

      - name: Run canonical Chapter 07 path
        run: |
          psql -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter07/reset_course_project.sql
          psql -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter07/01_course_project_schema.sql
          psql -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter07/02_course_project_seed.sql
          psql -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter07/03_course_project_changes.sql
          psql -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter07/04_course_project_validation.sql
          psql -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter07/05_course_project_integrity_tests.sql
          psql -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter07/06_course_project_optional_tests.sql

      - name: Verify enrollment snapshot and structure
        shell: bash
        run: |
          set -euo pipefail
          snapshot=$(psql -d ai_database_book -Atc "SELECT e.recorded_amount::text || '/' || c.price::text FROM course_project.enrollments e JOIN course_project.courses c ON c.id=e.course_id WHERE e.id=1005;")
          test "$snapshot" = "120000/120000"
          named=$(psql -d ai_database_book -Atc "SELECT COUNT(*) FROM pg_constraint WHERE conrelid IN ('course_project.students'::regclass,'course_project.instructors'::regclass,'course_project.courses'::regclass,'course_project.enrollments'::regclass) AND conname IN ('uq_course_students_email','chk_course_students_name_not_blank','chk_course_students_email_not_blank','uq_course_instructors_email','chk_course_instructors_name_not_blank','chk_course_instructors_email_not_blank','chk_course_instructors_specialty_not_blank','fk_course_courses_instructor','chk_course_courses_title_not_blank','chk_course_courses_level','chk_course_courses_price','fk_course_enrollments_student','fk_course_enrollments_course','chk_course_enrollments_status','chk_course_enrollments_recorded_amount');")
          notnull=$(psql -d ai_database_book -Atc "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='course_project' AND table_name IN ('students','instructors','courses','enrollments') AND is_nullable='NO';")
          active_index=$(psql -d ai_database_book -Atc "SELECT to_regclass('course_project.uq_course_enrollments_active') IS NOT NULL;")
          test "$named" = "15"
          test "$notnull" = "20"
          test "$active_index" = "t"
          grep -F "c.price" code/chapter07/03_course_project_changes.sql >/dev/null

      - name: Verify representative NOT NULL failure
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output=$(psql -d ai_database_book -v ON_ERROR_STOP=1 -c "INSERT INTO course_project.students (id,name,email,joined_at) VALUES (1900,NULL,'null-name@example.com',DATE '2026-03-20');" 2>&1)
          status=$?
          set -e
          echo "$output"
          test "$status" -ne 0
          echo "$output" | grep -F 'not-null constraint' >/dev/null

      - name: Verify Chapter 08 handoff
        run: psql -d ai_database_book -v ON_ERROR_STOP=1 -f code/chapter08/00_check_course_project.sql

      - name: Verify authored narration is not auto-expanded
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'data-script-content-enhancer="off"' presentation/chapter07/chapter07_script.html >/dev/null
          grep -F "dataset?.scriptContentEnhancer === 'off'" presentation/common/script_content_enhancer.js >/dev/null
          ! grep -F '.replace(/paid_amount' presentation/chapter07/chapter07_slides.js >/dev/null
