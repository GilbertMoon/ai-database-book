name: Generate Chapter 11 publication

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'book/chapter11/chapter11.md'
      - 'images/chapter11/*.svg'
      - 'scripts/generate_chapter11_publication.py'
      - 'scripts/generate_book_index.py'
      - '.github/workflows/generate-chapter11-publication.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Korean fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install publication dependencies
        run: python -m pip install --upgrade markdown cairosvg pillow

      - name: Generate Chapter 11 publication HTML and images
        run: python scripts/generate_chapter11_publication.py

      - name: Refresh publication index
        run: python scripts/generate_book_index.py

      - name: Validate publication HTML
        run: |
          python scripts/validate_publication_styles.py
          python scripts/validate_book_index.py

      - name: Commit generated publication files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add book/chapter11/chapter11.html book/index.html images/chapter11/*.jpg
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Generate Chapter 11 publication HTML'
          git push
