name: Validate book publication index once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-book-index-once.yml'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate book index
        run: python scripts/generate_book_index.py
      - name: Validate book index
        run: python scripts/validate_book_index.py
      - name: Validate publication styles
        run: python scripts/validate_publication_styles.py
      - name: Ensure generated index is committed
        run: git diff --exit-code -- book/index.html
