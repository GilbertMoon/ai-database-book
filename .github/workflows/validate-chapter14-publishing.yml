name: Validate Chapter 14 publishing evidence

on:
  push:
    branches: [main]
    paths:
      - book/chapter14/**
      - code/chapter14/README.md
      - presentation/chapter14/**
      - images/chapter14/**
      - notes/chapter14_review_checklist.md
      - .github/workflows/validate-chapter14-publishing.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check published Chapter 14 evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('book/chapter14/chapter14.md'),
              Path('book/chapter14/chapter14_activity.md'),
              Path('book/chapter14/chapter14_outline.md'),
              Path('code/chapter14/README.md'),
              Path('presentation/chapter14/chapter14_theory_lecture_plan.md'),
              Path('presentation/chapter14/chapter14_practice_lecture_plan.md'),
              Path('presentation/chapter14/chapter14_navigation.js'),
              Path('notes/chapter14_review_checklist.md'),
          ]
          texts = {str(p): p.read_text(encoding='utf-8') for p in paths}

          stale = [
              'paid_amount',
              '2026-01 | 3 | 200000',
              '2026-03 | 5 | 540000',
              '2026-05 | 4 | 390000',
              '파이썬 데이터 분석 | 5 | 450000',
              '데이터 시각화 | 5 | 560000',
              '서울 | 3 | 9 | 910000',
              '대구 | 1 | 3 | 260000',
              '취소인데 기록 금액이 0 아님',
              '취소 건의 기준 기록 금액은 0이다',
              '제약조건 21개',
          ]
          for name, text in texts.items():
              hits = [token for token in stale if token in text]
              if hits:
                  raise SystemExit(f'{name} contains stale Chapter 14 evidence: {hits}')

          required = {
              'book/chapter14/chapter14.md': [
                  'recorded_amount', 'NUMERIC(12,0)', '3,210,000',
                  '350000', '680000', '540000',
                  '0으로 덮어쓰지 않습니다', '합성 기준 데이터',
              ],
              'book/chapter14/chapter14_activity.md': [
                  'recorded_amount', '350000', '680000', '540000',
                  '750000', '700000', '1210000', '400000',
                  '취소 건의 신청 시점 기록 금액은 취소 후에도 유지된다',
              ],
              'code/chapter14/README.md': [
                  'recorded_amount NUMERIC(12,0)', '3,210,000',
                  '2026-01 | 3 | 350000', '2026-03 | 5 | 680000',
                  '2026-05 | 4 | 540000',
              ],
              'book/chapter14/chapter14_outline.md': [
                  'recorded_amount NUMERIC(12,0)', '3,210,000',
              ],
              'presentation/chapter14/chapter14_practice_lecture_plan.md': [
                  'recorded_amount', '350000', '680000', '540000',
              ],
              'notes/chapter14_review_checklist.md': [
                  'recorded_amount', '3210000', 'PK·FK·CHECK·UNIQUE | 20개',
              ],
          }
          for name, needles in required.items():
              text = texts[name]
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'{name} missing current Chapter 14 evidence: {needle}')

          print('Chapter 14 publishing evidence passed: amount=3210000, monthly=350/520/680/550/540/570k')
          PY