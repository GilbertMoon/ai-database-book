name: Validate Chapter 11 navigation

on:
  push:
    branches: [main]
    paths:
      - presentation/chapter11/**
      - presentation/common/tts_pronunciation.js
      - .github/workflows/validate-chapter11-navigation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Chapter 11 JavaScript syntax
        run: |
          node --check presentation/chapter11/chapter11_slides.js
          node --check presentation/chapter11/chapter11_navigation.js
          node --check presentation/chapter11/chapter11_player.js
          node --check presentation/chapter11/chapter11_script.js
          node --check presentation/common/tts_pronunciation.js

      - name: Check Chapter 11 navigation coverage
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          root = Path('presentation/chapter11')
          nav_text = (root / 'chapter11_navigation.js').read_text(encoding='utf-8')
          marker = 'const PLANS = {'
          if marker not in nav_text:
              raise SystemExit('Chapter 11 PLANS not found')
          plans = nav_text.split(marker, 1)[1].split('\n  };', 1)[0]
          if 'theory: {' not in plans or 'practice: {' not in plans:
              raise SystemExit('Chapter 11 theory/practice plan blocks not found')
          theory_plan = plans.split('theory: {', 1)[1].split('\n    },\n    practice: {', 1)[0]
          practice_plan = plans.split('\n    practice: {', 1)[1]

          cases = [
              ('theory', 'chapter11_theory_lecture_plan.md', theory_plan, 20),
              ('practice', 'chapter11_practice_lecture_plan.md', practice_plan, 20),
          ]
          for block, filename, plan_text, expected in cases:
              text = (root / filename).read_text(encoding='utf-8')
              slide_titles = re.findall(r'^##\s+\d+\.\s+(.+)$', text, flags=re.M)
              plan_titles = re.findall(r"^\s{6}'([^']+)':", plan_text, flags=re.M)
              if len(slide_titles) != expected:
                  raise SystemExit(f'Expected {expected} Chapter 11 {block} slides, found {len(slide_titles)}')
              if len(set(slide_titles)) != len(slide_titles):
                  raise SystemExit(f'Duplicate Chapter 11 {block} slide titles found')
              if len(set(plan_titles)) != len(plan_titles):
                  raise SystemExit(f'Duplicate Chapter 11 {block} navigation plan titles found')
              missing = sorted(set(slide_titles) - set(plan_titles))
              extra = sorted(set(plan_titles) - set(slide_titles))
              if missing or extra:
                  raise SystemExit(f'Chapter 11 {block} navigation mismatch: missing={missing}, extra={extra}')
              sections = re.split(r'(?=^##\s+\d+\.\s+)', text, flags=re.M)[1:]
              if len(sections) != expected:
                  raise SystemExit(f'Chapter 11 {block} section parse mismatch')
              for index, section in enumerate(sections, start=1):
                  if '**화면 구성**' not in section or '**발표 스크립트**' not in section:
                      raise SystemExit(f'Chapter 11 {block} slide {index} is missing screen or script content')
              print(f'Chapter 11 {block} navigation coverage OK: {len(slide_titles)} / {expected} slides')

          script_text = (root / 'chapter11_script.js').read_text(encoding='utf-8')
          if 'const ttsRules' in script_text or 'const ttsText = (value) => ttsRules.reduce' in script_text:
              raise SystemExit('Chapter 11 still contains a duplicated local TTS rule table')
          if 'window.PresentationTTS?.normalize' not in script_text:
              raise SystemExit('Chapter 11 script is not using shared PresentationTTS')

          tts_text = Path('presentation/common/tts_pronunciation.js').read_text(encoding='utf-8')
          required_terms = [
              'ALTER DEFAULT PRIVILEGES', 'security_lab', 'ai_database_book_restore',
              'NOLOGIN', 'REVOKE', 'CONNECT', 'USAGE', 'TRUNCATE', 'psql',
              'RPO', 'RTO', 'Runbook', 'SQL Injection'
          ]
          missing_terms = [term for term in required_terms if term not in tts_text]
          if missing_terms:
              raise SystemExit(f'Chapter 11 shared TTS terms missing: {missing_terms}')
          print('Chapter 11 shared TTS terms OK')

          for filename in ['chapter11_theory_presentation.html', 'chapter11_practice_presentation.html']:
              html = (root / filename).read_text(encoding='utf-8')
              nav_pos = html.find('chapter11_navigation.js')
              player_pos = html.find('chapter11_player.js')
              if nav_pos < 0 or player_pos < 0 or nav_pos > player_pos:
                  raise SystemExit(f'{filename} must load navigation before player')
          script_html = (root / 'chapter11_script.html').read_text(encoding='utf-8')
          order = [
              script_html.find('chapter11_slides.js'),
              script_html.find('chapter11_navigation.js'),
              script_html.find('../common/tts_pronunciation.js'),
              script_html.find('chapter11_script.js'),
          ]
          if any(value < 0 for value in order) or order != sorted(order):
              raise SystemExit('Chapter 11 script asset order is invalid')
          print('Chapter 11 asset order OK')
          PY
