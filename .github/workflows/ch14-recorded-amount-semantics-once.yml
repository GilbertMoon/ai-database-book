name: Align Chapter 14 recorded amount semantics

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ch14-recorded-amount-semantics-once.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve recorded amount across cancellation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def read(path):
              return Path(path).read_text(encoding='utf-8')
          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          files = []
          files += list(Path('book/chapter14').glob('*.md'))
          files += list(Path('code/chapter14').glob('*.sql'))
          files += list(Path('code/chapter14').glob('*.md'))
          files += list(Path('code/chapter14/python').glob('*.py'))
          files += list(Path('code/chapter14/python').glob('*.json'))
          files += list(Path('images/chapter14').glob('*.md'))
          files += list(Path('images/chapter14').glob('*.mmd'))
          files += list(Path('images/chapter14').glob('*.svg'))
          files += [p for p in Path('presentation/chapter14').glob('*') if p.is_file()]
          files += [Path('notes/chapter14_review_checklist.md')]

          # Canonical total and published wording.
          replacements = [
              ('2770000', '3210000'),
              ('2,770,000', '3,210,000'),
              ('기록 금액 합계 2,770,000', '기록 금액 합계 3,210,000'),
              ('취소: 기준 데이터에서 기록 금액 0', '취소: 신청 시점 기록 금액을 그대로 유지'),
              ('취소인데 기록 금액이 0이 아닌 행', '취소 후 기록 금액이 0으로 덮어써진 행'),
              ('취소 금액 0', '취소 후에도 신청 시점 기록 금액 유지'),
              ('제약조건 21개', '제약조건 20개'),
              ('제약조건 21', '제약조건 20'),
              ('21개 PK·FK·UNIQUE·CHECK', '20개 PK·FK·UNIQUE·CHECK'),
              ('constraint_count <> 21', 'constraint_count <> 20'),
              ('constraint_count = 21', 'constraint_count = 20'),
              ('| PK·FK·CHECK·UNIQUE | 21개 |', '| PK·FK·CHECK·UNIQUE | 20개 |'),
          ]
          for path in files:
              text = read(path)
              for old, new in replacements:
                  text = text.replace(old, new)
              write(path, text)

          # Remove the old cancellation-zero constraint: recorded_amount is historical enrollment-time amount.
          p = Path('code/chapter14/01_analysis_lab_schema.sql')
          text = read(p)
          old = "\n".join([
              '    CONSTRAINT chk_analysis_enrollments_cancel_amount',
              '        CHECK (',
              "            (status = '취소' AND recorded_amount = 0)",
              '            OR',
              "            (status <> '취소' AND recorded_amount >= 0)",
              '        ),',''
          ])
          if old not in text:
              raise SystemExit('old cancel-zero constraint block not found')
          write(p, text.replace(old, '', 1))

          # Cancelled rows retain the amount recorded at enrollment time.
          p = Path('code/chapter14/02_analysis_lab_seed.sql')
          text = read(p)
          changes = {
              "(1003, 101, 303, '2026-01-25', '취소',        0, NULL)": "(1003, 101, 303, '2026-01-25', '취소',   150000, NULL)",
              "(1011, 105, 304, '2026-03-22', '취소',        0, NULL)": "(1011, 105, 304, '2026-03-22', '취소',   140000, NULL)",
              "(1019, 108, 303, '2026-05-17', '취소',        0, NULL)": "(1019, 108, 303, '2026-05-17', '취소',   150000, NULL)",
          }
          for old, new in changes.items():
              if old not in text:
                  raise SystemExit(f'seed cancel row not found: {old}')
              text = text.replace(old, new, 1)
          write(p, text)

          # Data-quality checks: zeroing a cancelled historical amount is the suspicious case in this lab.
          for filename in ['code/chapter14/03_data_quality_checks.sql','code/chapter14/07_analysis_validation.sql','code/chapter14/08_analysis_lab_validation.sql']:
              text = read(filename)
              text = text.replace("status = '취소'\n  AND recorded_amount <> 0", "status = '취소'\n  AND recorded_amount = 0")
              text = text.replace("status = '취소' AND recorded_amount <> 0", "status = '취소' AND recorded_amount = 0")
              text = text.replace("'invalid_cancel_amount'", "'cancel_amount_zeroed'")
              write(filename, text)

          # Expected monthly aggregates.
          monthly_pairs = {
              '2026-01 3 / 200000': '2026-01 3 / 350000',
              '2026-03 5 / 540000': '2026-03 5 / 680000',
              '2026-05 4 / 390000': '2026-05 4 / 540000',
              "(DATE '2026-01-01', 3, 200000)": "(DATE '2026-01-01', 3, 350000)",
              "(DATE '2026-03-01', 5, 540000)": "(DATE '2026-03-01', 5, 680000)",
              "(DATE '2026-05-01', 4, 390000)": "(DATE '2026-05-01', 4, 540000)",
          }
          for path in files:
              text = read(path)
              for old, new in monthly_pairs.items():
                  text = text.replace(old, new)
              write(path, text)

          # Course and region expected aggregates in explanatory SQL/docs.
          aggregate_pairs = {
              '303 파이썬 데이터 분석 5 / 450000': '303 파이썬 데이터 분석 5 / 750000',
              '304 데이터 시각화 5 / 560000': '304 데이터 시각화 5 / 700000',
              '서울 학생 3 / 신청 9 / 910000': '서울 학생 3 / 신청 9 / 1210000',
              '대구 학생 1 / 신청 3 / 260000': '대구 학생 1 / 신청 3 / 400000',
              'Python 5 / 450000': 'Python 5 / 750000',
              'Data Analysis 5 / 560000': 'Data Analysis 5 / 700000',
          }
          for path in files:
              text = read(path)
              for old, new in aggregate_pairs.items():
                  text = text.replace(old, new)
              write(path, text)

          # Reference metrics are the CSV-path version-controlled SQL evidence.
          p = Path('code/chapter14/python/reference_metrics.json')
          metrics = json.loads(read(p))
          metrics['recorded_amount_sum'] = 3210000
          monthly_amounts = {
              '2026-01-01': 350000,
              '2026-02-01': 520000,
              '2026-03-01': 680000,
              '2026-04-01': 550000,
              '2026-05-01': 540000,
              '2026-06-01': 570000,
          }
          for row in metrics['monthly']:
              row['recorded_amount_sum'] = monthly_amounts[row['enrollment_month']]
          write(p, json.dumps(metrics, ensure_ascii=False, indent=2) + '\n')

          # Example manifest row count/source remain unchanged; add semantics only if absent.
          p = Path('code/chapter14/python/analysis_manifest.example.json')
          manifest = json.loads(read(p))
          manifest['amount_semantics'] = 'recorded_amount = enrollment-time recorded amount; cancellation does not zero it'
          write(p, json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')

          # Core explanatory paragraphs.
          docs = ['book/chapter14/chapter14.md','book/chapter14/chapter14_outline.md','book/chapter14/chapter14_activity.md','code/chapter14/README.md']
          for filename in docs:
              text = read(filename)
              anchor = 'recorded_amount'
              if anchor not in text:
                  raise SystemExit(f'{filename} missing recorded_amount')
              if '취소 후에도 신청 시점 기록 금액' not in text:
                  if filename.endswith('chapter14.md'):
                      marker = '`[2026-01-01, 2026-07-01)`은 시작일은 포함하고 종료일은 제외하는 반개방 구간입니다.'
                      note = '\n\n> **금액 보존 원칙**\n> `recorded_amount`는 신청 시점의 기록이므로 이후 상태가 `취소`로 바뀌어도 0으로 덮어쓰지 않습니다. 환불·순매출은 별도 결제·환불 원장이 있을 때 계산해야 합니다.'
                      if marker in text:
                          text = text.replace(marker, marker + note, 1)
                  elif filename.endswith('chapter14_outline.md'):
                      marker = '분석 VIEW 금액 컬럼 = recorded_amount'
                      text = text.replace(marker, marker + '\n취소 후에도 신청 시점 기록 금액 유지', 1)
                  elif filename.endswith('README.md'):
                      marker = '`recorded_amount NUMERIC(12,0)`는 앞 장과 동일하게 신청 시점 기록 금액입니다.'
                      text = text.replace(marker, marker + ' 취소 후에도 이 역사값을 0으로 덮어쓰지 않습니다.', 1)
                  else:
                      text += '\n\n> `recorded_amount`는 취소 후에도 신청 시점 기록 금액을 유지합니다.\n'
              write(filename, text)

          # Sanity checks.
          schema = read('code/chapter14/01_analysis_lab_schema.sql')
          seed = read('code/chapter14/02_analysis_lab_seed.sql')
          final = read('code/chapter14/08_analysis_lab_validation.sql')
          assert 'chk_analysis_enrollments_cancel_amount' not in schema
          assert 'constraint_count <> 20' in final
          assert '3210000' in seed and '3210000' in final
          assert "(1003, 101, 303, '2026-01-25', '취소',   150000, NULL)" in seed
          assert "(1011, 105, 304, '2026-03-22', '취소',   140000, NULL)" in seed
          assert "(1019, 108, 303, '2026-05-17', '취소',   150000, NULL)" in seed
          assert metrics['recorded_amount_sum'] == 3210000
          assert sum(row['recorded_amount_sum'] for row in metrics['monthly']) == 3210000
          PY

      - name: Commit Chapter 14 amount semantics
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add book/chapter14 code/chapter14 images/chapter14 presentation/chapter14 notes/chapter14_review_checklist.md
          git diff --cached --check
          git commit -m "Preserve Chapter 14 recorded amount semantics"
          git push
