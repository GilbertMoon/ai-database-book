<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapter 05 발표자료 선택</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1720;color:#182230;font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif}.panel{width:min(1040px,92vw);padding:48px;border-radius:30px;background:#fff;box-shadow:0 18px 45px rgba(20,33,50,.22)}h1{font-size:54px;margin:0 0 14px;letter-spacing:-.04em}.lead{font-size:24px;color:#5d6b7a;line-height:1.55;margin-bottom:34px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:22px}.card{display:block;padding:30px;border:1px solid #d9e1ea;border-radius:24px;text-decoration:none;color:#182230;background:#f6f8fb}.card:hover{background:#e8f0ff;border-color:#155eef}.card strong{display:block;font-size:31px;margin-bottom:10px}.card span{font-size:20px;color:#5d6b7a;line-height:1.45}.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.pill{padding:8px 13px;border-radius:999px;background:#e8f0ff;color:#155eef;font-weight:800;font-size:16px}@media(max-width:760px){.cards{grid-template-columns:1fr}}</style></head><body><main class="panel"><h1>Chapter 05 발표자료</h1><p class="lead">5장은 요구사항에서 데이터 모델과 ERD를 만드는 장입니다. 이론 강의에서는 모델링 관점과 판단 기준을 설명하고, 실습 강의에서는 도서 대여 시스템을 직접 모델링하고 SQL 구조로 확인합니다.</p><div class="cards"><a class="card" href="chapter05_theory_presentation.html"><strong>이론 강의 시작</strong><span>요구사항 분석, 엔터티·속성, 관계 문장, 카디널리티, 선택성, 요구사항 추적표 설명</span><div class="meta"><span class="pill">약 35~45분</span><span class="pill">개념 중심</span></div></a><a class="card" href="chapter05_practice_presentation.html"><strong>실습 강의 시작</strong><span>도서 대여 요구사항 분해, ERD 초안, members·books·loans 생성, 샘플 데이터 검증</span><div class="meta"><span class="pill">약 70~90분</span><span class="pill">DBeaver 화면 병행</span></div></a></div></main></body></html>
