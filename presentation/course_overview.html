<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 시대의 데이터베이스 입문 — 책 전체 안내</title><style>:root{--bg:#f6f8fb;--text:#182230;--muted:#667085;--p:#155eef;--ps:#e8f0ff;--a:#f59e0b;--as:#fff5d9;--bd:#d9e1ea}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;background:#0f1720;color:var(--text)}button{font:inherit}#deck{position:fixed;inset:0;display:grid;place-items:center}#view{position:relative;width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16));overflow:hidden;background:var(--bg)}.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:54px 76px 64px;background:linear-gradient(#fff,#f6f8fb)}.slide.active{display:flex}.slide:before{content:"";position:absolute;inset:0 0 auto;height:10px;background:linear-gradient(90deg,var(--p),#4f8cff 72%,var(--a))}header,footer{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:16px;font-weight:750}header{font-size:19px;margin-bottom:18px}header b{color:var(--p)}header span{display:flex;align-items:center;gap:12px}.script{width:34px;height:34px;border:1px solid var(--bd);border-radius:10px;background:#fff;cursor:pointer}main{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:1420px;width:100%;margin:auto}h1,h2,h3,p{margin-top:0}h1{font-size:64px;line-height:1.16;letter-spacing:-.045em;margin-bottom:18px}h2{font-size:44px;letter-spacing:-.04em;margin-bottom:22px}h3{font-size:25px;margin-bottom:9px}p,li{line-height:1.5}.lead{font-size:27px;color:var(--muted)}.lead b,.quote b{color:var(--p)}.title-grid{display:grid;grid-template-columns:1.16fr .84fr;gap:24px}.title-main{display:flex;flex-direction:column;justify-content:center}.question{padding:24px;border:1px solid #f0d18a;border-radius:22px;background:var(--as);display:flex;flex-direction:column;justify-content:center}.question small{color:#925f00;font-weight:900}.question strong{margin:10px 0 8px;font-size:30px}.question p{margin:0;color:#6f521a;font-size:18px}.quote{margin-top:20px;padding:19px 24px;border-left:8px solid var(--p);background:var(--ps);font-size:27px;font-weight:800}.pills,.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.pills span,.chips span{padding:8px 12px;border-radius:999px;background:#eef3f8;font-size:16px;font-weight:800}.band,.outcome{margin-top:18px;padding:15px 18px;border:1px solid #c9d8ff;border-radius:16px;background:linear-gradient(90deg,var(--ps),#fff);font-size:19px;font-weight:800;text-align:center}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}.card,.stage,.project,.final{padding:22px;border:1px solid var(--bd);border-radius:20px;background:#fff}.card i{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--p);color:#fff;font-style:normal;font-weight:900}.card p,.stage p,.project p,.final p{color:var(--muted);font-size:17px}.flow{display:flex;align-items:stretch;gap:7px;margin-top:19px;color:var(--p);font-weight:900}.flow span{flex:1;padding:14px 8px;border:1px solid var(--bd);border-radius:15px;background:#fff;text-align:center;color:var(--text)}.flow em{display:block;margin-top:6px;color:var(--muted);font-size:12px;font-style:normal;font-weight:500}.stage{min-height:350px}label{display:inline-block;padding:6px 11px;border-radius:999px;background:var(--ps);color:var(--p);font-size:14px;font-weight:900}ul{padding-left:20px}li{margin:7px 0;font-size:16px}.projects{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.project{min-height:300px}.final{min-height:315px}.next{margin-top:18px;padding:15px 20px;border-radius:16px;background:#182230;color:#fff;display:flex;justify-content:space-between;align-items:center;font-size:18px}.focus{transition:.28s}.muted{opacity:.24;transform:scale(.985)}.active-focus{transform:scale(1.018);border-color:var(--p)!important;box-shadow:0 0 0 5px rgba(21,94,239,.12),0 16px 30px rgba(21,94,239,.16)!important;position:relative;z-index:4}#status{position:absolute;left:24px;bottom:20px;padding:8px 12px;border:1px solid var(--bd);border-radius:999px;background:#fff;color:var(--muted);font-size:14px;font-weight:850}nav{position:absolute;right:22px;bottom:18px;display:flex;gap:8px}nav button{width:44px;height:44px;border:0;border-radius:12px;background:#182230;color:#fff;font-size:21px;cursor:pointer}nav button:disabled{opacity:.35}@media print{body{background:#fff;overflow:visible}#deck{position:static;display:block}#view{width:auto;height:auto;overflow:visible}.slide{position:relative;display:flex;width:1600px;height:900px;page-break-after:always}nav,.script,#status{display:none!important}.muted{opacity:1;transform:none}}</style></head><body><div id="deck"><div id="view"></div></div><script>const DATA=[{"section":"BOOK OVERVIEW","title":"AI 시대의 데이터베이스 입문","steps":4,"body":"<div class=\"title-grid\"><div class=\"title-main\"><h1>AI 시대의 데이터베이스 입문</h1><p class=\"lead\">ChatGPT와 Codex를 활용해 <b>PostgreSQL·SQL·데이터 설계·운영·분석</b>을 하나의 프로젝트 흐름으로 배웁니다.</p><div class=\"quote focus\" data-step=\"3\">AI가 초안을 만들고, 사람은 <b>데이터의 의미와 실행 결과</b>를 검증합니다.</div></div><aside class=\"question focus\" data-step=\"1\"><small>AI 시대의 핵심 질문</small><strong>“AI가 SQL을 만들어 주는데도 데이터베이스를 배워야 할까요?”</strong><p>실행 성공만으로는 요구사항, 숫자의 의미와 운영 안전성을 판단할 수 없습니다.</p></aside></div><div class=\"pills focus\" data-step=\"2\"><span>PostgreSQL · DBeaver</span><span>SQL · ERD</span><span>정규화 · 무결성</span><span>트랜잭션 · 인덱스</span><span>보안 · 복구</span><span>AI 검증 · Python 분석</span></div><div class=\"band focus\" data-step=\"4\">기초 개념부터 첫 프로젝트, AI 검증, 종합 프로젝트까지 요구사항과 실행 증거를 계속 연결합니다.</div>","footer":"이 책의 방향과 핵심 원칙"},{"section":"LEARNING OUTCOMES","title":"이 책에서 기르는 네 가지 능력","steps":5,"body":"<h2>이 책에서 기르는 네 가지 능력</h2><div class=\"grid4\"><article class=\"card focus\" data-step=\"1\"><i>01</i><h3>데이터 구조화</h3><p>현실의 사용자, 주문, 강의와 질문을 테이블과 관계로 표현합니다.</p></article><article class=\"card focus\" data-step=\"2\"><i>02</i><h3>정확한 SQL</h3><p>SQL이 실행되는지를 넘어 결과가 실제 업무 질문과 맞는지 검증합니다.</p></article><article class=\"card focus\" data-step=\"3\"><i>03</i><h3>안정적인 운영</h3><p>트랜잭션, 인덱스, 권한, 백업과 복구로 데이터의 정확성과 안전성을 지킵니다.</p></article><article class=\"card focus\" data-step=\"4\"><i>04</i><h3>AI 결과 검증</h3><p>AI가 만든 ERD, DDL과 SQL을 테스트와 실행 증거로 검토합니다.</p></article></div><div class=\"flow focus\" data-step=\"5\"><span>업무 질문<em>무엇을 알아야 하는가</em></span>→<span>요구사항<em>무엇을 저장할 것인가</em></span>→<span>ERD<em>어떻게 연결할 것인가</em></span>→<span>테이블·SQL<em>어떻게 구현할 것인가</em></span>→<span>검증·운영<em>정확하고 안전한가</em></span>→<span>분석·AI<em>어떻게 확장할 것인가</em></span></div>","footer":"업무 질문에서 검증과 AI 활용까지"},{"section":"ROADMAP 1","title":"학습 로드맵 ① 기초에서 설계까지","steps":3,"body":"<h2>학습 로드맵 ① 기초에서 설계까지</h2><div class=\"grid2\"><article class=\"stage focus\" data-step=\"1\"><label>STAGE 1 · Chapter 01–04</label><h3>데이터베이스 기초</h3><p>PostgreSQL 환경을 준비하고 관계형 데이터와 기본 SQL을 이해합니다.</p><ul><li><b>01</b> AI 시대에 데이터베이스를 왜 배워야 하는가</li><li><b>02</b> 데이터와 DBMS의 기본 개념</li><li><b>03</b> PostgreSQL과 DBeaver로 실습 환경 만들기</li><li><b>04</b> 관계형 데이터베이스와 SQL 시작하기</li></ul></article><article class=\"stage focus\" data-step=\"2\"><label>STAGE 2 · Chapter 05–07</label><h3>좋은 데이터 구조 만들기</h3><p>요구사항을 ERD와 제약조건으로 변환하고 첫 프로젝트를 완성합니다.</p><ul><li><b>05</b> 요구사항에서 데이터 모델과 ERD 만들기</li><li><b>06</b> 정규화와 데이터 무결성으로 좋은 테이블 만들기</li><li><b>07</b> 실전 프로젝트 1: 온라인 강의 수강신청 DB 완성하기</li></ul></article></div><div class=\"outcome focus\" data-step=\"3\">도달 목표 · 각 테이블의 한 행 의미와 기본키·외래키의 필요성을 설명하고 PostgreSQL로 구현합니다.</div>","footer":"Chapter 01–07 · 기초 → 설계 → 첫 프로젝트"},{"section":"ROADMAP 2","title":"학습 로드맵 ② 운영에서 AI 검증까지","steps":3,"body":"<h2>학습 로드맵 ② 운영에서 AI 검증까지</h2><div class=\"grid2\"><article class=\"stage focus\" data-step=\"1\"><label>STAGE 3 · Chapter 08–12</label><h3>조회와 안정적인 운영</h3><p>정확한 조회, 데이터 정합성, 성능, 보안과 저장소 선택을 다룹니다.</p><ul><li><b>08</b> JOIN과 집계로 서비스 질문에 답하기</li><li><b>09</b> 트랜잭션으로 데이터 정합성 지키기</li><li><b>10</b> 실행 계획으로 인덱스 효과 검증하기</li><li><b>11</b> 데이터베이스를 안전하게 지키고 복구하는 방법</li><li><b>12</b> 조회 패턴으로 RDBMS와 NoSQL 선택하기</li></ul></article><article class=\"stage focus\" data-step=\"2\"><label>STAGE 4 · Chapter 13–15</label><h3>AI와 분석으로 확장</h3><p>AI 초안을 실행 증거로 검증하고 분석과 프로젝트로 통합합니다.</p><ul><li><b>13</b> AI와 실행 증거로 데이터베이스 설계 검증하기</li><li><b>14</b> SQL 데이터 분석과 Python 확장</li><li><b>15</b> 데이터베이스 종합 프로젝트</li></ul></article></div><div class=\"outcome focus\" data-step=\"3\">도달 목표 · 정확성, 성능, 보안과 복구를 검증하고 AI와 함께 재현 가능한 DB 프로젝트를 완성합니다.</div>","footer":"운영 → 선택 → AI 검증 → 종합 프로젝트"},{"section":"PROJECT JOURNEY","title":"프로젝트를 통해 어떻게 성장하는가","steps":4,"body":"<h2>프로젝트를 통해 어떻게 성장하는가</h2><div class=\"projects\"><article class=\"project focus\" data-step=\"1\"><label>PROJECT 1 · Chapter 07</label><h3>온라인 강의 수강신청 DB</h3><p>기본 SQL, 요구사항, ERD, 정규화와 무결성을 하나의 데이터베이스로 연결합니다.</p><ul><li>학생·강사·강의·수강신청 ERD</li><li>전용 스키마와 샘플 데이터</li><li>변경 시나리오와 자동 검증</li></ul></article><article class=\"project focus\" data-step=\"2\"><label>AI REVIEW · Chapter 13</label><h3>AI 설계와 SQL 검증</h3><p>AI 결과를 정답이 아니라 테스트해야 할 변경 후보로 다룹니다.</p><ul><li>요구사항과 미확정 정책 구분</li><li>정상·경계·실패 테스트</li><li>메타데이터·diff·증거 검토</li></ul></article><article class=\"project focus\" data-step=\"3\"><label>FINAL PROJECT · Chapter 15</label><h3>AI 튜터링 질문 관리 서비스</h3><p>설계부터 운영, 분석, AI 검토와 복구까지 전체 학습을 통합합니다.</p><ul><li>질문·답변·학습 자료 관계</li><li>트랜잭션·인덱스·권한 검증</li><li>SQL·pandas 분석과 복원</li></ul></article></div><div class=\"outcome focus\" data-step=\"4\">프로젝트 완료는 파일이 존재하는 상태가 아니라, 다른 사람이 같은 순서로 실행해 같은 결과를 확인할 수 있는 상태입니다.</div>","footer":"설계 → 검증 → 재현 가능한 종합 프로젝트"},{"section":"FINAL OUTCOME","title":"이 책을 읽고 나면 갖추는 결과","steps":3,"body":"<h2>이 책을 읽고 나면 갖추는 결과</h2><div class=\"grid2\"><article class=\"final focus\" data-step=\"1\"><h3>실무 산출물</h3><p>설계·실행·검증과 운영 증거를 갖춘 프로젝트를 완성합니다.</p><div class=\"chips\"><span>요구사항·정책</span><span>ERD·DDL</span><span>Seed·검증 SQL</span><span>트랜잭션·오류 테스트</span><span>인덱스·실행 계획</span><span>보안·백업·복구</span><span>SQL·Python 분석</span><span>AI 검토 보고서</span></div></article><article class=\"final focus\" data-step=\"2\"><h3>설명하고 판단하는 능력</h3><p>각 결과가 왜 맞는지, 어떤 근거로 승인했는지를 자신의 말로 설명합니다.</p><div class=\"chips\"><span>한 행의 의미</span><span>키와 관계의 이유</span><span>업무 질문과 SQL 결과</span><span>오류 차단 방법</span><span>인덱스 효과</span><span>AI 승인 근거</span><span>재현 가능성</span></div></article></div><div class=\"next focus\" data-step=\"3\"><span>좋은 DB 프로젝트는 요구사항부터 실행 결과와 복구 절차까지 연결되는 프로젝트입니다.</span><b>Chapter 01에서 시작합니다 →</b></div>","footer":"이해 · 실행 · 검증 · 재현"}],CH='ai-database-course-overview-sync',view=document.getElementById('view');view.innerHTML=DATA.map((s,i)=>`<section class="slide" data-steps="${s.steps}"><header><b>${s.section}</b><span><button class="script" onclick="openScript()" title="발표 스크립트">▤</button>${String(i+1).padStart(2,'0')} / 06</span></header><main>${s.body}</main><footer><span>AI 시대의 데이터베이스 입문</span><span>${s.footer}</span></footer></section>`).join('')+'<div id="status"></div><nav><button id="prev">←</button><button id="next">→</button></nav>';const S=[...document.querySelectorAll('.slide')],P=document.getElementById('prev'),N=document.getElementById('next'),ST=document.getElementById('status');let si=Math.max(0,Math.min(S.length-1,(parseInt(location.hash.slice(1))||1)-1)),step=0,child=null;const max=(i=si)=>+S[i].dataset.steps;function send(){if(child&&!child.closed)child.postMessage({channel:CH,type:'presentation-state',slideIndex:si,stepIndex:step},'*')}function show(a,b=0,opt={}){si=Math.max(0,Math.min(S.length-1,+a||0));step=Math.max(0,Math.min(max(si),+b||0));S.forEach((x,i)=>x.classList.toggle('active',i===si));S[si].querySelectorAll('.focus').forEach(x=>{let t=+x.dataset.step;x.classList.toggle('active-focus',step>0&&t===step);x.classList.toggle('muted',step>0&&t!==step)});ST.textContent=`${si+1}페이지 · ${step?step+' / '+max()+'단계':'전체 보기'}`;P.disabled=si===0&&step===0;N.disabled=si===S.length-1&&step===max();if(opt.hash!==false)history.replaceState(null,'','#'+(si+1));if(opt.notify!==false)send()}function next(){step<max()?show(si,step+1):si<S.length-1&&show(si+1,0)}function prev(){step>0?show(si,step-1):si>0&&show(si-1,max(si-1))}window.openScript=()=>{if(child&&!child.closed){child.focus();send();return}child=window.open('course_overview_script.html#'+(si+1),'aiDatabaseCourseOverviewScript','width=900,height=940,resizable=yes,scrollbars=yes');setTimeout(send,300);setTimeout(send,800)};window.setSlideFromScript=(a,b=0)=>show(a,b,{notify:false});addEventListener('message',e=>{let d=e.data||{};if(d.channel!==CH)return;if(e.source&&!e.source.closed)child=e.source;if(d.type==='navigate-presentation')show(d.slideIndex,d.stepIndex,{notify:false});if(d.type==='request-next')next();if(d.type==='request-prev')prev();if(d.type==='script-ready')send()});P.onclick=prev;N.onclick=next;view.onclick=e=>{if(e.target.closest('button'))return;let r=view.getBoundingClientRect();e.clientX-r.left<r.width*.32?prev():next()};addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();next()}else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();prev()}else if(e.key==='Home')show(0,0);else if(e.key==='End')show(S.length-1,max(S.length-1));else if(e.key.toLowerCase()==='s')openScript();else if(e.key.toLowerCase()==='f')document.documentElement.requestFullscreen?.()});show(si,0,{notify:false,hash:false});</script></body></html>
