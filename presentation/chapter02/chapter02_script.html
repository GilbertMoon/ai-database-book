<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chapter 02 발표자 스크립트</title>
  <style>
    :root{--text:#172033;--muted:#526171;--primary:#155eef;--soft:#e8f0ff;--border:#cbd5e1}*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:var(--text);font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif}.script-shell{max-width:1080px;margin:auto;padding:28px}.script-header,.script-content section{padding:24px 28px;border:1px solid var(--border);border-radius:8px;background:#fff}.script-header div{display:flex;justify-content:space-between;color:var(--muted)}h1{margin:12px 0 0;font-size:32px}h2{font-size:20px;color:var(--primary)}p{font-size:20px;line-height:1.75}.script-content{display:grid;gap:18px;margin:18px 0 80px}.script-step{display:grid;grid-template-columns:48px 1fr;gap:14px;padding:16px;border:2px solid transparent;border-radius:8px}.script-step.active{border-color:var(--primary);background:var(--soft)}.script-step p{margin:6px 0;font-size:18px}.script-step small{color:var(--muted)}.cue-button{width:42px;height:42px;border:0;border-radius:50%;background:#172033;color:#fff;cursor:pointer}.cue-button:focus-visible,footer button:focus-visible{outline:4px solid #f59e0b;outline-offset:2px}footer{position:fixed;inset:auto 0 0;display:flex;justify-content:center;gap:12px;padding:14px;background:rgba(23,32,51,.92)}footer button{padding:11px 30px;border:0;border-radius:8px;background:#fff;color:#172033;font-size:17px;font-weight:800;cursor:pointer}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="script-shell" id="script-app"></div>
  <script src="chapter02_data.js"></script>
  <script src="../common/script_runtime.js"></script>
</body>
</html>
