<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chapter 02 발표 스크립트</title>
<style>
:root{--bg:#eef2f6;--surface:#fff;--text:#182230;--muted:#667085;--primary:#155eef;--primary-soft:#e8f0ff;--border:#d9e1ea;--success:#138a55;--success-soft:#e9f8f0}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0;font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text)}
body{padding:24px}.shell{max-width:940px;margin:0 auto}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;color:var(--muted);font-size:15px;font-weight:850}.topbar b{color:var(--primary)}
.card{min-height:650px;padding:32px 36px;border:1px solid var(--border);border-radius:22px;background:var(--surface);box-shadow:0 12px 28px rgba(24,34,48,.08)}
h1{margin:0 0 8px;font-size:30px;line-height:1.3;letter-spacing:-.03em}.meta{margin:0 0 24px;color:var(--muted);font-size:15px}.script-text{font-size:21px;line-height:1.82;letter-spacing:-.012em}.script-text p{margin:0 0 18px}
.cue{display:flex;align-items:center;gap:12px;margin:2px 0 20px;padding:9px 11px;border:1px dashed #bcc8d8;border-radius:14px;background:#f8fafc}.line{flex:1;height:1px;background:#d7dee8}
.cue-button{min-height:38px;padding:0 14px;border:1px solid #b8c8f5;border-radius:999px;background:#fff;color:#98a2b3;font-weight:850}.cue-button.next{background:var(--primary-soft);color:var(--primary);cursor:pointer}.cue-button.done{background:var(--success-soft);color:var(--success);border-color:#a7dec1}.cue-button.current{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 0 0 4px rgba(21,94,239,.12)}.cue-button:disabled{opacity:1}
.hint{margin-top:25px;padding:14px 16px;border-radius:14px;background:var(--primary-soft);color:#344054;font-size:15px;line-height:1.55}
.nav{position:sticky;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:17px;padding:14px 0 2px;background:linear-gradient(180deg,rgba(238,242,246,0),var(--bg) 28%)}.nav-group{display:flex;gap:9px}.nav button{min-height:45px;padding:0 17px;border:0;border-radius:12px;background:#182230;color:#fff;font-weight:850;cursor:pointer}.nav button:disabled{opacity:.35;cursor:default}#focusSlides{background:var(--primary-soft);color:var(--primary)}.state-wrap{text-align:center;color:var(--muted);font-weight:800}#state{display:block;margin-top:4px;font-size:13px}
@media(max-width:700px){body{padding:12px}.card{min-height:auto;padding:24px 20px}.script-text{font-size:19px}.nav{flex-wrap:wrap}}
</style>
</head>
<body>
<main class="shell"><div class="topbar"><b>Chapter 02 · 발표 스크립트</b><span id="topCounter">01 / 16</span></div><section class="card" id="card"></section><nav class="nav" aria-label="스크립트 탐색"><div class="nav-group"><button id="prevPage" type="button">← 이전 장표</button><button id="nextPage" type="button">다음 장표 →</button></div><div class="state-wrap"><span id="counter">01 / 16</span><span id="state">전체 보기</span></div><button id="focusSlides" type="button">장표 창 보기 ↗</button></nav></main>
<script src="chapter02_slides_01.js"></script><script src="chapter02_slides_02.js"></script>
<script>
(()=>{
const CHANNEL='chapter02-presentation-sync',slides=window.CH2_SLIDES||[],card=document.getElementById('card');
let slideIndex=Math.max(0,Math.min((parseInt(location.hash.slice(1),10)||1)-1,slides.length-1)),stepIndex=0,presentationWindow=window.opener&&!window.opener.closed?window.opener:null;
const ttsReplacements=[[/\bPostgreSQL\b/g,'포스트그레스큐엘'],[/\bDBeaver\b/g,'디비버'],[/\bDatabase\b/g,'데이터베이스'],[/\bDBMS\b/g,'디비엠에스'],[/\bServer\b/g,'서버'],[/\bClient\b/g,'클라이언트'],[/\bSchema\b/g,'스키마'],[/\bTable\b/g,'테이블'],[/\bRow\b/g,'행'],[/\bColumn\b/g,'열'],[/\bCell\b/g,'셀'],[/\bPrimary Key\b/g,'기본키'],[/\bForeign Key\b/g,'외래키'],[/\bPK\b/g,'피케이'],[/\bFK\b/g,'에프케이'],[/\bSQL\b/g,'에스큐엘'],[/\bJSON\b/g,'제이슨'],[/\bNoSQL\b/g,'노에스큐엘']];
function ttsText(value){return ttsReplacements.reduce((v,[p,r])=>v.replace(p,r),String(value||''))}function escapeHtml(value){return String(value||'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function segments(i=slideIndex){const raw=String(slides[i]?.s||'').trim(),parts=raw.split(/\n\s*\n/).map(v=>v.replace(/\s+/g,' ').trim()).filter(Boolean);return parts.length?parts:['핵심 내용을 설명합니다.']}function maxStep(i=slideIndex){return Number(slides[i]?.steps||segments(i).length)}
function send(type,extra={}){if(!presentationWindow||presentationWindow.closed)return false;try{presentationWindow.postMessage({channel:CHANNEL,type,...extra},'*');return true}catch(e){return false}}function sendState(){send('navigate-presentation',{slideIndex,stepIndex})}
function requestNext(){if(send('request-next'))return;try{if(presentationWindow?.chapter02NextFromScript){presentationWindow.chapter02NextFromScript();return}}catch(e){}localNext()}function requestPrev(){if(send('request-prev'))return;try{if(presentationWindow?.chapter02PrevFromScript){presentationWindow.chapter02PrevFromScript();return}}catch(e){}localPrev()}
function render(){const s=slides[slideIndex],parts=segments(),page=String(slideIndex+1).padStart(2,'0'),total=String(slides.length).padStart(2,'0');document.getElementById('topCounter').textContent=`${page} / ${total}`;document.getElementById('counter').textContent=`${page} / ${total}`;document.getElementById('state').textContent=stepIndex===0?'전체 보기':`강조 ${stepIndex} / ${maxStep()}`;document.getElementById('prevPage').disabled=slideIndex===0;document.getElementById('nextPage').disabled=slideIndex===slides.length-1;card.innerHTML=`<h1>${escapeHtml(s.t||s.l||'핵심 내용')}</h1><p class="meta">${escapeHtml(s.k||'CHAPTER 02')} · 파란 버튼은 부모 장표의 다음 버튼과 동일하게 동작합니다.</p>${parts.map((text,j)=>`<div class="script-text"><p>${escapeHtml(ttsText(text))}</p></div><div class="cue"><span class="line"></span><button class="cue-button" type="button" data-step="${j+1}">${j+1}단계 진행</button><span class="line"></span></div>`).join('')}<div class="hint">스크립트를 읽은 뒤 다음 파란 버튼을 누르면 부모 장표가 같은 순서로 진행됩니다. 부모 장표에서 이동해도 이 창의 현재 단계가 함께 바뀝니다.</div>`;card.querySelectorAll('.cue-button').forEach(button=>{const target=Number(button.dataset.step);button.classList.toggle('done',target<stepIndex);button.classList.toggle('current',target===stepIndex&&stepIndex>0);button.classList.toggle('next',target===stepIndex+1);button.disabled=target!==stepIndex+1;button.addEventListener('click',requestNext)});history.replaceState(null,'',`#${slideIndex+1}`)}
function showState(newSlide,newStep=0,{notifyParent=true}={}){const old=slideIndex;slideIndex=Math.max(0,Math.min(slides.length-1,Number(newSlide)||0));stepIndex=Math.max(0,Math.min(maxStep(slideIndex),Number(newStep)||0));render();if(notifyParent)sendState();if(old!==slideIndex)scrollTo({top:0,behavior:'smooth'})}function localNext(){if(stepIndex<maxStep())showState(slideIndex,stepIndex+1);else if(slideIndex<slides.length-1)showState(slideIndex+1,0)}function localPrev(){if(stepIndex>0)showState(slideIndex,stepIndex-1);else if(slideIndex>0)showState(slideIndex-1,maxStep(slideIndex-1))}
window.setScriptState=(newSlide,newStep=0)=>showState(newSlide,newStep,{notifyParent:false});addEventListener('message',event=>{const data=event.data||{};if(data.channel!==CHANNEL)return;if(event.source&&!event.source.closed)presentationWindow=event.source;if(data.type==='presentation-state')showState(data.slideIndex,data.stepIndex,{notifyParent:false})});
document.getElementById('prevPage').onclick=()=>showState(slideIndex-1,0);document.getElementById('nextPage').onclick=()=>showState(slideIndex+1,0);document.getElementById('focusSlides').onclick=()=>{if(presentationWindow&&!presentationWindow.closed){presentationWindow.focus();sendState();return}presentationWindow=window.open(`chapter02_presentation.html#${slideIndex+1}`,'chapter02Presentation');if(presentationWindow){presentationWindow.focus();setTimeout(sendState,400)}};
addEventListener('keydown',event=>{if(['ArrowRight','ArrowDown','PageDown',' '].includes(event.key)){event.preventDefault();requestNext()}else if(['ArrowLeft','ArrowUp','PageUp'].includes(event.key)){event.preventDefault();requestPrev()}else if(event.key==='Home')showState(0,0);else if(event.key==='End')showState(slides.length-1,maxStep(slides.length-1))});addEventListener('hashchange',()=>{const hash=parseInt(location.hash.slice(1),10);if(Number.isFinite(hash)&&hash-1!==slideIndex)showState(hash-1,0,{notifyParent:false})});render();if(presentationWindow&&!presentationWindow.closed){try{presentationWindow.postMessage({channel:CHANNEL,type:'script-ready'},'*')}catch(e){}setTimeout(sendState,250)}
})();
</script>
</body>
</html>
