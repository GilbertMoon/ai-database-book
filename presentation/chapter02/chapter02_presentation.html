<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapter 02 발표자료</title><style>:root{--bg:#f6f8fb;--surface:#fff;--soft:#eef3f8;--text:#182230;--muted:#5d6b7a;--primary:#155eef;--primary-soft:#e8f0ff;--accent:#f59e0b;--border:#d9e1ea;--shadow:0 18px 45px rgba(20,33,50,.12);--radius:28px}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0f1720;color:var(--text);font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif}body{cursor:none}.native{cursor:auto}.deck{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at top left,rgba(21,94,239,.18),transparent 34%),radial-gradient(circle at bottom right,rgba(245,158,11,.14),transparent 28%),#0f1720}.viewport{position:relative;width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16));overflow:hidden;background:var(--bg);box-shadow:var(--shadow)}.slide{position:absolute;inset:0;display:flex;flex-direction:column;padding:60px 84px 74px;background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(246,248,251,.99))}.slide:before{content:"";position:absolute;inset:0 0 auto;height:10px;background:linear-gradient(90deg,var(--primary),#4f8cff 70%,var(--accent))}.slide-header{display:flex;justify-content:space-between;align-items:center;min-height:58px;margin-bottom:24px}.eyebrow{color:var(--primary);font-weight:900;font-size:20px;letter-spacing:.02em}.chapter-label{padding:10px 18px;border:1px solid var(--border);border-radius:999px;color:var(--muted);font-size:18px;font-weight:800;background:rgba(255,255,255,.78)}.slide-body{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:1380px;width:100%;margin:auto}h1,h2,h3,p{margin-top:0}h1{font-size:76px;line-height:1.12;letter-spacing:-.045em}h2{font-size:54px;line-height:1.18;letter-spacing:-.035em;margin-bottom:24px}h3{font-size:32px;margin-bottom:10px}.lead{color:var(--muted);font-size:34px;line-height:1.55}.body-text{color:var(--muted);font-size:30px;line-height:1.55}.title-meta,.chips{display:flex;gap:14px;flex-wrap:wrap;margin-top:24px}.pill,.chip{padding:12px 18px;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-size:21px;font-weight:900}.grid-2,.grid-3{display:grid;gap:24px}.grid-2{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(3,1fr)}.card{min-height:170px;padding:24px 27px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;box-shadow:0 9px 24px rgba(33,50,73,.07);font-size:25px;line-height:1.45}.card p{margin:0;color:var(--muted);font-size:25px;line-height:1.45}.card.emphasis,.flow-step.current{background:var(--primary-soft);border-color:rgba(21,94,239,.28)}.flow-step.done{background:#e9f8ef;border-color:#b8e1c5}.number{display:inline-grid;place-items:center;min-width:48px;height:48px;padding:0 12px;margin-bottom:14px;border-radius:15px;background:var(--primary);color:#fff;font-weight:900}.bullet-list{display:grid;gap:14px;list-style:none;padding:0;margin:0}.bullet-list li{position:relative;padding-left:34px;font-size:29px;line-height:1.48}.bullet-list li:before{content:"";position:absolute;left:3px;top:.62em;width:13px;height:13px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 7px var(--primary-soft)}.quote{padding:34px 42px;border-left:10px solid var(--primary);background:var(--primary-soft);border-radius:0 28px 28px 0;font-size:40px;font-weight:900;line-height:1.52}.flow{display:flex;align-items:stretch;gap:14px}.flow-step{flex:1;display:grid;place-items:center;min-height:135px;padding:18px;border:1px solid var(--border);border-radius:24px;background:#fff;text-align:center;font-size:23px;font-weight:900;line-height:1.35}.flow-arrow{display:grid;place-items:center;color:var(--primary);font-size:36px}.hierarchy{display:grid;gap:12px;max-width:980px;margin:0 auto;width:100%}.hierarchy div{padding:17px 26px;border:1px solid var(--border);border-radius:18px;background:#fff;text-align:center;font-size:29px;font-weight:900}.hierarchy div:nth-child(2n){background:var(--primary-soft)}pre,.prompt-box,.codebox{padding:26px 32px;border-radius:24px;background:#101820;color:#eef7ff;white-space:pre-wrap;overflow:auto;font:25px/1.55 Consolas,"D2Coding",monospace}.prompt-box{font-family:inherit;font-size:30px;font-weight:700;line-height:1.55}.smallcode{font-size:22px;margin-top:18px}.table-wrap{overflow:hidden;border:1px solid var(--border);border-radius:24px;background:#fff}table{width:100%;border-collapse:collapse}th,td{padding:15px 18px;border-bottom:1px solid var(--border);text-align:left;font-size:24px;line-height:1.42}th{background:var(--soft);font-weight:900}tr:last-child td{border-bottom:0}.controls{position:absolute;right:24px;bottom:22px;display:flex;gap:10px;z-index:10}.btn{width:48px;height:48px;border:0;border-radius:15px;background:rgba(15,23,32,.78);color:#fff;font-size:23px;font-weight:900;cursor:pointer}.script-btn{position:absolute;left:28px;bottom:24px;width:34px;height:34px;border:1px solid rgba(21,94,239,.35);border-radius:50%;background:#fff;color:var(--primary);font-weight:900;z-index:10;cursor:pointer}.num{position:absolute;left:74px;bottom:29px;color:var(--muted);font-size:18px;font-weight:800}.track{position:absolute;left:0;right:0;bottom:0;height:7px;background:rgba(24,34,48,.1)}.bar{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent))}.overlay{position:absolute;inset:0;display:none;place-items:center;padding:40px;background:rgba(8,13,20,.78);backdrop-filter:blur(10px);z-index:100}.overlay.open{display:grid}.panel{width:min(1040px,92%);max-height:84%;overflow:auto;padding:38px 42px;border-radius:28px;background:#fff}.panel h2{font-size:38px}.script p{font-size:27px;line-height:1.75;color:#263445;margin:0 0 18px}.cursor,.halo{position:fixed;z-index:9999;pointer-events:none;transform:translate(-50%,-50%);border-radius:50%;opacity:0}.cursor{width:15px;height:15px;background:#ff2f2f;box-shadow:0 0 0 4px #fff,0 0 18px rgba(255,47,47,.8)}.halo{width:62px;height:62px;border:3px solid rgba(255,47,47,.88);background:rgba(255,47,47,.08)}body.ready:not(.native) .cursor,body.ready:not(.native) .halo{opacity:1}@media print{.controls,.script-btn,.num,.track,.overlay,.cursor,.halo{display:none!important}.slide{position:relative;width:297mm;height:167mm;page-break-after:always}}</style></head><body><div class="deck"><main class="viewport" id="app"></main></div><div class="halo" id="halo"></div><div class="cursor" id="cursor"></div><script src="chapter02_slides_01.js"></script><script src="chapter02_slides_02.js"></script><script>(()=>{let i=Math.max(0,Math.min((parseInt(location.hash.slice(1))||1)-1,CH2_SLIDES.length-1));const app=document.getElementById('app');function paragraphs(v){return String(v||'').split(/\n\s*\n/).map(p=>`<p>${p.trim()}</p>`).join('')}function render(){const s=CH2_SLIDES[i];app.innerHTML=`<section class="slide"><div class="slide-header"><span class="eyebrow">${s.k}</span><span class="chapter-label">${s.l}</span></div><div class="slide-body">${s.h}</div></section><button class="script-btn" id="sb">s</button><div class="num">${i+1} / ${CH2_SLIDES.length}</div><nav class="controls"><button class="btn" id="p">←</button><button class="btn" id="n">→</button></nav><div class="track"><div class="bar" style="width:${(i+1)/CH2_SLIDES.length*100}%"></div></div><div class="overlay" id="ov"><div class="panel"><h2>스크립트 · ${i+1}장</h2><div class="script">${paragraphs(s.s)}</div></div></div>`;location.hash=i+1;document.getElementById('p').onclick=prev;document.getElementById('n').onclick=next;document.getElementById('sb').onclick=e=>{e.stopPropagation();document.getElementById('ov').classList.add('open')};document.getElementById('ov').onclick=e=>{if(e.target.id==='ov')e.target.classList.remove('open')}}function next(){if(i<CH2_SLIDES.length-1){i++;render()}}function prev(){if(i>0){i--;render()}}document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('ov')?.classList.remove('open');return}if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();next()}else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();prev()}else if(e.key==='Home'){i=0;render()}else if(e.key==='End'){i=CH2_SLIDES.length-1;render()}else if(e.key.toLowerCase()==='s')document.getElementById('sb')?.click();else if(e.key.toLowerCase()==='f'){document.fullscreenElement?document.exitFullscreen():app.requestFullscreen?.()}else if(e.key.toLowerCase()==='c')document.body.classList.toggle('native')});app.addEventListener('click',e=>{if(e.target.closest('button')||e.target.closest('.panel'))return;const r=app.getBoundingClientRect();e.clientX-r.left<r.width*.32?prev():next()});document.addEventListener('mousemove',e=>{document.body.classList.add('ready');cursor.style.left=e.clientX+'px';cursor.style.top=e.clientY+'px';halo.style.left=e.clientX+'px';halo.style.top=e.clientY+'px'});window.addEventListener('hashchange',()=>{const n=parseInt(location.hash.slice(1));if(n&&n-1!==i){i=Math.max(0,Math.min(n-1,CH2_SLIDES.length-1));render()}});render()})();</script></body></html>
