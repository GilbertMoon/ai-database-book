<style>

.nested{max-width:1050px;margin:0 auto;width:100%}.layer{padding:14px;border:2px solid var(--border);border-radius:20px;text-align:center;font-weight:900}.server-layer{background:#f8fafc}.db-layer{margin:12px 35px 0;background:#eef4ff;border-color:#b9ccff}.schema-layer{margin:12px 42px 0;background:#fff;border-color:#9bb7ff}.object-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.object-row span{padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--soft)}.code-line,.row-formula{margin-top:16px;padding:14px 18px;border-radius:14px;background:#101820;color:#eef7ff;text-align:center;font-size:18px}.explorer{max-width:780px;margin:0 auto;padding:20px 26px;border:1px solid var(--border);border-radius:20px;background:#101820;color:#d9e8f4;font:18px/1.7 Consolas,monospace}.explorer .active{color:#8fb4ff;font-weight:900}.activity-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:15px}.activity b{color:var(--primary)}
.media-grid{display:grid;grid-template-columns:1.35fr .65fr;gap:22px;align-items:center}.media-frame{margin:0;padding:14px;border:1px solid var(--border);border-radius:20px;background:#fff}.media-frame img{display:block;width:100%;height:390px;object-fit:contain}.media-frame figcaption{text-align:center;color:var(--muted);font-size:13px}.legend-list{display:grid;gap:10px}.legend{padding:15px;border:1px solid var(--border);border-radius:14px;background:#fff}.legend b{display:block;color:var(--primary);font-size:17px}.legend span{font-size:14px;color:var(--muted)}.table-wrap{overflow:hidden;border:1px solid var(--border);border-radius:18px;background:#fff}table{width:100%;border-collapse:collapse}th,td{padding:13px 16px;border-bottom:1px solid var(--border);text-align:left;font-size:16px}th{background:var(--soft)}tr:last-child td{border-bottom:0}.activity-box{margin-top:16px;padding:18px 22px;border:1px solid #b9ccff;border-radius:18px;background:var(--primary-soft);text-align:center}.activity-box p{margin-bottom:8px}.activity-box strong{color:var(--primary);font-size:19px}.id-card.business{background:var(--primary-soft)}.rule-row{justify-content:center;margin-top:18px}.type-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.type-card{padding:22px 15px;border:1px solid var(--border);border-radius:18px;background:#fff;text-align:center}.type-card b{display:block;margin-bottom:10px;color:var(--primary);font:800 24px Consolas,monospace}.type-card span{color:var(--muted);font-size:15px}
.code-pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch;margin-top:16px}.code-pair pre{margin:0;padding:20px 24px;border-radius:17px;background:#101820;color:#eef7ff;font:18px/1.6 Consolas,monospace}.code-pair>div{padding:20px;border-radius:17px;background:var(--primary-soft)}.code-pair b{font-size:20px;color:var(--primary)}.code-focus-line{display:block;min-height:1.6em;padding:0 6px;border-radius:7px}.key-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.key-card:nth-child(2){background:var(--primary-soft)}.relation-line{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:18px;padding:17px;border:1px solid var(--border);border-radius:16px;background:#fff}.relation-line span{padding:9px 15px;border-radius:12px;background:var(--soft);font-weight:900}.relation-line b{color:var(--primary)}.relation-line i{color:var(--primary);font-style:normal;font-size:23px}.prompt-box{padding:22px 27px;border-radius:20px;background:#101820;color:#eef7ff;font-size:22px;line-height:1.55}.review-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.review-grid span{padding:13px 15px;border:1px solid var(--border);border-radius:13px;background:#fff;font-weight:800}.data-kinds{align-items:center;margin-top:14px;padding:13px 16px;border-radius:15px;background:var(--soft)}.data-kinds b{margin-right:5px;color:var(--primary)}.next-band{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-top:14px;padding:15px 18px;border-radius:15px;background:#182230;color:#fff;font-size:15px}.next-band span:last-child{color:#b8ccff}
.focus-target{transition:opacity .25s ease,transform .25s ease,box-shadow .25s ease,border-color .25s ease,background-color .25s ease}.focus-muted{opacity:.22;transform:scale(.987)}.focus-context{opacity:1;transform:none}.focus-active{opacity:1;transform:scale(1.012);border-color:var(--primary)!important;box-shadow:0 0 0 4px rgba(21,94,239,.11),0 12px 25px rgba(21,94,239,.12)!important;position:relative;z-index:4}.code-focus-line.focus-active{background:rgba(79,140,255,.3);box-shadow:none!important;transform:none}.code-focus-line.focus-muted{opacity:.25;transform:none}tbody tr.focus-active td{background:var(--primary-soft)}tbody tr.focus-muted{opacity:.27;transform:none}.review-grid span.focus-active,.rule-row span.focus-active,.data-kinds span.focus-active,.pill-row span.focus-active{background:var(--primary-soft)}
.controls{position:absolute;right:22px;bottom:16px;display:flex;gap:8px;z-index:10}.btn{width:44px;height:44px;border:0;border-radius:12px;background:#182230;color:#fff;font-size:21px;font-weight:900;cursor:pointer}.btn:disabled{opacity:.35;cursor:default}.num{position:absolute;left:24px;bottom:24px;color:var(--muted);font-size:15px;font-weight:850}.step-state{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);padding:7px 11px;border:1px solid var(--border);border-radius:999px;background:rgba(255,255,255,.94);color:var(--muted);font-size:13px;font-weight:850}.track{position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(24,34,48,.1)}.bar{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent))}.loading{display:grid;place-items:center;height:100%;color:var(--muted);font-size:22px;font-weight:850}
@media print{body{background:#fff;overflow:visible}.deck{position:static;display:block}.viewport{width:auto;height:auto;overflow:visible}.slide{position:relative;width:1600px;height:900px;page-break-after:always}.controls,.script-icon,.num,.step-state,.track{display:none!important}.focus-muted{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="deck"><main class="viewport" id="app"><div class="loading">Chapter 02를 불러오는 중입니다.</div></main></div>
<script src="chapter02_slides_01.js"></script>
<script src="chapter02_slides_02.js"></script>
<script src="chapter02_navigation.js"></script>
<script>
(() => {
  'use strict';
  const CHANNEL = 'chapter02-presentation-sync';
  const TARGET_ORIGIN = location.protocol === 'file:' ? '*' : location.origin;
  const app = document.getElementById('app');
  const slides = window.CH2_SLIDES || [];
  const navigation = window.CH2Navigation;
  const icon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l3 3v15H6z"/><path d="M15 3v4h4M9 11h6M9 15h6"/></svg>';
  let scriptWindow = null;

  const parseHash = () => {
    const match = location.hash.match(/^#(\d+)(?:\/(\d+))?$/);
    return match ? { slideIndex: Number(match[1]) - 1, stepIndex: Number(match[2] || 0) } : { slideIndex: 0, stepIndex: 0 };
  };
  const initial = parseHash();
  let slideIndex = Math.max(0, Math.min(slides.length - 1, initial.slideIndex));
  let stepIndex = 0;

  const steps = (index = slideIndex) => navigation.buildSteps(slides[index], index);
  const maxStep = (index = slideIndex) => steps(index).length;
  const updateHash = () => history.replaceState(null, '', `#${slideIndex + 1}/${stepIndex}`);

  const sendStateToScript = () => {
    if (!scriptWindow || scriptWindow.closed) return;
    try { scriptWindow.postMessage({ channel: CHANNEL, type: 'presentation-state', slideIndex, stepIndex }, TARGET_ORIGIN); } catch (_) {}
  };

  const render = () => {
    const slide = slides[slideIndex];
    if (!slide) {
      app.innerHTML = '<div class="loading">Chapter 02 장표를 찾을 수 없습니다.</div>';
      return;
    }
    app.innerHTML = `<section class="slide"><div class="slide-header"><span class="eyebrow">${slide.k}</span><div class="header-actions"><span class="chapter-label">${slide.l}</span><span>${String(slideIndex + 1).padStart(2, '0')} / ${String(slides.length).padStart(2, '0')}</span><button class="script-icon" id="scriptButton" type="button" title="발표 스크립트 열기" aria-label="현재 슬라이드 발표 스크립트 창 열기">${icon}</button></div></div><div class="slide-body">${slide.h}</div></section><div class="num">Chapter 02 · ${slideIndex + 1} / ${slides.length}</div><div class="step-state" id="state" aria-live="polite"></div><nav class="controls"><button class="btn" id="prevButton" aria-label="이전 단계 또는 슬라이드">←</button><button class="btn" id="nextButton" aria-label="다음 단계 또는 슬라이드">→</button></nav><div class="track"><div class="bar" style="width:${((slideIndex + 1) / slides.length) * 100}%"></div></div>`;
    navigation.applyFocus(app.querySelector('.slide-body'), slide, slideIndex, stepIndex);
    document.getElementById('state').textContent = stepIndex === 0 ? '전체 보기' : `스크립트 단계 ${stepIndex} / ${maxStep()}`;
    document.getElementById('prevButton').disabled = slideIndex === 0 && stepIndex === 0;
    document.getElementById('nextButton').disabled = slideIndex === slides.length - 1 && stepIndex === maxStep();
    document.getElementById('prevButton').addEventListener('click', previous);
    document.getElementById('nextButton').addEventListener('click', next);
    document.getElementById('scriptButton').addEventListener('click', (event) => { event.stopPropagation(); openScript(); });
    updateHash();
  };

  const showState = (newSlide, newStep = 0, { notifyChild = true } = {}) => {
    slideIndex = Math.max(0, Math.min(slides.length - 1, Number(newSlide) || 0));
    stepIndex = Math.max(0, Math.min(maxStep(slideIndex), Number(newStep) || 0));
    render();
    if (notifyChild) sendStateToScript();
  };

  function next() {
    if (stepIndex < maxStep()) showState(slideIndex, stepIndex + 1);
    else if (slideIndex < slides.length - 1) showState(slideIndex + 1, 0);
  }

  function previous() {
    if (stepIndex > 0) showState(slideIndex, stepIndex - 1);
    else if (slideIndex > 0) showState(slideIndex - 1, maxStep(slideIndex - 1));
  }

  const openScript = () => {
    if (scriptWindow && !scriptWindow.closed) {
      scriptWindow.focus();
      sendStateToScript();
      return;
    }
    scriptWindow = window.open(`chapter02_script.html#${slideIndex + 1}/${stepIndex}`, 'chapter02Script', 'width=860,height=940,resizable=yes,scrollbars=yes');
    if (scriptWindow) {
      scriptWindow.focus();
      setTimeout(sendStateToScript, 250);
      setTimeout(sendStateToScript, 750);
    }
  };

  window.setSlideFromScript = (newSlide, newStep = 0) => showState(newSlide, newStep, { notifyChild: false });
  window.chapter02NextFromScript = next;
  window.chapter02PrevFromScript = previous;

  addEventListener('message', (event) => {
    const data = event.data || {};
    if (data.channel !== CHANNEL) return;
    if (location.protocol !== 'file:' && event.origin !== location.origin) return;
    if (scriptWindow && event.source !== scriptWindow) return;
    if (!scriptWindow && data.type !== 'script-ready') return;
    if (!scriptWindow && event.source && !event.source.closed) scriptWindow = event.source;
    if (data.type === 'navigate-presentation') showState(data.slideIndex, data.stepIndex, { notifyChild: false });
    else if (data.type === 'request-next') next();
    else if (data.type === 'request-prev') previous();
    else if (data.type === 'script-ready') sendStateToScript();
  });

  addEventListener('keydown', (event) => {
    if (['ArrowRight','ArrowDown','PageDown',' '].includes(event.key)) { event.preventDefault(); next(); }
    else if (['ArrowLeft','ArrowUp','PageUp'].includes(event.key)) { event.preventDefault(); previous(); }
    else if (event.key === 'Home') showState(0, 0);
    else if (event.key === 'End') showState(slides.length - 1, maxStep(slides.length - 1));
    else if (event.key.toLowerCase() === 's') openScript();
    else if (event.key.toLowerCase() === 'f') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); }
  });

  app.addEventListener('click', (event) => {
    if (event.target.closest('button')) return;
    const rect = app.getBoundingClientRect();
    event.clientX - rect.left < rect.width * .32 ? previous() : next();
  });

  addEventListener('hashchange', () => {
    const parsed = parseHash();
    if (parsed.slideIndex !== slideIndex || parsed.stepIndex !== stepIndex) showState(parsed.slideIndex, parsed.stepIndex);
  });

  stepIndex = Math.max(0, Math.min(maxStep(slideIndex), initial.stepIndex));
  render();
})();
</script>
