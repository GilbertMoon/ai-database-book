<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapter 03 발표자료 선택</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1720;color:#182230;font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif}.panel{width:min(1040px,92vw);padding:48px;border-radius:30px;background:#fff;box-shadow:0 18px 45px rgba(20,33,50,.22)}h1{font-size:54px;margin:0 0 14px;letter-spacing:-.04em}.lead{font-size:24px;color:#5d6b7a;line-height:1.55;margin-bottom:34px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:22px}.card{display:block;padding:30px;border:1px solid #d9e1ea;border-radius:24px;text-decoration:none;color:#182230;background:#f6f8fb}.card:hover{background:#e8f0ff;border-color:#155eef}.card strong{display:block;font-size:31px;margin-bottom:10px}.card span{font-size:20px;color:#5d6b7a;line-height:1.45}.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.pill{padding:8px 13px;border-radius:999px;background:#e8f0ff;color:#155eef;font-weight:800;font-size:16px}@media(max-width:760px){.cards{grid-template-columns:1fr}}</style></head><body><main class="panel"><h1>Chapter 03 발표자료</h1><p class="lead">3장은 이론 강의와 실습 강의를 분리했습니다. 먼저 개념·실습 목적을 설명한 뒤, 발표자료와 프로그램 화면을 함께 띄워 실습을 진행합니다.</p><div class="cards"><a class="card" href="chapter03_theory_presentation.html"><strong>이론 강의 시작</strong><span>PostgreSQL·DBeaver 역할, 로컬/관리형 DB, 연결값, SQL 실행 범위, 완료 기준 설명</span><div class="meta"><span class="pill">약 30~40분</span><span class="pill">개념 중심</span></div></a><a class="card" href="chapter03_practice_presentation.html"><strong>실습 강의 시작</strong><span>PostgreSQL 설치, DBeaver 연결, ai_database_book 생성, 환경 검증, 오류 해결</span><div class="meta"><span class="pill">약 60~90분</span><span class="pill">화면 병행</span></div></a></div></main></body></html>
