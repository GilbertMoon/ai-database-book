<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chapter 01 발표자료</title>
<style>
:root{--bg:#f6f8fb;--surface:#fff;--soft:#eef3f8;--text:#182230;--muted:#5d6b7a;--primary:#155eef;--primary-soft:#e8f0ff;--accent:#f59e0b;--border:#d9e1ea;--shadow:0 18px 45px rgba(20,33,50,.12);--radius:28px}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0f1720;color:var(--text);font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif}.deck{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at top left,rgba(21,94,239,.18),transparent 34%),radial-gradient(circle at bottom right,rgba(245,158,11,.14),transparent 28%),#0f1720}.viewport{position:relative;width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16));overflow:hidden;background:var(--bg);box-shadow:var(--shadow)}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;padding:60px 84px 74px;background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(246,248,251,.99))}.slide:before{content:"";position:absolute;inset:0 0 auto;height:10px;background:linear-gradient(90deg,var(--primary),#4f8cff 70%,var(--accent))}.slide-header{display:flex;justify-content:space-between;align-items:center;min-height:58px;margin-bottom:24px}.eyebrow{color:var(--primary);font-weight:900;font-size:20px}.header-actions{display:flex;align-items:center;gap:10px}.chapter-label{padding:10px 18px;border:1px solid var(--border);border-radius:999px;color:var(--muted);font-size:18px;font-weight:800}.script-icon{width:34px;height:34px;padding:7px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--muted);cursor:pointer;display:grid;place-items:center}.script-icon:hover{color:var(--primary);border-color:#b9ccff;background:var(--primary-soft)}.script-icon svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.slide-body{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:1380px;width:100%;margin:auto;min-height:0}h1,h2,h3,p{margin-top:0}h1{font-size:72px;line-height:1.12;letter-spacing:-.045em}h2{font-size:54px;line-height:1.18;letter-spacing:-.035em}h3{font-size:32px}.lead{color:var(--muted);font-size:34px;line-height:1.55}.body-text{color:var(--muted);font-size:31px;line-height:1.55}.small{font-size:23px;color:var(--muted);line-height:1.55}.title-meta,.chips{display:flex;gap:14px;flex-wrap:wrap}.pill,.chip{padding:12px 18px;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-size:21px;font-weight:900}.grid-2,.grid-3{display:grid;gap:24px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.card{min-height:165px;padding:23px 26px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;box-shadow:0 9px 24px rgba(33,50,73,.07)}.number{display:inline-grid;place-items:center;min-width:50px;height:50px;padding:0 12px;margin-bottom:16px;border-radius:15px;background:var(--primary);color:#fff;font-weight:900}.bullet-list{display:grid;gap:14px;list-style:none;padding:0}.bullet-list li{position:relative;padding-left:34px;font-size:29px;line-height:1.48}.bullet-list li:before{content:"";position:absolute;left:3px;top:.62em;width:13px;height:13px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 7px var(--primary-soft)}.quote{padding:34px 42px;border-left:10px solid var(--primary);background:var(--primary-soft);border-radius:0 28px 28px 0;font-size:44px;font-weight:900;line-height:1.5}.flow{display:flex;align-items:stretch;gap:14px}.flow-step{flex:1;display:grid;place-items:center;min-height:130px;padding:16px;border:1px solid var(--border);border-radius:24px;background:#fff;text-align:center;font-size:23px;font-weight:900}.flow-arrow{display:grid;place-items:center;color:var(--primary);font-size:38px}pre,.prompt-box{padding:26px 32px;border-radius:24px;background:#101820;color:#eef7ff;white-space:pre-wrap;overflow:auto}code{font:24px/1.6 Consolas,monospace}.code-line{display:block;min-height:1.6em;padding:0 7px;border-radius:8px}.prompt-box{font-size:29px;line-height:1.55;font-weight:700}.table-wrap{overflow:hidden;border:1px solid var(--border);border-radius:24px;background:#fff}table{width:100%;border-collapse:collapse}th,td{padding:14px 17px;border-bottom:1px solid var(--border);text-align:left;font-size:23px;line-height:1.4}th{background:var(--soft)}tbody tr:last-child td{border-bottom:0}.question-mark{color:var(--accent);font-size:88px;font-weight:900}.activity-box{padding:28px 34px;border:1px solid rgba(21,94,239,.25);border-radius:28px;background:var(--primary-soft)}.activity-box li{font-size:28px;line-height:1.48}.cover-grid{display:grid;grid-template-columns:minmax(0,.88fr) minmax(0,1.35fr);gap:38px;align-items:center}.cover-intro h1{margin-bottom:22px;font-size:55px;line-height:1.13}.cover-overline{margin-bottom:16px;color:var(--primary);font-size:18px;font-weight:900;letter-spacing:.08em}.cover-lead{margin-bottom:24px;font-size:25px;line-height:1.55}.cover-intro .pill{padding:10px 14px;font-size:17px}.course-overview{padding:22px 24px;border:1px solid var(--border);border-radius:26px;background:rgba(255,255,255,.94);box-shadow:0 12px 30px rgba(33,50,73,.08)}.course-overview-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;margin-bottom:12px;border-bottom:1px solid var(--border);font-size:20px;font-weight:900}.course-overview-head strong{color:var(--primary);font-size:16px;letter-spacing:.04em}.course-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;margin:0;padding:0;list-style:none}.course-item{display:flex;align-items:flex-start;gap:8px;min-width:0;padding:8px;border-radius:10px}.course-item.current{background:var(--primary-soft)}.course-number{flex:0 0 25px;color:var(--primary);font-size:13px;font-weight:900;line-height:1.35}.course-title{font-size:13px;font-weight:750;line-height:1.35;word-break:keep-all}.controls{position:absolute;right:24px;bottom:22px;display:flex;gap:10px;z-index:10}.btn{width:48px;height:48px;border:0;border-radius:15px;background:rgba(15,23,32,.78);color:#fff;font-size:23px;font-weight:900;cursor:pointer}.btn:disabled{opacity:.35;cursor:default}.num{position:absolute;left:28px;bottom:29px;color:var(--muted);font-size:18px;font-weight:800}.step-state{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);padding:8px 13px;border:1px solid var(--border);border-radius:999px;background:rgba(255,255,255,.94);color:var(--muted);font-size:14px;font-weight:850;z-index:10}.track{position:absolute;left:0;right:0;bottom:0;height:7px;background:rgba(24,34,48,.1)}.bar{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent))}
.focus-target{transition:opacity .25s ease,transform .25s ease,box-shadow .25s ease,border-color .25s ease,background-color .25s ease}.focus-muted{opacity:.22;transform:scale(.988)}.focus-active{opacity:1;transform:scale(1.012);border-color:var(--primary)!important;box-shadow:0 0 0 5px rgba(21,94,239,.12),0 16px 30px rgba(21,94,239,.14)!important;position:relative;z-index:4}.code-line.focus-active{background:rgba(79,140,255,.28);box-shadow:none!important;transform:none}.code-line.focus-muted{opacity:.3;transform:none}tbody tr.focus-active td{background:var(--primary-soft)}tbody tr.focus-muted{opacity:.28;transform:none}.bullet-list li.focus-active,.activity-box li.focus-active{background:rgba(232,240,255,.82);border-radius:12px}.loading{display:grid;place-items:center;height:100%;color:var(--muted);font-size:24px;font-weight:850}
@media(max-width:1100px){.slide{padding:42px 58px 64px}h1{font-size:56px}h2{font-size:43px}.lead{font-size:28px}.body-text{font-size:25px}.card{min-height:140px}.small{font-size:19px}.bullet-list li{font-size:23px}th,td{font-size:19px;padding:11px 13px}code{font-size:19px}.flow-step{min-height:105px;font-size:19px}}
@media print{.controls,.script-icon,.num,.step-state,.track{display:none!important}.slide{position:relative;width:297mm;height:167mm;page-break-after:always}.focus-muted{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="deck"><main class="viewport" id="app"><div class="loading">Chapter 01을 불러오는 중입니다.</div></main></div>
<script src="chapter01_final_lecture_patch.js"></script>
<script src="chapter01_navigation.js"></script>
<script>
(() => {
  'use strict';
  const CHANNEL = 'chapter01-presentation-sync';
  const app = document.getElementById('app');
  const slides = window.CH1_SLIDES || [];
  const navigation = window.CH1Navigation;
  let scriptWindow = null;

  const displayReplacements = [
    [/포스트그레스큐엘/g,'PostgreSQL'],[/디비버/g,'DBeaver'],[/알디비엠에스/g,'RDBMS'],[/노에스큐엘/g,'NoSQL'],[/디비엠에스/g,'DBMS'],[/에스큐엘/g,'SQL'],[/에이아이/g,'AI'],[/이알디/g,'ERD'],[/디디엘/g,'DDL'],[/크러드/g,'CRUD'],[/파이썬/g,'Python'],[/이너 조인/g,'INNER JOIN'],[/조인/g,'JOIN'],[/널/g,'NULL'],[/아이디/g,'ID'],[/카운트 별표/g,'COUNT(*)']
  ];
  const displayEnglish = (value) => displayReplacements.reduce((result,[pattern,replacement]) => result.replace(pattern,replacement), String(value || ''));

  const parseHash = () => {
    const match = location.hash.match(/^#(\d+)(?:\/(\d+))?$/);
    if (!match) return { slideIndex: 0, stepIndex: 0 };
    return { slideIndex: Number(match[1]) - 1, stepIndex: Number(match[2] || 0) };
  };
  const initial = parseHash();
  let slideIndex = Math.max(0, Math.min(slides.length - 1, initial.slideIndex));
  let stepIndex = 0;

  const steps = (index = slideIndex) => navigation.buildSteps(slides[index], index);
  const maxStep = (index = slideIndex) => steps(index).length;

  const sendStateToScript = () => {
    if (!scriptWindow || scriptWindow.closed) return;
    try { scriptWindow.postMessage({ channel: CHANNEL, type: 'presentation-state', slideIndex, stepIndex }, '*'); } catch (_) {}
  };

  const updateHash = () => history.replaceState(null, '', `#${slideIndex + 1}/${stepIndex}`);

  const render = () => {
    const slide = slides[slideIndex];
    if (!slide) {
      app.innerHTML = '<div class="loading">Chapter 01 장표를 찾을 수 없습니다.</div>';
      return;
    }
    app.innerHTML = `<section class="slide"><div class="slide-header"><span class="eyebrow">${displayEnglish(slide.k)}</span><div class="header-actions"><span class="chapter-label">${displayEnglish(slide.l)}</span><button class="script-icon" id="scriptButton" type="button" title="발표 스크립트 열기" aria-label="현재 슬라이드 발표 스크립트 창 열기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l3 3v15H6z"/><path d="M15 3v4h4M9 11h6M9 15h6"/></svg></button></div></div><div class="slide-body">${displayEnglish(slide.h)}</div></section><div class="num">${slideIndex + 1} / ${slides.length}</div><div class="step-state" id="state" aria-live="polite"></div><nav class="controls"><button class="btn" id="prevButton" aria-label="이전 단계 또는 슬라이드">←</button><button class="btn" id="nextButton" aria-label="다음 단계 또는 슬라이드">→</button></nav><div class="track"><div class="bar" style="width:${((slideIndex + 1) / slides.length) * 100}%"></div></div>`;

    const root = app.querySelector('.slide-body');
    navigation.applyFocus(root, slide, slideIndex, stepIndex);
    document.getElementById('state').textContent = stepIndex === 0 ? '전체 보기' : `스크립트 단계 ${stepIndex} / ${maxStep()}`;
    document.getElementById('prevButton').disabled = slideIndex === 0 && stepIndex === 0;
    document.getElementById('nextButton').disabled = slideIndex === slides.length - 1 && stepIndex === maxStep();
    document.getElementById('prevButton').addEventListener('click', previous);
    document.getElementById('nextButton').addEventListener('click', next);
    document.getElementById('scriptButton').addEventListener('click', (event) => { event.stopPropagation(); openScript(); });
    updateHash();
  };

  const showState = (newSlide, newStep = 0, { notifyChild = true } = {}) => {
    slideIndex = Math.max(0, Math.min(slides.length - 1, Number(newSlide) || 0));
    stepIndex = Math.max(0, Math.min(maxStep(slideIndex), Number(newStep) || 0));
    render();
    if (notifyChild) sendStateToScript();
  };

  function next() {
    if (stepIndex < maxStep()) showState(slideIndex, stepIndex + 1);
    else if (slideIndex < slides.length - 1) showState(slideIndex + 1, 0);
  }

  function previous() {
    if (stepIndex > 0) showState(slideIndex, stepIndex - 1);
    else if (slideIndex > 0) showState(slideIndex - 1, maxStep(slideIndex - 1));
  }

  const openScript = () => {
    if (scriptWindow && !scriptWindow.closed) {
      scriptWindow.focus();
      sendStateToScript();
      return;
    }
    scriptWindow = window.open(`chapter01_script.html#${slideIndex + 1}/${stepIndex}`, 'chapter01Script', 'width=860,height=940,resizable=yes,scrollbars=yes');
    if (scriptWindow) {
      scriptWindow.focus();
      setTimeout(sendStateToScript, 250);
      setTimeout(sendStateToScript, 750);
    }
  };

  window.setSlideFromScript = (newSlide, newStep = 0) => showState(newSlide, newStep, { notifyChild: false });
  window.chapter01NextFromScript = next;
  window.chapter01PrevFromScript = previous;

  addEventListener('message', (event) => {
    const data = event.data || {};
    if (data.channel !== CHANNEL) return;
    if (event.source && !event.source.closed) scriptWindow = event.source;
    if (data.type === 'navigate-presentation') showState(data.slideIndex, data.stepIndex, { notifyChild: false });
    else if (data.type === 'request-next') next();
    else if (data.type === 'request-prev') previous();
    else if (data.type === 'script-ready') sendStateToScript();
  });

  addEventListener('keydown', (event) => {
    if (['ArrowRight','ArrowDown',' ','PageDown'].includes(event.key)) { event.preventDefault(); next(); }
    else if (['ArrowLeft','ArrowUp','PageUp'].includes(event.key)) { event.preventDefault(); previous(); }
    else if (event.key === 'Home') showState(0, 0);
    else if (event.key === 'End') showState(slides.length - 1, maxStep(slides.length - 1));
    else if (event.key.toLowerCase() === 's') openScript();
    else if (event.key.toLowerCase() === 'f') { document.fullscreenElement ? document.exitFullscreen() : app.requestFullscreen?.(); }
  });

  app.addEventListener('click', (event) => {
    if (event.target.closest('button')) return;
    const rect = app.getBoundingClientRect();
    event.clientX - rect.left < rect.width * .32 ? previous() : next();
  });

  addEventListener('hashchange', () => {
    const parsed = parseHash();
    if (parsed.slideIndex !== slideIndex || parsed.stepIndex !== stepIndex) showState(parsed.slideIndex, parsed.stepIndex);
  });

  stepIndex = Math.max(0, Math.min(maxStep(slideIndex), initial.stepIndex));
  render();
})();
</script>
</body>
</html>
