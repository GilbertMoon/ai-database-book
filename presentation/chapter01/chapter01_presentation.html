<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chapter 01 발표자료</title>
<style>
:root{--bg:#f6f8fb;--surface:#fff;--soft:#eef3f8;--text:#182230;--muted:#5d6b7a;--primary:#155eef;--primary-soft:#e8f0ff;--accent:#f59e0b;--border:#d9e1ea;--shadow:0 18px 45px rgba(20,33,50,.12);--radius:28px}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0f1720;color:var(--text);font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif}body{cursor:none}.native{cursor:auto}.deck{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at top left,rgba(21,94,239,.18),transparent 34%),radial-gradient(circle at bottom right,rgba(245,158,11,.14),transparent 28%),#0f1720}.viewport{position:relative;width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16));overflow:hidden;background:var(--bg);box-shadow:var(--shadow)}.slide{position:absolute;inset:0;display:flex;flex-direction:column;padding:60px 84px 74px;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(246,248,251,.99))}.slide:before{content:"";position:absolute;inset:0 0 auto;height:10px;background:linear-gradient(90deg,var(--primary),#4f8cff 70%,var(--accent))}.slide-header{display:flex;justify-content:space-between;align-items:center;min-height:58px;margin-bottom:24px}.eyebrow{color:var(--primary);font-weight:900;font-size:20px}.chapter-label{padding:10px 18px;border:1px solid var(--border);border-radius:999px;color:var(--muted);font-size:18px;font-weight:800}.slide-body{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:1380px;width:100%;margin:auto}h1,h2,h3,p{margin-top:0}h1{font-size:72px;line-height:1.12;letter-spacing:-.045em}h2{font-size:54px;line-height:1.18;letter-spacing:-.035em}h3{font-size:32px}.lead{color:var(--muted);font-size:34px;line-height:1.55}.body-text{color:var(--muted);font-size:31px;line-height:1.55}.small{font-size:23px;color:var(--muted);line-height:1.55}.title-meta,.chips{display:flex;gap:14px;flex-wrap:wrap}.pill,.chip{padding:12px 18px;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-size:21px;font-weight:900}.grid-2,.grid-3{display:grid;gap:24px}.grid-2{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(3,1fr)}.card{min-height:185px;padding:24px 27px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;box-shadow:0 9px 24px rgba(33,50,73,.07)}.number{display:inline-grid;place-items:center;min-width:50px;height:50px;padding:0 12px;margin-bottom:16px;border-radius:15px;background:var(--primary);color:#fff;font-weight:900}.bullet-list{display:grid;gap:14px;list-style:none;padding:0}.bullet-list li{position:relative;padding-left:34px;font-size:29px;line-height:1.48}.bullet-list li:before{content:"";position:absolute;left:3px;top:.62em;width:13px;height:13px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 7px var(--primary-soft)}.quote{padding:34px 42px;border-left:10px solid var(--primary);background:var(--primary-soft);border-radius:0 28px 28px 0;font-size:44px;font-weight:900;line-height:1.5}.flow{display:flex;align-items:stretch;gap:14px}.flow-step{flex:1;display:grid;place-items:center;min-height:140px;padding:18px;border:1px solid var(--border);border-radius:24px;background:#fff;text-align:center;font-size:24px;font-weight:900}.flow-arrow{display:grid;place-items:center;color:var(--primary);font-size:38px}pre,.prompt-box{padding:28px 34px;border-radius:24px;background:#101820;color:#eef7ff;white-space:pre-wrap;overflow:auto}code{font:24px/1.6 Consolas,monospace}.prompt-box{font-size:31px;line-height:1.55;font-weight:700}.table-wrap{overflow:hidden;border:1px solid var(--border);border-radius:24px;background:#fff}table{width:100%;border-collapse:collapse}th,td{padding:15px 18px;border-bottom:1px solid var(--border);text-align:left;font-size:24px;line-height:1.42}th{background:var(--soft)}.question-mark{color:var(--accent);font-size:88px;font-weight:900}.activity-box{padding:30px 36px;border:1px solid rgba(21,94,239,.25);border-radius:28px;background:var(--primary-soft)}.activity-box li{font-size:29px;line-height:1.5}
.cover-grid{display:grid;grid-template-columns:minmax(0,.88fr) minmax(0,1.35fr);gap:38px;align-items:center}.cover-intro h1{margin-bottom:22px;font-size:55px;line-height:1.13}.cover-overline{margin-bottom:16px;color:var(--primary);font-size:18px;font-weight:900;letter-spacing:.08em}.cover-lead{margin-bottom:24px;font-size:25px;line-height:1.55}.cover-intro .pill{padding:10px 14px;font-size:17px}.course-overview{padding:22px 24px;border:1px solid var(--border);border-radius:26px;background:rgba(255,255,255,.94);box-shadow:0 12px 30px rgba(33,50,73,.08)}.course-overview-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;margin-bottom:12px;border-bottom:1px solid var(--border);font-size:20px;font-weight:900}.course-overview-head strong{color:var(--primary);font-size:16px;letter-spacing:.04em}.course-list{display:grid;grid-template-rows:repeat(5,minmax(0,1fr));grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:7px 14px;margin:0;padding:0;list-style:none}.course-item{display:flex;align-items:flex-start;gap:8px;min-width:0;padding:6px 7px;border-radius:10px}.course-item.current{background:var(--primary-soft)}.course-number{flex:0 0 25px;color:var(--primary);font-size:13px;font-weight:900;line-height:1.35}.course-title{font-size:13px;font-weight:750;line-height:1.35;word-break:keep-all}.course-item.current .course-title{font-weight:900}
.controls{position:absolute;right:24px;bottom:22px;display:flex;gap:10px;z-index:10}.btn{width:48px;height:48px;border:0;border-radius:15px;background:rgba(15,23,32,.78);color:#fff;font-size:23px;font-weight:900;cursor:pointer}.script-btn{position:absolute;left:28px;bottom:24px;width:34px;height:34px;border:1px solid rgba(21,94,239,.35);border-radius:50%;background:#fff;color:var(--primary);font-weight:900;z-index:10;cursor:pointer}.num{position:absolute;left:74px;bottom:29px;color:var(--muted);font-size:18px;font-weight:800}.track{position:absolute;left:0;right:0;bottom:0;height:7px;background:rgba(24,34,48,.1)}.bar{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent))}.overlay{position:absolute;inset:0;display:none;place-items:center;padding:40px;background:rgba(8,13,20,.78);backdrop-filter:blur(10px);z-index:100}.overlay.open{display:grid}.panel{width:min(1040px,92%);max-height:84%;overflow:auto;padding:38px 42px;border-radius:28px;background:#fff}.panel h2{font-size:38px}.script p{font-size:27px;line-height:1.75;color:#263445}.cursor,.halo{position:fixed;z-index:9999;pointer-events:none;transform:translate(-50%,-50%);border-radius:50%;opacity:0}.cursor{width:15px;height:15px;background:#ff2f2f;box-shadow:0 0 0 4px #fff,0 0 18px rgba(255,47,47,.8)}.halo{width:62px;height:62px;border:3px solid rgba(255,47,47,.88);background:rgba(255,47,47,.08)}body.ready:not(.native) .cursor,body.ready:not(.native) .halo{opacity:1}@media print{.controls,.script-btn,.num,.track,.overlay,.cursor,.halo{display:none!important}.slide{position:relative;width:297mm;height:167mm;page-break-after:always}}
</style>
</head>
<body>
<div class="deck"><main class="viewport" id="app"></main></div><div class="halo" id="halo"></div><div class="cursor" id="cursor"></div>
<script src="chapter01_slides_01.js"></script>
<script src="chapter01_slides_02.js"></script>
<script src="chapter01_overrides.js"></script>
<script src="chapter01_script_patch.js"></script>
<script src="chapter01_script_patch_13.js"></script>
<script src="chapter01_script_patch_17.js"></script>
<script>
(()=>{
let i=Math.max(0,Math.min((parseInt(location.hash.slice(1))||1)-1,CH1_SLIDES.length-1));
const app=document.getElementById('app');
const replacements=[
[/포스트그레스큐엘/g,'PostgreSQL'],[/디비버/g,'DBeaver'],[/알디비엠에스/g,'RDBMS'],[/노에스큐엘/g,'NoSQL'],[/디비엠에스/g,'DBMS'],[/에스큐엘/g,'SQL'],[/에이아이/g,'AI'],[/이알디/g,'ERD'],[/디디엘/g,'DDL'],[/크러드/g,'CRUD'],[/파이썬/g,'Python'],[/이너 조인/g,'INNER JOIN'],[/조인/g,'JOIN'],[/널/g,'NULL'],[/아이디/g,'ID'],[/카운트 별표/g,'COUNT(*)']
];
function displayEnglish(markup){return replacements.reduce((value,[pattern,replacement])=>value.replace(pattern,replacement),markup)}
function textOf(markup){const d=document.createElement('div');d.innerHTML=markup;return d.innerText.replace(/\s+/g,' ').trim()}
function paragraphs(value){return value.split(/\n\s*\n/).map(p=>`<p>${p.trim()}</p>`).join('')}
function scriptFor(s){
 if(s.s)return paragraphs(s.s);
 const title=s.t||s.l||'핵심 내용';
 const txt=textOf(s.h);
 const phrases=txt.split(/[.!?。]|\n/).map(v=>v.trim()).filter(v=>v&&v!==title).slice(0,5);
 const summary=phrases.length?`${phrases.join('. ')}.`:'';
 return `<p>이번에는 ‘${title}’이라는 주제를 살펴보겠습니다. ${summary} 각 항목의 뜻을 단순히 외우기보다 데이터의 의미와 업무 요구사항에 연결해 이해하는 것이 중요합니다. AI가 만든 결과도 같은 기준으로 확인해야 합니다.</p>`
}
function render(){
 const s=CH1_SLIDES[i];
 app.innerHTML=`<section class="slide"><div class="slide-header"><span class="eyebrow">${displayEnglish(s.k)}</span><span class="chapter-label">${displayEnglish(s.l)}</span></div><div class="slide-body">${displayEnglish(s.h)}</div></section><button class="script-btn" id="sb" aria-label="현재 슬라이드 스크립트 열기">s</button><div class="num">${i+1} / ${CH1_SLIDES.length}</div><nav class="controls"><button class="btn" id="p" aria-label="이전 슬라이드">←</button><button class="btn" id="n" aria-label="다음 슬라이드">→</button></nav><div class="track"><div class="bar" style="width:${(i+1)/CH1_SLIDES.length*100}%"></div></div><div class="overlay" id="ov"><div class="panel"><h2>스크립트 · ${i+1}장</h2><div class="script">${scriptFor(s)}</div></div></div>`;
 location.hash=i+1;document.getElementById('p').onclick=prev;document.getElementById('n').onclick=next;document.getElementById('sb').onclick=e=>{e.stopPropagation();document.getElementById('ov').classList.add('open')};document.getElementById('ov').onclick=e=>{if(e.target.id==='ov')e.target.classList.remove('open')}
}
function next(){if(i<CH1_SLIDES.length-1){i++;render()}}function prev(){if(i>0){i--;render()}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('ov')?.classList.remove('open');return}if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();next()}else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();prev()}else if(e.key.toLowerCase()==='s')document.getElementById('sb').click();else if(e.key.toLowerCase()==='f'){document.fullscreenElement?document.exitFullscreen():app.requestFullscreen?.()}else if(e.key.toLowerCase()==='c')document.body.classList.toggle('native')});
app.addEventListener('click',e=>{if(e.target.closest('button')||e.target.closest('.panel'))return;const r=app.getBoundingClientRect();e.clientX-r.left<r.width*.32?prev():next()});document.addEventListener('mousemove',e=>{document.body.classList.add('ready');cursor.style.left=e.clientX+'px';cursor.style.top=e.clientY+'px';halo.style.left=e.clientX+'px';halo.style.top=e.clientY+'px'});window.addEventListener('hashchange',()=>{const n=parseInt(location.hash.slice(1));if(n&&n-1!==i){i=Math.max(0,Math.min(n-1,CH1_SLIDES.length-1));render()}});render()
})();
</script>
</body>
</html>
