<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chapter 01 발표 스크립트</title>
<style>
:root{--bg:#eef2f6;--surface:#fff;--text:#182230;--muted:#667085;--primary:#155eef;--primary-soft:#e8f0ff;--border:#d9e1ea;--success:#138a55;--success-soft:#e9f8f0}
*{box-sizing:border-box}html,body{min-height:100%;margin:0;font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text)}body{padding:26px}.shell{max-width:940px;margin:0 auto}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;color:var(--muted);font-size:15px;font-weight:800}.topbar b{color:var(--primary)}
.card{min-height:650px;padding:34px 38px 38px;border:1px solid var(--border);border-radius:22px;background:var(--surface);box-shadow:0 12px 28px rgba(24,34,48,.08)}h1{margin:0 0 8px;font-size:30px;line-height:1.3;letter-spacing:-.03em}.meta{margin:0 0 27px;color:var(--muted);font-size:16px}.script-text{font-size:21px;line-height:1.85;letter-spacing:-.012em}.script-text p{margin:0 0 20px}
.cue{display:flex;align-items:center;gap:12px;margin:2px 0 22px;padding:10px 12px;border:1px dashed #bcc8d8;border-radius:14px;background:#f8fafc}.line{flex:1;height:1px;background:#d7dee8}.cue-button{min-height:38px;padding:0 13px;border:1px solid #cbd5e1;border-radius:999px;background:#fff;color:#98a2b3;font:inherit;font-weight:850}.cue-button:before{content:"▶";margin-right:8px}.cue-button.next{border-color:#b8c8f5;background:var(--primary-soft);color:var(--primary);cursor:pointer}.cue-button.current{border-color:var(--primary);background:var(--primary);color:#fff;box-shadow:0 0 0 4px rgba(21,94,239,.12)}.cue-button.done{border-color:#a7dec1;background:var(--success-soft);color:var(--success)}.cue-button:disabled{opacity:1}
.hint{margin-top:28px;padding:14px 16px;border-radius:14px;background:var(--primary-soft);color:#344054;font-size:16px;line-height:1.55}
.nav{position:sticky;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;padding:14px 0 2px;background:linear-gradient(180deg,rgba(238,242,246,0),var(--bg) 28%)}.nav-group{display:flex;gap:10px}.nav button{min-height:46px;padding:0 18px;border:0;border-radius:12px;background:#182230;color:#fff;font:inherit;font-weight:850;cursor:pointer}.nav button:disabled{opacity:.35;cursor:default}.nav .focus-button{background:var(--primary-soft);color:var(--primary)}.counter{color:var(--muted);font-weight:800;text-align:center}.state{margin-top:6px;color:var(--muted);font-size:14px}
@media(max-width:700px){body{padding:13px}.card{min-height:auto;padding:25px 21px}.script-text{font-size:19px;line-height:1.75}.nav{flex-wrap:wrap}}
</style>
</head>
<body>
<main class="shell">
<div class="topbar"><b>Chapter 01 · 발표 스크립트</b><span id="topCounter"></span></div>
<section class="card" id="card"></section>
<nav class="nav" aria-label="스크립트와 장표 이동">
 <div class="nav-group"><button id="prevPage" type="button">← 이전 장표</button><button id="nextPage" type="button">다음 장표 →</button></div>
 <div class="counter"><span id="counter"></span><div class="state" id="state"></div></div>
 <button class="focus-button" id="focusSlides" type="button">장표 창 보기 ↗</button>
</nav>
</main>
<script src="chapter01_slides_01.js"></script>
<script src="chapter01_overrides.js"></script>
<script src="chapter01_script_patch.js"></script>
<script src="chapter01_script_patch_13.js"></script>
<script src="chapter01_script_patch_17.js"></script>
<script src="chapter01_final_lecture_patch.js"></script>
<script>
(()=>{
const CHANNEL='chapter01-presentation-sync';
const slides=window.CH1_SLIDES||[];
const card=document.getElementById('card');
let slideIndex=Math.max(0,Math.min((parseInt(location.hash.slice(1),10)||1)-1,slides.length-1));
let stepIndex=0;
let presentationWindow=window.opener&&!window.opener.closed?window.opener:null;
const displayReplacements=[[/포스트그레스큐엘/g,'PostgreSQL'],[/디비버/g,'DBeaver'],[/알디비엠에스/g,'RDBMS'],[/노에스큐엘/g,'NoSQL'],[/디비엠에스/g,'DBMS'],[/에스큐엘/g,'SQL'],[/에이아이/g,'AI'],[/이알디/g,'ERD'],[/디디엘/g,'DDL'],[/크러드/g,'CRUD'],[/파이썬/g,'Python'],[/이너 조인/g,'INNER JOIN'],[/조인/g,'JOIN'],[/널/g,'NULL'],[/아이디/g,'ID'],[/카운트 별표/g,'COUNT(*)']];
const ttsReplacements=[[/\bPostgreSQL\b/g,'포스트그레스큐엘'],[/\bDBeaver\b/g,'디비버'],[/\bRDBMS\b/g,'알디비엠에스'],[/\bNoSQL\b/g,'노에스큐엘'],[/\bDBMS\b/g,'디비엠에스'],[/\bSQLSTATE\b/g,'에스큐엘 스테이트'],[/\bSQL\b/g,'에스큐엘'],[/\bAI\b/g,'에이아이'],[/\bERD\b/g,'이알디'],[/\bDDL\b/g,'디디엘'],[/\bDML\b/g,'디엠엘'],[/\bDCL\b/g,'디씨엘'],[/\bTCL\b/g,'티씨엘'],[/\bCRUD\b/g,'크러드'],[/\bPython\b/g,'파이썬'],[/\bINNER JOIN\b/g,'이너 조인'],[/\bLEFT JOIN\b/g,'레프트 조인'],[/\bJOIN\b/g,'조인'],[/\bNULL\b/g,'널'],[/\bID\b/g,'아이디'],[/COUNT\(\*\)/g,'카운트 별표']];
function displayEnglish(value){return displayReplacements.reduce((v,[p,r])=>v.replace(p,r),value||'')}
function ttsText(value){return ttsReplacements.reduce((v,[p,r])=>v.replace(p,r),value||'')}
function textOf(markup){const d=document.createElement('div');d.innerHTML=markup||'';return d.innerText.replace(/\s+/g,' ').trim()}
function escapeHtml(value){return(value||'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function rawScript(s){
 if(s?.s&&s.s.trim())return s.s.trim();
 const title=s?.t||s?.l||'핵심 내용';
 const body=textOf(s?.h||'');
 return `이번에는 ‘${title}’이라는 주제를 살펴보겠습니다.\n\n${body}\n\n각 항목을 데이터의 의미와 업무 요구사항에 연결해 확인합니다. 에이아이가 만든 결과도 실행 결과와 근거를 함께 검토합니다.`;
}
function scriptSegments(s){
 const raw=rawScript(s);
 let parts=raw.split(/\n\s*\n/).map(v=>v.replace(/\s+/g,' ').trim()).filter(Boolean);
 if(parts.length===1){
   const sentences=(parts[0].match(/[^.!?。]+[.!?。]?/g)||[]).map(v=>v.trim()).filter(Boolean);
   if(sentences.length>2){parts=[];for(let j=0;j<sentences.length;j+=2)parts.push(sentences.slice(j,j+2).join(' '))}
 }
 return parts.length?parts:['핵심 내용을 설명합니다.'];
}
function segments(i=slideIndex){return scriptSegments(slides[i])}
function maxStep(i=slideIndex){return segments(i).length}
function send(type,extra={}){
 if(!presentationWindow||presentationWindow.closed)return false;
 try{presentationWindow.postMessage({channel:CHANNEL,type,...extra},'*');return true}catch(e){return false}
}
function sendState(){send('navigate-presentation',{slideIndex,stepIndex})}
function requestNext(){
 if(send('request-next'))return;
 try{if(presentationWindow?.chapter01NextFromScript){presentationWindow.chapter01NextFromScript();return}}catch(e){}
 localNext();
}
function requestPrev(){
 if(send('request-prev'))return;
 try{if(presentationWindow?.chapter01PrevFromScript){presentationWindow.chapter01PrevFromScript();return}}catch(e){}
 localPrev();
}
function render(){
 const s=slides[slideIndex],parts=segments();
 const page=String(slideIndex+1).padStart(2,'0');
 document.getElementById('topCounter').textContent=`${page} / ${String(slides.length).padStart(2,'0')}`;
 document.getElementById('counter').textContent=`${page} / ${String(slides.length).padStart(2,'0')}`;
 document.getElementById('state').textContent=stepIndex===0?'전체 보기':`스크립트 단계 ${stepIndex} / ${maxStep()}`;
 document.getElementById('prevPage').disabled=slideIndex===0;
 document.getElementById('nextPage').disabled=slideIndex===slides.length-1;
 card.innerHTML=`<h1>${escapeHtml(displayEnglish(s.t||s.l||'핵심 내용'))}</h1><p class="meta">${escapeHtml(displayEnglish(s.k||'CHAPTER 01'))} · 문단 뒤 파란 버튼은 부모 장표의 다음 버튼과 동일하게 동작합니다.</p>${parts.map((text,j)=>`<div class="script-text"><p>${escapeHtml(ttsText(text))}</p></div><div class="cue"><span class="line"></span><button class="cue-button" type="button" data-step="${j+1}">${j+1}단계 진행</button><span class="line"></span></div>`).join('')}<div class="hint">스크립트를 읽고 다음 파란 버튼을 누르면 부모 장표가 같은 순서로 진행됩니다. 부모 장표의 방향키와 버튼을 사용해도 이 창의 현재 단계가 함께 바뀝니다.</div>`;
 card.querySelectorAll('.cue-button').forEach(button=>{
   const target=Number(button.dataset.step);
   button.classList.toggle('done',target<stepIndex);
   button.classList.toggle('current',target===stepIndex&&stepIndex>0);
   button.classList.toggle('next',target===stepIndex+1);
   button.disabled=target!==stepIndex+1;
   button.addEventListener('click',requestNext);
 });
 history.replaceState(null,'',`#${slideIndex+1}`);
}
function showState(newSlide,newStep=0,{notifyParent=true}={}){
 const old=slideIndex;
 slideIndex=Math.max(0,Math.min(slides.length-1,Number(newSlide)||0));
 stepIndex=Math.max(0,Math.min(maxStep(slideIndex),Number(newStep)||0));
 render();
 if(notifyParent)sendState();
 if(old!==slideIndex)scrollTo({top:0,behavior:'smooth'});
}
function localNext(){
 if(stepIndex<maxStep())showState(slideIndex,stepIndex+1);
 else if(slideIndex<slides.length-1)showState(slideIndex+1,0);
}
function localPrev(){
 if(stepIndex>0)showState(slideIndex,stepIndex-1);
 else if(slideIndex>0)showState(slideIndex-1,maxStep(slideIndex-1));
}
window.setScriptState=(newSlide,newStep=0)=>showState(newSlide,newStep,{notifyParent:false});
addEventListener('message',event=>{
 const data=event.data||{};
 if(data.channel!==CHANNEL)return;
 if(event.source&&!event.source.closed)presentationWindow=event.source;
 if(data.type==='presentation-state')showState(data.slideIndex,data.stepIndex,{notifyParent:false});
});
document.getElementById('prevPage').onclick=()=>showState(slideIndex-1,0);
document.getElementById('nextPage').onclick=()=>showState(slideIndex+1,0);
document.getElementById('focusSlides').onclick=()=>{
 if(presentationWindow&&!presentationWindow.closed){presentationWindow.focus();sendState();return}
 presentationWindow=window.open(`chapter01_presentation.html#${slideIndex+1}`,'chapter01Presentation');
 setTimeout(sendState,400);setTimeout(sendState,900);
};
addEventListener('keydown',event=>{
 if(['ArrowRight','ArrowDown',' ','PageDown'].includes(event.key)){event.preventDefault();requestNext()}
 else if(['ArrowLeft','ArrowUp','PageUp'].includes(event.key)){event.preventDefault();requestPrev()}
 else if(event.key==='Home')showState(0,0);
 else if(event.key==='End')showState(slides.length-1,maxStep(slides.length-1));
});
addEventListener('hashchange',()=>{
 const n=parseInt(location.hash.slice(1),10);
 if(Number.isFinite(n)&&n-1!==slideIndex)showState(n-1,0,{notifyParent:false});
});
render();
if(presentationWindow&&!presentationWindow.closed){
 try{presentationWindow.postMessage({channel:CHANNEL,type:'script-ready'},'*')}catch(e){}
 setTimeout(sendState,250);
}
})();
</script>
<script src="../common/tts_pronunciation.js"></script>
</body>
</html>
