<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 시대의 데이터베이스 입문 — 발표 스크립트</title><style>:root{--bg:#eef2f6;--text:#182230;--muted:#667085;--p:#155eef;--ps:#e8f0ff;--bd:#d9e1ea;--ok:#138a55;--oks:#e9f8f0}*{box-sizing:border-box}body{margin:0;padding:26px;font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text)}#shell{max-width:940px;margin:auto}header{display:flex;justify-content:space-between;margin-bottom:16px;color:var(--muted);font-size:15px;font-weight:800}header b{color:var(--p)}.card{display:none;min-height:650px;padding:34px 38px;border:1px solid var(--bd);border-radius:22px;background:#fff;box-shadow:0 12px 28px rgba(24,34,48,.08)}.card.active{display:block}h1{margin:0 0 8px;font-size:30px}.meta{margin:0 0 27px;color:var(--muted)}.text{font-size:21px;line-height:1.85}.text p{margin:0 0 20px}.cue{display:flex;align-items:center;gap:12px;margin:2px 0 22px;padding:10px 12px;border:1px dashed #bcc8d8;border-radius:14px;background:#f8fafc}.line{flex:1;height:1px;background:#d7dee8}.cue button{min-height:38px;padding:0 13px;border:1px solid #b8c8f5;border-radius:999px;background:#fff;color:#98a2b3;font-weight:850}.cue button:after{content:attr(data-label);margin-left:7px}.cue button.next{background:var(--ps);color:var(--p);cursor:pointer}.cue button.done{background:var(--oks);color:var(--ok);border-color:#a7dec1}.cue button.current{background:var(--p);color:#fff;box-shadow:0 0 0 4px rgba(21,94,239,.12)}.cue button:disabled{opacity:1}.hint{margin-top:28px;padding:14px 16px;border-radius:14px;background:var(--ps);color:#344054;line-height:1.55}nav{position:sticky;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;padding:14px 0;background:linear-gradient(transparent,var(--bg) 28%)}nav div{display:flex;gap:10px}nav button{min-height:46px;padding:0 18px;border:0;border-radius:12px;background:#182230;color:#fff;font-weight:850;cursor:pointer}nav button:disabled{opacity:.35}#focus{background:var(--ps);color:var(--p)}#state{color:var(--muted);font-weight:800;text-align:center}@media(max-width:700px){body{padding:13px}.card{min-height:auto;padding:25px 21px}.text{font-size:19px}nav{flex-wrap:wrap}}</style></head><body><main id="shell"><header><b>AI 시대의 데이터베이스 입문 · 발표 스크립트</b><span id="top">01 / 06</span></header><div id="cards"></div><nav><div><button id="prevPage">← 이전 장표</button><button id="nextPage">다음 장표 →</button></div><span id="state">전체 보기</span><button id="focus">장표 창 보기 ↗</button></nav></main><script>const DATA=[{"title":"AI 시대의 데이터베이스 입문","meta":"장표 1","texts":["이번 과정의 제목은 에이아이 시대의 데이터베이스 입문입니다. 포스트그레스큐엘과 에스큐엘 문법만 따로 배우는 과정이 아니라, 현실의 요구사항을 데이터 구조로 만들고 실행 결과로 검증하는 전체 흐름을 배웁니다.","에이아이가 에스큐엘을 빠르게 만들어 주는 시대에도 데이터베이스 지식은 더 중요해졌습니다. 에스큐엘이 실행되었다는 사실만으로는 그 숫자가 업무 질문에 맞는지, 데이터가 안전하게 저장되는지 판단할 수 없기 때문입니다.","이 과정에서는 챗지피티와 코덱스를 설계와 에스큐엘 초안을 만드는 도구로 활용합니다. 다만 최종 판단은 사람이 요구사항, 실제 데이터 구조, 테스트 결과와 변경 내용을 확인한 뒤 내립니다.","기초 개념부터 프로젝트까지 같은 원칙을 반복합니다. 에이아이는 속도를 높이고, 사람은 데이터의 의미와 실행 증거를 책임진다는 원칙입니다."],"labels":["핵심 질문","학습 범위","AI 협업 원칙","프로젝트 흐름"]},{"title":"이 과정에서 배우는 네 가지 능력","meta":"장표 2","texts":["첫 번째 능력은 현실의 업무를 데이터로 구조화하는 능력입니다. 사용자, 강의, 주문과 질문 같은 대상을 테이블로 만들고 서로의 관계를 표현합니다.","두 번째는 정확한 에스큐엘을 작성하고 검증하는 능력입니다. 문법 오류가 없는 에스큐엘과 실제 질문에 맞는 에스큐엘은 다를 수 있으므로, 포함 범위와 중복, 널과 집계 기준을 확인합니다.","세 번째는 데이터를 안정적으로 운영하는 능력입니다. 트랜잭션으로 여러 변경을 하나의 작업으로 처리하고, 인덱스와 실행 계획으로 성능을 검증하며 권한과 백업으로 데이터를 보호합니다.","네 번째는 에이아이가 만든 결과를 검증하는 능력입니다. 자연스러운 설명이나 실행 성공만 믿지 않고 이알디, 디디엘, 에스큐엘, 메타데이터와 실패 테스트를 함께 확인합니다.","전체 학습은 업무 질문에서 시작해 요구사항, 이알디, 테이블과 에스큐엘, 검증과 운영, 분석과 에이아이 활용으로 이어집니다. 각 단계가 끊기지 않도록 연결하는 것이 이 과정의 핵심입니다."],"labels":["데이터 구조화","정확한 SQL","안정적인 운영","AI 결과 검증","전체 학습 흐름"]},{"title":"학습 로드맵 ① 기초에서 설계까지","meta":"장표 3","texts":["첫 번째 단계에서는 데이터베이스를 왜 배워야 하는지 이해하고 데이터, 테이블과 디비엠에스의 기본 개념을 익힙니다. 이후 포스트그레스큐엘과 디비버 환경을 준비하고 기본 에스큐엘을 직접 실행합니다.","두 번째 단계에서는 요구사항을 엔터티와 관계로 바꾸고 이알디를 작성합니다. 정규화와 무결성 규칙을 적용한 뒤 온라인 강의 수강신청 데이터베이스로 설계와 구현을 연결합니다.","이 구간을 마치면 단순히 테이블을 만드는 것을 넘어, 각 테이블의 한 행이 무엇을 의미하고 기본키와 외래키가 왜 필요한지 설명할 수 있어야 합니다."],"labels":["기초·환경 단계","설계·프로젝트 단계","전반부 도달 목표"]},{"title":"학습 로드맵 ② 운영에서 AI 검증까지","meta":"장표 4","texts":["세 번째 단계에서는 조인과 집계로 서비스 질문에 답하고, 트랜잭션으로 데이터 정합성을 지킵니다. 실행 계획을 통해 인덱스의 효과를 확인하며 보안, 백업과 복구까지 운영 범위를 확장합니다.","또한 모든 데이터를 같은 방식으로 저장하는 것이 아니라 조회 패턴과 원본의 책임을 기준으로 알디비엠에스, 제이슨비와 노에스큐엘 후보를 비교합니다. 이어서 에이아이가 만든 설계와 에스큐엘을 실행 증거로 검증하고 에스큐엘 분석을 파이썬으로 확장합니다.","마지막에는 설계, 구현, 검증, 성능, 보안, 복구와 분석을 하나의 종합 프로젝트로 통합합니다. 총 열다섯 개 장이 하나의 재현 가능한 프로젝트 완성을 향해 이어집니다."],"labels":["조회·운영 단계","AI·분석 확장 단계","후반부 도달 목표"]},{"title":"프로젝트를 통해 어떻게 성장하는가","meta":"장표 5","texts":["첫 번째 프로젝트는 온라인 강의 수강신청 데이터베이스입니다. 학생, 강사, 강의와 수강신청의 관계를 정의하고 전용 스키마, 샘플 데이터, 변경 시나리오와 자동 검증을 완성합니다.","챕터 13에서는 에이아이가 제안한 설계와 에스큐엘을 검토합니다. 요구사항과 미확정 정책을 먼저 구분하고 격리된 환경에서 정상값, 경계값과 실패 사례를 실행한 뒤 메타데이터와 변경 차이를 확인합니다.","마지막 프로젝트는 에이아이 튜터링 질문 관리 서비스입니다. 질문과 답변, 학습 자료 관계를 설계하고 트랜잭션, 인덱스, 권한, 에스큐엘과 판다스 분석, 백업과 별도 데이터베이스 복원까지 통합합니다.","프로젝트 완료의 기준은 파일을 작성했다는 사실이 아닙니다. 다른 사람이 같은 순서로 실행하여 같은 구조와 데이터를 만들고, 설계 선택과 검증 결과를 설명할 수 있어야 합니다."],"labels":["수강신청 프로젝트","AI 검증 프로젝트","종합 프로젝트","프로젝트 완료 기준"]},{"title":"과정을 마치면 완성하는 결과물","meta":"장표 6","texts":["과정을 마치면 요구사항과 정책 문서, 이알디, 포스트그레스큐엘 디디엘, 샘플 데이터, 검증 에스큐엘, 트랜잭션과 오류 테스트, 인덱스 검증, 보안과 복구 절차, 분석 결과와 에이아이 검토 보고서를 완성하게 됩니다.","더 중요한 결과는 설명하고 판단하는 능력입니다. 각 테이블의 한 행 의미, 키와 관계의 이유, 에스큐엘 결과가 업무 질문과 일치하는지, 오류를 어떻게 차단하고 에이아이 설계를 어떤 근거로 승인했는지를 설명할 수 있어야 합니다.","좋은 데이터베이스 프로젝트는 많은 기술을 나열한 프로젝트가 아닙니다. 요구사항, 실제 데이터베이스 구조, 실행 결과, 분석과 복구 절차가 서로 연결되고 다시 실행될 수 있는 프로젝트입니다. 이제 챕터 01부터 이 흐름을 시작하겠습니다."],"labels":["실무 산출물","설명·판단 능력","최종 프로젝트 원칙"]}],CH='ai-database-course-overview-sync',C=document.getElementById('cards');C.innerHTML=DATA.map((d,i)=>`<section class="card"><h1>${d.title}</h1><p class="meta">${d.meta} · 파란 버튼은 부모 장표의 다음 버튼과 동일하게 동작합니다.</p>${d.texts.map((t,j)=>`<div class="text"><p>${t}</p></div><div class="cue"><span class="line"></span><button data-step="${j+1}" data-label="${d.labels[j]}">▶</button><span class="line"></span></div>`).join('')}<div class="hint">스크립트를 읽은 뒤 파란 버튼을 누르면 부모 장표가 한 단계씩 진행됩니다.</div></section>`).join('');const cards=[...document.querySelectorAll('.card')],PP=document.getElementById('prevPage'),NP=document.getElementById('nextPage'),TOP=document.getElementById('top'),STATE=document.getElementById('state');let si=0,step=0,parentWin=window.opener&&!window.opener.closed?window.opener:null;const max=(i=si)=>DATA[i].texts.length;function send(type,extra={}){if(!parentWin||parentWin.closed)return false;parentWin.postMessage({channel:CH,type,...extra},'*');return true}function sync(){send('navigate-presentation',{slideIndex:si,stepIndex:step})}function show(a,b=0,opt={}){let old=si;si=Math.max(0,Math.min(cards.length-1,+a||0));step=Math.max(0,Math.min(max(si),+b||0));cards.forEach((x,i)=>x.classList.toggle('active',i===si));let page=String(si+1).padStart(2,'0');TOP.textContent=page+' / 06';STATE.textContent=step?'강조 '+step+' / '+max():'전체 보기';PP.disabled=si===0;NP.disabled=si===cards.length-1;cards[si].querySelectorAll('button[data-step]').forEach(b=>{let t=+b.dataset.step;b.classList.toggle('current',t===step&&step>0);b.classList.toggle('done',t<step);b.classList.toggle('next',t===step+1);b.disabled=t!==step+1});if(opt.hash!==false)history.replaceState(null,'','#'+(si+1));if(opt.notify!==false)sync();if(old!==si)scrollTo({top:0,behavior:'smooth'})}function localNext(){step<max()?show(si,step+1):si<cards.length-1&&show(si+1,0)}function localPrev(){step>0?show(si,step-1):si>0&&show(si-1,max(si-1))}function request(type,local){send(type)||local()}window.setScriptState=(a,b=0)=>show(a,b,{notify:false});C.onclick=e=>{let b=e.target.closest('button.next');if(b)request('request-next',localNext)};addEventListener('message',e=>{let d=e.data||{};if(d.channel!==CH)return;if(e.source&&!e.source.closed)parentWin=e.source;if(d.type==='presentation-state')show(d.slideIndex,d.stepIndex,{notify:false})});PP.onclick=()=>show(si-1,0);NP.onclick=()=>show(si+1,0);document.getElementById('focus').onclick=()=>{if(parentWin&&!parentWin.closed){parentWin.focus();sync();return}parentWin=window.open('course_overview.html#'+(si+1),'aiDatabaseCourseOverviewSlides');setTimeout(sync,400)};addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();request('request-next',localNext)}else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();request('request-prev',localPrev)}});show((parseInt(location.hash.slice(1))||1)-1,0,{notify:false,hash:false});if(parentWin){send('script-ready');setTimeout(sync,250)};</script><script src="common/tts_pronunciation.js"></script>
</body></html>
