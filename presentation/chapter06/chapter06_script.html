<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chapter 06 발표 스크립트</title>
<style>
:root{--bg:#eef2f6;--surface:#fff;--text:#182230;--muted:#667085;--primary:#155eef;--primary-soft:#e8f0ff;--border:#d9e1ea;--success:#138a55;--success-soft:#e9f8f0}
*{box-sizing:border-box}html,body{min-height:100%;margin:0;font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text)}body{padding:22px}.shell{max-width:960px;margin:0 auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:15px;color:var(--muted);font-size:15px;font-weight:850}.topbar b{color:var(--primary)}.block-switch{display:flex;gap:7px}.block-switch button{min-height:34px;padding:0 12px;border:1px solid var(--border);border-radius:999px;background:#fff;color:var(--muted);font-weight:850;cursor:pointer}.block-switch button.active{border-color:#9bb7ff;background:var(--primary-soft);color:var(--primary)}.card{min-height:650px;padding:31px 35px;border:1px solid var(--border);border-radius:22px;background:var(--surface);box-shadow:0 12px 28px rgba(24,34,48,.08)}h1{margin:0 0 8px;font-size:29px;line-height:1.3;letter-spacing:-.03em}.meta{margin:0 0 24px;color:var(--muted);font-size:15px}.script-text{font-size:21px;line-height:1.82;letter-spacing:-.012em}.script-text p{margin:0 0 18px}.cue{display:flex;align-items:center;gap:12px;margin:2px 0 20px;padding:9px 11px;border:1px dashed #bcc8d8;border-radius:14px;background:#f8fafc}.line{flex:1;height:1px;background:#d7dee8}.cue-button{min-height:38px;padding:0 14px;border:1px solid #b8c8f5;border-radius:999px;background:#fff;color:#98a2b3;font-weight:850}.cue-button.next{background:var(--primary-soft);color:var(--primary);cursor:pointer}.cue-button.done{background:var(--success-soft);color:var(--success);border-color:#a7dec1}.cue-button.current{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 0 0 4px rgba(21,94,239,.12)}.cue-button:disabled{opacity:1}.hint{margin-top:25px;padding:14px 16px;border-radius:14px;background:var(--primary-soft);color:#344054;font-size:15px;line-height:1.55}.nav{position:sticky;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:17px;padding:14px 0 2px;background:linear-gradient(180deg,rgba(238,242,246,0),var(--bg) 28%)}.nav-group{display:flex;gap:9px}.nav button{min-height:45px;padding:0 17px;border:0;border-radius:12px;background:#182230;color:#fff;font-weight:850;cursor:pointer}.nav button:disabled{opacity:.35;cursor:default}#focusSlides{background:var(--primary-soft);color:var(--primary)}.state-wrap{text-align:center;color:var(--muted);font-weight:800}#state{display:block;margin-top:4px;font-size:13px}.loading{padding:80px 20px;text-align:center;color:var(--muted);font-size:20px;font-weight:800}@media(max-width:720px){body{padding:12px}.topbar{align-items:flex-start;flex-direction:column}.card{min-height:auto;padding:24px 20px}.script-text{font-size:19px}.nav{flex-wrap:wrap}}
</style>
</head>
<body>
<main class="shell">
  <div class="topbar"><div><b>Chapter 06 · 발표 스크립트</b><span id="topCounter" style="margin-left:10px">01 / 01</span></div><div class="block-switch"><button id="theoryBlock" type="button">이론</button><button id="practiceBlock" type="button">실습</button></div></div>
  <section class="card" id="card"><div class="loading">스크립트 데이터를 불러오는 중입니다.</div></section>
  <nav class="nav"><div class="nav-group"><button id="prevPage" type="button">← 이전 장표</button><button id="nextPage" type="button">다음 장표 →</button></div><div class="state-wrap"><span id="counter">01 / 01</span><span id="state">전체 보기</span></div><button id="focusSlides" type="button">장표 창 보기 ↗</button></nav>
</main>
<script>
(() => {
  const CHANNEL = 'chapter06-presentation-sync';
  const card = document.getElementById('card');
  const params = new URLSearchParams(location.search);
  let block = params.get('block') === 'practice' ? 'practice' : 'theory';
  let slides = [], slideIndex = 0, stepIndex = 0;
  let presentationWindow = window.opener && !window.opener.closed ? window.opener : null;

  const sources = {
    theory: ['chapter06_theory_slides.js', 'chapter06_theory_patch.js'],
    practice: ['chapter06_practice_slides.js', 'chapter06_practice_patch.js']
  };

  const escapeHtml = value => String(value || '').replace(/[&<>"']/g, character => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[character]));
  const ttsRules = [
    [/\bPRIMARY KEY\b/g,'프라이머리 키'],[/\bFOREIGN KEY\b/g,'포린 키'],[/\bNOT NULL\b/g,'낫 널'],
    [/\bUNIQUE\b/g,'유니크'],[/\bCHECK\b/g,'체크'],[/\bREFERENCES\b/g,'레퍼런시스'],
    [/\bON DELETE\b/g,'온 딜리트'],[/\bCASCADE\b/g,'캐스케이드'],[/\bRESTRICT\b/g,'리스트릭트'],
    [/\bDEFAULT\b/g,'디폴트'],[/\bPostgreSQL\b/g,'포스트그레스큐엘'],[/\bSQL\b/g,'에스큐엘'],
    [/\bDDL\b/g,'디디엘'],[/\bPK\b/g,'피케이'],[/\bFK\b/g,'에프케이'],[/\bNULL\b/g,'널'],
    [/\b1NF\b/g,'제일 정규형'],[/\b2NF\b/g,'제이 정규형'],[/\b3NF\b/g,'제삼 정규형']
  ];
  const ttsText = value => ttsRules.reduce((result,[pattern,replacement]) => result.replace(pattern,replacement), String(value || ''));

  function segments(index = slideIndex) {
    const paragraphs = String(slides[index]?.s || '').trim().split(/\n\s*\n/).map(value => value.replace(/\s+/g,' ').trim()).filter(Boolean);
    if (paragraphs.length > 1) return paragraphs;
    const sentences = (paragraphs[0]?.match(/[^.!?。]+[.!?。]?/g) || []).map(value => value.trim()).filter(Boolean);
    if (sentences.length <= 1) return paragraphs.length ? paragraphs : ['핵심 내용을 설명합니다.'];
    const size = Math.max(1, Math.ceil(sentences.length / 4));
    const result = [];
    for (let cursor = 0; cursor < sentences.length; cursor += size) result.push(sentences.slice(cursor, cursor + size).join(' '));
    return result;
  }

  const maxStep = (index = slideIndex) => Number(slides[index]?.steps || segments(index).length || 1);
  const loadScript = src => new Promise((resolve,reject) => { const script=document.createElement('script'); script.src=src; script.onload=resolve; script.onerror=reject; document.head.appendChild(script); });

  async function loadBlock(target,{ preserve=false }={}) {
    block = target === 'practice' ? 'practice' : 'theory';
    window.CH6_SLIDES = undefined;
    window.CH6_TITLE = undefined;
    for (const src of sources[block]) await loadScript(src);
    slides = window.CH6_SLIDES || [];
    if (!preserve) { slideIndex = 0; stepIndex = 0; }
    slideIndex = Math.max(0, Math.min(slides.length - 1, slideIndex));
    stepIndex = Math.max(0, Math.min(maxStep(slideIndex), stepIndex));
    render();
  }

  function parseHash() {
    const raw = location.hash.slice(1);
    if (!raw) return { slideIndex:0, stepIndex:0 };
    if (/^\d+$/.test(raw)) return { slideIndex:Math.max(0,Number(raw)-1), stepIndex:0 };
    const [hashBlock,slide,step] = raw.split('/');
    if (hashBlock === 'theory' || hashBlock === 'practice') block = hashBlock;
    return { slideIndex:Math.max(0,(Number(slide)||1)-1), stepIndex:Math.max(0,Number(step)||0) };
  }

  function send(type,extra={}) {
    if (!presentationWindow || presentationWindow.closed) return false;
    try { presentationWindow.postMessage({ channel:CHANNEL,type,block,...extra }, '*'); return true; } catch (error) { return false; }
  }
  const sendState = () => send('navigate-presentation',{ slideIndex,stepIndex });
  const presentationFile = () => block === 'practice' ? 'chapter06_practice_presentation.html' : 'chapter06_theory_presentation.html';
  function requestNext() { if (send('request-next')) return; localNext(); }
  function requestPrevious() { if (send('request-prev')) return; localPrevious(); }

  function render() {
    const slide = slides[slideIndex];
    if (!slide) return;
    const parts = segments();
    const page = String(slideIndex + 1).padStart(2,'0');
    const total = String(slides.length).padStart(2,'0');
    document.getElementById('topCounter').textContent = `${page} / ${total}`;
    document.getElementById('counter').textContent = `${page} / ${total}`;
    document.getElementById('state').textContent = stepIndex === 0 ? '전체 보기' : `강조 ${stepIndex} / ${maxStep()}`;
    document.getElementById('prevPage').disabled = slideIndex === 0;
    document.getElementById('nextPage').disabled = slideIndex === slides.length - 1;
    document.getElementById('theoryBlock').classList.toggle('active',block === 'theory');
    document.getElementById('practiceBlock').classList.toggle('active',block === 'practice');
    card.innerHTML = `<h1>${escapeHtml(slide.t || slide.l || '핵심 내용')}</h1><p class="meta">${escapeHtml(slide.k || 'CHAPTER 06')} · ${block === 'practice' ? '실습 강의' : '이론 강의'} · 파란 버튼은 장표 창의 다음 강조와 같습니다.</p>${parts.map((text,index) => `<div class="script-text"><p>${escapeHtml(ttsText(text))}</p></div><div class="cue"><span class="line"></span><button class="cue-button" type="button" data-step="${index + 1}">${index + 1}단계 진행</button><span class="line"></span></div>`).join('')}<div class="hint">정규화·제약조건 설명 순서와 장표 강조 단계가 양방향으로 동기화됩니다.</div>`;
    card.querySelectorAll('.cue-button').forEach(button => {
      const target = Number(button.dataset.step);
      button.classList.toggle('done',target < stepIndex);
      button.classList.toggle('current',target === stepIndex && stepIndex > 0);
      button.classList.toggle('next',target === stepIndex + 1);
      button.disabled = target !== stepIndex + 1;
      button.onclick = requestNext;
    });
    history.replaceState(null,'',`?block=${block}#${block}/${slideIndex + 1}/${stepIndex}`);
  }

  function showState(newBlock,newSlide,newStep=0,{ notify=true }={}) {
    if (newBlock && newBlock !== block) { loadBlock(newBlock).then(() => showState(newBlock,newSlide,newStep,{ notify })); return; }
    slideIndex = Math.max(0, Math.min(slides.length - 1, Number(newSlide) || 0));
    stepIndex = Math.max(0, Math.min(maxStep(slideIndex), Number(newStep) || 0));
    render();
    if (notify) sendState();
    scrollTo({ top:0, behavior:'smooth' });
  }

  function localNext() { if (stepIndex < maxStep()) showState(block,slideIndex,stepIndex + 1); else if (slideIndex < slides.length - 1) showState(block,slideIndex + 1,0); }
  function localPrevious() { if (stepIndex > 0) showState(block,slideIndex,stepIndex - 1); else if (slideIndex > 0) showState(block,slideIndex - 1,maxStep(slideIndex - 1)); }

  window.setScriptState = (newBlock,newSlide,newStep=0) => showState(newBlock,newSlide,newStep,{ notify:false });
  addEventListener('message',event => {
    const data = event.data || {};
    if (data.channel !== CHANNEL) return;
    if (event.source && !event.source.closed) presentationWindow = event.source;
    if (data.type === 'presentation-state') showState(data.block || block,data.slideIndex,data.stepIndex,{ notify:false });
  });

  document.getElementById('prevPage').onclick = () => showState(block,slideIndex - 1,0);
  document.getElementById('nextPage').onclick = () => showState(block,slideIndex + 1,0);
  document.getElementById('focusSlides').onclick = () => {
    if (presentationWindow && !presentationWindow.closed) { presentationWindow.focus(); sendState(); return; }
    presentationWindow = window.open(`${presentationFile()}#${block}/${slideIndex + 1}/${stepIndex}`,'chapter06Presentation');
    if (presentationWindow) { presentationWindow.focus(); setTimeout(sendState,400); }
  };

  async function switchBlock(target) {
    if (target === block) return;
    presentationWindow = window.open(`${target === 'practice' ? 'chapter06_practice_presentation.html' : 'chapter06_theory_presentation.html'}#${target}/1/0`,'chapter06Presentation');
    await loadBlock(target);
    setTimeout(sendState,450);
  }
  document.getElementById('theoryBlock').onclick = () => switchBlock('theory');
  document.getElementById('practiceBlock').onclick = () => switchBlock('practice');

  addEventListener('keydown',event => {
    if (['ArrowRight','ArrowDown','PageDown',' '].includes(event.key)) { event.preventDefault(); requestNext(); }
    else if (['ArrowLeft','ArrowUp','PageUp'].includes(event.key)) { event.preventDefault(); requestPrevious(); }
    else if (event.key === 'Home') showState(block,0,0);
    else if (event.key === 'End') showState(block,slides.length - 1,maxStep(slides.length - 1));
  });

  const initial = parseHash();
  slideIndex = initial.slideIndex;
  stepIndex = initial.stepIndex;
  loadBlock(block,{ preserve:true }).then(() => {
    if (presentationWindow && !presentationWindow.closed) {
      presentationWindow.postMessage({ channel:CHANNEL,type:'script-ready',block },'*');
      setTimeout(sendState,250);
    }
  }).catch(error => {
    console.error(error);
    card.innerHTML = '<div class="loading">Chapter 06 스크립트를 불러오지 못했습니다.</div>';
  });
})();
</script>
</body>
</html>
