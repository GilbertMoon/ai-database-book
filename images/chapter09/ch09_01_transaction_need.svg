<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">트랜잭션이 필요한 이유</title>
  <desc id="desc">수강신청, 결제 기록, 좌석 차감이 하나의 업무 단위이며 일부만 성공하면 정합성이 깨지는 이유를 보여 준다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <style>.ko { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #1f2937; }
.mono { font-family: Consolas, D2Coding, "Courier New", monospace; fill: #1f2937; }
.title { font-size: 28px; font-weight: 700; }
.subtitle { font-size: 15px; fill: #4b5563; }
.box-title { font-size: 18px; font-weight: 700; }
.body { font-size: 14px; }
.small { font-size: 12.5px; fill: #4b5563; }
.card { stroke: #64748b; stroke-width: 1.8; rx: 14; ry: 14; }
.start { fill: #eaf3ff; }
.work { fill: #eef5ff; }
.review { fill: #fff6d8; }
.ok { fill: #eaf8ee; }
.fail { fill: #ffeaea; }
.rule { fill: #f2ecff; }
.lock { fill: #fff0d9; }
.line { stroke: #475569; stroke-width: 2.2; fill: none; }
.dash { stroke: #b45309; stroke-width: 2.2; stroke-dasharray: 7 6; fill: none; }
.retry { stroke: #b91c1c; stroke-width: 2.2; stroke-dasharray: 7 6; fill: none; }</style>
  </defs>
  <rect x="0" y="0" width="1200" height="600" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" class="ko title">
    <tspan x="600" dy="0">트랜잭션이 필요한 이유</tspan>
  </text>
  <text x="600" y="70" text-anchor="middle" class="ko subtitle">
    <tspan x="600" dy="0">수강신청·결제·좌석 변경은 하나의 업무 결과를 구성합니다.</tspan>
  </text>
  <rect x="440" y="105" width="320" height="70" rx="14" ry="14" class="card start"/>
  <text x="600" y="147" text-anchor="middle" class="ko box-title">
    <tspan x="600" dy="0">수강신청 확정</tspan>
  </text>
  <rect x="70" y="235" width="270" height="105" rx="14" ry="14" class="card work"/>
  <text x="205" y="270" text-anchor="middle" class="ko box-title">
    <tspan x="205" dy="0">수강신청 저장</tspan>
  </text>
  <text x="205" y="305" text-anchor="middle" class="mono body">
    <tspan x="205" dy="0">enrollments</tspan>
  </text>
  <rect x="465" y="235" width="270" height="105" rx="14" ry="14" class="card work"/>
  <text x="600" y="270" text-anchor="middle" class="ko box-title">
    <tspan x="600" dy="0">결제 기록 저장</tspan>
  </text>
  <text x="600" y="305" text-anchor="middle" class="mono body">
    <tspan x="600" dy="0">payments</tspan>
  </text>
  <rect x="860" y="235" width="270" height="105" rx="14" ry="14" class="card work"/>
  <text x="995" y="270" text-anchor="middle" class="ko box-title">
    <tspan x="995" dy="0">잔여 좌석 차감</tspan>
  </text>
  <text x="995" y="305" text-anchor="middle" class="mono body">
    <tspan x="995" dy="0">courses</tspan>
  </text>
  <line x1="520" y1="175" x2="205" y2="235" class="line" marker-end="url(#arrow)"/>
  <line x1="600" y1="175" x2="600" y2="235" class="line" marker-end="url(#arrow)"/>
  <line x1="680" y1="175" x2="995" y2="235" class="line" marker-end="url(#arrow)"/>
  <rect x="390" y="395" width="420" height="82" rx="14" ry="14" class="card fail"/>
  <text x="600" y="428" text-anchor="middle" class="ko box-title">
    <tspan x="600" dy="0">일부만 성공하면?</tspan>
  </text>
  <text x="600" y="458" text-anchor="middle" class="ko body">
    <tspan x="600" dy="0">신청·결제·좌석 상태가 서로 모순</tspan>
  </text>
  <line x1="205" y1="340" x2="505" y2="395" class="line" marker-end="url(#arrow)"/>
  <line x1="600" y1="340" x2="600" y2="395" class="line" marker-end="url(#arrow)"/>
  <line x1="995" y1="340" x2="695" y2="395" class="line" marker-end="url(#arrow)"/>
  <rect x="360" y="520" width="480" height="55" rx="14" ry="14" class="card rule"/>
  <text x="600" y="553" text-anchor="middle" class="ko box-title">
    <tspan x="600" dy="0">트랜잭션: 모두 확정 또는 모두 취소</tspan>
  </text>
  <line x1="600" y1="477" x2="600" y2="520" class="line" marker-end="url(#arrow)"/>
</svg>
