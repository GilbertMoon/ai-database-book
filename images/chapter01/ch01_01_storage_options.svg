<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">데이터 저장 방식의 선택지</title>
  <desc id="desc">파일, 스프레드시트, 데이터베이스를 비교하고 데이터베이스를 관계형 DB, NoSQL, Vector DB로 세분화한 도식</desc>
  <defs>
    <style>
      text { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #1f2937; }
      .title { font-size: 33px; font-weight: 700; fill: #0f2d5c; }
      .mainbox { fill: #24497a; stroke: #17355c; stroke-width: 2.5; }
      .maintext { fill: #ffffff; font-size: 24px; font-weight: 700; }
      .section-fill { fill: #ffffff; stroke-width: 2; }
      .header-file { fill: #e9f5ed; stroke: #2f9a58; }
      .header-sheet { fill: #e9f2fe; stroke: #3174d0; }
      .header-db { fill: #f1ecfb; stroke: #7a4bc2; }
      .panel-file { fill: #fbfefc; stroke: #72b989; }
      .panel-sheet { fill: #fbfdff; stroke: #86afea; }
      .panel-db { fill: #fdfcff; stroke: #b7a1e4; }
      .header-text-file { fill: #1f7a42; font-size: 18px; font-weight: 700; }
      .header-text-sheet { fill: #1f5fb8; font-size: 18px; font-weight: 700; }
      .header-text-db { fill: #5d36a4; font-size: 18px; font-weight: 700; }
      .section-title-file { fill: #1f7a42; font-size: 15px; font-weight: 700; }
      .section-title-sheet { fill: #1f5fb8; font-size: 15px; font-weight: 700; }
      .section-title-db { fill: #5d36a4; font-size: 15px; font-weight: 700; }
      .pill-file { fill: #eef8f1; stroke: #72b989; stroke-width: 1.5; }
      .pill-sheet { fill: #eef5ff; stroke: #86afea; stroke-width: 1.5; }
      .pill-db { fill: #f5f1fe; stroke: #b7a1e4; stroke-width: 1.5; }
      .pill-text { font-size: 14px; font-weight: 600; }
      .small { font-size: 12px; }
      .body-start { font-size: 15px; dominant-baseline: middle; }
      .subhead { font-size: 16px; font-weight: 700; fill: #422776; }
      .message-box { fill: #eef5ff; stroke: #4d86d7; stroke-width: 2.5; }
      .message-title { font-size: 22px; font-weight: 700; fill: #0f2d5c; }
      .message-text { font-size: 16px; fill: #222222; }
      .line { stroke: #17355c; stroke-width: 2.2; fill: none; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>

  <text x="600" y="54" text-anchor="middle" class="title">데이터 저장 방식의 선택지</text>

  <rect x="430" y="82" rx="14" ry="14" width="340" height="64" class="mainbox"/>
  <text x="600" y="122" text-anchor="middle" class="maintext">데이터 저장 방식</text>

  <line x1="600" y1="146" x2="600" y2="182" class="line"/>
  <line x1="170" y1="182" x2="890" y2="182" class="line"/>
  <line x1="170" y1="182" x2="170" y2="214" class="line"/>
  <line x1="450" y1="182" x2="450" y2="214" class="line"/>
  <line x1="890" y1="182" x2="890" y2="214" class="line"/>

  <rect x="75" y="214" rx="14" ry="14" width="190" height="54" class="header-file section-fill"/>
  <text x="170" y="248" text-anchor="middle" class="header-text-file">파일</text>
  <line x1="170" y1="268" x2="170" y2="304" class="line"/>

  <rect x="52" y="304" rx="14" ry="14" width="236" height="110" class="panel-file section-fill"/>
  <text x="170" y="333" text-anchor="middle" class="section-title-file">예시</text>
  <rect x="66" y="348" rx="10" ry="10" width="58" height="34" class="pill-file"/>
  <text x="95" y="370" text-anchor="middle" class="pill-text">텍스트</text>
  <rect x="141" y="348" rx="10" ry="10" width="58" height="34" class="pill-file"/>
  <text x="170" y="370" text-anchor="middle" class="pill-text">JSON</text>
  <rect x="216" y="348" rx="10" ry="10" width="58" height="34" class="pill-file"/>
  <text x="245" y="370" text-anchor="middle" class="pill-text">CSV</text>

  <rect x="52" y="438" rx="14" ry="14" width="236" height="156" class="panel-file section-fill"/>
  <text x="170" y="468" text-anchor="middle" class="section-title-file">주요 활용 예시</text>
  <text x="90" y="507" class="body-start">• 개인 메모</text>
  <text x="90" y="548" class="body-start">• 작은 설정값</text>
  <text x="90" y="589" class="body-start">• 데이터 교환</text>

  <rect x="355" y="214" rx="14" ry="14" width="190" height="54" class="header-sheet section-fill"/>
  <text x="450" y="248" text-anchor="middle" class="header-text-sheet">스프레드시트</text>
  <line x1="450" y1="268" x2="450" y2="304" class="line"/>

  <rect x="332" y="304" rx="14" ry="14" width="236" height="110" class="panel-sheet section-fill"/>
  <text x="450" y="333" text-anchor="middle" class="section-title-sheet">예시</text>
  <rect x="346" y="348" rx="10" ry="10" width="70" height="34" class="pill-sheet"/>
  <text x="381" y="370" text-anchor="middle" class="pill-text">엑셀</text>
  <rect x="430" y="348" rx="10" ry="10" width="124" height="34" class="pill-sheet"/>
  <text x="492" y="370" text-anchor="middle" class="pill-text">구글 스프레드시트</text>

  <rect x="332" y="438" rx="14" ry="14" width="236" height="156" class="panel-sheet section-fill"/>
  <text x="450" y="468" text-anchor="middle" class="section-title-sheet">주요 활용 예시</text>
  <text x="370" y="517" class="body-start">• 소규모 명단</text>
  <text x="370" y="560" class="body-start">• 공유 목록</text>

  <rect x="735" y="214" rx="14" ry="14" width="310" height="54" class="header-db section-fill"/>
  <text x="890" y="248" text-anchor="middle" class="header-text-db">데이터베이스</text>
  <line x1="890" y1="268" x2="890" y2="292" class="line"/>
  <line x1="690" y1="292" x2="1090" y2="292" class="line"/>
  <line x1="690" y1="292" x2="690" y2="320" class="line"/>
  <line x1="890" y1="292" x2="890" y2="320" class="line"/>
  <line x1="1090" y1="292" x2="1090" y2="320" class="line"/>

  <rect x="620" y="320" rx="12" ry="12" width="140" height="46" class="header-db section-fill"/>
  <text x="690" y="349" text-anchor="middle" class="subhead">관계형 DB</text>
  <rect x="605" y="382" rx="14" ry="14" width="170" height="118" class="panel-db section-fill"/>
  <text x="690" y="411" text-anchor="middle" class="section-title-db">예시</text>
  <rect x="626" y="428" rx="10" ry="10" width="128" height="34" class="pill-db"/>
  <text x="690" y="450" text-anchor="middle" class="pill-text">PostgreSQL</text>
  <rect x="626" y="468" rx="10" ry="10" width="128" height="34" class="pill-db"/>
  <text x="690" y="490" text-anchor="middle" class="pill-text">MySQL</text>
  <rect x="605" y="518" rx="14" ry="14" width="170" height="76" class="panel-db section-fill"/>
  <text x="690" y="547" text-anchor="middle" class="section-title-db">주요 활용 예시</text>
  <text x="626" y="574" class="small">수강신청 · 주문 · 결제</text>

  <rect x="820" y="320" rx="12" ry="12" width="140" height="46" class="header-db section-fill"/>
  <text x="890" y="349" text-anchor="middle" class="subhead">NoSQL</text>
  <rect x="805" y="382" rx="14" ry="14" width="170" height="118" class="panel-db section-fill"/>
  <text x="890" y="411" text-anchor="middle" class="section-title-db">예시</text>
  <rect x="826" y="428" rx="10" ry="10" width="128" height="34" class="pill-db"/>
  <text x="890" y="450" text-anchor="middle" class="pill-text">Redis</text>
  <rect x="826" y="468" rx="10" ry="10" width="128" height="34" class="pill-db"/>
  <text x="890" y="490" text-anchor="middle" class="pill-text">MongoDB</text>
  <rect x="805" y="518" rx="14" ry="14" width="170" height="76" class="panel-db section-fill"/>
  <text x="890" y="547" text-anchor="middle" class="section-title-db">주요 활용 예시</text>
  <text x="840" y="574" class="small">캐시 · 세션</text>
  <text x="840" y="590" class="small">문서형 데이터</text>

  <rect x="1020" y="320" rx="12" ry="12" width="140" height="46" class="header-db section-fill"/>
  <text x="1090" y="349" text-anchor="middle" class="subhead">Vector DB</text>
  <rect x="1005" y="382" rx="14" ry="14" width="170" height="118" class="panel-db section-fill"/>
  <text x="1090" y="411" text-anchor="middle" class="section-title-db">예시</text>
  <rect x="1026" y="428" rx="10" ry="10" width="128" height="34" class="pill-db"/>
  <text x="1090" y="450" text-anchor="middle" class="pill-text">pgvector</text>
  <rect x="1026" y="468" rx="10" ry="10" width="128" height="34" class="pill-db"/>
  <text x="1090" y="490" text-anchor="middle" class="pill-text">Chroma</text>
  <rect x="1005" y="518" rx="14" ry="14" width="170" height="76" class="panel-db section-fill"/>
  <text x="1090" y="547" text-anchor="middle" class="section-title-db">주요 활용 예시</text>
  <text x="1043" y="574" class="small">의미 검색</text>
  <text x="1043" y="590" class="small">RAG</text>

  <rect x="70" y="628" rx="18" ry="18" width="1060" height="100" class="message-box"/>
  <text x="600" y="666" text-anchor="middle" class="message-title">핵심 메시지</text>
  <text x="600" y="696" text-anchor="middle" class="message-text">작고 단순한 데이터는 파일이나 엑셀로도 충분할 수 있다.</text>
  <text x="600" y="719" text-anchor="middle" class="message-text">관계 · 정확성 · 동시성 · 검색이 중요해질수록 데이터베이스가 필요하다.</text>
</svg>
