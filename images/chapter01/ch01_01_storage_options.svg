<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">데이터 저장 방식 선택 흐름</title>
  <desc id="desc">작고 단순한 데이터인지, 한 사람이 주로 관리하는지, 사람이 표를 직접 편집하고 계산하는지를 기준으로 파일, 스프레드시트, 데이터베이스를 고르는 선택 흐름도</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#475569"/></marker>
    <style>
      text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#172033}
      .title{font-size:30px;font-weight:700;text-anchor:middle;fill:#0f2d5c}
      .q{fill:#f8fafc;stroke:#64748b;stroke-width:2.2}.file{fill:#eef9f1;stroke:#2f9a58;stroke-width:2.4}.sheet{fill:#eef5ff;stroke:#3b82f6;stroke-width:2.4}.db{fill:#f5f0ff;stroke:#7c4dcb;stroke-width:2.4}
      .note{fill:#fbf8ff;stroke:#b7a1e4;stroke-width:1.8}.msg{fill:#eef5ff;stroke:#4d86d7;stroke-width:2.2}
      .head{font-size:21px;font-weight:700;text-anchor:middle}.body{font-size:16px;text-anchor:middle;fill:#334155}.result{font-size:24px;font-weight:700;text-anchor:middle}
      .file-t{fill:#1f7a42}.sheet-t{fill:#1f5fb8}.db-t{fill:#5b34a2}.label{font-size:15px;font-weight:700;text-anchor:middle;fill:#334155}.kw{font-size:15px;font-weight:700;text-anchor:middle;fill:#5b34a2}.msgtext{font-size:16px;font-weight:700;text-anchor:middle;fill:#0f2d5c}
      .line{stroke:#475569;stroke-width:2.3;fill:none;stroke-linecap:round;marker-end:url(#arrow)}.plain{stroke:#475569;stroke-width:2.3;fill:none;stroke-linecap:round}
    </style>
  </defs>
  <rect width="1200" height="675" fill="#fff"/>
  <text x="600" y="48" class="title">데이터 저장 방식 선택 흐름</text>

  <rect x="410" y="78" width="380" height="80" rx="16" class="q"/>
  <text x="600" y="110" class="head">작고 단순한 데이터인가?</text>
  <text x="600" y="136" class="body">관계가 거의 없고 변경도 많지 않은가?</text>

  <line x1="600" y1="158" x2="600" y2="190" class="plain"/>
  <line x1="290" y1="190" x2="910" y2="190" class="plain"/>
  <line x1="290" y1="190" x2="290" y2="226" class="line"/>
  <line x1="910" y1="190" x2="910" y2="226" class="line"/>
  <text x="260" y="181" class="label">예</text>
  <text x="942" y="181" class="label">아니오</text>

  <rect x="110" y="226" width="360" height="80" rx="16" class="q"/>
  <text x="290" y="258" class="head">한 사람이 주로 관리하는가?</text>
  <text x="290" y="284" class="body">개인 기록이나 작은 설정값인가?</text>

  <rect x="730" y="226" width="360" height="80" rx="16" class="q"/>
  <text x="910" y="258" class="head">사람이 표를 직접</text>
  <text x="910" y="284" class="head">편집·계산하는가?</text>

  <line x1="290" y1="306" x2="290" y2="350" class="line"/>
  <text x="262" y="334" class="label">예</text>
  <rect x="140" y="350" width="300" height="92" rx="18" class="file"/>
  <text x="290" y="386" class="result file-t">파일</text>
  <text x="290" y="415" class="body">TXT · Markdown · JSON · CSV</text>

  <path d="M380 306 V330 H555 V350" class="line"/>
  <text x="416" y="323" class="label">아니오</text>
  <rect x="470" y="350" width="300" height="92" rx="18" class="sheet"/>
  <text x="620" y="386" class="result sheet-t">스프레드시트</text>
  <text x="620" y="415" class="body">소규모 표 · 명단 · 간단한 통계</text>

  <line x1="910" y1="306" x2="910" y2="350" class="line"/>
  <text x="882" y="334" class="label">예</text>
  <rect x="800" y="350" width="300" height="92" rx="18" class="sheet"/>
  <text x="950" y="386" class="result sheet-t">스프레드시트</text>
  <text x="950" y="415" class="body">사람이 직접 관리하는 표</text>

  <path d="M1000 306 V472 H910 V504" class="line"/>
  <text x="1032" y="334" class="label">아니오</text>
  <rect x="730" y="504" width="360" height="92" rx="18" class="db"/>
  <text x="910" y="540" class="result db-t">데이터베이스</text>
  <text x="910" y="569" class="body">서비스와 여러 사용자를 위한 구조적 저장</text>

  <rect x="110" y="504" width="500" height="92" rx="16" class="note"/>
  <text x="360" y="532" class="head db-t">데이터베이스가 필요한 신호</text>
  <text x="202" y="566" class="kw">여러 사용자</text>
  <text x="298" y="566" class="kw">데이터 관계</text>
  <text x="390" y="566" class="kw">정확성</text>
  <text x="478" y="566" class="kw">동시 수정</text>
  <text x="360" y="590" class="kw">반복 검색·집계</text>

  <rect x="145" y="622" width="910" height="34" rx="16" class="msg"/>
  <text x="600" y="644" class="msgtext">상세 비교는 표에서 확인하고, 흐름도는 빠른 선택 기준으로 활용한다.</text>
</svg>
