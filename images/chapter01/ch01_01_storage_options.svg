<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <style>
      text { font-family: Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif; fill:#1a202c; }
      .title { font-size: 24px; font-weight: 700; }
      .box { fill:#f7fafc; stroke:#4a5568; stroke-width:2; rx:10; ry:10; }
      .main { fill:#ebf8ff; stroke:#2b6cb0; }
      .sub { fill:#fffaf0; stroke:#d69e2e; }
      .use { fill:#f0fff4; stroke:#38a169; }
      .cap { fill:#edf2f7; stroke:#718096; }
      .label { font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
      .small { font-size: 15px; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="600" y="40" class="title" text-anchor="middle">데이터 저장 방식의 선택지</text>

  <rect x="460" y="70" width="280" height="64" class="box main"/>
  <text x="600" y="102" class="label">데이터 저장 방식</text>

  <rect x="70" y="180" width="170" height="54" class="box"/><text x="155" y="207" class="label">파일 기반</text>
  <rect x="290" y="180" width="170" height="54" class="box"/><text x="375" y="207" class="label">표 기반</text>
  <rect x="510" y="180" width="170" height="54" class="box"/><text x="595" y="207" class="label">관계형 DB</text>
  <rect x="730" y="180" width="170" height="54" class="box"/><text x="815" y="207" class="label">NoSQL</text>
  <rect x="950" y="180" width="180" height="54" class="box"/><text x="1040" y="207" class="label">Vector DB</text>

  <line x1="600" y1="134" x2="155" y2="180" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="134" x2="375" y2="180" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="134" x2="595" y2="180" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="134" x2="815" y2="180" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="134" x2="1040" y2="180" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="300" width="90" height="42" class="box sub"/><text x="105" y="321" class="small">텍스트</text>
  <rect x="160" y="300" width="90" height="42" class="box sub"/><text x="205" y="321" class="small">JSON</text>
  <rect x="260" y="300" width="90" height="42" class="box sub"/><text x="305" y="321" class="small">CSV</text>
  <rect x="300" y="300" width="90" height="42" class="box sub"/><text x="345" y="321" class="small">엑셀</text>
  <rect x="400" y="300" width="90" height="42" class="box sub"/><text x="445" y="321" class="small">스프레드시트</text>
  <rect x="520" y="300" width="110" height="42" class="box sub"/><text x="575" y="321" class="small">PostgreSQL</text>
  <rect x="640" y="300" width="90" height="42" class="box sub"/><text x="685" y="321" class="small">MySQL</text>
  <rect x="740" y="300" width="90" height="42" class="box sub"/><text x="785" y="321" class="small">Redis</text>
  <rect x="840" y="300" width="110" height="42" class="box sub"/><text x="895" y="321" class="small">MongoDB</text>
  <rect x="960" y="300" width="90" height="42" class="box sub"/><text x="1005" y="321" class="small">pgvector</text>
  <rect x="1060" y="300" width="90" height="42" class="box sub"/><text x="1105" y="321" class="small">Chroma</text>

  <rect x="60" y="390" width="110" height="38" class="box use"/><text x="115" y="409" class="small">개인 메모</text>
  <rect x="180" y="390" width="110" height="38" class="box use"/><text x="235" y="409" class="small">작은 설정값</text>
  <rect x="300" y="390" width="110" height="38" class="box use"/><text x="355" y="409" class="small">소규모 명단</text>
  <rect x="420" y="390" width="120" height="38" class="box use"/><text x="480" y="409" class="small">공유 목록</text>
  <rect x="550" y="390" width="180" height="38" class="box use"/><text x="640" y="409" class="small">수강신청·주문·결제</text>
  <rect x="740" y="390" width="110" height="38" class="box use"/><text x="795" y="409" class="small">캐시·세션</text>
  <rect x="860" y="390" width="120" height="38" class="box use"/><text x="920" y="409" class="small">문서형 데이터</text>
  <rect x="990" y="390" width="100" height="38" class="box use"/><text x="1040" y="409" class="small">의미 검색</text>
  <rect x="1100" y="390" width="90" height="38" class="box use"/><text x="1145" y="409" class="small">RAG</text>

  <line x1="105" y1="234" x2="205" y2="300" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="375" y1="234" x2="395" y2="300" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="595" y1="234" x2="625" y2="300" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="815" y1="234" x2="845" y2="300" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1040" y1="234" x2="1050" y2="300" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="120" y="560" width="960" height="92" class="box cap"/>
  <text x="600" y="596" class="small" style="font-size:18px; font-weight:700;">핵심 메시지</text>
  <text x="600" y="626" class="small" style="font-size:17px;">작고 단순한 데이터는 파일이나 엑셀로 충분할 수 있지만,</text>
  <text x="600" y="648" class="small" style="font-size:17px;">관계·정확성·동시성·검색이 중요해질수록 데이터베이스가 필요하다.</text>
</svg>