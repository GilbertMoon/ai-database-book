<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1220" viewBox="0 0 980 1220">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <style>
      text { font-family: Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif; fill:#1a202c; }
      .title { font-size: 24px; font-weight: 700; }
      .node { fill:#f7fafc; stroke:#4a5568; stroke-width:2; rx:10; ry:10; }
      .main { fill:#ebf8ff; stroke:#2b6cb0; }
      .note { fill:#fffaf0; stroke:#d69e2e; }
      .label { font-size:18px; text-anchor:middle; dominant-baseline:middle; }
      .yn { font-size:15px; font-weight:700; fill:#2d3748; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="490" y="40" class="title" text-anchor="middle">데이터베이스 필요 여부 판단 흐름</text>

  <rect x="300" y="70" width="380" height="60" class="node main"/><text x="490" y="100" class="label">저장할 데이터가 있다</text>
  <rect x="250" y="180" width="480" height="80" class="node"/><text x="490" y="208" class="label">데이터가 작고</text><text x="490" y="235" class="label">거의 변하지 않는가?</text>
  <rect x="40" y="320" width="240" height="70" class="node note"/><text x="160" y="355" class="label">파일 / JSON / CSV 검토</text>
  <rect x="250" y="320" width="480" height="80" class="node"/><text x="490" y="348" class="label">여러 사용자가</text><text x="490" y="375" class="label">동시에 접근하는가?</text>
  <rect x="250" y="470" width="480" height="80" class="node"/><text x="490" y="498" class="label">데이터 간 관계가</text><text x="490" y="525" class="label">중요한가?</text>
  <rect x="250" y="620" width="480" height="80" class="node"/><text x="490" y="648" class="label">검색 / 집계가</text><text x="490" y="675" class="label">자주 필요한가?</text>
  <rect x="250" y="770" width="480" height="80" class="node"/><text x="490" y="798" class="label">정확성 / 복구 / 권한 관리가</text><text x="490" y="825" class="label">중요한가?</text>
  <rect x="250" y="920" width="480" height="70" class="node main"/><text x="490" y="955" class="label">데이터베이스 필요 가능성 높음</text>
  <rect x="720" y="770" width="210" height="80" class="node note"/><text x="825" y="798" class="label">파일 / 엑셀로</text><text x="825" y="825" class="label">충분할 수 있음</text>
  <rect x="160" y="1050" width="250" height="60" class="node"/><text x="285" y="1080" class="label">관계형 DB 우선 검토</text>
  <rect x="470" y="1050" width="340" height="60" class="node"/><text x="640" y="1080" class="label">의미 기반 검색도 필요한가?</text>
  <rect x="110" y="1140" width="220" height="50" class="node note"/><text x="220" y="1165" class="label">PostgreSQL</text>
  <rect x="470" y="1140" width="360" height="50" class="node note"/><text x="650" y="1165" class="label">Vector DB 또는 pgvector 검토</text>

  <line x1="490" y1="130" x2="490" y2="180" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="250" y1="220" x2="160" y2="320" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="210" y="262" class="yn">예</text>
  <line x1="490" y1="260" x2="490" y2="320" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="292" class="yn">아니오</text>
  <line x1="490" y1="400" x2="490" y2="470" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="438" class="yn">아니오</text>
  <line x1="490" y1="550" x2="490" y2="620" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="588" class="yn">아니오</text>
  <line x1="490" y1="700" x2="490" y2="770" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="738" class="yn">아니오</text>
  <line x1="730" y1="810" x2="720" y2="810" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="690" y="794" class="yn">아니오</text>
  <line x1="490" y1="850" x2="490" y2="920" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="888" class="yn">예</text>

  <polyline points="730,360 900,360 900,955 730,955" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="820" y="345" class="yn">예</text>
  <polyline points="730,510 860,510 860,955 730,955" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="495" class="yn">예</text>
  <polyline points="730,660 820,660 820,955 730,955" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="780" y="645" class="yn">예</text>

  <line x1="410" y1="990" x2="285" y2="1050" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="990" x2="640" y2="1050" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="1110" x2="640" y2="1140" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660" y="1128" class="yn">예</text>
  <line x1="470" y1="1110" x2="330" y2="1140" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="390" y="1128" class="yn">아니오</text>
</svg>