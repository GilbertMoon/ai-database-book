<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <style>
      text { font-family: Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif; fill:#1a202c; }
      .title { font-size: 24px; font-weight: 700; }
      .box { fill:#f7fafc; stroke:#4a5568; stroke-width:2; rx:10; ry:10; }
      .hint { fill:#eefdf3; stroke:#38a169; stroke-width:2; rx:10; ry:10; }
      .decision { fill:#fffaf0; stroke:#d69e2e; stroke-width:2; rx:10; ry:10; }
      .label { font-size:18px; text-anchor:middle; dominant-baseline:middle; }
      .small { font-size:15px; text-anchor:middle; dominant-baseline:middle; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="750" y="38" class="title" text-anchor="middle">AI 시대의 DB 학습 흐름</text>

  <rect x="40" y="230" width="150" height="80" class="box"/><text x="115" y="270" class="label">요구사항 읽기</text>
  <rect x="220" y="230" width="170" height="80" class="box"/><text x="305" y="258" class="label">ChatGPT로</text><text x="305" y="284" class="label">요구사항 정리</text>
  <rect x="420" y="230" width="150" height="80" class="box"/><text x="495" y="270" class="label">테이블 후보 도출</text>
  <rect x="600" y="230" width="150" height="80" class="box"/><text x="675" y="270" class="label">ERD 초안 작성</text>
  <rect x="780" y="230" width="190" height="80" class="box"/><text x="875" y="258" class="label">Codex로</text><text x="875" y="284" class="label">DDL / SQL 초안 생성</text>
  <rect x="1000" y="230" width="170" height="80" class="box"/><text x="1085" y="270" class="label">PostgreSQL에서 실행</text>
  <rect x="1200" y="230" width="160" height="80" class="box"/><text x="1280" y="258" class="label">DBeaver로</text><text x="1280" y="284" class="label">결과 확인</text>
  <rect x="1330" y="410" width="130" height="70" class="box"/><text x="1395" y="445" class="label">GitHub에 기록</text>

  <line x1="190" y1="270" x2="220" y2="270" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="390" y1="270" x2="420" y2="270" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="270" x2="600" y2="270" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="270" x2="780" y2="270" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="970" y1="270" x2="1000" y2="270" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1170" y1="270" x2="1200" y2="270" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1180" y="380" width="170" height="74" class="decision"/><text x="1265" y="417" class="label">문제 발견?</text>
  <line x1="1280" y1="310" x2="1265" y2="380" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1180" y1="417" x2="1020" y2="417" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1100" y="400" class="small">예: 수정 후 재실행</text>
  <line x1="1350" y1="417" x2="1330" y2="417" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1360" y="400" class="small">아니오</text>
  <polyline points="1020,417 1020,330 1085,330" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="220" y="90" width="200" height="70" class="hint"/><text x="320" y="118" class="small">ChatGPT</text><text x="320" y="140" class="small">개념 설명 · 요구사항 정리</text>
  <line x1="320" y1="160" x2="305" y2="230" stroke="#38a169" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="780" y="90" width="210" height="70" class="hint"/><text x="885" y="118" class="small">Codex</text><text x="885" y="140" class="small">SQL · 코드 생성 보조</text>
  <line x1="885" y1="160" x2="875" y2="230" stroke="#38a169" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1180" y="90" width="220" height="70" class="hint"/><text x="1290" y="118" class="small">DBeaver</text><text x="1290" y="140" class="small">테이블 · 데이터 직접 확인</text>
  <line x1="1290" y1="160" x2="1280" y2="230" stroke="#38a169" stroke-width="2" marker-end="url(#arrow)"/>
</svg>