<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc">
  <title id="title">AI 생성 결과 검증 사이클</title>
  <desc id="desc">요구사항과 업무 규칙을 정리해 AI 초안을 만들고, 요구사항·데이터 구조·SQL 안전성을 검토한 뒤 격리된 환경에서 실행하여 실제 결과를 확인하고, 문제 유형에 따라 수정·재검증하며 검증 근거를 기록하는 반복 흐름</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}
      .title{font-size:28px;font-weight:700;text-anchor:middle}
      .subtitle{font-size:15px;text-anchor:middle;fill:#475569}
      .stage{fill:#fff;stroke-width:1.7;rx:12}
      .request-stage{stroke:#3b82c4}.ai-stage{stroke:#d69e2e}.assumption-stage{stroke:#7c5cc4}
      .badge{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:middle}
      .badge-request{fill:#2f6fad}.badge-ai{fill:#b7791f}.badge-assumption{fill:#6b46a8}
      .stage-title{font-size:15px;font-weight:700;text-anchor:middle}
      .stage-main{font-size:13px;font-weight:600;text-anchor:middle}
      .stage-sub{font-size:12px;text-anchor:middle;fill:#475569}
      .arrow{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .feedback{stroke:#d9534f;stroke-width:2.2;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}
      .group{stroke-width:1.5;rx:16}
      .review-group{fill:#f4f8ff;stroke:#93b4e6}
      .execute-group{fill:#f8fafc;stroke:#a8b3c4}
      .group-title{font-size:18px;font-weight:700}
      .group-sub{font-size:13px;fill:#475569}
      .review-card{fill:#fff;stroke:#3b82c4;stroke-width:1.6;rx:11}
      .execute-card{fill:#fff;stroke:#64748b;stroke-width:1.6;rx:11}
      .card-no{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:middle}
      .review-no{fill:#2f6fad}.execute-no{fill:#58677b}
      .card-title{font-size:14px;font-weight:700;text-anchor:middle}
      .card-text{font-size:12.5px;text-anchor:middle;fill:#475569}
      .environment{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.6;rx:11}
      .environment-title{font-size:15px;font-weight:700;text-anchor:middle;fill:#92400e}
      .environment-sub{font-size:12.5px;text-anchor:middle;fill:#475569}
      .decision{fill:#fff8e8;stroke:#b7791f;stroke-width:1.9}
      .decision-title{font-size:17px;font-weight:700;text-anchor:middle;dominant-baseline:middle}
      .decision-sub{font-size:12.5px;text-anchor:middle;fill:#475569}
      .branch{font-size:13px;font-weight:700}
      .issue-panel{fill:#fff5f5;stroke:#d9534f;stroke-width:1.5;rx:14}
      .issue-title{font-size:16px;font-weight:700;text-anchor:middle}
      .issue-card{fill:#fff;stroke:#e58e8a;stroke-width:1.3;rx:10}
      .issue-card-title{font-size:13px;font-weight:700;text-anchor:middle}
      .issue-card-sub{font-size:11.5px;text-anchor:middle;fill:#475569}
      .success{fill:#eef7ff;stroke:#2f6fad;stroke-width:1.7;rx:12}
      .record{fill:#f2fbf5;stroke:#3c9a5f;stroke-width:1.7;rx:12}
      .result-title{font-size:16px;font-weight:700;text-anchor:middle}
      .result-sub{font-size:12.5px;text-anchor:middle;fill:#475569}
      .note{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.5;rx:11}
      .note-title{font-size:14px;font-weight:700;fill:#92400e}
      .note-text{font-size:13px;fill:#475569}
      .principle{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.6;rx:11}
      .principle-label{font-size:14px;font-weight:700;fill:#166534}
      .principle-text{font-size:16px;font-weight:700;text-anchor:middle;fill:#166534}
    </style>
  </defs>

  <rect width="1200" height="1120" fill="#fff"/>
  <text x="600" y="40" class="title">AI 생성 결과 검증 사이클</text>
  <text x="600" y="68" class="subtitle">AI가 만든 초안을 요구사항과 실제 실행 결과로 검증하고, 문제를 분류해 수정한 뒤 근거를 기록한다</text>

  <rect x="55" y="100" width="300" height="112" class="stage request-stage"/>
  <circle cx="79" cy="124" r="14" class="badge-request"/><text x="79" y="124" class="badge">1</text>
  <text x="205" y="132" class="stage-title">요구사항·업무 규칙 정리</text>
  <text x="205" y="165" class="stage-main">입력 · 출력 · 예외 · 금지 조건</text>
  <text x="205" y="190" class="stage-sub">검증 기준을 먼저 명확히 정의</text>

  <rect x="450" y="100" width="300" height="112" class="stage ai-stage"/>
  <circle cx="474" cy="124" r="14" class="badge-ai"/><text x="474" y="124" class="badge">2</text>
  <text x="600" y="132" class="stage-title">AI 초안 생성</text>
  <text x="600" y="165" class="stage-main">ERD · DDL · SQL · CRUD · 설명</text>
  <text x="600" y="190" class="stage-sub">빠르게 만든 제안이며 아직 검증되지 않음</text>

  <rect x="845" y="100" width="300" height="112" class="stage assumption-stage"/>
  <circle cx="869" cy="124" r="14" class="badge-assumption"/><text x="869" y="124" class="badge">3</text>
  <text x="995" y="132" class="stage-title">가정·생략·임의 판단 확인</text>
  <text x="995" y="165" class="stage-main">AI가 추정한 조건과 모르는 부분 표시</text>
  <text x="995" y="190" class="stage-sub">그럴듯한 표현을 사실로 간주하지 않음</text>

  <path d="M355 156H450" class="arrow"/>
  <path d="M750 156H845" class="arrow"/>
  <path d="M995 212V248H600" class="arrow"/>

  <rect x="34" y="248" width="1132" height="230" class="group review-group"/>
  <text x="58" y="279" class="group-title">4. 사람이 초안을 검토</text>
  <text x="238" y="279" class="group-sub">실행 전에 업무 불일치와 위험 요소를 먼저 찾음</text>

  <rect x="65" y="316" width="330" height="116" class="review-card"/>
  <circle cx="89" cy="340" r="14" class="review-no"/><text x="89" y="340" class="card-no">4A</text>
  <text x="230" y="348" class="card-title">요구사항 검토</text>
  <text x="230" y="380" class="card-text">누락 · 잘못 해석한 규칙 · 예외 조건</text>
  <text x="230" y="405" class="card-text">사용자 요구와 AI 제안이 일치하는가?</text>

  <rect x="435" y="316" width="330" height="116" class="review-card"/>
  <circle cx="459" cy="340" r="14" class="review-no"/><text x="459" y="340" class="card-no">4B</text>
  <text x="600" y="348" class="card-title">데이터 구조 검토</text>
  <text x="600" y="380" class="card-text">엔터티 · 관계 · PK/FK · 중복 · 확장성</text>
  <text x="600" y="405" class="card-text">데이터 의미와 업무 규칙을 구조가 지키는가?</text>

  <rect x="805" y="316" width="330" height="116" class="review-card"/>
  <circle cx="829" cy="340" r="14" class="review-no"/><text x="829" y="340" class="card-no">4C</text>
  <text x="970" y="348" class="card-title">SQL·코드 안전성 검토</text>
  <text x="970" y="380" class="card-text">데이터 손실 · 권한 · 비밀정보 · 예외 처리</text>
  <text x="970" y="405" class="card-text">운영 데이터에 직접 적용해도 안전한가?</text>

  <path d="M230 432V506H600" class="arrow"/>
  <path d="M600 432V506" class="arrow"/>
  <path d="M970 432V506H600" class="arrow"/>

  <rect x="370" y="500" width="460" height="72" class="environment"/>
  <text x="600" y="527" class="environment-title">5. 격리된 실습 환경에서 실행</text>
  <text x="600" y="553" class="environment-sub">백업 또는 재생성 가능한 테스트 DB에서 샘플 데이터로 실행하고 운영 데이터에는 바로 적용하지 않는다</text>

  <rect x="34" y="596" width="1132" height="210" class="group execute-group"/>
  <text x="58" y="627" class="group-title">6. 실행 결과 검증</text>
  <text x="222" y="627" class="group-sub">실행 성공뿐 아니라 구조와 결과가 요구사항에 맞는지 확인</text>

  <rect x="65" y="660" width="330" height="108" class="execute-card"/>
  <circle cx="89" cy="684" r="14" class="execute-no"/><text x="89" y="684" class="card-no">6A</text>
  <text x="230" y="692" class="card-title">실행 가능성</text>
  <text x="230" y="724" class="card-text">문법 오류 · 의존성 · 초기화 순서</text>
  <text x="230" y="748" class="card-text">처음부터 반복 실행할 수 있는가?</text>

  <rect x="435" y="660" width="330" height="108" class="execute-card"/>
  <circle cx="459" cy="684" r="14" class="execute-no"/><text x="459" y="684" class="card-no">6B</text>
  <text x="600" y="692" class="card-title">구조·데이터 상태</text>
  <text x="600" y="724" class="card-text">제약조건 · 샘플 데이터 · 트랜잭션</text>
  <text x="600" y="748" class="card-text">잘못된 데이터를 실제로 차단하는가?</text>

  <rect x="805" y="660" width="330" height="108" class="execute-card"/>
  <circle cx="829" cy="684" r="14" class="execute-no"/><text x="829" y="684" class="card-no">6C</text>
  <text x="970" y="692" class="card-title">예상 결과와 실제 결과</text>
  <text x="970" y="724" class="card-text">정상 · 경계 · 오류 시나리오 비교</text>
  <text x="970" y="748" class="card-text">조회 결과가 업무 의미와 일치하는가?</text>

  <path d="M600 572V596" class="arrow"/>
  <path d="M230 768V822H600" class="arrow"/>
  <path d="M600 768V822" class="arrow"/>
  <path d="M970 768V822H600" class="arrow"/>

  <polygon points="600,820 735,882 600,944 465,882" class="decision"/>
  <text x="600" y="875" class="decision-title">모든 검증 기준 통과?</text>
  <text x="600" y="902" class="decision-sub">요구사항·구조·안전성·실행·결과를 종합 판단</text>

  <rect x="35" y="828" width="360" height="164" class="issue-panel"/>
  <text x="215" y="856" class="issue-title">문제 유형별 수정</text>

  <rect x="52" y="874" width="155" height="50" class="issue-card"/>
  <text x="129.5" y="894" class="issue-card-title">요구사항 문제</text>
  <text x="129.5" y="915" class="issue-card-sub">규칙·예외 보완 후 재요청</text>

  <rect x="222" y="874" width="155" height="50" class="issue-card"/>
  <text x="299.5" y="894" class="issue-card-title">설계 문제</text>
  <text x="299.5" y="915" class="issue-card-sub">ERD·제약조건 수정</text>

  <rect x="52" y="936" width="155" height="42" class="issue-card"/>
  <text x="129.5" y="953" class="issue-card-title">구현 문제</text>
  <text x="129.5" y="970" class="issue-card-sub">SQL·코드·순서 수정</text>

  <rect x="222" y="936" width="155" height="42" class="issue-card"/>
  <text x="299.5" y="953" class="issue-card-title">검증 문제</text>
  <text x="299.5" y="970" class="issue-card-sub">데이터·시나리오 보강</text>

  <rect x="805" y="828" width="360" height="72" class="success"/>
  <text x="985" y="856" class="result-title">검증 완료 결과 채택</text>
  <text x="985" y="882" class="result-sub">통과한 구조·SQL·코드만 다음 작업에 사용</text>

  <rect x="805" y="920" width="360" height="72" class="record"/>
  <text x="985" y="948" class="result-title">검증 근거 기록</text>
  <text x="985" y="974" class="result-sub">프롬프트 · AI 초안 · 실행 결과 · 수정 이유 · 한계</text>

  <path d="M465 882H395" class="arrow"/>
  <text x="421" y="866" class="branch">아니요</text>
  <path d="M735 882H805" class="arrow"/>
  <text x="772" y="866" class="branch">예</text>
  <path d="M985 900V920" class="arrow"/>
  <path d="M35 910H15V156H55" class="feedback"/>
  <text x="30" y="540" class="branch" fill="#b42318">수정 후 재요청·재실행·재검증</text>

  <rect x="65" y="1012" width="1070" height="46" class="note"/>
  <text x="89" y="1034" class="note-title">검증 완료 조건</text>
  <text x="218" y="1034" class="note-text">SQL이 한 번 실행된 것이 아니라, 요구사항과 실제 결과가 일치하고 위험 요소가 없으며 같은 과정을 다시 재현할 수 있어야 한다.</text>

  <rect x="170" y="1074" width="860" height="34" class="principle"/>
  <text x="196" y="1095" class="principle-label">핵심 원칙</text>
  <text x="620" y="1095" class="principle-text">AI는 초안을 만들지만 검증 기준을 정하고 결과를 책임지는 주체는 사람이다</text>
</svg>
