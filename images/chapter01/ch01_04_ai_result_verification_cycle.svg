<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <style>
      text { font-family: Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif; fill:#1a202c; }
      .title { font-size: 24px; font-weight: 700; }
      .box { fill:#f7fafc; stroke:#4a5568; stroke-width:2; rx:10; ry:10; }
      .main { fill:#ebf8ff; stroke:#2b6cb0; }
      .label { font-size:18px; text-anchor:middle; dominant-baseline:middle; }
      .small { font-size:15px; text-anchor:middle; dominant-baseline:middle; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="600" y="38" class="title" text-anchor="middle">AI 생성 결과 검증 사이클</text>

  <rect x="485" y="80" width="230" height="70" class="box"/><text x="600" y="115" class="label">AI에게 요청</text>
  <rect x="840" y="220" width="230" height="70" class="box"/><text x="955" y="255" class="label">AI 결과 생성</text>
  <rect x="840" y="510" width="230" height="70" class="box"/><text x="955" y="545" class="label">사람이 요구사항과 비교</text>
  <rect x="485" y="650" width="230" height="70" class="box"/><text x="600" y="685" class="label">PostgreSQL에서 실행</text>
  <rect x="130" y="510" width="230" height="70" class="box"/><text x="245" y="545" class="label">DBeaver로 결과 확인</text>
  <rect x="130" y="220" width="230" height="70" class="box"/><text x="245" y="255" class="label">GitHub에 기록</text>

  <line x1="715" y1="115" x2="840" y2="255" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="955" y1="290" x2="955" y2="510" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="840" y1="545" x2="715" y2="685" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="485" y1="685" x2="360" y2="545" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="245" y1="510" x2="245" y2="290" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="360" y1="255" x2="485" y2="115" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="420" y="305" width="360" height="220" class="box main"/>
  <text x="600" y="340" class="small" style="font-size:18px; font-weight:700;">검토 체크리스트</text>
  <text x="600" y="382" class="small">• PK / FK가 적절한가?</text>
  <text x="600" y="410" class="small">• 중복 / 정규화 문제는 없는가?</text>
  <text x="600" y="438" class="small">• 위험한 SQL은 없는가?</text>
  <text x="600" y="466" class="small">• 요구사항과 맞는가?</text>
  <text x="600" y="494" class="small">• 실행 결과까지 확인했는가?</text>

  <text x="1010" y="470" class="small">문제 발견 시</text>
  <text x="1010" y="492" class="small">프롬프트 또는 설계 수정</text>
  <text x="190" y="470" class="small">실행 결과까지</text>
  <text x="190" y="492" class="small">확인해야 완료</text>
</svg>