<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="100%" height="680" viewBox="0 0 1200 680">
  <title id="title">AI 추천 NoSQL 선택 검토 흐름</title>
  <desc id="desc">AI의 추천은 데이터 구조, 조회 패턴, 정합성, 운영 비용으로 검증합니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <style>
      text{font-family:'Pretendard','Noto Sans KR','Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',Arial,sans-serif;fill:#0f172a}
      .title{font-size:32px;font-weight:800;text-anchor:middle}
      .subtitle{font-size:15px;text-anchor:middle;fill:#475569}
      .card{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:18}
      .blue{fill:#eff6ff;stroke:#3b82f6}
      .green{fill:#f0fdf4;stroke:#22c55e}
      .yellow{fill:#fffbeb;stroke:#f59e0b}
      .purple{fill:#faf5ff;stroke:#8b5cf6}
      .cyan{fill:#ecfeff;stroke:#06b6d4}
      .label{font-size:20px;font-weight:700;text-anchor:middle}
      .small{font-size:15px;text-anchor:middle;fill:#334155}
      .tiny{font-size:13px;text-anchor:middle;fill:#475569}
      .code{font-family:Consolas,'Pretendard','Noto Sans KR','Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',Arial,sans-serif;font-size:14px;text-anchor:middle;fill:#1d4ed8;font-weight:700}
      .line{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="680" fill="#ffffff"/>
  <text x="600" y="52" class="title">AI 추천 NoSQL 선택 검토 흐름</text>
  <text x="600" y="80" class="subtitle">AI의 추천은 데이터 구조, 조회 패턴, 정합성, 운영 비용으로 검증합니다.</text>
  <rect x="430" y="110" width="340" height="90" class="card purple"/>
  <text x="600" y="144" class="label">AI 저장 방식 추천</text>
  <text x="600" y="178" class="small">검토할 초안</text>
  <rect x="70" y="300" width="230" height="120" class="card blue"/>
  <text x="185" y="334" class="label">데이터 구조</text>
  <text x="185" y="368" class="small">원본인가 파생인가</text>
  <rect x="350" y="300" width="230" height="120" class="card green"/>
  <text x="465" y="334" class="label">조회 패턴</text>
  <text x="465" y="368" class="small">키 · 문서 · 관계</text>
  <rect x="630" y="300" width="230" height="120" class="card yellow"/>
  <text x="745" y="334" class="label">정합성</text>
  <text x="745" y="368" class="small">트랜잭션 필요성</text>
  <rect x="910" y="300" width="230" height="120" class="card cyan"/>
  <text x="1025" y="334" class="label">운영 비용</text>
  <text x="1025" y="368" class="small">백업 · 복구 · 장애</text>
  <rect x="400" y="530" width="400" height="90" class="card green"/>
  <text x="600" y="564" class="label">적용 또는 수정</text>
  <text x="600" y="598" class="small">작은 샘플로 검증 후 결정</text>
  <line x1="520" y1="200" x2="185" y2="300" class="line"/>
  <line x1="570" y1="200" x2="465" y2="300" class="line"/>
  <line x1="630" y1="200" x2="745" y2="300" class="line"/>
  <line x1="680" y1="200" x2="1025" y2="300" class="line"/>
  <line x1="185" y1="420" x2="470" y2="530" class="line"/>
  <line x1="465" y1="420" x2="540" y2="530" class="line"/>
  <line x1="745" y1="420" x2="650" y2="530" class="line"/>
  <line x1="1025" y1="420" x2="730" y2="530" class="line"/>
</svg>
