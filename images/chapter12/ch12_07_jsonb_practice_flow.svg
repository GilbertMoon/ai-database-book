<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="100%" height="680" viewBox="0 0 1200 680">
  <title id="title">PostgreSQL JSONB 실습 흐름</title>
  <desc id="desc">JSONB 연산자와 인덱스를 확인한 뒤 저장 방식 선택을 판단합니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <style>
      text{font-family:'Pretendard','Noto Sans KR','Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',Arial,sans-serif;fill:#0f172a}
      .title{font-size:32px;font-weight:800;text-anchor:middle}
      .subtitle{font-size:15px;text-anchor:middle;fill:#475569}
      .card{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:18}
      .blue{fill:#eff6ff;stroke:#3b82f6}
      .green{fill:#f0fdf4;stroke:#22c55e}
      .yellow{fill:#fffbeb;stroke:#f59e0b}
      .purple{fill:#faf5ff;stroke:#8b5cf6}
      .cyan{fill:#ecfeff;stroke:#06b6d4}
      .label{font-size:20px;font-weight:700;text-anchor:middle}
      .small{font-size:15px;text-anchor:middle;fill:#334155}
      .tiny{font-size:13px;text-anchor:middle;fill:#475569}
      .code{font-family:Consolas,'Pretendard','Noto Sans KR','Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',Arial,sans-serif;font-size:14px;text-anchor:middle;fill:#1d4ed8;font-weight:700}
      .line{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="680" fill="#ffffff"/>
  <text x="600" y="52" class="title">PostgreSQL JSONB 실습 흐름</text>
  <text x="600" y="80" class="subtitle">JSONB 연산자와 인덱스를 확인한 뒤 저장 방식 선택을 판단합니다.</text>
  <rect x="70" y="155" width="230" height="115" class="card blue"/>
  <text x="185" y="189" class="label">course_documents</text>
  <text x="185" y="223" class="small">course_code · title</text>
  <text x="185" y="247" class="small">metadata JSONB</text>
  <rect x="360" y="155" width="190" height="115" class="card green"/>
  <text x="455" y="189" class="label">-> / ->></text>
  <text x="455" y="223" class="small">JSONB 값</text>
  <text x="455" y="247" class="small">text 값</text>
  <rect x="600" y="155" width="190" height="115" class="card yellow"/>
  <text x="695" y="189" class="label">? / @></text>
  <text x="695" y="223" class="small">키 존재</text>
  <text x="695" y="247" class="small">포함 조건</text>
  <rect x="840" y="155" width="230" height="115" class="card purple"/>
  <text x="955" y="189" class="label">Index</text>
  <text x="955" y="223" class="small">GIN index</text>
  <text x="955" y="247" class="small">expression index</text>
  <rect x="360" y="410" width="430" height="105" class="card cyan"/>
  <text x="575" y="444" class="label">판단</text>
  <text x="575" y="478" class="small">JSONB로 충분한가, 별도 NoSQL이 필요한가?</text>
  <line x1="300" y1="212" x2="360" y2="212" class="line"/>
  <line x1="550" y1="212" x2="600" y2="212" class="line"/>
  <line x1="790" y1="212" x2="840" y2="212" class="line"/>
  <line x1="955" y1="270" x2="650" y2="410" class="line"/>
</svg>
