<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Graph DB 다단계 관계 탐색</title>
  <desc id="desc">학생 101에서 관심 주제, 관련 강의, 해당 강의를 수강한 다른 학생과 그 학생의 다른 강의를 차례로 탐색해 추천 후보를 찾고, 단순 정형 조회와 다단계 관계 탐색의 차이를 비교하는 도식</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
    <style>
      text{font-family:"Pretendard","Noto Sans KR","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",Arial,sans-serif;fill:#0f172a}
      .mono{font-family:Consolas,D2Coding,"Courier New",monospace}
      .title{font-size:30px;font-weight:800;text-anchor:middle}
      .subtitle{font-size:14px;text-anchor:middle;fill:#475569}
      .head{font-size:18px;font-weight:800;text-anchor:middle}
      .section{font-size:15px;font-weight:700;text-anchor:middle}
      .body{font-size:13px;text-anchor:middle;fill:#334155}
      .small{font-size:11.8px;text-anchor:middle;fill:#475569}
      .step{font-size:11px;font-weight:700;text-anchor:middle;fill:#ffffff}
      .edge-label{font-size:11px;font-weight:700;text-anchor:middle;fill:#334155}
      .card{stroke-width:2;rx:16;ry:16}
      .principle{fill:#f8fafc;stroke:#94a3b8}
      .query{fill:#eff6ff;stroke:#3b82f6}
      .student{fill:#eff6ff;stroke:#3b82f6;stroke-width:2}
      .topic{fill:#fffbeb;stroke:#f59e0b;stroke-width:2}
      .course{fill:#f0fdf4;stroke:#22c55e;stroke-width:2}
      .candidate{fill:#ecfeff;stroke:#06b6d4}
      .simple{fill:#f8fafc;stroke:#64748b}
      .graph{fill:#faf5ff;stroke:#8b5cf6}
      .note{fill:#fff7ed;stroke:#f97316}
      .line{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#arrow);stroke-linejoin:round}
      .connector{stroke:#475569;stroke-width:2;fill:none;stroke-linejoin:round}
      .divider{stroke:#cbd5e1;stroke-width:1.4;stroke-dasharray:6 6}
    </style>
  </defs>

  <rect width="1200" height="860" fill="#ffffff"/>
  <text x="600" y="46" class="title">Graph DB 다단계 관계 탐색</text>
  <text x="600" y="74" class="subtitle">관계가 있다는 이유가 아니라, 여러 단계를 따라가는 경로 자체가 질문의 핵심일 때 검토합니다.</text>

  <rect x="100" y="100" width="1000" height="70" class="card principle"/>
  <text x="600" y="128" class="section">추천 질문</text>
  <text x="600" y="153" class="body">학생 101의 관심 주제와 수강 관계를 따라 추천할 다른 강의를 찾는다.</text>

  <!-- Multi-hop path -->
  <text x="600" y="220" class="head">다단계 관계 탐색 경로</text>
  <line x1="70" y1="240" x2="1130" y2="240" class="divider"/>

  <circle cx="100" cy="350" r="66" class="student"/>
  <circle cx="100" cy="300" r="14" fill="#3b82f6"/>
  <text x="100" y="304" class="step">시작</text>
  <text x="100" y="342" class="section">Student</text>
  <text x="100" y="366" class="mono body">101</text>
  <text x="100" y="389" class="small">추천 대상 학생</text>

  <circle cx="350" cy="350" r="66" class="topic"/>
  <circle cx="350" cy="300" r="14" fill="#f59e0b"/>
  <text x="350" y="304" class="step">1-hop</text>
  <text x="350" y="342" class="section">Topic</text>
  <text x="350" y="366" class="mono body">Database</text>
  <text x="350" y="389" class="small">관심 주제</text>

  <circle cx="600" cy="350" r="66" class="course"/>
  <circle cx="600" cy="300" r="14" fill="#22c55e"/>
  <text x="600" y="304" class="step">2-hop</text>
  <text x="600" y="342" class="section">Course</text>
  <text x="600" y="366" class="mono body">DB-201</text>
  <text x="600" y="389" class="small">주제와 관련된 강의</text>

  <circle cx="850" cy="350" r="66" class="student"/>
  <circle cx="850" cy="300" r="14" fill="#3b82f6"/>
  <text x="850" y="304" class="step">3-hop</text>
  <text x="850" y="342" class="section">Student</text>
  <text x="850" y="366" class="mono body">205</text>
  <text x="850" y="389" class="small">DB-201 수강 학생</text>

  <circle cx="1100" cy="350" r="66" class="course"/>
  <circle cx="1100" cy="300" r="14" fill="#22c55e"/>
  <text x="1100" y="304" class="step">4-hop</text>
  <text x="1100" y="342" class="section">Course</text>
  <text x="1100" y="366" class="mono body">AI-301</text>
  <text x="1100" y="389" class="small">다른 수강 강의</text>

  <path d="M166 350 H284" class="line"/>
  <text x="225" y="327" class="edge-label mono">INTERESTED_IN</text>

  <path d="M416 350 H534" class="line"/>
  <text x="475" y="327" class="edge-label mono">RELATED_TO</text>

  <path d="M666 350 H784" class="line"/>
  <text x="725" y="317" class="edge-label mono">ENROLLED</text>
  <text x="725" y="333" class="small">역방향 탐색</text>

  <path d="M916 350 H1034" class="line"/>
  <text x="975" y="327" class="edge-label mono">ENROLLED</text>

  <!-- Recommendation result -->
  <path d="M1100 416 V455" class="line"/>
  <rect x="955" y="455" width="290" height="78" class="card candidate"/>
  <text x="1100" y="485" class="head">추천 후보</text>
  <text x="1100" y="512" class="body">Course AI-301을 학생 101에게 제안</text>

  <!-- Comparison -->
  <text x="600" y="585" class="head">어떤 경우에 Graph DB를 검토할까?</text>
  <line x1="100" y1="605" x2="1100" y2="605" class="divider"/>

  <rect x="90" y="630" width="480" height="120" class="card simple"/>
  <text x="330" y="662" class="head">RDBMS JOIN으로 충분할 수 있는 경우</text>
  <text x="330" y="692" class="body">강의별 수강 학생 목록처럼 관계 깊이가 짧고</text>
  <text x="330" y="716" class="body">조회 경로가 정형화되어 있음</text>
  <text x="330" y="739" class="small">FK·JOIN·인덱스로 먼저 검토</text>

  <rect x="630" y="630" width="480" height="120" class="card graph"/>
  <text x="870" y="662" class="head">Graph DB를 검토할 수 있는 경우</text>
  <text x="870" y="692" class="body">학생→주제→강의→학생→강의처럼</text>
  <text x="870" y="716" class="body">여러 단계 관계를 반복 탐색하는 것이 핵심</text>
  <text x="870" y="739" class="small">경로·연결 패턴 자체가 주요 질의</text>

  <rect x="145" y="785" width="910" height="50" class="card note"/>
  <text x="600" y="806" class="section">운영 원칙</text>
  <text x="600" y="827" class="small">추천 그래프가 파생 관계 인덱스라면 원본 저장소, 갱신 지연 허용 범위와 재구축 절차를 함께 설계합니다.</text>

  <text x="600" y="852" class="small">핵심: 단순히 관계가 존재하는지가 아니라 관계의 깊이와 반복 탐색 비용을 기준으로 저장 모델을 선택합니다.</text>
</svg>