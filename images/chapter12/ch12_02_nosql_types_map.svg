<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="100%" height="680" viewBox="0 0 1200 680">
  <title id="title">NoSQL 유형 정리</title>
  <desc id="desc">Chapter 12에서는 네 가지 유형만 비교합니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <style>
      text{font-family:'Pretendard','Noto Sans KR','Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',Arial,sans-serif;fill:#0f172a}
      .title{font-size:32px;font-weight:800;text-anchor:middle}
      .subtitle{font-size:15px;text-anchor:middle;fill:#475569}
      .card{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:18}
      .blue{fill:#eff6ff;stroke:#3b82f6}
      .green{fill:#f0fdf4;stroke:#22c55e}
      .yellow{fill:#fffbeb;stroke:#f59e0b}
      .purple{fill:#faf5ff;stroke:#8b5cf6}
      .cyan{fill:#ecfeff;stroke:#06b6d4}
      .label{font-size:20px;font-weight:700;text-anchor:middle}
      .small{font-size:15px;text-anchor:middle;fill:#334155}
      .tiny{font-size:13px;text-anchor:middle;fill:#475569}
      .code{font-family:Consolas,'Pretendard','Noto Sans KR','Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',Arial,sans-serif;font-size:14px;text-anchor:middle;fill:#1d4ed8;font-weight:700}
      .line{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="680" fill="#ffffff"/>
  <text x="600" y="52" class="title">NoSQL 유형 정리</text>
  <text x="600" y="80" class="subtitle">Chapter 12에서는 네 가지 유형만 비교합니다.</text>
  <rect x="475" y="120" width="250" height="95" class="card purple"/>
  <text x="600" y="154" class="label">NoSQL 계열</text>
  <text x="600" y="188" class="small">관계형 테이블 밖의</text>
  <text x="600" y="212" class="small">다양한 저장 모델</text>
  <rect x="80" y="300" width="230" height="120" class="card blue"/>
  <text x="195" y="334" class="label">Key-Value DB</text>
  <text x="195" y="368" class="small">정확한 키 조회</text>
  <text x="195" y="392" class="small">세션 · 캐시</text>
  <rect x="350" y="300" width="230" height="120" class="card green"/>
  <text x="465" y="334" class="label">Document DB</text>
  <text x="465" y="368" class="small">문서 단위 저장</text>
  <text x="465" y="392" class="small">강의 메타데이터</text>
  <rect x="620" y="300" width="230" height="120" class="card yellow"/>
  <text x="735" y="334" class="label">Column-Family DB</text>
  <text x="735" y="368" class="small">partition key</text>
  <text x="735" y="392" class="small">event_time 정렬</text>
  <rect x="890" y="300" width="230" height="120" class="card cyan"/>
  <text x="1005" y="334" class="label">Graph DB</text>
  <text x="1005" y="368" class="small">노드와 관계</text>
  <text x="1005" y="392" class="small">추천 탐색</text>
  <line x1="520" y1="215" x2="195" y2="300" class="line"/>
  <line x1="570" y1="215" x2="465" y2="300" class="line"/>
  <line x1="630" y1="215" x2="735" y2="300" class="line"/>
  <line x1="680" y1="215" x2="1005" y2="300" class="line"/>
</svg>
