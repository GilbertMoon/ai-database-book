<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1160" viewBox="0 0 1200 1160" role="img" aria-labelledby="title desc"><title id="title">1정규형: 반복값 분리</title><desc id="desc">borrowed_books 한 셀에 여러 책 제목을 저장한 구조의 검색, 제약조건, 책별 날짜 관리 문제를 보여 주고, 한 행을 대여 한 건으로 다시 정의하여 각 셀에 하나의 값만 저장하는 1정규형 변환과 검증 기준 및 한계를 설명하는 도식</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}.t{font-size:28px;font-weight:700;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.panel{stroke-width:1.5;rx:15}.before{fill:#fff5f5;stroke:#d9534f}.problem{fill:#fff8e8;stroke:#d69e2e}.after{fill:#eef5ff;stroke:#6fa2e8}.verify{fill:#f2fbf5;stroke:#8bc9a0}.pt{font-size:19px;font-weight:700}.box{fill:#fff;stroke-width:1.4;rx:10}.red{stroke:#d9534f}.orange{stroke:#d69e2e}.blue{stroke:#3b82c4}.green{stroke:#3c9a5f}.purple{stroke:#7c5cc4}.gray{stroke:#64748b}.h{font-size:14px;font-weight:700;text-anchor:middle}.m{font-size:11.3px;text-anchor:middle;fill:#475569}.code{font-family:Consolas,D2Coding,monospace;font-size:12.3px;font-weight:700;text-anchor:middle;fill:#334155}.arr{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.back{stroke:#d9534f;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#a)}.table{fill:#fff;stroke:#64748b;stroke-width:1.4;rx:9}.headR{fill:#fee2e2}.headB{fill:#dcecff}.th{font-size:12.3px;font-weight:700;text-anchor:middle}.cell{font-size:10.5px;text-anchor:middle;fill:#334155}.multi{font-size:10.5px;font-weight:700;text-anchor:middle;fill:#b91c1c}.line{stroke:#cbd5e1;stroke-width:1}.decision{fill:#fff8e8;stroke:#b7791f;stroke-width:1.8}.dt{font-size:14px;font-weight:700;text-anchor:middle}.note{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.3;rx:9}.nt{font-size:11.3px;font-weight:700;text-anchor:middle;fill:#92400e}.core{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.5;rx:10}.cv{font-size:14.2px;font-weight:700;text-anchor:middle;fill:#166534}</style></defs><rect width="1200" height="1160" fill="#fff"/><text x="600" y="40" class="t">1정규형: 반복값 분리</text><text x="600" y="68" class="s">한 셀에 여러 독립 값을 넣지 않고, 한 행이 한 번의 사실을 표현하도록 반복 그룹을 행으로 분리한다</text><rect x="35" y="100" width="1130" height="235" class="panel before"/><text x="60" y="132" class="pt">1. 적용 전: 회원 한 행에 여러 대여를 목록으로 저장</text><rect x="70" y="165" width="1060" height="105" class="table"/><rect x="70" y="165" width="1060" height="38" class="headR"/><text x="155" y="189" class="th">member_id</text><text x="330" y="189" class="th">member_name</text><text x="760" y="189" class="th">borrowed_books</text><line x1="70" y1="203" x2="1130" y2="203" class="line"/><line x1="240" y1="165" x2="240" y2="270" class="line"/><line x1="430" y1="165" x2="430" y2="270" class="line"/><text x="155" y="236" class="cell">1</text><text x="330" y="236" class="cell">김민지</text><text x="780" y="236" class="multi">데이터베이스 입문, SQL 기초</text><text x="600" y="298" class="m">쉼표로 묶인 두 책은 서로 독립적으로 검색·연결·변경해야 하는 값이지만 한 셀에 섞여 있음</text><text x="600" y="320" class="code">같은 문제: borrowed_book1 · borrowed_book2 · borrowed_book3처럼 반복 컬럼을 늘리는 구조</text><rect x="35" y="365" width="1130" height="250" class="panel problem"/><text x="60" y="397" class="pt">2. 왜 문제인가?</text><rect x="55" y="430" width="250" height="115" class="box red"/><text x="180" y="456" class="h">정확한 검색 어려움</text><text x="180" y="481" class="m">책 한 권을 찾기 위해</text><text x="180" y="503" class="code">LIKE · 문자열 분리</text><text x="180" y="526" class="m">같은 임시 처리에 의존</text><rect x="330" y="430" width="250" height="115" class="box orange"/><text x="455" y="456" class="h">제약조건 적용 어려움</text><text x="455" y="481" class="m">각 책 값에 FK·UNIQUE·CHECK를</text><text x="455" y="503" class="m">독립적으로 적용하기 어려움</text><text x="455" y="526" class="code">잘못된 제목도 섞여 저장</text><rect x="605" y="430" width="250" height="115" class="box purple"/><text x="730" y="456" class="h">책별 정보 부족</text><text x="730" y="481" class="m">각 책마다 다른 대여일·반납일을</text><text x="730" y="503" class="m">어느 값과 연결할지 불명확</text><text x="730" y="526" class="code">값과 속성의 짝이 깨짐</text><rect x="880" y="430" width="250" height="115" class="box gray"/><text x="1005" y="456" class="h">구조가 데이터 개수에 종속</text><text x="1005" y="481" class="m">책이 늘 때 컬럼이나 문자열만 커지고</text><text x="1005" y="503" class="m">행 구조가 일정하지 않음</text><text x="1005" y="526" class="code">반복 그룹이 계속 확장</text><rect x="230" y="560" width="740" height="35" class="box red"/><text x="600" y="582" class="m">판단 기준: 업무에서 독립적으로 검색·연결·수정할 여러 값이 한 셀에 들어 있다면 분리 대상</text><rect x="35" y="645" width="1130" height="300" class="panel after"/><text x="60" y="677" class="pt">3. 1NF 적용: 한 행을 대여 한 건으로 다시 정의</text><rect x="60" y="710" width="1080" height="165" class="table"/><rect x="60" y="710" width="1080" height="38" class="headB"/><text x="135" y="734" class="th">member_id</text><text x="315" y="734" class="th">member_name</text><text x="600" y="734" class="th">book_title</text><text x="910" y="734" class="th">borrowed_at</text><line x1="60" y1="748" x2="1140" y2="748" class="line"/><line x1="60" y1="790" x2="1140" y2="790" class="line"/><line x1="60" y1="832" x2="1140" y2="832" class="line"/><line x1="220" y1="710" x2="220" y2="875" class="line"/><line x1="410" y1="710" x2="410" y2="875" class="line"/><line x1="790" y1="710" x2="790" y2="875" class="line"/><text x="135" y="775" class="cell">1</text><text x="315" y="775" class="cell">김민지</text><text x="600" y="775" class="cell">데이터베이스 입문</text><text x="960" y="775" class="cell">2026-04-01</text><text x="135" y="817" class="cell">1</text><text x="315" y="817" class="cell">김민지</text><text x="600" y="817" class="cell">SQL 기초</text><text x="960" y="817" class="cell">2026-04-02</text><text x="135" y="859" class="cell">2</text><text x="315" y="859" class="cell">이준호</text><text x="600" y="859" class="cell">데이터베이스 입문</text><text x="960" y="859" class="cell">2026-04-03</text><text x="600" y="902" class="code">항목 수만큼 컬럼을 늘리지 않고, 같은 컬럼 구조를 유지한 채 행을 추가</text><text x="600" y="925" class="m">이제 책별 날짜·상태를 같은 행에 둘 수 있고 정확한 조건 검색과 행 단위 작업이 가능</text><rect x="35" y="975" width="1130" height="105" class="panel verify"/><text x="60" y="1007" class="pt">4. 1NF 검증과 다음 단계</text><rect x="55" y="1025" width="245" height="36" class="box green"/><text x="177" y="1048" class="m">각 셀에 하나의 값</text><rect x="325" y="1025" width="245" height="36" class="box blue"/><text x="447" y="1048" class="m">반복 컬럼 없이 행 추가</text><rect x="595" y="1025" width="245" height="36" class="box orange"/><text x="717" y="1048" class="m">한 행이 대여 한 건 표현</text><rect x="865" y="1025" width="245" height="36" class="box purple"/><text x="987" y="1048" class="m">정확한 검색·변경 가능</text><polygon points="600,1090 710,1120 600,1150 490,1120" class="decision"/><text x="600" y="1116" class="dt">반복 그룹과 다중값 셀이 모두 제거됐는가?</text><text x="600" y="1136" class="m">아니면 목록·배열형 문자열·반복 컬럼을 다시 확인</text><path d="M490 1120H20V785H60" class="back"/><rect x="55" y="1095" width="350" height="42" class="note"/><text x="230" y="1113" class="nt">1NF는 시작 단계</text><text x="230" y="1130" class="m">member_name·book_title 반복은 아직 남을 수 있음</text><rect x="795" y="1095" width="350" height="42" class="core"/><text x="970" y="1113" class="cv">한 셀에는 하나의 값</text><text x="970" y="1130" class="m">한 행에는 한 번의 사실</text></svg>