<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180" role="img" aria-labelledby="title desc"><title id="title">3정규형: 일반 컬럼 의존 분리</title><desc id="desc">회원 테이블에서 member_id가 zip_code를 결정하고 zip_code가 city를 결정하여 city가 기본키에 간접 의존하는 이행적 종속을 보여 주고, members와 zip_codes로 분리하여 수정·삽입·삭제 이상을 줄이는 과정과 검증 기준을 설명하는 도식</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}.t{font-size:28px;font-weight:700;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.panel{stroke-width:1.5;rx:15}.before{fill:#fff5f5;stroke:#d9534f}.depend{fill:#fff8e8;stroke:#d69e2e}.after{fill:#eef5ff;stroke:#6fa2e8}.verify{fill:#f2fbf5;stroke:#8bc9a0}.pt{font-size:19px;font-weight:700}.table{fill:#fff;stroke:#64748b;stroke-width:1.4;rx:9}.headR{fill:#fee2e2}.headB{fill:#dcecff}.headO{fill:#fff1cf}.th{font-size:12.5px;font-weight:700;text-anchor:middle}.cell{font-size:10.7px;text-anchor:middle;fill:#334155}.repeat{font-size:10.7px;font-weight:700;text-anchor:middle;fill:#b91c1c}.line{stroke:#cbd5e1;stroke-width:1}.box{fill:#fff;stroke-width:1.4;rx:10}.red{stroke:#d9534f}.orange{stroke:#d69e2e}.blue{stroke:#3b82c4}.green{stroke:#3c9a5f}.purple{stroke:#7c5cc4}.gray{stroke:#64748b}.h{font-size:14px;font-weight:700;text-anchor:middle}.m{font-size:11.3px;text-anchor:middle;fill:#475569}.code{font-family:Consolas,D2Coding,monospace;font-size:12.2px;font-weight:700;text-anchor:middle;fill:#334155}.arr{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.dep1{stroke:#3b82c4;stroke-width:2.2;fill:none;marker-end:url(#a)}.dep2{stroke:#d69e2e;stroke-width:2.2;fill:none;marker-end:url(#a)}.back{stroke:#d9534f;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#a)}.decision{fill:#fff8e8;stroke:#b7791f;stroke-width:1.8}.dt{font-size:14px;font-weight:700;text-anchor:middle}.note{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.3;rx:9}.nt{font-size:11.3px;font-weight:700;text-anchor:middle;fill:#92400e}.core{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.5;rx:10}.cv{font-size:14.2px;font-weight:700;text-anchor:middle;fill:#166534}</style></defs><rect width="1200" height="1180" fill="#fff"/><text x="600" y="40" class="t">3정규형: 일반 컬럼 의존 분리</text><text x="600" y="68" class="s">일반 컬럼이 다른 일반 컬럼을 거쳐 기본키에 간접 의존하면, 그 결정자를 키로 하는 테이블 분리를 검토한다</text><rect x="35" y="100" width="1130" height="270" class="panel before"/><text x="60" y="132" class="pt">1. 적용 전: 회원 행에 우편번호와 도시를 함께 저장</text><rect x="70" y="165" width="1060" height="150" class="table"/><rect x="70" y="165" width="1060" height="38" class="headR"/><text x="155" y="189" class="th">member_id</text><text x="360" y="189" class="th">member_name</text><text x="655" y="189" class="th">zip_code</text><text x="940" y="189" class="th">city</text><line x1="70" y1="203" x2="1130" y2="203" class="line"/><line x1="70" y1="240" x2="1130" y2="240" class="line"/><line x1="70" y1="277" x2="1130" y2="277" class="line"/><line x1="245" y1="165" x2="245" y2="315" class="line"/><line x1="505" y1="165" x2="505" y2="315" class="line"/><line x1="800" y1="165" x2="800" y2="315" class="line"/><text x="155" y="227" class="cell">1</text><text x="360" y="227" class="cell">김민지</text><text x="655" y="227" class="repeat">04524</text><text x="940" y="227" class="repeat">서울</text><text x="155" y="264" class="cell">2</text><text x="360" y="264" class="cell">이준호</text><text x="655" y="264" class="repeat">04524</text><text x="940" y="264" class="repeat">서울</text><text x="155" y="301" class="cell">3</text><text x="360" y="301" class="cell">박서연</text><text x="655" y="301" class="cell">48058</text><text x="940" y="301" class="cell">부산</text><text x="600" y="338" class="code">한 행은 회원 한 명 · 같은 zip_code가 반복될 때 city도 함께 복사</text><text x="600" y="358" class="m">이 예제의 업무 규칙에서는 같은 우편번호라면 같은 도시 값이 유지되어야 함</text><rect x="35" y="400" width="1130" height="245" class="panel depend"/><text x="60" y="432" class="pt">2. 직접 의존과 이행적 종속 구분</text><rect x="55" y="465" width="300" height="110" class="box blue"/><text x="205" y="492" class="h">member_id → member_name</text><text x="205" y="519" class="m">회원 키가 회원 이름을 직접 결정</text><text x="205" y="545" class="code">키 → 회원 사실</text><rect x="450" y="465" width="300" height="110" class="box blue"/><text x="600" y="492" class="h">member_id → zip_code</text><text x="600" y="519" class="m">회원 키가 현재 우편번호를 직접 결정</text><text x="600" y="545" class="code">키 → 회원 속성</text><rect x="845" y="465" width="300" height="110" class="box orange"/><text x="995" y="492" class="h">zip_code → city</text><text x="995" y="519" class="m">일반 컬럼이 다른 일반 컬럼을 결정</text><text x="995" y="545" class="code">비키 → 비키</text><path d="M750 520H845" class="dep2"/><rect x="235" y="590" width="730" height="35" class="box red"/><text x="600" y="612" class="code">member_id → zip_code → city · city는 member_id에 직접이 아니라 간접 의존</text><text x="600" y="637" class="m">결과: 04524의 도시명이 바뀌면 여러 회원 행을 수정해야 하고 누락 시 값이 서로 달라질 수 있음</text><rect x="35" y="675" width="1130" height="270" class="panel after"/><text x="60" y="707" class="pt">3. 3NF 적용: 결정 관계의 주인별로 분리</text><rect x="75" y="755" width="450" height="150" class="table"/><rect x="75" y="755" width="450" height="38" class="headB"/><text x="300" y="779" class="th">members</text><text x="300" y="817" class="h">회원당 한 행</text><text x="300" y="844" class="code">id PK · name · zip_code FK</text><text x="300" y="869" class="m">회원 자체와 회원이 선택한 우편번호만 저장</text><text x="300" y="892" class="m">김민지·이준호는 04524를 참조</text><rect x="675" y="755" width="450" height="150" class="table"/><rect x="675" y="755" width="450" height="38" class="headO"/><text x="900" y="779" class="th">zip_codes</text><text x="900" y="817" class="h">우편번호당 한 행</text><text x="900" y="844" class="code">zip_code PK · city</text><text x="900" y="869" class="m">04524 · 서울 / 48058 · 부산</text><text x="900" y="892" class="m">도시 변경은 기준 테이블 한 행만 수정</text><path d="M525 840H675" class="arr"/><text x="600" y="827" class="m">N:1</text><rect x="230" y="915" width="740" height="22" class="box green"/><text x="600" y="930" class="code">members.zip_code → zip_codes.zip_code · JOIN으로 회원명·우편번호·도시 복원</text><rect x="35" y="975" width="1130" height="105" class="panel verify"/><text x="60" y="1007" class="pt">4. 3NF 결과 검증</text><rect x="55" y="1025" width="245" height="36" class="box green"/><text x="177" y="1048" class="m">도시 값 한 곳에서 수정</text><rect x="325" y="1025" width="245" height="36" class="box blue"/><text x="447" y="1048" class="m">우편번호 기준정보 독립 INSERT</text><rect x="595" y="1025" width="245" height="36" class="box orange"/><text x="717" y="1048" class="m">회원 삭제 후 기준정보 유지</text><rect x="865" y="1025" width="245" height="36" class="box purple"/><text x="987" y="1048" class="m">JOIN 결과가 원래 의미 복원</text><polygon points="600,1090 710,1120 600,1150 490,1120" class="decision"/><text x="600" y="1116" class="dt">일반 컬럼이 자기 테이블의 키에 직접 의존하는가?</text><text x="600" y="1136" class="m">아니면 비키 컬럼 사이의 결정 관계를 다시 확인</text><rect x="55" y="1098" width="350" height="42" class="note"/><text x="230" y="1116" class="nt">전제: 1NF와 2NF를 먼저 만족</text><text x="230" y="1133" class="m">키와 부분 종속을 정리한 뒤 이행 종속 확인</text><rect x="795" y="1098" width="350" height="42" class="core"/><text x="970" y="1116" class="cv">업무 규칙 확인이 우선</text><text x="970" y="1133" class="m">실제 주소 정책에서 zip_code → city가 성립하는지 검증</text><rect x="120" y="1160" width="960" height="14" class="core"/><text x="600" y="1172" class="cv">핵심 · 기본키가 아닌 컬럼이 다른 일반 컬럼을 결정하면 그 결정자를 키로 하는 테이블 분리를 검토</text></svg>