<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1280" viewBox="0 0 1200 1280" role="img" aria-labelledby="title desc"><title id="title">정규화 전후 비교와 JOIN</title><desc id="desc">도서 대여 정보를 한 테이블에 중복 저장하는 구조와 members, books, loans로 정규화한 구조를 비교하고, 정규화 후 PK와 FK를 따라 JOIN하여 회원 이름, 책 제목, 대여일을 원래 업무 화면처럼 복원하는 과정과 읽기 복잡도 및 쓰기 안정성의 교환관계를 설명하는 도식</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}.t{font-size:28px;font-weight:700;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.panel{stroke-width:1.5;rx:15}.before{fill:#fff5f5;stroke:#d9534f}.after{fill:#eef5ff;stroke:#6fa2e8}.join{fill:#fff8e8;stroke:#d69e2e}.verify{fill:#f2fbf5;stroke:#8bc9a0}.pt{font-size:19px;font-weight:700}.table{fill:#fff;stroke:#64748b;stroke-width:1.4;rx:9}.headR{fill:#fee2e2}.headB{fill:#dcecff}.headO{fill:#fff1cf}.th{font-size:12.2px;font-weight:700;text-anchor:middle}.cell{font-size:10.3px;text-anchor:middle;fill:#334155}.repeat{font-size:10.3px;font-weight:700;text-anchor:middle;fill:#b91c1c}.line{stroke:#cbd5e1;stroke-width:1}.box{fill:#fff;stroke-width:1.4;rx:10}.red{stroke:#d9534f}.orange{stroke:#d69e2e}.blue{stroke:#3b82c4}.green{stroke:#3c9a5f}.purple{stroke:#7c5cc4}.gray{stroke:#64748b}.h{font-size:14px;font-weight:700;text-anchor:middle}.m{font-size:11.2px;text-anchor:middle;fill:#475569}.code{font-family:Consolas,D2Coding,monospace;font-size:12px;font-weight:700;text-anchor:middle;fill:#334155}.codeL{font-family:Consolas,D2Coding,monospace;font-size:11.5px;fill:#334155}.arr{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.relB{stroke:#3b82c4;stroke-width:2.2;fill:none;marker-end:url(#a)}.relO{stroke:#d69e2e;stroke-width:2.2;fill:none;marker-end:url(#a)}.back{stroke:#d9534f;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#a)}.decision{fill:#fff8e8;stroke:#b7791f;stroke-width:1.8}.dt{font-size:14px;font-weight:700;text-anchor:middle}.note{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.3;rx:9}.nt{font-size:11.2px;font-weight:700;text-anchor:middle;fill:#92400e}.core{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.5;rx:10}.cv{font-size:14.1px;font-weight:700;text-anchor:middle;fill:#166534}.tagR{fill:#fee2e2}.tagB{fill:#dcecff}.tagO{fill:#fff1cf}</style></defs><rect width="1200" height="1280" fill="#fff"/><text x="600" y="40" class="t">정규화 전후 비교와 JOIN</text><text x="600" y="68" class="s">정규화는 저장의 중복을 줄이고, JOIN은 분리된 관계를 따라 필요한 업무 화면을 읽는 시점에 복원한다</text><rect x="35" y="100" width="1130" height="300" class="panel before"/><text x="60" y="132" class="pt">1. 정규화 전 · 한 테이블에서 바로 조회하지만 사실이 반복 저장됨</text><rect x="55" y="165" width="1090" height="150" class="table"/><rect x="55" y="165" width="1090" height="38" class="headR"/><text x="105" y="189" class="th">loan_id</text><text x="225" y="189" class="th">member_name</text><text x="390" y="189" class="th">member_email</text><text x="590" y="189" class="th">book_title</text><text x="755" y="189" class="th">author</text><text x="895" y="189" class="th">borrowed_at</text><text x="1045" y="189" class="th">due_at</text><line x1="55" y1="203" x2="1145" y2="203" class="line"/><line x1="55" y1="240" x2="1145" y2="240" class="line"/><line x1="55" y1="277" x2="1145" y2="277" class="line"/><line x1="150" y1="165" x2="150" y2="315" class="line"/><line x1="305" y1="165" x2="305" y2="315" class="line"/><line x1="475" y1="165" x2="475" y2="315" class="line"/><line x1="690" y1="165" x2="690" y2="315" class="line"/><line x1="825" y1="165" x2="825" y2="315" class="line"/><line x1="970" y1="165" x2="970" y2="315" class="line"/><text x="105" y="227" class="cell">1</text><text x="225" y="227" class="repeat">김민지</text><text x="390" y="227" class="repeat">minji@example.com</text><text x="590" y="227" class="repeat">데이터베이스 입문</text><text x="755" y="227" class="repeat">문길래</text><text x="895" y="227" class="cell">04-01</text><text x="1045" y="227" class="cell">04-15</text><text x="105" y="264" class="cell">2</text><text x="225" y="264" class="repeat">김민지</text><text x="390" y="264" class="repeat">minji@example.com</text><text x="590" y="264" class="cell">SQL 기초</text><text x="755" y="264" class="cell">홍길동</text><text x="895" y="264" class="cell">04-02</text><text x="1045" y="264" class="cell">04-16</text><text x="105" y="301" class="cell">3</text><text x="225" y="301" class="cell">이준호</text><text x="390" y="301" class="cell">junho@example.com</text><text x="590" y="301" class="repeat">데이터베이스 입문</text><text x="755" y="301" class="repeat">문길래</text><text x="895" y="301" class="cell">04-03</text><text x="1045" y="301" class="cell">04-17</text><rect x="65" y="335" width="330" height="42" class="box green"/><text x="230" y="353" class="h">읽기 장점</text><text x="230" y="370" class="m">한 테이블 SELECT로 통합 화면을 만들기 쉬움</text><rect x="435" y="335" width="330" height="42" class="box red"/><text x="600" y="353" class="h">쓰기 위험</text><text x="600" y="370" class="m">한 사실 변경에 여러 행 수정·누락·불일치 가능</text><rect x="805" y="335" width="330" height="42" class="box orange"/><text x="970" y="353" class="h">구조적 비용</text><text x="970" y="370" class="m">독립 INSERT와 안전한 사건 DELETE가 어려움</text><rect x="35" y="430" width="1130" height="285" class="panel after"/><text x="60" y="462" class="pt">2. 정규화 후 · 각 사실을 한 번 저장하고 PK·FK로 연결</text><rect x="55" y="505" width="300" height="155" class="table"/><rect x="55" y="505" width="300" height="38" class="headB"/><text x="205" y="529" class="th">members</text><text x="205" y="568" class="h">회원당 한 행</text><text x="205" y="594" class="code">id PK · name</text><text x="205" y="617" class="code">email UNIQUE · joined_at</text><text x="205" y="642" class="m">회원 정보는 한 곳에서만 변경</text><rect x="450" y="485" width="300" height="195" class="table"/><rect x="450" y="485" width="300" height="38" class="headO"/><text x="600" y="509" class="th">loans</text><text x="600" y="548" class="h">대여 발생당 한 행</text><text x="600" y="574" class="code">id PK</text><text x="600" y="597" class="code">member_id FK · book_id FK</text><text x="600" y="620" class="code">borrowed_at · due_at</text><text x="600" y="643" class="code">returned_at NULL 가능</text><text x="600" y="667" class="m">설명값 대신 관계 키와 사건 속성 저장</text><rect x="845" y="505" width="300" height="155" class="table"/><rect x="845" y="505" width="300" height="38" class="headB"/><text x="995" y="529" class="th">books</text><text x="995" y="568" class="h">책당 한 행</text><text x="995" y="594" class="code">id PK · title · author</text><text x="995" y="617" class="code">published_year · isbn UNIQUE</text><text x="995" y="642" class="m">책 정보는 대여와 독립적으로 관리</text><path d="M355 590H450" class="relB"/><path d="M845 610H750" class="relO"/><text x="402" y="575" class="m">1 : 0..N</text><text x="797" y="595" class="m">0..N : 1</text><rect x="190" y="685" width="820" height="22" class="box green"/><text x="600" y="701" class="code">한 사실을 한 곳에 저장 · FK로 잘못된 참조 차단 · 회원·책·대여의 수명과 변경 규칙 분리</text><rect x="35" y="745" width="1130" height="295" class="panel join"/><text x="60" y="777" class="pt">3. 필요한 화면은 JOIN으로 읽는 시점에 복원</text><rect x="55" y="815" width="500" height="165" class="box gray"/><rect x="55" y="815" width="500" height="34" class="tagO" rx="10"/><text x="305" y="838" class="h">조회 SQL</text><text x="82" y="872" class="codeL">SELECT l.id, m.name, b.title,</text><text x="82" y="894" class="codeL">       l.borrowed_at, l.due_at</text><text x="82" y="916" class="codeL">FROM loans l</text><text x="82" y="938" class="codeL">JOIN members m ON l.member_id = m.id</text><text x="82" y="960" class="codeL">JOIN books b ON l.book_id = b.id;</text><path d="M555 897H625" class="arr"/><text x="590" y="884" class="m">결과 생성</text><rect x="625" y="815" width="520" height="165" class="table"/><rect x="625" y="815" width="520" height="34" class="headB"/><text x="665" y="838" class="th">id</text><text x="770" y="838" class="th">member_name</text><text x="930" y="838" class="th">book_title</text><text x="1070" y="838" class="th">borrowed</text><line x1="625" y1="849" x2="1145" y2="849" class="line"/><line x1="625" y1="893" x2="1145" y2="893" class="line"/><line x1="625" y1="937" x2="1145" y2="937" class="line"/><line x1="705" y1="815" x2="705" y2="980" class="line"/><line x1="840" y1="815" x2="840" y2="980" class="line"/><line x1="1020" y1="815" x2="1020" y2="980" class="line"/><text x="665" y="878" class="cell">1</text><text x="772" y="878" class="cell">김민지</text><text x="930" y="878" class="cell">데이터베이스 입문</text><text x="1080" y="878" class="cell">04-01</text><text x="665" y="922" class="cell">2</text><text x="772" y="922" class="cell">김민지</text><text x="930" y="922" class="cell">SQL 기초</text><text x="1080" y="922" class="cell">04-02</text><text x="665" y="966" class="cell">3</text><text x="772" y="966" class="cell">이준호</text><text x="930" y="966" class="cell">데이터베이스 입문</text><text x="1080" y="966" class="cell">04-03</text><rect x="210" y="995" width="780" height="27" class="box green"/><text x="600" y="1013" class="m">JOIN은 분리한 데이터를 다시 저장하는 작업이 아니라 PK·FK 관계를 따라 필요한 결과만 임시로 생성</text><rect x="35" y="1070" width="1130" height="125" class="panel verify"/><text x="60" y="1102" class="pt">4. 교환관계와 검증</text><rect x="55" y="1120" width="250" height="50" class="box red"/><text x="180" y="1141" class="h">정규화 전</text><text x="180" y="1161" class="m">읽기 SQL 단순 · 쓰기와 무결성 비용 큼</text><rect x="330" y="1120" width="250" height="50" class="box blue"/><text x="455" y="1141" class="h">정규화 후</text><text x="455" y="1161" class="m">JOIN 필요 · 변경 규칙과 일관성 향상</text><rect x="605" y="1120" width="250" height="50" class="box orange"/><text x="730" y="1141" class="h">의미 검증</text><text x="730" y="1161" class="m">건수·날짜·NULL·JOIN 결과 비교</text><rect x="880" y="1120" width="250" height="50" class="box green"/><text x="1005" y="1141" class="h">성능 검증</text><text x="1005" y="1161" class="m">데이터량·FK 인덱스·실행 계획 측정</text><polygon points="600,1210 720,1240 600,1270 480,1240" class="decision"/><text x="600" y="1236" class="dt">업무 의미·일관성·조회 성능의 균형이 적절한가?</text><text x="600" y="1256" class="m">아니면 테이블 경계·JOIN·제약조건·인덱스를 다시 검토</text><path d="M480 1240H20V575H55" class="back"/><rect x="55" y="1215" width="350" height="42" class="note"/><text x="230" y="1233" class="nt">정규화가 항상 빠르고 JOIN이 항상 느린 것은 아님</text><text x="230" y="1250" class="m">실제 데이터와 조회 패턴으로 확인</text><rect x="795" y="1215" width="350" height="42" class="core"/><text x="970" y="1233" class="cv">저장 모델과 검증된 조회 SQL을 함께 관리</text><text x="970" y="1250" class="m">정규화는 저장, JOIN은 읽기의 역할</text></svg>