<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180" role="img" aria-labelledby="title desc"><title id="title">삽입·수정·삭제 이상</title><desc id="desc">회원, 책, 대여 정보가 섞인 library_records 테이블에서 책만 등록하기 어려운 삽입 이상, 반복된 이메일이 불일치하는 수정 이상, 대여 삭제와 함께 책 정보가 사라지는 삭제 이상을 실제 사례와 정규화된 예방 구조로 비교하는 도식</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}.t{font-size:28px;font-weight:700;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.panel{stroke-width:1.5;rx:15}.start{fill:#fff5f5;stroke:#d9534f}.cases{fill:#f8fafc;stroke:#a8b3c4}.cause{fill:#fff8e8;stroke:#d69e2e}.after{fill:#eef5ff;stroke:#6fa2e8}.pt{font-size:19px;font-weight:700}.box{fill:#fff;stroke-width:1.4;rx:10}.red{stroke:#d9534f}.orange{stroke:#d69e2e}.purple{stroke:#7c5cc4}.blue{stroke:#3b82c4}.green{stroke:#3c9a5f}.gray{stroke:#64748b}.h{font-size:14px;font-weight:700;text-anchor:middle}.m{font-size:11.3px;text-anchor:middle;fill:#475569}.code{font-family:Consolas,D2Coding,monospace;font-size:12.1px;font-weight:700;text-anchor:middle;fill:#334155}.arr{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.cardI{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.5;rx:14}.cardU{fill:#fff5f5;stroke:#d9534f;stroke-width:1.5;rx:14}.cardD{fill:#f5f1ff;stroke:#7c5cc4;stroke-width:1.5;rx:14}.tagI{fill:#fff1cf}.tagU{fill:#fee2e2}.tagD{fill:#ede9fe}.bad{fill:#fff;stroke:#d9534f;stroke-width:1.3;rx:9}.good{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.3;rx:9}.bh{font-size:13.5px;font-weight:700;text-anchor:middle;fill:#b91c1c}.gh{font-size:13.5px;font-weight:700;text-anchor:middle;fill:#166534}.note{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.3;rx:9}.nt{font-size:11.4px;font-weight:700;text-anchor:middle;fill:#92400e}.core{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.5;rx:10}.cv{font-size:14.2px;font-weight:700;text-anchor:middle;fill:#166534}</style></defs><rect width="1200" height="1180" fill="#fff"/><text x="600" y="40" class="t">삽입·수정·삭제 이상</text><text x="600" y="68" class="s">SQL이 성공해도 한 주제의 작업이 다른 주제의 정보를 훼손하면 테이블 설계에 이상 현상이 있는 것이다</text><rect x="35" y="100" width="1130" height="155" class="panel start"/><text x="60" y="132" class="pt">1. 문제 구조: library_records 한 행에 세 종류의 사실이 혼합</text><rect x="70" y="160" width="310" height="58" class="box red"/><text x="225" y="184" class="h">회원 사실</text><text x="225" y="207" class="m">member_name · member_email</text><rect x="445" y="160" width="310" height="58" class="box orange"/><text x="600" y="184" class="h">책 사실</text><text x="600" y="207" class="m">book_title · author</text><rect x="820" y="160" width="310" height="58" class="box purple"/><text x="975" y="184" class="h">대여 사실</text><text x="975" y="207" class="m">loan_id · borrowed_at · due_at</text><text x="600" y="242" class="code">한 주제의 INSERT · UPDATE · DELETE가 다른 주제의 값까지 요구하거나 변경·삭제할 수 있음</text><rect x="35" y="285" width="1130" height="570" class="panel cases"/><text x="60" y="317" class="pt">2. 같은 구조에서 나타나는 세 가지 이상 현상</text><rect x="50" y="350" width="345" height="465" class="cardI"/><rect x="50" y="350" width="345" height="52" class="tagI" rx="14"/><text x="222" y="382" class="h">삽입 이상 · 필요한 사실을 독립 등록할 수 없음</text><rect x="75" y="425" width="295" height="66" class="box orange"/><text x="222" y="449" class="h">업무 의도</text><text x="222" y="473" class="m">아직 대여되지 않은 ‘정규화 입문’ 책만 등록</text><path d="M222 491V515" class="arr"/><rect x="75" y="515" width="295" height="82" class="box gray"/><text x="222" y="539" class="h">큰 테이블의 요구</text><text x="222" y="562" class="m">책 정보 외에 loan_id·회원·대여일도 필요</text><text x="222" y="584" class="code">없는 값을 NULL 또는 가짜 값으로 채워야 함</text><path d="M222 597V621" class="arr"/><rect x="75" y="621" width="295" height="78" class="bad"/><text x="222" y="647" class="bh">의도하지 않은 결과</text><text x="222" y="671" class="m">책 등록을 미루거나 의미 없는 대여 행 생성</text><text x="222" y="691" class="m">독립적인 책 사실이 대여 발생에 종속</text><path d="M222 699V723" class="arr"/><rect x="75" y="723" width="295" height="62" class="good"/><text x="222" y="747" class="gh">정규화된 예방</text><text x="222" y="771" class="code">INSERT INTO books (...)</text><rect x="427" y="350" width="345" height="465" class="cardU"/><rect x="427" y="350" width="345" height="52" class="tagU" rx="14"/><text x="599" y="382" class="h">수정 이상 · 같은 사실의 복사본이 서로 달라짐</text><rect x="452" y="425" width="295" height="66" class="box red"/><text x="599" y="449" class="h">업무 의도</text><text x="599" y="473" class="m">김민지의 이메일을 새 주소로 변경</text><path d="M599 491V515" class="arr"/><rect x="452" y="515" width="295" height="82" class="box gray"/><text x="599" y="539" class="h">반복된 원본</text><text x="599" y="562" class="code">loan 1 · minji@example.com</text><text x="599" y="584" class="code">loan 2 · minji@example.com</text><path d="M599 597V621" class="arr"/><rect x="452" y="621" width="295" height="78" class="bad"/><text x="599" y="647" class="bh">한 행만 수정한 결과</text><text x="599" y="671" class="code">kimminji@example.com ≠ minji@example.com</text><text x="599" y="691" class="m">같은 회원의 최신 이메일을 판단할 수 없음</text><path d="M599 699V723" class="arr"/><rect x="452" y="723" width="295" height="62" class="good"/><text x="599" y="747" class="gh">정규화된 예방</text><text x="599" y="771" class="code">UPDATE members WHERE id = 1</text><rect x="804" y="350" width="345" height="465" class="cardD"/><rect x="804" y="350" width="345" height="52" class="tagD" rx="14"/><text x="976" y="382" class="h">삭제 이상 · 사건 삭제가 대상 정보까지 제거</text><rect x="829" y="425" width="295" height="66" class="box purple"/><text x="976" y="449" class="h">업무 의도</text><text x="976" y="473" class="m">loan_id = 1인 대여 기록만 삭제</text><path d="M976 491V515" class="arr"/><rect x="829" y="515" width="295" height="82" class="box gray"/><text x="976" y="539" class="h">유일한 복사본</text><text x="976" y="562" class="m">그 행에 ‘정규화 입문’ 제목과 저자도 저장</text><text x="976" y="584" class="code">DELETE FROM library_records WHERE loan_id = 1</text><path d="M976 597V621" class="arr"/><rect x="829" y="621" width="295" height="78" class="bad"/><text x="976" y="647" class="bh">의도하지 않은 결과</text><text x="976" y="671" class="m">대여 이력과 함께 책의 제목·저자도 소실</text><text x="976" y="691" class="m">사건 삭제가 책 삭제처럼 작동</text><path d="M976 699V723" class="arr"/><rect x="829" y="723" width="295" height="62" class="good"/><text x="976" y="747" class="gh">정규화된 예방</text><text x="976" y="771" class="code">DELETE loans · books 행은 유지</text><text x="600" y="838" class="m">진단 기준: 한 주제의 작업에 다른 주제의 값이 필요하거나, 다른 주제의 정보가 함께 바뀌거나 사라지는가?</text><rect x="35" y="885" width="1130" height="135" class="panel cause"/><text x="60" y="917" class="pt">3. 세 이상 현상의 공통 원인</text><rect x="60" y="950" width="320" height="48" class="box red"/><text x="220" y="971" class="h">여러 주제를 한 테이블에 혼합</text><text x="220" y="991" class="m">회원·책·대여의 수명과 변경 이유가 다름</text><rect x="440" y="950" width="320" height="48" class="box orange"/><text x="600" y="971" class="h">같은 사실을 여러 행에 복사</text><text x="600" y="991" class="m">한 번의 변경이 여러 저장 위치에 퍼짐</text><rect x="820" y="950" width="320" height="48" class="box purple"/><text x="980" y="971" class="h">작업의 영향 범위가 결합</text><text x="980" y="991" class="m">한 대상의 작업이 다른 대상을 흔듦</text><rect x="35" y="1050" width="1130" height="80" class="panel after"/><text x="60" y="1080" class="pt">4. 해결과 검증</text><rect x="260" y="1070" width="680" height="42" class="box green"/><text x="600" y="1089" class="h">members · books · loans로 주제를 분리하고 PK·FK로 연결</text><text x="600" y="1107" class="m">독립 INSERT · 한 곳 UPDATE · 안전한 사건 DELETE · JOIN 복원이 가능한지 확인</text><rect x="55" y="1145" width="350" height="30" class="note"/><text x="230" y="1165" class="nt">이상 현상은 문법 오류가 아니라 설계 오류</text><rect x="425" y="1145" width="350" height="30" class="note"/><text x="600" y="1165" class="nt">SQL 성공 여부와 업무 의미 보존을 함께 확인</text><rect x="795" y="1145" width="350" height="30" class="core"/><text x="970" y="1165" class="cv">한 사실을 한 곳에 저장하면 세 이상을 함께 줄일 수 있음</text></svg>