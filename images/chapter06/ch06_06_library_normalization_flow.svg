<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2040" viewBox="0 0 1200 2040" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision"><title id="title">도서 대여 테이블 정규화 흐름</title><desc id="desc">회원, 도서, 대여 사실이 섞인 library_records를 사실의 주인과 함수 종속에 따라 members, books, loans로 분리한다. 이름이나 제목만으로 중복 대상을 병합하지 않고 이메일과 ISBN 같은 업무 식별 규칙을 확인하며, 원본 보존과 스테이징, 부모 키 매핑, 자식 행 이관, 외래키와 JOIN 결과 검증을 거쳐 정규화된 구조로 전환하는 절차를 설명한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2f6fad"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b7791f"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c2413b"/></marker><style> text{font-family:Malgun Gothic,NanumSquare,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033} .title{font-size:30px;font-weight:700;text-anchor:middle} .subtitle{font-size:16px;text-anchor:middle;fill:#475569} .section-title{font-size:19px;font-weight:700} .section-sub{font-size:14px;fill:#475569} .card-title{font-size:15px;font-weight:700;text-anchor:middle} .card-text{font-size:13px;text-anchor:middle;fill:#475569} .card-text-small{font-size:12px;text-anchor:middle;fill:#475569} .mono{font-family:Consolas,D2Coding,Noto Sans Mono CJK KR,Menlo,monospace;font-size:12.3px;text-anchor:middle;fill:#334155} .mono-small{font-family:Consolas,D2Coding,Noto Sans Mono CJK KR,Menlo,monospace;font-size:11.5px;text-anchor:middle;fill:#334155} .badge{font-size:12px;font-weight:700;text-anchor:middle;dominant-baseline:middle;fill:#ffffff} .flow{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#arrow)} .ref-blue{stroke:#2f6fad;stroke-width:2.2;fill:none;marker-end:url(#arrow-blue)} .ref-orange{stroke:#b7791f;stroke-width:2.2;fill:none;marker-end:url(#arrow-orange)} .retry{stroke:#c2413b;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow-red)} .decision{font-size:14px;font-weight:700;text-anchor:middle} .ok{font-size:13px;font-weight:700;text-anchor:middle;fill:#166534} .no{font-size:13px;font-weight:700;text-anchor:middle;fill:#b42318} .note-title{font-size:14px;font-weight:700;text-anchor:middle;fill:#92400e} .note-text{font-size:12.4px;text-anchor:middle;fill:#475569} .principle{font-size:16.5px;font-weight:700;text-anchor:middle;fill:#166534} .table-title{font-size:16px;font-weight:700;text-anchor:middle} .th{font-size:11.2px;font-weight:700;text-anchor:middle;fill:#334155} .cell{font-size:10.5px;text-anchor:middle;fill:#334155} .repeat{font-size:10.5px;font-weight:700;text-anchor:middle;fill:#b91c1c} .line{stroke:#cbd5e1;stroke-width:1} .pk{font-size:11px;font-weight:700;fill:#1d4ed8} .fk{font-size:11px;font-weight:700;fill:#92400e} </style></defs><rect width="1200" height="2040" fill="#ffffff"/><text x="600" y="42" class="title">도서 대여 테이블 정규화 흐름</text><text x="600" y="72" class="subtitle">서로 다른 사실의 주인을 분리하고 PK·FK로 다시 연결한 뒤, 이관 결과와 JOIN 의미까지 검증한다</text><rect x="34" y="98" width="1132" height="330" rx="16" fill="#fff5f5" stroke="#d9534f" stroke-width="1.6"/><text x="58" y="132" class="section-title">1. 정규화 전: 한 행에 회원·도서·대여 사실이 혼합</text><text x="510" y="132" class="section-sub">원자값으로 저장되어 있어도 서로 다른 업무 주제가 한 테이블에 섞일 수 있다</text><rect x="54" y="162" width="1092" height="166" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.4"/><rect x="54" y="162" width="1092" height="38" rx="10" fill="#fee2e2"/><text x="105" y="186" class="th">loan_id</text><text x="210" y="186" class="th">member_name</text><text x="370" y="186" class="th">member_email</text><text x="565" y="186" class="th">book_title</text><text x="720" y="186" class="th">author</text><text x="845" y="186" class="th">borrowed_at</text><text x="965" y="186" class="th">due_at</text><text x="1080" y="186" class="th">returned_at</text><line x1="54" y1="200" x2="1146" y2="200" class="line"/><line x1="54" y1="242" x2="1146" y2="242" class="line"/><line x1="54" y1="284" x2="1146" y2="284" class="line"/><line x1="150" y1="162" x2="150" y2="328" class="line"/><line x1="285" y1="162" x2="285" y2="328" class="line"/><line x1="455" y1="162" x2="455" y2="328" class="line"/><line x1="660" y1="162" x2="660" y2="328" class="line"/><line x1="780" y1="162" x2="780" y2="328" class="line"/><line x1="905" y1="162" x2="905" y2="328" class="line"/><line x1="1025" y1="162" x2="1025" y2="328" class="line"/><text x="105" y="227" class="cell">1</text><text x="210" y="227" class="repeat">김민지</text><text x="370" y="227" class="repeat">minji@example.com</text><text x="565" y="227" class="repeat">데이터베이스 입문</text><text x="720" y="227" class="repeat">문길래</text><text x="845" y="227" class="cell">04-01</text><text x="965" y="227" class="cell">04-15</text><text x="1080" y="227" class="cell">NULL</text><text x="105" y="269" class="cell">2</text><text x="210" y="269" class="repeat">김민지</text><text x="370" y="269" class="repeat">minji@example.com</text><text x="565" y="269" class="cell">SQL 기초</text><text x="720" y="269" class="cell">홍길동</text><text x="845" y="269" class="cell">04-02</text><text x="965" y="269" class="cell">04-16</text><text x="1080" y="269" class="cell">04-10</text><text x="105" y="311" class="cell">3</text><text x="210" y="311" class="cell">이준호</text><text x="370" y="311" class="cell">junho@example.com</text><text x="565" y="311" class="repeat">데이터베이스 입문</text><text x="720" y="311" class="repeat">문길래</text><text x="845" y="311" class="cell">04-03</text><text x="965" y="311" class="cell">04-17</text><text x="1080" y="311" class="cell">NULL</text><rect x="58" y="350" width="330" height="50" rx="10" fill="#ffffff" stroke="#d9534f" stroke-width="1.4"/><text x="223" y="371" class="card-title">수정 이상</text><text x="223" y="391" class="card-text-small">이메일·저자 변경 시 여러 행 수정</text><rect x="435" y="350" width="330" height="50" rx="10" fill="#ffffff" stroke="#d69e2e" stroke-width="1.4"/><text x="600" y="371" class="card-title">삽입 이상</text><text x="600" y="391" class="card-text-small">대여 없이 회원·도서만 등록하기 어려움</text><rect x="812" y="350" width="330" height="50" rx="10" fill="#ffffff" stroke="#7c5cc4" stroke-width="1.4"/><text x="977" y="371" class="card-title">삭제 이상</text><text x="977" y="391" class="card-text-small">마지막 대여 삭제 시 기준 정보도 소실</text><path d="M600 428V452" class="flow"/><rect x="34" y="452" width="1132" height="342" rx="16" fill="#fff8e8" stroke="#d69e2e" stroke-width="1.6"/><text x="58" y="486" class="section-title">2. 사실의 주인과 함수 종속·식별 규칙 확인</text><text x="490" y="486" class="section-sub">반복 횟수가 아니라 어떤 식별자가 어떤 사실을 결정하는지 판단한다</text><rect x="58" y="516" width="330" height="148" rx="11" fill="#ffffff" stroke="#3b82c4" stroke-width="1.5"/><circle cx="88" cy="544" r="15" fill="#2f6fad"/><text x="88" y="544" class="badge">M</text><text x="223" y="548" class="card-title">회원 사실</text><text x="223" y="580" class="mono">member_id → name, email, joined_at</text><text x="223" y="608" class="card-text">회원의 수명과 함께 관리되는 값</text><text x="223" y="635" class="card-text-small">email은 고유하다는 업무 규칙이 있을 때 후보키</text><text x="223" y="655" class="card-text-small">동명이인은 이름으로 병합하지 않음</text><rect x="435" y="516" width="330" height="148" rx="11" fill="#ffffff" stroke="#7c5cc4" stroke-width="1.5"/><circle cx="465" cy="544" r="15" fill="#7c5cc4"/><text x="465" y="544" class="badge">B</text><text x="600" y="548" class="card-title">도서 사실</text><text x="600" y="580" class="mono">book_id → title, author, year, isbn</text><text x="600" y="608" class="card-text">대여 여부와 무관하게 존재하는 기준 정보</text><text x="600" y="635" class="card-text-small">ISBN의 범위와 고유성은 업무 가정으로 확인</text><text x="600" y="655" class="card-text-small">제목만 같다는 이유로 같은 도서라 단정하지 않음</text><rect x="812" y="516" width="330" height="148" rx="11" fill="#ffffff" stroke="#d69e2e" stroke-width="1.5"/><circle cx="842" cy="544" r="15" fill="#b7791f"/><text x="842" y="544" class="badge">L</text><text x="977" y="548" class="card-title">대여 사건 사실</text><text x="977" y="580" class="mono-small">loan_id → member_id, book_id, dates</text><text x="977" y="608" class="card-text">대여 발생 한 건의 시점·상태 값</text><text x="977" y="635" class="card-text-small">borrowed_at · due_at은 필수</text><text x="977" y="655" class="card-text-small">returned_at NULL은 미반납 상태</text><rect x="92" y="690" width="1016" height="72" rx="11" fill="#fff5f5" stroke="#d9534f" stroke-width="1.4"/><text x="600" y="716" class="card-title">중복 정리는 식별 규칙이 먼저</text><text x="600" y="741" class="card-text">SELECT DISTINCT name, title만으로 병합하지 않는다. 오타·변경된 이메일·동명이인·ISBN 범위를 확인하고 병합 근거와 예외를 기록한다.</text><path d="M600 794V818" class="flow"/><rect x="34" y="818" width="1132" height="374" rx="16" fill="#eef5ff" stroke="#6fa2e8" stroke-width="1.6"/><text x="58" y="852" class="section-title">3. 정규화 후: members · books · loans로 분리</text><text x="450" y="852" class="section-sub">각 테이블은 한 가지 업무 주제를 표현하고, 관계는 N쪽 외래키로 연결한다</text><rect x="54" y="886" width="306" height="218" rx="11" fill="#ffffff" stroke="#3b82c4" stroke-width="1.5"/><rect x="54" y="886" width="306" height="42" rx="11" fill="#dcecff"/><text x="207" y="913" class="table-title">members</text><text x="76" y="958" class="pk">PK</text><text x="130" y="958" class="mono-small">id</text><text x="130" y="986" class="mono-small">name NOT NULL</text><text x="76" y="1014" class="pk">UK</text><text x="130" y="1014" class="mono-small">email NOT NULL</text><text x="130" y="1042" class="mono-small">joined_at NOT NULL</text><text x="207" y="1078" class="card-text-small">회원 한 명당 한 행</text><rect x="447" y="866" width="306" height="258" rx="11" fill="#ffffff" stroke="#d69e2e" stroke-width="1.6"/><rect x="447" y="866" width="306" height="42" rx="11" fill="#fff1cf"/><text x="600" y="893" class="table-title">loans</text><text x="469" y="936" class="pk">PK</text><text x="523" y="936" class="mono-small">id</text><text x="469" y="964" class="fk">FK</text><text x="523" y="964" class="mono-small">member_id NOT NULL</text><text x="469" y="992" class="fk">FK</text><text x="523" y="992" class="mono-small">book_id NOT NULL</text><text x="523" y="1020" class="mono-small">borrowed_at NOT NULL</text><text x="523" y="1048" class="mono-small">due_at NOT NULL</text><text x="523" y="1076" class="mono-small">returned_at NULL 가능</text><text x="600" y="1110" class="card-text-small">대여 사건 한 건당 한 행</text><rect x="840" y="886" width="306" height="218" rx="11" fill="#ffffff" stroke="#7c5cc4" stroke-width="1.5"/><rect x="840" y="886" width="306" height="42" rx="11" fill="#ede9fe"/><text x="993" y="913" class="table-title">books</text><text x="862" y="958" class="pk">PK</text><text x="916" y="958" class="mono-small">id</text><text x="916" y="986" class="mono-small">title NOT NULL</text><text x="916" y="1014" class="mono-small">author NOT NULL</text><text x="916" y="1042" class="mono-small">published_year NULL 가능</text><text x="862" y="1070" class="pk">UK</text><text x="916" y="1070" class="mono-small">isbn NOT NULL</text><text x="993" y="1094" class="card-text-small">단순 예제: 복본을 구분하지 않음</text><path d="M447 964H392V958H360" class="ref-blue"/><path d="M753 992H808V958H840" class="ref-orange"/><text x="403" y="945" class="card-text-small">FK → PK</text><text x="797" y="945" class="card-text-small">FK → PK</text><rect x="92" y="1144" width="1016" height="28" rx="9" fill="#dfeeff" stroke="#6fa2e8" stroke-width="1.1"/><text x="600" y="1163" class="card-text-small">members 1 : 0..N loans · books 1 : 0..N loans · JOIN으로 회원·도서·대여 정보를 다시 결합</text><path d="M600 1192V1216" class="flow"/><rect x="34" y="1216" width="1132" height="390" rx="16" fill="#fff8e8" stroke="#d69e2e" stroke-width="1.6"/><text x="58" y="1250" class="section-title">4. 실제 데이터 이관은 원본을 보존하고 단계적으로 수행</text><text x="515" y="1250" class="section-sub">정규화 설계와 운영 데이터 변환은 별도 검증이 필요한 작업이다</text><rect x="58" y="1282" width="250" height="120" rx="11" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><circle cx="88" cy="1310" r="15" fill="#64748b"/><text x="88" y="1310" class="badge">1</text><text x="183" y="1314" class="card-title">원본·스테이징 보존</text><text x="183" y="1344" class="card-text">원본 테이블을 직접 덮어쓰지 않기</text><text x="183" y="1368" class="card-text-small">백업·읽기 전용 복사·롤백 기준 확보</text><text x="183" y="1390" class="card-text-small">이관 대상 범위와 제외 규칙 고정</text><rect x="337" y="1282" width="250" height="120" rx="11" fill="#ffffff" stroke="#3b82c4" stroke-width="1.5"/><circle cx="367" cy="1310" r="15" fill="#2f6fad"/><text x="367" y="1310" class="badge">2</text><text x="462" y="1314" class="card-title">부모 데이터 정리·적재</text><text x="462" y="1344" class="card-text">회원·도서 중복 후보를 검토</text><text x="462" y="1368" class="card-text-small">병합 근거가 확인된 행만 통합</text><text x="462" y="1390" class="card-text-small">members와 books에 새 PK 생성</text><rect x="616" y="1282" width="250" height="120" rx="11" fill="#ffffff" stroke="#7c5cc4" stroke-width="1.5"/><circle cx="646" cy="1310" r="15" fill="#7c5cc4"/><text x="646" y="1310" class="badge">3</text><text x="741" y="1314" class="card-title">키 매핑표 생성</text><text x="741" y="1344" class="card-text">원본 값 → 새 member_id·book_id</text><text x="741" y="1368" class="card-text-small">매핑 실패·복수 후보는 자동 처리 금지</text><text x="741" y="1390" class="card-text-small">수동 검토 대기 목록으로 분리</text><rect x="895" y="1282" width="250" height="120" rx="11" fill="#ffffff" stroke="#d69e2e" stroke-width="1.5"/><circle cx="925" cy="1310" r="15" fill="#b7791f"/><text x="925" y="1310" class="badge">4</text><text x="1020" y="1314" class="card-title">대여 행 적재</text><text x="1020" y="1344" class="card-text">매핑된 두 FK와 날짜를 INSERT</text><text x="1020" y="1368" class="card-text-small">제약조건 오류는 원인을 수정</text><text x="1020" y="1390" class="card-text-small">오류를 피하려고 FK를 제거하지 않음</text><path d="M308 1342H337" class="flow"/><path d="M587 1342H616" class="flow"/><path d="M866 1342H895" class="flow"/><rect x="76" y="1434" width="326" height="126" rx="11" fill="#ffffff" stroke="#3c9a5f" stroke-width="1.5"/><text x="239" y="1462" class="card-title">구조·제약 검증</text><text x="239" y="1492" class="card-text">PK·UK·FK·NOT NULL·NULL 허용 확인</text><text x="239" y="1517" class="card-text">고아 FK 0건·중복 위반 0건</text><text x="239" y="1542" class="card-text-small">필요한 CHECK·삭제 정책도 검토</text><rect x="437" y="1434" width="326" height="126" rx="11" fill="#ffffff" stroke="#3b82c4" stroke-width="1.5"/><text x="600" y="1462" class="card-title">건수·값 검증</text><text x="600" y="1492" class="card-text">정의한 제외·병합 규칙 후 대여 건수 일치</text><text x="600" y="1517" class="card-text">날짜·NULL·회원·도서 매핑 표본 비교</text><text x="600" y="1542" class="card-text-small">부모 건수는 단순 원본 DISTINCT 수와 다를 수 있음</text><rect x="798" y="1434" width="326" height="126" rx="11" fill="#ffffff" stroke="#7c5cc4" stroke-width="1.5"/><text x="961" y="1462" class="card-title">의미·JOIN 검증</text><text x="961" y="1492" class="card-text">새 JOIN 결과가 원본 업무 의미를 복원</text><text x="961" y="1517" class="card-text">회원·도서 독립 INSERT와 안전한 수정 확인</text><text x="961" y="1542" class="card-text-small">대표 질의와 오류 시나리오를 함께 실행</text><path d="M600 1606V1630" class="flow"/><rect x="34" y="1630" width="1132" height="214" rx="16" fill="#f2fbf5" stroke="#62b47a" stroke-width="1.6"/><text x="58" y="1664" class="section-title">5. 정규화 결과와 이관 품질을 함께 판정</text><text x="405" y="1664" class="section-sub">테이블 생성 성공이 아니라 의존·무결성·업무 의미 보존을 확인한다</text><rect x="64" y="1696" width="320" height="96" rx="11" fill="#ffffff" stroke="#3c9a5f" stroke-width="1.5"/><text x="224" y="1724" class="card-title">중복과 이상 감소</text><text x="224" y="1752" class="card-text">회원·도서 사실은 한 곳에서 관리</text><text x="224" y="1776" class="card-text-small">독립 등록·수정·삭제가 가능</text><rect x="440" y="1696" width="320" height="96" rx="11" fill="#ffffff" stroke="#3b82c4" stroke-width="1.5"/><text x="600" y="1724" class="card-title">무결성과 재구성</text><text x="600" y="1752" class="card-text">모든 대여가 유효한 부모를 참조</text><text x="600" y="1776" class="card-text-small">JOIN으로 원래 업무 의미를 손실 없이 복원</text><rect x="816" y="1696" width="320" height="96" rx="11" fill="#ffffff" stroke="#7c5cc4" stroke-width="1.5"/><text x="976" y="1724" class="card-title">추적성과 전환 준비</text><text x="976" y="1752" class="card-text">병합·제외·매핑 규칙과 검증 결과 기록</text><text x="976" y="1776" class="card-text-small">승인 후 전환하고 원본·롤백 경로 유지</text><path d="M600 1844V1868" class="flow"/><polygon points="600,1868 758,1912 600,1956 442,1912" fill="#fff8e8" stroke="#b7791f" stroke-width="1.8"/><text x="600" y="1907" class="decision">의존 관계·행 매핑·제약조건·JOIN 결과가 모두 예상과 일치하는가?</text><text x="600" y="1931" class="card-text">불일치하면 식별 규칙, 병합 근거, 키 매핑 또는 모델 구조를 다시 검토</text><path d="M442 1912H20V716H92" class="retry"/><text x="382" y="1899" class="no">아니오 · 원인 단계로 복귀</text><rect x="808" y="1880" width="334" height="64" rx="11" fill="#ecfdf3" stroke="#62b47a" stroke-width="1.6"/><text x="975" y="1905" class="card-title">예 · 정규화 구조 기준선 확정</text><text x="975" y="1930" class="card-text-small">ERD·DDL·이관 규칙·검증 증거를 같은 버전으로 저장</text><path d="M758 1912H808" class="flow"/><text x="783" y="1899" class="ok">예</text><rect x="54" y="1972" width="344" height="44" rx="11" fill="#fff8e8" stroke="#d69e2e" stroke-width="1.4"/><text x="226" y="1990" class="note-title">정규화와 이관은 다르다</text><text x="226" y="2008" class="note-text">좋은 목표 구조와 안전한 변환 절차를 모두 설계한다</text><rect x="428" y="1972" width="344" height="44" rx="11" fill="#fff8e8" stroke="#d69e2e" stroke-width="1.4"/><text x="600" y="1990" class="note-title">중복은 근거로 판정</text><text x="600" y="2008" class="note-text">이름·제목의 동일성만으로 같은 대상을 병합하지 않는다</text><rect x="802" y="1972" width="344" height="44" rx="11" fill="#ecfdf3" stroke="#62b47a" stroke-width="1.4"/><text x="974" y="1990" class="note-title" fill="#166534">핵심 원칙</text><text x="974" y="2008" class="note-text">사실의 주인 분리 → PK·FK 연결 → 증거 기반 검증</text></svg>