<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1220" viewBox="0 0 1200 1220" role="img" aria-labelledby="title desc"><title id="title">도서 대여 테이블 정규화</title><desc id="desc">회원, 책, 대여 사실이 섞인 library_records를 사실의 주인과 의존 관계에 따라 members, books, loans로 분리하고 기본키와 외래키를 도입한 뒤 중복 데이터 정리, 이관, 건수와 JOIN 결과를 검증하는 흐름</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}.t{font-size:28px;font-weight:700;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.panel{stroke-width:1.5;rx:15}.before{fill:#fff5f5;stroke:#d9534f}.classify{fill:#fff8e8;stroke:#d69e2e}.after{fill:#eef5ff;stroke:#6fa2e8}.verify{fill:#f2fbf5;stroke:#8bc9a0}.pt{font-size:19px;font-weight:700}.table{fill:#fff;stroke:#64748b;stroke-width:1.4;rx:9}.headR{fill:#fee2e2}.headB{fill:#dcecff}.headO{fill:#fff1cf}.th{font-size:12.3px;font-weight:700;text-anchor:middle}.cell{font-size:10.3px;text-anchor:middle;fill:#334155}.repeat{font-size:10.3px;font-weight:700;text-anchor:middle;fill:#b91c1c}.line{stroke:#cbd5e1;stroke-width:1}.box{fill:#fff;stroke-width:1.4;rx:10}.red{stroke:#d9534f}.orange{stroke:#d69e2e}.blue{stroke:#3b82c4}.green{stroke:#3c9a5f}.purple{stroke:#7c5cc4}.gray{stroke:#64748b}.h{font-size:14px;font-weight:700;text-anchor:middle}.m{font-size:11.3px;text-anchor:middle;fill:#475569}.code{font-family:Consolas,D2Coding,monospace;font-size:12px;font-weight:700;text-anchor:middle;fill:#334155}.arr{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.relB{stroke:#3b82c4;stroke-width:2.2;fill:none;marker-end:url(#a)}.relO{stroke:#d69e2e;stroke-width:2.2;fill:none;marker-end:url(#a)}.back{stroke:#d9534f;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#a)}.decision{fill:#fff8e8;stroke:#b7791f;stroke-width:1.8}.dt{font-size:14px;font-weight:700;text-anchor:middle}.note{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.3;rx:9}.nt{font-size:11.2px;font-weight:700;text-anchor:middle;fill:#92400e}.core{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.5;rx:10}.cv{font-size:14.2px;font-weight:700;text-anchor:middle;fill:#166534}.tagM{fill:#dcecff}.tagK{fill:#ede9fe}.tagL{fill:#fff1cf}</style></defs><rect width="1200" height="1220" fill="#fff"/><text x="600" y="40" class="t">도서 대여 테이블 정규화</text><text x="600" y="68" class="s">서로 다른 사실의 주인을 찾고 PK·FK로 다시 연결한 뒤, 데이터 이관과 JOIN 결과까지 검증한다</text><rect x="35" y="100" width="1130" height="280" class="panel before"/><text x="60" y="132" class="pt">1. 정규화 전: 한 행에 회원·책·대여 사실이 혼합</text><rect x="55" y="165" width="1090" height="150" class="table"/><rect x="55" y="165" width="1090" height="38" class="headR"/><text x="105" y="189" class="th">loan_id</text><text x="225" y="189" class="th">member_name</text><text x="390" y="189" class="th">member_email</text><text x="590" y="189" class="th">book_title</text><text x="755" y="189" class="th">author</text><text x="895" y="189" class="th">borrowed_at</text><text x="1045" y="189" class="th">returned_at</text><line x1="55" y1="203" x2="1145" y2="203" class="line"/><line x1="55" y1="240" x2="1145" y2="240" class="line"/><line x1="55" y1="277" x2="1145" y2="277" class="line"/><line x1="150" y1="165" x2="150" y2="315" class="line"/><line x1="305" y1="165" x2="305" y2="315" class="line"/><line x1="475" y1="165" x2="475" y2="315" class="line"/><line x1="690" y1="165" x2="690" y2="315" class="line"/><line x1="825" y1="165" x2="825" y2="315" class="line"/><line x1="970" y1="165" x2="970" y2="315" class="line"/><text x="105" y="227" class="cell">1</text><text x="225" y="227" class="repeat">김민지</text><text x="390" y="227" class="repeat">minji@example.com</text><text x="590" y="227" class="repeat">데이터베이스 입문</text><text x="755" y="227" class="repeat">문길래</text><text x="895" y="227" class="cell">04-01</text><text x="1045" y="227" class="cell">NULL</text><text x="105" y="264" class="cell">2</text><text x="225" y="264" class="repeat">김민지</text><text x="390" y="264" class="repeat">minji@example.com</text><text x="590" y="264" class="cell">SQL 기초</text><text x="755" y="264" class="cell">홍길동</text><text x="895" y="264" class="cell">04-02</text><text x="1045" y="264" class="cell">04-10</text><text x="105" y="301" class="cell">3</text><text x="225" y="301" class="cell">이준호</text><text x="390" y="301" class="cell">junho@example.com</text><text x="590" y="301" class="repeat">데이터베이스 입문</text><text x="755" y="301" class="repeat">문길래</text><text x="895" y="301" class="cell">04-03</text><text x="1045" y="301" class="cell">NULL</text><text x="600" y="340" class="m">회원·책 설명값은 대여가 생길 때마다 반복되고, 날짜와 반납 상태는 대여 사건마다 달라진다</text><text x="600" y="363" class="code">근본 문제 · 한 행이 서로 다른 대상과 수명의 사실을 동시에 표현</text><rect x="35" y="410" width="1130" height="230" class="panel classify"/><text x="60" y="442" class="pt">2. 컬럼의 주인과 식별 규칙 결정</text><rect x="55" y="475" width="330" height="115" class="box blue"/><rect x="55" y="475" width="330" height="34" class="tagM" rx="10"/><text x="220" y="498" class="h">회원 사실</text><text x="220" y="530" class="code">name · email · joined_at</text><text x="220" y="554" class="m">members.id PK</text><text x="220" y="577" class="m">email UNIQUE NOT NULL</text><rect x="435" y="475" width="330" height="115" class="box purple"/><rect x="435" y="475" width="330" height="34" class="tagK" rx="10"/><text x="600" y="498" class="h">책 사실</text><text x="600" y="530" class="code">title · author · year · isbn</text><text x="600" y="554" class="m">books.id PK</text><text x="600" y="577" class="m">isbn UNIQUE NOT NULL</text><rect x="815" y="475" width="330" height="115" class="box orange"/><rect x="815" y="475" width="330" height="34" class="tagL" rx="10"/><text x="980" y="498" class="h">대여 사건 사실</text><text x="980" y="530" class="code">borrowed_at · due_at · returned_at</text><text x="980" y="554" class="m">loans.id PK</text><text x="980" y="577" class="m">returned_at NULL = 미반납</text><rect x="205" y="600" width="790" height="24" class="box red"/><text x="600" y="617" class="m">원본에 member_id·book_id가 없어도 안정적인 PK를 만들고, 대여 행에는 설명값 대신 두 FK를 저장</text><rect x="35" y="670" width="1130" height="300" class="panel after"/><text x="60" y="702" class="pt">3. members · books · loans로 분리하고 관계 연결</text><rect x="55" y="745" width="300" height="160" class="table"/><rect x="55" y="745" width="300" height="38" class="headB"/><text x="205" y="769" class="th">members</text><text x="205" y="807" class="h">회원당 한 행</text><text x="205" y="833" class="code">id PK</text><text x="205" y="856" class="code">name · email UK</text><text x="205" y="879" class="code">joined_at</text><rect x="450" y="725" width="300" height="200" class="table"/><rect x="450" y="725" width="300" height="38" class="headO"/><text x="600" y="749" class="th">loans</text><text x="600" y="787" class="h">대여 발생당 한 행</text><text x="600" y="813" class="code">id PK</text><text x="600" y="836" class="code">member_id FK · book_id FK</text><text x="600" y="859" class="code">borrowed_at · due_at</text><text x="600" y="882" class="code">returned_at NULL 가능</text><text x="600" y="910" class="m">각 행은 회원 1명과 책 1권을 반드시 참조</text><rect x="845" y="745" width="300" height="160" class="table"/><rect x="845" y="745" width="300" height="38" class="headB"/><text x="995" y="769" class="th">books</text><text x="995" y="807" class="h">책당 한 행</text><text x="995" y="833" class="code">id PK</text><text x="995" y="856" class="code">title · author · year</text><text x="995" y="879" class="code">isbn UK</text><path d="M355 835H450" class="relB"/><path d="M845 855H750" class="relO"/><text x="402" y="820" class="m">1 : 0..N</text><text x="797" y="840" class="m">0..N : 1</text><rect x="210" y="935" width="780" height="24" class="box green"/><text x="600" y="952" class="code">회원·책 사실은 한 번만 저장 · loans는 두 FK와 사건 속성만 저장 · JOIN으로 원래 화면 복원</text><rect x="35" y="1000" width="1130" height="130" class="panel verify"/><text x="60" y="1032" class="pt">4. 중복 정리·이관·검증</text><rect x="55" y="1055" width="250" height="48" class="box blue"/><text x="180" y="1076" class="h">회원 중복 판정</text><text x="180" y="1096" class="m">email·동명이인·오타 확인</text><rect x="330" y="1055" width="250" height="48" class="box purple"/><text x="455" y="1076" class="h">책 중복 판정</text><text x="455" y="1096" class="m">ISBN 우선 · 제목만으로 병합 금지</text><rect x="605" y="1055" width="250" height="48" class="box orange"/><text x="730" y="1076" class="h">대여 행 이관</text><text x="730" y="1096" class="m">새 member_id·book_id 매핑</text><rect x="880" y="1055" width="250" height="48" class="box green"/><text x="1005" y="1076" class="h">결과 검증</text><text x="1005" y="1096" class="m">건수·날짜·NULL·JOIN 비교</text><polygon points="600,1145 720,1175 600,1205 480,1175" class="decision"/><text x="600" y="1171" class="dt">중복은 줄고 모든 대여 의미가 보존됐는가?</text><text x="600" y="1191" class="m">아니면 중복 판정·키 매핑·경계·제약조건을 다시 확인</text><path d="M480 1175H20V520H55" class="back"/><rect x="55" y="1148" width="350" height="42" class="note"/><text x="230" y="1166" class="nt">정규형 이름보다 실제 데이터 의존과 업무 주제 확인</text><text x="230" y="1183" class="m">이름·제목이 같다는 이유만으로 같은 대상이라 단정하지 않음</text><rect x="795" y="1148" width="350" height="42" class="core"/><text x="970" y="1166" class="cv">ERD · SQL · 이관 규칙 · 검증 결과 동기화</text><text x="970" y="1183" class="m">설계와 데이터 전환을 하나의 기준선으로 기록</text><rect x="130" y="1208" width="940" height="8" class="core"/></svg>