<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc"><title id="title">정규화가 필요한 이유</title><desc id="desc">회원, 책, 대여 정보를 하나의 library_records 테이블에 함께 저장할 때 실제 값이 반복되고 수정, 삽입, 삭제 이상이 발생하는 과정을 보여 준 뒤 members, books, loans로 분리하여 한 사실을 한 곳에서 관리하고 JOIN으로 관계를 복원하는 흐름</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}.t{font-size:28px;font-weight:700;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.panel{stroke-width:1.5;rx:15}.before{fill:#fff5f5;stroke:#d9534f}.cause{fill:#fff8e8;stroke:#d69e2e}.after{fill:#eef5ff;stroke:#6fa2e8}.verify{fill:#f2fbf5;stroke:#8bc9a0}.pt{font-size:19px;font-weight:700}.table{fill:#fff;stroke:#64748b;stroke-width:1.4;rx:9}.headR{fill:#fee2e2}.headB{fill:#dcecff}.headO{fill:#fff1cf}.th{font-size:13px;font-weight:700;text-anchor:middle}.cell{font-size:10.2px;text-anchor:middle;fill:#334155}.dup{font-size:10.2px;font-weight:700;text-anchor:middle;fill:#b91c1c}.line{stroke:#cbd5e1;stroke-width:1}.box{fill:#fff;stroke-width:1.4;rx:10}.blue{stroke:#3b82c4}.orange{stroke:#d69e2e}.green{stroke:#3c9a5f}.red{stroke:#d9534f}.purple{stroke:#7c5cc4}.h{font-size:14px;font-weight:700;text-anchor:middle}.m{font-size:11.3px;text-anchor:middle;fill:#475569}.code{font-family:Consolas,D2Coding,monospace;font-size:12.4px;font-weight:700;text-anchor:middle;fill:#334155}.arr{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.back{stroke:#d9534f;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#a)}.decision{fill:#fff8e8;stroke:#b7791f;stroke-width:1.8}.dt{font-size:14px;font-weight:700;text-anchor:middle}.note{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.3;rx:9}.nt{font-size:11.3px;font-weight:700;text-anchor:middle;fill:#92400e}.core{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.5;rx:10}.cv{font-size:14.2px;font-weight:700;text-anchor:middle;fill:#166534}</style></defs><rect width="1200" height="1120" fill="#fff"/><text x="600" y="40" class="t">정규화가 필요한 이유</text><text x="600" y="68" class="s">한 사실을 여러 행에 반복 저장하면 값이 어긋나고, 삽입·수정·삭제가 다른 업무 정보까지 흔든다</text><rect x="35" y="100" width="1130" height="300" class="panel before"/><text x="60" y="132" class="pt">1. 하나의 큰 테이블에 회원·책·대여 정보를 함께 저장</text><rect x="60" y="165" width="1080" height="170" class="table"/><rect x="60" y="165" width="1080" height="38" class="headR"/><text x="110" y="189" class="th">loan_id</text><text x="235" y="189" class="th">member_name</text><text x="390" y="189" class="th">member_email</text><text x="585" y="189" class="th">book_title</text><text x="765" y="189" class="th">author</text><text x="915" y="189" class="th">borrowed_at</text><text x="1060" y="189" class="th">due_at</text><line x1="60" y1="203" x2="1140" y2="203" class="line"/><line x1="60" y1="247" x2="1140" y2="247" class="line"/><line x1="60" y1="291" x2="1140" y2="291" class="line"/><line x1="155" y1="165" x2="155" y2="335" class="line"/><line x1="315" y1="165" x2="315" y2="335" class="line"/><line x1="485" y1="165" x2="485" y2="335" class="line"/><line x1="690" y1="165" x2="690" y2="335" class="line"/><line x1="835" y1="165" x2="835" y2="335" class="line"/><line x1="990" y1="165" x2="990" y2="335" class="line"/><text x="108" y="230" class="cell">1</text><text x="235" y="230" class="dup">김민지</text><text x="400" y="230" class="dup">minji@example.com</text><text x="587" y="230" class="dup">데이터베이스 입문</text><text x="762" y="230" class="dup">문길래</text><text x="913" y="230" class="cell">2026-04-01</text><text x="1065" y="230" class="cell">2026-04-15</text><text x="108" y="274" class="cell">2</text><text x="235" y="274" class="dup">김민지</text><text x="400" y="274" class="dup">minji@example.com</text><text x="587" y="274" class="cell">SQL 기초</text><text x="762" y="274" class="cell">홍길동</text><text x="913" y="274" class="cell">2026-04-02</text><text x="1065" y="274" class="cell">2026-04-16</text><text x="108" y="318" class="cell">3</text><text x="235" y="318" class="cell">이준호</text><text x="400" y="318" class="cell">junho@example.com</text><text x="587" y="318" class="dup">데이터베이스 입문</text><text x="762" y="318" class="dup">문길래</text><text x="913" y="318" class="cell">2026-04-03</text><text x="1065" y="318" class="cell">2026-04-17</text><text x="600" y="365" class="m">빨간 값은 같은 회원·책 사실이 대여가 생길 때마다 복사된 부분</text><text x="600" y="387" class="code">한 행이 회원 사실 + 책 사실 + 대여 사실을 동시에 표현</text><rect x="35" y="430" width="1130" height="225" class="panel cause"/><text x="60" y="462" class="pt">2. 반복 저장이 이상 현상으로 이어짐</text><rect x="55" y="495" width="330" height="105" class="box red"/><text x="220" y="522" class="h">수정 이상</text><text x="220" y="547" class="m">김민지 이메일을 여러 행에서 모두 바꿔야 함</text><text x="220" y="570" class="m">한 행을 빠뜨리면 같은 회원에게 이메일이 두 개</text><text x="220" y="591" class="code">최신 값이 무엇인지 불명확</text><rect x="435" y="495" width="330" height="105" class="box orange"/><text x="600" y="522" class="h">삽입 이상</text><text x="600" y="547" class="m">아직 대여되지 않은 새 책만 등록하고 싶어도</text><text x="600" y="570" class="m">회원·대여일 같은 불필요한 값이 함께 필요</text><text x="600" y="591" class="code">독립적인 books 사실 저장이 어려움</text><rect x="815" y="495" width="330" height="105" class="box purple"/><text x="980" y="522" class="h">삭제 이상</text><text x="980" y="547" class="m">책의 마지막 대여 행을 삭제할 때</text><text x="980" y="570" class="m">보존해야 할 제목·저자 정보도 함께 사라질 수 있음</text><text x="980" y="591" class="code">대여 삭제가 책 삭제처럼 작동</text><rect x="245" y="615" width="710" height="25" class="box red"/><text x="600" y="632" class="m">근본 원인: 한 사실을 여러 장소에 저장하고 서로 다른 수명의 업무 대상을 한 테이블에 섞음</text><rect x="35" y="685" width="1130" height="260" class="panel after"/><text x="60" y="717" class="pt">3. 정규화: 각 테이블이 한 종류의 사실을 관리</text><rect x="55" y="755" width="300" height="130" class="table"/><rect x="55" y="755" width="300" height="38" class="headB"/><text x="205" y="779" class="th">members</text><text x="205" y="818" class="h">회원당 한 행</text><text x="205" y="842" class="m">id · name · email · joined_at</text><text x="205" y="866" class="m">이메일 변경은 한 행만 수정</text><rect x="450" y="735" width="300" height="170" class="table"/><rect x="450" y="735" width="300" height="38" class="headO"/><text x="600" y="759" class="th">loans</text><text x="600" y="798" class="h">대여 발생당 한 행</text><text x="600" y="822" class="m">id · member_id · book_id</text><text x="600" y="846" class="m">borrowed_at · due_at · returned_at</text><text x="600" y="870" class="m">대여를 삭제해도 회원·책 기본정보 유지</text><rect x="845" y="755" width="300" height="130" class="table"/><rect x="845" y="755" width="300" height="38" class="headB"/><text x="995" y="779" class="th">books</text><text x="995" y="818" class="h">책당 한 행</text><text x="995" y="842" class="m">id · title · author · isbn</text><text x="995" y="866" class="m">대여 전에도 독립적으로 등록 가능</text><path d="M355 820H450" class="arr"/><path d="M845 820H750" class="arr"/><text x="402" y="808" class="m">1:N</text><text x="797" y="808" class="m">N:1</text><rect x="225" y="910" width="750" height="25" class="box green"/><text x="600" y="927" class="code">중복 저장 대신 PK·FK로 연결하고, 필요한 결과는 JOIN으로 복원</text><rect x="35" y="975" width="1130" height="90" class="panel verify"/><text x="60" y="1007" class="pt">4. 정규화 결과 검증</text><rect x="60" y="1025" width="245" height="27" class="box green"/><text x="182" y="1043" class="m">회원·책 독립 INSERT 가능</text><rect x="335" y="1025" width="245" height="27" class="box blue"/><text x="457" y="1043" class="m">한 사실을 한 곳에서 수정</text><rect x="610" y="1025" width="245" height="27" class="box orange"/><text x="732" y="1043" class="m">대여 삭제 후 기본정보 보존</text><rect x="885" y="1025" width="245" height="27" class="box purple"/><text x="1007" y="1043" class="m">JOIN으로 원래 정보 복원</text><polygon points="600,1070 705,1097 600,1124 495,1097" class="decision"/><text x="600" y="1094" class="dt">업무 의미가 보존되는가?</text><text x="600" y="1112" class="m">아니면 테이블 경계·키·관계를 다시 검토</text><path d="M495 1097H20V815H55" class="back"/><rect x="65" y="1075" width="335" height="32" class="note"/><text x="232" y="1096" class="nt">정규화는 컬럼 수가 많다는 이유로 나누는 작업이 아님</text><rect x="800" y="1075" width="335" height="32" class="core"/><text x="967" y="1096" class="cv">한 사실을 한 곳에서 관리해 의미와 일관성을 보존</text></svg>