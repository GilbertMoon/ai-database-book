<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1260" viewBox="0 0 1200 1260" role="img" aria-labelledby="title desc"><title id="title">AI 생성 테이블 구조 검토</title><desc id="desc">AI가 제안한 도서 대여 테이블을 검증되지 않은 가설로 두고 한 행의 의미, 컬럼의 주인, 중복과 이상 현상, 1정규형부터 3정규형, 과도한 분리 여부, PostgreSQL 제약조건과 정상·예외 데이터 및 JOIN 결과를 사람이 반복 검토하는 흐름</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}.t{font-size:28px;font-weight:700;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.panel{stroke-width:1.5;rx:15}.start{fill:#eef5ff;stroke:#6fa2e8}.review{fill:#fff8e8;stroke:#d69e2e}.design{fill:#f8fafc;stroke:#a8b3c4}.test{fill:#f2fbf5;stroke:#8bc9a0}.pt{font-size:19px;font-weight:700}.box{fill:#fff;stroke-width:1.4;rx:10}.red{stroke:#d9534f}.orange{stroke:#d69e2e}.blue{stroke:#3b82c4}.green{stroke:#3c9a5f}.purple{stroke:#7c5cc4}.gray{stroke:#64748b}.h{font-size:14px;font-weight:700;text-anchor:middle}.m{font-size:11.3px;text-anchor:middle;fill:#475569}.code{font-family:Consolas,D2Coding,monospace;font-size:12.1px;font-weight:700;text-anchor:middle;fill:#334155}.arr{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.back{stroke:#d9534f;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#a)}.decision{fill:#fff8e8;stroke:#b7791f;stroke-width:1.8}.dt{font-size:14px;font-weight:700;text-anchor:middle}.table{fill:#fff;stroke:#64748b;stroke-width:1.4;rx:9}.headB{fill:#dcecff}.headO{fill:#fff1cf}.headP{fill:#ede9fe}.th{font-size:12.6px;font-weight:700;text-anchor:middle}.note{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.3;rx:9}.nt{font-size:11.3px;font-weight:700;text-anchor:middle;fill:#92400e}.core{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.5;rx:10}.cv{font-size:14.2px;font-weight:700;text-anchor:middle;fill:#166534}</style></defs><rect width="1200" height="1260" fill="#fff"/><text x="600" y="40" class="t">AI 생성 테이블 구조 검토</text><text x="600" y="68" class="s">AI 제안은 설계 정답이 아니라 가설이며, 행의 의미와 의존 관계를 실제 데이터로 설명할 수 있을 때만 채택한다</text><rect x="35" y="100" width="1130" height="205" class="panel start"/><text x="60" y="132" class="pt">1. AI 초안을 요구사항과 업무 시나리오에 대조</text><rect x="55" y="160" width="300" height="95" class="box blue"/><text x="205" y="186" class="h">AI 제안</text><text x="205" y="211" class="code">library_records</text><text x="205" y="234" class="m">회원·책·대여 설명값을 한 행에 모두 저장</text><rect x="450" y="160" width="300" height="95" class="box purple"/><text x="600" y="186" class="h">행 의미 확인</text><text x="600" y="211" class="m">한 행은 회원인가, 책인가,</text><text x="600" y="233" class="m">아니면 대여 한 건인가?</text><rect x="845" y="160" width="300" height="95" class="box green"/><text x="995" y="186" class="h">컬럼 주인 확인</text><text x="995" y="211" class="m">email은 회원 · title은 책</text><text x="995" y="233" class="m">borrowed_at은 대여 사건</text><path d="M355 207H450" class="arr"/><path d="M750 207H845" class="arr"/><text x="600" y="285" class="m">독립적으로 등록·수정·삭제해야 하는 대상과 상태를 원문 요구사항에서 다시 찾는다</text><rect x="35" y="335" width="1130" height="285" class="panel review"/><text x="60" y="367" class="pt">2. 실제 샘플로 정규화가 필요한 근거 확인</text><rect x="55" y="405" width="250" height="130" class="box red"/><text x="180" y="431" class="h">다중값·반복 그룹</text><text x="180" y="456" class="m">쉼표 목록·배열형 문자열 또는</text><text x="180" y="478" class="m">book1·book2 반복 컬럼이 있는가?</text><text x="180" y="509" class="code">1NF 검토</text><rect x="330" y="405" width="250" height="130" class="box orange"/><text x="455" y="431" class="h">부분 종속</text><text x="455" y="456" class="m">복합키의 일부만으로</text><text x="455" y="478" class="m">결정되는 일반 컬럼이 있는가?</text><text x="455" y="509" class="code">2NF 검토</text><rect x="605" y="405" width="250" height="130" class="box purple"/><text x="730" y="431" class="h">이행 종속</text><text x="730" y="456" class="m">일반 컬럼이 다른 일반 컬럼을</text><text x="730" y="478" class="m">결정하고 있는가?</text><text x="730" y="509" class="code">3NF 검토</text><rect x="880" y="405" width="250" height="130" class="box gray"/><text x="1005" y="431" class="h">이상 현상</text><text x="1005" y="456" class="m">여러 행 UPDATE·독립 INSERT 불가</text><text x="1005" y="478" class="m">사건 DELETE 시 대상 정보 손실?</text><text x="1005" y="509" class="code">업무 영향 검토</text><rect x="180" y="555" width="840" height="42" class="box red"/><text x="600" y="574" class="h">판단 근거</text><text x="600" y="592" class="m">컬럼 수가 많아서가 아니라 실제 중복·함수적 의존·변경 이유와 데이터 수명이 다를 때 분리</text><rect x="35" y="650" width="1130" height="295" class="panel design"/><text x="60" y="682" class="pt">3. 테이블 경계와 키를 다시 설계</text><rect x="55" y="720" width="300" height="150" class="table"/><rect x="55" y="720" width="300" height="38" class="headB"/><text x="205" y="744" class="th">members</text><text x="205" y="783" class="h">회원당 한 행</text><text x="205" y="809" class="code">id PK · name</text><text x="205" y="833" class="code">email UNIQUE · joined_at</text><text x="205" y="856" class="m">회원 사실은 한 번만 저장</text><rect x="450" y="700" width="300" height="190" class="table"/><rect x="450" y="700" width="300" height="38" class="headO"/><text x="600" y="724" class="th">loans</text><text x="600" y="763" class="h">대여 발생당 한 행</text><text x="600" y="789" class="code">id PK</text><text x="600" y="813" class="code">member_id FK · book_id FK</text><text x="600" y="837" class="code">borrowed_at · due_at</text><text x="600" y="861" class="code">returned_at NULL 가능</text><rect x="845" y="720" width="300" height="150" class="table"/><rect x="845" y="720" width="300" height="38" class="headP"/><text x="995" y="744" class="th">books</text><text x="995" y="783" class="h">책당 한 행</text><text x="995" y="809" class="code">id PK · title · author</text><text x="995" y="833" class="code">published_year · isbn UNIQUE</text><text x="995" y="856" class="m">책 사실은 대여와 독립 관리</text><path d="M355 805H450" class="arr"/><path d="M845 825H750" class="arr"/><text x="402" y="790" class="m">1 : 0..N</text><text x="797" y="810" class="m">0..N : 1</text><rect x="70" y="905" width="320" height="25" class="box green"/><text x="230" y="922" class="m">1NF · 각 셀에 하나의 값</text><rect x="440" y="905" width="320" height="25" class="box blue"/><text x="600" y="922" class="m">2NF · 부분 종속 제거</text><rect x="810" y="905" width="320" height="25" class="box purple"/><text x="970" y="922" class="m">3NF · 이행 종속 제거</text><rect x="35" y="975" width="1130" height="155" class="panel test"/><text x="60" y="1007" class="pt">4. 과도한 분리와 실행 결과를 함께 검증</text><rect x="55" y="1040" width="250" height="62" class="box gray"/><text x="180" y="1064" class="h">과도한 정규화</text><text x="180" y="1088" class="m">회원 기본 속성을 불필요한 1:1 테이블로 쪼개지 않음</text><rect x="330" y="1040" width="250" height="62" class="box green"/><text x="455" y="1064" class="h">정상·선택 사례</text><text x="455" y="1088" class="m">독립 등록·여러 대여·returned_at NULL</text><rect x="605" y="1040" width="250" height="62" class="box red"/><text x="730" y="1064" class="h">오류·변경 사례</text><text x="730" y="1088" class="m">중복 email·isbn과 없는 FK 차단 · 한 곳 UPDATE</text><rect x="880" y="1040" width="250" height="62" class="box blue"/><text x="1005" y="1064" class="h">조회 사례</text><text x="1005" y="1088" class="m">JOIN으로 회원명·책 제목·대여일 복원</text><polygon points="600,1145 725,1180 600,1215 475,1180" class="decision"/><text x="600" y="1175" class="dt">요구사항·ERD·SQL·실행 결과가 일치하는가?</text><text x="600" y="1195" class="m">불일치하면 해석·정규화 판단·키·제약조건·테스트 중 원인을 구분</text><path d="M475 1180H20V208H55" class="back"/><rect x="55" y="1228" width="350" height="26" class="note"/><text x="230" y="1246" class="nt">AI 이름과 분리 결과보다 한 행의 의미 설명이 우선</text><rect x="425" y="1228" width="350" height="26" class="note"/><text x="600" y="1246" class="nt">이름·제목만으로 중복 대상을 섣불리 병합하지 않음</text><rect x="795" y="1228" width="350" height="26" class="core"/><text x="970" y="1246" class="cv">검토된 설계와 SQL·샘플·검증 질의를 같은 버전으로 기록</text></svg>