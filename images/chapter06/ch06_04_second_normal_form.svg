<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180" role="img" aria-labelledby="title desc"><title id="title">2정규형: 일부 키 의존 분리</title><desc id="desc">학생과 과목의 복합키를 사용하는 수강 기록에서 학생 이름은 student_id에만, 과목 이름은 course_id에만 의존하고 성적은 전체 복합키에 의존함을 보여 주며 students, courses, enrollments로 분리하는 과정과 검증 기준을 설명하는 도식</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}.t{font-size:28px;font-weight:700;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.panel{stroke-width:1.5;rx:15}.before{fill:#fff5f5;stroke:#d9534f}.depend{fill:#fff8e8;stroke:#d69e2e}.after{fill:#eef5ff;stroke:#6fa2e8}.verify{fill:#f2fbf5;stroke:#8bc9a0}.pt{font-size:19px;font-weight:700}.table{fill:#fff;stroke:#64748b;stroke-width:1.4;rx:9}.headR{fill:#fee2e2}.headB{fill:#dcecff}.headO{fill:#fff1cf}.th{font-size:12.4px;font-weight:700;text-anchor:middle}.cell{font-size:10.6px;text-anchor:middle;fill:#334155}.repeat{font-size:10.6px;font-weight:700;text-anchor:middle;fill:#b91c1c}.line{stroke:#cbd5e1;stroke-width:1}.box{fill:#fff;stroke-width:1.4;rx:10}.red{stroke:#d9534f}.orange{stroke:#d69e2e}.blue{stroke:#3b82c4}.green{stroke:#3c9a5f}.purple{stroke:#7c5cc4}.gray{stroke:#64748b}.h{font-size:14px;font-weight:700;text-anchor:middle}.m{font-size:11.3px;text-anchor:middle;fill:#475569}.code{font-family:Consolas,D2Coding,monospace;font-size:12.1px;font-weight:700;text-anchor:middle;fill:#334155}.arr{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.depS{stroke:#3b82c4;stroke-width:2.2;fill:none;marker-end:url(#a)}.depC{stroke:#d69e2e;stroke-width:2.2;fill:none;marker-end:url(#a)}.depG{stroke:#3c9a5f;stroke-width:2.2;fill:none;marker-end:url(#a)}.decision{fill:#fff8e8;stroke:#b7791f;stroke-width:1.8}.dt{font-size:14px;font-weight:700;text-anchor:middle}.note{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.3;rx:9}.nt{font-size:11.3px;font-weight:700;text-anchor:middle;fill:#92400e}.core{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.5;rx:10}.cv{font-size:14.2px;font-weight:700;text-anchor:middle;fill:#166534}</style></defs><rect width="1200" height="1180" fill="#fff"/><text x="600" y="40" class="t">2정규형: 일부 키 의존 분리</text><text x="600" y="68" class="s">복합키의 일부만으로 결정되는 컬럼은 그 일부 키가 주인이 되는 테이블로 옮긴다</text><rect x="35" y="100" width="1130" height="270" class="panel before"/><text x="60" y="132" class="pt">1. 적용 전: 복합키를 가진 수강 기록</text><rect x="70" y="165" width="1060" height="150" class="table"/><rect x="70" y="165" width="1060" height="38" class="headR"/><text x="155" y="189" class="th">student_id</text><text x="330" y="189" class="th">course_id</text><text x="515" y="189" class="th">student_name</text><text x="760" y="189" class="th">course_name</text><text x="1020" y="189" class="th">grade</text><line x1="70" y1="203" x2="1130" y2="203" class="line"/><line x1="70" y1="240" x2="1130" y2="240" class="line"/><line x1="70" y1="277" x2="1130" y2="277" class="line"/><line x1="240" y1="165" x2="240" y2="315" class="line"/><line x1="420" y1="165" x2="420" y2="315" class="line"/><line x1="620" y1="165" x2="620" y2="315" class="line"/><line x1="900" y1="165" x2="900" y2="315" class="line"/><text x="155" y="227" class="cell">1</text><text x="330" y="227" class="cell">101</text><text x="515" y="227" class="repeat">김민지</text><text x="760" y="227" class="repeat">데이터베이스</text><text x="1020" y="227" class="cell">A</text><text x="155" y="264" class="cell">1</text><text x="330" y="264" class="cell">102</text><text x="515" y="264" class="repeat">김민지</text><text x="760" y="264" class="cell">알고리즘</text><text x="1020" y="264" class="cell">B</text><text x="155" y="301" class="cell">2</text><text x="330" y="301" class="cell">101</text><text x="515" y="301" class="cell">이준호</text><text x="760" y="301" class="repeat">데이터베이스</text><text x="1020" y="301" class="cell">A</text><text x="600" y="338" class="code">복합 기본키 = (student_id, course_id) · 한 행은 학생 한 명의 과목 한 개 수강</text><text x="600" y="358" class="m">빨간 값은 키의 한쪽 값이 반복될 때 함께 복사되는 학생·과목 정보</text><rect x="35" y="400" width="1130" height="245" class="panel depend"/><text x="60" y="432" class="pt">2. 일반 컬럼이 복합키 전체에 의존하는지 확인</text><rect x="55" y="465" width="330" height="115" class="box blue"/><text x="220" y="492" class="h">student_id → student_name</text><text x="220" y="519" class="m">학생 ID 하나만 알면 이름이 결정</text><text x="220" y="543" class="code">복합키의 학생 부분에만 의존</text><text x="220" y="565" class="m">부분 함수 종속 · 2NF 위반</text><rect x="435" y="465" width="330" height="115" class="box orange"/><text x="600" y="492" class="h">course_id → course_name</text><text x="600" y="519" class="m">과목 ID 하나만 알면 이름이 결정</text><text x="600" y="543" class="code">복합키의 과목 부분에만 의존</text><text x="600" y="565" class="m">부분 함수 종속 · 2NF 위반</text><rect x="815" y="465" width="330" height="115" class="box green"/><text x="980" y="492" class="h">student_id + course_id → grade</text><text x="980" y="519" class="m">학생과 과목을 함께 알아야 성적 결정</text><text x="980" y="543" class="code">복합키 전체에 의존</text><text x="980" y="565" class="m">수강 관계 테이블에 유지</text><rect x="200" y="595" width="800" height="30" class="box red"/><text x="600" y="615" class="m">부분 종속이 남으면 학생·과목 이름이 수강마다 반복되어 수정 누락, 독립 등록과 안전한 삭제가 어려워짐</text><rect x="35" y="675" width="1130" height="280" class="panel after"/><text x="60" y="707" class="pt">3. 2NF 적용: 키의 주인별로 사실을 분리</text><rect x="55" y="745" width="300" height="150" class="table"/><rect x="55" y="745" width="300" height="38" class="headB"/><text x="205" y="769" class="th">students</text><text x="205" y="808" class="h">학생당 한 행</text><text x="205" y="834" class="code">id PK · name</text><text x="205" y="859" class="m">student_id가 결정하는 학생 사실</text><text x="205" y="882" class="m">이름 변경은 한 행만 수정</text><rect x="450" y="745" width="300" height="150" class="table"/><rect x="450" y="745" width="300" height="38" class="headB"/><text x="600" y="769" class="th">courses</text><text x="600" y="808" class="h">과목당 한 행</text><text x="600" y="834" class="code">id PK · name</text><text x="600" y="859" class="m">course_id가 결정하는 과목 사실</text><text x="600" y="882" class="m">수강 없이도 독립 등록 가능</text><rect x="845" y="725" width="300" height="190" class="table"/><rect x="845" y="725" width="300" height="38" class="headO"/><text x="995" y="749" class="th">enrollments</text><text x="995" y="788" class="h">수강 관계당 한 행</text><text x="995" y="814" class="code">student_id PK·FK</text><text x="995" y="839" class="code">course_id PK·FK</text><text x="995" y="864" class="code">grade</text><text x="995" y="891" class="m">복합키 전체가 결정하는 관계 사실만 유지</text><path d="M355 825H845" class="depS"/><path d="M750 855H845" class="depC"/><text x="600" y="930" class="code">students 1:N enrollments N:1 courses · JOIN으로 학생명·과목명·성적 복원</text><rect x="35" y="985" width="1130" height="105" class="panel verify"/><text x="60" y="1017" class="pt">4. 2NF 결과 검증</text><rect x="55" y="1035" width="245" height="36" class="box green"/><text x="177" y="1058" class="m">학생 이름 한 곳에서 수정</text><rect x="325" y="1035" width="245" height="36" class="box blue"/><text x="447" y="1058" class="m">과목 독립 INSERT 가능</text><rect x="595" y="1035" width="245" height="36" class="box orange"/><text x="717" y="1058" class="m">수강 삭제 후 기본정보 유지</text><rect x="865" y="1035" width="245" height="36" class="box purple"/><text x="987" y="1058" class="m">JOIN 결과가 원래 의미 복원</text><polygon points="600,1100 710,1130 600,1160 490,1130" class="decision"/><text x="600" y="1126" class="dt">모든 일반 컬럼이 자기 테이블의 전체 키에 의존하는가?</text><text x="600" y="1146" class="m">아니면 부분 종속 컬럼의 주인을 다시 확인</text><rect x="55" y="1108" width="350" height="42" class="note"/><text x="230" y="1126" class="nt">전제: 먼저 1NF를 만족해야 함</text><text x="230" y="1143" class="m">다중값 셀 제거와 부분 종속 제거는 다른 단계</text><rect x="795" y="1108" width="350" height="42" class="core"/><text x="970" y="1126" class="cv">단일 컬럼 키라면 부분 종속은 없음</text><text x="970" y="1143" class="m">복합 후보키에서 일부 키 의존 여부를 확인</text></svg>