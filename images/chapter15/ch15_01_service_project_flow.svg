<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">AI 기반 데이터베이스 서비스 완성 흐름</title>
  <desc id="desc">문제 정의부터 데이터베이스 설계, 구현과 검증, 웹 CRUD와 GitHub 문서화까지 이어지는 14단계 프로젝트 흐름</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      text {
        font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif;
        fill: #172033;
      }
      .title { font-size: 27px; font-weight: 700; text-anchor: middle; }
      .section-label { font-size: 17px; font-weight: 700; }
      .step-number { font-size: 13px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .step-text { font-size: 15px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
      .step-text-small { font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
      .principle-label { font-size: 14px; font-weight: 700; fill: #166534; }
      .principle-text { font-size: 17px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .group { stroke-width: 1.5; rx: 16; }
      .planning-group { fill: #f4f8ff; stroke: #93b4e6; }
      .validation-group { fill: #f8fafc; stroke: #a8b3c4; }
      .delivery-group { fill: #f2fbf5; stroke: #8bc9a0; }
      .box { fill: #ffffff; stroke: #64748b; stroke-width: 1.8; rx: 12; }
      .box-planning { fill: #ffffff; stroke: #3b82c4; }
      .box-ai { fill: #fff8e8; stroke: #d69e2e; }
      .box-delivery { fill: #ffffff; stroke: #3c9a5f; }
      .badge-planning { fill: #2f6fad; }
      .badge-validation { fill: #58677b; }
      .badge-ai { fill: #b7791f; }
      .badge-delivery { fill: #2f855a; }
      .arrow { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="820" fill="#ffffff"/>
  <text x="600" y="43" class="title">AI 기반 데이터베이스 서비스 완성 흐름</text>

  <rect x="34" y="76" width="1132" height="190" class="group planning-group"/>
  <text x="58" y="105" class="section-label">1. 기획·설계</text>

  <rect x="50" y="132" width="190" height="88" class="box box-planning"/>
  <circle cx="70" cy="151" r="14" class="badge-planning"/>
  <text x="70" y="151" class="step-number">1</text>
  <text x="145" y="176" class="step-text">문제 정의</text>

  <rect x="275" y="132" width="190" height="88" class="box box-planning"/>
  <circle cx="295" cy="151" r="14" class="badge-planning"/>
  <text x="295" y="151" class="step-number">2</text>
  <text x="370" y="168" class="step-text">사용자와</text>
  <text x="370" y="190" class="step-text">프로젝트 범위 정의</text>

  <rect x="500" y="132" width="190" height="88" class="box box-planning"/>
  <circle cx="520" cy="151" r="14" class="badge-planning"/>
  <text x="520" y="151" class="step-number">3</text>
  <text x="595" y="176" class="step-text">요구사항 정의</text>

  <rect x="725" y="132" width="190" height="88" class="box box-planning"/>
  <circle cx="745" cy="151" r="14" class="badge-planning"/>
  <text x="745" y="151" class="step-number">4</text>
  <text x="820" y="168" class="step-text">엔터티와</text>
  <text x="820" y="190" class="step-text">관계 찾기</text>

  <rect x="950" y="132" width="190" height="88" class="box box-planning"/>
  <circle cx="970" cy="151" r="14" class="badge-planning"/>
  <text x="970" y="151" class="step-number">5</text>
  <text x="1045" y="176" class="step-text">ERD 설계</text>

  <path d="M 240 176 H 275" class="arrow"/>
  <path d="M 465 176 H 500" class="arrow"/>
  <path d="M 690 176 H 725" class="arrow"/>
  <path d="M 915 176 H 950" class="arrow"/>

  <rect x="34" y="286" width="1132" height="218" class="group validation-group"/>
  <text x="58" y="315" class="section-label">2. 구현·검증</text>

  <rect x="950" y="350" width="190" height="98" class="box"/>
  <circle cx="970" cy="369" r="14" class="badge-validation"/>
  <text x="970" y="369" class="step-number">6</text>
  <text x="1045" y="391" class="step-text">PostgreSQL</text>
  <text x="1045" y="414" class="step-text">DDL 구현</text>

  <rect x="725" y="350" width="190" height="98" class="box"/>
  <circle cx="745" cy="369" r="14" class="badge-validation"/>
  <text x="745" y="369" class="step-number">7</text>
  <text x="820" y="399" class="step-text">샘플 데이터 입력</text>

  <rect x="500" y="350" width="190" height="98" class="box"/>
  <circle cx="520" cy="369" r="14" class="badge-validation"/>
  <text x="520" y="369" class="step-number">8</text>
  <text x="595" y="399" class="step-text">핵심 SQL 검증</text>

  <rect x="275" y="350" width="190" height="98" class="box"/>
  <circle cx="295" cy="369" r="14" class="badge-validation"/>
  <text x="295" y="369" class="step-number">9</text>
  <text x="370" y="388" class="step-text-small">트랜잭션·인덱스</text>
  <text x="370" y="412" class="step-text-small">성능 검토</text>

  <rect x="50" y="350" width="190" height="98" class="box"/>
  <circle cx="70" cy="369" r="14" class="badge-validation"/>
  <text x="70" y="369" class="step-number">10</text>
  <text x="145" y="388" class="step-text-small">보안·백업</text>
  <text x="145" y="412" class="step-text-small">복구 검토</text>

  <path d="M 1045 220 V 350" class="arrow"/>
  <path d="M 950 399 H 915" class="arrow"/>
  <path d="M 725 399 H 690" class="arrow"/>
  <path d="M 500 399 H 465" class="arrow"/>
  <path d="M 275 399 H 240" class="arrow"/>

  <rect x="34" y="524" width="1132" height="194" class="group delivery-group"/>
  <text x="58" y="553" class="section-label">3. 서비스·문서화</text>

  <rect x="50" y="590" width="245" height="88" class="box box-ai"/>
  <circle cx="70" cy="609" r="14" class="badge-ai"/>
  <text x="70" y="609" class="step-number">11</text>
  <text x="172.5" y="618" class="step-text-small">AI 초안 검토·수정</text>
  <text x="172.5" y="642" class="step-text-small">실행 결과 검증</text>

  <rect x="335" y="590" width="245" height="88" class="box box-delivery"/>
  <circle cx="355" cy="609" r="14" class="badge-delivery"/>
  <text x="355" y="609" class="step-number">12</text>
  <text x="457.5" y="634" class="step-text">웹 CRUD 구현</text>

  <rect x="620" y="590" width="245" height="88" class="box box-delivery"/>
  <circle cx="640" cy="609" r="14" class="badge-delivery"/>
  <text x="640" y="609" class="step-number">13</text>
  <text x="742.5" y="634" class="step-text">GitHub 저장소 정리</text>

  <rect x="905" y="590" width="245" height="88" class="box box-delivery"/>
  <circle cx="925" cy="609" r="14" class="badge-delivery"/>
  <text x="925" y="609" class="step-number">14</text>
  <text x="1027.5" y="618" class="step-text-small">검증 보고서와</text>
  <text x="1027.5" y="642" class="step-text-small">재현 문서 작성</text>

  <path d="M 145 448 V 590" class="arrow"/>
  <path d="M 295 634 H 335" class="arrow"/>
  <path d="M 580 634 H 620" class="arrow"/>
  <path d="M 865 634 H 905" class="arrow"/>

  <rect x="235" y="748" width="730" height="48" fill="#ecfdf3" stroke="#62b47a" stroke-width="1.7" rx="12"/>
  <text x="255" y="768" class="principle-label">핵심 원칙</text>
  <text x="625" y="772" class="principle-text">화면보다 데이터 구조와 검증 근거를 먼저 완성한다</text>
</svg>
