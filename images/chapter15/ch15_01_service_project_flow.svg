<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc">
  <title id="title">AI 기반 데이터베이스 서비스 완성 흐름</title>
  <desc id="desc">문제 정의와 ERD 설계, PostgreSQL 구현과 실행 검증, 웹 CRUD와 GitHub 문서화를 단계별 산출물과 검증 게이트로 연결하고, 검증 실패 시 이전 단계로 돌아가 수정하는 프로젝트 흐름</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}
      .title{font-size:27px;font-weight:700;text-anchor:middle}
      .subtitle{font-size:15px;text-anchor:middle;fill:#475569}
      .group{stroke-width:1.5;rx:16}
      .planning-group{fill:#f4f8ff;stroke:#93b4e6}
      .validation-group{fill:#f8fafc;stroke:#a8b3c4}
      .delivery-group{fill:#f2fbf5;stroke:#8bc9a0}
      .section-title{font-size:18px;font-weight:700}
      .section-sub{font-size:13px;fill:#475569}
      .card{fill:#fff;stroke-width:1.7;rx:11}
      .planning-card{stroke:#3b82c4}.validation-card{stroke:#64748b}.delivery-card{stroke:#3c9a5f}
      .badge{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:middle}
      .badge-planning{fill:#2f6fad}.badge-validation{fill:#58677b}.badge-delivery{fill:#2f855a}
      .card-title{font-size:14.5px;font-weight:700;text-anchor:middle}
      .card-sub{font-size:12px;text-anchor:middle;fill:#475569}
      .output{font-size:12px;font-weight:700;text-anchor:middle;fill:#334155}
      .arrow{stroke:#475569;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
      .feedback{stroke:#d9534f;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}
      .gate{fill:#fff8e8;stroke:#b7791f;stroke-width:1.7;rx:11}
      .gate-title{font-size:14px;font-weight:700;text-anchor:middle}
      .gate-sub{font-size:12px;text-anchor:middle;fill:#475569}
      .branch{font-size:12.5px;font-weight:700}
      .success{fill:#eef7ff;stroke:#2f6fad;stroke-width:1.7;rx:11}
      .success-title{font-size:14px;font-weight:700;text-anchor:middle;fill:#1e4f91}
      .ai-band{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.5;rx:12}
      .ai-title{font-size:15px;font-weight:700;fill:#92400e}
      .ai-text{font-size:13px;fill:#475569}
      .principle{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.6;rx:11}
      .principle-label{font-size:14px;font-weight:700;fill:#166534}
      .principle-text{font-size:16px;font-weight:700;text-anchor:middle;dominant-baseline:middle;fill:#166534}
    </style>
  </defs>

  <rect width="1200" height="1060" fill="#fff"/>
  <text x="600" y="40" class="title">AI 기반 데이터베이스 서비스 완성 흐름</text>
  <text x="600" y="68" class="subtitle">단계를 지나가는 것보다 각 단계의 산출물을 실행 결과로 검증하고 다시 재현할 수 있어야 한다</text>

  <rect x="34" y="90" width="1132" height="230" class="group planning-group"/>
  <text x="58" y="121" class="section-title">1. 기획·설계</text>
  <text x="178" y="121" class="section-sub">문제와 요구사항을 데이터 구조로 변환</text>

  <rect x="48" y="148" width="200" height="98" class="card planning-card"/>
  <circle cx="70" cy="170" r="13" class="badge-planning"/><text x="70" y="170" class="badge">1</text>
  <text x="148" y="178" class="card-title">문제 정의</text>
  <text x="148" y="207" class="card-sub">해결할 문제·성공 기준</text>
  <text x="148" y="229" class="output">problem.md</text>

  <rect x="274" y="148" width="200" height="98" class="card planning-card"/>
  <circle cx="296" cy="170" r="13" class="badge-planning"/><text x="296" y="170" class="badge">2</text>
  <text x="374" y="178" class="card-title">사용자·범위 정의</text>
  <text x="374" y="207" class="card-sub">포함 기능·제외 기능</text>
  <text x="374" y="229" class="output">scope.md</text>

  <rect x="500" y="148" width="200" height="98" class="card planning-card"/>
  <circle cx="522" cy="170" r="13" class="badge-planning"/><text x="522" y="170" class="badge">3</text>
  <text x="600" y="178" class="card-title">요구사항 정의</text>
  <text x="600" y="207" class="card-sub">기능·업무 규칙·예외</text>
  <text x="600" y="229" class="output">requirements.md</text>

  <rect x="726" y="148" width="200" height="98" class="card planning-card"/>
  <circle cx="748" cy="170" r="13" class="badge-planning"/><text x="748" y="170" class="badge">4</text>
  <text x="826" y="178" class="card-title">엔터티·관계 식별</text>
  <text x="826" y="207" class="card-sub">속성·카디널리티·N:M</text>
  <text x="826" y="229" class="output">데이터 목록</text>

  <rect x="952" y="148" width="200" height="98" class="card planning-card"/>
  <circle cx="974" cy="170" r="13" class="badge-planning"/><text x="974" y="170" class="badge">5</text>
  <text x="1052" y="178" class="card-title">ERD 설계</text>
  <text x="1052" y="207" class="card-sub">PK·FK·제약·관계 해소</text>
  <text x="1052" y="229" class="output">erd.svg / erd.md</text>

  <path d="M248 197H274" class="arrow"/><path d="M474 197H500" class="arrow"/><path d="M700 197H726" class="arrow"/><path d="M926 197H952" class="arrow"/>
  <rect x="345" y="265" width="510" height="40" class="gate"/>
  <text x="600" y="282" class="gate-title">설계 게이트: 모든 요구사항을 ERD의 테이블·관계·제약으로 추적할 수 있는가?</text>
  <text x="600" y="299" class="gate-sub">아니면 범위·요구사항·ERD를 다시 조정</text>
  <path d="M1052 246V265" class="arrow"/>
  <path d="M345 285H260V197H274" class="feedback"/>
  <text x="274" y="276" class="branch" fill="#b42318">미통과</text>

  <rect x="34" y="340" width="1132" height="255" class="group validation-group"/>
  <text x="58" y="371" class="section-title">2. 구현·검증</text>
  <text x="178" y="371" class="section-sub">설계를 PostgreSQL에서 실행하고 정상·경계·오류 상황을 확인</text>

  <rect x="48" y="400" width="200" height="105" class="card validation-card"/>
  <circle cx="70" cy="422" r="13" class="badge-validation"/><text x="70" y="422" class="badge">6</text>
  <text x="148" y="430" class="card-title">PostgreSQL DDL</text>
  <text x="148" y="459" class="card-sub">타입·PK·FK·CHECK·NULL</text>
  <text x="148" y="483" class="output">schema.sql</text>

  <rect x="274" y="400" width="200" height="105" class="card validation-card"/>
  <circle cx="296" cy="422" r="13" class="badge-validation"/><text x="296" y="422" class="badge">7</text>
  <text x="374" y="430" class="card-title">검증 데이터</text>
  <text x="374" y="459" class="card-sub">정상·경계·모순 시나리오</text>
  <text x="374" y="483" class="output">seed.sql</text>

  <rect x="500" y="400" width="200" height="105" class="card validation-card"/>
  <circle cx="522" cy="422" r="13" class="badge-validation"/><text x="522" y="422" class="badge">8</text>
  <text x="600" y="430" class="card-title">핵심 SQL 검증</text>
  <text x="600" y="459" class="card-sub">JOIN·집계·상태·오류 확인</text>
  <text x="600" y="483" class="output">queries.sql + 결과</text>

  <rect x="726" y="400" width="200" height="105" class="card validation-card"/>
  <circle cx="748" cy="422" r="13" class="badge-validation"/><text x="748" y="422" class="badge">9</text>
  <text x="826" y="430" class="card-title">트랜잭션·성능</text>
  <text x="826" y="459" class="card-sub">업무 단위·인덱스·실행 계획</text>
  <text x="826" y="483" class="output">검토 근거</text>

  <rect x="952" y="400" width="200" height="105" class="card validation-card"/>
  <circle cx="974" cy="422" r="13" class="badge-validation"/><text x="974" y="422" class="badge">10</text>
  <text x="1052" y="430" class="card-title">보안·복구</text>
  <text x="1052" y="459" class="card-sub">최소 권한·비밀정보·백업</text>
  <text x="1052" y="483" class="output">복구 절차</text>

  <path d="M248 452H274" class="arrow"/><path d="M474 452H500" class="arrow"/><path d="M700 452H726" class="arrow"/><path d="M926 452H952" class="arrow"/>
  <path d="M600 305V340" class="arrow"/>
  <rect x="315" y="530" width="570" height="46" class="gate"/>
  <text x="600" y="548" class="gate-title">실행 게이트: 초기화 → 데이터 입력 → 검증 SQL이 새 DB에서 오류 없이 반복 실행되는가?</text>
  <text x="600" y="567" class="gate-sub">구현 오류는 DDL로, 구조 문제는 ERD로 돌아가 수정</text>
  <path d="M1052 505V530" class="arrow"/>
  <path d="M315 553H260V452H274" class="feedback"/>
  <path d="M885 553H1170V285H855" class="feedback"/>
  <text x="275" y="543" class="branch" fill="#b42318">구현 미통과</text>
  <text x="1010" y="542" class="branch" fill="#b42318">설계 문제</text>

  <rect x="34" y="615" width="1132" height="270" class="group delivery-group"/>
  <text x="58" y="646" class="section-title">3. 서비스·재현성</text>
  <text x="196" y="646" class="section-sub">검증된 데이터 구조를 최소 기능의 서비스와 재현 가능한 저장소로 완성</text>

  <rect x="55" y="680" width="250" height="112" class="card delivery-card"/>
  <circle cx="79" cy="704" r="13" class="badge-delivery"/><text x="79" y="704" class="badge">11</text>
  <text x="180" y="712" class="card-title">AI 제안 검토 기록</text>
  <text x="180" y="741" class="card-sub">제안·문제·수정·최종 판단</text>
  <text x="180" y="766" class="output">ai_review.md</text>

  <rect x="335" y="680" width="250" height="112" class="card delivery-card"/>
  <circle cx="359" cy="704" r="13" class="badge-delivery"/><text x="359" y="704" class="badge">12</text>
  <text x="460" y="712" class="card-title">간단한 웹 CRUD</text>
  <text x="460" y="741" class="card-sub">등록·조회·수정·삭제와 오류 처리</text>
  <text x="460" y="766" class="output">핵심 데이터 흐름 시연</text>

  <rect x="615" y="680" width="250" height="112" class="card delivery-card"/>
  <circle cx="639" cy="704" r="13" class="badge-delivery"/><text x="639" y="704" class="badge">13</text>
  <text x="740" y="712" class="card-title">GitHub 저장소 정리</text>
  <text x="740" y="741" class="card-sub">파일 구조·커밋·비밀정보 제외</text>
  <text x="740" y="766" class="output">재현 가능한 프로젝트 구조</text>

  <rect x="895" y="680" width="250" height="112" class="card delivery-card"/>
  <circle cx="919" cy="704" r="13" class="badge-delivery"/><text x="919" y="704" class="badge">14</text>
  <text x="1020" y="712" class="card-title">검증 보고서·README</text>
  <text x="1020" y="741" class="card-sub">환경·실행 순서·결과·한계</text>
  <text x="1020" y="766" class="output">다른 사람이 따라 할 문서</text>

  <path d="M305 736H335" class="arrow"/><path d="M585 736H615" class="arrow"/><path d="M865 736H895" class="arrow"/>
  <path d="M600 576V615" class="arrow"/>

  <rect x="300" y="815" width="420" height="48" class="gate"/>
  <text x="510" y="834" class="gate-title">재현 게이트: 새 환경에서 같은 구조와 결과를 만들 수 있는가?</text>
  <text x="510" y="853" class="gate-sub">실패하면 저장소 구조·README 또는 구현을 수정</text>
  <rect x="805" y="815" width="320" height="48" class="success"/>
  <text x="965" y="844" class="success-title">완성된 AI 기반 데이터베이스 서비스</text>
  <path d="M1020 792V815H720" class="arrow"/>
  <path d="M720 839H805" class="arrow"/>
  <text x="758" y="825" class="branch" fill="#166534">통과</text>
  <path d="M300 839H260V736H615" class="feedback"/>
  <text x="274" y="824" class="branch" fill="#b42318">미통과</text>

  <rect x="60" y="915" width="1080" height="62" class="ai-band"/>
  <text x="84" y="940" class="ai-title">AI 활용 원칙</text>
  <text x="190" y="940" class="ai-text">AI는 요구사항·ERD·DDL·SQL·문서화의 초안을 도울 수 있지만, 사람이 검토하고 실제 실행 결과로 확인해야 한다.</text>
  <text x="190" y="962" class="ai-text">프롬프트, AI 제안, 발견한 문제, 수정 이유와 최종 판단을 기록해 검증 과정을 설명할 수 있게 한다.</text>

  <rect x="190" y="1000" width="820" height="44" class="principle"/>
  <text x="216" y="1021" class="principle-label">핵심 원칙</text>
  <text x="620" y="1022" class="principle-text">화면보다 데이터 구조와 검증 근거를 먼저 완성하고, 다른 사람이 재현할 수 있게 남긴다</text>
</svg>
