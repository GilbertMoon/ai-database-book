<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">AI 제안 검토·수정·재실행 루프</title>
  <desc id="desc">AI가 제안한 tutor_project 관련 변경의 목표와 범위를 정의하고, 파일별 diff와 위험 SQL을 사람이 검토한 뒤 테스트 환경에서 재실행하여 기대값과 실제 결과, 완료 게이트를 비교하고, 검증을 통과하면 미실행 항목을 확인해 사람이 최종 판단과 근거를 기록하며 실패하면 요구사항·ERD·SQL·테스트·문서를 수정해 diff 검토부터 반복하는 흐름</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
    </marker>
    <marker id="retry-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#be123c"/>
    </marker>
    <style>
      text {
        font-family: "Malgun Gothic", "NanumSquare", "Noto Sans CJK KR", "Apple SD Gothic Neo", "Noto Sans KR", "UnDotum", Arial, sans-serif;
        fill: #0f172a;
      }
      .mono { font-family: Consolas, D2Coding, "Noto Sans Mono CJK KR", Menlo, monospace; }
      .title { font-size: 36px; font-weight: 800; text-anchor: middle; fill: #12315c; }
      .subtitle { font-size: 19px; text-anchor: middle; fill: #475569; }
      .box { stroke-width: 2.1; rx: 15; }
      .scope { fill: #eff6ff; stroke: #3b82f6; }
      .ai { fill: #f5f3ff; stroke: #8b5cf6; }
      .diff { fill: #fff7ed; stroke: #f97316; }
      .human { fill: #ecfeff; stroke: #0891b2; }
      .execute { fill: #eef6ff; stroke: #2563eb; }
      .evidence { fill: #fff8eb; stroke: #f59e0b; }
      .safe { fill: #ecfdf5; stroke: #22c55e; }
      .record { fill: #f0fdf4; stroke: #15803d; }
      .block { fill: #fff1f2; stroke: #e11d48; }
      .note-box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.8; rx: 14; }
      .decision { fill: #fff4dc; stroke: #d97706; stroke-width: 2.4; }
      .head { font-size: 21px; font-weight: 800; text-anchor: middle; }
      .body { font-size: 17px; text-anchor: middle; fill: #334155; }
      .small { font-size: 16px; text-anchor: middle; fill: #475569; }
      .code { font-size: 17px; font-weight: 700; text-anchor: middle; fill: #1d4ed8; }
      .number { font-size: 15px; font-weight: 800; text-anchor: middle; dominant-baseline: middle; fill: #ffffff; }
      .label { font-size: 18px; font-weight: 800; text-anchor: middle; }
      .no-label { font-size: 18px; font-weight: 800; text-anchor: middle; fill: #be123c; }
      .arrow { stroke: #475569; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
      .retry { stroke: #be123c; stroke-width: 2.3; fill: none; stroke-dasharray: 8 6; marker-end: url(#retry-arrow); }
    </style>
  </defs>

  <rect width="1200" height="980" fill="#ffffff"/>

  <text x="600" y="48" class="title">AI 제안 검토·수정·재실행 루프</text>
  <text x="600" y="82" class="subtitle">AI 변경은 diff와 실행 증거를 거쳐 사람이 승인하며, 실패하면 새 diff부터 다시 검토합니다.</text>

  <!-- 1. Goal and scope -->
  <rect x="40" y="125" width="245" height="125" class="box scope"/>
  <circle cx="65" cy="151" r="16" fill="#2563eb"/>
  <text x="65" y="151" class="number">1</text>
  <text x="162.5" y="161" class="head">목표·변경 범위</text>
  <text x="162.5" y="194" class="body">기준 commit · 허용·금지 파일</text>
  <text x="162.5" y="221" class="body">파괴적 작업 · 기대 결과</text>

  <!-- 2. AI draft -->
  <rect x="330" y="125" width="245" height="125" class="box ai"/>
  <circle cx="355" cy="151" r="16" fill="#7c3aed"/>
  <text x="355" y="151" class="number">2</text>
  <text x="452.5" y="161" class="head">AI 변경 초안</text>
  <text x="452.5" y="194" class="body">요구사항·ERD·SQL·문서</text>
  <text x="452.5" y="221" class="body">승인 전 검토 대상</text>

  <!-- 3. Diff review -->
  <rect x="620" y="120" width="245" height="140" class="box diff"/>
  <circle cx="645" cy="151" r="16" fill="#ea580c"/>
  <text x="645" y="151" class="number">3</text>
  <text x="742.5" y="154" class="head">파일별 diff·위험 검토</text>
  <text x="742.5" y="185" class="small">범위 밖 변경 · 대량 교체</text>
  <text x="742.5" y="211" class="small">DROP·ALTER·CASCADE</text>
  <text x="742.5" y="237" class="small">Role·GRANT·제약조건 변경</text>

  <!-- 4. Human pre-execution review -->
  <rect x="910" y="125" width="245" height="125" class="box human"/>
  <circle cx="935" cy="151" r="16" fill="#0891b2"/>
  <text x="935" y="151" class="number">4</text>
  <text x="1032.5" y="158" class="head">사람 실행 전 검토</text>
  <text x="1032.5" y="191" class="body">설계 근거 · 비밀 · 변경 범위</text>
  <text x="1032.5" y="218" class="body">부적합하면 실행하지 않음</text>

  <path d="M285 187.5 H325" class="arrow"/>
  <path d="M575 187.5 H615" class="arrow"/>
  <path d="M865 187.5 H905" class="arrow"/>

  <!-- 5. Test execution -->
  <rect x="850" y="345" width="300" height="130" class="box execute"/>
  <circle cx="878" cy="373" r="16" fill="#2563eb"/>
  <text x="878" y="373" class="number">5</text>
  <text x="1000" y="382" class="head">테스트 환경 재실행</text>
  <text x="1000" y="415" class="body">영향 SQL · 반례 · 오류 중단</text>
  <text x="1000" y="442" class="body">01~08 영향 범위 → 10 완료 게이트</text>

  <!-- 6. Evidence comparison -->
  <rect x="455" y="335" width="335" height="150" class="box evidence"/>
  <circle cx="483" cy="365" r="16" fill="#d97706"/>
  <text x="483" y="365" class="number">6</text>
  <text x="622.5" y="375" class="head">기대값과 실제 결과 비교</text>
  <text x="622.5" y="406" class="small">테이블 6 · FK 5 · IDENTITY 5 · 인덱스 3</text>
  <text x="622.5" y="431" class="small">행 수 4·3·5·5·6·7 · CASCADE 0</text>
  <text x="622.5" y="456" class="small">ROLLBACK · 반례 14 · unexpected 0</text>
  <text x="622.5" y="478" class="code mono">10_completion_gate.sql → true</text>

  <!-- Decision -->
  <path d="M230 335 L395 410 L230 505 L65 410 Z" class="decision"/>
  <text x="230" y="400" class="head">요구사항과 검증 기준이</text>
  <text x="230" y="430" class="head">일치하는가?</text>

  <path d="M1032.5 250 V300 H1000 V340" class="arrow"/>
  <text x="1080" y="293" class="label">실행 가능</text>
  <path d="M850 410 H795" class="arrow"/>
  <path d="M455 410 H400" class="arrow"/>

  <!-- Pre-execution rejection path -->
  <path d="M1155 187.5 H1175 V620 H805" class="retry"/>
  <text x="1055" y="603" class="no-label">실행 부적합</text>

  <!-- Success path -->
  <rect x="70" y="565" width="320" height="105" class="box safe"/>
  <circle cx="98" cy="593" r="16" fill="#16a34a"/>
  <text x="98" y="593" class="number">7</text>
  <text x="230" y="600" class="head">미실행·미확인 항목 확인</text>
  <text x="230" y="632" class="body">Role·백업·복원·API·RAG·배포</text>
  <text x="230" y="657" class="small">검증하지 않은 항목은 통과 처리 금지</text>

  <rect x="70" y="710" width="320" height="105" class="box safe"/>
  <circle cx="98" cy="738" r="16" fill="#15803d"/>
  <text x="98" y="738" class="number">8</text>
  <text x="230" y="745" class="head">사람 최종 판단</text>
  <text x="230" y="778" class="body">승인 · 조건부 승인</text>
  <text x="230" y="803" class="body">보류 · 거절</text>

  <rect x="70" y="855" width="320" height="100" class="box record"/>
  <circle cx="98" cy="883" r="16" fill="#15803d"/>
  <text x="98" y="883" class="number">9</text>
  <text x="230" y="890" class="head mono">ai_review_report.md</text>
  <text x="230" y="921" class="body">commit · diff · expected/actual</text>
  <text x="230" y="946" class="small">판단 근거 · 미실행 항목 · 후속 조치</text>

  <path d="M230 505 V560" class="arrow"/>
  <text x="265" y="537" class="label">예</text>
  <path d="M230 670 V705" class="arrow"/>
  <path d="M230 815 V850" class="arrow"/>

  <!-- Failure path -->
  <rect x="450" y="565" width="350" height="130" class="box block"/>
  <text x="625" y="600" class="head">승인 보류·원인 수정</text>
  <text x="625" y="634" class="body">요구사항 · ERD · SQL</text>
  <text x="625" y="661" class="body">테스트 · README · 보고서</text>
  <text x="625" y="686" class="small">수정 근거 기록 후 새 diff 생성</text>

  <path d="M395 410 H420 V630 H445" class="retry"/>
  <text x="432" y="459" class="no-label">아니요</text>

  <path d="M625 565 V310 H742.5 V265" class="retry"/>
  <rect x="510" y="291" width="190" height="28" rx="8" fill="#ffffff"/>
  <text x="605" y="311" class="no-label">새 diff부터 재검토</text>

  <!-- Clarifying note -->
  <rect x="450" y="750" width="700" height="155" class="note-box"/>
  <text x="800" y="786" class="head">완료 게이트와 프로젝트 전체 완료는 다릅니다</text>
  <text x="800" y="821" class="body">완료 게이트 true는 필수 DB 구조와 기준 데이터가 기대값과 일치한다는 뜻입니다.</text>
  <text x="800" y="850" class="body">실제 Role 시험·백업·복원·API·RAG·배포는 별도 실행 증거가 필요합니다.</text>
  <text x="800" y="881" class="small">AI가 아니라 사람이 최종 상태와 근거를 기록합니다.</text>

  <text x="800" y="950" class="small">핵심 원칙: 실행 성공만으로 승인하지 않고, 수정 후에는 diff와 사람 검토부터 다시 반복합니다.</text>
</svg>