<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1260" viewBox="0 0 1200 1260" role="img" aria-labelledby="title desc">
  <title id="title">AI 활용 및 검토 루프</title>
  <desc id="desc">요구사항과 실행 환경을 포함해 AI에 범위를 제한한 초안을 요청하고, 사람이 관계·제약조건·정규화·결과 의미를 검토한 뒤 PostgreSQL에서 실행한다. 실행 오류와 결과 오류를 구분하여 수정하고, 최종적으로 AI 제안과 사람의 판단 및 재실행 결과를 기록하는 흐름</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
    <style>
      text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}
      .title{font-size:27px;font-weight:700;text-anchor:middle}.subtitle{font-size:15px;text-anchor:middle;fill:#475569}
      .section{fill:#f8fafc;stroke:#a8b3c4;stroke-width:1.5;rx:16}.sectionTitle{font-size:18px;font-weight:700}.sectionSub{font-size:12.5px;fill:#475569}
      .box{fill:#fff;stroke-width:1.6;rx:11}.context{stroke:#3b82c4}.ai{stroke:#d69e2e}.human{stroke:#7c5cc4}.run{stroke:#3c9a5f}.warn{stroke:#d9534f}
      .boxTitle{font-size:14.5px;font-weight:700;text-anchor:middle}.boxMain{font-size:12.3px;font-weight:600;text-anchor:middle}.boxSub{font-size:11.3px;text-anchor:middle;fill:#475569}.code{font-family:Consolas,D2Coding,monospace;font-size:11.3px;text-anchor:middle;fill:#334155}
      .flow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}.feedback{stroke:#d9534f;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}.relation{stroke:#94a3b8;stroke-width:1.5;fill:none;stroke-dasharray:6 5;marker-end:url(#arrow)}
      .decision{fill:#fff8e8;stroke:#b7791f;stroke-width:1.8}.decisionText{font-size:14px;font-weight:700;text-anchor:middle}.decisionSub{font-size:11.3px;text-anchor:middle;fill:#475569}.branch{font-size:12.5px;font-weight:700}
      .case{fill:#fff;stroke-width:1.5;rx:10}.caseBad{fill:#fff5f5;stroke:#d9534f}.caseGood{fill:#f2fbf5;stroke:#62b47a}.caseTitle{font-size:13.5px;font-weight:700;text-anchor:middle}.caseText{font-size:11.4px;text-anchor:middle;fill:#475569}
      .result{fill:#fff;stroke-width:1.5;rx:10}.syntax{fill:#fff5f5;stroke:#d9534f}.logic{fill:#fffaf0;stroke:#d69e2e}.success{fill:#f2fbf5;stroke:#62b47a}.resultTitle{font-size:13.3px;font-weight:700;text-anchor:middle}.resultText{font-size:11.2px;text-anchor:middle;fill:#475569}
      .record{fill:#eef7ff;stroke:#2f6fad;stroke-width:1.6;rx:11}.note{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.3;rx:9}.noteTitle{font-size:12.5px;font-weight:700;text-anchor:middle;fill:#92400e}.noteText{font-size:11.1px;text-anchor:middle;fill:#475569}
      .core{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.6;rx:11}.coreLabel{font-size:14px;font-weight:700;fill:#166534}.coreText{font-size:15.5px;font-weight:700;text-anchor:middle;fill:#166534}
    </style>
  </defs>

  <rect width="1200" height="1260" fill="#fff"/>
  <text x="600" y="40" class="title">AI 활용 및 검토 루프</text>
  <text x="600" y="68" class="subtitle">AI가 만든 초안을 그대로 채택하지 않고 사람이 설계 원리와 실행 결과로 검증한 뒤 최종 결정한다</text>

  <rect x="34" y="92" width="1132" height="250" class="section"/>
  <text x="58" y="125" class="sectionTitle">1. AI 요청 전에 검토 기준과 입력 맥락을 준비</text>
  <text x="450" y="125" class="sectionSub">요구사항과 환경이 빠지면 그럴듯하지만 현재 프로젝트와 맞지 않는 결과가 나올 수 있다</text>

  <rect x="55" y="154" width="310" height="142" class="box context"/>
  <text x="210" y="184" class="boxTitle">1. 검토 목표와 기준</text>
  <text x="210" y="213" class="boxMain">무엇을 만들고 무엇을 검증할 것인가?</text>
  <text x="210" y="238" class="boxSub">요구사항 · 현재 ERD · PostgreSQL 버전</text>
  <text x="210" y="260" class="boxSub">제외 범위 · 금지 조건 · 기대 결과</text>
  <text x="210" y="282" class="boxSub">실행 환경과 업무 규칙을 함께 제공</text>

  <rect x="445" y="154" width="310" height="142" class="box ai"/>
  <text x="600" y="184" class="boxTitle">2. 범위를 제한해 AI에 요청</text>
  <text x="600" y="213" class="boxMain">요구사항 정리 · 테이블 후보</text>
  <text x="600" y="238" class="boxMain">DDL · JOIN · 집계 · 오류 원인 후보</text>
  <text x="600" y="264" class="boxSub">원하는 출력 형식과 검토 기준도 명시</text>

  <rect x="835" y="154" width="310" height="142" class="box ai"/>
  <text x="990" y="184" class="boxTitle">3. AI 제안 원문 보존</text>
  <text x="990" y="213" class="boxMain">사용 도구 · 주요 프롬프트</text>
  <text x="990" y="238" class="boxMain">생성 결과 · 작성 시점</text>
  <text x="990" y="264" class="boxSub">최종 결과와 섞지 않고 비교 가능한 형태로 기록</text>

  <path d="M365 225H445" class="flow"/><path d="M755 225H835" class="flow"/>

  <rect x="34" y="366" width="1132" height="334" class="section"/>
  <text x="58" y="399" class="sectionTitle">2. 사람이 데이터베이스 원리와 업무 규칙으로 검토</text>
  <text x="470" y="399" class="sectionSub">문법 오류뿐 아니라 중복 저장, 관계 누락, NULL 처리와 결과 의미를 확인한다</text>

  <rect x="50" y="432" width="270" height="128" class="box human"/>
  <text x="185" y="462" class="boxTitle">4. 검토 항목</text>
  <text x="185" y="491" class="boxMain">요구사항 누락 · 관계 · PK/FK</text>
  <text x="185" y="516" class="boxMain">정규화 · NULL · 제약조건</text>
  <text x="185" y="541" class="boxSub">타입 · PostgreSQL 호환성 · 보안 영향</text>

  <rect x="360" y="432" width="360" height="128" class="case caseBad"/>
  <text x="540" y="462" class="caseTitle">AI 제안 사례</text>
  <text x="540" y="491" class="caseText">answers 테이블에 student_name · tutor_name</text>
  <text x="540" y="514" class="caseText">question_title을 직접 저장</text>
  <text x="540" y="539" class="caseText" fill="#b42318">같은 사실을 여러 테이블에 중복 저장</text>

  <polygon points="920,420 1055,496 920,572 785,496" class="decision"/>
  <text x="920" y="489" class="decisionText">중복·누락·충돌 등</text><text x="920" y="510" class="decisionText">설계 문제가 있는가?</text>

  <path d="M320 496H360" class="flow"/><path d="M720 496H785" class="flow"/>

  <rect x="80" y="596" width="470" height="78" class="case caseBad"/>
  <text x="315" y="623" class="caseTitle">문제 발견</text>
  <text x="315" y="648" class="caseText">원본 이름이나 제목 변경 시 여러 행 수정 → 수정 이상과 데이터 불일치 가능</text>

  <rect x="650" y="596" width="470" height="78" class="case caseGood"/>
  <text x="885" y="623" class="caseTitle">사람의 수정</text>
  <text x="885" y="648" class="caseText">student_id · tutor_id · question_id로 관계 표현하고 필요한 값은 JOIN으로 조회</text>

  <path d="M845 548V580H315V596" class="feedback"/><text x="785" y="575" class="branch" fill="#b42318">예</text>
  <path d="M550 635H650" class="flow"/>
  <path d="M995 548V580H885V596" class="flow"/><text x="1010" y="575" class="branch" fill="#166534">아니요</text>

  <rect x="34" y="724" width="1132" height="314" class="section"/>
  <text x="58" y="757" class="sectionTitle">3. PostgreSQL 실행 결과를 유형별로 판정하고 반복 수정</text>

  <rect x="55" y="792" width="270" height="104" class="box run"/>
  <text x="190" y="821" class="boxTitle">5. 깨끗한 작업용 DB에서 실행</text>
  <text x="190" y="850" class="boxMain">schema → seed → queries</text>
  <text x="190" y="875" class="boxSub">오류 메시지·행 수·제약조건·조회 결과 확인</text>

  <polygon points="530,780 665,844 530,908 395,844" class="decision"/>
  <text x="530" y="838" class="decisionText">실행 결과는</text><text x="530" y="859" class="decisionText">어떤 유형인가?</text>
  <path d="M325 844H395" class="flow"/>

  <rect x="725" y="778" width="400" height="70" class="result syntax"/>
  <text x="925" y="804" class="resultTitle">구문·호환 오류</text>
  <text x="925" y="828" class="resultText">오류 메시지와 실제 환경으로 최소 재현 후 DDL·SQL 수정</text>

  <rect x="725" y="860" width="400" height="70" class="result logic"/>
  <text x="925" y="886" class="resultTitle">실행 성공·결과 오류</text>
  <text x="925" y="910" class="resultText">JOIN·NULL·집계·제약조건 결과를 요구사항과 비교해 수정</text>

  <rect x="725" y="942" width="400" height="70" class="result success"/>
  <text x="925" y="968" class="resultTitle">실행 성공·결과 적합</text>
  <text x="925" y="992" class="resultText">정상·경계·오류 차단 시나리오까지 추가 검증</text>

  <path d="M665 818H725" class="flow"/><path d="M665 844H700V895H725" class="flow"/><path d="M665 870H700V977H725" class="flow"/>
  <path d="M725 813H690V748H190V792" class="feedback"/><path d="M725 895H680V738H190V792" class="feedback"/>

  <rect x="34" y="1062" width="1132" height="128" class="section"/>
  <rect x="55" y="1088" width="330" height="76" class="note"/>
  <text x="220" y="1114" class="noteTitle">AI가 잘하는 일</text><text x="220" y="1138" class="noteText">초안 생성 · 대안 제시 · 오류 원인 후보</text><text x="220" y="1157" class="noteText">설명 문장과 문서 구조 정리</text>

  <rect x="435" y="1088" width="330" height="76" class="note"/>
  <text x="600" y="1114" class="noteTitle">사람이 책임질 일</text><text x="600" y="1138" class="noteText">업무 규칙 · 데이터 의미 · 설계 선택</text><text x="600" y="1157" class="noteText">실행 결과 판정과 최종 승인</text>

  <rect x="815" y="1088" width="330" height="76" class="record"/>
  <text x="980" y="1114" class="noteTitle" fill="#1d4f91">6. 최종 판단·ai_review.md 기록</text><text x="980" y="1138" class="noteText">프롬프트 · AI 제안 · 발견 문제 · 수정 전후</text><text x="980" y="1157" class="noteText">수정 이유 · 재실행 결과 · 최종 문서 동기화</text>

  <path d="M925 1012V1050H980V1088" class="flow"/><text x="955" y="1044" class="branch" fill="#166534">검증 통과</text>
  <path d="M980 1164V1197H650V1212" class="flow"/>

  <rect x="145" y="1212" width="910" height="38" class="core"/>
  <text x="172" y="1236" class="coreLabel">핵심 원칙</text><text x="650" y="1237" class="coreText">AI는 설계 결정을 대신하지 않으며 사람의 검토와 실행 근거로 채택 여부를 결정한다</text>
</svg>