<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="100%" height="760" viewBox="0 0 1200 760" preserveAspectRatio="xMidYMid meet">
  <title id="title">AI 제안 검토·수정·재실행 루프</title>
  <desc id="desc">AI 초안은 사람 검토와 PostgreSQL 실행 결과를 통과해야 반영합니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <style>
      text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#111827}
      .mono{font-family:Consolas,D2Coding,"Courier New",monospace;fill:#1d4ed8;font-size:13px;text-anchor:middle}
      .title{font-size:29px;font-weight:800;text-anchor:middle}
      .sub{font-size:15px;text-anchor:middle;fill:#475569}
      .card{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:14}
      .blue{fill:#eff6ff;stroke:#3b82f6}
      .green{fill:#f0fdf4;stroke:#22c55e}
      .orange{fill:#fff7ed;stroke:#f97316}
      .purple{fill:#faf5ff;stroke:#8b5cf6}
      .pink{fill:#fff1f2;stroke:#f43f5e}
      .cyan{fill:#ecfeff;stroke:#06b6d4}
      .gray{fill:#f8fafc;stroke:#94a3b8}
      .h{font-size:18px;font-weight:700;text-anchor:middle}
      .m{font-size:13.5px;text-anchor:middle;fill:#334155}
      .tiny{font-size:12.5px;text-anchor:middle;fill:#475569}
      .line{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .loop{stroke:#f43f5e;stroke-width:2.4;fill:none;marker-end:url(#arrow);stroke-dasharray:7 5}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="46" class="title">AI 제안 검토·수정·재실행 루프</text>
  <text x="600" y="73" class="sub">AI 초안은 사람 검토와 PostgreSQL 실행 결과를 통과해야 반영합니다.</text>
  <rect x="55" y="150" width="180" height="92" class="card blue"/>
  <text x="145" y="181" class="h">검토 목표</text>
  <text x="145" y="208" class="m">범위·금지 변경</text>
  <rect x="285" y="150" width="170" height="92" class="card purple"/>
  <text x="370" y="181" class="h">AI 초안</text>
  <rect x="505" y="150" width="170" height="92" class="card orange"/>
  <text x="590" y="181" class="h">diff 확인</text>
  <rect x="725" y="150" width="190" height="92" class="card green"/>
  <text x="820" y="181" class="h">사람 검토</text>
  <text x="820" y="208" class="m">보안·근거</text>
  <rect x="965" y="150" width="180" height="92" class="card cyan"/>
  <text x="1055" y="181" class="h">PostgreSQL 실행</text>
  <path d="M235 196 L285 196" class="line"/>
  <path d="M455 196 L505 196" class="line"/>
  <path d="M675 196 L725 196" class="line"/>
  <path d="M915 196 L965 196" class="line"/>
  <rect x="310" y="385" width="235" height="115" class="card green"/>
  <text x="428" y="416" class="h">예상 결과 일치</text>
  <text x="428" y="443" class="m">검토 보고서 기록</text>
  <text x="428" y="463" class="m">사람 승인</text>
  <rect x="690" y="385" width="245" height="115" class="card pink"/>
  <text x="812" y="416" class="h">불일치 발견</text>
  <text x="812" y="443" class="m">요구사항·ERD·SQL</text>
  <text x="812" y="463" class="m">수정 후 재실행</text>
  <path d="M1055 242 L428 385" class="line"/>
  <path d="M545 442 L690 442" class="line"/>
  <path d="M812 385 L590 242" class="loop"/>
  <rect x="340" y="590" width="520" height="70" class="card gray"/>
  <text x="600" y="621" class="h">미검증 항목은 통과로 기록하지 않습니다.</text>
</svg>
