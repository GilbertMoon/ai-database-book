<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="100%" height="760" viewBox="0 0 1200 760" preserveAspectRatio="xMidYMid meet">
  <title id="title">설계 결정과 검증 근거를 설명하는 흐름</title>
  <desc id="desc">최종 보고서는 선택, 구현, 검증, 수정, 한계를 순서대로 설명합니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <style>
      text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#111827}
      .mono{font-family:Consolas,D2Coding,"Courier New",monospace;fill:#1d4ed8;font-size:13px;text-anchor:middle}
      .title{font-size:29px;font-weight:800;text-anchor:middle}
      .sub{font-size:15px;text-anchor:middle;fill:#475569}
      .card{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:14}
      .blue{fill:#eff6ff;stroke:#3b82f6}
      .green{fill:#f0fdf4;stroke:#22c55e}
      .orange{fill:#fff7ed;stroke:#f97316}
      .purple{fill:#faf5ff;stroke:#8b5cf6}
      .pink{fill:#fff1f2;stroke:#f43f5e}
      .cyan{fill:#ecfeff;stroke:#06b6d4}
      .gray{fill:#f8fafc;stroke:#94a3b8}
      .h{font-size:18px;font-weight:700;text-anchor:middle}
      .m{font-size:13.5px;text-anchor:middle;fill:#334155}
      .tiny{font-size:12.5px;text-anchor:middle;fill:#475569}
      .line{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .loop{stroke:#f43f5e;stroke-width:2.4;fill:none;marker-end:url(#arrow);stroke-dasharray:7 5}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="46" class="title">설계 결정과 검증 근거를 설명하는 흐름</text>
  <text x="600" y="73" class="sub">최종 보고서는 선택, 구현, 검증, 수정, 한계를 순서대로 설명합니다.</text>
  <rect x="55" y="140" width="170" height="82" class="card blue"/>
  <text x="140" y="171" class="h">문제·사용자</text>
  <rect x="265" y="140" width="170" height="82" class="card blue"/>
  <text x="350" y="171" class="h">범위</text>
  <rect x="475" y="140" width="190" height="82" class="card purple"/>
  <text x="570" y="171" class="h">설계 결정</text>
  <rect x="705" y="140" width="170" height="82" class="card orange"/>
  <text x="790" y="171" class="h">구현</text>
  <rect x="915" y="140" width="190" height="82" class="card green"/>
  <text x="1010" y="171" class="h">검증 증거</text>
  <path d="M225 181 L265 181" class="line"/>
  <path d="M435 181 L475 181" class="line"/>
  <path d="M665 181 L705 181" class="line"/>
  <path d="M875 181 L915 181" class="line"/>
  <rect x="155" y="390" width="200" height="86" class="card cyan"/>
  <text x="255" y="421" class="h">운영 판단</text>
  <rect x="420" y="390" width="210" height="86" class="card purple"/>
  <text x="525" y="421" class="h">AI·사람 수정</text>
  <rect x="700" y="390" width="180" height="86" class="card pink"/>
  <text x="790" y="421" class="h">현재 한계</text>
  <rect x="945" y="390" width="190" height="86" class="card green"/>
  <text x="1040" y="421" class="h">다음 버전</text>
  <path d="M1010 222 L255 390" class="line"/>
  <path d="M355 433 L420 433" class="line"/>
  <path d="M630 433 L700 433" class="line"/>
  <path d="M880 433 L945 433" class="line"/>
  <path d="M790 390 L570 222" class="loop"/>
  <rect x="310" y="600" width="580" height="72" class="card gray"/>
  <text x="600" y="631" class="h">검증 실패는 설계 결정 또는 구현 단계로 되돌아가는 근거입니다.</text>
</svg>
