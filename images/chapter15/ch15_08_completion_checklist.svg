<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="100%" height="700" viewBox="0 0 1200 700">
  <title id="title">최종 완료 판단 게이트</title>
  <desc id="desc">필수 근거가 모두 있어야 선택 확장으로 넘어갑니다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
  <style>text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#111827}.code{font-family:Consolas,D2Coding,"Courier New",monospace;fill:#1d4ed8;font-size:14px;text-anchor:middle}.t{font-size:29px;font-weight:800;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.card{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:14}.b{fill:#eff6ff;stroke:#3b82f6}.g{fill:#f0fdf4;stroke:#22c55e}.y{fill:#fffbeb;stroke:#f59e0b}.p{fill:#faf5ff;stroke:#8b5cf6}.r{fill:#fff1f2;stroke:#f43f5e}.c{fill:#ecfeff;stroke:#06b6d4}.h{font-size:18px;font-weight:700;text-anchor:middle}.m{font-size:13px;text-anchor:middle;fill:#334155}.line{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}.plain{stroke:#94a3b8;stroke-width:2;fill:none}</style></defs>
  <rect width="1200" height="700" fill="#fff"/>
  <text x="600" y="48" class="t">최종 완료 판단 게이트</text>
  <text x="600" y="75" class="s">필수 근거가 모두 있어야 선택 확장으로 넘어갑니다.</text>
  <rect x="80" y="145" width="260" height="115" class="card b"/>
  <text x="210" y="177" class="h">필수 근거 확인</text>
  <text x="210" y="205" class="m">requirements · erd</text>
  <text x="210" y="225" class="m">schema · seed · queries</text>
  <rect x="470" y="145" width="260" height="115" class="card y"/>
  <text x="600" y="177" class="h">모두 있음?</text>
  <text x="600" y="205" class="m">예상값과 실제값 비교</text>
  <rect x="860" y="110" width="250" height="105" class="card g"/>
  <text x="985" y="142" class="h">프로젝트 완료</text>
  <text x="985" y="170" class="m">final_report 정리</text>
  <rect x="860" y="300" width="250" height="105" class="card r"/>
  <text x="985" y="332" class="h">누락 보완</text>
  <text x="985" y="360" class="m">재실행 · 재검증</text>
  <line x1="340" y1="202" x2="470" y2="202" class="line"/>
  <line x1="730" y1="195" x2="860" y2="160" class="line"/>
  <line x1="600" y1="260" x2="860" y2="352" class="line"/>
  <line x1="860" y1="352" x2="340" y2="202" class="line"/>
  <rect x="300" y="555" width="600" height="75" class="card c"/>
  <text x="600" y="587" class="h">완료 후에만 웹 CRUD · NoSQL · RAG 같은 선택 확장을 판단합니다.</text>
</svg>
