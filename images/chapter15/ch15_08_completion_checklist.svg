<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
  <title id="title">AI 기반 데이터베이스 서비스 완성도 점검</title>
  <desc id="desc">기획과 설계, 구현과 검증, 서비스와 재현성의 세 영역으로 나누어 데이터베이스 프로젝트 완성도를 점검하는 체크리스트</desc>
  <defs>
    <style>
      text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}
      .title{font-size:27px;font-weight:700;text-anchor:middle}
      .section-label{font-size:18px;font-weight:700}
      .group{stroke-width:1.5;rx:16}
      .planning-group{fill:#f4f8ff;stroke:#93b4e6}
      .validation-group{fill:#f8fafc;stroke:#a8b3c4}
      .delivery-group{fill:#f2fbf5;stroke:#8bc9a0}
      .box{fill:#fff;stroke:#64748b;stroke-width:1.8;rx:12}
      .box-planning{stroke:#3b82c4}
      .box-validation{stroke:#7b8794}
      .box-delivery{stroke:#3c9a5f}
      .badge{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:middle}
      .badge-planning{fill:#2f6fad}
      .badge-validation{fill:#58677b}
      .badge-delivery{fill:#2f855a}
      .item-title{font-size:16px;font-weight:700;text-anchor:middle;dominant-baseline:middle}
      .item-sub{font-size:13px;text-anchor:middle;dominant-baseline:middle;fill:#475569}
      .footer{font-size:16px;font-weight:700;text-anchor:middle;dominant-baseline:middle;fill:#166534}
      .footer-label{font-size:14px;font-weight:700;fill:#166534}
    </style>
  </defs>

  <rect width="1200" height="880" fill="#fff"/>
  <text x="600" y="42" class="title">AI 기반 데이터베이스 서비스 완성도 점검</text>

  <rect x="34" y="80" width="1132" height="205" class="group planning-group"/>
  <text x="58" y="109" class="section-label">1. 기획·설계</text>
  <rect x="50" y="136" width="245" height="92" class="box box-planning"/>
  <circle cx="72" cy="156" r="14" class="badge-planning"/><text x="72" y="156" class="badge">1</text>
  <text x="172.5" y="176" class="item-title">문제와 사용자</text>
  <text x="172.5" y="204" class="item-sub">해결할 문제와 대상이 분명한가?</text>

  <rect x="325" y="136" width="245" height="92" class="box box-planning"/>
  <circle cx="347" cy="156" r="14" class="badge-planning"/><text x="347" y="156" class="badge">2</text>
  <text x="447.5" y="176" class="item-title">범위와 요구사항</text>
  <text x="447.5" y="204" class="item-sub">핵심 기능과 제외 항목이 정리되었는가?</text>

  <rect x="600" y="136" width="245" height="92" class="box box-planning"/>
  <circle cx="622" cy="156" r="14" class="badge-planning"/><text x="622" y="156" class="badge">3</text>
  <text x="722.5" y="176" class="item-title">엔터티·관계·ERD</text>
  <text x="722.5" y="204" class="item-sub">데이터와 관계가 정확히 구분되었는가?</text>

  <rect x="875" y="136" width="275" height="92" class="box box-planning"/>
  <circle cx="897" cy="156" r="14" class="badge-planning"/><text x="897" y="156" class="badge">4</text>
  <text x="1012.5" y="176" class="item-title">DDL·제약조건</text>
  <text x="1012.5" y="199" class="item-sub">타입·PK·FK·CHECK가 잘못된 값을 막는가?</text>
  <text x="1012.5" y="219" class="item-sub">schema.sql</text>

  <rect x="34" y="305" width="1132" height="205" class="group validation-group"/>
  <text x="58" y="334" class="section-label">2. 구현·검증</text>
  <rect x="50" y="361" width="245" height="92" class="box box-validation"/>
  <circle cx="72" cy="381" r="14" class="badge-validation"/><text x="72" y="381" class="badge">5</text>
  <text x="172.5" y="401" class="item-title">검증 시나리오 데이터</text>
  <text x="172.5" y="424" class="item-sub">정상·경계·모순 상황이 포함되는가?</text>
  <text x="172.5" y="444" class="item-sub">seed.sql</text>

  <rect x="325" y="361" width="245" height="92" class="box box-validation"/>
  <circle cx="347" cy="381" r="14" class="badge-validation"/><text x="347" y="381" class="badge">6</text>
  <text x="447.5" y="401" class="item-title">핵심 SQL·실행 검증</text>
  <text x="447.5" y="424" class="item-sub">요구사항을 실행 결과로 증명하는가?</text>
  <text x="447.5" y="444" class="item-sub">queries.sql</text>

  <rect x="600" y="361" width="245" height="92" class="box box-validation"/>
  <circle cx="622" cy="381" r="14" class="badge-validation"/><text x="622" y="381" class="badge">7</text>
  <text x="722.5" y="401" class="item-title">트랜잭션·인덱스·성능</text>
  <text x="722.5" y="424" class="item-sub">업무 단위와 조회 패턴을 설명할 수 있는가?</text>

  <rect x="875" y="361" width="275" height="92" class="box box-validation"/>
  <circle cx="897" cy="381" r="14" class="badge-validation"/><text x="897" y="381" class="badge">8</text>
  <text x="1012.5" y="401" class="item-title">보안·백업·복구</text>
  <text x="1012.5" y="424" class="item-sub">권한, 비밀정보, 복구 검증이 준비되었는가?</text>

  <rect x="34" y="530" width="1132" height="235" class="group delivery-group"/>
  <text x="58" y="559" class="section-label">3. 서비스·재현성</text>
  <rect x="50" y="586" width="245" height="102" class="box box-delivery"/>
  <circle cx="72" cy="606" r="14" class="badge-delivery"/><text x="72" y="606" class="badge">9</text>
  <text x="172.5" y="626" class="item-title">AI 활용·검토 기록</text>
  <text x="172.5" y="649" class="item-sub">프롬프트, 문제, 수정 이유가 남아 있는가?</text>
  <text x="172.5" y="669" class="item-sub">ai_review.md</text>

  <rect x="325" y="586" width="245" height="102" class="box box-delivery"/>
  <circle cx="347" cy="606" r="14" class="badge-delivery"/><text x="347" y="606" class="badge">10</text>
  <text x="447.5" y="626" class="item-title">웹 CRUD 동작</text>
  <text x="447.5" y="649" class="item-sub">입력, 조회, 상태 변경이 안전하게 동작하는가?</text>

  <rect x="600" y="586" width="245" height="102" class="box box-delivery"/>
  <circle cx="622" cy="606" r="14" class="badge-delivery"/><text x="622" y="606" class="badge">11</text>
  <text x="722.5" y="626" class="item-title">GitHub 저장소 정리</text>
  <text x="722.5" y="649" class="item-sub">파일 구조와 실행 순서가 이해되는가?</text>

  <rect x="875" y="586" width="275" height="102" class="box box-delivery"/>
  <circle cx="897" cy="606" r="14" class="badge-delivery"/><text x="897" y="606" class="badge">12</text>
  <text x="1012.5" y="626" class="item-title">문서화·재현성</text>
  <text x="1012.5" y="649" class="item-sub">다른 사람이 같은 결과를 다시 실행할 수 있는가?</text>
  <text x="1012.5" y="669" class="item-sub">README.md · project_notes.md</text>

  <rect x="220" y="800" width="760" height="44" fill="#ecfdf3" stroke="#62b47a" stroke-width="1.6" rx="11"/>
  <text x="242" y="820" class="footer-label">핵심 원칙</text>
  <text x="618" y="822" class="footer">기능 개수보다 설계 근거, 실행 결과와 재현 가능성을 확인한다</text>
</svg>
