<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="100%" height="760" viewBox="0 0 1200 760" preserveAspectRatio="xMidYMid meet">
  <title id="title">최종 완료 판단 게이트</title>
  <desc id="desc">필수 근거가 모두 통과해야 완료로 표시합니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <style>
      text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#111827}
      .mono{font-family:Consolas,D2Coding,"Courier New",monospace;fill:#1d4ed8;font-size:13px;text-anchor:middle}
      .title{font-size:29px;font-weight:800;text-anchor:middle}
      .sub{font-size:15px;text-anchor:middle;fill:#475569}
      .card{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:14}
      .blue{fill:#eff6ff;stroke:#3b82f6}
      .green{fill:#f0fdf4;stroke:#22c55e}
      .orange{fill:#fff7ed;stroke:#f97316}
      .purple{fill:#faf5ff;stroke:#8b5cf6}
      .pink{fill:#fff1f2;stroke:#f43f5e}
      .cyan{fill:#ecfeff;stroke:#06b6d4}
      .gray{fill:#f8fafc;stroke:#94a3b8}
      .h{font-size:18px;font-weight:700;text-anchor:middle}
      .m{font-size:13.5px;text-anchor:middle;fill:#334155}
      .tiny{font-size:12.5px;text-anchor:middle;fill:#475569}
      .line{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .loop{stroke:#f43f5e;stroke-width:2.4;fill:none;marker-end:url(#arrow);stroke-dasharray:7 5}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="46" class="title">최종 완료 판단 게이트</text>
  <text x="600" y="73" class="sub">필수 근거가 모두 통과해야 완료로 표시합니다.</text>
  <rect x="70" y="140" width="235" height="100" class="card blue"/>
  <text x="188" y="171" class="h">필수 근거 확인</text>
  <text x="188" y="198" class="m">requirements · erd</text>
  <text x="188" y="218" class="m">01~08 SQL</text>
  <rect x="370" y="140" width="235" height="100" class="card orange"/>
  <text x="488" y="171" class="h">실제 결과 검증</text>
  <text x="488" y="198" class="m">행 수 · FK · 이상 0</text>
  <text x="488" y="218" class="m">unexpected 0</text>
  <rect x="670" y="140" width="230" height="100" class="card cyan"/>
  <text x="785" y="171" class="h">미실행 항목 기록</text>
  <text x="785" y="198" class="m">운영·백업·권한</text>
  <text x="785" y="218" class="m">남은 한계</text>
  <rect x="960" y="140" width="190" height="100" class="card green"/>
  <text x="1055" y="171" class="h">완료 기준 판단</text>
  <path d="M305 190 L370 190" class="line"/>
  <path d="M605 190 L670 190" class="line"/>
  <path d="M900 190 L960 190" class="line"/>
  <rect x="250" y="390" width="260" height="112" class="card green"/>
  <text x="380" y="421" class="h">예</text>
  <text x="380" y="448" class="mono">required_completion</text>
  <text x="380" y="468" class="mono">gate_passed = true</text>
  <rect x="690" y="390" width="260" height="112" class="card pink"/>
  <text x="820" y="421" class="h">아니요</text>
  <text x="820" y="448" class="mono">누락 보완</text>
  <text x="820" y="468" class="mono">관련 SQL 재실행</text>
  <path d="M1055 240 L380 390" class="line"/>
  <path d="M1055 240 L820 390" class="line"/>
  <path d="M820 502 L485 240" class="loop"/>
  <rect x="300" y="615" width="600" height="72" class="card gray"/>
  <text x="600" y="646" class="h">완료 게이트 통과는 API, RAG, 배포가 모두 끝났다는 뜻이 아닙니다.</text>
</svg>
