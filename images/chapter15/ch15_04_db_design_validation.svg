<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="100%" height="700" viewBox="0 0 1200 700">
  <title id="title">요구사항부터 실행 결과까지 검증하기</title>
  <desc id="desc">REQ ID, ERD, DDL, seed, queries가 한 줄로 이어져야 합니다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
  <style>text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#111827}.code{font-family:Consolas,D2Coding,"Courier New",monospace;fill:#1d4ed8;font-size:14px;text-anchor:middle}.t{font-size:29px;font-weight:800;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.card{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:14}.b{fill:#eff6ff;stroke:#3b82f6}.g{fill:#f0fdf4;stroke:#22c55e}.y{fill:#fffbeb;stroke:#f59e0b}.p{fill:#faf5ff;stroke:#8b5cf6}.r{fill:#fff1f2;stroke:#f43f5e}.c{fill:#ecfeff;stroke:#06b6d4}.h{font-size:18px;font-weight:700;text-anchor:middle}.m{font-size:13px;text-anchor:middle;fill:#334155}.line{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}.plain{stroke:#94a3b8;stroke-width:2;fill:none}</style></defs>
  <rect width="1200" height="700" fill="#fff"/>
  <text x="600" y="48" class="t">요구사항부터 실행 결과까지 검증하기</text>
  <text x="600" y="75" class="s">REQ ID, ERD, DDL, seed, queries가 한 줄로 이어져야 합니다.</text>
  <rect x="55" y="155" width="170" height="90" class="card b"/>
  <text x="140" y="187" class="h">REQ ID</text>
  <rect x="275" y="155" width="170" height="90" class="card g"/>
  <text x="360" y="187" class="h">ERD</text>
  <rect x="495" y="155" width="170" height="90" class="card p"/>
  <text x="580" y="187" class="h">DDL</text>
  <rect x="715" y="155" width="170" height="90" class="card y"/>
  <text x="800" y="187" class="h">seed</text>
  <rect x="935" y="155" width="170" height="90" class="card c"/>
  <text x="1020" y="187" class="h">queries</text>
  <line x1="225" y1="200" x2="275" y2="200" class="line"/>
  <line x1="445" y1="200" x2="495" y2="200" class="line"/>
  <line x1="665" y1="200" x2="715" y2="200" class="line"/>
  <line x1="885" y1="200" x2="935" y2="200" class="line"/>
  <rect x="240" y="410" width="260" height="100" class="card g"/>
  <text x="370" y="442" class="h">예상 결과 일치</text>
  <text x="370" y="470" class="m">4 · 3 · 5 · 5 · 6 · 7</text>
  <rect x="700" y="410" width="260" height="100" class="card r"/>
  <text x="830" y="442" class="h">수정 필요</text>
  <text x="830" y="470" class="m">requirements부터 재검토</text>
  <line x1="1020" y1="245" x2="420" y2="410" class="line"/>
  <line x1="420" y1="510" x2="700" y2="510" class="line"/>
</svg>
