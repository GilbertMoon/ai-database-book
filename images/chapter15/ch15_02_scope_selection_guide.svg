<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc">
  <title id="title">데이터베이스 프로젝트 범위 선택 가이드</title>
  <desc id="desc">온라인 강의 플랫폼 예제를 이용하여 후보 기능을 핵심 서비스 성립 여부, 데이터베이스 설계 검증 필요성, 독립적 확장 가능성, 외부 의존성 기준으로 평가하고 기본 범위, 이후 확장 범위, 이번 버전 제외 범위로 나누는 흐름</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
    <style>
      text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}
      .title{font-size:27px;font-weight:700;text-anchor:middle}.subtitle{font-size:15px;text-anchor:middle;fill:#475569}
      .section{fill:#f8fafc;stroke:#a8b3c4;stroke-width:1.5;rx:16}.sectionTitle{font-size:18px;font-weight:700}.sectionSub{font-size:12.5px;fill:#475569}
      .box{fill:#fff;stroke-width:1.6;rx:11}.problem{stroke:#3b82c4}.candidate{stroke:#64748b}.decision{fill:#fff8e8;stroke:#b7791f;stroke-width:1.8}
      .boxTitle{font-size:14.5px;font-weight:700;text-anchor:middle}.boxMain{font-size:12.5px;font-weight:600;text-anchor:middle}.boxSub{font-size:11.5px;text-anchor:middle;fill:#475569}
      .flow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}.branch{font-size:12.5px;font-weight:700}.dashed{stroke:#94a3b8;stroke-width:1.5;fill:none;stroke-dasharray:6 5;marker-end:url(#arrow)}
      .bucket{fill:#fff;stroke-width:1.7;rx:12}.core{fill:#f2fbf5;stroke:#3c9a5f}.extend{fill:#f5f1ff;stroke:#7c5cc4}.exclude{fill:#fff5f5;stroke:#d9534f}
      .bucketTitle{font-size:17px;font-weight:700;text-anchor:middle}.bucketTag{font-size:12px;font-weight:700;text-anchor:middle}.item{font-size:12.5px;text-anchor:middle;fill:#334155}
      .verify{fill:#eef7ff;stroke:#2f6fad;stroke-width:1.6;rx:11}.verifyTitle{font-size:15px;font-weight:700;text-anchor:middle}.verifyText{font-size:12px;text-anchor:middle;fill:#475569}
      .note{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.3;rx:9}.noteTitle{font-size:12.5px;font-weight:700;text-anchor:middle;fill:#92400e}.noteText{font-size:11.3px;text-anchor:middle;fill:#475569}
      .principle{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.6;rx:11}.principleLabel{font-size:14px;font-weight:700;fill:#166534}.principleText{font-size:16px;font-weight:700;text-anchor:middle;fill:#166534}
    </style>
  </defs>

  <rect width="1200" height="1120" fill="#fff"/>
  <text x="600" y="40" class="title">데이터베이스 프로젝트 범위 선택 가이드</text>
  <text x="600" y="68" class="subtitle">기술을 많이 넣기보다 핵심 데이터 흐름을 끝까지 검증할 수 있는 작은 범위를 먼저 정한다</text>

  <rect x="34" y="92" width="1132" height="214" class="section"/>
  <text x="58" y="125" class="sectionTitle">1. 문제·사용자와 후보 기능을 먼저 적는다</text>
  <text x="405" y="125" class="sectionSub">예: 학생과 강사가 사용하는 온라인 강의 플랫폼</text>

  <rect x="55" y="150" width="280" height="116" class="box problem"/>
  <text x="195" y="180" class="boxTitle">프로젝트 문제와 핵심 사용자</text>
  <text x="195" y="211" class="boxMain">학생이 강의를 신청하고</text><text x="195" y="232" class="boxMain">강사가 수강 상태를 관리한다</text>
  <text x="195" y="255" class="boxSub">문제와 사용자가 범위 판단의 기준</text>

  <rect x="375" y="150" width="770" height="116" class="box candidate"/>
  <text x="760" y="178" class="boxTitle">후보 기능 목록</text>
  <text x="500" y="211" class="boxMain">학생·강사 등록</text><text x="670" y="211" class="boxMain">강의 개설</text><text x="840" y="211" class="boxMain">수강신청·상태</text><text x="1020" y="211" class="boxMain">강의별 수강생 조회</text>
  <text x="500" y="242" class="boxSub">결제·환불</text><text x="670" y="242" class="boxSub">진도율·수료증</text><text x="840" y="242" class="boxSub">강의평·추천</text><text x="1020" y="242" class="boxSub">RAG 학습 자료 검색</text>
  <path d="M335 208H375" class="flow"/>

  <rect x="34" y="330" width="1132" height="312" class="section"/>
  <text x="58" y="363" class="sectionTitle">2. 각 기능을 같은 기준으로 판단한다</text>

  <polygon points="180,400 300,462 180,524 60,462" class="decision"/>
  <text x="180" y="448" class="boxTitle">핵심 서비스에</text><text x="180" y="470" class="boxTitle">반드시 필요한가?</text>

  <polygon points="460,400 580,462 460,524 340,462" class="decision"/>
  <text x="460" y="448" class="boxTitle">DB 개념 검증에</text><text x="460" y="470" class="boxTitle">꼭 필요한가?</text>

  <polygon points="740,400 860,462 740,524 620,462" class="decision"/>
  <text x="740" y="448" class="boxTitle">다른 기능과 독립적으로</text><text x="740" y="470" class="boxTitle">나중에 추가 가능한가?</text>

  <polygon points="1020,400 1140,462 1020,524 900,462" class="decision"/>
  <text x="1020" y="448" class="boxTitle">외부 결제·인증·AI API</text><text x="1020" y="470" class="boxTitle">의존성이 큰가?</text>

  <path d="M300 462H340" class="flow"/><path d="M580 462H620" class="flow"/><path d="M860 462H900" class="flow"/>
  <text x="316" y="448" class="branch" fill="#b42318">아니요</text><text x="596" y="448" class="branch" fill="#b42318">아니요</text><text x="876" y="448" class="branch" fill="#b42318">아니요</text>

  <path d="M180 524V592H235" class="flow"/><text x="194" y="558" class="branch" fill="#166534">예</text>
  <path d="M460 524V574H235V592" class="flow"/><text x="474" y="557" class="branch" fill="#166534">예</text>
  <path d="M740 524V592H600" class="flow"/><text x="754" y="558" class="branch" fill="#166534">예</text>
  <path d="M1020 524V592H965" class="flow"/><text x="1034" y="558" class="branch" fill="#166534">예</text>

  <rect x="34" y="666" width="1132" height="252" class="section"/>
  <text x="58" y="699" class="sectionTitle">3. 이번 버전의 범위선을 명확히 기록한다</text>

  <rect x="55" y="724" width="330" height="158" class="bucket core"/>
  <text x="220" y="754" class="bucketTitle">기본 범위</text><text x="220" y="778" class="bucketTag" fill="#166534">이번 버전에서 반드시 완성</text>
  <text x="220" y="809" class="item">학생·강사 등록 · 강의 개설</text><text x="220" y="832" class="item">수강신청 · 상태 관리</text><text x="220" y="855" class="item">강의별 수강생 조회</text>

  <rect x="435" y="724" width="330" height="158" class="bucket extend"/>
  <text x="600" y="754" class="bucketTitle">이후 확장 범위</text><text x="600" y="778" class="bucketTag" fill="#5b3b8f">핵심 완성 후 독립적으로 추가</text>
  <text x="600" y="809" class="item">진도율 · 수료증 · 강의평</text><text x="600" y="832" class="item">추천 · 웹 API 고도화</text><text x="600" y="855" class="item">Vector DB · RAG 검색</text>

  <rect x="815" y="724" width="330" height="158" class="bucket exclude"/>
  <text x="980" y="754" class="bucketTitle">이번 버전 제외</text><text x="980" y="778" class="bucketTag" fill="#b42318">인터페이스와 데이터 구조만 설계 가능</text>
  <text x="980" y="809" class="item">실제 외부 결제 연동</text><text x="980" y="832" class="item">복잡한 인증·대규모 운영</text><text x="980" y="855" class="item">고급 자동화·실시간 추천</text>

  <path d="M235 592V724" class="dashed"/><path d="M600 592V724" class="dashed"/><path d="M965 592V724" class="dashed"/>

  <rect x="34" y="942" width="1132" height="110" class="section"/>
  <rect x="58" y="964" width="810" height="66" class="verify"/>
  <text x="463" y="988" class="verifyTitle">기본 범위 완료 기준</text>
  <text x="463" y="1012" class="verifyText">엔터티·관계·PK/FK·상태 제약 → 샘플 데이터 → 등록·조회·상태 변경·JOIN·집계·오류 차단 SQL까지 검증</text>
  <rect x="890" y="964" width="252" height="66" class="note"/>
  <text x="1016" y="987" class="noteTitle">제외는 포기가 아님</text><text x="1016" y="1009" class="noteText">시간·복잡도·외부 의존성을 통제하는</text><text x="1016" y="1026" class="noteText">의도적인 설계 결정</text>

  <rect x="160" y="1070" width="880" height="38" class="principle"/>
  <text x="185" y="1094" class="principleLabel">핵심 원칙</text><text x="640" y="1095" class="principleText">핵심 데이터 흐름을 먼저 완성한 뒤 목적이 분명한 기술만 확장한다</text>
</svg>