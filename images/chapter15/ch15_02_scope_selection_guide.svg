<?xml version="1.0" encoding="utf-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="100%"
  viewBox="0 0 1200 780"
  role="img"
  aria-labelledby="title desc"
  preserveAspectRatio="xMidYMid meet"
>
  <title id="title">필수 범위와 선택 확장 결정하기</title>
  <desc id="desc">필수 데이터베이스 완료 게이트를 먼저 통과한 뒤 실제 요구사항에 따라 웹 CRUD와 API, NoSQL, Vector DB와 RAG, 배포를 선택하는 흐름</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
    <style>
      text {
        font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif;
        fill: #111827;
      }
      .mono {
        font-family: Consolas, D2Coding, "Courier New", monospace;
      }
      .title {
        font-size: 29px;
        font-weight: 800;
        text-anchor: middle;
      }
      .subtitle {
        font-size: 15px;
        text-anchor: middle;
        fill: #475569;
      }
      .card {
        stroke-width: 2;
        rx: 14;
        ry: 14;
      }
      .required {
        fill: #eff6ff;
        stroke: #3b82f6;
      }
      .review {
        fill: #fffbeb;
        stroke: #f59e0b;
      }
      .web {
        fill: #f0fdf4;
        stroke: #22c55e;
      }
      .nosql {
        fill: #faf5ff;
        stroke: #8b5cf6;
      }
      .rag {
        fill: #ecfeff;
        stroke: #06b6d4;
      }
      .deploy {
        fill: #f1f5f9;
        stroke: #64748b;
      }
      .retry {
        fill: #fff1f2;
        stroke: #f43f5e;
      }
      .note {
        fill: #fff8eb;
        stroke: #f59e0b;
        stroke-width: 1.8;
        rx: 13;
        ry: 13;
      }
      .head {
        font-size: 18px;
        font-weight: 700;
        text-anchor: middle;
      }
      .body {
        font-size: 13.5px;
        text-anchor: middle;
        fill: #334155;
      }
      .small {
        font-size: 12.5px;
        text-anchor: middle;
        fill: #475569;
      }
      .badge {
        font-size: 12px;
        font-weight: 700;
        text-anchor: middle;
      }
      .line {
        stroke: #475569;
        stroke-width: 2.5;
        fill: none;
        marker-end: url(#arrow);
      }
      .branch {
        stroke: #94a3b8;
        stroke-width: 2.2;
        fill: none;
      }
      .retry-line {
        stroke: #dc2626;
        stroke-width: 2.3;
        fill: none;
        marker-end: url(#arrow);
      }
      .decision {
        fill: #fffbeb;
        stroke: #f59e0b;
        stroke-width: 2.2;
      }
      .tag {
        font-size: 12.5px;
        font-weight: 700;
        fill: #475569;
      }
    </style>
  </defs>

  <rect width="1200" height="780" fill="#ffffff"/>

  <text x="600" y="46" class="title">필수 범위와 선택 확장 결정하기</text>
  <text x="600" y="76" class="subtitle">기본 데이터베이스 검증을 먼저 완료하고, 실제 요구사항이 있을 때만 확장을 선택합니다.</text>

  <!-- Required database completion -->
  <rect x="45" y="150" width="270" height="200" class="card required"/>
  <text x="180" y="184" class="head">필수 DB 완성</text>
  <text x="180" y="216" class="body mono">requirements · ERD · DDL</text>
  <text x="180" y="244" class="body mono">schema · seed · queries</text>
  <text x="180" y="272" class="body">정상·경계·반례·트랜잭션</text>
  <text x="180" y="300" class="body">인덱스·보안·백업·복구 계획</text>
  <text x="180" y="328" class="small">01~08과 10 완료 기준</text>

  <!-- Required completion gate -->
  <polygon points="530,145 690,250 530,355 370,250" class="decision"/>
  <text x="530" y="225" class="head">필수 완료 게이트를</text>
  <text x="530" y="252" class="head">통과했는가?</text>
  <text x="530" y="283" class="small">예상값과 실제 실행 결과 비교</text>

  <!-- Expansion decision -->
  <rect x="790" y="170" width="320" height="165" class="card review"/>
  <text x="950" y="204" class="head">선택 확장 필요성 판단</text>
  <text x="950" y="238" class="body">기술이 아니라 문제와 조회 패턴 기준</text>
  <text x="950" y="266" class="body">실제 검증 대상이 있을 때만 선택</text>
  <text x="950" y="298" class="small">필요 없으면 기본 DB 완료 상태를 유지</text>

  <!-- Main flow -->
  <path d="M315 250 H370" class="line"/>
  <path d="M690 250 H790" class="line"/>
  <text x="740" y="234" text-anchor="middle" class="tag">예</text>

  <!-- Retry flow -->
  <rect x="55" y="415" width="300" height="95" class="card retry"/>
  <text x="205" y="448" class="head">필수 항목 보완</text>
  <text x="205" y="476" class="body">관련 SQL 재실행 · 재검증</text>
  <text x="205" y="496" class="small">누락 지점부터 다시 확인</text>
  <path d="M530 355 V385 H205 V415" class="retry-line"/>
  <text x="445" y="379" class="tag">아니요</text>
  <path d="M55 462 H25 V250 H45" class="retry-line"/>

  <!-- Optional expansion branch -->
  <path d="M950 335 V470" class="branch"/>
  <path d="M170 470 H1025" class="branch"/>
  <text x="950" y="455" text-anchor="middle" class="tag">요구사항에 따라 선택</text>

  <path d="M170 470 V535" class="line"/>
  <path d="M455 470 V535" class="line"/>
  <path d="M740 470 V535" class="line"/>
  <path d="M1025 470 V535" class="line"/>

  <!-- Optional cards -->
  <rect x="45" y="535" width="250" height="125" class="card web"/>
  <text x="170" y="566" class="head">웹 CRUD/API</text>
  <text x="170" y="592" class="badge" fill="#166534">선택</text>
  <text x="170" y="618" class="body">화면이나 API로 입력·조회 흐름을</text>
  <text x="170" y="642" class="body">검증해야 할 때</text>

  <rect x="330" y="535" width="250" height="125" class="card nosql"/>
  <text x="455" y="566" class="head">NoSQL</text>
  <text x="455" y="592" class="badge" fill="#6b21a8">선택</text>
  <text x="455" y="618" class="body">캐시·이벤트·가변 문서라는</text>
  <text x="455" y="642" class="body">별도 조회 패턴이 있을 때</text>

  <rect x="615" y="535" width="250" height="125" class="card rag"/>
  <text x="740" y="566" class="head">Vector DB/RAG</text>
  <text x="740" y="592" class="badge" fill="#0e7490">선택</text>
  <text x="740" y="618" class="body">의미 검색과 근거 기반 답변이</text>
  <text x="740" y="642" class="body">필요할 때</text>

  <rect x="900" y="535" width="250" height="125" class="card deploy"/>
  <text x="1025" y="566" class="head">배포</text>
  <text x="1025" y="592" class="badge" fill="#475569">선택</text>
  <text x="1025" y="618" class="body">다른 사용자가 실제 환경에서</text>
  <text x="1025" y="642" class="body">검증해야 할 때</text>

  <!-- Key principle -->
  <rect x="200" y="700" width="800" height="52" class="note"/>
  <text x="600" y="732" class="head">기술 개수가 아니라 요구사항과 검증 증거로 확장을 결정합니다.</text>
</svg>
