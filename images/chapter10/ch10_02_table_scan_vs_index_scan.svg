<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Seq Scan과 Index Scan의 검색 경로</title>
<desc id="desc">전체 읽기와 인덱스 탐색은 비용 비교로 선택된다</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>
text{font-family:"Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif;fill:#0f172a} .title{font-size:28px;font-weight:700;text-anchor:middle} .sub{font-size:14px;fill:#475569;text-anchor:middle} .box{fill:#ffffff;stroke:#7fb3f5;stroke-width:2;rx:14} .scan{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:14} .idx{fill:#ecfdf5;stroke:#22c55e;stroke-width:2;rx:14} .cand{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:14} .warn{fill:#fdf2f8;stroke:#db2777;stroke-width:2;rx:14} .ai{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2;rx:14} .note{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5;rx:12} .head{font-size:18px;font-weight:700;text-anchor:middle} .body{font-size:13.5px;text-anchor:middle;fill:#334155} .small{font-size:12.5px;text-anchor:middle;fill:#334155} .code{font-family:Consolas, D2Coding, "Courier New", monospace;font-size:13px;font-weight:700;text-anchor:middle;fill:#1d4ed8} .arrow{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)} .dash{stroke:#db2777;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)} .tag{font-size:12px;font-weight:700;fill:#2563eb;text-anchor:middle}
</style></defs>
<rect width="1200" height="560" fill="#ffffff"/>
<text x="600" y="48" class="title">Seq Scan과 Index Scan의 검색 경로</text>
<text x="600" y="76" class="sub">전체 읽기와 인덱스 탐색은 비용 비교로 선택된다</text>
<rect x="90" y="145" width="230" height="150" class="cand"/>
<text x="205.0" y="177" class="head">조회 SQL</text>
<text x="205.0" y="203" class="body">WHERE email = ...</text>
<rect x="470" y="120" width="240" height="170" class="scan"/>
<text x="590.0" y="152" class="head">Seq Scan</text>
<text x="590.0" y="178" class="body">테이블 전체 확인</text>
<text x="590.0" y="200" class="body">많은 행 반환에 적합</text>
<rect x="470" y="335" width="240" height="170" class="idx"/>
<text x="590.0" y="367" class="head">Index Scan</text>
<text x="590.0" y="393" class="body">인덱스 먼저 탐색</text>
<text x="590.0" y="415" class="body">적은 행 선택에 유리</text>
<rect x="875" y="145" width="230" height="150" class="box"/>
<text x="990.0" y="177" class="head">판단 기준</text>
<text x="990.0" y="203" class="body">테이블 크기</text>
<text x="990.0" y="225" class="body">선택도 · 비용</text>
<path d="M320 220 L470 205" class="arrow"/>
<path d="M320 220 L470 420" class="arrow"/>
<path d="M710 205 L875 220" class="arrow"/>
<path d="M710 420 L990 295" class="arrow"/>
<text x="600" y="80" class="tag">Seq Scan도 정상적인 선택일 수 있다</text>
</svg>
