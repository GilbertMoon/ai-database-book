<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">JOIN 관계와 외래키 인덱스 후보</title>
  <desc id="desc">부모 기본키에는 자동 인덱스가 있지만 PostgreSQL의 자식 외래키 컬럼에는 자동 인덱스가 없으므로 반복 JOIN과 WHERE, 선택도, 쓰기 비용과 실행 계획을 검토해 수동 인덱스 후보 또는 보류로 판단하는 직각 흐름도</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#334155"/>
    </marker>
    <style>
      text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#0f172a}
      .title{font-size:28px;font-weight:700;text-anchor:middle}
      .sub{font-size:14px;fill:#475569;text-anchor:middle}
      .section-title{font-size:17px;font-weight:700;text-anchor:middle}
      .head{font-size:17px;font-weight:700;text-anchor:middle}
      .body{font-size:13.5px;text-anchor:middle;fill:#334155}
      .small{font-size:12.5px;text-anchor:middle;fill:#475569}
      .tag{font-size:12px;font-weight:700;text-anchor:middle;fill:#2563eb}
      .group{stroke:#cbd5e1;stroke-width:1.5;rx:18;ry:18}
      .parent-group{fill:#f0fdf4}
      .child-group{fill:#fff1f2}
      .card{stroke-width:2;rx:14;ry:14}
      .pk{fill:#ecfdf5;stroke:#22c55e}
      .fk{fill:#fdf2f8;stroke:#db2777}
      .decision{fill:#eff6ff;stroke:#2563eb}
      .candidate{fill:#ecfdf5;stroke:#16a34a}
      .hold{fill:#fff7ed;stroke:#f97316}
      .note{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5;rx:14;ry:14}
      .arrow{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow);stroke-linejoin:round}
      .connector{stroke:#334155;stroke-width:2.2;fill:none;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="1200" height="680" fill="#ffffff"/>
  <text x="600" y="48" class="title">JOIN 관계와 외래키 인덱스 후보</text>
  <text x="600" y="76" class="sub">FK 제약조건과 인덱스의 목적을 구분하고 실제 조회 패턴으로 판단한다</text>

  <!-- Parent PK section -->
  <rect x="45" y="115" width="250" height="425" class="group parent-group"/>
  <text x="170" y="150" class="section-title">부모 테이블</text>

  <rect x="70" y="175" width="200" height="120" class="card pk"/>
  <text x="170" y="212" class="head">students.id</text>
  <text x="170" y="242" class="body">기본키(PK)</text>
  <text x="170" y="269" class="small">자동 인덱스 생성</text>

  <rect x="70" y="345" width="200" height="120" class="card pk"/>
  <text x="170" y="382" class="head">courses.id</text>
  <text x="170" y="412" class="body">기본키(PK)</text>
  <text x="170" y="439" class="small">자동 인덱스 생성</text>

  <!-- Child FK section -->
  <rect x="340" y="115" width="300" height="425" class="group child-group"/>
  <text x="490" y="150" class="section-title">자식 테이블</text>

  <rect x="375" y="175" width="230" height="120" class="card fk"/>
  <text x="490" y="207" class="head">enrollments.student_id</text>
  <text x="490" y="237" class="body">외래키(FK) 자식 컬럼</text>
  <text x="490" y="264" class="small">PostgreSQL 자동 인덱스 없음</text>

  <rect x="375" y="345" width="230" height="120" class="card fk"/>
  <text x="490" y="377" class="head">enrollments.course_id</text>
  <text x="490" y="407" class="body">외래키(FK) 자식 컬럼</text>
  <text x="490" y="434" class="small">PostgreSQL 자동 인덱스 없음</text>

  <!-- Shared decision -->
  <rect x="720" y="205" width="220" height="240" class="card decision"/>
  <text x="830" y="242" class="head">인덱스 후보 검토</text>
  <text x="830" y="282" class="body">반복 JOIN·WHERE인가?</text>
  <text x="830" y="315" class="body">선택도가 충분한가?</text>
  <text x="830" y="348" class="body">쓰기 비용은 감당 가능한가?</text>
  <text x="830" y="381" class="body">실행 계획에서 효과가 있는가?</text>
  <text x="830" y="416" class="small">후보 선정 뒤 적용 전·후 비교</text>

  <!-- Outcomes -->
  <rect x="990" y="190" width="170" height="105" class="card candidate"/>
  <text x="1075" y="228" class="head">수동 인덱스 후보</text>
  <text x="1075" y="258" class="body">DDL 작성·재검증</text>

  <rect x="990" y="360" width="170" height="105" class="card hold"/>
  <text x="1075" y="398" class="head">보류</text>
  <text x="1075" y="428" class="body">효과 또는 근거 부족</text>

  <!-- Straight parent-to-child relationships -->
  <path d="M270 235 H375" class="arrow"/>
  <text x="322" y="219" class="tag">참조</text>

  <path d="M270 405 H375" class="arrow"/>
  <text x="322" y="389" class="tag">참조</text>

  <!-- Orthogonal convergence -->
  <path d="M605 235 H680 V325 H720" class="arrow"/>
  <path d="M605 405 H680 V325" class="connector"/>

  <!-- Orthogonal outcome branches -->
  <path d="M940 325 H965 V242 H990" class="arrow"/>
  <text x="970" y="218" class="tag">효과 확인</text>

  <path d="M965 325 V412 H990" class="arrow"/>
  <text x="971" y="448" class="tag">효과 불충분</text>

  <!-- Principle -->
  <rect x="210" y="575" width="780" height="70" class="note"/>
  <text x="600" y="603" class="head">FK는 참조 무결성을 보장하고, 인덱스는 조회 성능을 지원합니다.</text>
  <text x="600" y="630" class="body">외래키가 있다는 이유만으로 무조건 인덱스를 만들지 말고 JOIN·WHERE와 실행 계획을 근거로 판단합니다.</text>
</svg>
