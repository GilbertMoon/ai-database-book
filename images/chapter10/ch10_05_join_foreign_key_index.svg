<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">JOIN 관계와 외래키 인덱스 후보</title>
<desc id="desc">PostgreSQL은 FK 자식 컬럼 인덱스를 자동 생성하지 않는다</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>
text{font-family:"Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif;fill:#0f172a} .title{font-size:28px;font-weight:700;text-anchor:middle} .sub{font-size:14px;fill:#475569;text-anchor:middle} .box{fill:#ffffff;stroke:#7fb3f5;stroke-width:2;rx:14} .scan{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:14} .idx{fill:#ecfdf5;stroke:#22c55e;stroke-width:2;rx:14} .cand{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:14} .warn{fill:#fdf2f8;stroke:#db2777;stroke-width:2;rx:14} .ai{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2;rx:14} .note{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5;rx:12} .head{font-size:18px;font-weight:700;text-anchor:middle} .body{font-size:13.5px;text-anchor:middle;fill:#334155} .small{font-size:12.5px;text-anchor:middle;fill:#334155} .code{font-family:Consolas, D2Coding, "Courier New", monospace;font-size:13px;font-weight:700;text-anchor:middle;fill:#1d4ed8} .arrow{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)} .dash{stroke:#db2777;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)} .tag{font-size:12px;font-weight:700;fill:#2563eb;text-anchor:middle}
</style></defs>
<rect width="1200" height="540" fill="#ffffff"/>
<text x="600" y="48" class="title">JOIN 관계와 외래키 인덱스 후보</text>
<text x="600" y="76" class="sub">PostgreSQL은 FK 자식 컬럼 인덱스를 자동 생성하지 않는다</text>
<rect x="80" y="150" width="210" height="120" class="idx"/>
<text x="185.0" y="182" class="head">students.id</text>
<text x="185.0" y="208" class="body">PK 자동 인덱스</text>
<rect x="80" y="340" width="210" height="120" class="idx"/>
<text x="185.0" y="372" class="head">courses.id</text>
<text x="185.0" y="398" class="body">PK 자동 인덱스</text>
<rect x="445" y="150" width="260" height="120" class="warn"/>
<text x="575.0" y="182" class="head">enrollments.student_id</text>
<text x="575.0" y="208" class="body">FK 자식 컬럼</text>
<text x="575.0" y="230" class="body">자동 인덱스 없음</text>
<rect x="445" y="340" width="260" height="120" class="warn"/>
<text x="575.0" y="372" class="head">enrollments.course_id</text>
<text x="575.0" y="398" class="body">FK 자식 컬럼</text>
<text x="575.0" y="420" class="body">자동 인덱스 없음</text>
<polygon points="875,175.0 995.0,250 875,325.0 755.0,250" class="cand"/>
<text x="875" y="244" class="head">조회가 잦은가?</text>
<text x="875" y="268" class="small">JOIN · WHERE</text>
<path d="M290 210 L445 210" class="arrow"/>
<path d="M290 400 L445 400" class="arrow"/>
<path d="M705 210 L765 250" class="arrow"/>
<path d="M705 400 L765 250" class="arrow"/>
<rect x="995" y="145" width="150" height="105" class="idx"/>
<text x="1070.0" y="177" class="head">예</text>
<text x="1070.0" y="203" class="body">수동 후보</text>
<rect x="995" y="355" width="150" height="105" class="box"/>
<text x="1070.0" y="387" class="head">아니요</text>
<text x="1070.0" y="413" class="body">보류</text>
<path d="M995 250 L1040 250" class="arrow"/>
<path d="M875 325 L1040 355" class="arrow"/>
</svg>
