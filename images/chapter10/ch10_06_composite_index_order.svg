<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">복합 인덱스의 선두 컬럼과 쿼리 조건</title>
<desc id="desc">복합 인덱스는 첫 번째 컬럼과 조건 조합이 중요하다</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>
text{font-family:"Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif;fill:#0f172a} .title{font-size:28px;font-weight:700;text-anchor:middle} .sub{font-size:14px;fill:#475569;text-anchor:middle} .box{fill:#ffffff;stroke:#7fb3f5;stroke-width:2;rx:14} .scan{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:14} .idx{fill:#ecfdf5;stroke:#22c55e;stroke-width:2;rx:14} .cand{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:14} .warn{fill:#fdf2f8;stroke:#db2777;stroke-width:2;rx:14} .ai{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2;rx:14} .note{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5;rx:12} .head{font-size:18px;font-weight:700;text-anchor:middle} .body{font-size:13.5px;text-anchor:middle;fill:#334155} .small{font-size:12.5px;text-anchor:middle;fill:#334155} .code{font-family:Consolas, D2Coding, "Courier New", monospace;font-size:13px;font-weight:700;text-anchor:middle;fill:#1d4ed8} .arrow{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)} .dash{stroke:#db2777;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)} .tag{font-size:12px;font-weight:700;fill:#2563eb;text-anchor:middle}
</style></defs>
<rect width="1200" height="580" fill="#ffffff"/>
<text x="600" y="48" class="title">복합 인덱스의 선두 컬럼과 쿼리 조건</text>
<text x="600" y="76" class="sub">복합 인덱스는 첫 번째 컬럼과 조건 조합이 중요하다</text>
<rect x="455" y="120" width="290" height="115" class="ai"/>
<text x="600.0" y="152" class="head">복합 인덱스</text>
<text x="600.0" y="178" class="code">idx_enrollments_course_status</text>
<text x="600.0" y="200" class="code">(course_id, status)</text>
<rect x="100" y="330" width="230" height="120" class="idx"/>
<text x="215.0" y="362" class="head">course_id 조건</text>
<text x="215.0" y="388" class="body">선두 컬럼 사용</text>
<text x="215.0" y="410" class="body">활용 가능성 있음</text>
<rect x="485" y="330" width="230" height="120" class="idx"/>
<text x="600.0" y="362" class="head">course_id + status</text>
<text x="600.0" y="388" class="body">두 컬럼 모두 사용</text>
<text x="600.0" y="410" class="body">가장 잘 맞음</text>
<rect x="870" y="330" width="230" height="120" class="warn"/>
<text x="985.0" y="362" class="head">status 단독</text>
<text x="985.0" y="388" class="body">선두 컬럼 없음</text>
<text x="985.0" y="410" class="body">효율 낮을 수 있음</text>
<path d="M520 235 L215 330" class="arrow"/>
<path d="M600 235 L600 330" class="arrow"/>
<path d="M680 235 L985 330" class="arrow"/>
<text x="600" y="515" class="head">(course_id, status)와 (status, course_id)는 같은 인덱스가 아니다</text>
</svg>
