<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">WHERE 조건에서 인덱스 후보 판단하기</title>
  <desc id="desc">WHERE 컬럼에 기존 PK 또는 UNIQUE 인덱스가 있는지 확인하고, 없으면 실행 빈도와 선택도를 검토한 뒤 인덱스 후보를 실행 계획으로 비교하거나 보류하는 직각 흐름도</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#334155"/>
    </marker>
    <style>
      text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#0f172a}
      .title{font-size:28px;font-weight:700;text-anchor:middle}
      .sub{font-size:14px;fill:#475569;text-anchor:middle}
      .box{fill:#ffffff;stroke:#7fb3f5;stroke-width:2;rx:14;ry:14}
      .idx{fill:#ecfdf5;stroke:#22c55e;stroke-width:2;rx:14;ry:14}
      .cand{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:14;ry:14}
      .warn{fill:#fdf2f8;stroke:#db2777;stroke-width:2;rx:14;ry:14}
      .hold{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:14;ry:14}
      .note{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5;rx:12;ry:12}
      .head{font-size:18px;font-weight:700;text-anchor:middle}
      .body{font-size:13.5px;text-anchor:middle;fill:#334155}
      .small{font-size:12.5px;text-anchor:middle;fill:#334155}
      .arrow{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow);stroke-linejoin:round}
      .tag{font-size:12px;font-weight:700;fill:#2563eb;text-anchor:middle}
    </style>
  </defs>

  <rect width="1200" height="680" fill="#ffffff"/>
  <text x="600" y="48" class="title">WHERE 조건에서 인덱스 후보 판단하기</text>
  <text x="600" y="76" class="sub">기존 인덱스, 실행 빈도, 선택도와 실행 계획을 순서대로 확인한다</text>

  <!-- Start -->
  <rect x="55" y="200" width="190" height="110" class="cand"/>
  <text x="150" y="238" class="head">WHERE 컬럼</text>
  <text x="150" y="267" class="body">반복되는 검색 조건</text>
  <text x="150" y="290" class="small">예: students.email</text>

  <!-- First decision -->
  <polygon points="370,170 485,255 370,340 255,255" class="cand"/>
  <text x="370" y="246" class="head">자동 인덱스가</text>
  <text x="370" y="270" class="head">이미 있는가?</text>
  <text x="370" y="295" class="small">PK · UNIQUE</text>

  <!-- Existing index path -->
  <rect x="560" y="200" width="220" height="110" class="warn"/>
  <text x="670" y="238" class="head">중복 생성 안 함</text>
  <text x="670" y="267" class="body">기존 인덱스 확인</text>
  <text x="670" y="290" class="small">같은 목적의 인덱스 추가 금지</text>

  <!-- Second decision -->
  <polygon points="370,355 495,445 370,535 245,445" class="cand"/>
  <text x="370" y="425" class="head">자주 실행되고</text>
  <text x="370" y="449" class="head">선택도가 높은가?</text>
  <text x="370" y="474" class="small">빈도 · 결과 행 비율</text>

  <!-- Candidate and plan comparison -->
  <rect x="560" y="400" width="190" height="90" class="cand"/>
  <text x="655" y="436" class="head">인덱스 후보</text>
  <text x="655" y="465" class="body">DDL 초안 작성</text>

  <rect x="840" y="390" width="230" height="110" class="idx"/>
  <text x="955" y="428" class="head">실행 계획 비교</text>
  <text x="955" y="457" class="body">적용 전·후 비용 확인</text>
  <text x="955" y="480" class="small">효과가 없으면 보류</text>

  <!-- Hold path -->
  <rect x="270" y="565" width="200" height="75" class="hold"/>
  <text x="370" y="595" class="head">보류</text>
  <text x="370" y="620" class="body">읽기 이득보다 쓰기 비용 우려</text>

  <!-- Principle note -->
  <rect x="550" y="550" width="520" height="90" class="note"/>
  <text x="810" y="582" class="head">판단 원칙</text>
  <text x="810" y="610" class="body">모든 WHERE 컬럼이 인덱스 대상은 아니다</text>
  <text x="810" y="630" class="small">후보 선정 뒤 반드시 실행 계획과 실제 조회 패턴으로 검증한다</text>

  <!-- Orthogonal connectors -->
  <path d="M245 255 H255" class="arrow"/>

  <path d="M485 255 H560" class="arrow"/>
  <text x="522" y="238" class="tag">예</text>

  <path d="M370 340 V355" class="arrow"/>
  <text x="400" y="350" class="tag">아니요</text>

  <path d="M495 445 H560" class="arrow"/>
  <text x="527" y="428" class="tag">예</text>

  <path d="M750 445 H840" class="arrow"/>

  <path d="M370 535 V565" class="arrow"/>
  <text x="402" y="554" class="tag">아니요</text>
</svg>