<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1360 800" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">AI 추천 인덱스 검토 흐름</title>
  <desc id="desc">AI가 추천한 인덱스를 기존 인덱스와 비교해 중복 후보를 폐기하고, 남은 후보는 쿼리 패턴과 EXPLAIN ANALYZE BUFFERS 실행 계획을 검증한 뒤 적용 후보 승인 또는 보류로 결정하는 직각 흐름도</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#334155"/>
    </marker>
    <style>
      text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#0f172a}
      .title{font-size:28px;font-weight:700;text-anchor:middle}
      .sub{font-size:14px;fill:#475569;text-anchor:middle}
      .head{font-size:17px;font-weight:700;text-anchor:middle}
      .body{font-size:13.5px;text-anchor:middle;fill:#334155}
      .small{font-size:12.5px;text-anchor:middle;fill:#475569}
      .code{font-family:Consolas,D2Coding,"Courier New",monospace;font-size:12.5px;font-weight:700;text-anchor:middle;fill:#1d4ed8}
      .step{font-size:12px;font-weight:700;fill:#ffffff;text-anchor:middle}
      .yes{font-size:12px;font-weight:700;fill:#15803d;text-anchor:middle}
      .no{font-size:12px;font-weight:700;fill:#b45309;text-anchor:middle}
      .card{stroke-width:2;rx:14;ry:14}
      .ai{fill:#f5f3ff;stroke:#8b5cf6}
      .review{fill:#eff6ff;stroke:#2563eb}
      .decision{fill:#ffffff;stroke:#2563eb;stroke-width:2}
      .discard{fill:#fdf2f8;stroke:#db2777}
      .verify{fill:#ecfdf5;stroke:#22c55e}
      .apply{fill:#dcfce7;stroke:#16a34a}
      .hold{fill:#fff7ed;stroke:#f97316}
      .note{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5;rx:14;ry:14}
      .arrow{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow);stroke-linejoin:round}
    </style>
  </defs>

  <rect width="1360" height="800" fill="#ffffff"/>
  <text x="680" y="48" class="title">AI 추천 인덱스 검토 흐름</text>
  <text x="680" y="76" class="sub">추천을 바로 적용하지 않고 중복, 조회 패턴, 실행 계획과 쓰기 비용을 단계별로 검증한다</text>

  <!-- Principle -->
  <rect x="80" y="105" width="1200" height="60" class="note"/>
  <text x="680" y="132" class="head">핵심 원칙</text>
  <text x="680" y="154" class="small">AI 추천 인덱스는 후보일 뿐이며, 기존 인덱스와 측정 가능한 실행 계획 개선 근거가 있어야 한다</text>

  <!-- Stage 1 -->
  <rect x="60" y="210" width="180" height="115" class="card ai"/>
  <circle cx="88" cy="238" r="15" fill="#8b5cf6"/>
  <text x="88" y="243" class="step">1</text>
  <text x="150" y="250" class="head">AI 추천</text>
  <text x="150" y="280" class="body">인덱스 초안</text>
  <text x="150" y="305" class="code">CREATE INDEX ...</text>

  <rect x="300" y="210" width="220" height="115" class="card review"/>
  <circle cx="328" cy="238" r="15" fill="#2563eb"/>
  <text x="328" y="243" class="step">2</text>
  <text x="410" y="250" class="head">기존 인덱스 확인</text>
  <text x="410" y="280" class="body">PK · UNIQUE · 수동 인덱스</text>
  <text x="410" y="305" class="small">컬럼·순서·조건과 목적 비교</text>

  <polygon points="650,190 770,267.5 650,345 530,267.5" class="decision"/>
  <circle cx="590" cy="218" r="15" fill="#2563eb"/>
  <text x="590" y="223" class="step">3</text>
  <text x="650" y="257" class="head">중복되거나</text>
  <text x="650" y="282" class="head">기존 인덱스로 충분한가?</text>
  <text x="650" y="307" class="small">동일·포함·유사 목적 검토</text>

  <rect x="840" y="210" width="200" height="115" class="card discard"/>
  <text x="940" y="250" class="head">추천 폐기</text>
  <text x="940" y="280" class="body">새 인덱스를 만들지 않음</text>
  <text x="940" y="305" class="small">기존 인덱스 삭제가 아님</text>

  <!-- Stage 2 -->
  <rect x="520" y="400" width="260" height="135" class="card review"/>
  <circle cx="548" cy="428" r="15" fill="#2563eb"/>
  <text x="548" y="433" class="step">4</text>
  <text x="650" y="440" class="head">쿼리 패턴 검토</text>
  <text x="650" y="470" class="body">WHERE · JOIN · ORDER BY · LIMIT</text>
  <text x="650" y="496" class="body">빈도 · 선택도 · 쓰기 비용</text>
  <text x="650" y="520" class="small">실제 반복 쿼리를 기준으로 판단</text>

  <rect x="850" y="400" width="240" height="135" class="card verify"/>
  <circle cx="878" cy="428" r="15" fill="#22c55e"/>
  <text x="878" y="433" class="step">5</text>
  <text x="970" y="440" class="head">실행 계획 전후 비교</text>
  <text x="970" y="470" class="code">EXPLAIN (ANALYZE, BUFFERS)</text>
  <text x="970" y="496" class="body">비용 · 스캔 · 실제 행 수 · 시간</text>
  <text x="970" y="520" class="small">동일 조건에서 적용 전후 비교</text>

  <polygon points="1220,390 1330,467.5 1220,545 1110,467.5" class="decision"/>
  <circle cx="1165" cy="418" r="15" fill="#2563eb"/>
  <text x="1165" y="423" class="step">6</text>
  <text x="1220" y="455" class="head">개선 근거가 충분하고</text>
  <text x="1220" y="480" class="head">쓰기 비용을 감당 가능한가?</text>
  <text x="1220" y="505" class="small">성능과 운영 영향 함께 판단</text>

  <rect x="1090" y="215" width="260" height="105" class="card apply"/>
  <text x="1220" y="252" class="head">적용 후보 승인</text>
  <text x="1220" y="280" class="body">운영 반영 전 테스트</text>
  <text x="1220" y="302" class="small">배포·모니터링·롤백 계획 확인</text>

  <rect x="1090" y="590" width="260" height="105" class="card hold"/>
  <text x="1220" y="627" class="head">보류</text>
  <text x="1220" y="655" class="body">개선 근거 또는 비용 판단 부족</text>
  <text x="1220" y="677" class="small">쿼리 패턴과 통계를 다시 확인</text>

  <!-- Orthogonal connectors -->
  <path d="M240 267.5 H300" class="arrow"/>
  <path d="M520 267.5 H530" class="arrow"/>

  <path d="M770 267.5 H840" class="arrow"/>
  <text x="805" y="250" class="yes">예</text>

  <path d="M650 345 V400" class="arrow"/>
  <text x="684" y="376" class="no">아니요</text>

  <path d="M780 467.5 H850" class="arrow"/>
  <path d="M1090 467.5 H1110" class="arrow"/>

  <path d="M1220 390 V320" class="arrow"/>
  <text x="1250" y="354" class="yes">예</text>

  <path d="M1220 545 V590" class="arrow"/>
  <text x="1256" y="572" class="no">아니요</text>

  <!-- Review notes -->
  <rect x="60" y="590" width="870" height="105" class="note"/>
  <text x="495" y="624" class="head">검토 체크포인트</text>
  <text x="495" y="652" class="body">중복 인덱스 방지 · 복합 인덱스 컬럼 순서 · 부분 인덱스 조건 · 읽기 이득과 쓰기 비용</text>
  <text x="495" y="678" class="small">보류한 후보는 쿼리·통계·측정 결과와 결정 근거를 기록한 뒤 필요할 때 다시 검토한다</text>

  <rect x="210" y="725" width="940" height="48" class="note"/>
  <text x="680" y="756" class="small">최종 판단: AI의 설명이 아니라 실제 스키마, 반복 쿼리와 적용 전후 실행 계획을 근거로 승인한다.</text>
</svg>