<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">AI 추천 인덱스 검토 흐름</title>
<desc id="desc">AI 추천은 기존 인덱스와 실행 계획으로 적용 여부를 판단한다</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>
text{font-family:"Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif;fill:#0f172a} .title{font-size:28px;font-weight:700;text-anchor:middle} .sub{font-size:14px;fill:#475569;text-anchor:middle} .box{fill:#ffffff;stroke:#7fb3f5;stroke-width:2;rx:14} .scan{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:14} .idx{fill:#ecfdf5;stroke:#22c55e;stroke-width:2;rx:14} .cand{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:14} .warn{fill:#fdf2f8;stroke:#db2777;stroke-width:2;rx:14} .ai{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2;rx:14} .note{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5;rx:12} .head{font-size:18px;font-weight:700;text-anchor:middle} .body{font-size:13.5px;text-anchor:middle;fill:#334155} .small{font-size:12.5px;text-anchor:middle;fill:#334155} .code{font-family:Consolas, D2Coding, "Courier New", monospace;font-size:13px;font-weight:700;text-anchor:middle;fill:#1d4ed8} .arrow{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)} .dash{stroke:#db2777;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)} .tag{font-size:12px;font-weight:700;fill:#2563eb;text-anchor:middle}
</style></defs>
<rect width="1200" height="620" fill="#ffffff"/>
<text x="600" y="48" class="title">AI 추천 인덱스 검토 흐름</text>
<text x="600" y="76" class="sub">AI 추천은 기존 인덱스와 실행 계획으로 적용 여부를 판단한다</text>
<rect x="60" y="210" width="180" height="120" class="ai"/>
<text x="150.0" y="242" class="head">AI 추천</text>
<text x="150.0" y="268" class="body">인덱스 초안</text>
<rect x="300" y="210" width="190" height="120" class="cand"/>
<text x="395.0" y="242" class="head">기존 인덱스</text>
<text x="395.0" y="268" class="code">PK · UNIQUE</text>
<text x="395.0" y="290" class="body">수동 인덱스</text>
<polygon points="600,205.0 705.0,270 600,335.0 495.0,270" class="cand"/>
<text x="600" y="264" class="head">중복인가?</text>
<rect x="820" y="120" width="160" height="105" class="warn"/>
<text x="900.0" y="152" class="head">예</text>
<text x="900.0" y="178" class="body">제거</text>
<rect x="820" y="315" width="160" height="105" class="idx"/>
<text x="900.0" y="347" class="head">아니요</text>
<text x="900.0" y="373" class="body">계획 비교</text>
<polygon points="1060,310.5 1150.0,368 1060,425.5 970.0,368" class="cand"/>
<text x="1060" y="362" class="head">근거 충분?</text>
<path d="M240 270 L300 270" class="arrow"/>
<path d="M490 270 L495 270" class="arrow"/>
<path d="M705 270 L820 172" class="arrow"/>
<text x="760" y="190" class="tag">예</text>
<path d="M705 270 L820 365" class="arrow"/>
<text x="760" y="345" class="tag">아니요</text>
<path d="M980 365 L970 365" class="arrow"/>
<rect x="995" y="80" width="150" height="90" class="idx"/>
<text x="1070.0" y="112" class="head">적용</text>
<text x="1070.0" y="138" class="body">근거 있음</text>
<rect x="995" y="475" width="150" height="90" class="box"/>
<text x="1070.0" y="507" class="head">보류</text>
<text x="1070.0" y="533" class="body">근거 부족</text>
<path d="M1060 310 L1065 170" class="arrow"/>
<path d="M1060 425 L1065 475" class="arrow"/>
<path d="M995 520 L390 330" class="dash"/>
<text x="680" y="515" class="tag">보류 시 쿼리 패턴 재확인</text>
</svg>
