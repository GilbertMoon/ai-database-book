<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1460" viewBox="0 0 1200 1460" role="img" aria-labelledby="title desc">
  <title id="title">온라인 강의 수강신청 ERD</title>
  <desc id="desc">students, instructors, courses, enrollments 네 테이블의 전체 컬럼과 데이터형, 기본키, 외래키, 고유값, 필수값, 체크 제약조건, 관계 선택성, 다대다 관계 해소, 생성과 삭제 순서 및 SQL 검증 기준을 설명하는 온라인 강의 수강신청 데이터베이스 ERD</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <style>
      text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}
      .t{font-size:28px;font-weight:700;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}
      .panel{stroke-width:1.5;rx:15}.erd{fill:#f8fafc;stroke:#a8b3c4}.trace{fill:#fff8e8;stroke:#d69e2e}.verify{fill:#f2fbf5;stroke:#8bc9a0}
      .pt{font-size:19px;font-weight:700}.table{fill:#fff;stroke:#64748b;stroke-width:1.5;rx:10}.headB{fill:#dcecff}.headO{fill:#fff1cf}.headP{fill:#ede9fe}.headG{fill:#dcfce7}
      .th{font-size:17px;font-weight:700;text-anchor:middle}.sub{font-size:11px;text-anchor:middle;fill:#475569}.line{stroke:#d7dee8;stroke-width:1}
      .cell{font-size:10.8px;fill:#334155}.type{font-size:10px;fill:#64748b}.pk{font-size:10.5px;font-weight:700;fill:#1d4ed8}.fk{font-size:10.5px;font-weight:700;fill:#92400e}.uk{font-size:10.5px;font-weight:700;fill:#6d28d9}.nn{font-size:9.8px;font-weight:700;fill:#166534}.null{font-size:9.8px;font-weight:700;fill:#b45309}.ck{font-size:9.8px;font-weight:700;fill:#b91c1c}
      .rel{stroke:#475569;stroke-width:2.4;fill:none}.card{font-size:12px;font-weight:700;text-anchor:middle}.label{font-size:10.8px;text-anchor:middle;fill:#475569}
      .box{fill:#fff;stroke-width:1.4;rx:10}.blue{stroke:#3b82c4}.orange{stroke:#d69e2e}.green{stroke:#3c9a5f}.purple{stroke:#7c5cc4}.red{stroke:#d9534f}.gray{stroke:#64748b}
      .h{font-size:13.5px;font-weight:700;text-anchor:middle}.m{font-size:10.9px;text-anchor:middle;fill:#475569}.code{font-family:Consolas,D2Coding,monospace;font-size:11.4px;font-weight:700;text-anchor:middle;fill:#334155}
      .arr{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.back{stroke:#d9534f;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#a)}
      .decision{fill:#fff8e8;stroke:#b7791f;stroke-width:1.8}.dt{font-size:13.6px;font-weight:700;text-anchor:middle}
      .note{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.3;rx:9}.nt{font-size:11.1px;font-weight:700;text-anchor:middle;fill:#92400e}.core{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.5;rx:10}.cv{font-size:13.8px;font-weight:700;text-anchor:middle;fill:#166534}
    </style>
  </defs>
  <rect width="1200" height="1460" fill="#fff"/>
  <text x="600" y="40" class="t">온라인 강의 수강신청 ERD</text>
  <text x="600" y="68" class="s">ERD는 테이블 목록이 아니라 한 행의 의미, 키·제약조건, 관계 수와 선택성을 함께 읽는 설계 문서다</text>

  <rect x="35" y="100" width="1130" height="895" class="panel erd"/>
  <text x="60" y="132" class="pt">1. 네 테이블의 전체 구조와 관계</text>

  <rect x="55" y="170" width="320" height="300" class="table"/>
  <rect x="55" y="170" width="320" height="55" class="headB" rx="10"/>
  <text x="215" y="193" class="th">instructors</text><text x="215" y="214" class="sub">강사 한 명당 한 행</text>
  <line x1="55" y1="225" x2="375" y2="225" class="line"/>
  <line x1="55" y1="285" x2="375" y2="285" class="line"/><line x1="55" y1="345" x2="375" y2="345" class="line"/><line x1="55" y1="405" x2="375" y2="405" class="line"/>
  <text x="72" y="251" class="pk">PK</text><text x="106" y="251" class="cell">id</text><text x="220" y="251" class="type">SERIAL</text><text x="333" y="251" class="nn">필수</text>
  <text x="72" y="311" class="cell">name</text><text x="220" y="311" class="type">VARCHAR(50)</text><text x="333" y="311" class="nn">필수</text>
  <text x="72" y="371" class="uk">UK</text><text x="106" y="371" class="cell">email</text><text x="220" y="371" class="type">VARCHAR(100)</text><text x="333" y="371" class="nn">필수</text>
  <text x="72" y="431" class="cell">specialty</text><text x="220" y="431" class="type">VARCHAR(100)</text><text x="333" y="431" class="nn">필수</text>

  <rect x="430" y="145" width="340" height="380" class="table"/>
  <rect x="430" y="145" width="340" height="55" class="headO" rx="10"/>
  <text x="600" y="168" class="th">courses</text><text x="600" y="189" class="sub">강의 하나당 한 행</text>
  <line x1="430" y1="200" x2="770" y2="200" class="line"/>
  <line x1="430" y1="245" x2="770" y2="245" class="line"/><line x1="430" y1="290" x2="770" y2="290" class="line"/><line x1="430" y1="335" x2="770" y2="335" class="line"/><line x1="430" y1="380" x2="770" y2="380" class="line"/><line x1="430" y1="425" x2="770" y2="425" class="line"/><line x1="430" y1="470" x2="770" y2="470" class="line"/>
  <text x="447" y="228" class="pk">PK</text><text x="482" y="228" class="cell">id</text><text x="620" y="228" class="type">SERIAL</text><text x="730" y="228" class="nn">필수</text>
  <text x="447" y="273" class="fk">FK</text><text x="482" y="273" class="cell">instructor_id</text><text x="620" y="273" class="type">INT</text><text x="730" y="273" class="nn">필수</text>
  <text x="447" y="318" class="cell">title</text><text x="620" y="318" class="type">VARCHAR(200)</text><text x="730" y="318" class="nn">필수</text>
  <text x="447" y="363" class="cell">description</text><text x="620" y="363" class="type">TEXT</text><text x="730" y="363" class="null">NULL 가능</text>
  <text x="447" y="408" class="cell">level</text><text x="620" y="408" class="type">VARCHAR(20)</text><text x="730" y="408" class="nn">필수</text>
  <text x="447" y="453" class="cell">price</text><text x="620" y="453" class="type">INT</text><text x="730" y="453" class="ck">CHECK ≥ 0</text>
  <text x="447" y="498" class="cell">opened_at</text><text x="620" y="498" class="type">DATE</text><text x="730" y="498" class="nn">필수</text>

  <rect x="55" y="590" width="320" height="300" class="table"/>
  <rect x="55" y="590" width="320" height="55" class="headP" rx="10"/>
  <text x="215" y="613" class="th">students</text><text x="215" y="634" class="sub">학생 한 명당 한 행</text>
  <line x1="55" y1="645" x2="375" y2="645" class="line"/>
  <line x1="55" y1="705" x2="375" y2="705" class="line"/><line x1="55" y1="765" x2="375" y2="765" class="line"/><line x1="55" y1="825" x2="375" y2="825" class="line"/>
  <text x="72" y="671" class="pk">PK</text><text x="106" y="671" class="cell">id</text><text x="220" y="671" class="type">SERIAL</text><text x="333" y="671" class="nn">필수</text>
  <text x="72" y="731" class="cell">name</text><text x="220" y="731" class="type">VARCHAR(50)</text><text x="333" y="731" class="nn">필수</text>
  <text x="72" y="791" class="uk">UK</text><text x="106" y="791" class="cell">email</text><text x="220" y="791" class="type">VARCHAR(100)</text><text x="333" y="791" class="nn">필수</text>
  <text x="72" y="851" class="cell">joined_at</text><text x="220" y="851" class="type">DATE</text><text x="333" y="851" class="nn">필수</text>

  <rect x="430" y="565" width="340" height="410" class="table"/>
  <rect x="430" y="565" width="340" height="55" class="headG" rx="10"/>
  <text x="600" y="588" class="th">enrollments</text><text x="600" y="609" class="sub">수강신청 한 건당 한 행</text>
  <line x1="430" y1="620" x2="770" y2="620" class="line"/>
  <line x1="430" y1="675" x2="770" y2="675" class="line"/><line x1="430" y1="730" x2="770" y2="730" class="line"/><line x1="430" y1="785" x2="770" y2="785" class="line"/><line x1="430" y1="840" x2="770" y2="840" class="line"/><line x1="430" y1="895" x2="770" y2="895" class="line"/>
  <text x="447" y="650" class="pk">PK</text><text x="482" y="650" class="cell">id</text><text x="620" y="650" class="type">SERIAL</text><text x="730" y="650" class="nn">필수</text>
  <text x="447" y="705" class="fk">FK</text><text x="482" y="705" class="cell">student_id</text><text x="620" y="705" class="type">INT</text><text x="730" y="705" class="nn">필수</text>
  <text x="447" y="760" class="fk">FK</text><text x="482" y="760" class="cell">course_id</text><text x="620" y="760" class="type">INT</text><text x="730" y="760" class="nn">필수</text>
  <text x="447" y="815" class="cell">enrolled_at</text><text x="620" y="815" class="type">DATE</text><text x="730" y="815" class="nn">필수</text>
  <text x="447" y="870" class="cell">status</text><text x="620" y="870" class="type">VARCHAR(20)</text><text x="730" y="870" class="ck">CHECK 상태값</text>
  <text x="447" y="925" class="cell">paid_amount</text><text x="620" y="925" class="type">INT</text><text x="730" y="925" class="ck">CHECK ≥ 0</text>
  <text x="600" y="956" class="m">상태: 신청 · 수강중 · 완료 · 취소</text>

  <path d="M375 273H430" class="rel"/><text x="392" y="258" class="card" fill="#1d4ed8">1</text><text x="416" y="258" class="card" fill="#92400e">0..N</text>
  <path d="M375 705H430" class="rel"/><text x="392" y="690" class="card" fill="#1d4ed8">1</text><text x="416" y="690" class="card" fill="#92400e">0..N</text>
  <path d="M600 525V565" class="rel"/><text x="580" y="548" class="card" fill="#1d4ed8">1</text><text x="628" y="548" class="card" fill="#92400e">0..N</text>

  <rect x="815" y="165" width="325" height="110" class="box blue"/><text x="977" y="191" class="h">instructors 1 : 0..N courses</text><text x="977" y="218" class="m">강사는 강의가 없어도 되고 여러 강의를 담당 가능</text><text x="977" y="244" class="m">각 강의는 instructor_id NOT NULL로 강사 1명 필수</text>
  <rect x="815" y="305" width="325" height="110" class="box purple"/><text x="977" y="331" class="h">students 1 : 0..N enrollments</text><text x="977" y="358" class="m">학생은 신청이 없어도 되고 여러 신청을 가질 수 있음</text><text x="977" y="384" class="m">각 신청은 student_id NOT NULL로 학생 1명 필수</text>
  <rect x="815" y="445" width="325" height="110" class="box orange"/><text x="977" y="471" class="h">courses 1 : 0..N enrollments</text><text x="977" y="498" class="m">강의는 등록 학생이 없어도 되고 여러 신청을 가짐</text><text x="977" y="524" class="m">각 신청은 course_id NOT NULL로 강의 1개 필수</text>
  <rect x="815" y="585" width="325" height="125" class="box green"/><text x="977" y="611" class="h">학생–강의 N:M 해소</text><text x="977" y="638" class="code">students 1:N enrollments N:1 courses</text><text x="977" y="664" class="m">enrollments는 연결선이 아니라 신청일·상태·결제액을</text><text x="977" y="686" class="m">보존하는 관계 엔터티</text>
  <rect x="815" y="740" width="325" height="190" class="box gray"/><text x="977" y="767" class="h">키와 제약조건 읽기</text><text x="850" y="802" class="pk">PK</text><text x="890" y="802" class="m" text-anchor="start">행의 안정적 식별</text><text x="850" y="832" class="fk">FK</text><text x="890" y="832" class="m" text-anchor="start">부모 테이블과 관계 연결</text><text x="850" y="862" class="uk">UK</text><text x="890" y="862" class="m" text-anchor="start">업무상 중복 금지</text><text x="850" y="892" class="nn">NOT NULL</text><text x="935" y="892" class="m" text-anchor="start">필수값</text><text x="850" y="918" class="ck">CHECK</text><text x="910" y="918" class="m" text-anchor="start">허용 범위와 상태 검증</text>

  <rect x="35" y="1025" width="1130" height="210" class="panel trace"/>
  <text x="60" y="1057" class="pt">2. 요구사항이 ERD와 DDL에 반영되었는지 추적</text>
  <rect x="55" y="1090" width="250" height="70" class="box purple"/><text x="180" y="1115" class="h">이메일 중복 금지</text><text x="180" y="1142" class="code">students.email · instructors.email</text><text x="180" y="1158" class="m">UNIQUE NOT NULL</text>
  <rect x="330" y="1090" width="250" height="70" class="box orange"/><text x="455" y="1115" class="h">상태값 제한</text><text x="455" y="1142" class="code">enrollments.status</text><text x="455" y="1158" class="m">CHECK 신청·수강중·완료·취소</text>
  <rect x="605" y="1090" width="250" height="70" class="box green"/><text x="730" y="1115" class="h">음수 금액 금지</text><text x="730" y="1142" class="code">courses.price · paid_amount</text><text x="730" y="1158" class="m">CHECK 0 이상</text>
  <rect x="880" y="1090" width="250" height="70" class="box blue"/><text x="1005" y="1115" class="h">선택 입력</text><text x="1005" y="1142" class="code">courses.description</text><text x="1005" y="1158" class="m">NULL 허용</text>
  <rect x="150" y="1180" width="900" height="32" class="box red"/><text x="600" y="1201" class="m">문서에만 적힌 규칙이 아니라 데이터베이스가 직접 차단해야 하는 규칙은 UNIQUE·FK·CHECK·NOT NULL로 구현한다</text>

  <rect x="35" y="1265" width="1130" height="120" class="panel verify"/>
  <text x="60" y="1297" class="pt">3. 구현 순서와 실행 검증</text>
  <rect x="55" y="1315" width="250" height="45" class="box blue"/><text x="180" y="1334" class="h">CREATE 순서</text><text x="180" y="1352" class="m">students·instructors → courses → enrollments</text>
  <rect x="330" y="1315" width="250" height="45" class="box red"/><text x="455" y="1334" class="h">DROP 순서</text><text x="455" y="1352" class="m">enrollments → courses → 부모 테이블</text>
  <rect x="605" y="1315" width="250" height="45" class="box green"/><text x="730" y="1334" class="h">오류 데이터</text><text x="730" y="1352" class="m">중복 email·없는 FK·음수·잘못된 상태 차단</text>
  <rect x="880" y="1315" width="250" height="45" class="box purple"/><text x="1005" y="1334" class="h">JOIN 결과</text><text x="1005" y="1352" class="m">학생명·강의명·강사명·상태·결제액 복원</text>

  <rect x="55" y="1405" width="350" height="30" class="note"/><text x="230" y="1425" class="nt">관계선은 FK 컬럼과 참조 대상 PK를 연결</text>
  <rect x="425" y="1405" width="350" height="30" class="note"/><text x="600" y="1425" class="nt">1·0..N과 NOT NULL을 함께 읽어 선택성 판단</text>
  <rect x="795" y="1405" width="350" height="30" class="core"/><text x="970" y="1425" class="cv">ERD·DDL·샘플·JOIN 결과를 같은 버전으로 관리</text>
</svg>