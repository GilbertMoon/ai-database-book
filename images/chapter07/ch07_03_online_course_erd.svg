<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">온라인 강의 수강신청 핵심 ERD</title>
<desc id="desc">네 테이블의 PK, FK, 1:N 관계와 N:M 해소 구조를 확인한다</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>
text{font-family:"Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif;fill:#0f172a} .title{font-size:28px;font-weight:700;text-anchor:middle} .sub{font-size:14px;fill:#475569;text-anchor:middle} .box{fill:#fff;stroke:#8bbcf6;stroke-width:2;rx:14} .green{stroke:#22a06b;fill:#f2fff8} .orange{stroke:#f59e0b;fill:#fff8eb} .purple{stroke:#8b5cf6;fill:#f7f3ff} .head{font-size:18px;font-weight:700;text-anchor:middle} .body{font-size:13.5px;text-anchor:middle;fill:#334155} .code{font-family:Consolas, D2Coding, "Courier New", monospace;font-size:13px;font-weight:700;text-anchor:middle;fill:#1d4ed8} .arrow{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)} .dash{stroke:#ef4444;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)} .tag{font-size:12px;font-weight:700;fill:#2563eb;text-anchor:middle} .pk{fill:#dbeafe;stroke:#2563eb;stroke-width:1.4} .fk{fill:#ffedd5;stroke:#f97316;stroke-width:1.4} .note{fill:#eefdf4;stroke:#22c55e;stroke-width:1.5;rx:12} .small{font-size:12.5px;text-anchor:middle;fill:#334155}
</style></defs>
<rect width="1200" height="680" fill="#ffffff"/>
<text x="600" y="48" class="title">온라인 강의 수강신청 핵심 ERD</text>
<text x="600" y="76" class="sub">네 테이블의 PK, FK, 1:N 관계와 N:M 해소 구조를 확인한다</text>
<rect x="90" y="130" width="235" height="190" class="box"/>
<text x="207.5" y="160" class="head">students</text>
<rect x="108" y="173" width="34" height="20" class="pk" rx="8"/><text x="125" y="188" class="small">PK</text>
<text x="160" y="188" class="body" text-anchor="start">id</text>
<text x="130" y="216" class="body" text-anchor="start">email UNIQUE</text>
<text x="130" y="244" class="body" text-anchor="start">joined_at</text>
<rect x="90" y="365" width="235" height="190" class="box"/>
<text x="207.5" y="395" class="head">instructors</text>
<rect x="108" y="408" width="34" height="20" class="pk" rx="8"/><text x="125" y="423" class="small">PK</text>
<text x="160" y="423" class="body" text-anchor="start">id</text>
<text x="130" y="451" class="body" text-anchor="start">email UNIQUE</text>
<text x="130" y="479" class="body" text-anchor="start">specialty</text>
<rect x="490" y="365" width="235" height="190" class="orange"/>
<text x="607.5" y="395" class="head">courses</text>
<rect x="508" y="408" width="34" height="20" class="pk" rx="8"/><text x="525" y="423" class="small">PK</text>
<text x="560" y="423" class="body" text-anchor="start">id</text>
<rect x="508" y="436" width="34" height="20" class="fk" rx="8"/><text x="525" y="451" class="small">FK</text>
<text x="560" y="451" class="body" text-anchor="start">instructor_id</text>
<text x="530" y="479" class="body" text-anchor="start">title</text>
<text x="530" y="507" class="body" text-anchor="start">price</text>
<rect x="870" y="130" width="235" height="190" class="green"/>
<text x="987.5" y="160" class="head">enrollments</text>
<rect x="888" y="173" width="34" height="20" class="pk" rx="8"/><text x="905" y="188" class="small">PK</text>
<text x="940" y="188" class="body" text-anchor="start">id</text>
<rect x="888" y="201" width="34" height="20" class="fk" rx="8"/><text x="905" y="216" class="small">FK</text>
<text x="940" y="216" class="body" text-anchor="start">student_id</text>
<rect x="888" y="229" width="34" height="20" class="fk" rx="8"/><text x="905" y="244" class="small">FK</text>
<text x="940" y="244" class="body" text-anchor="start">course_id</text>
<text x="910" y="272" class="body" text-anchor="start">status</text>
<text x="910" y="300" class="body" text-anchor="start">paid_amount</text>
<path d="M325 222 L870 222" class="arrow"/>
<text x="600" y="205" class="tag">1:N</text>
<path d="M725 455 L870 250" class="arrow"/>
<text x="795" y="340" class="tag">1:N</text>
<path d="M325 455 L490 455" class="arrow"/>
<text x="408" y="438" class="tag">1:N</text>
<text x="600" y="625" class="head">courses.price는 현재 기본 수강료, enrollments.paid_amount는 신청 시점 결제 금액</text>
</svg>
