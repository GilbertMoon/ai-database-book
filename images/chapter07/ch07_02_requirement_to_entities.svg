<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1320" viewBox="0 0 1200 1320" role="img" aria-labelledby="title desc">
  <title id="title">요구사항에서 엔터티 도출</title>
  <desc id="desc">온라인 강의 서비스 요구사항에서 명사, 동사와 업무 규칙을 구분하고 독립 대상은 엔터티, 대상을 설명하는 값은 속성, 자체 속성을 가진 연결은 관계 엔터티로 분류하여 students, instructors, courses, enrollments와 관계 및 제약조건 후보를 도출하는 과정</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <style>
      text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}
      .t{font-size:28px;font-weight:700;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}
      .panel{stroke-width:1.5;rx:15}.req{fill:#eef5ff;stroke:#6fa2e8}.classify{fill:#fff8e8;stroke:#d69e2e}.result{fill:#f8fafc;stroke:#a8b3c4}.verify{fill:#f2fbf5;stroke:#8bc9a0}
      .pt{font-size:19px;font-weight:700}.box{fill:#fff;stroke-width:1.4;rx:10}.blue{stroke:#3b82c4}.orange{stroke:#d69e2e}.green{stroke:#3c9a5f}.red{stroke:#d9534f}.purple{stroke:#7c5cc4}.gray{stroke:#64748b}
      .h{font-size:14px;font-weight:700;text-anchor:middle}.m{font-size:11.2px;text-anchor:middle;fill:#475569}.code{font-family:Consolas,D2Coding,monospace;font-size:11.8px;font-weight:700;text-anchor:middle;fill:#334155}
      .arr{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.relB{stroke:#3b82c4;stroke-width:2.2;fill:none;marker-end:url(#a)}.relO{stroke:#d69e2e;stroke-width:2.2;fill:none;marker-end:url(#a)}
      .tagB{fill:#dcecff}.tagO{fill:#fff1cf}.tagG{fill:#dcfce7}.tagP{fill:#ede9fe}.tagR{fill:#fee2e2}
      .decision{fill:#fff8e8;stroke:#b7791f;stroke-width:1.8}.dt{font-size:14px;font-weight:700;text-anchor:middle}
      .note{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.3;rx:9}.nt{font-size:11.2px;font-weight:700;text-anchor:middle;fill:#92400e}.core{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.5;rx:10}.cv{font-size:14px;font-weight:700;text-anchor:middle;fill:#166534}
    </style>
  </defs>
  <rect width="1200" height="1320" fill="#fff"/>
  <text x="600" y="40" class="t">요구사항에서 엔터티 도출</text>
  <text x="600" y="68" class="s">명사는 데이터 후보를 주고, 동사와 수량 표현은 관계를, 금지·허용 표현은 제약조건을 알려 준다</text>

  <rect x="35" y="100" width="1130" height="260" class="panel req"/>
  <text x="60" y="132" class="pt">1. 요구사항 문장을 데이터·관계·규칙의 증거로 읽기</text>
  <rect x="55" y="165" width="330" height="82" class="box blue"/>
  <text x="220" y="190" class="h">학생과 강사의 정보</text>
  <text x="220" y="216" class="m">학생은 이름·이메일·가입일을 가진다</text>
  <text x="220" y="238" class="m">강사는 이름·이메일·전문 분야를 가진다</text>
  <rect x="435" y="165" width="330" height="82" class="box orange"/>
  <text x="600" y="190" class="h">관계와 수량</text>
  <text x="600" y="216" class="m">강사는 여러 강의를 개설한다</text>
  <text x="600" y="238" class="m">학생은 여러 강의를 신청한다</text>
  <rect x="815" y="165" width="330" height="82" class="box green"/>
  <text x="980" y="190" class="h">업무 규칙</text>
  <text x="980" y="216" class="m">상태는 신청·수강중·완료·취소 중 하나</text>
  <text x="980" y="238" class="m">학생·강사 이메일은 각각 중복 금지</text>

  <rect x="55" y="275" width="330" height="55" class="box blue"/>
  <text x="220" y="297" class="h">명사 후보</text><text x="220" y="319" class="m">학생 · 강사 · 강의 · 수강신청 · 이름 · 상태 · 금액</text>
  <rect x="435" y="275" width="330" height="55" class="box orange"/>
  <text x="600" y="297" class="h">동사·수량 후보</text><text x="600" y="319" class="m">가진다 · 담당한다 · 개설한다 · 신청한다 · 한 명 · 여러 개</text>
  <rect x="815" y="275" width="330" height="55" class="box green"/>
  <text x="980" y="297" class="h">제약 표현 후보</text><text x="980" y="319" class="m">중복될 수 없다 · 정해진 값 · 0 이상</text>

  <rect x="35" y="390" width="1130" height="265" class="panel classify"/>
  <text x="60" y="422" class="pt">2. 모든 명사를 테이블로 만들지 말고 역할을 분류</text>
  <rect x="55" y="460" width="245" height="150" class="box blue"/>
  <rect x="55" y="460" width="245" height="34" class="tagB" rx="10"/>
  <text x="177" y="483" class="h">독립 엔터티인가?</text>
  <text x="177" y="521" class="m">여러 개를 개별 식별하고</text><text x="177" y="543" class="m">독립적으로 등록·수정·삭제하는가?</text>
  <text x="177" y="578" class="code">학생 · 강사 · 강의</text>

  <rect x="335" y="460" width="245" height="150" class="box orange"/>
  <rect x="335" y="460" width="245" height="34" class="tagO" rx="10"/>
  <text x="457" y="483" class="h">속성인가?</text>
  <text x="457" y="521" class="m">한 대상을 설명하며</text><text x="457" y="543" class="m">그 대상이 없으면 의미가 약한가?</text>
  <text x="457" y="578" class="code">이름 · 이메일 · 난이도</text>

  <rect x="615" y="460" width="245" height="150" class="box purple"/>
  <rect x="615" y="460" width="245" height="34" class="tagP" rx="10"/>
  <text x="737" y="483" class="h">관계 엔터티인가?</text>
  <text x="737" y="521" class="m">두 대상의 연결 자체에</text><text x="737" y="543" class="m">날짜·상태·금액이 존재하는가?</text>
  <text x="737" y="578" class="code">수강신청 → enrollments</text>

  <rect x="895" y="460" width="245" height="150" class="box gray"/>
  <rect x="895" y="460" width="245" height="34" class="tagR" rx="10"/>
  <text x="1017" y="483" class="h">저장 대상이 아닌가?</text>
  <text x="1017" y="521" class="m">화면명·버튼명·동작 설명처럼</text><text x="1017" y="543" class="m">데이터로 보존할 필요가 없는가?</text>
  <text x="1017" y="578" class="code">후보 목록에서 제외</text>
  <rect x="180" y="620" width="840" height="23" class="box red"/>
  <text x="600" y="637" class="m">판단 기준은 단어의 품사가 아니라 독립 식별 여부, 변경 이유, 수명과 관계 자체의 정보 유무다</text>

  <rect x="35" y="685" width="1130" height="330" class="panel result"/>
  <text x="60" y="717" class="pt">3. 엔터티·속성·관계 후보를 테이블 구조로 정리</text>
  <rect x="55" y="755" width="250" height="190" class="box blue"/>
  <rect x="55" y="755" width="250" height="38" class="tagB" rx="10"/>
  <text x="180" y="780" class="h">students</text>
  <text x="180" y="819" class="h">학생 한 명당 한 행</text>
  <text x="180" y="848" class="code">id PK</text><text x="180" y="872" class="code">name · email UK</text><text x="180" y="896" class="code">joined_at</text>
  <text x="180" y="927" class="m">학생이 없어도 이메일만 독립 관리하지 않음</text>

  <rect x="335" y="735" width="250" height="230" class="box orange"/>
  <rect x="335" y="735" width="250" height="38" class="tagO" rx="10"/>
  <text x="460" y="760" class="h">enrollments</text>
  <text x="460" y="799" class="h">수강신청 한 건당 한 행</text>
  <text x="460" y="828" class="code">id PK</text><text x="460" y="852" class="code">student_id FK · course_id FK</text><text x="460" y="876" class="code">enrolled_at · status</text><text x="460" y="900" class="code">paid_amount</text>
  <text x="460" y="934" class="m">연결 자체의 날짜·상태·금액 보존</text>

  <rect x="615" y="755" width="250" height="190" class="box purple"/>
  <rect x="615" y="755" width="250" height="38" class="tagP" rx="10"/>
  <text x="740" y="780" class="h">courses</text>
  <text x="740" y="819" class="h">강의 하나당 한 행</text>
  <text x="740" y="848" class="code">id PK · instructor_id FK</text><text x="740" y="872" class="code">title · description · level</text><text x="740" y="896" class="code">price · opened_at</text>
  <text x="740" y="927" class="m">기본 가격은 강의, 실제 결제액은 신청에 저장</text>

  <rect x="895" y="755" width="250" height="190" class="box green"/>
  <rect x="895" y="755" width="250" height="38" class="tagG" rx="10"/>
  <text x="1020" y="780" class="h">instructors</text>
  <text x="1020" y="819" class="h">강사 한 명당 한 행</text>
  <text x="1020" y="848" class="code">id PK</text><text x="1020" y="872" class="code">name · email UK</text><text x="1020" y="896" class="code">specialty</text>
  <text x="1020" y="927" class="m">강사 설명값을 courses마다 반복하지 않음</text>

  <path d="M305 850H335" class="relB"/><text x="320" y="835" class="m">1:N</text>
  <path d="M615 875H585" class="relO"/><text x="600" y="860" class="m">N:1</text>
  <path d="M895 830H865" class="relB"/><text x="880" y="815" class="m">1:N</text>
  <rect x="150" y="975" width="900" height="25" class="box green"/>
  <text x="600" y="993" class="code">students 1:N enrollments N:1 courses · instructors 1:N courses</text>

  <rect x="35" y="1045" width="1130" height="220" class="panel verify"/>
  <text x="60" y="1077" class="pt">4. 업무 규칙과 요구사항 추적 검증</text>
  <rect x="55" y="1110" width="250" height="62" class="box purple"/>
  <text x="180" y="1134" class="h">이메일 중복 금지</text><text x="180" y="1158" class="m">학생·강사 email → UNIQUE NOT NULL</text>
  <rect x="330" y="1110" width="250" height="62" class="box orange"/>
  <text x="455" y="1134" class="h">상태값 제한</text><text x="455" y="1158" class="m">status → CHECK 신청·수강중·완료·취소</text>
  <rect x="605" y="1110" width="250" height="62" class="box green"/>
  <text x="730" y="1134" class="h">금액 범위</text><text x="730" y="1158" class="m">price·paid_amount → CHECK 0 이상</text>
  <rect x="880" y="1110" width="250" height="62" class="box blue"/>
  <text x="1005" y="1134" class="h">관계 검증</text><text x="1005" y="1158" class="m">FK와 샘플 데이터로 1:N·N:M 재현</text>

  <polygon points="600,1188 735,1220 600,1252 465,1220" class="decision"/>
  <text x="600" y="1215" class="dt">모든 요구사항이 구조와 테스트에 대응하는가?</text>
  <text x="600" y="1237" class="m">누락되면 후보 분류·속성 소유자·관계 방향·제약조건을 다시 확인</text>

  <rect x="55" y="1275" width="350" height="28" class="note"/><text x="230" y="1294" class="nt">모든 명사를 테이블로 만들지 않는다</text>
  <rect x="425" y="1275" width="350" height="28" class="note"/><text x="600" y="1294" class="nt">수강신청은 속성을 가진 관계 엔터티</text>
  <rect x="795" y="1275" width="350" height="28" class="core"/><text x="970" y="1294" class="cv">다음 단계 · PK·FK와 ERD로 구체화</text>
</svg>