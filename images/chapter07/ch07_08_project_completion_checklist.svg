<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1480" viewBox="0 0 1200 1480" role="img" aria-labelledby="title desc">
  <title id="title">온라인 강의 데이터베이스 프로젝트 완성도 점검</title>
  <desc id="desc">온라인 강의 데이터베이스 프로젝트의 요구사항과 범위, ERD와 DDL, 정상·경계·오류 데이터, JOIN과 CRUD 실행 결과, 정규화, AI 검토 기록과 재현성을 증거 기반으로 확인하고 미완료 항목은 해당 원본으로 되돌아가 수정하는 최종 점검표</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <style>
      text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}
      .t{font-size:28px;font-weight:700;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}
      .panel{stroke-width:1.5;rx:15}.outputs{fill:#eef5ff;stroke:#6fa2e8}.gates{fill:#f8fafc;stroke:#a8b3c4}.decisionPanel{fill:#fff8e8;stroke:#d69e2e}.done{fill:#f2fbf5;stroke:#8bc9a0}
      .pt{font-size:19px;font-weight:700}.box{fill:#fff;stroke-width:1.4;rx:10}.blue{stroke:#3b82c4}.orange{stroke:#d69e2e}.green{stroke:#3c9a5f}.purple{stroke:#7c5cc4}.red{stroke:#d9534f}.gray{stroke:#64748b}
      .h{font-size:13.5px;font-weight:700;text-anchor:middle}.m{font-size:10.8px;text-anchor:middle;fill:#475569}.code{font-family:Consolas,D2Coding,monospace;font-size:11.2px;font-weight:700;text-anchor:middle;fill:#334155}
      .arr{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.back{stroke:#d9534f;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#a)}
      .tagB{fill:#dcecff}.tagO{fill:#fff1cf}.tagG{fill:#dcfce7}.tagP{fill:#ede9fe}.tagR{fill:#fee2e2}.tagX{fill:#e2e8f0}
      .check{font-size:10.6px;fill:#334155}.num{font-size:12px;font-weight:700;text-anchor:middle;fill:#fff}.nB{fill:#3b82c4}.nO{fill:#d69e2e}.nG{fill:#3c9a5f}.nP{fill:#7c5cc4}
      .decision{fill:#fff;stroke:#b7791f;stroke-width:1.8}.dt{font-size:13.5px;font-weight:700;text-anchor:middle}
      .note{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.3;rx:9}.nt{font-size:10.8px;font-weight:700;text-anchor:middle;fill:#92400e}.core{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.5;rx:10}.cv{font-size:13.5px;font-weight:700;text-anchor:middle;fill:#166534}
    </style>
  </defs>

  <rect width="1200" height="1480" fill="#fff"/>
  <text x="600" y="40" class="t">온라인 강의 DB 프로젝트 완성도 점검</text>
  <text x="600" y="68" class="s">파일이 있다는 사실보다 요구사항·설계·SQL·실행 결과와 수정 근거가 서로 연결되는지를 확인한다</text>

  <rect x="35" y="100" width="1130" height="225" class="panel outputs"/>
  <text x="60" y="132" class="pt">0. 점검 전에 최종 산출물을 한곳에 모으기</text>

  <rect x="55" y="165" width="200" height="125" class="box blue"/>
  <rect x="55" y="165" width="200" height="32" class="tagB" rx="10"/>
  <text x="155" y="187" class="h">요구사항·범위</text>
  <text x="155" y="222" class="m">포함·제외 기능과 미정 규칙</text><text x="155" y="245" class="m">요구사항 추적표·결정 기록</text><text x="155" y="270" class="code">requirements · decisions</text>

  <rect x="275" y="165" width="200" height="125" class="box purple"/>
  <rect x="275" y="165" width="200" height="32" class="tagP" rx="10"/>
  <text x="375" y="187" class="h">ERD·데이터 사전</text>
  <text x="375" y="222" class="m">한 행 의미·PK·FK</text><text x="375" y="245" class="m">카디널리티·선택성·값의 주인</text><text x="375" y="270" class="code">erd · dictionary</text>

  <rect x="495" y="165" width="200" height="125" class="box orange"/>
  <rect x="495" y="165" width="200" height="32" class="tagO" rx="10"/>
  <text x="595" y="187" class="h">구조 SQL</text>
  <text x="595" y="222" class="m">DROP·CREATE·자료형</text><text x="595" y="245" class="m">PK·FK·UNIQUE·CHECK</text><text x="595" y="270" class="code">schema.sql</text>

  <rect x="715" y="165" width="200" height="125" class="box green"/>
  <rect x="715" y="165" width="200" height="32" class="tagG" rx="10"/>
  <text x="815" y="187" class="h">데이터·검증 SQL</text>
  <text x="815" y="222" class="m">정상·경계·오류 데이터</text><text x="815" y="245" class="m">JOIN·CRUD·예상 결과</text><text x="815" y="270" class="code">seed · validation</text>

  <rect x="935" y="165" width="200" height="125" class="box gray"/>
  <rect x="935" y="165" width="200" height="32" class="tagX" rx="10"/>
  <text x="1035" y="187" class="h">실행·검토 기록</text>
  <text x="1035" y="222" class="m">실행 순서·환경·예상 결과</text><text x="1035" y="245" class="m">AI 초안·수정 이유·최종안</text><text x="1035" y="270" class="code">README · review log</text>

  <rect x="35" y="355" width="1130" height="650" class="panel gates"/>
  <text x="60" y="387" class="pt">1. 네 개의 완료 게이트를 증거와 함께 통과</text>

  <rect x="55" y="425" width="525" height="255" class="box blue"/>
  <rect x="55" y="425" width="525" height="38" class="tagB" rx="10"/>
  <circle cx="82" cy="444" r="14" class="nB"/><text x="82" y="449" class="num">1</text>
  <text x="317" y="449" class="h">요구사항과 범위 게이트</text>
  <text x="80" y="495" class="check">□ 핵심 명사·동사·수량·금지 규칙이 설계 요소와 연결되는가?</text>
  <text x="80" y="526" class="check">□ 포함·제외 기능과 아직 결정하지 않은 업무 규칙을 구분했는가?</text>
  <text x="80" y="557" class="check">□ 요구사항을 테이블·컬럼·관계·제약조건·테스트로 추적할 수 있는가?</text>
  <text x="80" y="588" class="check">□ 학생·강사·강의·수강신청에서 한 행의 의미를 설명할 수 있는가?</text>
  <rect x="105" y="620" width="425" height="34" class="box blue"/>
  <text x="317" y="642" class="m">증거 · 요구사항 문장 ↔ 설계 요소 ↔ 검증 SQL의 연결 기록</text>

  <rect x="620" y="425" width="525" height="255" class="box orange"/>
  <rect x="620" y="425" width="525" height="38" class="tagO" rx="10"/>
  <circle cx="647" cy="444" r="14" class="nO"/><text x="647" y="449" class="num">2</text>
  <text x="882" y="449" class="h">데이터 모델과 DDL 게이트</text>
  <text x="645" y="495" class="check">□ 모든 테이블에 안정적인 PK가 있고 FK 방향이 정확한가?</text>
  <text x="645" y="526" class="check">□ 학생–강의 N:M을 enrollments의 두 1:N 관계로 해소했는가?</text>
  <text x="645" y="557" class="check">□ 이름·이메일·제목을 수강신청 행에 반복 저장하지 않았는가?</text>
  <text x="645" y="588" class="check">□ UNIQUE·NOT NULL·FK·CHECK가 실제 업무 규칙과 일치하는가?</text>
  <text x="645" y="619" class="check">□ 재신청 복합 UNIQUE는 정책이 확정된 경우에만 적용했는가?</text>
  <rect x="670" y="638" width="425" height="26" class="box orange"/>
  <text x="882" y="656" class="m">증거 · ERD와 schema.sql의 테이블·키·제약조건이 일치</text>

  <rect x="55" y="710" width="525" height="255" class="box green"/>
  <rect x="55" y="710" width="525" height="38" class="tagG" rx="10"/>
  <circle cx="82" cy="729" r="14" class="nG"/><text x="82" y="734" class="num">3</text>
  <text x="317" y="734" class="h">실행과 결과 증거 게이트</text>
  <text x="80" y="780" class="check">□ 빈 DB에서 부모부터 생성하고 전체 스크립트를 다시 실행할 수 있는가?</text>
  <text x="80" y="811" class="check">□ 한 강사의 여러 강의·한 학생의 여러 신청·한 강의의 여러 학생을 재현하는가?</text>
  <text x="80" y="842" class="check">□ 중복 email·없는 FK·음수 금액·잘못된 status가 차단되는가?</text>
  <text x="80" y="873" class="check">□ JOIN 결과의 학생명·강의명·강사명·상태·결제액과 행 수가 예상과 같은가?</text>
  <text x="80" y="904" class="check">□ UPDATE·DELETE 전후 SELECT와 부모 정보 보존을 확인했는가?</text>
  <rect x="105" y="923" width="425" height="26" class="box green"/>
  <text x="317" y="941" class="m">증거 · 성공 결과와 실패 오류, 전후 행 수를 함께 저장</text>

  <rect x="620" y="710" width="525" height="255" class="box purple"/>
  <rect x="620" y="710" width="525" height="38" class="tagP" rx="10"/>
  <circle cx="647" cy="729" r="14" class="nP"/><text x="647" y="734" class="num">4</text>
  <text x="882" y="734" class="h">품질·설명·재현성 게이트</text>
  <text x="645" y="780" class="check">□ 중복과 삽입·수정·삭제 이상이 실제 SQL 결과에서 줄었는가?</text>
  <text x="645" y="811" class="check">□ 독립 이유 없는 1:1 분리나 갱신 책임 없는 중복값이 없는가?</text>
  <text x="645" y="842" class="check">□ AI 제안과 사람의 채택·거절·수정 이유를 구분해 기록했는가?</text>
  <text x="645" y="873" class="check">□ 다른 사람이 README 순서대로 실행해 같은 결과를 얻는가?</text>
  <text x="645" y="904" class="check">□ 결제 이력·진도율 같은 확장은 현재 기준선과 분리했는가?</text>
  <rect x="670" y="923" width="425" height="26" class="box purple"/>
  <text x="882" y="941" class="m">증거 · 검토 기록과 독립 재실행 결과, 후속 확장 목록</text>

  <path d="M580 550H620" class="arr"/>
  <path d="M882 680V695H317V710" class="arr"/>
  <path d="M580 837H620" class="arr"/>

  <rect x="35" y="1035" width="1130" height="235" class="panel decisionPanel"/>
  <text x="60" y="1067" class="pt">2. 체크 표시가 아니라 확인 가능한 증거로 완료 여부 결정</text>

  <rect x="55" y="1110" width="300" height="105" class="box red"/>
  <rect x="55" y="1110" width="300" height="32" class="tagR" rx="10"/>
  <text x="205" y="1132" class="h">미완료</text>
  <text x="205" y="1165" class="m">누락된 증거와 수정할 원본을 지정</text>
  <text x="205" y="1188" class="code">requirements · ERD · schema · seed · README</text>

  <polygon points="600,1090 750,1155 600,1220 450,1155" class="decision"/>
  <text x="600" y="1148" class="dt">모든 항목에 설명·파일·SQL 결과가 있는가?</text>
  <text x="600" y="1172" class="m">오류 없이 실행된 사실만으로 완료하지 않음</text>

  <rect x="845" y="1110" width="300" height="105" class="box green"/>
  <rect x="845" y="1110" width="300" height="32" class="tagG" rx="10"/>
  <text x="995" y="1132" class="h">완료된 기준선</text>
  <text x="995" y="1165" class="m">요구사항·ERD·SQL·데이터·결과·근거가</text>
  <text x="995" y="1188" class="m">같은 버전에서 같은 업무 규칙을 설명</text>

  <path d="M450 1155H355" class="back"/>
  <path d="M750 1155H845" class="arr"/>
  <path d="M205 1110V1020H18V530H55" class="back"/>
  <text x="398" y="1138" class="m">아니요</text><text x="802" y="1138" class="m">예</text>

  <rect x="35" y="1300" width="1130" height="125" class="panel done"/>
  <text x="60" y="1332" class="pt">3. 프로젝트 완료의 정의</text>
  <rect x="55" y="1355" width="250" height="48" class="box blue"/>
  <text x="180" y="1375" class="h">설명 가능</text><text x="180" y="1394" class="m">왜 이 테이블·키·제약조건인지 근거 제시</text>
  <rect x="330" y="1355" width="250" height="48" class="box green"/>
  <text x="455" y="1375" class="h">실행 가능</text><text x="455" y="1394" class="m">빈 데이터베이스에서 전체 과정 재현</text>
  <rect x="605" y="1355" width="250" height="48" class="box purple"/>
  <text x="730" y="1375" class="h">검증 가능</text><text x="730" y="1394" class="m">정상·오류·JOIN·CRUD 결과가 예상과 일치</text>
  <rect x="880" y="1355" width="250" height="48" class="box orange"/>
  <text x="1005" y="1375" class="h">변경 가능</text><text x="1005" y="1394" class="m">새 요구사항의 영향 원본과 테스트를 추적</text>

  <rect x="55" y="1440" width="350" height="28" class="note"/><text x="230" y="1459" class="nt">완료 여부는 점수나 파일 개수가 아니라 증거로 판단</text>
  <rect x="425" y="1440" width="350" height="28" class="note"/><text x="600" y="1459" class="nt">확장 기능은 현재 기준선 완료 후 별도 설계</text>
  <rect x="795" y="1440" width="350" height="28" class="core"/><text x="970" y="1459" class="cv">다른 사람이 설명·실행·검증할 수 있으면 완료</text>
</svg>