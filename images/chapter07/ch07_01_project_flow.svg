<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1260" viewBox="0 0 1200 1260" role="img" aria-labelledby="title desc"><title id="title">온라인 강의 데이터베이스 프로젝트 진행 흐름</title><desc id="desc">온라인 강의 수강신청 데이터베이스 프로젝트에서 범위와 성공 기준을 정하고 요구사항 분석, ERD 설계, PostgreSQL 구현, 테스트 데이터와 JOIN 및 CRUD 검증을 수행한 뒤 결과가 요구사항과 일치하지 않으면 설계로 되돌아가는 반복 흐름</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}.t{font-size:28px;font-weight:700;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.panel{stroke-width:1.5;rx:15}.scope{fill:#eef5ff;stroke:#6fa2e8}.design{fill:#fff8e8;stroke:#d69e2e}.build{fill:#f8fafc;stroke:#a8b3c4}.verify{fill:#f2fbf5;stroke:#8bc9a0}.pt{font-size:19px;font-weight:700}.box{fill:#fff;stroke-width:1.4;rx:10}.blue{stroke:#3b82c4}.orange{stroke:#d69e2e}.green{stroke:#3c9a5f}.red{stroke:#d9534f}.purple{stroke:#7c5cc4}.gray{stroke:#64748b}.h{font-size:14px;font-weight:700;text-anchor:middle}.m{font-size:11.3px;text-anchor:middle;fill:#475569}.code{font-family:Consolas,D2Coding,monospace;font-size:12px;font-weight:700;text-anchor:middle;fill:#334155}.arr{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.back{stroke:#d9534f;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#a)}.step{font-size:12px;font-weight:700;text-anchor:middle;fill:#fff}.nBlue{fill:#3b82c4}.nOrange{fill:#d69e2e}.nGreen{fill:#3c9a5f}.nPurple{fill:#7c5cc4}.tagB{fill:#dcecff}.tagO{fill:#fff1cf}.tagG{fill:#dcfce7}.tagP{fill:#ede9fe}.decision{fill:#fff8e8;stroke:#b7791f;stroke-width:1.8}.dt{font-size:14px;font-weight:700;text-anchor:middle}.note{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.3;rx:9}.nt{font-size:11.2px;font-weight:700;text-anchor:middle;fill:#92400e}.core{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.5;rx:10}.cv{font-size:14.1px;font-weight:700;text-anchor:middle;fill:#166534}</style></defs><rect width="1200" height="1260" fill="#fff"/><text x="600" y="40" class="t">온라인 강의 데이터베이스 프로젝트 진행 흐름</text><text x="600" y="68" class="s">요구사항을 구조로 바꾸고, 실제 데이터와 SQL 결과가 그 구조의 주장을 증명할 때까지 반복한다</text><rect x="35" y="100" width="1130" height="185" class="panel scope"/><text x="60" y="132" class="pt">1. 시작 전에 프로젝트의 경계와 성공 기준을 고정</text><rect x="55" y="160" width="330" height="92" class="box blue"/><text x="220" y="186" class="h">기본 범위</text><text x="220" y="211" class="code">students · instructors</text><text x="220" y="234" class="code">courses · enrollments</text><rect x="435" y="160" width="330" height="92" class="box gray"/><text x="600" y="186" class="h">후속 확장으로 구분</text><text x="600" y="211" class="m">결제 이력 · 환불 · 진도율</text><text x="600" y="234" class="m">수료증 · 수강평 · 강의 영상</text><rect x="815" y="160" width="330" height="92" class="box green"/><text x="980" y="186" class="h">성공 기준</text><text x="980" y="211" class="m">요구사항이 ERD·제약조건·샘플과</text><text x="980" y="234" class="m">JOIN·CRUD 결과로 재현되어야 함</text><text x="600" y="272" class="m">단순함과 누락을 구분하고, 이번 버전에서 선택한 규칙과 아직 결정하지 않은 규칙을 기록한다</text><rect x="35" y="315" width="1130" height="330" class="panel design"/><text x="60" y="347" class="pt">2. 요구사항을 데이터 구조로 변환</text><rect x="55" y="390" width="245" height="185" class="box blue"/><circle cx="82" cy="414" r="16" class="nBlue"/><text x="82" y="419" class="step">1</text><text x="177" y="418" class="h">요구사항·시나리오</text><text x="177" y="452" class="m">학생·강사·강의·수강신청</text><text x="177" y="475" class="m">한 강사의 여러 강의</text><text x="177" y="498" class="m">학생과 강의의 N:M 관계</text><text x="177" y="521" class="m">상태·가격·이메일 규칙</text><text x="177" y="551" class="code">산출물 · 범위·요구사항 추적표</text><rect x="335" y="390" width="245" height="185" class="box orange"/><circle cx="362" cy="414" r="16" class="nOrange"/><text x="362" y="419" class="step">2</text><text x="457" y="418" class="h">엔터티·속성·관계</text><text x="457" y="452" class="m">명사에서 대상과 속성 찾기</text><text x="457" y="475" class="m">동사에서 관계와 수량 찾기</text><text x="457" y="498" class="m">각 테이블 한 행의 의미 정의</text><text x="457" y="521" class="m">관계 자체 속성은 enrollments</text><text x="457" y="551" class="code">산출물 · 데이터 사전</text><rect x="615" y="390" width="245" height="185" class="box purple"/><circle cx="642" cy="414" r="16" class="nPurple"/><text x="642" y="419" class="step">3</text><text x="737" y="418" class="h">키·관계·ERD</text><text x="737" y="452" class="m">모든 테이블에 PK</text><text x="737" y="475" class="m">올바른 위치에 FK</text><text x="737" y="498" class="m">1:N과 선택성 표현</text><text x="737" y="521" class="m">N:M을 enrollments로 해소</text><text x="737" y="551" class="code">산출물 · 검토 가능한 ERD</text><rect x="895" y="390" width="245" height="185" class="box green"/><circle cx="922" cy="414" r="16" class="nGreen"/><text x="922" y="419" class="step">4</text><text x="1017" y="418" class="h">정규화·규칙 검토</text><text x="1017" y="452" class="m">중복과 이상 현상 확인</text><text x="1017" y="475" class="m">이메일 UNIQUE</text><text x="1017" y="498" class="m">상태·가격 CHECK 후보</text><text x="1017" y="521" class="m">재신청 허용 여부 명시</text><text x="1017" y="551" class="code">산출물 · 설계 결정 기록</text><path d="M300 482H335" class="arr"/><path d="M580 482H615" class="arr"/><path d="M860 482H895" class="arr"/><rect x="175" y="595" width="850" height="28" class="box red"/><text x="600" y="614" class="m">각 요구사항 문장이 어느 테이블·컬럼·관계·제약조건과 검증 시나리오로 이어지는지 추적한다</text><rect x="35" y="675" width="1130" height="310" class="panel build"/><text x="60" y="707" class="pt">3. PostgreSQL로 구현하고 샘플 데이터로 주장 검증</text><rect x="55" y="750" width="250" height="165" class="box blue"/><rect x="55" y="750" width="250" height="34" class="tagB" rx="10"/><text x="180" y="773" class="h">DDL 구현</text><text x="180" y="813" class="code">CREATE TABLE</text><text x="180" y="837" class="m">부모 테이블부터 생성</text><text x="180" y="860" class="m">NOT NULL · UNIQUE · FK</text><text x="180" y="883" class="m">CHECK로 상태·금액 검증</text><rect x="335" y="750" width="250" height="165" class="box orange"/><rect x="335" y="750" width="250" height="34" class="tagO" rx="10"/><text x="460" y="773" class="h">테스트 데이터</text><text x="460" y="813" class="m">한 학생의 여러 수강신청</text><text x="460" y="837" class="m">한 강의의 여러 학생</text><text x="460" y="860" class="m">한 강사의 여러 강의</text><text x="460" y="883" class="m">상태·금액·오류 사례</text><rect x="615" y="750" width="250" height="165" class="box purple"/><rect x="615" y="750" width="250" height="34" class="tagP" rx="10"/><text x="740" y="773" class="h">JOIN·CRUD 검증</text><text x="740" y="813" class="m">학생·강의·강사 정보 복원</text><text x="740" y="837" class="m">안전한 INSERT·UPDATE·DELETE</text><text x="740" y="860" class="m">실행 전 대상 SELECT</text><text x="740" y="883" class="m">건수·상태·금액 비교</text><rect x="895" y="750" width="250" height="165" class="box green"/><rect x="895" y="750" width="250" height="34" class="tagG" rx="10"/><text x="1020" y="773" class="h">예외·무결성 검증</text><text x="1020" y="813" class="m">중복 이메일 차단</text><text x="1020" y="837" class="m">음수 금액·잘못된 상태 차단</text><text x="1020" y="860" class="m">존재하지 않는 FK 차단</text><text x="1020" y="883" class="m">삭제 후 독립 정보 보존</text><path d="M305 832H335" class="arr"/><path d="M585 832H615" class="arr"/><path d="M865 832H895" class="arr"/><rect x="180" y="935" width="840" height="28" class="box green"/><text x="600" y="954" class="code">schema.sql · seed.sql · validation.sql을 처음부터 다시 실행해도 같은 결과가 나와야 함</text><rect x="35" y="1015" width="1130" height="155" class="panel verify"/><text x="60" y="1047" class="pt">4. 결과를 근거로 설계 품질을 다시 판단</text><rect x="55" y="1080" width="240" height="56" class="box green"/><text x="175" y="1102" class="h">업무 의미</text><text x="175" y="1125" class="m">요구사항과 JOIN 결과 일치</text><rect x="320" y="1080" width="240" height="56" class="box blue"/><text x="440" y="1102" class="h">정합성</text><text x="440" y="1125" class="m">PK·FK·UNIQUE·CHECK 작동</text><rect x="585" y="1080" width="240" height="56" class="box orange"/><text x="705" y="1102" class="h">설계 품질</text><text x="705" y="1125" class="m">중복·이상·과도한 분리 점검</text><rect x="850" y="1080" width="240" height="56" class="box purple"/><text x="970" y="1102" class="h">AI 비교</text><text x="970" y="1125" class="m">제안과 최종안 차이를 근거화</text><polygon points="600,1185 730,1218 600,1251 470,1218" class="decision"/><text x="600" y="1213" class="dt">요구사항·ERD·SQL·실행 결과가 같은 규칙을 설명하는가?</text><text x="600" y="1234" class="m">아니면 범위·관계·키·제약조건·샘플을 다시 검토</text><path d="M470 1218H18V480H55" class="back"/><rect x="55" y="1188" width="350" height="44" class="note"/><text x="230" y="1207" class="nt">샘플 데이터는 장식이 아니라 요구사항을 검증하는 테스트</text><text x="230" y="1225" class="m">정상·경계·오류 사례를 의도적으로 포함</text><rect x="795" y="1188" width="350" height="44" class="core"/><text x="970" y="1207" class="cv">재현 가능한 프로젝트 기준선</text><text x="970" y="1225" class="m">ERD · SQL · 샘플 · 검증 결과 · 설계 결정 기록</text></svg>