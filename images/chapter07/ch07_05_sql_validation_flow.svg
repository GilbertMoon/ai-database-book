<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1450" viewBox="0 0 1200 1450" role="img" aria-labelledby="title desc">
  <title id="title">SQL 기반 설계 검증 흐름</title>
  <desc id="desc">온라인 강의 데이터베이스의 ERD와 DDL을 구현하고 정상, 관계, 경계, 오류 테스트 데이터를 입력한 뒤 기본 조회, JOIN, CRUD를 예상 결과와 비교하며 실패 원인을 구조, 데이터, 조회, 요구사항으로 분류해 전체 검증을 반복하는 흐름</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <style>
      text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}
      .t{font-size:28px;font-weight:700;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}
      .panel{stroke-width:1.5;rx:15}.base{fill:#eef5ff;stroke:#6fa2e8}.structure{fill:#fff8e8;stroke:#d69e2e}.data{fill:#f8fafc;stroke:#a8b3c4}.join{fill:#f3f0ff;stroke:#a995d6}.crud{fill:#f2fbf5;stroke:#8bc9a0}.result{fill:#fff5f5;stroke:#e39a98}
      .pt{font-size:19px;font-weight:700}.box{fill:#fff;stroke-width:1.4;rx:10}.blue{stroke:#3b82c4}.orange{stroke:#d69e2e}.green{stroke:#3c9a5f}.purple{stroke:#7c5cc4}.red{stroke:#d9534f}.gray{stroke:#64748b}
      .h{font-size:14px;font-weight:700;text-anchor:middle}.m{font-size:11.2px;text-anchor:middle;fill:#475569}.code{font-family:Consolas,D2Coding,monospace;font-size:11.8px;font-weight:700;text-anchor:middle;fill:#334155}
      .arr{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.back{stroke:#d9534f;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#a)}
      .tagB{fill:#dcecff}.tagO{fill:#fff1cf}.tagG{fill:#dcfce7}.tagP{fill:#ede9fe}.tagR{fill:#fee2e2}.tagX{fill:#e2e8f0}
      .decision{fill:#fff8e8;stroke:#b7791f;stroke-width:1.8}.dt{font-size:13.8px;font-weight:700;text-anchor:middle}
      .note{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.3;rx:9}.nt{font-size:11px;font-weight:700;text-anchor:middle;fill:#92400e}.core{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.5;rx:10}.cv{font-size:13.8px;font-weight:700;text-anchor:middle;fill:#166534}
    </style>
  </defs>
  <rect width="1200" height="1450" fill="#fff"/>
  <text x="600" y="40" class="t">SQL 기반 설계 검증 흐름</text>
  <text x="600" y="68" class="s">SQL이 실행되는지만 보지 않고, 요구사항의 예상 결과가 구조·데이터·조회·변경에서 재현되는지 확인한다</text>

  <rect x="35" y="100" width="1130" height="180" class="panel base"/>
  <text x="60" y="132" class="pt">0. 실행 전에 검증 기준선을 준비</text>
  <rect x="55" y="165" width="330" height="85" class="box blue"/>
  <rect x="55" y="165" width="330" height="32" class="tagB" rx="10"/>
  <text x="220" y="187" class="h">ERD</text>
  <text x="220" y="219" class="m">테이블 · 한 행의 의미 · PK · FK</text><text x="220" y="240" class="m">카디널리티 · 선택성 · 관계 속성</text>
  <rect x="435" y="165" width="330" height="85" class="box orange"/>
  <rect x="435" y="165" width="330" height="32" class="tagO" rx="10"/>
  <text x="600" y="187" class="h">실행 파일</text>
  <text x="600" y="219" class="code">schema.sql · seed.sql</text><text x="600" y="240" class="code">validation.sql</text>
  <rect x="815" y="165" width="330" height="85" class="box green"/>
  <rect x="815" y="165" width="330" height="32" class="tagG" rx="10"/>
  <text x="980" y="187" class="h">예상 결과</text>
  <text x="980" y="219" class="m">성공할 INSERT · 차단될 INSERT</text><text x="980" y="240" class="m">예상 행 수 · JOIN 결과 · 변경 후 상태</text>

  <rect x="35" y="310" width="1130" height="185" class="panel structure"/>
  <text x="60" y="342" class="pt">1. 구조 검증 · ERD의 주장이 실제 DDL로 구현되었는가?</text>
  <rect x="55" y="380" width="245" height="82" class="box blue"/>
  <text x="177" y="406" class="h">생성 순서</text><text x="177" y="431" class="m">부모 테이블부터 CREATE</text><text x="177" y="451" class="code">students·instructors → courses → enrollments</text>
  <rect x="335" y="380" width="245" height="82" class="box orange"/>
  <text x="457" y="406" class="h">컬럼 구조</text><text x="457" y="431" class="m">자료형 · NULL 허용 · 기본키</text><text x="457" y="451" class="m">ERD와 실제 테이블 메타데이터 비교</text>
  <rect x="615" y="380" width="245" height="82" class="box purple"/>
  <text x="737" y="406" class="h">제약조건</text><text x="737" y="431" class="m">FK · UNIQUE · CHECK · NOT NULL</text><text x="737" y="451" class="m">참조 대상과 허용 범위 확인</text>
  <rect x="895" y="380" width="245" height="82" class="box green"/>
  <text x="1017" y="406" class="h">재실행성</text><text x="1017" y="431" class="m">DROP 후 CREATE를 다시 실행해도</text><text x="1017" y="451" class="m">동일한 빈 구조가 만들어지는가?</text>
  <path d="M300 421H335" class="arr"/><path d="M580 421H615" class="arr"/><path d="M860 421H895" class="arr"/>

  <rect x="35" y="525" width="1130" height="235" class="panel data"/>
  <text x="60" y="557" class="pt">2. 샘플 데이터를 요구사항 테스트 시나리오로 설계</text>
  <rect x="55" y="595" width="245" height="115" class="box blue"/>
  <rect x="55" y="595" width="245" height="32" class="tagB" rx="10"/>
  <text x="177" y="617" class="h">정상 시나리오</text>
  <text x="177" y="652" class="m">한 강사의 여러 강의</text><text x="177" y="675" class="m">정상 학생·강사·강의 등록</text><text x="177" y="698" class="m">성공해야 하는 INSERT</text>
  <rect x="335" y="595" width="245" height="115" class="box orange"/>
  <rect x="335" y="595" width="245" height="32" class="tagO" rx="10"/>
  <text x="457" y="617" class="h">관계 시나리오</text>
  <text x="457" y="652" class="m">한 학생의 여러 신청</text><text x="457" y="675" class="m">한 강의의 여러 학생</text><text x="457" y="698" class="m">수강신청별 상태·결제액</text>
  <rect x="615" y="595" width="245" height="115" class="box purple"/>
  <rect x="615" y="595" width="245" height="32" class="tagP" rx="10"/>
  <text x="737" y="617" class="h">경계 시나리오</text>
  <text x="737" y="652" class="m">신청·수강중·완료·취소</text><text x="737" y="675" class="m">서로 다른 금액과 선택 입력</text><text x="737" y="698" class="m">NULL 허용 여부 확인</text>
  <rect x="895" y="595" width="245" height="115" class="box red"/>
  <rect x="895" y="595" width="245" height="32" class="tagR" rx="10"/>
  <text x="1017" y="617" class="h">오류 시나리오</text>
  <text x="1017" y="652" class="m">중복 이메일 · 없는 FK</text><text x="1017" y="675" class="m">음수 금액 · 잘못된 상태</text><text x="1017" y="698" class="m">실패해야 하는 INSERT</text>
  <rect x="165" y="724" width="870" height="24" class="box green"/>
  <text x="600" y="741" class="m">각 테스트에 기대 결과를 기록한다 · 성공/실패 · 예상 행 수 · 예상 오류 제약조건 · 예상 상태값</text>

  <rect x="35" y="790" width="1130" height="220" class="panel join"/>
  <text x="60" y="822" class="pt">3. 저장 결과와 JOIN 경로를 단계적으로 검증</text>
  <rect x="55" y="860" width="250" height="110" class="box gray"/>
  <text x="180" y="886" class="h">기본 조회</text><text x="180" y="915" class="code">SELECT · COUNT</text><text x="180" y="939" class="m">테이블별 행 수와 실제 ID 확인</text><text x="180" y="961" class="m">ID 값을 추측하지 않음</text>
  <rect x="335" y="860" width="250" height="110" class="box blue"/>
  <text x="460" y="886" class="h">학생 연결</text><text x="460" y="915" class="code">e.student_id = s.id</text><text x="460" y="939" class="m">신청 행이 올바른 학생을</text><text x="460" y="961" class="m">가리키는지 두 테이블로 확인</text>
  <rect x="615" y="860" width="250" height="110" class="box orange"/>
  <text x="740" y="886" class="h">강의 연결</text><text x="740" y="915" class="code">e.course_id = c.id</text><text x="740" y="939" class="m">강의 누락·중복과 잘못된</text><text x="740" y="961" class="m">JOIN 조건을 단계적으로 진단</text>
  <rect x="895" y="860" width="250" height="110" class="box purple"/>
  <text x="1020" y="886" class="h">강사까지 복원</text><text x="1020" y="915" class="code">c.instructor_id = i.id</text><text x="1020" y="939" class="m">학생명·강의명·강사명·상태</text><text x="1020" y="961" class="m">결제액·신청일과 행 수 비교</text>
  <path d="M305 915H335" class="arr"/><path d="M585 915H615" class="arr"/><path d="M865 915H895" class="arr"/>
  <rect x="165" y="980" width="870" height="22" class="box purple"/>
  <text x="600" y="996" class="m">긴 JOIN이 틀리면 전체 SQL만 바라보지 말고 FK 연결을 두 테이블씩 확인해 누락·중복이 시작되는 지점을 찾는다</text>

  <rect x="35" y="1040" width="1130" height="175" class="panel crud"/>
  <text x="60" y="1072" class="pt">4. CRUD 검증 · 변경 전 확인과 변경 후 검증을 한 세트로 실행</text>
  <rect x="55" y="1105" width="245" height="78" class="box blue"/>
  <text x="177" y="1130" class="h">INSERT</text><text x="177" y="1155" class="m">입력 후 관계·행 수·JOIN 결과 확인</text><text x="177" y="1175" class="m">FK와 CHECK가 계속 작동하는지 검증</text>
  <rect x="335" y="1105" width="245" height="78" class="box orange"/>
  <text x="457" y="1130" class="h">UPDATE 전</text><text x="457" y="1155" class="code">같은 WHERE로 SELECT</text><text x="457" y="1175" class="m">대상 행과 예상 변경 건수 확인</text>
  <rect x="615" y="1105" width="245" height="78" class="box green"/>
  <text x="737" y="1130" class="h">UPDATE 후</text><text x="737" y="1155" class="m">상태·값·변경 행 수 재조회</text><text x="737" y="1175" class="m">관련 JOIN 결과도 함께 확인</text>
  <rect x="895" y="1105" width="245" height="78" class="box red"/>
  <text x="1017" y="1130" class="h">DELETE 또는 상태 변경</text><text x="1017" y="1155" class="m">취소 이력은 상태 변경을 먼저 검토</text><text x="1017" y="1175" class="m">삭제 전후 조회와 부모 정보 보존 확인</text>
  <path d="M300 1144H335" class="arr"/><path d="M580 1144H615" class="arr"/><path d="M860 1144H895" class="arr"/>

  <rect x="35" y="1245" width="1130" height="135" class="panel result"/>
  <text x="60" y="1277" class="pt">5. 예상 결과와 다르면 원인을 분류하고 전체 검증을 다시 실행</text>
  <polygon points="600,1290 735,1322 600,1354 465,1322" class="decision"/>
  <text x="600" y="1317" class="dt">구조·데이터·JOIN·CRUD 결과가 요구사항과 모두 일치하는가?</text>
  <text x="600" y="1338" class="m">오류 없이 실행된 것만으로는 검증 완료가 아님</text>
  <rect x="55" y="1295" width="300" height="58" class="box red"/>
  <text x="205" y="1318" class="h">아니요 · 실패 원인 분류</text><text x="205" y="1342" class="m">구조 · 데이터 · 조회 · 미정 업무 규칙</text>
  <rect x="845" y="1295" width="300" height="58" class="box green"/>
  <text x="995" y="1318" class="h">예 · 검증된 기준선</text><text x="995" y="1342" class="code">ERD · schema · seed · validation</text>
  <path d="M465 1322H355" class="back"/><path d="M735 1322H845" class="arr"/>
  <path d="M205 1295V1228H18V205H55" class="back"/>

  <rect x="55" y="1400" width="350" height="28" class="note"/><text x="230" y="1419" class="nt">샘플 데이터는 요구사항을 증명하는 테스트 데이터</text>
  <rect x="425" y="1400" width="350" height="28" class="note"/><text x="600" y="1419" class="nt">UPDATE·DELETE는 전후 SELECT와 함께 실행</text>
  <rect x="795" y="1400" width="350" height="28" class="core"/><text x="970" y="1419" class="cv">빈 DB에서 같은 순서로 실행해 같은 결과 재현</text>
</svg>