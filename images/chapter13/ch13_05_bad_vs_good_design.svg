<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">역할이 섞인 설계와 역할별로 분리한 설계 비교</title>
  <desc id="desc">학생, 강의, 강사, 신청과 결제 데이터가 TEXT 컬럼 중심의 한 테이블에 섞인 구조를 역할별 테이블과 올바른 외래키 관계, 제약조건을 갖춘 구조로 개선하는 과정을 비교한다.</desc>
  <style>
    .ko { font-family: "NanumSquare", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", "UnDotum", Arial, sans-serif; fill: #1f2937; }
    .mono { font-family: "Noto Sans Mono CJK KR", "NanumSquare", Consolas, D2Coding, "Courier New", monospace; fill: #1f2937; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #4b5563; }
    .head { font-size: 17px; font-weight: 700; }
    .table-head { font-size: 15px; font-weight: 700; }
    .body { font-size: 14px; }
    .small { font-size: 12px; fill: #475569; }
    .field { font-size: 12.5px; }
    .box { stroke: #64748b; stroke-width: 1.8; rx: 14; ry: 14; }
    .req { fill: #eaf3ff; }
    .human { fill: #fff6d8; }
    .ok { fill: #eaf8ee; }
    .bad { fill: #ffeaea; }
    .meta { fill: #f8fafc; }
    .line { stroke: #475569; stroke-width: 2; fill: none; }
    .relation { stroke: #334155; stroke-width: 2; fill: none; }
    .relation-label { font-size: 11px; font-weight: 700; fill: #334155; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="43" text-anchor="middle" class="ko title">역할이 섞인 설계와 역할별 분리 설계</text>
  <text x="600" y="71" text-anchor="middle" class="ko subtitle">테이블 수가 아니라 데이터의 소유자, 관계와 검증 규칙을 분명하게 만드는 것이 핵심입니다.</text>

  <!-- Bad design -->
  <rect x="45" y="105" width="480" height="465" class="box bad"/>
  <text x="285" y="140" text-anchor="middle" class="ko head">역할이 섞인 설계</text>

  <rect x="75" y="165" width="420" height="260" class="box meta"/>
  <text x="285" y="195" text-anchor="middle" class="mono table-head">ai_review_lab.bad_enrollments</text>
  <text x="105" y="228" class="mono field">student_email TEXT</text>
  <text x="105" y="256" class="mono field">course_price TEXT</text>
  <text x="105" y="284" class="mono field">payment_status TEXT</text>
  <text x="105" y="312" class="mono field">enrollment_status TEXT</text>
  <text x="105" y="340" class="mono field">sensitive_value_plaintext TEXT</text>
  <text x="105" y="368" class="mono field">created_at TEXT</text>
  <text x="105" y="401" class="ko small">학생·강의·강사·신청·결제의 서로 다른 사실이 한 행에 혼합</text>

  <rect x="75" y="450" width="420" height="85" class="box bad"/>
  <text x="285" y="480" text-anchor="middle" class="ko body">
    <tspan x="285">반복 데이터 · 타입과 상태값 검증 부족 · FK 없음</tspan>
    <tspan x="285" dy="24">문자형 금액·날짜 입력과 민감정보 평문 저장 위험</tspan>
  </text>

  <!-- Redesign arrow -->
  <line x1="525" y1="337" x2="675" y2="337" class="line" marker-end="url(#arrow)"/>
  <text x="600" y="314" text-anchor="middle" class="ko small">역할과 관계 재설계</text>

  <!-- Good design -->
  <rect x="675" y="105" width="480" height="465" class="box ok"/>
  <text x="915" y="140" text-anchor="middle" class="ko head">역할별 분리와 관계 보장</text>

  <rect x="705" y="160" width="190" height="90" class="box meta"/>
  <text x="800" y="184" text-anchor="middle" class="mono table-head">students</text>
  <text x="800" y="209" text-anchor="middle" class="mono field">id PK</text>
  <text x="800" y="231" text-anchor="middle" class="mono field">email UNIQUE</text>

  <rect x="930" y="160" width="190" height="90" class="box meta"/>
  <text x="1025" y="184" text-anchor="middle" class="mono table-head">instructors</text>
  <text x="1025" y="209" text-anchor="middle" class="mono field">id PK</text>
  <text x="1025" y="231" text-anchor="middle" class="mono field">email UNIQUE</text>

  <rect x="820" y="285" width="190" height="100" class="box req"/>
  <text x="915" y="309" text-anchor="middle" class="mono table-head">courses</text>
  <text x="915" y="333" text-anchor="middle" class="mono field">instructor_id FK</text>
  <text x="915" y="354" text-anchor="middle" class="mono field">course_code UNIQUE</text>
  <text x="915" y="375" text-anchor="middle" class="mono field">price CHECK</text>

  <rect x="705" y="425" width="190" height="105" class="box req"/>
  <text x="800" y="449" text-anchor="middle" class="mono table-head">enrollments</text>
  <text x="800" y="473" text-anchor="middle" class="mono field">student_id · course_id FK</text>
  <text x="800" y="495" text-anchor="middle" class="mono field">status CHECK</text>
  <text x="800" y="517" text-anchor="middle" class="mono field">agreed_amount CHECK</text>

  <rect x="930" y="425" width="190" height="105" class="box req"/>
  <text x="1025" y="449" text-anchor="middle" class="mono table-head">payments</text>
  <text x="1025" y="473" text-anchor="middle" class="mono field">enrollment_id FK</text>
  <text x="1025" y="495" text-anchor="middle" class="mono field">payment_status CHECK</text>
  <text x="1025" y="517" text-anchor="middle" class="mono field">payment_reference UNIQUE</text>

  <!-- Correct relationships -->
  <line x1="1025" y1="250" x2="950" y2="285" class="relation" marker-end="url(#arrow)"/>
  <text x="1000" y="274" text-anchor="middle" class="ko relation-label">1:N</text>

  <line x1="800" y1="250" x2="800" y2="425" class="relation" marker-end="url(#arrow)"/>
  <text x="782" y="345" text-anchor="middle" class="ko relation-label">1:N</text>

  <line x1="880" y1="385" x2="835" y2="425" class="relation" marker-end="url(#arrow)"/>
  <text x="850" y="404" text-anchor="middle" class="ko relation-label">1:N</text>

  <line x1="895" y1="478" x2="930" y2="478" class="relation" marker-end="url(#arrow)"/>
  <text x="912" y="463" text-anchor="middle" class="ko relation-label">1:0..1</text>

  <!-- Conclusion -->
  <line x1="600" y1="570" x2="600" y2="615" class="line" marker-end="url(#arrow)"/>
  <rect x="175" y="620" width="850" height="70" class="box human"/>
  <text x="600" y="648" text-anchor="middle" class="ko head">
    <tspan x="600">역할별 테이블 분리 + PK·FK로 관계 보장 + 타입·CHECK로 값 검증</tspan>
    <tspan x="600" dy="25">민감정보 원문 대신 추적 가능한 payment_reference 저장</tspan>
  </text>
</svg>
