<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">역할이 섞인 설계와 분리된 설계</title>
  <desc id="desc">학생, 강의, 강사, 신청과 결제가 한 테이블에 섞인 구조의 문제와 역할별 분리 구조의 개선점을 비교</desc>
  <style>
    .ko { font-family: "NanumSquare", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", "UnDotum", Arial, sans-serif; fill: #1f2937; }
    .mono { font-family: "Noto Sans Mono CJK KR", "NanumSquare", Consolas, D2Coding, "Courier New", monospace; fill: #1f2937; }
    .title { font-size: 28px; font-weight: 700; }.subtitle { font-size: 14px; fill: #4b5563; }.head { font-size: 17px; font-weight: 700; }.body { font-size: 14px; }.small { font-size: 12px; fill: #475569; }
    .box { stroke: #64748b; stroke-width: 1.8; rx: 14; ry: 14; }.req { fill: #eaf3ff; }.human { fill: #fff6d8; }.ok { fill: #eaf8ee; }.bad { fill: #ffeaea; }.meta { fill: #f1f5f9; }.line { stroke: #475569; stroke-width: 2; fill: none; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
  <rect x="0" y="0" width="1200" height="660" fill="#ffffff"/>
  <text x="600" y="45" text-anchor="middle" class="ko title"><tspan x="600">역할이 섞인 설계와 분리된 설계</tspan></text>
  <text x="600" y="72" text-anchor="middle" class="ko subtitle"><tspan x="600">테이블 분리의 목적은 데이터 소유자와 변경 이유를 구분하는 것입니다.</tspan></text>
  <rect x="55" y="110" width="475" height="420" class="box bad"/><text x="292" y="145" text-anchor="middle" class="ko head"><tspan x="292">역할이 섞인 설계</tspan></text>
  <rect x="95" y="175" width="395" height="170" class="box meta"/>
  <text x="292" y="226" text-anchor="middle" class="ko head"><tspan x="292">ai_bad_enrollments</tspan><tspan x="292" dy="26">학생 · 강의 · 강사 · 신청 · 결제</tspan><tspan x="292" dy="26">모든 값 TEXT · 평문 민감정보 형태</tspan></text>
  <rect x="95" y="380" width="395" height="100" class="box bad"/><text x="292" y="419" text-anchor="middle" class="ko body"><tspan x="292">반복 · 타입 검증 부족</tspan><tspan x="292" dy="22">FK 없음 · 민감정보 위험 · 역할 혼합</tspan></text>
  <rect x="670" y="110" width="475" height="420" class="box ok"/><text x="907" y="145" text-anchor="middle" class="ko head"><tspan x="907">역할별 분리</tspan></text>
  <rect x="705" y="175" width="180" height="55" class="box meta"/><text x="795" y="208" text-anchor="middle" class="mono head"><tspan x="795">students</tspan></text>
  <rect x="915" y="175" width="180" height="55" class="box meta"/><text x="1005" y="208" text-anchor="middle" class="mono head"><tspan x="1005">instructors</tspan></text>
  <rect x="810" y="260" width="180" height="55" class="box meta"/><text x="900" y="293" text-anchor="middle" class="mono head"><tspan x="900">courses</tspan></text>
  <rect x="705" y="350" width="180" height="55" class="box meta"/><text x="795" y="383" text-anchor="middle" class="mono head"><tspan x="795">enrollments</tspan></text>
  <rect x="915" y="350" width="180" height="55" class="box meta"/><text x="1005" y="383" text-anchor="middle" class="mono head"><tspan x="1005">payments</tspan></text>
  <line x1="795" y1="230" x2="810" y2="260" class="line" marker-end="url(#arrow)"/><line x1="1005" y1="230" x2="900" y2="260" class="line" marker-end="url(#arrow)"/><line x1="900" y1="315" x2="795" y2="350" class="line" marker-end="url(#arrow)"/><line x1="900" y1="315" x2="1005" y2="350" class="line" marker-end="url(#arrow)"/>
  <rect x="705" y="445" width="390" height="55" class="box req"/><text x="900" y="466" text-anchor="middle" class="ko body"><tspan x="900">PK·FK · 상태 CHECK · course_code</tspan><tspan x="900" dy="20">신청 시점 금액 · payment_reference</tspan></text>
  <line x1="530" y1="320" x2="670" y2="320" class="line" marker-end="url(#arrow)"/><text x="600" y="300" text-anchor="middle" class="ko small"><tspan x="600">역할과 관계 재설계</tspan></text>
  <rect x="250" y="570" width="700" height="55" class="box human"/><text x="600" y="603" text-anchor="middle" class="ko head"><tspan x="600">테이블 수가 아니라 각 데이터의 소유자와 변경 이유를 분리</tspan></text>
  <line x1="600" y1="530" x2="600" y2="570" class="line" marker-end="url(#arrow)"/>
</svg>
