<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">예상 설계와 실제 메타데이터 비교</title>
  <desc id="desc">예상 테이블, 외래키와 제약조건을 실습 DB의 information_schema와 pg_indexes 결과와 비교하고 불일치 시 DDL을 수정해 재생성하는 흐름</desc>
  <style>
    .ko { font-family: "NanumSquare", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", "UnDotum", Arial, sans-serif; fill: #1f2937; }
    .mono { font-family: "Noto Sans Mono CJK KR", "NanumSquare", Consolas, D2Coding, "Courier New", monospace; fill: #1f2937; }
    .title { font-size: 28px; font-weight: 700; }.subtitle { font-size: 14px; fill: #4b5563; }.head { font-size: 17px; font-weight: 700; }.body { font-size: 14px; }.small { font-size: 12px; fill: #475569; }
    .box { stroke: #64748b; stroke-width: 1.8; rx: 14; ry: 14; }.req { fill: #eaf3ff; }.human { fill: #fff6d8; }.codex { fill: #fff0dc; }.ok { fill: #eaf8ee; }.bad { fill: #ffeaea; }.meta { fill: #f1f5f9; }.line { stroke: #475569; stroke-width: 2; fill: none; }.loop { stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
  <rect x="0" y="0" width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="45" text-anchor="middle" class="ko title"><tspan x="600">예상 설계와 실제 메타데이터 비교</tspan></text>
  <text x="600" y="72" text-anchor="middle" class="ko subtitle"><tspan x="600">SQL 파일만 읽지 말고 실제로 생성된 구조를 확인합니다.</tspan></text>
  <rect x="80" y="120" width="300" height="160" class="box req"/>
  <text x="230" y="161" text-anchor="middle" class="ko head"><tspan x="230">예상 설계</tspan><tspan x="230" dy="22">테이블 6개 · 좋은 설계 5개</tspan><tspan x="230" dy="22">FK 4개 · CHECK · UNIQUE</tspan><tspan x="230" dy="22">예상 컬럼 타입</tspan></text>
  <rect x="450" y="150" width="300" height="100" class="box codex"/><text x="600" y="206" text-anchor="middle" class="ko head"><tspan x="600">실습 DB 생성</tspan></text>
  <rect x="820" y="120" width="300" height="160" class="box meta"/>
  <text x="970" y="161" text-anchor="middle" class="ko head"><tspan x="970">실제 메타데이터</tspan><tspan x="970" dy="22">tables · columns</tspan><tspan x="970" dy="22">constraints · CHECK · FK</tspan><tspan x="970" dy="22">pg_indexes</tspan></text>
  <line x1="380" y1="200" x2="450" y2="200" class="line" marker-end="url(#arrow)"/><line x1="750" y1="200" x2="820" y2="200" class="line" marker-end="url(#arrow)"/>
  <rect x="390" y="350" width="420" height="85" class="box human"/><text x="600" y="382" text-anchor="middle" class="ko head"><tspan x="600">예상과 실제가</tspan><tspan x="600" dy="22">일치하는가?</tspan></text>
  <line x1="970" y1="280" x2="710" y2="350" class="line" marker-end="url(#arrow)"/><line x1="230" y1="280" x2="490" y2="350" class="line" marker-end="url(#arrow)"/>
  <rect x="850" y="505" width="280" height="60" class="box ok"/><text x="990" y="540" text-anchor="middle" class="ko body"><tspan x="990">일치 → 메타데이터 증거 기록</tspan></text>
  <line x1="810" y1="392" x2="850" y2="535" class="line" marker-end="url(#arrow)"/><text x="835" y="450" text-anchor="middle" class="ko small"><tspan x="835">일치</tspan></text>
  <rect x="70" y="495" width="280" height="75" class="box bad"/><text x="210" y="525" text-anchor="middle" class="ko body"><tspan x="210">불일치 → DDL 수정</tspan><tspan x="210" dy="22">DB 초기화·재생성</tspan></text>
  <line x1="390" y1="392" x2="350" y2="532" class="line" marker-end="url(#arrow)"/><text x="365" y="450" text-anchor="middle" class="ko small"><tspan x="365">불일치</tspan></text>
  <path d="M 210 495 C 210 360, 500 290, 600 250" class="loop" marker-end="url(#arrow)"/><text x="350" y="330" text-anchor="middle" class="ko small"><tspan x="350">재생성 후 다시 확인</tspan></text>
  <rect x="320" y="630" width="560" height="45" class="box human"/><text x="600" y="657" text-anchor="middle" class="ko head"><tspan x="600">테이블 존재만으로 설계 검증을 통과시키지 않음</tspan></text>
  <line x1="600" y1="435" x2="600" y2="630" class="line" marker-end="url(#arrow)"/>
</svg>
