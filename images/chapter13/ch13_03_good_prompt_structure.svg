<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">실행 가능한 DB 작업 프롬프트의 구성</title>
  <desc id="desc">배경과 목표, 확인된 요구사항, 미확정 규칙, 파일 범위, 출력 형식과 검증 기준이 검토 가능한 초안과 재현 가능한 결과로 이어지는 구조</desc>
  <style>
    .ko { font-family: "NanumSquare", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", "UnDotum", Arial, sans-serif; fill: #1f2937; }
    .mono { font-family: "Noto Sans Mono CJK KR", "NanumSquare", Consolas, D2Coding, "Courier New", monospace; fill: #1f2937; }
    .title { font-size: 28px; font-weight: 700; }.subtitle { font-size: 14px; fill: #4b5563; }.head { font-size: 17px; font-weight: 700; }.body { font-size: 14px; }.small { font-size: 12px; fill: #475569; }
    .box { stroke: #64748b; stroke-width: 1.8; rx: 14; ry: 14; }.req { fill: #eaf3ff; }.ai { fill: #f3edff; }.human { fill: #fff6d8; }.codex { fill: #fff0dc; }.ok { fill: #eaf8ee; }.meta { fill: #f1f5f9; }.line { stroke: #475569; stroke-width: 2; fill: none; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
  <rect x="0" y="0" width="1200" height="620" fill="#ffffff"/>
  <text x="600" y="45" text-anchor="middle" class="ko title"><tspan x="600">실행 가능한 DB 작업 프롬프트의 구성</tspan></text>
  <text x="600" y="72" text-anchor="middle" class="ko subtitle"><tspan x="600">요청 범위와 완료 기준이 명확해야 결과를 검토할 수 있습니다.</tspan></text>
  <rect x="65" y="125" width="330" height="72" class="box req"/><text x="230" y="166" text-anchor="middle" class="ko head"><tspan x="230">배경과 목표</tspan></text>
  <rect x="435" y="125" width="330" height="72" class="box req"/><text x="600" y="166" text-anchor="middle" class="ko head"><tspan x="600">확인된 요구사항</tspan></text>
  <rect x="805" y="125" width="330" height="72" class="box human"/><text x="970" y="166" text-anchor="middle" class="ko head"><tspan x="970">미확정 규칙</tspan></text>
  <rect x="65" y="250" width="330" height="72" class="box codex"/><text x="230" y="291" text-anchor="middle" class="ko head"><tspan x="230">수정 대상·금지 범위</tspan></text>
  <rect x="435" y="250" width="330" height="72" class="box meta"/><text x="600" y="291" text-anchor="middle" class="ko head"><tspan x="600">출력 형식</tspan></text>
  <rect x="805" y="250" width="330" height="72" class="box ok"/><text x="970" y="291" text-anchor="middle" class="ko head"><tspan x="970">검증·완료 기준</tspan></text>
  <rect x="370" y="390" width="460" height="70" class="box ai"/><text x="600" y="431" text-anchor="middle" class="ko head"><tspan x="600">명확한 DB 작업 요청</tspan></text>
  <line x1="230" y1="197" x2="600" y2="390" class="line" marker-end="url(#arrow)"/><line x1="600" y1="197" x2="600" y2="390" class="line" marker-end="url(#arrow)"/><line x1="970" y1="197" x2="600" y2="390" class="line" marker-end="url(#arrow)"/>
  <line x1="230" y1="322" x2="600" y2="390" class="line" marker-end="url(#arrow)"/><line x1="600" y1="322" x2="600" y2="390" class="line" marker-end="url(#arrow)"/><line x1="970" y1="322" x2="600" y2="390" class="line" marker-end="url(#arrow)"/>
  <rect x="165" y="510" width="360" height="65" class="box human"/><text x="345" y="548" text-anchor="middle" class="ko head"><tspan x="345">검토 가능한 초안</tspan></text>
  <rect x="675" y="510" width="360" height="65" class="box ok"/><text x="855" y="548" text-anchor="middle" class="ko head"><tspan x="855">재현 가능한 결과</tspan></text>
  <line x1="490" y1="460" x2="345" y2="510" class="line" marker-end="url(#arrow)"/><line x1="710" y1="460" x2="855" y2="510" class="line" marker-end="url(#arrow)"/>
  <text x="600" y="605" text-anchor="middle" class="mono small"><tspan x="600">PostgreSQL · Chapter 13 SQL 파일 · FK 4개 · JOIN 4행 · 다른 Chapter 수정 금지</tspan></text>
</svg>
