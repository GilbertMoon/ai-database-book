<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">업무 규칙을 제약조건과 테스트로 검증하기</title>
  <desc id="desc">확인된 업무 규칙을 데이터베이스 제약조건으로 반영하고 정상·오류 입력과 메타데이터를 통해 의도한 차단 여부를 검증하는 흐름</desc>
  <style>
    .ko { font-family: "NanumSquare", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", "UnDotum", Arial, sans-serif; fill: #1f2937; }
    .mono { font-family: "Noto Sans Mono CJK KR", "NanumSquare", Consolas, D2Coding, "Courier New", monospace; fill: #1f2937; }
    .title { font-size: 28px; font-weight: 700; }.subtitle { font-size: 14px; fill: #4b5563; }.head { font-size: 17px; font-weight: 700; }.body { font-size: 14px; }.small { font-size: 12px; fill: #475569; }
    .box { stroke: #64748b; stroke-width: 1.8; rx: 14; ry: 14; }.req { fill: #eaf3ff; }.ai { fill: #f3edff; }.human { fill: #fff6d8; }.ok { fill: #eaf8ee; }.bad { fill: #ffeaea; }.meta { fill: #f1f5f9; }.line { stroke: #475569; stroke-width: 2; fill: none; }.loop { stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
  <rect x="0" y="0" width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="45" text-anchor="middle" class="ko title"><tspan x="600">업무 규칙을 제약조건과 테스트로 검증하기</tspan></text>
  <text x="600" y="72" text-anchor="middle" class="ko subtitle"><tspan x="600">제약조건은 확인된 요구사항을 구현할 때만 안전장치가 됩니다.</tspan></text>
  <rect x="390" y="105" width="420" height="60" class="box req"/><text x="600" y="141" text-anchor="middle" class="ko head"><tspan x="600">확인된 업무 규칙</tspan></text>
  <rect x="390" y="205" width="420" height="60" class="box human"/><text x="600" y="241" text-anchor="middle" class="ko head"><tspan x="600">DB 제약조건 선택</tspan></text>
  <line x1="600" y1="165" x2="600" y2="205" class="line" marker-end="url(#arrow)"/>
  <rect x="40" y="315" width="200" height="48" class="box meta"/><text x="140" y="344" text-anchor="middle" class="ko body"><tspan x="140">행 식별</tspan></text>
  <rect x="270" y="315" width="200" height="48" class="box meta"/><text x="370" y="344" text-anchor="middle" class="ko body"><tspan x="370">대상 참조</tspan></text>
  <rect x="500" y="315" width="200" height="48" class="box meta"/><text x="600" y="344" text-anchor="middle" class="ko body"><tspan x="600">필수값</tspan></text>
  <rect x="730" y="315" width="200" height="48" class="box meta"/><text x="830" y="344" text-anchor="middle" class="ko body"><tspan x="830">중복 금지</tspan></text>
  <rect x="960" y="315" width="200" height="48" class="box meta"/><text x="1060" y="344" text-anchor="middle" class="ko body"><tspan x="1060">값 범위·상태</tspan></text>
  <line x1="600" y1="265" x2="140" y2="315" class="line" marker-end="url(#arrow)"/><line x1="600" y1="265" x2="370" y2="315" class="line" marker-end="url(#arrow)"/><line x1="600" y1="265" x2="600" y2="315" class="line" marker-end="url(#arrow)"/><line x1="600" y1="265" x2="830" y2="315" class="line" marker-end="url(#arrow)"/><line x1="600" y1="265" x2="1060" y2="315" class="line" marker-end="url(#arrow)"/>
  <rect x="40" y="375" width="200" height="48" class="box ai"/><text x="140" y="404" text-anchor="middle" class="mono head"><tspan x="140">PRIMARY KEY</tspan></text>
  <rect x="270" y="375" width="200" height="48" class="box ai"/><text x="370" y="404" text-anchor="middle" class="mono head"><tspan x="370">FOREIGN KEY</tspan></text>
  <rect x="500" y="375" width="200" height="48" class="box ai"/><text x="600" y="404" text-anchor="middle" class="mono head"><tspan x="600">NOT NULL</tspan></text>
  <rect x="730" y="375" width="200" height="48" class="box ai"/><text x="830" y="404" text-anchor="middle" class="mono head"><tspan x="830">UNIQUE</tspan></text>
  <rect x="960" y="375" width="200" height="48" class="box ai"/><text x="1060" y="404" text-anchor="middle" class="mono head"><tspan x="1060">CHECK</tspan></text>
  <rect x="40" y="435" width="200" height="48" class="box bad"/><text x="140" y="464" text-anchor="middle" class="ko body"><tspan x="140">중복 PK</tspan></text>
  <rect x="270" y="435" width="200" height="48" class="box bad"/><text x="370" y="464" text-anchor="middle" class="ko body"><tspan x="370">없는 학생</tspan></text>
  <rect x="500" y="435" width="200" height="48" class="box bad"/><text x="600" y="464" text-anchor="middle" class="ko body"><tspan x="600">NULL 입력</tspan></text>
  <rect x="730" y="435" width="200" height="48" class="box bad"/><text x="830" y="464" text-anchor="middle" class="ko body"><tspan x="830">중복 이메일</tspan></text>
  <rect x="960" y="435" width="200" height="48" class="box bad"/><text x="1060" y="464" text-anchor="middle" class="ko body"><tspan x="1060">음수·잘못된 상태</tspan></text>
  <line x1="140" y1="363" x2="140" y2="375" class="line" marker-end="url(#arrow)"/><line x1="370" y1="363" x2="370" y2="375" class="line" marker-end="url(#arrow)"/><line x1="600" y1="363" x2="600" y2="375" class="line" marker-end="url(#arrow)"/><line x1="830" y1="363" x2="830" y2="375" class="line" marker-end="url(#arrow)"/><line x1="1060" y1="363" x2="1060" y2="375" class="line" marker-end="url(#arrow)"/>
  <line x1="140" y1="423" x2="140" y2="435" class="line" marker-end="url(#arrow)"/><line x1="370" y1="423" x2="370" y2="435" class="line" marker-end="url(#arrow)"/><line x1="600" y1="423" x2="600" y2="435" class="line" marker-end="url(#arrow)"/><line x1="830" y1="423" x2="830" y2="435" class="line" marker-end="url(#arrow)"/><line x1="1060" y1="423" x2="1060" y2="435" class="line" marker-end="url(#arrow)"/>
  <rect x="390" y="540" width="420" height="80" class="box human"/><text x="600" y="570" text-anchor="middle" class="ko head"><tspan x="600">오류 입력을 DB가</tspan><tspan x="600" dy="22">의도한 제약조건으로 차단하는가?</tspan></text>
  <line x1="140" y1="483" x2="600" y2="540" class="line" marker-end="url(#arrow)"/><line x1="370" y1="483" x2="600" y2="540" class="line" marker-end="url(#arrow)"/><line x1="600" y1="483" x2="600" y2="540" class="line" marker-end="url(#arrow)"/><line x1="830" y1="483" x2="600" y2="540" class="line" marker-end="url(#arrow)"/><line x1="1060" y1="483" x2="600" y2="540" class="line" marker-end="url(#arrow)"/>
  <rect x="850" y="645" width="280" height="45" class="box ok"/><text x="990" y="672" text-anchor="middle" class="ko body"><tspan x="990">예 → 메타데이터 증거 기록</tspan></text>
  <line x1="810" y1="580" x2="850" y2="667" class="line" marker-end="url(#arrow)"/><text x="835" y="610" text-anchor="middle" class="ko small"><tspan x="835">예</tspan></text>
  <rect x="70" y="640" width="280" height="55" class="box bad"/><text x="210" y="672" text-anchor="middle" class="ko body"><tspan x="210">아니요 → 요구사항·DDL 수정</tspan></text>
  <line x1="390" y1="580" x2="350" y2="667" class="line" marker-end="url(#arrow)"/><text x="365" y="610" text-anchor="middle" class="ko small"><tspan x="365">아니요</tspan></text>
  <path d="M 210 640 C 210 525, 310 235, 390 235" class="loop" marker-end="url(#arrow)"/><text x="250" y="505" text-anchor="middle" class="ko small"><tspan x="250">수정 후 재검증</tspan></text>
</svg>
