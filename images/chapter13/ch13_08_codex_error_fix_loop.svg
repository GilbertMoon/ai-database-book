<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Codex 변경·검증·재수정 루프</title>
  <desc id="desc">오류 재현과 민감정보 제거, 수정 범위 지정, Codex 최소 변경, 사람의 diff 검토와 재실행을 반복해 최종 승인하는 흐름</desc>
  <style>
    .ko { font-family: "NanumSquare", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", "UnDotum", Arial, sans-serif; fill: #1f2937; }
    .mono { font-family: "Noto Sans Mono CJK KR", "NanumSquare", Consolas, D2Coding, "Courier New", monospace; fill: #1f2937; }
    .title { font-size: 28px; font-weight: 700; }.subtitle { font-size: 14px; fill: #4b5563; }.head { font-size: 17px; font-weight: 700; }.body { font-size: 14px; }.small { font-size: 12px; fill: #475569; }
    .box { stroke: #64748b; stroke-width: 1.8; rx: 14; ry: 14; }.req { fill: #eaf3ff; }.ai { fill: #f3edff; }.human { fill: #fff6d8; }.codex { fill: #fff0dc; }.ok { fill: #eaf8ee; }.bad { fill: #ffeaea; }.meta { fill: #f1f5f9; }.line { stroke: #475569; stroke-width: 2; fill: none; }.loop { stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
  <rect x="0" y="0" width="1200" height="780" fill="#ffffff"/>
  <text x="600" y="45" text-anchor="middle" class="ko title"><tspan x="600">Codex 변경·검증·재수정 루프</tspan></text>
  <text x="600" y="72" text-anchor="middle" class="ko subtitle"><tspan x="600">오류 없음만 보지 않고 변경 범위와 실행 증거를 함께 확인합니다.</tspan></text>
  <rect x="370" y="105" width="460" height="55" class="box req"/><text x="600" y="138" text-anchor="middle" class="ko head"><tspan x="600">1. 오류 재현과 기대 결과</tspan></text>
  <rect x="370" y="185" width="460" height="55" class="box human"/><text x="600" y="218" text-anchor="middle" class="ko head"><tspan x="600">2. 비밀정보를 제거한 오류 전달</tspan></text>
  <rect x="370" y="265" width="460" height="55" class="box codex"/><text x="600" y="298" text-anchor="middle" class="ko head"><tspan x="600">3. 수정 파일과 금지 범위 지정</tspan></text>
  <rect x="370" y="345" width="460" height="55" class="box ai"/><text x="600" y="378" text-anchor="middle" class="ko head"><tspan x="600">4. Codex의 최소 변경</tspan></text>
  <rect x="370" y="425" width="460" height="55" class="box human"/><text x="600" y="458" text-anchor="middle" class="mono head"><tspan x="600">5. 사람이 파일별 diff 검토</tspan></text>
  <rect x="370" y="505" width="460" height="55" class="box meta"/><text x="600" y="538" text-anchor="middle" class="ko head"><tspan x="600">6. 같은 조건으로 재실행</tspan></text>
  <line x1="600" y1="160" x2="600" y2="185" class="line" marker-end="url(#arrow)"/><line x1="600" y1="240" x2="600" y2="265" class="line" marker-end="url(#arrow)"/><line x1="600" y1="320" x2="600" y2="345" class="line" marker-end="url(#arrow)"/><line x1="600" y1="400" x2="600" y2="425" class="line" marker-end="url(#arrow)"/><line x1="600" y1="480" x2="600" y2="505" class="line" marker-end="url(#arrow)"/>
  <rect x="370" y="595" width="460" height="80" class="box human"/><text x="600" y="625" text-anchor="middle" class="ko head"><tspan x="600">행 수·메타데이터·업무 결과가</tspan><tspan x="600" dy="22">일치하는가?</tspan></text>
  <line x1="600" y1="560" x2="600" y2="595" class="line" marker-end="url(#arrow)"/>
  <rect x="850" y="705" width="280" height="48" class="box ok"/><text x="990" y="734" text-anchor="middle" class="ko body"><tspan x="990">예 → 이유·증거 기록 후 사람 승인</tspan></text>
  <line x1="830" y1="635" x2="850" y2="729" class="line" marker-end="url(#arrow)"/><text x="835" y="675" text-anchor="middle" class="ko small"><tspan x="835">예</tspan></text>
  <rect x="70" y="695" width="260" height="60" class="box bad"/><text x="200" y="730" text-anchor="middle" class="ko body"><tspan x="200">아니요 → 원인·프롬프트 수정</tspan></text>
  <line x1="370" y1="635" x2="330" y2="725" class="line" marker-end="url(#arrow)"/><text x="350" y="675" text-anchor="middle" class="ko small"><tspan x="350">아니요</tspan></text>
  <path d="M 200 695 C 200 515, 280 375, 370 372" class="loop" marker-end="url(#arrow)"/><text x="260" y="510" text-anchor="middle" class="ko small"><tspan x="260">다시 최소 변경</tspan></text>
</svg>
