<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">ChatGPT·Codex·사람의 협업 흐름</title>
  <desc id="desc">ChatGPT와 Codex의 기능은 일부 겹칠 수 있으며 작업 단계에 따라 주 역할을 나누고 사람이 정책과 최종 승인을 책임지는 구조</desc>
  <style>
    .ko { font-family: "NanumSquare", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", "UnDotum", Arial, sans-serif; fill: #1f2937; }
    .mono { font-family: "Noto Sans Mono CJK KR", "NanumSquare", Consolas, D2Coding, "Courier New", monospace; fill: #1f2937; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #4b5563; }
    .head { font-size: 17px; font-weight: 700; }
    .body { font-size: 14px; }
    .small { font-size: 12px; fill: #475569; }
    .box { stroke: #64748b; stroke-width: 1.8; rx: 14; ry: 14; }
    .req { fill: #eaf3ff; }
    .ai { fill: #f3edff; }
    .human { fill: #fff6d8; }
    .codex { fill: #fff0dc; }
    .ok { fill: #eaf8ee; }
    .meta { fill: #f1f5f9; }
    .line { stroke: #475569; stroke-width: 2; fill: none; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
  <rect x="0" y="0" width="1200" height="650" fill="#ffffff"/>
  <text x="600" y="45" text-anchor="middle" class="ko title"><tspan x="600">ChatGPT·Codex·사람의 협업 흐름</tspan></text>
  <text x="600" y="72" text-anchor="middle" class="ko subtitle"><tspan x="600">절대적인 기능 경계가 아니라 검토 작업을 위한 권장 흐름입니다.</tspan></text>
  <rect x="55" y="120" width="330" height="330" class="box ai"/>
  <text x="220" y="155" text-anchor="middle" class="ko head"><tspan x="220">ChatGPT 중심 작업</tspan></text>
  <rect x="85" y="190" width="270" height="46" class="box meta"/><text x="220" y="218" text-anchor="middle" class="ko body"><tspan x="220">요구사항 대화</tspan></text>
  <rect x="85" y="255" width="270" height="46" class="box meta"/><text x="220" y="283" text-anchor="middle" class="ko body"><tspan x="220">설계 대안 비교</tspan></text>
  <rect x="85" y="320" width="270" height="46" class="box meta"/><text x="220" y="348" text-anchor="middle" class="ko body"><tspan x="220">검토 기준 정리</tspan></text>
  <rect x="85" y="385" width="270" height="46" class="box meta"/><text x="220" y="413" text-anchor="middle" class="ko body"><tspan x="220">설명·보고서 초안</tspan></text>
  <rect x="435" y="120" width="330" height="330" class="box codex"/>
  <text x="600" y="155" text-anchor="middle" class="ko head"><tspan x="600">Codex 중심 작업</tspan></text>
  <rect x="465" y="190" width="270" height="46" class="box meta"/><text x="600" y="218" text-anchor="middle" class="ko body"><tspan x="600">저장소 파일 확인</tspan></text>
  <rect x="465" y="255" width="270" height="46" class="box meta"/><text x="600" y="283" text-anchor="middle" class="mono body"><tspan x="600">SQL 파일 생성·수정</tspan></text>
  <rect x="465" y="320" width="270" height="46" class="box meta"/><text x="600" y="348" text-anchor="middle" class="ko body"><tspan x="600">오류 재현·명령 실행</tspan></text>
  <rect x="465" y="385" width="270" height="46" class="box meta"/><text x="600" y="413" text-anchor="middle" class="mono body"><tspan x="600">테스트·diff 확인</tspan></text>
  <rect x="815" y="120" width="330" height="330" class="box human"/>
  <text x="980" y="155" text-anchor="middle" class="ko head"><tspan x="980">사람의 책임</tspan></text>
  <rect x="845" y="190" width="270" height="46" class="box meta"/><text x="980" y="218" text-anchor="middle" class="ko body"><tspan x="980">업무 규칙 결정</tspan></text>
  <rect x="845" y="255" width="270" height="46" class="box meta"/><text x="980" y="283" text-anchor="middle" class="ko body"><tspan x="980">접근 범위·권한 결정</tspan></text>
  <rect x="845" y="320" width="270" height="46" class="box meta"/><text x="980" y="348" text-anchor="middle" class="ko body"><tspan x="980">비밀정보·위험 검토</tspan></text>
  <rect x="845" y="385" width="270" height="46" class="box meta"/><text x="980" y="413" text-anchor="middle" class="ko body"><tspan x="980">변경 검토·최종 승인</tspan></text>
  <rect x="280" y="500" width="640" height="65" class="box req"/>
  <text x="600" y="523" text-anchor="middle" class="ko head"><tspan x="600">기능은 일부 겹칠 수 있음</tspan><tspan x="600" dy="22">작업 단계에 따라 주 역할을 구분</tspan></text>
  <line x1="220" y1="450" x2="400" y2="500" class="line" marker-end="url(#arrow)"/><line x1="600" y1="450" x2="600" y2="500" class="line" marker-end="url(#arrow)"/><line x1="980" y1="450" x2="800" y2="500" class="line" marker-end="url(#arrow)"/>
  <rect x="370" y="590" width="460" height="42" class="box ok"/><text x="600" y="616" text-anchor="middle" class="ko head"><tspan x="600">최종 판단과 승인 책임은 사람에게 있음</tspan></text>
  <line x1="600" y1="565" x2="600" y2="590" class="line" marker-end="url(#arrow)"/>
</svg>
