<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc"><title id="title">오류 메시지 해결 흐름</title><desc id="desc">오류 발생 시 작업과 증거를 수집하고 연결, 인증, 데이터베이스와 스키마, SQL과 제약조건, 도구 환경으로 분류한 뒤 한 번에 한 가지를 변경해 재검증하고 해결 과정을 기록하는 흐름</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}.t{font-size:28px;font-weight:700;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.step{fill:#fff;stroke-width:1.6;rx:11}.blue{fill:#eef5ff;stroke:#3b82c4}.orange{fill:#fff8e8;stroke:#d69e2e}.green{fill:#f2fbf5;stroke:#3c9a5f}.purple{fill:#f5f1ff;stroke:#7c5cc4}.red{fill:#fff5f5;stroke:#d9534f}.gray{fill:#f8fafc;stroke:#64748b}.h{font-size:15px;font-weight:700;text-anchor:middle}.m{font-size:11.7px;text-anchor:middle;fill:#475569}.panel{fill:#f8fafc;stroke:#a8b3c4;stroke-width:1.5;rx:15}.pt{font-size:18px;font-weight:700}.card{fill:#fff;stroke-width:1.4;rx:10}.ch{font-size:13.5px;font-weight:700;text-anchor:middle}.cm{font-size:10.9px;text-anchor:middle;fill:#475569}.decision{fill:#fff8e8;stroke:#b7791f;stroke-width:1.8}.dt{font-size:14px;font-weight:700;text-anchor:middle}.arr{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.back{stroke:#d9534f;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#a)}.note{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.4;rx:10}.nt{font-size:11.8px;font-weight:700;text-anchor:middle;fill:#92400e}.core{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.6;rx:10}.cv{font-size:15px;font-weight:700;text-anchor:middle;fill:#166534}</style></defs><rect width="1200" height="1040" fill="#fff"/><text x="600" y="40" class="t">오류 메시지 해결 흐름</text><text x="600" y="68" class="s">증거를 모으고 오류 계층을 분류한 뒤 한 번에 한 가지를 바꾸며 같은 단계로 다시 검증한다</text><rect x="70" y="100" width="300" height="86" class="step red"/><text x="220" y="129" class="h">1. 오류 발생</text><text x="220" y="155" class="m">하려던 작업과 실행한 SQL·버튼·발생 시점 정리</text><rect x="450" y="100" width="300" height="86" class="step orange"/><text x="600" y="129" class="h">2. 전체 오류 메시지 수집</text><text x="600" y="155" class="m">첫 줄만이 아니라 원인·상세·대상 객체까지 보존</text><rect x="830" y="100" width="300" height="86" class="step blue"/><text x="980" y="129" class="h">3. 환경과 현재 상태 확인</text><text x="980" y="155" class="m">OS·서버 위치·연결·현재 DB·스키마·서비스 상태</text><path d="M370 143H450" class="arr"/><path d="M750 143H830" class="arr"/><rect x="35" y="220" width="1130" height="310" class="panel"/><text x="60" y="252" class="pt">4. 오류 계층 분류</text><rect x="55" y="286" width="205" height="180" class="card blue"/><text x="157" y="317" class="ch">연결·네트워크</text><text x="157" y="346" class="cm">connection refused · timeout</text><text x="157" y="371" class="cm">서버 실행 · Host · Port</text><text x="157" y="392" class="cm">방화벽 · IP 허용 · 인터넷</text><text x="157" y="428" class="cm">서버까지 도달 가능한지 확인</text><rect x="280" y="286" width="205" height="180" class="card red"/><text x="382" y="317" class="ch">인증·권한</text><text x="382" y="346" class="cm">authentication failed</text><text x="382" y="371" class="cm">Username · Password · 권한</text><text x="382" y="392" class="cm">Caps Lock · 비밀번호 변경</text><text x="382" y="428" class="cm">접속은 되지만 인증 가능한지 확인</text><rect x="505" y="286" width="205" height="180" class="card orange"/><text x="607" y="317" class="ch">DB·스키마·객체</text><text x="607" y="346" class="cm">database/relation does not exist</text><text x="607" y="371" class="cm">DB 이름 · current_database</text><text x="607" y="392" class="cm">schema · Navigator 새로고침</text><text x="607" y="428" class="cm">올바른 위치에서 찾는지 확인</text><rect x="730" y="286" width="205" height="180" class="card green"/><text x="832" y="317" class="ch">SQL·데이터 규칙</text><text x="832" y="346" class="cm">syntax · already exists</text><text x="832" y="371" class="cm">UNIQUE · FK · NOT NULL</text><text x="832" y="392" class="cm">문법 · 순서 · 기존 값</text><text x="832" y="428" class="cm">예상 오류인지도 함께 판단</text><rect x="955" y="286" width="190" height="180" class="card purple"/><text x="1050" y="317" class="ch">도구·명령 환경</text><text x="1050" y="346" class="cm">psql not recognized</text><text x="1050" y="371" class="cm">JDBC driver 오류</text><text x="1050" y="392" class="cm">PATH · 설치 경로 · 드라이버</text><text x="1050" y="428" class="cm">DBeaver 연결 여부와 분리 판단</text><path d="M980 186V220H600" class="arr"/><rect x="70" y="560" width="270" height="82" class="step gray"/><text x="205" y="589" class="h">5. 원인 가설 정렬</text><text x="205" y="615" class="m">가능성이 높은 원인과 확인 방법부터 작성</text><rect x="465" y="560" width="270" height="82" class="step orange"/><text x="600" y="589" class="h">6. 한 번에 하나만 변경</text><text x="600" y="615" class="m">설정·연결값·SQL 중 한 항목만 수정</text><rect x="860" y="560" width="270" height="82" class="step blue"/><text x="995" y="589" class="h">7. 같은 단계로 재실행</text><text x="995" y="615" class="m">성공 여부·메시지 변화·새 부작용 확인</text><path d="M600 530V545H205V560" class="arr"/><path d="M340 601H465" class="arr"/><path d="M735 601H860" class="arr"/><polygon points="600,680 740,725 600,770 460,725" class="decision"/><text x="600" y="720" class="dt">원래 작업이 예상대로 완료되었는가?</text><text x="600" y="744" class="m">오류가 사라진 것뿐 아니라 목표 결과까지 확인</text><path d="M995 642V680H600" class="arr"/><rect x="65" y="800" width="490" height="92" class="step red"/><text x="310" y="829" class="h">아니요 · 새 증거로 다시 분류</text><text x="310" y="855" class="m">메시지가 달라졌다면 오류 계층을 다시 판단</text><text x="310" y="875" class="m">변화가 없으면 환경·목표·전체 오류·재현 단계를 포함해 도움 요청</text><rect x="645" y="800" width="490" height="92" class="step green"/><text x="890" y="829" class="h">예 · 해결 방법과 근거 기록</text><text x="890" y="855" class="m">원인 · 변경한 한 가지 · 검증 결과 · 되돌리는 방법</text><text x="890" y="875" class="m">같은 환경에서 한 번 더 재현 확인</text><path d="M460 725H310V800" class="back"/><path d="M740 725H890V800" class="arr"/><path d="M65 846H20V376H55" class="back"/><rect x="55" y="918" width="350" height="58" class="note"/><text x="230" y="942" class="nt">삭제·초기화·설정 덮어쓰기 전 대상·백업·복구 방법 확인</text><text x="230" y="962" class="m">이해하지 못한 명령은 바로 실행하지 않음</text><rect x="425" y="918" width="350" height="58" class="note"/><text x="600" y="942" class="nt">AI 질문에서 비밀번호·전체 접속 문자열·API Key 제거</text><text x="600" y="962" class="m">필요한 환경 정보만 익명화해 제공</text><rect x="795" y="918" width="350" height="58" class="note"/><text x="970" y="942" class="nt">예상한 UNIQUE·FK 오류는 정상 검증 결과일 수 있음</text><text x="970" y="962" class="m">작업 목표와 예상 결과를 기준으로 해석</text><rect x="130" y="995" width="940" height="28" class="core"/><text x="600" y="1014" class="cv">증거 수집 → 계층 분류 → 한 가지 변경 → 같은 단계 재검증 순서로 문제를 좁힌다</text></svg>