<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc"><title id="title">setup_check.sql 실행 흐름</title><desc id="desc">setup_check.sql을 처음 실행하거나 재실행할 때 현재 데이터베이스와 기존 students 테이블 상태를 확인하고, 연결 확인, 테이블 생성, 샘플 데이터 조회와 선택적인 UNIQUE 오류 실습을 검증하는 흐름</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}.t{font-size:28px;font-weight:700;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.step{fill:#fff;stroke-width:1.6;rx:11}.blue{fill:#eef5ff;stroke:#3b82c4}.green{fill:#f2fbf5;stroke:#3c9a5f}.orange{fill:#fff8e8;stroke:#d69e2e}.purple{fill:#f5f1ff;stroke:#7c5cc4}.red{fill:#fff5f5;stroke:#d9534f}.h{font-size:15px;font-weight:700;text-anchor:middle}.m{font-size:11.8px;text-anchor:middle;fill:#475569}.panel{fill:#f8fafc;stroke:#a8b3c4;stroke-width:1.5;rx:15}.pt{font-size:18px;font-weight:700}.sql{fill:#fff;stroke:#64748b;stroke-width:1.4;rx:10}.sqlt{font-family:Consolas,D2Coding,monospace;font-size:13.5px;text-anchor:middle;fill:#334155}.result{fill:#fff;stroke-width:1.4;rx:10}.rh{font-size:13.5px;font-weight:700;text-anchor:middle}.rm{font-size:11.3px;text-anchor:middle;fill:#475569}.decision{fill:#fff8e8;stroke:#b7791f;stroke-width:1.8}.dt{font-size:14px;font-weight:700;text-anchor:middle}.arr{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.back{stroke:#d9534f;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#a)}.note{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.4;rx:10}.nt{font-size:12px;font-weight:700;text-anchor:middle;fill:#92400e}.core{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.6;rx:10}.cv{font-size:15px;font-weight:700;text-anchor:middle;fill:#166534}</style></defs><rect width="1200" height="1040" fill="#fff"/><text x="600" y="40" class="t">setup_check.sql 실행 흐름</text><text x="600" y="68" class="s">파일을 다시 실행하기 전 현재 데이터베이스와 기존 테이블·데이터 상태부터 확인한다</text><rect x="120" y="100" width="410" height="72" class="step blue"/><text x="325" y="128" class="h">1. setup_check.sql 열기</text><text x="325" y="151" class="m">code/chapter03/setup_check.sql</text><rect x="670" y="100" width="410" height="72" class="step purple"/><text x="875" y="128" class="h">2. 실행 연결 확인</text><text x="875" y="151" class="m">현재 DB가 ai_database_book인지 확인</text><path d="M530 136H670" class="arr"/><polygon points="600,205 735,245 600,285 465,245" class="decision"/><text x="600" y="240" class="dt">현재 students 테이블이 존재하는가?</text><text x="600" y="262" class="m">첫 실행인지 재실행인지 구분</text><path d="M875 172V205H600" class="arr"/><rect x="65" y="310" width="465" height="74" class="step green"/><text x="297" y="338" class="h">처음 실행 · 빈 환경</text><text x="297" y="362" class="m">기본 구간을 순서대로 실행</text><rect x="670" y="310" width="465" height="74" class="step orange"/><text x="902" y="338" class="h">재실행 · 기존 테이블 존재</text><text x="902" y="362" class="m">필요한 SELECT만 실행하거나 연습용 DB에서 의도적으로 초기화</text><path d="M465 245H297V310" class="arr"/><path d="M735 245H902V310" class="arr"/><rect x="35" y="420" width="1130" height="205" class="panel"/><text x="60" y="452" class="pt">기본 실행 구간</text><rect x="60" y="482" width="245" height="98" class="sql"/><text x="182" y="512" class="sqlt">SELECT version();</text><text x="182" y="540" class="rm">서버 응답과 버전 문자열 확인</text><rect x="335" y="482" width="245" height="98" class="sql"/><text x="457" y="512" class="sqlt">SELECT current_database();</text><text x="457" y="540" class="rm">ai_database_book 연결 확인</text><rect x="610" y="482" width="245" height="98" class="sql"/><text x="732" y="512" class="sqlt">SELECT 1 + 1 AS result;</text><text x="732" y="540" class="rm">결과 그리드에 2 표시 확인</text><rect x="885" y="482" width="245" height="98" class="result green"/><text x="1007" y="512" class="rh">환경 확인 통과</text><text x="1007" y="540" class="rm">서버·현재 DB·SQL 실행 정상</text><path d="M305 531H335" class="arr"/><path d="M580 531H610" class="arr"/><path d="M855 531H885" class="arr"/><path d="M297 384V420H182" class="arr"/><rect x="35" y="655" width="1130" height="210" class="panel"/><text x="60" y="687" class="pt">구조와 데이터 실습</text><rect x="60" y="717" width="245" height="102" class="sql"/><text x="182" y="747" class="sqlt">CREATE TABLE students</text><text x="182" y="775" class="rm">PK · NOT NULL · UNIQUE · DEFAULT</text><text x="182" y="797" class="rm">이미 존재하면 생성 오류 발생</text><rect x="335" y="717" width="245" height="102" class="sql"/><text x="457" y="747" class="sqlt">INSERT 샘플 3건</text><text x="457" y="775" class="rm">김민지 · 이준호 · 박서연</text><text x="457" y="797" class="rm">재실행하면 이메일 중복 가능</text><rect x="610" y="717" width="245" height="102" class="sql"/><text x="732" y="747" class="sqlt">SELECT * FROM students</text><text x="732" y="775" class="rm">행 3개와 입력값 확인</text><text x="732" y="797" class="rm">id·created_at 자동 생성 확인</text><rect x="885" y="717" width="245" height="102" class="result green"/><text x="1007" y="747" class="rh">예상 결과 검증</text><text x="1007" y="775" class="rm">행 수 · 값 · 테이블 구조 확인</text><text x="1007" y="797" class="rm">다르면 Error·기존 상태 점검</text><path d="M1007 580V655H182" class="arr"/><path d="M305 768H335" class="arr"/><path d="M580 768H610" class="arr"/><path d="M855 768H885" class="arr"/><rect x="100" y="890" width="440" height="66" class="step red"/><text x="320" y="916" class="h">선택 오류 실습</text><text x="320" y="940" class="m">주석 처리된 중복 이메일 INSERT 한 문장만 실행</text><rect x="660" y="890" width="440" height="66" class="step green"/><text x="880" y="916" class="h">예상 UNIQUE 오류 확인</text><text x="880" y="940" class="m">오류 발생·잘못된 행 미저장 = 제약조건 정상</text><path d="M1007 819V850H320V890" class="arr"/><path d="M540 923H660" class="arr"/><rect x="65" y="976" width="520" height="34" class="note"/><text x="325" y="997" class="nt">DROP TABLE은 데이터 삭제 작업이므로 개인 연습용 DB와 대상 테이블을 확인한 뒤 실행</text><rect x="615" y="976" width="520" height="34" class="note"/><text x="875" y="997" class="nt">예상한 UNIQUE 오류는 실패가 아니라 데이터 규칙이 작동한다는 검증 결과</text><rect x="140" y="1018" width="920" height="18" class="core"/><text x="600" y="1031" class="cv">각 구간의 예상 결과와 현재 DB 상태를 비교하며 실행해야 재현 가능한 실습이 된다</text></svg>