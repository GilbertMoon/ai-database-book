<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">setup_check.sql 실행과 재실행 흐름</title>
  <desc id="desc">조회문 전용 setup_check.sql 파일을 ai_database_book 연결에서 실행하고 데이터베이스, 스키마, 사용자, 서버 시각과 계산 결과를 확인한 뒤 필요할 때 다시 실행하는 흐름</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#475569"/>
    </marker>
    <style>
      text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#172033}
      .title{font-size:30px;font-weight:700;text-anchor:middle;fill:#0f2d5c}
      .box{fill:#fff;stroke:#64748b;stroke-width:2}
      .check{fill:#eef5ff;stroke:#3174d0;stroke-width:2}
      .run{fill:#eef9f1;stroke:#2f9a58;stroke-width:2}
      .decision{fill:#fffceb;stroke:#d6a600;stroke-width:2}
      .fix{fill:#fff1f1;stroke:#d64545;stroke-width:2}
      .record{fill:#f5f0ff;stroke:#7c4dcb;stroke-width:2}
      .name{font-size:18px;font-weight:700;text-anchor:middle}
      .sub{font-size:14px;text-anchor:middle;fill:#475569}
      .mono{font-size:14px;font-weight:700;text-anchor:middle;font-family:Consolas,D2Coding,"Courier New",monospace;fill:#0f2d5c}
      .line{stroke:#475569;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
      .loop{stroke:#d64545;stroke-width:2.3;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}
      .label{font-size:16px;font-weight:700;text-anchor:middle}
      .note{font-size:16px;font-weight:700;text-anchor:middle;fill:#0f2d5c}
    </style>
  </defs>
  <rect width="1200" height="820" fill="#fff"/>
  <text x="600" y="48" class="title">setup_check.sql 실행과 재실행 흐름</text>

  <rect x="420" y="82" width="360" height="58" rx="14" class="box"/>
  <text x="600" y="118" class="name">setup_check.sql 열기</text>

  <rect x="390" y="172" width="420" height="72" rx="14" class="check"/>
  <text x="600" y="201" class="name">실행 연결 확인</text>
  <text x="600" y="226" class="mono">현재 DB = ai_database_book</text>

  <rect x="390" y="276" width="420" height="72" rx="14" class="run"/>
  <text x="600" y="305" class="name">조회문 전체 실행</text>
  <text x="600" y="330" class="sub">테이블·데이터 변경 없이 환경 확인</text>

  <rect x="330" y="380" width="540" height="92" rx="14" class="check"/>
  <text x="600" y="410" class="name">결과 확인</text>
  <text x="600" y="438" class="sub">DB · 스키마 · 사용자 · 서버 시각 · 계산 결과</text>
  <text x="600" y="460" class="mono">ai_database_book · public · result = 2</text>

  <rect x="390" y="506" width="420" height="70" rx="14" class="decision"/>
  <text x="600" y="536" class="name">기대 결과와 일치하는가?</text>
  <text x="600" y="560" class="sub">현재 연결과 실행 결과 비교</text>

  <rect x="90" y="630" width="300" height="74" rx="14" class="fix"/>
  <text x="240" y="659" class="name">연결과 현재 위치 수정</text>
  <text x="240" y="684" class="sub">DB·스키마·사용자 재확인</text>

  <rect x="455" y="630" width="290" height="74" rx="14" class="record"/>
  <text x="600" y="659" class="name">실행 결과 기록</text>
  <text x="600" y="684" class="sub">환경 확인 기록 남기기</text>

  <rect x="810" y="630" width="300" height="74" rx="14" class="run"/>
  <text x="960" y="659" class="name">필요할 때 다시 실행</text>
  <text x="960" y="684" class="sub">같은 파일로 환경 재검증</text>

  <path d="M600 140V172" class="line"/>
  <path d="M600 244V276" class="line"/>
  <path d="M600 348V380" class="line"/>
  <path d="M600 472V506" class="line"/>
  <path d="M500 576L315 630" class="loop"/>
  <text x="408" y="606" class="label" fill="#b42323">아니요</text>
  <path d="M700 576L600 630" class="line"/>
  <text x="660" y="606" class="label" fill="#166534">예</text>
  <path d="M745 667H810" class="line"/>
  <path d="M240 630V208H390" class="loop"/>

  <text x="600" y="782" class="note">조회문만 포함하므로 여러 번 실행해도 테이블과 데이터는 변경되지 않는다.</text>
</svg>
