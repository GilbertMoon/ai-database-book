<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc"><title id="title">전체 실습 환경 구조</title><desc id="desc">학습자가 원고와 AI 보조 도구를 활용해 SQL과 문서를 작성하고, DBeaver를 통해 PostgreSQL 서버에 연결해 실행 결과를 검증한 뒤 GitHub에 기록하는 구조</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}.t{font-size:28px;font-weight:700;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.panel{stroke-width:1.5;rx:15}.guide{fill:#f8fafc;stroke:#a8b3c4}.work{fill:#eef5ff;stroke:#6fa2e8}.exec{fill:#f2fbf5;stroke:#8bc9a0}.verify{fill:#fff8e8;stroke:#d69e2e}.pt{font-size:18px;font-weight:700}.ps{font-size:12.5px;fill:#475569}.box{fill:#fff;stroke-width:1.5;rx:11}.blue{stroke:#3b82c4}.purple{stroke:#7c5cc4}.orange{stroke:#d69e2e}.green{stroke:#3c9a5f}.gray{stroke:#64748b}.h{font-size:15px;font-weight:700;text-anchor:middle}.m{font-size:11.8px;text-anchor:middle;fill:#475569}.arr{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.back{stroke:#d9534f;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#a)}.note{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.4;rx:10}.nt{font-size:12.5px;font-weight:700;text-anchor:middle;fill:#92400e}.core{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.6;rx:10}.cv{font-size:15px;font-weight:700;text-anchor:middle;fill:#166534}</style></defs><rect width="1200" height="960" fill="#fff"/><text x="600" y="40" class="t">전체 실습 환경 구조</text><text x="600" y="68" class="s">읽기 → 파일 작성 → 연결 → 실행 → 결과 확인 → 수정·기록이 반복되는 실습 환경</text><rect x="455" y="94" width="290" height="62" class="box blue"/><text x="600" y="122" class="h">학습자</text><text x="600" y="145" class="m">요구사항 이해와 실행·검증의 최종 책임</text><rect x="35" y="190" width="1130" height="150" class="panel guide"/><text x="60" y="222" class="pt">1. 학습·작성 보조</text><rect x="70" y="248" width="300" height="68" class="box gray"/><text x="220" y="274" class="h">Chapter 03 원고</text><text x="220" y="298" class="m">설치·연결·실습 절차와 판단 기준</text><rect x="450" y="248" width="300" height="68" class="box orange"/><text x="600" y="274" class="h">ChatGPT</text><text x="600" y="298" class="m">개념 설명·오류 해석·검토 질문 보조</text><rect x="830" y="248" width="300" height="68" class="box purple"/><text x="980" y="274" class="h">Codex</text><text x="980" y="298" class="m">SQL·문서 파일 초안 작성과 수정 보조</text><path d="M600 156V190" class="arr"/><rect x="35" y="365" width="1130" height="188" class="panel work"/><text x="60" y="397" class="pt">2. 작업 공간과 버전 관리</text><rect x="70" y="428" width="250" height="88" class="box blue"/><text x="195" y="457" class="h">프로젝트 폴더</text><text x="195" y="482" class="m">SQL·문서·실습 기록을 함께 관리</text><text x="195" y="503" class="m">재실행 가능한 파일 중심</text><rect x="355" y="428" width="250" height="88" class="box green"/><text x="480" y="457" class="h">SQL 파일</text><text x="480" y="482" class="m">setup_check.sql 등 실행 명령</text><text x="480" y="503" class="m">주석과 실행 순서 포함</text><rect x="640" y="428" width="250" height="88" class="box gray"/><text x="765" y="457" class="h">README·실습 기록</text><text x="765" y="482" class="m">환경 조건·결과·오류 해결 과정</text><text x="765" y="503" class="m">수정 이유와 남은 문제 기록</text><rect x="925" y="428" width="205" height="88" class="box purple"/><text x="1027" y="457" class="h">GitHub</text><text x="1027" y="482" class="m">파일 버전과 변경 이력 관리</text><text x="1027" y="503" class="m">비밀정보는 저장하지 않음</text><path d="M220 316V365H195" class="arr"/><path d="M980 316V365H195" class="arr"/><path d="M320 472H355" class="arr"/><path d="M605 472H640" class="arr"/><path d="M890 472H925" class="arr"/><rect x="35" y="578" width="1130" height="195" class="panel exec"/><text x="60" y="610" class="pt">3. 연결과 실제 실행</text><rect x="70" y="642" width="255" height="92" class="box orange"/><text x="197" y="671" class="h">접속 정보</text><text x="197" y="696" class="m">host·port·database·user·password</text><text x="197" y="717" class="m">안전한 별도 위치에서 관리</text><rect x="405" y="642" width="300" height="92" class="box blue"/><text x="555" y="671" class="h">DBeaver · 데이터베이스 클라이언트</text><text x="555" y="696" class="m">연결 설정·SQL 편집·실행 요청</text><text x="555" y="717" class="m">조회 결과와 오류 메시지 표시</text><rect x="785" y="642" width="345" height="92" class="box green"/><text x="957" y="671" class="h">PostgreSQL 서버</text><text x="957" y="696" class="m">로컬 또는 클라우드에서 데이터 보관</text><text x="957" y="717" class="m">SQL 처리·제약조건·트랜잭션 수행</text><path d="M197 734V755H555V734" class="arr"/><path d="M480 516V642" class="arr"/><path d="M705 688H785" class="arr"/><path d="M785 722H705" class="arr"/><text x="745" y="678" class="m">실행 요청</text><text x="745" y="745" class="m">결과·오류</text><rect x="35" y="798" width="1130" height="105" class="panel verify"/><text x="60" y="830" class="pt">4. 결과 검증과 수정 기록</text><text x="310" y="830" class="ps">연결 성공, 현재 DB, 테이블 구조, 샘플 데이터와 예상 오류를 사람이 직접 확인</text><rect x="100" y="850" width="300" height="34" class="box gray"/><text x="250" y="871" class="m">오류 정보: 실행 파일·전체 메시지·환경·재현 단계</text><rect x="450" y="850" width="300" height="34" class="box green"/><text x="600" y="871" class="m">예상 결과와 실제 결과 비교</text><rect x="800" y="850" width="300" height="34" class="box purple"/><text x="950" y="871" class="m">검증 결과와 수정 이유를 문서·GitHub에 기록</text><path d="M555 734V798" class="arr"/><path d="M400 867H450" class="arr"/><path d="M750 867H800" class="arr"/><path d="M100 867H25V282H450" class="back"/><rect x="120" y="920" width="960" height="28" class="core"/><text x="600" y="938" class="cv">PostgreSQL은 실제 데이터를 보관하고, DBeaver는 연결·실행·확인을 돕는 클라이언트이며, AI 결과는 실행으로 검증한다</text></svg>