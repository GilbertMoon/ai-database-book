<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">전체 데이터베이스 작업 환경</title>
  <desc id="desc">학습자, SQL 실습 파일, DBeaver, PostgreSQL, 실행 결과 검증, GitHub 기록과 ChatGPT, Codex 보조 도구의 연결 구조</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#475569"/>
    </marker>
    <style>
      text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#172033}
      .title{font-size:30px;font-weight:700;text-anchor:middle;fill:#0f2d5c}
      .node{stroke-width:2;rx:14}
      .user{fill:#f8fafc;stroke:#64748b}
      .file{fill:#fff;stroke:#64748b}
      .dbeaver{fill:#eef5ff;stroke:#3174d0}
      .pg{fill:#eef9f1;stroke:#2f9a58}
      .ai1{fill:#fff5df;stroke:#d89424}
      .ai2{fill:#f5f0ff;stroke:#7c4dcb}
      .github{fill:#f3f4f6;stroke:#6b7280}
      .check{fill:#fffceb;stroke:#d6a600}
      .name{font-size:19px;font-weight:700;text-anchor:middle}
      .sub{font-size:14px;text-anchor:middle;fill:#475569}
      .line{stroke:#475569;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
      .sync{stroke:#475569;stroke-width:2.4;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}
      .dash{stroke:#7c4dcb;stroke-width:2.2;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}
      .note{font-size:16px;font-weight:700;text-anchor:middle;fill:#0f2d5c}
    </style>
  </defs>
  <rect width="1200" height="700" fill="#fff"/>
  <text x="600" y="48" class="title">전체 데이터베이스 작업 환경</text>

  <rect x="450" y="85" width="300" height="76" class="node user"/>
  <text x="600" y="116" class="name">학습자</text>
  <text x="600" y="141" class="sub">요구사항 이해·검증 책임</text>

  <rect x="450" y="200" width="300" height="76" class="node file"/>
  <text x="600" y="231" class="name">SQL·실습 파일</text>
  <text x="600" y="256" class="sub">재현 가능한 작업 기록</text>

  <rect x="450" y="315" width="300" height="86" class="node dbeaver"/>
  <text x="600" y="348" class="name">DBeaver</text>
  <text x="600" y="373" class="sub">연결·SQL 실행·결과 확인</text>

  <rect x="450" y="455" width="300" height="86" class="node pg"/>
  <text x="600" y="488" class="name">PostgreSQL</text>
  <text x="600" y="513" class="sub">데이터 저장·SQL 처리·제약조건 적용</text>

  <rect x="790" y="455" width="250" height="86" class="node check"/>
  <text x="915" y="488" class="name">실행 결과 검증</text>
  <text x="915" y="513" class="sub">AI 결과도 직접 확인</text>

  <rect x="790" y="585" width="250" height="64" class="node github"/>
  <text x="915" y="624" class="name">GitHub 기록</text>

  <rect x="105" y="215" width="250" height="80" class="node ai1"/>
  <text x="230" y="247" class="name">ChatGPT</text>
  <text x="230" y="272" class="sub">개념·오류 해석 보조</text>

  <rect x="105" y="345" width="250" height="80" class="node ai2"/>
  <text x="230" y="377" class="name">Codex</text>
  <text x="230" y="402" class="sub">SQL·문서 초안 보조</text>

  <path d="M600 161V200" class="line"/>
  <path d="M600 276V315" class="line"/>
  <path d="M600 401V455" class="sync"/>
  <path d="M750 498H790" class="line"/>
  <path d="M915 541V585" class="line"/>
  <path d="M355 255H450" class="dash"/>
  <path d="M355 385H450" class="dash"/>

  <text x="600" y="672" class="note">DBeaver는 클라이언트이고, 실제 데이터 저장과 SQL 처리는 PostgreSQL이 담당한다.</text>
</svg>
