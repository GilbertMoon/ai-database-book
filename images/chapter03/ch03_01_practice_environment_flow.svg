<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">전체 데이터베이스 작업 환경</title>
  <desc id="desc">ChatGPT와 Codex가 초안과 오류 해석을 보조하고, 학습자가 검토한 SQL 파일을 DBeaver에서 실행해 PostgreSQL이 처리한다. 학습자는 결과를 검증하고 실패하면 수정해 재실행하며, SQL 파일과 검증 근거는 GitHub에 기록한다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#475569"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7c4dcb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#d64545"/>
    </marker>
    <style>
      text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#172033}
      .title{font-size:32px;font-weight:800;text-anchor:middle;fill:#0f2d5c}
      .node{stroke-width:2.2}
      .user{fill:#f8fafc;stroke:#64748b}
      .file{fill:#ffffff;stroke:#64748b}
      .dbeaver{fill:#eef5ff;stroke:#3174d0}
      .pg{fill:#eef9f1;stroke:#2f9a58}
      .ai1{fill:#fff5df;stroke:#d89424}
      .ai2{fill:#f5f0ff;stroke:#7c4dcb}
      .github{fill:#f3f4f6;stroke:#6b7280}
      .check{fill:#fffceb;stroke:#d6a600}
      .name{font-size:20px;font-weight:800;text-anchor:middle}
      .sub{font-size:16px;text-anchor:middle;fill:#475569}
      .line{stroke:#475569;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .sync{stroke:#475569;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round;marker-start:url(#arrow);marker-end:url(#arrow)}
      .ai-assist{stroke:#7c4dcb;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 6;marker-end:url(#arrow-purple)}
      .retry{stroke:#d64545;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-red)}
      .edge-label{font-size:14px;font-weight:700;text-anchor:middle;fill:#475569}
      .ai-label{fill:#6d28d9}
      .retry-label{fill:#b42323}
      .pass-label{fill:#166534}
      .note-box{fill:#eef5ff;stroke:#4d86d7;stroke-width:2}
      .note{font-size:16px;font-weight:700;text-anchor:middle;fill:#0f2d5c}
      .legend-title{font-size:13px;font-weight:800;text-anchor:middle;fill:#475569}
      .legend-text{font-size:13px;font-weight:700;fill:#475569}
    </style>
    <symbol id="actor-ai-icon" viewBox="0 0 24 24">
      <rect x="5" y="7" width="14" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M12 4v3M9.5 4h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="9.5" cy="12" r="1.2" fill="currentColor"/>
      <circle cx="14.5" cy="12" r="1.2" fill="currentColor"/>
      <path d="M9 15h6M5 11H3.5M20.5 11H19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="actor-human-icon" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M5.5 19c.9-3.7 3-5.5 6.5-5.5s5.6 1.8 6.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
  </defs>

  <rect width="1200" height="820" fill="#ffffff"/>
  <text x="600" y="48" class="title">전체 데이터베이스 작업 환경</text>

  <!-- 실행 주체 및 연결선 범례 -->
  <g id="legend" aria-label="실행 주체와 연결선 범례">
    <rect x="785" y="68" width="395" height="92" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
    <text x="982.5" y="87" class="legend-title">실행 주체와 연결선</text>
    <g transform="translate(804 98)">
      <rect width="25" height="25" rx="8" fill="#dff8f1" stroke="#0f9f7a" stroke-width="1.3"/>
      <use href="#actor-ai-icon" x="3.5" y="3.5" width="18" height="18" style="color:#0f766e"/>
    </g>
    <text x="838" y="116" class="legend-text" fill="#0f766e">AI</text>
    <g transform="translate(875 98)">
      <rect width="25" height="25" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
      <use href="#actor-human-icon" x="3.5" y="3.5" width="18" height="18" style="color:#475569"/>
    </g>
    <text x="909" y="116" class="legend-text">사람</text>

    <path d="M965 110 H1015" class="line"/>
    <text x="990" y="139" class="legend-text" text-anchor="middle">실행·반영</text>
    <path d="M1040 110 H1090" class="sync"/>
    <text x="1065" y="139" class="legend-text" text-anchor="middle">요청·응답</text>
    <path d="M1110 110 H1160" class="ai-assist"/>
    <text x="1135" y="139" class="legend-text ai-label" text-anchor="middle">AI 보조</text>
  </g>

  <!-- AI 보조 도구 -->
  <rect x="55" y="180" width="250" height="90" rx="16" class="node ai1"/>
  <g transform="translate(68 193)" aria-label="AI 실행">
    <rect width="28" height="28" rx="9" fill="#dff8f1" stroke="#0f9f7a" stroke-width="1.4"/>
    <use href="#actor-ai-icon" x="4" y="4" width="20" height="20" style="color:#0f766e"/>
  </g>
  <text x="180" y="216" class="name">ChatGPT</text>
  <text x="180" y="247" class="sub">개념 · 오류 해석 · 대안 제시</text>

  <rect x="55" y="315" width="250" height="90" rx="16" class="node ai2"/>
  <g transform="translate(68 328)" aria-label="AI 실행">
    <rect width="28" height="28" rx="9" fill="#dff8f1" stroke="#0f9f7a" stroke-width="1.4"/>
    <use href="#actor-ai-icon" x="4" y="4" width="20" height="20" style="color:#0f766e"/>
  </g>
  <text x="180" y="351" class="name">Codex</text>
  <text x="180" y="382" class="sub">SQL · 문서 · 수정 초안 보조</text>

  <!-- 사람이 검토하고 반영하는 중심 흐름 -->
  <rect x="420" y="180" width="330" height="100" rx="16" class="node user"/>
  <g transform="translate(433 193)" aria-label="사람 실행">
    <rect width="28" height="28" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
    <use href="#actor-human-icon" x="4" y="4" width="20" height="20" style="color:#475569"/>
  </g>
  <text x="585" y="216" class="name">학습자 검토</text>
  <text x="585" y="248" class="sub">요구사항 이해 · AI 초안 판단 · 결과 책임</text>

  <path d="M305 225 H360 V210 H420" class="ai-assist"/>
  <path d="M305 360 H360 V250 H420" class="ai-assist"/>
  <text x="355" y="291" class="edge-label ai-label">초안·해석 보조</text>

  <rect x="420" y="330" width="330" height="100" rx="16" class="node file"/>
  <g transform="translate(433 343)" aria-label="사람 실행">
    <rect width="28" height="28" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
    <use href="#actor-human-icon" x="4" y="4" width="20" height="20" style="color:#475569"/>
  </g>
  <text x="585" y="366" class="name">SQL · 실습 파일</text>
  <text x="585" y="398" class="sub">검토된 SQL과 재현 가능한 작업 기록</text>

  <path d="M585 280 V330" class="line"/>
  <text x="642" y="310" class="edge-label">검토 후 반영</text>

  <rect x="420" y="480" width="330" height="100" rx="16" class="node dbeaver"/>
  <g transform="translate(433 493)" aria-label="사람 실행">
    <rect width="28" height="28" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
    <use href="#actor-human-icon" x="4" y="4" width="20" height="20" style="color:#475569"/>
  </g>
  <text x="585" y="516" class="name">DBeaver</text>
  <text x="585" y="548" class="sub">연결 · SQL 실행 · 결과와 오류 표시</text>

  <path d="M585 430 V480" class="line"/>
  <text x="630" y="460" class="edge-label">SQL 실행</text>

  <rect x="420" y="635" width="330" height="100" rx="16" class="node pg"/>
  <text x="585" y="675" class="name">PostgreSQL</text>
  <text x="585" y="707" class="sub">데이터 저장 · SQL 처리 · 제약조건 적용</text>

  <path d="M585 580 V635" class="sync"/>
  <text x="650" y="613" class="edge-label">요청·응답</text>

  <!-- GitHub 버전 관리 -->
  <rect x="840" y="330" width="300" height="100" rx="16" class="node github"/>
  <g transform="translate(853 343)" aria-label="사람 실행">
    <rect width="28" height="28" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
    <use href="#actor-human-icon" x="4" y="4" width="20" height="20" style="color:#475569"/>
  </g>
  <text x="990" y="366" class="name">GitHub 기록</text>
  <text x="990" y="398" class="sub">SQL · 문서 · 변경 근거 버전 관리</text>

  <path d="M750 380 H840" class="sync"/>
  <text x="795" y="365" class="edge-label">커밋·동기화</text>

  <!-- 사람이 수행하는 결과 검증 -->
  <rect x="840" y="625" width="300" height="120" rx="16" class="node check"/>
  <g transform="translate(853 638)" aria-label="사람 실행">
    <rect width="28" height="28" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
    <use href="#actor-human-icon" x="4" y="4" width="20" height="20" style="color:#475569"/>
  </g>
  <text x="990" y="666" class="name">학습자의 실행 결과 검증</text>
  <text x="990" y="699" class="sub">요구사항 · 예상값 · 오류 · 영향 범위 비교</text>
  <text x="990" y="726" class="sub">DBeaver는 결과를 표시하고 판단은 사람이 수행</text>

  <path d="M750 685 H840" class="line"/>
  <text x="795" y="670" class="edge-label">실행 결과 전달</text>

  <path d="M990 625 V470 H1040 V430" class="line"/>
  <text x="1070" y="525" class="edge-label pass-label">통과: 근거 기록</text>

  <path d="M840 715 H790 V530 H750" class="retry"/>
  <text x="790" y="752" class="edge-label retry-label">불일치: SQL 수정 후 재실행</text>

  <rect x="125" y="775" width="950" height="32" rx="16" class="note-box"/>
  <text x="600" y="797" class="note">AI는 초안을 보조하고, DBeaver는 결과를 표시하며, 학습자는 검증과 최종 판단을 책임진다.</text>
</svg>