<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5568"/></marker><style>text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#1a202c}.t{font-size:24px;font-weight:700}.b{fill:#f7fafc;stroke:#4a5568;stroke-width:2;rx:12}.m{fill:#ebf8ff;stroke:#2b6cb0}.y{fill:#fffaf0;stroke:#d69e2e}.g{fill:#f0fff4;stroke:#38a169}.l{font-size:16px;text-anchor:middle;dominant-baseline:middle}.s{font-size:13px;text-anchor:middle;dominant-baseline:middle}</style></defs><rect width="100%" height="100%" fill="white"/><text x="600" y="40" text-anchor="middle" class="t">ChatGPT와 Codex를 활용한 실습 보조 흐름</text><rect x="470" y="90" width="260" height="58" class="b m"/><text x="600" y="119" class="l">실습 중 막힘</text><rect x="280" y="220" width="240" height="65" class="b y"/><text x="400" y="248" class="l">오류 메시지 해결</text><text x="400" y="270" class="s">ChatGPT 활용</text><rect x="680" y="220" width="240" height="65" class="b y"/><text x="800" y="248" class="l">SQL 파일 생성</text><text x="800" y="270" class="s">Codex 활용</text><rect x="190" y="380" width="420" height="80" class="b"/><text x="400" y="410" class="l">좋은 ChatGPT 질문</text><text x="400" y="435" class="s">운영체제 + 입력값 + 오류 메시지 + 시도한 방법</text><rect x="590" y="380" width="420" height="80" class="b"/><text x="800" y="410" class="l">좋은 Codex 요청</text><text x="800" y="435" class="s">저장소 경로 + 파일명 + 포함할 SQL + 주석 요구</text><rect x="280" y="560" width="240" height="58" class="b g"/><text x="400" y="589" class="l">해결 과정 기록</text><rect x="680" y="560" width="240" height="58" class="b g"/><text x="800" y="589" class="l">DBeaver 실행 검증</text><line x1="570" y1="148" x2="400" y2="220" stroke="#4a5568" stroke-width="2" marker-end="url(#a)"/><line x1="630" y1="148" x2="800" y2="220" stroke="#4a5568" stroke-width="2" marker-end="url(#a)"/><line x1="400" y1="285" x2="400" y2="380" stroke="#4a5568" stroke-width="2" marker-end="url(#a)"/><line x1="800" y1="285" x2="800" y2="380" stroke="#4a5568" stroke-width="2" marker-end="url(#a)"/><line x1="400" y1="460" x2="400" y2="560" stroke="#4a5568" stroke-width="2" marker-end="url(#a)"/><line x1="800" y1="460" x2="800" y2="560" stroke="#4a5568" stroke-width="2" marker-end="url(#a)"/><rect x="250" y="650" width="700" height="36" class="b m"/><text x="600" y="669" class="s">AI는 대신 해결해 주는 도구가 아니라, 확인과 검증을 돕는 보조 도구이다.</text></svg>