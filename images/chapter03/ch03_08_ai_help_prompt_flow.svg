<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">ChatGPT와 Codex를 활용한 실습 보조 흐름</title><desc id="desc">실습 목표를 정리한 뒤 오류 해석은 ChatGPT에, SQL과 문서 파일 초안은 Codex에 요청하고, 제안과 변경 내용을 검토해 직접 실행·검증하고 기록하는 흐름</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}.t{font-size:28px;font-weight:700;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.box{fill:#fff;stroke-width:1.6;rx:12}.blue{fill:#eef5ff;stroke:#3b82c4}.purple{fill:#f5f1ff;stroke:#7c5cc4}.orange{fill:#fff8e8;stroke:#d69e2e}.green{fill:#f2fbf5;stroke:#3c9a5f}.gray{fill:#f8fafc;stroke:#64748b}.h{font-size:16px;font-weight:700;text-anchor:middle}.m{font-size:11.8px;text-anchor:middle;fill:#475569}.panel{stroke-width:1.6;rx:15}.chat{fill:#eef5ff;stroke:#6fa2e8}.codex{fill:#f5f1ff;stroke:#9b7bd2}.pt{font-size:20px;font-weight:700;text-anchor:middle}.card{fill:#fff;stroke-width:1.4;rx:10}.ch{font-size:14px;font-weight:700;text-anchor:middle}.cm{font-size:11.2px;text-anchor:middle;fill:#475569}.arr{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.back{stroke:#d9534f;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#a)}.decision{fill:#fff8e8;stroke:#b7791f;stroke-width:1.8}.dt{font-size:14px;font-weight:700;text-anchor:middle}.core{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.6;rx:10}.cv{font-size:15px;font-weight:700;text-anchor:middle;fill:#166534}</style></defs><rect width="1200" height="900" fill="#fff"/><text x="600" y="40" class="t">ChatGPT와 Codex를 활용한 실습 보조 흐름</text><text x="600" y="68" class="s">AI의 제안과 생성 결과는 초안이며, 실제 환경에서 직접 확인한 결과를 기준으로 채택한다</text><rect x="330" y="100" width="540" height="78" class="box gray"/><text x="600" y="130" class="h">1. 실습 목표와 현재 상태 정리</text><text x="600" y="155" class="m">하려는 작업 · 막힌 단계 · 예상 결과 · 현재 연결과 데이터베이스 상태</text><polygon points="600,210 735,250 600,290 465,250" class="decision"/><text x="600" y="246" class="dt">어떤 도움이 필요한가?</text><text x="600" y="268" class="m">오류 해석·개념 설명 또는 저장소 파일 초안·수정</text><path d="M600 178V210" class="arr"/><rect x="35" y="325" width="545" height="300" class="panel chat"/><text x="307" y="360" class="pt">ChatGPT · 오류 해석</text><rect x="60" y="395" width="495" height="78" class="card"/><text x="307" y="423" class="ch">질문에 필요한 맥락</text><text x="307" y="449" class="cm">운영 환경 · 연결 대상 · 실행한 SQL · 전체 오류 · 이미 확인한 항목</text><rect x="60" y="490" width="495" height="58" class="card"/><text x="307" y="516" class="ch">요청 방식</text><text x="307" y="539" class="cm">가능한 원인과 확인 순서를 우선순위대로 요청</text><rect x="60" y="565" width="495" height="42" class="box orange"/><text x="307" y="591" class="ch">답변의 환경 적합성·근거·변경 영향 검토</text><rect x="620" y="325" width="545" height="300" class="panel codex"/><text x="892" y="360" class="pt">Codex · 파일 초안과 수정</text><rect x="645" y="395" width="495" height="78" class="card"/><text x="892" y="423" class="ch">요청에 필요한 범위</text><text x="892" y="449" class="cm">저장소 · 파일 경로 · 포함할 내용 · 주석 · 재실행 조건</text><rect x="645" y="490" width="495" height="58" class="card"/><text x="892" y="516" class="ch">제한과 완료 기준</text><text x="892" y="539" class="cm">수정 파일 · 제외 범위 · 예상 결과 · 민감 정보 제외</text><rect x="645" y="565" width="495" height="42" class="box orange"/><text x="892" y="591" class="ch">변경 내용·문법·순서·제약조건·재실행 검토</text><path d="M465 250H307V325" class="arr"/><path d="M735 250H892V325" class="arr"/><rect x="80" y="665" width="300" height="70" class="box orange"/><text x="230" y="692" class="h">2. 실행 전 검토</text><text x="230" y="716" class="m">가정·변경 영향·민감 정보·복구 가능성 확인</text><rect x="450" y="665" width="300" height="70" class="box blue"/><text x="600" y="692" class="h">3. 직접 실행</text><text x="600" y="716" class="m">격리된 실습 환경에서 한 단계씩 적용</text><rect x="820" y="665" width="300" height="70" class="box green"/><text x="970" y="692" class="h">4. 실제 결과 검증</text><text x="970" y="716" class="m">현재 DB·구조·행 수·오류·예상 결과 비교</text><path d="M307 625V645H230V665" class="arr"/><path d="M892 625V645H230V665" class="arr"/><path d="M380 700H450" class="arr"/><path d="M750 700H820" class="arr"/><polygon points="600,765 725,800 600,835 475,800" class="decision"/><text x="600" y="796" class="dt">예상 결과와 일치하는가?</text><text x="600" y="817" class="m">불일치하면 새 증거로 질문·요청을 수정</text><path d="M970 735V755H600V765" class="arr"/><rect x="800" y="778" width="340" height="58" class="box green"/><text x="970" y="802" class="h">해결 과정 기록·GitHub 반영</text><text x="970" y="824" class="m">채택한 내용·검증 결과·수정 이유·남은 한계</text><path d="M725 800H800" class="arr"/><path d="M475 800H20V250H465" class="back"/><rect x="130" y="860" width="940" height="26" class="core"/><text x="600" y="877" class="cv">맥락 제공 → AI 결과 검토 → 직접 실행 → 실제 결과 검증 → 기록의 순환으로 활용한다</text></svg>