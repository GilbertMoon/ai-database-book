<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc"><title id="title">DBeaver에서 PostgreSQL 연결 흐름</title><desc id="desc">DBeaver에서 PostgreSQL 드라이버를 준비하고 로컬 또는 클라우드 연결 정보를 입력해 연결 테스트를 수행한 뒤 오류 유형별로 점검하고 실제 서버와 데이터베이스를 SQL로 검증하는 흐름</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}.t{font-size:28px;font-weight:700;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.step{fill:#fff;stroke:#64748b;stroke-width:1.6;rx:11}.blue{fill:#eef5ff;stroke:#3b82c4}.purple{fill:#f5f1ff;stroke:#7c5cc4}.orange{fill:#fff8e8;stroke:#d69e2e}.green{fill:#f2fbf5;stroke:#3c9a5f}.red{fill:#fff5f5;stroke:#d9534f}.h{font-size:15px;font-weight:700;text-anchor:middle}.m{font-size:11.8px;text-anchor:middle;fill:#475569}.panel{fill:#f8fafc;stroke:#a8b3c4;stroke-width:1.5;rx:15}.pt{font-size:18px;font-weight:700}.field{fill:#fff;stroke:#94a3b8;stroke-width:1.3;rx:9}.fh{font-size:13.5px;font-weight:700;text-anchor:middle}.fm{font-size:11.2px;text-anchor:middle;fill:#475569}.arr{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.back{stroke:#d9534f;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#a)}.decision{fill:#fff8e8;stroke:#b7791f;stroke-width:1.8}.dt{font-size:14px;font-weight:700;text-anchor:middle}.error{fill:#fff;stroke-width:1.3;rx:9}.eh{font-size:13px;font-weight:700;text-anchor:middle}.em{font-size:10.8px;text-anchor:middle;fill:#475569}.note{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.4;rx:10}.nt{font-size:12px;font-weight:700;text-anchor:middle;fill:#92400e}.core{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.6;rx:10}.cv{font-size:15px;font-weight:700;text-anchor:middle;fill:#166534}</style></defs><rect width="1200" height="1040" fill="#fff"/><text x="600" y="40" class="t">DBeaver에서 PostgreSQL 연결 흐름</text><text x="600" y="68" class="s">연결 테스트 성공 뒤에도 실제 서버와 데이터베이스가 맞는지 SQL로 다시 확인한다</text><rect x="55" y="102" width="220" height="72" class="step blue"/><text x="165" y="130" class="h">1. DBeaver 실행</text><text x="165" y="153" class="m">새 데이터베이스 연결 선택</text><rect x="350" y="102" width="220" height="72" class="step purple"/><text x="460" y="130" class="h">2. PostgreSQL 선택</text><text x="460" y="153" class="m">데이터베이스 드라이버 지정</text><rect x="645" y="102" width="220" height="72" class="step orange"/><text x="755" y="130" class="h">3. JDBC 드라이버 확인</text><text x="755" y="153" class="m">필요하면 다운로드</text><rect x="940" y="102" width="220" height="72" class="step green"/><text x="1050" y="130" class="h">4. 연결 정보 입력</text><text x="1050" y="153" class="m">서버 주소·인증·DB 선택</text><path d="M275 138H350" class="arr"/><path d="M570 138H645" class="arr"/><path d="M865 138H940" class="arr"/><rect x="35" y="210" width="1130" height="230" class="panel"/><text x="60" y="242" class="pt">연결 정보의 의미와 입력 기준</text><rect x="55" y="272" width="205" height="126" class="field"/><text x="157" y="302" class="fh">Host</text><text x="157" y="330" class="fm">로컬: localhost</text><text x="157" y="350" class="fm">클라우드: 제공된 주소</text><text x="157" y="376" class="fm">서버가 실행되는 컴퓨터 위치</text><rect x="280" y="272" width="205" height="126" class="field"/><text x="382" y="302" class="fh">Port</text><text x="382" y="330" class="fm">일반적으로 5432</text><text x="382" y="350" class="fm">실제 설치·서비스 설정 우선</text><text x="382" y="376" class="fm">서버가 연결을 기다리는 번호</text><rect x="505" y="272" width="205" height="126" class="field"/><text x="607" y="302" class="fh">Database</text><text x="607" y="330" class="fm">처음에는 postgres 가능</text><text x="607" y="350" class="fm">또는 이미 존재하는 작업 DB</text><text x="607" y="376" class="fm">연결할 데이터베이스 이름</text><rect x="730" y="272" width="205" height="126" class="field"/><text x="832" y="302" class="fh">Username · Password</text><text x="832" y="330" class="fm">접속 권한을 가진 사용자</text><text x="832" y="350" class="fm">해당 사용자의 인증 정보</text><text x="832" y="376" class="fm">설치·서비스에서 설정한 값</text><rect x="955" y="272" width="190" height="126" class="field"/><text x="1050" y="302" class="fh">SSL · 추가 설정</text><text x="1050" y="330" class="fm">클라우드 서비스에서</text><text x="1050" y="350" class="fm">요구 여부 확인</text><text x="1050" y="376" class="fm">제공된 안내값 우선</text><path d="M1050 174V210" class="arr"/><rect x="420" y="474" width="360" height="66" class="step orange"/><text x="600" y="501" class="h">5. Test Connection 실행</text><text x="600" y="525" class="m">드라이버·네트워크·서버 주소·인증·DB 이름 확인</text><path d="M600 440V474" class="arr"/><polygon points="600,568 720,608 600,648 480,608" class="decision"/><text x="600" y="604" class="dt">연결 테스트 성공?</text><path d="M600 540V568" class="arr"/><rect x="70" y="686" width="450" height="136" class="panel"/><text x="95" y="718" class="pt">실패 시 오류 유형별 점검</text><rect x="95" y="742" width="190" height="56" class="error red"/><text x="190" y="764" class="eh">연결 거부·시간 초과</text><text x="190" y="785" class="em">서비스·Host·Port·방화벽·네트워크</text><rect x="305" y="742" width="190" height="56" class="error red"/><text x="400" y="764" class="eh">인증·DB·SSL 오류</text><text x="400" y="785" class="em">계정·비밀번호·DB 이름·SSL 설정</text><path d="M480 608H295V686" class="back"/><path d="M295 822V850H1050V174" class="back"/><rect x="680" y="686" width="450" height="136" class="panel"/><text x="705" y="718" class="pt">성공 후 실제 연결 대상 검증</text><rect x="705" y="742" width="190" height="56" class="error green"/><text x="800" y="764" class="eh">Finish · 연결 저장</text><text x="800" y="785" class="em">Database Navigator에서 연결 확인</text><rect x="915" y="742" width="190" height="56" class="error green"/><text x="1010" y="764" class="eh">SQL 실행 확인</text><text x="1010" y="785" class="em">서버 버전·현재 DB·간단한 조회</text><path d="M720 608H905V686" class="arr"/><rect x="390" y="850" width="420" height="56" class="step green"/><text x="600" y="875" class="h">예상한 PostgreSQL 서버와 작업 DB가 맞으면 연결 준비 완료</text><text x="600" y="897" class="m">다른 DB라면 연결 설정의 Database 값을 바꾸거나 새 연결을 생성</text><path d="M1010 798V850H810" class="arr"/><rect x="55" y="930" width="520" height="46" class="note"/><text x="315" y="958" class="nt">새 DB를 생성해도 기존 DBeaver 연결 대상은 자동으로 변경되지 않는다</text><rect x="625" y="930" width="520" height="46" class="note"/><text x="885" y="958" class="nt">비밀번호와 전체 접속 문자열은 GitHub·문서·화면 캡처·AI 질문에 노출하지 않는다</text><rect x="140" y="998" width="920" height="28" class="core"/><text x="600" y="1017" class="cv">드라이버 → 주소·인증 정보 → 연결 테스트 → 실제 서버·데이터베이스 검증 순서로 확인한다</text></svg>