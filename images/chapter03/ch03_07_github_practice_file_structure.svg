<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc"><title id="title">GitHub 실습 파일 관리 구조</title><desc id="desc">ai-database-book 저장소에서 실행 가능한 SQL, 본문과 활동 자료, Mermaid 원본과 SVG 도식을 역할별로 관리하고 DBeaver와 PostgreSQL 실행 결과를 문서에 반영해 작은 단위로 커밋하는 구조</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}.t{font-size:28px;font-weight:700;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.repo{fill:#24497a;stroke:#17355c;stroke-width:1.8;rx:13}.repot{font-size:18px;font-weight:700;fill:#fff;text-anchor:middle}.repos{font-size:12px;fill:#dbeafe;text-anchor:middle}.panel{stroke-width:1.6;rx:15}.code{fill:#eef5ff;stroke:#6fa2e8}.book{fill:#fff8e8;stroke:#d69e2e}.image{fill:#f5f1ff;stroke:#9b7bd2}.pt{font-size:19px;font-weight:700;text-anchor:middle}.ps{font-size:12px;text-anchor:middle;fill:#475569}.file{fill:#fff;stroke-width:1.4;rx:10}.fb{stroke:#3b82c4}.fo{stroke:#d69e2e}.fp{stroke:#7c5cc4}.fh{font-size:14px;font-weight:700;text-anchor:middle}.fm{font-size:11.2px;text-anchor:middle;fill:#475569}.flowPanel{fill:#f8fafc;stroke:#a8b3c4;stroke-width:1.5;rx:15}.step{fill:#fff;stroke-width:1.5;rx:10}.green{stroke:#3c9a5f}.gray{stroke:#64748b}.red{stroke:#d9534f}.sh{font-size:14px;font-weight:700;text-anchor:middle}.sm{font-size:11.3px;text-anchor:middle;fill:#475569}.arr{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.soft{stroke:#7c5cc4;stroke-width:1.8;fill:none;stroke-dasharray:6 5;marker-end:url(#a)}.decision{fill:#fff8e8;stroke:#b7791f;stroke-width:1.8}.dt{font-size:14px;font-weight:700;text-anchor:middle}.note{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.4;rx:10}.nt{font-size:11.8px;font-weight:700;text-anchor:middle;fill:#92400e}.core{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.6;rx:10}.cv{font-size:15px;font-weight:700;text-anchor:middle;fill:#166534}</style></defs><rect width="1200" height="1060" fill="#fff"/><text x="600" y="40" class="t">GitHub 실습 파일 관리 구조</text><text x="600" y="68" class="s">실행 파일, 설명, 활동 기록과 도식 원본을 역할별로 나누고 실제 실행 결과를 기준으로 함께 갱신한다</text><rect x="390" y="96" width="420" height="68" class="repo"/><text x="600" y="124" class="repot">ai-database-book 저장소</text><text x="600" y="148" class="repos">재현 가능한 SQL·문서·도식과 변경 이유를 버전 관리</text><rect x="35" y="205" width="350" height="310" class="panel code"/><text x="210" y="238" class="pt">1. code/chapter03</text><text x="210" y="263" class="ps">실행 가능한 실습 원본</text><rect x="60" y="292" width="300" height="104" class="file fb"/><text x="210" y="322" class="fh">setup_check.sql</text><text x="210" y="350" class="fm">서버·현재 DB 확인</text><text x="210" y="371" class="fm">테이블 생성·샘플 데이터·제약조건 실습</text><rect x="60" y="417" width="300" height="76" class="file fb"/><text x="210" y="445" class="fh">README.md</text><text x="210" y="470" class="fm">목적·실행 순서·예상 결과·재실행 주의</text><rect x="425" y="205" width="350" height="310" class="panel book"/><text x="600" y="238" class="pt">2. book/chapter03</text><text x="600" y="263" class="ps">독자가 읽는 학습 자료</text><rect x="450" y="292" width="300" height="104" class="file fo"/><text x="600" y="322" class="fh">chapter03.md</text><text x="600" y="350" class="fm">개념·설치·연결·실습 설명</text><text x="600" y="371" class="fm">SQL 파일과 그림 링크</text><rect x="450" y="417" width="300" height="76" class="file fo"/><text x="600" y="445" class="fh">chapter03_activity.md</text><text x="600" y="470" class="fm">직접 실행할 활동·결과 기록·확인 질문</text><rect x="815" y="205" width="350" height="310" class="panel image"/><text x="990" y="238" class="pt">3. images/chapter03</text><text x="990" y="263" class="ps">수정 원본과 본문용 결과물</text><rect x="840" y="292" width="300" height="72" class="file fp"/><text x="990" y="320" class="fh">*.mmd · Mermaid 원본</text><text x="990" y="345" class="fm">개념과 흐름을 먼저 수정</text><rect x="840" y="378" width="300" height="72" class="file fp"/><text x="990" y="406" class="fh">*.svg · 렌더링 결과</text><text x="990" y="431" class="fm">본문과 활동지에 삽입</text><rect x="840" y="464" width="300" height="40" class="file fp"/><text x="990" y="489" class="fm">README.md · 도식 목록과 점검 기준</text><path d="M520 164V185H210V205" class="arr"/><path d="M600 164V205" class="arr"/><path d="M680 164V185H990V205" class="arr"/><path d="M990 364V378" class="arr"/><rect x="35" y="550" width="1130" height="300" class="flowPanel"/><text x="60" y="582" font-size="19" font-weight="700">실행 결과를 중심으로 파일 연결</text><rect x="60" y="620" width="200" height="84" class="step gray"/><text x="160" y="649" class="sh">SQL 파일</text><text x="160" y="675" class="sm">필요한 문장 선택 실행</text><rect x="300" y="620" width="200" height="84" class="step fb"/><text x="400" y="649" class="sh">DBeaver</text><text x="400" y="675" class="sm">SQL Editor·결과·오류 표시</text><rect x="540" y="620" width="200" height="84" class="step green"/><text x="640" y="649" class="sh">PostgreSQL</text><text x="640" y="675" class="sm">SQL 처리·데이터 저장·규칙 검사</text><rect x="780" y="620" width="200" height="84" class="step gray"/><text x="880" y="649" class="sh">결과 검증</text><text x="880" y="675" class="sm">현재 DB·행 수·자동값·예상 오류</text><path d="M260 662H300" class="arr"/><path d="M500 662H540" class="arr"/><path d="M740 662H780" class="arr"/><rect x="100" y="745" width="280" height="68" class="step fb"/><text x="240" y="772" class="sh">SQL·README 수정</text><text x="240" y="795" class="sm">실제 동작과 실행 절차 일치</text><rect x="460" y="745" width="280" height="68" class="step fo"/><text x="600" y="772" class="sh">본문·활동 기록 수정</text><text x="600" y="795" class="sm">결과·오류·판단 근거 반영</text><rect x="820" y="745" width="280" height="68" class="step fp"/><text x="960" y="772" class="sh">Mermaid·SVG 수정</text><text x="960" y="795" class="sm">도식 원본과 결과의 의미 일치</text><path d="M880 704V725H240V745" class="arr"/><path d="M880 704V725H600V745" class="arr"/><path d="M880 704V745H960" class="arr"/><path d="M210 396V530H160V620" class="soft"/><path d="M600 396V530H600V745" class="soft"/><path d="M990 450V530H960V745" class="soft"/><polygon points="600,870 735,910 600,950 465,910" class="decision"/><text x="600" y="905" class="dt">파일과 설명이 실제 결과와 일치하는가?</text><text x="600" y="928" class="sm">다르면 SQL·문서·도식 중 원인을 구분해 수정</text><path d="M240 813V850H600" class="arr"/><path d="M600 813V870" class="arr"/><path d="M960 813V850H600" class="arr"/><rect x="745" y="878" width="360" height="64" class="step green"/><text x="925" y="904" class="sh">작은 단위로 커밋</text><text x="925" y="927" class="sm">무엇을 왜 바꿨는지 기록하고 비교·복구·재사용</text><path d="M735 910H745" class="arr"/><rect x="55" y="970" width="350" height="58" class="note"/><text x="230" y="994" class="nt">저장 대상</text><text x="230" y="1014" class="sm">SQL·Markdown·Mermaid·SVG·예시 설정</text><rect x="425" y="970" width="350" height="58" class="note"/><text x="600" y="994" class="nt">저장 금지</text><text x="600" y="1014" class="sm">비밀번호·전체 접속 URL·실제 .env·개인정보·운영 덤프</text><rect x="795" y="970" width="350" height="58" class="note"/><text x="970" y="994" class="nt">중요</text><text x="970" y="1014" class="sm">GitHub에는 DB 데이터가 자동 저장되지 않으므로 재현 SQL을 남김</text><rect x="125" y="1037" width="950" height="18" class="core"/><text x="600" y="1050" class="cv">실행 파일·설명·활동 기록·도식이 실제 결과를 중심으로 연결될 때 재현 가능한 학습 저장소가 된다</text></svg>