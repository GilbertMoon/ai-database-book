<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5568"/></marker><style>text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#1a202c}.t{font-size:24px;font-weight:700}.b{fill:#f7fafc;stroke:#4a5568;stroke-width:2;rx:12}.local{fill:#ebf8ff;stroke:#2b6cb0}.cloud{fill:#fffaf0;stroke:#d69e2e}.ok{fill:#f0fff4;stroke:#38a169}.l{font-size:17px;text-anchor:middle;dominant-baseline:middle}.s{font-size:14px;text-anchor:middle;dominant-baseline:middle}</style></defs><rect width="100%" height="100%" fill="white"/><text x="600" y="40" text-anchor="middle" class="t">로컬 PostgreSQL과 클라우드 PostgreSQL 비교</text><rect x="450" y="90" width="300" height="60" class="b ok"/><text x="600" y="120" class="l">PostgreSQL 실습 환경 선택</text><rect x="130" y="210" width="360" height="330" class="b local"/><text x="310" y="245" class="l">로컬 PostgreSQL</text><text x="310" y="295" class="s">내 컴퓨터에 직접 설치</text><text x="310" y="330" class="s">localhost:5432</text><text x="310" y="365" class="s">DBeaver로 직접 연결</text><text x="310" y="400" class="s">인터넷 없이 실습 가능</text><text x="310" y="435" class="s">설치 오류 가능</text><rect x="710" y="210" width="360" height="330" class="b cloud"/><text x="890" y="245" class="l">클라우드 PostgreSQL</text><text x="890" y="295" class="s">Neon / Supabase</text><text x="890" y="330" class="s">클라우드 접속 URL</text><text x="890" y="365" class="s">DBeaver로 원격 연결</text><text x="890" y="400" class="s">설치 없이 시작 가능</text><text x="890" y="435" class="s">인터넷과 계정 필요</text><line x1="520" y1="150" x2="310" y2="210" stroke="#4a5568" stroke-width="2" marker-end="url(#a)"/><line x1="680" y1="150" x2="890" y2="210" stroke="#4a5568" stroke-width="2" marker-end="url(#a)"/><rect x="450" y="590" width="300" height="55" class="b ok"/><text x="600" y="618" class="l">둘 다 SQL 실행과 테이블 실습 가능</text><line x1=