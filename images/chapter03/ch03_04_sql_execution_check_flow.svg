<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
  <title id="title">SQL로 실습 환경 확인하기</title>
  <desc id="desc">ai_database_book 연결을 선택한 뒤 PostgreSQL 버전, 현재 데이터베이스와 스키마, 현재 사용자와 서버 시각, 계산 결과를 확인하는 흐름</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#475569"/>
    </marker>
    <style>
      text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#172033}
      .title{font-size:30px;font-weight:700;text-anchor:middle;fill:#0f2d5c}
      .box{fill:#eef5ff;stroke:#3174d0;stroke-width:2}
      .sql{fill:#eef9f1;stroke:#2f9a58;stroke-width:2}
      .decision{fill:#fffceb;stroke:#d6a600;stroke-width:2}
      .bad{fill:#fff1f1;stroke:#d64545;stroke-width:2}
      .ok{fill:#eef9f1;stroke:#2f9a58;stroke-width:2}
      .name{font-size:18px;font-weight:700;text-anchor:middle}
      .sub{font-size:14px;text-anchor:middle;fill:#475569}
      .mono{font-size:15px;font-weight:700;text-anchor:middle;font-family:Consolas,D2Coding,"Courier New",monospace;fill:#0f2d5c}
      .line{stroke:#475569;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
      .loop{stroke:#d64545;stroke-width:2.3;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}
      .label{font-size:16px;font-weight:700;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="920" fill="#fff"/>
  <text x="600" y="48" class="title">SQL로 실습 환경 확인하기</text>

  <rect x="420" y="82" width="360" height="58" rx="14" class="box"/>
  <text x="600" y="118" class="name">ai_database_book 연결 선택</text>

  <rect x="420" y="170" width="360" height="58" rx="14" class="box"/>
  <text x="600" y="206" class="name">SQL Editor 열기</text>

  <rect x="390" y="258" width="420" height="76" rx="14" class="sql"/>
  <text x="600" y="287" class="mono">SELECT version();</text>
  <text x="600" y="313" class="sub">PostgreSQL 서버 응답 확인</text>

  <rect x="350" y="365" width="500" height="86" rx="14" class="sql"/>
  <text x="600" y="394" class="mono">current_database() · current_schema()</text>
  <text x="600" y="422" class="sub">현재 DB = ai_database_book · 현재 스키마 = public</text>

  <rect x="350" y="482" width="500" height="86" rx="14" class="sql"/>
  <text x="600" y="511" class="mono">current_user · CURRENT_TIMESTAMP</text>
  <text x="600" y="539" class="sub">접속 사용자와 PostgreSQL 서버 시각 확인</text>

  <rect x="390" y="599" width="420" height="76" rx="14" class="sql"/>
  <text x="600" y="628" class="mono">SELECT 1 + 1 AS result;</text>
  <text x="600" y="654" class="sub">계산 결과 = 2</text>

  <rect x="390" y="706" width="420" height="70" rx="14" class="decision"/>
  <text x="600" y="736" class="name">결과가 예상과 일치하는가?</text>
  <text x="600" y="760" class="sub">서버 · DB · 스키마 · 사용자 · 실행 결과 확인</text>

  <rect x="90" y="815" width="280" height="62" rx="14" class="bad"/>
  <text x="230" y="842" class="name">연결과 현재 위치 재확인</text>
  <text x="230" y="865" class="sub">DB·스키마·사용자부터 점검</text>

  <rect x="830" y="815" width="280" height="62" rx="14" class="ok"/>
  <text x="970" y="842" class="name">실습 환경 준비 완료</text>
  <text x="970" y="865" class="sub">다음 장 SQL 실습으로 이동</text>

  <path d="M600 140V170" class="line"/>
  <path d="M600 228V258" class="line"/>
  <path d="M600 334V365" class="line"/>
  <path d="M600 451V482" class="line"/>
  <path d="M600 568V599" class="line"/>
  <path d="M600 675V706" class="line"/>
  <path d="M500 776L300 815" class="loop"/>
  <text x="410" y="796" class="label" fill="#b42323">아니요</text>
  <path d="M700 776L900 815" class="line"/>
  <text x="790" y="796" class="label" fill="#166534">예</text>
  <path d="M230 815V111H420" class="loop"/>
</svg>
