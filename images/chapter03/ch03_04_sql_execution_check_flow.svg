<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="860" viewBox="0 0 1100 860"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5568"/></marker><style>text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#1a202c}.t{font-size:24px;font-weight:700}.b{fill:#f7fafc;stroke:#4a5568;stroke-width:2;rx:12}.m{fill:#ebf8ff;stroke:#2b6cb0}.g{fill:#f0fff4;stroke:#38a169}.y{fill:#fffaf0;stroke:#d69e2e}.l{font-size:16px;text-anchor:middle;dominant-baseline:middle}.s{font-size:13px;text-anchor:middle;dominant-baseline:middle}</style></defs><rect width="100%" height="100%" fill="white"/><text x="550" y="40" text-anchor="middle" class="t">기본 SQL 실행 확인 흐름</text><g transform="translate(350,85)"><rect x="0" y="0" width="400" height="58" class="b m"/><text x="200" y="29" class="l">ai_database_book 데이터베이스 연결</text><rect x="0" y="95" width="400" height="58" class="b"/><text x="200" y="124" class="l">SQL Editor 열기</text><rect x="0" y="190" width="400" height="58" class="b y"/><text x="200" y="219" class="l">SELECT version();</text><rect x="0" y="285" width="400" height="58" class="b g"/><text x="200" y="314" class="l">PostgreSQL 버전 확인</text><rect x="0" y="380" width="400" height="58" class="b y"/><text x="200" y="409" class="l">SELECT current_database();</text><rect x="0" y="475" width="400" height="58" class="b g"/><text x="200" y="504" class="l">현재 DB 확인</text><rect x="0" y="570" width="400" height="58" class="b y"/><text x="200" y="599" class="l">SELECT 1 + 1 AS result;</text><rect x="0" y="665" width="400" height="58" class="b g"/><text x="200" y="694" class="l">결과 2 확인</text></g><line x1="550" y1="143" x2="550" y2="180" stroke="#4a5568" stroke-width="2" marker-end="url(#a)"/><line x1="550" y1="238" x2="550" y2="275" stroke="#4a5568" stroke-width="2" marker-end="url(#a)"/><line x1="550" y1="333" x2="550" y2="370" stroke="#4a5568" stroke-width="2" marker-end="url(#a)"/><line x1="550" y1="428" x2="550" y2="465" stroke="#4a5568" stroke-width="2" marker-end="url(#a)"/><line x1="550" y1="523" x2="550" y2="560" stroke="#4a5568" stroke-width="2" marker-end="url(#a)"/><line x1="550" y1="618" x2="550" y2="655" stroke="#4a5568" stroke-width="2" marker-end="url(#a)"/><rect x="225" y="810" width="650" height="40" class="b m"/><text x="550" y="831" class="s">세 가지 SQL이 모두 실행되면 기본 연결과 SQL 실행 환경이 준비된 것이다.</text></svg>