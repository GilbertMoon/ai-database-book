<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">기본 SQL로 데이터베이스 환경 확인하기</title>
  <desc id="desc">ai_database_book 연결 선택 후 세 가지 기본 SQL을 순서대로 실행하여 PostgreSQL 버전, 현재 DB, 계산 결과를 확인하는 흐름</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#475569"/>
    </marker>
    <style>
      text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#172033}
      .title{font-size:30px;font-weight:700;text-anchor:middle;fill:#0f2d5c}
      .box{fill:#eef5ff;stroke:#3174d0;stroke-width:2}
      .sql{fill:#eef9f1;stroke:#2f9a58;stroke-width:2}
      .decision{fill:#fffceb;stroke:#d6a600;stroke-width:2}
      .bad{fill:#fff1f1;stroke:#d64545;stroke-width:2}
      .ok{fill:#eef9f1;stroke:#2f9a58;stroke-width:2}
      .name{font-size:18px;font-weight:700;text-anchor:middle}
      .sub{font-size:14px;text-anchor:middle;fill:#475569}
      .mono{font-size:15px;font-weight:700;text-anchor:middle;font-family:Consolas,D2Coding,"Courier New",monospace;fill:#0f2d5c}
      .line{stroke:#475569;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
      .loop{stroke:#d64545;stroke-width:2.3;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}
      .label{font-size:16px;font-weight:700;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#fff"/>
  <text x="600" y="48" class="title">기본 SQL로 데이터베이스 환경 확인하기</text>

  <rect x="420" y="82" width="360" height="58" rx="14" class="box"/><text x="600" y="118" class="name">ai_database_book 연결 선택</text>
  <rect x="420" y="170" width="360" height="58" rx="14" class="box"/><text x="600" y="206" class="name">SQL Editor 열기</text>

  <rect x="390" y="258" width="420" height="76" rx="14" class="sql"/>
  <text x="600" y="287" class="mono">SELECT version();</text>
  <text x="600" y="313" class="sub">PostgreSQL 버전 문자열 확인</text>

  <rect x="390" y="365" width="420" height="76" rx="14" class="sql"/>
  <text x="600" y="394" class="mono">SELECT current_database();</text>
  <text x="600" y="420" class="sub">현재 DB: ai_database_book</text>

  <rect x="390" y="472" width="420" height="76" rx="14" class="sql"/>
  <text x="600" y="501" class="mono">SELECT 1 + 1 AS result;</text>
  <text x="600" y="527" class="sub">계산 결과: 2</text>

  <rect x="390" y="580" width="420" height="68" rx="14" class="decision"/>
  <text x="600" y="609" class="name">세 결과가 예상과 일치하는가?</text>
  <text x="600" y="633" class="sub">버전 · 현재 DB · 계산 결과 확인</text>
  <rect x="105" y="590" width="240" height="58" rx="14" class="bad"/>
  <text x="225" y="625" class="name">연결·DB·실행 상태 재확인</text>
  <rect x="855" y="590" width="240" height="58" rx="14" class="ok"/>
  <text x="975" y="625" class="name">기본 환경 준비 완료</text>

  <path d="M600 140V170" class="line"/><path d="M600 228V258" class="line"/>
  <path d="M600 334V365" class="line"/><path d="M600 441V472" class="line"/>
  <path d="M600 548V580" class="line"/>
  <path d="M390 614H345" class="loop"/><text x="365" y="600" class="label" fill="#b42323">아니요</text>
  <path d="M225 590V111H420" class="loop"/>
  <path d="M810 614H855" class="line"/><text x="833" y="600" class="label" fill="#166534">예</text>
</svg>
