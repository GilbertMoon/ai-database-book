<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#4a5568"/></marker><style>text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#1a202c}.title{font-size:24px;font-weight:700}.box{fill:#f7fafc;stroke:#4a5568;stroke-width:2;rx:10;ry:10}.main{fill:#ebf8ff;stroke:#2b6cb0}.ok{fill:#f0fff4;stroke:#38a169}.bad{fill:#fff5f5;stroke:#e53e3e}.guard{fill:#fffaf0;stroke:#d69e2e}.label{font-size:16px;text-anchor:middle;dominant-baseline:middle}.small{font-size:13px;text-anchor:middle;dominant-baseline:middle}</style></defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="600" y="40" text-anchor="middle" class="title">제약조건은 잘못된 데이터를 막는 안전장치</text>
  <rect x="80" y="100" width="210" height="70" class="box main"/><text x="185" y="135" class="label">입력 데이터</text>
  <rect x="430" y="90" width="340" height="90" class="box guard"/><text x="600" y="124" class="label">제약조건 검사</text><text x="600" y="150" class="small">PRIMARY KEY · FOREIGN KEY · NOT NULL · UNIQUE · CHECK · DEFAULT</text>
  <line x1="290" y1="135" x2="430" y2="135" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="110" y="260" width="150" height="58" class="box"/><text x="185" y="289" class="label">PRIMARY KEY</text>
    <rect x="285" y="260" width="150" height="58" class="box"/><text x="360" y="289" class="label">FOREIGN KEY</text>
    <rect x="460" y="260" width="150" height="58" class="box"/><text x="535" y="289" class="label">NOT NULL</text>
    <rect x="635" y="260" width="150" height="58" class="box"/><text x="710" y="289" class="label">UNIQUE</text>
    <rect x="810" y="260" width="150" height="58" class="box"/><text x="885" y="289" class="label">CHECK</text>
    <rect x="985" y="260" width="150" height="58" class="box"/><text x="1060" y="289" class="label">DEFAULT</text>
  </g>
  <line x1="600" y1="180" x2="185" y2="260" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/><line x1="600" y1="180" x2="360" y2="260" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/><line x1="600" y1="180" x2="535" y2="260" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/><line x1="600" y1="180" x2="710" y2="260" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/><line x1="600" y1="180" x2="885" y2="260" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/><line x1="600" y1="180" x2="1060" y2="260" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="270" y="430" width="250" height="80" class="box ok"/><text x="395" y="465" class="label">검사 통과</text><text x="395" y="492" class="small">테이블에 저장</text>
  <rect x="680" y="430" width="250" height="80" class="box bad"/><text x="805" y="465" class="label">검사 실패</text><text x="805" y="492" class="small">오류 발생 · 저장 차단</text>
  <line x1="535" y1="318" x2="395" y2="430" stroke="#38a169" stroke-width="2" marker-end="url(#arrow)"/><line x1="710" y1="318" x2="805" y2="430" stroke="#e53e3e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="220" y="580" width="760" height="55" class="box main"/><text x="600" y="608" class="label">제약조건은 DBMS가 데이터 품질을 지키도록 돕는 최소한의 규칙이다.</text>
</svg>