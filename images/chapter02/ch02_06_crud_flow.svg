<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1240" viewBox="0 0 1200 1240" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
  <title id="title">CRUD와 SQL 명령어 흐름</title>
  <desc id="desc">서비스의 생성, 조회, 수정, 삭제 요청을 INSERT, SELECT, UPDATE, DELETE SQL 명령으로 연결하고, DBMS의 문법, 객체, 권한, 제약조건과 트랜잭션 처리를 거쳐 결과 집합, 영향받은 행 수, 오류를 검증하는 전체 흐름을 설명한다.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#c2413b"/>
    </marker>
    <style>
      text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}
      .title{font-size:30px;font-weight:700;text-anchor:middle}
      .subtitle{font-size:16px;text-anchor:middle;fill:#475569}
      .section-title{font-size:19px;font-weight:700}
      .section-sub{font-size:14px;fill:#475569}
      .card-title{font-size:18px;font-weight:700;text-anchor:middle}
      .card-main{font-size:14px;font-weight:600;text-anchor:middle}
      .card-sub{font-size:13px;text-anchor:middle;fill:#475569}
      .sql{font-family:Consolas,Menlo,monospace;font-size:12.5px;text-anchor:middle;fill:#334155}
      .sql-title{font-size:19px;font-weight:700;text-anchor:middle}
      .result-title{font-size:13.5px;font-weight:700;text-anchor:middle}
      .result-sub{font-size:12.5px;text-anchor:middle;fill:#475569}
      .process-title{font-size:15px;font-weight:700;text-anchor:middle}
      .process-sub{font-size:12.5px;text-anchor:middle;fill:#475569}
      .badge-text{font-size:12px;font-weight:700;text-anchor:middle;dominant-baseline:middle;fill:#fff}
      .note-title{font-size:14px;font-weight:700;fill:#92400e}
      .note-text{font-size:13px;fill:#475569}
      .decision{font-size:14px;font-weight:700;text-anchor:middle}
      .flow-label{font-size:12px;font-weight:700;text-anchor:middle}
      .principle-label{font-size:16px;font-weight:700;fill:#166534}
      .principle-main{font-size:19px;font-weight:700;text-anchor:middle;fill:#166534}
      .principle-sub{font-size:13.5px;text-anchor:middle;fill:#3f6f50}
      .arrow{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .arrow-red{stroke:#c2413b;stroke-width:2.2;fill:none;stroke-dasharray:7 5;marker-end:url(#arrow-red)}
    </style>
  </defs>

  <rect width="1200" height="1240" fill="#ffffff"/>

  <text x="600" y="43" class="title">CRUD와 SQL 명령어 흐름</text>
  <text x="600" y="74" class="subtitle">CRUD는 서비스의 데이터 처리 목적이고, INSERT·SELECT·UPDATE·DELETE는 이를 구현하는 대표적인 SQL DML 명령이다</text>

  <rect x="325" y="102" width="550" height="72" rx="16" fill="#24497a" stroke="#17355c" stroke-width="1.8"/>
  <text x="600" y="139" font-size="19" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">사용자·서비스의 데이터 처리 요청</text>
  <text x="600" y="160" font-size="12.5" text-anchor="middle" fill="#dbeafe">등록 · 조회 · 변경 · 삭제 요구사항</text>
  <path d="M600 174 V205" class="arrow"/>

  <rect x="34" y="205" width="1132" height="455" rx="16" fill="#f8fafc" stroke="#a8b3c4" stroke-width="1.6"/>
  <text x="58" y="239" class="section-title">1. 서비스 기능을 CRUD와 SQL로 연결</text>
  <text x="395" y="239" class="section-sub">행을 다루는 네 가지 기본 작업과 대표 명령</text>

  <rect x="55" y="270" width="250" height="112" rx="12" fill="#f2fbf5" stroke="#3c9a5f" stroke-width="1.7"/>
  <circle cx="80" cy="295" r="15" fill="#2f855a"/><text x="80" y="295" class="badge-text">C</text>
  <text x="180" y="303" class="card-title">Create · 생성</text>
  <text x="180" y="334" class="card-main">새 학생 등록</text>
  <text x="180" y="360" class="card-sub">새로운 행을 추가</text>
  <path d="M180 382 V404" class="arrow"/>
  <rect x="55" y="404" width="250" height="105" rx="11" fill="#ffffff" stroke="#3c9a5f" stroke-width="1.6"/>
  <text x="180" y="432" class="sql-title" fill="#166534">INSERT</text>
  <text x="180" y="461" class="sql">INSERT INTO students</text>
  <text x="180" y="481" class="sql">(...) VALUES (...);</text>
  <rect x="70" y="527" width="220" height="64" rx="10" fill="#ffffff" stroke="#86b99a" stroke-width="1.3"/>
  <text x="180" y="551" class="result-title" fill="#166534">실행 결과</text>
  <text x="180" y="575" class="result-sub">추가된 행 수 · 생성된 id</text>

  <rect x="335" y="270" width="250" height="112" rx="12" fill="#eef5ff" stroke="#3b82c4" stroke-width="1.7"/>
  <circle cx="360" cy="295" r="15" fill="#2f6fad"/><text x="360" y="295" class="badge-text">R</text>
  <text x="460" y="303" class="card-title">Read · 조회</text>
  <text x="460" y="334" class="card-main">학생 목록·상세 조회</text>
  <text x="460" y="360" class="card-sub">필요한 행과 열을 읽음</text>
  <path d="M460 382 V404" class="arrow"/>
  <rect x="335" y="404" width="250" height="105" rx="11" fill="#ffffff" stroke="#3b82c4" stroke-width="1.6"/>
  <text x="460" y="432" class="sql-title" fill="#1e4f91">SELECT</text>
  <text x="460" y="461" class="sql">SELECT ... FROM students</text>
  <text x="460" y="481" class="sql">WHERE id = 1;</text>
  <rect x="350" y="527" width="220" height="64" rx="10" fill="#ffffff" stroke="#8fb3df" stroke-width="1.3"/>
  <text x="460" y="551" class="result-title" fill="#1e4f91">실행 결과</text>
  <text x="460" y="575" class="result-sub">결과 집합 · 조회된 행 수</text>

  <rect x="615" y="270" width="250" height="112" rx="12" fill="#fff8e8" stroke="#d69e2e" stroke-width="1.7"/>
  <circle cx="640" cy="295" r="15" fill="#b7791f"/><text x="640" y="295" class="badge-text">U</text>
  <text x="740" y="303" class="card-title">Update · 수정</text>
  <text x="740" y="334" class="card-main">이메일·전공 변경</text>
  <text x="740" y="360" class="card-sub">조건에 맞는 기존 행을 변경</text>
  <path d="M740 382 V404" class="arrow"/>
  <rect x="615" y="404" width="250" height="105" rx="11" fill="#ffffff" stroke="#d69e2e" stroke-width="1.6"/>
  <text x="740" y="432" class="sql-title" fill="#92400e">UPDATE</text>
  <text x="740" y="461" class="sql">UPDATE students SET ...</text>
  <text x="740" y="481" class="sql">WHERE id = 1;</text>
  <rect x="630" y="527" width="220" height="64" rx="10" fill="#ffffff" stroke="#d9af60" stroke-width="1.3"/>
  <text x="740" y="551" class="result-title" fill="#92400e">실행 결과</text>
  <text x="740" y="575" class="result-sub">영향받은 행 수 · 변경값</text>

  <rect x="895" y="270" width="250" height="112" rx="12" fill="#fff3f2" stroke="#d9534f" stroke-width="1.7"/>
  <circle cx="920" cy="295" r="15" fill="#c2413b"/><text x="920" y="295" class="badge-text">D</text>
  <text x="1020" y="303" class="card-title">Delete · 삭제</text>
  <text x="1020" y="334" class="card-main">학생 행 물리 삭제</text>
  <text x="1020" y="360" class="card-sub">조건에 맞는 행을 제거</text>
  <path d="M1020 382 V404" class="arrow"/>
  <rect x="895" y="404" width="250" height="105" rx="11" fill="#ffffff" stroke="#d9534f" stroke-width="1.6"/>
  <text x="1020" y="432" class="sql-title" fill="#b42318">DELETE</text>
  <text x="1020" y="461" class="sql">DELETE FROM students</text>
  <text x="1020" y="481" class="sql">WHERE id = 1;</text>
  <rect x="910" y="527" width="220" height="64" rx="10" fill="#ffffff" stroke="#de9692" stroke-width="1.3"/>
  <text x="1020" y="551" class="result-title" fill="#b42318">실행 결과</text>
  <text x="1020" y="575" class="result-sub">삭제된 행 수 · 제약 오류</text>

  <rect x="120" y="610" width="960" height="34" rx="10" fill="#fff8e8" stroke="#d69e2e" stroke-width="1.3"/>
  <text x="145" y="632" class="note-title">용어 구분</text>
  <text x="232" y="632" class="note-text">CRUD의 Create는 INSERT를 뜻하며, CREATE TABLE은 테이블 구조를 만드는 DDL이다. 소프트 삭제는 DELETE가 아니라 UPDATE로 상태값을 변경한다.</text>

  <path d="M600 660 V690" class="arrow"/>

  <rect x="34" y="690" width="1132" height="340" rx="16" fill="#f4f8ff" stroke="#93b4e6" stroke-width="1.6"/>
  <text x="58" y="724" class="section-title">2. SQL 실행과 결과 검증</text>
  <text x="300" y="724" class="section-sub">DBMS 처리와 애플리케이션의 검증을 구분해 확인</text>

  <rect x="58" y="758" width="190" height="116" rx="11" fill="#ffffff" stroke="#64748b" stroke-width="1.4"/>
  <circle cx="82" cy="782" r="14" fill="#64748b"/><text x="82" y="782" class="badge-text">1</text>
  <text x="153" y="792" class="process-title">SQL·파라미터 준비</text>
  <text x="153" y="823" class="process-sub">테이블·열·WHERE 조건</text>
  <text x="153" y="846" class="process-sub">입력값을 명령과 분리</text>

  <rect x="276" y="758" width="190" height="116" rx="11" fill="#ffffff" stroke="#3b82c4" stroke-width="1.4"/>
  <circle cx="300" cy="782" r="14" fill="#2f6fad"/><text x="300" y="782" class="badge-text">2</text>
  <text x="371" y="792" class="process-title">문법·객체·권한 확인</text>
  <text x="371" y="823" class="process-sub">SQL 파싱과 이름 해석</text>
  <text x="371" y="846" class="process-sub">실행 권한 검사</text>

  <rect x="494" y="758" width="190" height="116" rx="11" fill="#ffffff" stroke="#7c5cc4" stroke-width="1.4"/>
  <circle cx="518" cy="782" r="14" fill="#6b46a8"/><text x="518" y="782" class="badge-text">3</text>
  <text x="589" y="792" class="process-title">제약조건·트랜잭션</text>
  <text x="589" y="823" class="process-sub">PK·FK·NOT NULL 등</text>
  <text x="589" y="846" class="process-sub">COMMIT·ROLLBACK 범위</text>

  <rect x="712" y="758" width="190" height="116" rx="11" fill="#ffffff" stroke="#3c9a5f" stroke-width="1.4"/>
  <circle cx="736" cy="782" r="14" fill="#2f855a"/><text x="736" y="782" class="badge-text">4</text>
  <text x="807" y="792" class="process-title">테이블 읽기·변경</text>
  <text x="807" y="823" class="process-sub">students 행 조회</text>
  <text x="807" y="846" class="process-sub">또는 추가·수정·삭제</text>

  <rect x="930" y="758" width="190" height="116" rx="11" fill="#ffffff" stroke="#d69e2e" stroke-width="1.4"/>
  <circle cx="954" cy="782" r="14" fill="#b7791f"/><text x="954" y="782" class="badge-text">5</text>
  <text x="1025" y="792" class="process-title">결과 반환</text>
  <text x="1025" y="823" class="process-sub">결과 집합·행 수</text>
  <text x="1025" y="846" class="process-sub">생성 id·오류 정보</text>

  <path d="M248 816 H276" class="arrow"/>
  <path d="M466 816 H494" class="arrow"/>
  <path d="M684 816 H712" class="arrow"/>
  <path d="M902 816 H930" class="arrow"/>

  <path d="M1025 874 V900 H805" class="arrow"/>
  <polygon points="805,888 930,930 805,972 680,930" fill="#fff8e8" stroke="#b7791f" stroke-width="1.7"/>
  <text x="805" y="926" class="decision">요구사항·예상 행 수와</text>
  <text x="805" y="946" class="decision">실제 결과가 일치하는가?</text>

  <rect x="970" y="905" width="150" height="50" rx="10" fill="#ecfdf3" stroke="#3c9a5f" stroke-width="1.4"/>
  <text x="1045" y="927" class="flow-label" fill="#166534">예</text>
  <text x="1045" y="946" class="process-sub">처리 완료</text>
  <path d="M930 930 H970" class="arrow"/>

  <rect x="410" y="905" width="190" height="50" rx="10" fill="#fff3f2" stroke="#d9534f" stroke-width="1.4"/>
  <text x="505" y="927" class="flow-label" fill="#b42318">아니오·오류</text>
  <text x="505" y="946" class="process-sub">조건 수정·롤백·재실행</text>
  <path d="M680 930 H600" class="arrow-red"/>
  <path d="M410 930 H350 V900 H153 V874" class="arrow-red"/>

  <rect x="54" y="1052" width="535" height="92" rx="11" fill="#fff8e8" stroke="#d69e2e" stroke-width="1.4"/>
  <text x="78" y="1080" class="note-title">UPDATE·DELETE 안전 확인</text>
  <text x="78" y="1107" class="note-text">실행 전에 같은 WHERE 조건으로 SELECT하여 대상 행을 확인한다.</text>
  <text x="78" y="1131" class="note-text">WHERE가 없으면 모든 행이 대상이 될 수 있으므로 영향받은 행 수도 점검한다.</text>

  <rect x="611" y="1052" width="535" height="92" rx="11" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="635" y="1080" font-size="14" font-weight="700" fill="#334155">삭제 정책과 트랜잭션</text>
  <text x="635" y="1107" class="note-text">복구·감사·보존이 필요하면 UPDATE를 이용한 소프트 삭제를 검토한다.</text>
  <text x="635" y="1131" class="note-text">변경 명령의 확정·취소는 자동 커밋과 트랜잭션 설정에 따라 달라진다.</text>

  <rect x="70" y="1166" width="1060" height="58" rx="13" fill="#ecfdf3" stroke="#62b47a" stroke-width="1.7"/>
  <rect x="70" y="1166" width="205" height="58" rx="13" fill="#dcf7e5" stroke="#62b47a" stroke-width="1.7"/>
  <text x="172" y="1201" class="principle-label" text-anchor="middle">핵심 원칙</text>
  <text x="690" y="1192" class="principle-main">서비스 요청 → SQL 실행 → DBMS 처리 → 결과 검증</text>
  <text x="690" y="1215" class="principle-sub">SQL이 오류 없이 실행된 것뿐 아니라, 조회 결과와 영향받은 행 수까지 확인해야 작업이 완료된다.</text>
</svg>