  <rect x="330" y="120" width="170" height="70" class="box main"/><text x="415" y="155" class="label">Read</text><text x="415" y="178" class="small">학생 조회</text>
  <rect x="590" y="120" width="170" height="70" class="box main"/><text x="675" y="155" class="label">Update</text><text x="675" y="178" class="small">이메일 수정</text>
  <rect x="850" y="120" width="170" height="70" class="box main"/><text x="935" y="155" class="label">Delete</text><text x="935" y="178" class="small">학생 삭제</text>
