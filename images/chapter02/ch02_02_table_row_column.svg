<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">테이블, 행, 열과 셀의 구조</title>
  <desc id="desc">students 테이블에서 전체 테이블, 한 행, major 열, 행과 열이 만나는 셀을 강조한 구조 설명</desc>
  <style>
    text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#172033}
    .title{font-size:32px;font-weight:700;text-anchor:middle;fill:#0f2d5c}
    .label{font-size:16px;font-weight:700;text-anchor:middle}
    .hint{font-size:14px;text-anchor:middle;fill:#475569}
    .cell{fill:#fff;stroke:#64748b;stroke-width:1.4}
    .head{fill:#e9f2fe;font-weight:700}
    .row{fill:#fff6e6}
    .col{fill:#eef9f1}
    .hit{fill:#f2e9ff;stroke:#7c4dcb;stroke-width:2.4}
    .table-border{fill:none;stroke:#2f5f9f;stroke-width:3}
    .call{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.8}
    .line{stroke:#475569;stroke-width:2;fill:none}
    .t{font-size:15px;text-anchor:middle}
    .th{font-size:16px;font-weight:700;text-anchor:middle}

    .call-table{fill:#eff6ff;stroke:#2f5f9f;stroke-width:2.2}
    .call-table-text{fill:#1d4f91}
    .line-table{stroke:#2f5f9f;stroke-width:2.4;fill:none}

    .call-row{fill:#fff7e8;stroke:#e59e0b;stroke-width:2.2}
    .call-row-text{fill:#b45309}
    .line-row{stroke:#e59e0b;stroke-width:2.4;fill:none}

    .call-col{fill:#effcf3;stroke:#22a55a;stroke-width:2.2}
    .call-col-text{fill:#15803d}
    .line-col{stroke:#22a55a;stroke-width:2.4;fill:none}

    .call-cell{fill:#f6f0ff;stroke:#7c4dcb;stroke-width:2.2}
    .call-cell-text{fill:#6d28d9}
    .line-cell{stroke:#7c4dcb;stroke-width:2.4;fill:none}
  </style>
  <rect width="1200" height="650" fill="#fff"/>
  <text x="600" y="48" class="title">테이블, 행, 열과 셀의 구조</text>

  <text x="600" y="93" class="label">students 테이블</text>
  <rect x="250" y="115" width="700" height="280" class="table-border" rx="8"/>

  <rect x="250" y="115" width="150" height="56" class="cell head"/><text x="325" y="150" class="th">id</text>
  <rect x="400" y="115" width="170" height="56" class="cell head"/><text x="485" y="150" class="th">name</text>
  <rect x="570" y="115" width="230" height="56" class="cell head"/><text x="685" y="150" class="th">email</text>
  <rect x="800" y="115" width="150" height="56" class="cell head col"/><text x="875" y="150" class="th">major</text>

  <rect x="250" y="171" width="150" height="74" class="cell row"/><text x="325" y="215" class="t">1</text>
  <rect x="400" y="171" width="170" height="74" class="cell row"/><text x="485" y="215" class="t">김민지</text>
  <rect x="570" y="171" width="230" height="74" class="cell row"/><text x="685" y="215" class="t">minji@example.com</text>
  <rect x="800" y="171" width="150" height="74" class="hit"/><text x="875" y="215" class="t">컴퓨터공학</text>

  <rect x="250" y="245" width="150" height="74" class="cell"/><text x="325" y="289" class="t">2</text>
  <rect x="400" y="245" width="170" height="74" class="cell"/><text x="485" y="289" class="t">이준호</text>
  <rect x="570" y="245" width="230" height="74" class="cell"/><text x="685" y="289" class="t">junho@example.com</text>
  <rect x="800" y="245" width="150" height="74" class="cell col"/><text x="875" y="289" class="t">데이터사이언스</text>

  <rect x="250" y="319" width="150" height="76" class="cell"/><text x="325" y="364" class="t">3</text>
  <rect x="400" y="319" width="170" height="76" class="cell"/><text x="485" y="364" class="t">박서연</text>
  <rect x="570" y="319" width="230" height="76" class="cell"/><text x="685" y="364" class="t">seoyeon@example.com</text>
  <rect x="800" y="319" width="150" height="76" class="cell col"/><text x="875" y="364" class="t">경영학</text>

  <rect x="55" y="125" width="175" height="70" rx="12" class="call-table"/>
  <text x="142" y="151" class="label call-table-text">테이블 (Table)</text>
  <text x="142" y="177" class="hint">기록의 집합</text>
  <path d="M230 160H250" class="line-table"/>

  <rect x="55" y="218" width="175" height="70" rx="12" class="call-row"/>
  <text x="142" y="246" class="label call-row-text">행 (Row)</text>
  <text x="142" y="266" class="hint">하나의 기록</text>
  <path d="M230 235H250" class="line-row"/>

  <rect x="970" y="133" width="175" height="70" rx="12" class="call-col"/>
  <text x="1058" y="159" class="label call-col-text">열 (Column)</text>
  <text x="1058" y="185" class="hint">데이터 항목</text>
  <path d="M970 168H875V159" class="line-col"/>

  <rect x="970" y="270" width="175" height="70" rx="12" class="call-cell"/>
  <text x="1058" y="296" class="label call-cell-text">셀 (Cell)</text>
  <text x="1058" y="322" class="hint">하나의 값</text>
  <path d="M970 305H875V235" class="line-cell"/>

  <text x="600" y="475" class="label">행과 열이 만나는 지점이 셀이다.</text>
  <text x="600" y="505" class="hint">SQL을 읽을 때는 어떤 테이블의 어떤 열을 기준으로 어떤 행을 다루는지 함께 확인한다.</text>
</svg>
