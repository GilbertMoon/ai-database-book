<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">외래키로 연결되는 학생·강의·수강신청 관계</title>
  <desc id="desc">students와 courses의 기본키를 enrollments의 외래키가 참조하여 수강신청 연결 테이블을 구성하는 관계도</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7c4dcb"/>
    </marker>
    <style>
      text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#172033}
      .title{font-size:30px;font-weight:700;text-anchor:middle;fill:#0f2d5c}
      .entity{fill:#f8fafc;stroke:#475569;stroke-width:2}
      .head{fill:#e9f2fe;stroke:#3174d0;stroke-width:2}
      .bridge{fill:#f5f0ff;stroke:#7c4dcb;stroke-width:2}
      .name{font-size:21px;font-weight:700;text-anchor:middle}
      .type{font-size:13px;font-weight:700;text-anchor:middle;fill:#475569}
      .field{font-size:16px;fill:#334155}
      .pk{font-size:16px;font-weight:700;fill:#1f5fb8}
      .fk{font-size:16px;font-weight:700;fill:#7c4dcb}
      .ref{stroke:#7c4dcb;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
      .rel{stroke:#475569;stroke-width:2.4;fill:none}
      .card{font-size:18px;font-weight:700;text-anchor:middle;fill:#0f2d5c}
      .label{font-size:15px;font-weight:700;text-anchor:middle;fill:#334155}
      .note{font-size:17px;font-weight:700;text-anchor:middle;fill:#0f2d5c}
    </style>
  </defs>
  <rect width="1200" height="640" fill="#fff"/>
  <text x="600" y="48" class="title">외래키로 연결되는 학생·강의·수강신청 관계</text>

  <rect x="80" y="180" width="270" height="150" rx="12" class="entity"/>
  <rect x="80" y="180" width="270" height="50" rx="12" class="head"/>
  <text x="215" y="204" class="name">students</text>
  <text x="215" y="223" class="type">학생</text>
  <text x="110" y="263" class="pk">PK id</text>
  <text x="110" y="294" class="field">name</text>

  <rect x="465" y="145" width="270" height="220" rx="12" class="bridge"/>
  <rect x="465" y="145" width="270" height="50" rx="12" class="bridge"/>
  <text x="600" y="169" class="name">enrollments</text>
  <text x="600" y="188" class="type">연결 테이블</text>
  <text x="495" y="225" class="pk">PK id</text>
  <text x="495" y="257" class="fk">FK student_id</text>
  <text x="495" y="289" class="fk">FK course_id</text>
  <text x="495" y="321" class="field">status</text>

  <rect x="850" y="180" width="270" height="150" rx="12" class="entity"/>
  <rect x="850" y="180" width="270" height="50" rx="12" class="head"/>
  <text x="985" y="204" class="name">courses</text>
  <text x="985" y="223" class="type">강의</text>
  <text x="880" y="263" class="pk">PK id</text>
  <text x="880" y="294" class="field">title</text>

  <path d="M465 257H350" class="ref"/>
  <text x="407" y="238" class="label">FK가 PK 참조</text>
  <path d="M735 289H850" class="ref"/>
  <text x="793" y="270" class="label">FK가 PK 참조</text>

  <path d="M350 360H465" class="rel"/>
  <text x="372" y="350" class="card">1</text>
  <text x="445" y="350" class="card">N</text>
  <text x="407" y="388" class="label">학생별 신청</text>

  <path d="M735 360H850" class="rel"/>
  <text x="755" y="350" class="card">N</text>
  <text x="828" y="350" class="card">1</text>
  <text x="792" y="388" class="label">강의별 신청</text>

  <text x="600" y="470" class="label">참조 방향: enrollments.student_id → students.id, enrollments.course_id → courses.id</text>
  <text x="600" y="545" class="note">기본키는 행을 식별하고 외래키는 다른 테이블의 행을 참조한다.</text>
</svg>
