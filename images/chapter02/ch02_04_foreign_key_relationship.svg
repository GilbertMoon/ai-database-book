<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#4a5568"/></marker><style>text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#1a202c}.title{font-size:24px;font-weight:700}.entity{fill:#f7fafc;stroke:#4a5568;stroke-width:2;rx:8;ry:8}.head{fill:#ebf8ff;stroke:#2b6cb0;stroke-width:2;rx:8;ry:8}.name{font-size:18px;font-weight:700;text-anchor:middle;dominant-baseline:middle}.field{font-size:15px}.rel{font-size:15px;text-anchor:middle}.cap{fill:#edf2f7;stroke:#718096;stroke-width:2;rx:10;ry:10}</style></defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="600" y="38" text-anchor="middle" class="title">외래키로 연결되는 학생-강의-수강신청 관계</text>
  <g><rect x="90" y="150" width="250" height="160" class="entity"/><rect x="90" y="150" width="250" height="44" class="head"/><text x="215" y="172" class="name">students</text><text x="115" y="220" class="field">id (PK)</text><text x="115" y="250" class="field">name</text><text x="115" y="280" class="field">email</text></g>
  <g><rect x="850" y="150" width="250" height="160" class="entity"/><rect x="850" y="150" width="250" height="44" class="head"/><text x="975" y="172" class="name">courses</text><text x="875" y="220" class="field">id (PK)</text><text x="875" y="250" class="field">title</text><text x="875" y="280" class="field">price</text></g>
  <g><rect x="430" y="390" width="340" height="210" class="entity"/><rect x="430" y="390" width="340" height="44" class="head"/><text x="600" y="412" class="name">enrollments</text><text x="455" y="462" class="field">id (PK)</text><text x="455" y="492" class="field">student_id (FK → students.id)</text><text x="455" y="522" class="field">course_id (FK → courses.id)</text><text x="455" y="552" class="field">status</text><text x="455" y="582" class="field">enrolled_at</text></g>
  <line x1="340" y1="230" x2="500" y2="390" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/><text x="420" y="290" class="rel">students.id 참조</text>
  <line x1="850" y1="230" x2="700" y2="390" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/><text x="790" y="290" class="rel">courses.id 참조</text>
  <rect x="160" y="640" width="880" height="50" class="cap"/><text x="600" y="665" class="rel" style="font-size:17px;">외래키는 다른 테이블의 기본키를 참조하여 테이블 간 관계를 만든다.</text>
</svg>