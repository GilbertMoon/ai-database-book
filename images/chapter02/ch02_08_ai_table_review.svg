<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="white"/><text x="600" y="42" text-anchor="middle" font-size="28" font-weight="700">AI 생성 테이블 구조 검토 흐름</text><text x="600" y="72" text-anchor="middle" font-size="15" fill="#475569">AI의 첫 설계는 초안이며 구조와 실제 동작을 사람이 검증해야 한다</text><rect x="70" y="110" width="280" height="90" rx="12" fill="#eef5ff" stroke="#3b82c4" stroke-width="2"/><text x="210" y="142" text-anchor="middle" font-size="17" font-weight="700">요구사항 정리</text><text x="210" y="170" text-anchor="middle" font-size="13">대상·관계·필수값·중복 금지</text><rect x="460" y="110" width="280" height="90" rx="12" fill="#f5f1ff" stroke="#7c5cc4" stroke-width="2"/><text x="600" y="142" text-anchor="middle" font-size="17" font-weight="700">AI 설계 초안</text><text x="600" y="170" text-anchor="middle" font-size="13">테이블·컬럼·PK/FK·관계</text><rect x="850" y="110" width="280" height="90" rx="12" fill="#fff8e8" stroke="#d69e2e" stroke-width="2"/><text x="990" y="142" text-anchor="middle" font-size="17" font-weight="700">가정과 누락 확인</text><text x="990" y="170" text-anchor="middle" font-size="13">확정 요구와 AI 추정 구분</text><line x1="350" y1="155" x2="460" y2="155" stroke="#475569" stroke-width="2"/><line x1="740" y1="155" x2="850" y2="155" stroke="#475569" stroke-width="2"/><rect x="35" y="240" width="1130" height="225" rx="15" fill="#f8fafc" stroke="#a8b3c4" stroke-width="2"/><text x="60" y="275" font-size="19" font-weight="700">구조 검토</text><rect x="60" y="305" width="200" height="120" rx="10" fill="white" stroke="#3b82c4" stroke-width="2"/><text x="160" y="337" text-anchor="middle" font-size="15" font-weight="700">테이블 역할</text><text x="160" y="368" text-anchor="middle" font-size="12">한 테이블이 한 책임을</text><text x="160" y="390" text-anchor="middle" font-size="12">가지는가?</text><rect x="280" y="305" width="200" height="120" rx="10" fill="white" stroke="#7c5cc4" stroke-width="2"/><text x="380" y="337" text-anchor="middle" font-size="15" font-weight="700">키와 관계</text><text x="380" y="368" text-anchor="middle" font-size="12">PK·FK와 관계 수가</text><text x="380" y="390" text-anchor="middle" font-size="12">올바른가?</text><rect x="500" y="305" width="200" height="120" rx="10" fill="white" stroke="#d69e2e" stroke-width="2"/><text x="600" y="337" text-anchor="middle" font-size="15" font-weight="700">중복과 분리</text><text x="600" y="368" text-anchor="middle" font-size="12">이름·제목 반복과</text><text x="600" y="390" text-anchor="middle" font-size="12">변경 이상이 없는가?</text><rect x="720" y="305" width="200" height="120" rx="10" fill="white" stroke="#3c9a5f" stroke-width="2"/><text x="820" y="337" text-anchor="middle" font-size="15" font-weight="700">컬럼 규칙</text><text x="820" y="368" text-anchor="middle" font-size="12">타입·필수·고유·범위가</text><text x="820" y="390" text-anchor="middle" font-size="12">적절한가?</text><rect x="940" y="305" width="200" height="120" rx="10" fill="white" stroke="#d9534f" stroke-width="2"/><text x="1040" y="337" text-anchor="middle" font-size="15" font-weight="700">운영과 확장</text><text x="1040" y="368" text-anchor="middle" font-size="12">삭제·이력·보안·확장을</text><text x="1040" y="390" text-anchor="middle" font-size="12">감당하는가?</text><rect x="390" y="500" width="420" height="65" rx="11" fill="#eef5ff" stroke="#3b82c4" stroke-width="2"/><text x="600" y="528" text-anchor="middle" font-size="16" font-weight="700">격리된 테스트 DB에서 구조 생성</text><text x="600" y="551" text-anchor="middle" font-size="12">운영 데이터가 아닌 초기화 가능한 환경 사용</text><rect x="35" y="600" width="1130" height="105" rx="15" fill="#f2fbf5" stroke="#8bc9a0" stroke-width="2"/><text x="60" y="632" font-size="19" font-weight="700">실행 검증</text><text x="200" y="665" text-anchor="middle" font-size="13">구조 생성 확인</text><text x="400" y="665" text-anchor="middle" font-size="13">정상 저장·조회</text><text x="600" y="665" text-anchor="middle" font-size="13">잘못된 값 차단</text><text x="800" y="665" text-anchor="middle" font-size="13">변경 후 일관성</text><text x="1000" y="665" text-anchor="middle" font-size="13">새 환경 재현</text><text x="600" y="735" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">실행 성공과 올바른 설계는 다르며, AI는 초안을 만들고 사람은 검증과 선택을 책임진다</text></svg>