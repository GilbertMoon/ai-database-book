<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">AI 생성 테이블 구조 검토 흐름</title>
  <desc id="desc">요구사항 정리, AI 설계 초안, 사람 검토, 테스트 DB 실행, 결과 일치 여부 판단 후 수정 반복 또는 채택으로 이어지는 검토 흐름</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#475569"/>
    </marker>
    <style>
      text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#172033}
      .title{font-size:30px;font-weight:700;text-anchor:middle;fill:#0f2d5c}
      .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
      .ai{fill:#eef5ff;stroke:#3174d0;stroke-width:2}
      .review{fill:#fff5df;stroke:#d89424;stroke-width:2}
      .test{fill:#f5f0ff;stroke:#7c4dcb;stroke-width:2}
      .ok{fill:#eef9f1;stroke:#2f9a58;stroke-width:2}
      .bad{fill:#fff1f1;stroke:#d64545;stroke-width:2}
      .name{font-size:19px;font-weight:700;text-anchor:middle}
      .sub{font-size:14px;text-anchor:middle;fill:#475569}
      .kw{font-size:14px;font-weight:700;text-anchor:middle;fill:#334155}
      .line{stroke:#475569;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
      .loop{stroke:#d64545;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
      .branch{font-size:18px;font-weight:700;text-anchor:middle}
      .note{font-size:16px;font-weight:700;text-anchor:middle;fill:#0f2d5c}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#fff"/>
  <text x="600" y="48" class="title">AI 생성 테이블 구조 검토 흐름</text>

  <rect x="420" y="82" width="360" height="74" rx="14" class="box"/>
  <text x="600" y="113" class="name">1. 요구사항 정리</text>
  <text x="600" y="138" class="sub">학생 · 강의 · 수강신청 · 업무 규칙</text>
  <path d="M600 156V192" class="line"/>

  <rect x="420" y="198" width="360" height="74" rx="14" class="ai"/>
  <text x="600" y="229" class="name">2. AI 설계 초안</text>
  <text x="600" y="254" class="sub">테이블 · 컬럼 · PK · FK</text>
  <path d="M600 272V308" class="line"/>

  <rect x="365" y="314" width="470" height="98" rx="14" class="review"/>
  <text x="600" y="344" class="name">3. 사람이 구조 검토</text>
  <text x="600" y="371" class="kw">테이블 역할 · PK/FK · 1:N/N:M · 중복 · 제약조건 · 확장 가능성</text>
  <text x="600" y="394" class="sub">AI 초안은 완성본이 아니라 검토 대상</text>
  <path d="M600 412V448" class="line"/>

  <rect x="420" y="454" width="360" height="74" rx="14" class="test"/>
  <text x="600" y="485" class="name">4. 격리된 테스트 DB에서 실행</text>
  <text x="600" y="510" class="sub">운영 DB가 아닌 초기화 가능한 환경</text>
  <path d="M600 528V564" class="line"/>

  <rect x="390" y="570" width="420" height="74" rx="14" class="review"/>
  <text x="600" y="601" class="name">5. 요구사항과 결과가 일치하는가?</text>
  <text x="600" y="626" class="sub">실행 성공과 올바른 설계는 다를 수 있음</text>

  <path d="M500 644L300 680" class="loop"/>
  <text x="395" y="656" class="branch" fill="#b42323">아니요</text>
  <rect x="105" y="670" width="300" height="62" rx="14" class="bad"/>
  <text x="255" y="707" class="name">수정 후 재요청·재실행</text>
  <path d="M255 670V235H420" class="loop"/>

  <path d="M700 644L900 680" class="line"/>
  <text x="805" y="656" class="branch" fill="#166534">예</text>
  <rect x="795" y="670" width="300" height="62" rx="14" class="ok"/>
  <text x="945" y="707" class="name">설계 채택·근거 기록</text>

  <text x="600" y="780" class="note">AI는 설계 초안을 만들고, 사람은 요구사항 적합성과 실행 결과를 검증한다.</text>
</svg>
