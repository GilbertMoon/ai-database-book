<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc">
  <title id="title">1:1, 1:N, N:M 관계 유형</title>
  <desc id="desc">사용자와 프로필의 일대일 관계, 강사와 강의의 일대다 관계, 학생과 강의의 다대다 관계를 외래키 위치, 선택 가능 수, UNIQUE 조건과 연결 테이블 구현 방식으로 비교한 도식</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#475569"/>
    </marker>
    <style>
      text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}
      .title{font-size:28px;font-weight:700;text-anchor:middle}
      .subtitle{font-size:15px;text-anchor:middle;fill:#475569}
      .guide{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5;rx:13}
      .guide-title{font-size:15px;font-weight:700;fill:#334155}
      .guide-text{font-size:12.5px;fill:#475569}
      .panel{stroke-width:1.6;rx:16}
      .one-panel{fill:#eef5ff;stroke:#6fa2e8}
      .many-panel{fill:#fff8e8;stroke:#d69e2e}
      .nm-panel{fill:#f5f1ff;stroke:#9b7bd2}
      .panel-title{font-size:20px;font-weight:700;text-anchor:middle}
      .panel-sub{font-size:12.5px;text-anchor:middle;fill:#475569}
      .entity{fill:#fff;stroke-width:1.5;rx:11}
      .one-entity{stroke:#3b82c4}.many-entity{stroke:#d69e2e}.nm-entity{stroke:#7c5cc4}
      .entity-title{font-size:15px;font-weight:700;text-anchor:middle}
      .entity-sub{font-size:11.8px;text-anchor:middle;fill:#475569}
      .key{font-size:11.5px;font-weight:700;text-anchor:middle;fill:#334155}
      .rel{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .rel-label{font-size:12.5px;font-weight:700;text-anchor:middle;fill:#334155}
      .cardinality{font-size:15px;font-weight:700;text-anchor:middle}
      .rule{fill:#fff;stroke-width:1.3;rx:10}
      .one-rule{stroke:#3b82c4}.many-rule{stroke:#d69e2e}.nm-rule{stroke:#7c5cc4}
      .rule-title{font-size:13.5px;font-weight:700;text-anchor:middle}
      .rule-sub{font-size:11.5px;text-anchor:middle;fill:#475569}
      .badge{font-size:10.5px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:middle}
      .one-badge{fill:#2f6fad}.many-badge{fill:#b7791f}.nm-badge{fill:#6b46a8}
      .comparison{fill:#f8fafc;stroke:#a8b3c4;stroke-width:1.5;rx:14}
      .comparison-title{font-size:17px;font-weight:700}
      .head{fill:#e9eef5;stroke:#94a3b8;stroke-width:1}
      .cell{fill:#fff;stroke:#cbd5e1;stroke-width:1}
      .head-text{font-size:12px;font-weight:700;text-anchor:middle;dominant-baseline:middle}
      .cell-text{font-size:11.5px;text-anchor:middle;dominant-baseline:middle}
      .note{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.4;rx:10}
      .note-title{font-size:13px;font-weight:700;fill:#92400e}
      .note-text{font-size:12px;fill:#475569}
      .principle{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.6;rx:11}
      .principle-label{font-size:14px;font-weight:700;fill:#166534}
      .principle-text{font-size:15px;font-weight:700;text-anchor:middle;fill:#166534}
    </style>
  </defs>

  <rect width="1200" height="1050" fill="#fff"/>
  <text x="600" y="40" class="title">1:1, 1:N, N:M 관계 유형</text>
  <text x="600" y="68" class="subtitle">관계는 한쪽 행 하나가 반대쪽 행 최소 몇 개·최대 몇 개와 연결되는지를 나타낸다</text>

  <rect x="70" y="92" width="1060" height="66" class="guide"/>
  <text x="94" y="117" class="guide-title">관계 읽기 순서</text>
  <text x="214" y="117" class="guide-text">① 한쪽 행 하나를 선택한다</text>
  <text x="430" y="117" class="guide-text">② 반대쪽 행이 최소·최대 몇 개 연결되는지 묻는다</text>
  <text x="788" y="117" class="guide-text">③ FK 위치와 NULL·UNIQUE 조건으로 구현한다</text>
  <text x="94" y="141" class="guide-text">표기 예: 1은 정확히 하나, 0..1은 없거나 하나, 0..N은 없거나 여러 개를 의미한다.</text>

  <!-- 1:1 -->
  <rect x="40" y="185" width="350" height="510" class="panel one-panel"/>
  <text x="215" y="220" class="panel-title">1:1 또는 1:0..1</text>
  <text x="215" y="246" class="panel-sub">한 행이 반대쪽 최대 한 행과 연결</text>

  <rect x="80" y="285" width="270" height="86" class="entity one-entity"/>
  <text x="215" y="315" class="entity-title">users</text>
  <text x="215" y="340" class="key">user_id · PK</text>
  <text x="215" y="360" class="entity-sub">사용자 기본 정보</text>

  <path d="M215 371V433" class="rel"/>
  <text x="190" y="402" class="cardinality">1</text>
  <text x="250" y="402" class="cardinality">0..1</text>
  <text x="215" y="423" class="rel-label">프로필은 선택적으로 최대 1개</text>

  <rect x="80" y="433" width="270" height="108" class="entity one-entity"/>
  <text x="215" y="462" class="entity-title">user_profiles</text>
  <text x="215" y="487" class="key">profile_id · PK</text>
  <text x="215" y="509" class="key">user_id · FK + UNIQUE</text>
  <text x="215" y="530" class="entity-sub">한 사용자에 여러 프로필 연결 방지</text>

  <rect x="68" y="566" width="294" height="102" class="rule one-rule"/>
  <circle cx="90" cy="588" r="12" class="one-badge"/><text x="90" y="588" class="badge">구현</text>
  <text x="215" y="594" class="rule-title">FK에 UNIQUE 적용</text>
  <text x="215" y="621" class="rule-sub">user_profiles.user_id가 같은 값을</text>
  <text x="215" y="641" class="rule-sub">두 번 저장하지 못하게 제한</text>
  <text x="215" y="661" class="rule-sub">선택 입력이면 FK에 NULL 허용 가능</text>

  <!-- 1:N -->
  <rect x="425" y="185" width="350" height="510" class="panel many-panel"/>
  <text x="600" y="220" class="panel-title">1:N 또는 1:0..N</text>
  <text x="600" y="246" class="panel-sub">한 행이 반대쪽 여러 행과 연결</text>

  <rect x="465" y="285" width="270" height="86" class="entity many-entity"/>
  <text x="600" y="315" class="entity-title">instructors</text>
  <text x="600" y="340" class="key">instructor_id · PK</text>
  <text x="600" y="360" class="entity-sub">강사 기본 정보</text>

  <path d="M600 371V433" class="rel"/>
  <text x="575" y="402" class="cardinality">1</text>
  <text x="635" y="402" class="cardinality">0..N</text>
  <text x="600" y="423" class="rel-label">강의가 없거나 여러 개일 수 있음</text>

  <rect x="465" y="433" width="270" height="108" class="entity many-entity"/>
  <text x="600" y="462" class="entity-title">courses</text>
  <text x="600" y="487" class="key">course_id · PK</text>
  <text x="600" y="509" class="key">instructor_id · FK</text>
  <text x="600" y="530" class="entity-sub">각 강의가 담당 강사 한 명을 참조</text>

  <rect x="453" y="566" width="294" height="102" class="rule many-rule"/>
  <circle cx="475" cy="588" r="12" class="many-badge"/><text x="475" y="588" class="badge">구현</text>
  <text x="600" y="594" class="rule-title">N 쪽에 FK 배치</text>
  <text x="600" y="621" class="rule-sub">courses.instructor_id가</text>
  <text x="600" y="641" class="rule-sub">instructors.instructor_id를 참조</text>
  <text x="600" y="661" class="rule-sub">담당 강사 필수 여부에 따라 NULL 결정</text>

  <!-- N:M -->
  <rect x="810" y="185" width="350" height="510" class="panel nm-panel"/>
  <text x="985" y="220" class="panel-title">N:M</text>
  <text x="985" y="246" class="panel-sub">양쪽의 여러 행이 서로 연결</text>

  <rect x="845" y="276" width="280" height="72" class="entity nm-entity"/>
  <text x="985" y="304" class="entity-title">students</text>
  <text x="985" y="328" class="key">student_id · PK</text>

  <path d="M985 348V402" class="rel"/>
  <text x="955" y="377" class="cardinality">1</text>
  <text x="1018" y="377" class="cardinality">0..N</text>

  <rect x="845" y="402" width="280" height="112" class="entity nm-entity"/>
  <text x="985" y="430" class="entity-title">enrollments · 연결 테이블</text>
  <text x="985" y="455" class="key">student_id · FK</text>
  <text x="985" y="477" class="key">course_id · FK</text>
  <text x="985" y="499" class="entity-sub">status · enrolled_at · grade</text>

  <path d="M985 514V562" class="rel"/>
  <text x="955" y="542" class="cardinality">0..N</text>
  <text x="1018" y="542" class="cardinality">1</text>

  <rect x="845" y="562" width="280" height="72" class="entity nm-entity"/>
  <text x="985" y="590" class="entity-title">courses</text>
  <text x="985" y="614" class="key">course_id · PK</text>

  <rect x="833" y="650" width="304" height="31" class="rule nm-rule"/>
  <text x="985" y="670" class="rule-title">직접 N:M 대신 두 개의 1:N으로 해소</text>

  <rect x="40" y="720" width="1120" height="204" class="comparison"/>
  <text x="64" y="751" class="comparison-title">관계 유형별 구현 비교</text>

  <rect x="64" y="775" width="1072" height="38" class="head"/>
  <text x="150" y="794" class="head-text">관계</text>
  <text x="365" y="794" class="head-text">대표 예시</text>
  <text x="625" y="794" class="head-text">FK 위치</text>
  <text x="890" y="794" class="head-text">추가 제약·설계 포인트</text>

  <rect x="64" y="813" width="172" height="34" class="cell"/>
  <rect x="236" y="813" width="258" height="34" class="cell"/>
  <rect x="494" y="813" width="262" height="34" class="cell"/>
  <rect x="756" y="813" width="380" height="34" class="cell"/>
  <text x="150" y="830" class="cell-text">1:1 / 1:0..1</text>
  <text x="365" y="830" class="cell-text">사용자–상세 프로필</text>
  <text x="625" y="830" class="cell-text">한쪽 테이블에 FK</text>
  <text x="946" y="830" class="cell-text">FK에 UNIQUE, 선택 관계면 NULL 여부 결정</text>

  <rect x="64" y="847" width="172" height="34" class="cell"/>
  <rect x="236" y="847" width="258" height="34" class="cell"/>
  <rect x="494" y="847" width="262" height="34" class="cell"/>
  <rect x="756" y="847" width="380" height="34" class="cell"/>
  <text x="150" y="864" class="cell-text">1:N / 1:0..N</text>
  <text x="365" y="864" class="cell-text">강사–강의</text>
  <text x="625" y="864" class="cell-text">N 쪽 테이블에 FK</text>
  <text x="946" y="864" class="cell-text">자식이 부모를 참조, 필수 관계면 NOT NULL</text>

  <rect x="64" y="881" width="172" height="34" class="cell"/>
  <rect x="236" y="881" width="258" height="34" class="cell"/>
  <rect x="494" y="881" width="262" height="34" class="cell"/>
  <rect x="756" y="881" width="380" height="34" class="cell"/>
  <text x="150" y="898" class="cell-text">N:M</text>
  <text x="365" y="898" class="cell-text">학생–강의</text>
  <text x="625" y="898" class="cell-text">연결 테이블에 두 FK</text>
  <text x="946" y="898" class="cell-text">관계 속성 저장, 필요 시 두 FK 조합 UNIQUE</text>

  <rect x="54" y="944" width="1092" height="42" class="note"/>
  <text x="76" y="968" class="note-title">주의</text>
  <text x="126" y="968" class="note-text">1:1이라고 반드시 테이블을 나누는 것은 아니다. 선택 입력, 보안, 큰 데이터, 역할 분리 등 분명한 이유가 있을 때 분리한다.</text>

  <rect x="145" y="1004" width="910" height="30" class="principle"/>
  <text x="171" y="1023" class="principle-label">핵심 원칙</text>
  <text x="620" y="1023" class="principle-text">1:1은 FK+UNIQUE, 1:N은 N 쪽의 FK, N:M은 두 FK를 가진 연결 테이블로 구현한다</text>
</svg>
