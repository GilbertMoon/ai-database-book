<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">1:1, 1:N, N:M 관계 유형</title>
  <desc id="desc">1:1, 1:N, N:M 관계의 구조적 차이와 외래키 위치를 세 영역으로 비교한 도식</desc>
  <style>
    text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#172033}
    .title{font-size:30px;font-weight:700;text-anchor:middle;fill:#0f2d5c}
    .panel{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}
    .box{fill:#eef5ff;stroke:#3174d0;stroke-width:2}
    .fkbox{fill:#f5f0ff;stroke:#7c4dcb;stroke-width:2}
    .tag{font-size:22px;font-weight:700;text-anchor:middle;fill:#0f2d5c}
    .name{font-size:17px;font-weight:700;text-anchor:middle}
    .sub{font-size:13px;text-anchor:middle;fill:#475569}
    .card{font-size:17px;font-weight:700;text-anchor:middle;fill:#0f2d5c}
    .line{stroke:#475569;stroke-width:2.4;fill:none}
    .rule{font-size:15px;font-weight:700;text-anchor:middle;fill:#334155}
    .note{font-size:16px;font-weight:700;text-anchor:middle;fill:#0f2d5c}
  </style>
  <rect width="1200" height="680" fill="#fff"/>
  <text x="600" y="48" class="title">1:1, 1:N, N:M 관계 유형</text>

  <rect x="50" y="90" width="330" height="440" rx="14" class="panel"/>
  <text x="215" y="130" class="tag">1:1</text>
  <rect x="85" y="170" width="115" height="68" rx="10" class="box"/><text x="142" y="199" class="name">users</text><text x="142" y="221" class="sub">1</text>
  <path d="M200 204H230" class="line"/>
  <text x="215" y="195" class="card">1</text><text x="215" y="228" class="card">0..1</text>
  <rect x="230" y="170" width="115" height="68" rx="10" class="fkbox"/><text x="288" y="199" class="name">profiles</text><text x="288" y="221" class="sub">FK + UNIQUE</text>
  <text x="215" y="310" class="rule">프로필 쪽 user_id</text>
  <text x="215" y="338" class="rule">FK에 UNIQUE 적용 가능</text>

  <rect x="435" y="90" width="330" height="440" rx="14" class="panel"/>
  <text x="600" y="130" class="tag">1:N</text>
  <rect x="470" y="170" width="125" height="68" rx="10" class="box"/><text x="532" y="199" class="name">instructors</text><text x="532" y="221" class="sub">1</text>
  <path d="M595 204H625" class="line"/>
  <text x="610" y="195" class="card">1</text><text x="610" y="228" class="card">0..N</text>
  <rect x="625" y="170" width="105" height="68" rx="10" class="fkbox"/><text x="678" y="199" class="name">courses</text><text x="678" y="221" class="sub">FK</text>
  <text x="600" y="310" class="rule">N 쪽 courses에</text>
  <text x="600" y="338" class="rule">instructor_id FK 배치</text>

  <rect x="820" y="90" width="330" height="440" rx="14" class="panel"/>
  <text x="985" y="130" class="tag">N:M</text>
  <rect x="850" y="170" width="90" height="68" rx="10" class="box"/><text x="895" y="199" class="name">students</text><text x="895" y="221" class="sub">1</text>
  <path d="M940 204H965" class="line"/>
  <rect x="965" y="170" width="105" height="68" rx="10" class="fkbox"/><text x="1018" y="199" class="name">enrollments</text><text x="1018" y="221" class="sub">FK 2개</text>
  <path d="M1070 204H1095" class="line"/>
  <rect x="1095" y="170" width="90" height="68" rx="10" class="box"/><text x="1140" y="199" class="name">courses</text><text x="1140" y="221" class="sub">1</text>
  <text x="952" y="260" class="card">N</text><text x="1083" y="260" class="card">N</text>
  <text x="985" y="310" class="rule">연결 테이블로</text>
  <text x="985" y="338" class="rule">두 개의 1:N 관계로 변경</text>

  <rect x="120" y="570" width="960" height="54" rx="18" fill="#eef5ff" stroke="#3174d0" stroke-width="2"/>
  <text x="600" y="602" class="note">1:1은 FK에 UNIQUE, 1:N은 N 쪽 FK, N:M은 연결 테이블을 사용한다.</text>
</svg>
