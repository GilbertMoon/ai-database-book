<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs><style>text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#1a202c}.title{font-size:24px;font-weight:700}.box{fill:#f7fafc;stroke:#4a5568;stroke-width:2;rx:10;ry:10}.main{fill:#ebf8ff;stroke:#2b6cb0}.one{fill:#f0fff4;stroke:#38a169}.many{fill:#fffaf0;stroke:#d69e2e}.label{font-size:17px;text-anchor:middle;dominant-baseline:middle}.small{font-size:14px;text-anchor:middle;dominant-baseline:middle}.line{stroke:#4a5568;stroke-width:2}</style></defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="600" y="40" text-anchor="middle" class="title">1:1, 1:N, N:M 관계 유형</text>
  <rect x="80" y="110" width="300" height="560" class="box"/><text x="230" y="150" class="label">1:1 관계</text><rect x="125" y="230" width="210" height="70" class="box one"/><text x="230" y="265" class="label">users 1명</text><line x1="230" y1="300" x2="230" y2="370" class="line"/><rect x="125" y="370" width="210" height="70" class="box one"/><text x="230" y="405" class="label">profiles 1개</text><text x="230" y="520" class="small">예: 한 사용자에게</text><text x="230" y="545" class="small">하나의 상세 프로필</text>
  <rect x="450" y="110" width="300" height="560" class="box"/><text x="600" y="150" class="label">1:N 관계</text><rect x="495" y="210" width="210" height="70" class="box one"/><text x="600" y="245" class="label">instructors 1명</text><line x1="600" y1="280" x2="600" y2="370" class="line"/><rect x="495" y="370" width="210" height="70" class="box many"/><text x="600" y="405" class="label">courses 여러 개</text><text x="600" y="520" class="small">예: 한 강사가</text><text x="600" y="545" class="small">여러 강의를 담당</text>
  <rect x="820" y="110" width="300" height="560" class="box"/><text x="970" y="150" class="label">N:M 관계</text><rect x="865" y="200" width="210" height="60" class="box many"/><text x="970" y="230" class="label">students 여러 명</text><line x1="970" y1="260" x2="970" y2="330" class="line"/><rect x="865" y="330" width="210" height="60" class="box main"/><text x="970" y="360" class="label">enrollments</text><line x1="970" y1="390" x2="970" y2="460" class="line"/><rect x="865" y="460" width="210" height="60" class="box many"/><text x="970" y="490" class="label">courses 여러 개</text><text x="970" y="585" class="small">예: 여러 학생과 여러 강의가</text><text x="970" y="610" class="small">연결 테이블로 연결</text>
</svg>