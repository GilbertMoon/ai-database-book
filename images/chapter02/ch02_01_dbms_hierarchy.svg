<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#4a5568"/></marker><style>text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#1a202c}.title{font-size:24px;font-weight:700}.box{fill:#f7fafc;stroke:#4a5568;stroke-width:2;rx:10;ry:10}.main{fill:#ebf8ff;stroke:#2b6cb0}.db{fill:#fffaf0;stroke:#d69e2e}.tbl{fill:#f0fff4;stroke:#38a169}.label{font-size:17px;text-anchor:middle;dominant-baseline:middle}.small{font-size:14px;text-anchor:middle;dominant-baseline:middle}</style></defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="550" y="40" text-anchor="middle" class="title">DBMS, 데이터베이스, 테이블의 계층 구조</text>
  <rect x="390" y="80" width="320" height="70" class="box main"/><text x="550" y="115" class="label">PostgreSQL</text><text x="550" y="137" class="small">DBMS</text>
  <rect x="180" y="230" width="280" height="70" class="box db"/><text x="320" y="265" class="label">school_db</text><text x="320" y="287" class="small">데이터베이스</text>
  <rect x="640" y="230" width="280" height="70" class="box db"/><text x="780" y="265" class="label">shop_db</text><text x="780" y="287" class="small">데이터베이스</text>
  <line x1="480" y1="150" x2="320" y2="230" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/><line x1="620" y1="150" x2="780" y2="230" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="80" y="380" width="180" height="58" class="box tbl"/><text x="170" y="410" class="label">students</text>
  <rect x="290" y="380" width="180" height="58" class="box tbl"/><text x="380" y="410" class="label">courses</text>
  <rect x="500" y="380" width="180" height="58" class="box tbl"/><text x="590" y="410" class="label">enrollments</text>
  <rect x="640" y="380" width="180" height="58" class="box tbl"/><text x="730" y="410" class="label">members</text>
  <rect x="850" y="380" width="180" height="58" class="box tbl"/><text x="940" y="410" class="label">orders</text>
  <line x1="320" y1="300" x2="170" y2="380" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/><line x1="320" y1="300" x2="380" y2="380" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/><line x1="320" y1="300" x2="590" y2="380" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/><line x1="780" y1="300" x2="730" y2="380" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/><line x1="780" y1="300" x2="940" y2="380" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="100" y="540" width="230" height="58" class="box"/><text x="215" y="570" class="label">행 Row</text><text x="215" y="592" class="small">김민지 학생 한 줄</text>
  <rect x="370" y="540" width="230" height="58" class="box"/><text x="485" y="570" class="label">열 Column</text><text x="485" y="592" class="small">id, name, email</text>
  <line x1="170" y1="438" x2="215" y2="540" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/><line x1="170" y1="438" x2="485" y2="540" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="160" y="660" width="780" height="50" class="box main"/><text x="550" y="685" class="label">DBMS는 여러 데이터베이스를 관리하고, 데이터베이스 안에는 여러 테이블이 존재한다.</text>
</svg>