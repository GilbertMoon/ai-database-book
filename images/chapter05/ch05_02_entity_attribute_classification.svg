<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180" role="img" aria-labelledby="title desc"><title id="title">엔터티와 속성 구분</title><desc id="desc">도서관 요구사항의 후보를 여러 건의 식별 가능한 업무 대상, 여러 대상을 연결하는 사건 기록, 특정 대상의 설명값으로 구분하고 members, books, loans 테이블과 컬럼으로 연결하는 도식</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}.t{font-size:28px;font-weight:700;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.panel{stroke-width:1.5;rx:15}.start{fill:#eef5ff;stroke:#6fa2e8}.classify{fill:#f8fafc;stroke:#a8b3c4}.entityP{fill:#eef5ff;stroke:#6fa2e8}.eventP{fill:#fff8e8;stroke:#d69e2e}.attrP{fill:#f2fbf5;stroke:#8bc9a0}.contextP{fill:#f5f1ff;stroke:#9b7bd2}.pt{font-size:19px;font-weight:700}.box{fill:#fff;stroke-width:1.4;rx:10}.blue{stroke:#3b82c4}.orange{stroke:#d69e2e}.green{stroke:#3c9a5f}.purple{stroke:#7c5cc4}.gray{stroke:#64748b}.red{stroke:#d9534f}.h{font-size:14px;font-weight:700;text-anchor:middle}.m{font-size:11.3px;text-anchor:middle;fill:#475569}.code{font-family:Consolas,D2Coding,monospace;font-size:13px;font-weight:700;text-anchor:middle;fill:#334155}.arr{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.back{stroke:#d9534f;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#a)}.decision{fill:#fff8e8;stroke:#b7791f;stroke-width:1.8}.dt{font-size:14px;font-weight:700;text-anchor:middle}.table{fill:#fff;stroke:#64748b;stroke-width:1.4;rx:10}.theadB{fill:#dcecff}.theadO{fill:#fff1cf}.th{font-size:13px;font-weight:700;text-anchor:middle}.td{font-size:10.8px;text-anchor:middle;fill:#334155}.note{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.3;rx:9}.nt{font-size:11.5px;font-weight:700;text-anchor:middle;fill:#92400e}.core{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.5;rx:10}.cv{font-size:14.5px;font-weight:700;text-anchor:middle;fill:#166534}</style></defs><rect width="1200" height="1180" fill="#fff"/><text x="600" y="40" class="t">엔터티와 속성 구분</text><text x="600" y="68" class="s">명사만 보고 테이블을 정하지 않고 식별 가능성, 반복 관리, 관계와 속성 소유자를 함께 판단한다</text><rect x="35" y="100" width="1130" height="190" class="panel start"/><text x="60" y="132" class="pt">1. 요구사항에서 후보 수집</text><rect x="70" y="160" width="1060" height="54" class="box blue"/><text x="600" y="184" class="h">회원 · 책 · 대여 기록 · 제목 · 이메일 · 대여일 · 도서관</text><text x="600" y="205" class="m">후보마다 여러 건을 구분해 관리하는지, 다른 대상을 설명하는 값인지, 관계 자체를 기록하는지 질문</text><rect x="90" y="235" width="300" height="36" class="box blue"/><text x="240" y="258" class="m">여러 행을 식별·관리해야 하는가?</text><rect x="450" y="235" width="300" height="36" class="box orange"/><text x="600" y="258" class="m">여러 대상을 연결하며 자체 정보가 있는가?</text><rect x="810" y="235" width="300" height="36" class="box green"/><text x="960" y="258" class="m">특정 대상 한 건을 설명하는 값인가?</text><rect x="35" y="325" width="1130" height="330" class="panel classify"/><text x="60" y="357" class="pt">2. 후보 분류</text><rect x="55" y="390" width="340" height="225" class="panel entityP"/><text x="225" y="422" class="h">일반 엔터티</text><text x="225" y="446" class="m">독립적인 식별자와 수명·상태를 가진 업무 대상</text><rect x="85" y="475" width="280" height="54" class="box blue"/><text x="225" y="498" class="code">members</text><text x="225" y="519" class="m">회원 여러 명을 각각 식별·관리</text><rect x="85" y="542" width="280" height="54" class="box blue"/><text x="225" y="565" class="code">books</text><text x="225" y="586" class="m">책 여러 권을 각각 식별·관리</text><rect x="430" y="390" width="340" height="225" class="panel eventP"/><text x="600" y="422" class="h">사건·관계 엔터티</text><text x="600" y="446" class="m">대상 사이에서 발생한 한 건을 별도로 기록</text><rect x="460" y="475" width="280" height="54" class="box orange"/><text x="600" y="498" class="code">loans</text><text x="600" y="519" class="m">회원과 책을 연결하는 대여 한 건</text><rect x="460" y="542" width="280" height="54" class="box orange"/><text x="600" y="565" class="m">자체 정보</text><text x="600" y="586" class="code">borrowed_at · due_at · returned_at</text><rect x="805" y="390" width="340" height="225" class="panel attrP"/><text x="975" y="422" class="h">속성</text><text x="975" y="446" class="m">특정 엔터티의 한 행을 설명하는 값</text><rect x="835" y="475" width="280" height="54" class="box green"/><text x="975" y="498" class="m">회원의 속성</text><text x="975" y="519" class="code">name · email · joined_at</text><rect x="835" y="542" width="280" height="54" class="box green"/><text x="975" y="565" class="m">책의 속성</text><text x="975" y="586" class="code">title · author · isbn</text><path d="M240 290V310H225V390" class="arr"/><path d="M600 290V390" class="arr"/><path d="M960 290V310H975V390" class="arr"/><rect x="35" y="685" width="1130" height="135" class="panel contextP"/><text x="60" y="717" class="pt">3. 같은 명사도 시스템 범위에 따라 달라짐</text><rect x="65" y="745" width="500" height="50" class="box purple"/><text x="315" y="766" class="h">단일 도서관만 다루는 경우</text><text x="315" y="787" class="m">‘도서관’은 시스템 문맥일 뿐 별도 테이블이 아닐 수 있음</text><rect x="635" y="745" width="500" height="50" class="box purple"/><text x="885" y="766" class="h">여러 지점과 지점별 정보를 관리하는 경우</text><text x="885" y="787" class="m">libraries 또는 branches라는 엔터티가 필요할 수 있음</text><rect x="35" y="850" width="1130" height="150" class="panel" fill="#f8fafc" stroke="#a8b3c4"/><text x="60" y="882" class="pt">4. 테이블과 컬럼 초안으로 변환</text><rect x="60" y="910" width="330" height="62" class="table"/><rect x="60" y="910" width="330" height="24" class="theadB"/><text x="225" y="927" class="th">members</text><text x="225" y="953" class="td">id · name · email · joined_at</text><rect x="435" y="910" width="330" height="62" class="table"/><rect x="435" y="910" width="330" height="24" class="theadB"/><text x="600" y="927" class="th">books</text><text x="600" y="953" class="td">id · title · author · published_year · isbn</text><rect x="810" y="900" width="330" height="82" class="table"/><rect x="810" y="900" width="330" height="24" class="theadO"/><text x="975" y="917" class="th">loans</text><text x="975" y="943" class="td">id · member_id · book_id</text><text x="975" y="965" class="td">borrowed_at · due_at · returned_at</text><polygon points="600,1015 710,1045 600,1075 490,1045" class="decision"/><text x="600" y="1041" class="dt">모든 속성의 소유자가 명확한가?</text><text x="600" y="1061" class="m">중복·다중값·잘못된 소유자가 있으면 다시 분류</text><text x="455" y="1032" class="m">아니요</text><text x="745" y="1032" class="m">예</text><path d="M225 972V995H600V1015" class="arr"/><path d="M600 972V1015" class="arr"/><path d="M975 982V995H600" class="arr"/><path d="M490 1045H20V253H90" class="back"/><rect x="755" y="1012" width="390" height="66" class="box green"/><text x="950" y="1037" class="h">이름 규칙 적용</text><text x="950" y="1059" class="m">테이블 복수형 · 컬럼 snake_case</text><text x="950" y="1074" class="m">PK id · FK 참조대상_id</text><path d="M710 1045H755" class="arr"/><rect x="55" y="1110" width="350" height="38" class="note"/><text x="230" y="1134" class="nt">모든 명사가 테이블은 아니다</text><rect x="425" y="1110" width="350" height="38" class="note"/><text x="600" y="1134" class="nt">모든 속성은 소유 엔터티가 명확해야 한다</text><rect x="795" y="1110" width="350" height="38" class="core"/><text x="970" y="1134" class="cv">엔터티는 정체성 · 속성은 값 · 사건 엔터티는 발생 사실</text></svg>