<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">엔터티와 속성 구분하기</title>
  <desc id="desc">회원과 책은 일반 엔터티, 대여 기록은 사건 엔터티, 이름과 제목과 날짜는 속성으로 구분한다.</desc>
  <style>
    .bg { fill: #ffffff; }
    .title { font: 700 28px "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #172033; }
    .question { fill: #fff7d9; stroke: #d8aa34; stroke-width: 2; rx: 8; }
    .entity { fill: #eef6ff; stroke: #6b9bd2; stroke-width: 2; rx: 8; }
    .event { fill: #f4efff; stroke: #8e78c9; stroke-width: 2; rx: 8; }
    .attr { fill: #edf8ef; stroke: #70a879; stroke-width: 2; rx: 8; }
    .head { font: 700 18px "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #1f2a3d; text-anchor: middle; }
    .text { font: 15px "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #334155; text-anchor: middle; }
    .code { font: 700 15px Consolas, D2Coding, "Courier New", monospace; fill: #263246; text-anchor: middle; }
    .line { fill: none; stroke: #6b7280; stroke-width: 2; }
  </style>
  <rect class="bg" width="1200" height="560" />
  <text class="title" x="600" y="48">엔터티와 속성 구분하기</text>

  <rect class="question" x="120" y="85" width="960" height="90" />
  <text class="head" x="600" y="118">판단 질문</text>
  <text class="text" x="600" y="148">독립적으로 식별·관리하는가? · 대상 사이에서 발생한 사건인가? · 한 건을 설명하는 값인가?</text>

  <line class="line" x1="600" y1="175" x2="600" y2="215" />
  <line class="line" x1="240" y1="215" x2="960" y2="215" />
  <line class="line" x1="240" y1="215" x2="240" y2="240" />
  <line class="line" x1="600" y1="215" x2="600" y2="240" />
  <line class="line" x1="960" y1="215" x2="960" y2="240" />

  <rect class="entity" x="95" y="240" width="290" height="210" />
  <text class="head" x="240" y="280">일반 엔터티</text>
  <text class="text" x="240" y="320">회원</text>
  <text class="code" x="240" y="345">members</text>
  <text class="text" x="240" y="385">책</text>
  <text class="code" x="240" y="410">books</text>

  <rect class="event" x="455" y="240" width="290" height="210" />
  <text class="head" x="600" y="280">사건·관계 엔터티</text>
  <text class="text" x="600" y="320">대여 기록</text>
  <text class="code" x="600" y="345">loans</text>
  <text class="text" x="600" y="385">회원과 책을 연결</text>
  <text class="text" x="600" y="415">대여일·반납일을 가짐</text>

  <rect class="attr" x="815" y="240" width="290" height="210" />
  <text class="head" x="960" y="280">속성</text>
  <text class="text" x="960" y="320">회원: 이름·이메일·가입일</text>
  <text class="text" x="960" y="360">책: 제목·저자·ISBN</text>
  <text class="text" x="960" y="400">대여: 대여일·반납예정일</text>
  <text class="text" x="960" y="430">실제반납일</text>
</svg>
