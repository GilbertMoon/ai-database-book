<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">엔터티와 속성 구분하기</title>
  <desc id="desc">회원과 책은 일반 엔터티, 대여 기록은 사건 엔터티, 이름과 제목과 날짜는 속성으로 구분하는 도식</desc>
  <style>
      .ko { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #1f2937; }
      .mono { font-family: Consolas, D2Coding, "Courier New", monospace; fill: #1f2937; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #4b5563; }
      .box-title { font-size: 18px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12.5px; }
      .card { stroke: #64748b; stroke-width: 1.6; rx: 14; ry: 14; }
      .entity { fill: #eaf3ff; }
      .attribute { fill: #ecf9ef; }
      .relation { fill: #f2ecff; }
      .decision { fill: #fff6d8; }
      .danger { fill: #ffeaea; }
      .ok { fill: #eaf8ee; }
      .pk { fill: #1d4ed8; font-weight: 700; }
      .fk { fill: #c2410c; font-weight: 700; }
      .line { stroke: #475569; stroke-width: 2; fill: none; }
      .dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
    </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="600" fill="#ffffff"/>
  <text x="600.0" y="42" text-anchor="middle" class="ko title">
    <tspan x="600.0" dy="0">엔터티와 속성 구분하기</tspan>
  </text>
  <text x="600.0" y="70" text-anchor="middle" class="ko subtitle">
    <tspan x="600.0" dy="0">모든 명사가 테이블이 되는 것은 아닙니다.</tspan>
  </text>
  <rect x="120" y="100" width="960" height="90" rx="14" ry="14" class="card decision"/>
  <text x="600" y="135" text-anchor="middle" class="ko body">
    <tspan x="600" dy="0">독립적으로 여러 건을 관리하는가?  ·  대상 사이의 사건인가?</tspan>
    <tspan x="600" dy="26">특정 대상이나 사건 한 건을 설명하는 값인가?</tspan>
  </text>
  <rect x="70" y="250" width="350" height="250" rx="14" ry="14" class="card entity"/>
  <text x="245" y="292" text-anchor="middle" class="ko box-title">
    <tspan x="245" dy="0">일반 엔터티</tspan>
  </text>
  <text x="245" y="350" text-anchor="middle" class="ko body">
    <tspan x="245" dy="0">회원 → members</tspan>
    <tspan x="245" dy="26">책 → books</tspan>
  </text>
  <rect x="425" y="250" width="350" height="250" rx="14" ry="14" class="card relation"/>
  <text x="600" y="292" text-anchor="middle" class="ko box-title">
    <tspan x="600" dy="0">사건·관계 엔터티</tspan>
  </text>
  <text x="600" y="350" text-anchor="middle" class="ko body">
    <tspan x="600" dy="0">대여 기록 → loans</tspan>
    <tspan x="600" dy="26">회원과 책을 연결하고 날짜 속성을 가짐</tspan>
  </text>
  <rect x="780" y="250" width="350" height="250" rx="14" ry="14" class="card attribute"/>
  <text x="955" y="292" text-anchor="middle" class="ko box-title">
    <tspan x="955" dy="0">속성</tspan>
  </text>
  <text x="955" y="350" text-anchor="middle" class="ko body">
    <tspan x="955" dy="0">회원: 이름·이메일·가입일</tspan>
    <tspan x="955" dy="26">책: 제목·저자·ISBN</tspan>
    <tspan x="955" dy="26">대여: 대여일·반납예정일·실제반납일</tspan>
  </text>
  <line x1="300" y1="190" x2="245" y2="250" class="line" marker-end="url(#arrow)"/>
  <line x1="600" y1="190" x2="600" y2="250" class="line" marker-end="url(#arrow)"/>
  <line x1="900" y1="190" x2="955" y2="250" class="line" marker-end="url(#arrow)"/>
  <text x="600" y="555" text-anchor="middle" class="ko subtitle">
    <tspan x="600" dy="0">엔터티와 사건 엔터티는 행을 식별하며, 속성은 그 한 건을 설명합니다.</tspan>
  </text>
</svg>
