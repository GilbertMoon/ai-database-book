<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2000" viewBox="0 0 1200 2000" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
  <title id="title">데이터 모델링 전체 흐름</title>
  <desc id="desc">도서 대여 시스템의 요구사항과 범위를 정의하고 개념 모델, 논리 모델, 물리 모델로 단계적으로 구체화한 뒤 PostgreSQL DDL, 샘플 데이터, 주요 질의와 정상·경계·오류 시나리오로 검증하여 반복 개선하는 과정을 설명한다. 단순 예제에서는 동일 ISBN의 복본을 구분하지 않으며, 복본 관리가 필요하면 도서 정보와 소장 도서를 분리한다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#c2413b"/>
    </marker>
    <style>
      text{font-family:Malgun Gothic,NanumSquare,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}
      .title{font-size:30px;font-weight:700;text-anchor:middle}
      .subtitle{font-size:16px;text-anchor:middle;fill:#475569}
      .section-title{font-size:19px;font-weight:700}
      .section-sub{font-size:14px;fill:#475569}
      .card-title{font-size:15px;font-weight:700;text-anchor:middle}
      .card-text{font-size:13px;text-anchor:middle;fill:#475569}
      .card-text-small{font-size:12px;text-anchor:middle;fill:#475569}
      .mono{font-family:Consolas,D2Coding,Noto Sans Mono CJK KR,Menlo,monospace;font-size:12.4px;text-anchor:middle;fill:#334155}
      .badge{font-size:12px;font-weight:700;text-anchor:middle;dominant-baseline:middle;fill:#ffffff}
      .flow{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .retry{stroke:#c2413b;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow-red)}
      .relation{stroke:#64748b;stroke-width:2.2;fill:none}
      .decision{font-size:14px;font-weight:700;text-anchor:middle}
      .ok{font-size:13px;font-weight:700;text-anchor:middle;fill:#166534}
      .no{font-size:13px;font-weight:700;text-anchor:middle;fill:#b42318}
      .note-title{font-size:14px;font-weight:700;text-anchor:middle;fill:#92400e}
      .note-text{font-size:12.4px;text-anchor:middle;fill:#475569}
      .principle-label{font-size:16px;font-weight:700;text-anchor:middle;fill:#166534}
      .principle-main{font-size:16.5px;font-weight:700;text-anchor:middle;fill:#166534}
    </style>
  </defs>

  <rect width="1200" height="2000" fill="#ffffff"/>
  <text x="600" y="42" class="title">데이터 모델링 전체 흐름</text>
  <text x="600" y="72" class="subtitle">요구사항을 바로 테이블로 옮기지 않고, 업무 의미를 개념 → 논리 → 물리 모델로 구체화한 뒤 데이터와 질의로 검증한다</text>

  <!-- 1. Requirements -->
  <rect x="34" y="98" width="1132" height="316" rx="16" fill="#eef5ff" stroke="#6fa2e8" stroke-width="1.6"/>
  <text x="58" y="132" class="section-title">1. 요구사항·범위·용어·업무 규칙 합의</text>
  <text x="405" y="132" class="section-sub">누가 무엇을 언제 처리하며, 무엇을 저장하지 않을지도 함께 정한다</text>

  <rect x="58" y="160" width="1084" height="76" rx="11" fill="#ffffff" stroke="#3b82c4" stroke-width="1.5"/>
  <text x="600" y="187" class="card-title">업무 시나리오</text>
  <text x="600" y="213" class="card-text">회원은 대여 가능한 도서를 빌리고 반납한다. 이메일과 ISBN은 중복되지 않으며, 미반납이면 실제 반납일이 비어 있다.</text>

  <rect x="58" y="260" width="330" height="100" rx="11" fill="#ffffff" stroke="#3b82c4" stroke-width="1.5"/>
  <circle cx="88" cy="288" r="15" fill="#2f6fad"/><text x="88" y="288" class="badge">1</text>
  <text x="223" y="291" class="card-title">범위·가정</text>
  <text x="223" y="320" class="card-text">회원·도서·대여·반납을 관리</text>
  <text x="223" y="344" class="card-text-small">단순 예제: 동일 ISBN의 복본은 구분하지 않음</text>

  <rect x="435" y="260" width="330" height="100" rx="11" fill="#ffffff" stroke="#d69e2e" stroke-width="1.5"/>
  <circle cx="465" cy="288" r="15" fill="#b7791f"/><text x="465" y="288" class="badge">2</text>
  <text x="600" y="291" class="card-title">용어·상태</text>
  <text x="600" y="320" class="card-text">회원 · 도서 · 대여 기록</text>
  <text x="600" y="344" class="card-text-small">대여중 · 반납 · 연체 · 취소의 의미 정의</text>

  <rect x="812" y="260" width="330" height="100" rx="11" fill="#ffffff" stroke="#3c9a5f" stroke-width="1.5"/>
  <circle cx="842" cy="288" r="15" fill="#2f855a"/><text x="842" y="288" class="badge">3</text>
  <text x="977" y="291" class="card-title">규칙·예외·성공 기준</text>
  <text x="977" y="320" class="card-text">필수값 · 고유값 · 수량 · 기간</text>
  <text x="977" y="344" class="card-text-small">정상·금지·예외 상황과 기대 결과 기록</text>

  <rect x="138" y="374" width="924" height="24" rx="8" fill="#dfeeff" stroke="#6fa2e8" stroke-width="1.1"/>
  <text x="600" y="391" class="card-text-small">산출물: 범위와 제외 범위 · 용어집 · 업무 시나리오 · 규칙 목록 · 검증 가능한 성공 기준</text>

  <path d="M600 414V438" class="flow"/>

  <!-- 2. Conceptual model -->
  <rect x="34" y="438" width="1132" height="330" rx="16" fill="#fff8e8" stroke="#d69e2e" stroke-width="1.6"/>
  <text x="58" y="472" class="section-title">2. 개념 모델: 업무 대상과 관계를 표현</text>
  <text x="405" y="472" class="section-sub">DBMS, 타입, 컬럼명보다 업무 의미·카디널리티·선택성에 집중한다</text>

  <rect x="58" y="502" width="330" height="90" rx="11" fill="#ffffff" stroke="#3b82c4" stroke-width="1.5"/>
  <text x="223" y="529" class="card-title">엔터티 후보 판단</text>
  <text x="223" y="556" class="card-text">독립적으로 식별·관리해야 하는 대상인가?</text>
  <text x="223" y="579" class="card-text-small">명사는 후보일 뿐, 모든 명사가 엔터티는 아님</text>

  <rect x="435" y="502" width="330" height="90" rx="11" fill="#ffffff" stroke="#7c5cc4" stroke-width="1.5"/>
  <text x="600" y="529" class="card-title">관계·사건 판단</text>
  <text x="600" y="556" class="card-text">대상 사이의 연결 자체를 기록해야 하는가?</text>
  <text x="600" y="579" class="card-text-small">대여일·반납일을 가진 loans는 사건 엔터티</text>

  <rect x="812" y="502" width="330" height="90" rx="11" fill="#ffffff" stroke="#d69e2e" stroke-width="1.5"/>
  <text x="977" y="529" class="card-title">카디널리티·선택성</text>
  <text x="977" y="556" class="card-text">각 관계의 최소·최대 참여 수를 표현</text>
  <text x="977" y="579" class="card-text-small">예: 회원은 대여 기록 0개 이상</text>

  <rect x="86" y="632" width="260" height="82" rx="10" fill="#ffffff" stroke="#3b82c4" stroke-width="1.6"/>
  <text x="216" y="660" class="card-title">회원</text>
  <text x="216" y="684" class="mono">members</text>
  <text x="216" y="704" class="card-text-small">회원 1명</text>

  <rect x="470" y="618" width="260" height="110" rx="10" fill="#ffffff" stroke="#d69e2e" stroke-width="1.6"/>
  <text x="600" y="646" class="card-title">대여 기록</text>
  <text x="600" y="670" class="mono">loans</text>
  <text x="600" y="694" class="card-text">누가 어떤 도서를 언제 빌렸는지</text>
  <text x="600" y="716" class="card-text-small">회원–도서 N:M을 사건으로 해소</text>

  <rect x="854" y="632" width="260" height="82" rx="10" fill="#ffffff" stroke="#3b82c4" stroke-width="1.6"/>
  <text x="984" y="660" class="card-title">도서</text>
  <text x="984" y="684" class="mono">books</text>
  <text x="984" y="704" class="card-text-small">복본 미구분 도서 레코드 1건</text>

  <path d="M346 673H470" class="relation"/>
  <path d="M730 673H854" class="relation"/>
  <text x="366" y="657" class="card-text-small">1</text>
  <text x="450" y="657" class="card-text-small">0..N</text>
  <text x="750" y="657" class="card-text-small">0..N</text>
  <text x="834" y="657" class="card-text-small">1</text>

  <rect x="142" y="738" width="916" height="20" rx="7" fill="#fff1cf" stroke="#d69e2e" stroke-width="1.1"/>
  <text x="600" y="752" class="card-text-small">복본을 관리한다면 도서 정보(book_titles)와 소장 도서(book_copies)를 분리하고 loans는 book_copies를 참조한다</text>

  <path d="M600 768V792" class="flow"/>

  <!-- 3. Logical model -->
  <rect x="34" y="792" width="1132" height="342" rx="16" fill="#f5f1ff" stroke="#9b7bd2" stroke-width="1.6"/>
  <text x="58" y="826" class="section-title">3. 논리 모델: 속성·식별자·키·제약 규칙 구체화</text>
  <text x="495" y="826" class="section-sub">특정 DBMS와 무관하게 데이터 구조와 무결성 규칙을 정리한다</text>

  <rect x="58" y="856" width="330" height="176" rx="11" fill="#ffffff" stroke="#7c5cc4" stroke-width="1.5"/>
  <text x="223" y="884" class="card-title">속성·식별자</text>
  <text x="223" y="915" class="mono">members(id, name, email, joined_at)</text>
  <text x="223" y="940" class="mono">books(id, title, author, isbn)</text>
  <text x="223" y="965" class="mono">loans(id, member_id, book_id, ...)</text>
  <text x="223" y="996" class="card-text-small">각 속성의 의미·도메인·NULL 허용 여부 정의</text>
  <text x="223" y="1018" class="card-text-small">대체키 PK와 업무상 후보키를 구분</text>

  <rect x="435" y="856" width="330" height="176" rx="11" fill="#ffffff" stroke="#d69e2e" stroke-width="1.5"/>
  <text x="600" y="884" class="card-title">관계·무결성 규칙</text>
  <text x="600" y="915" class="card-text">loans.member_id → members.id</text>
  <text x="600" y="940" class="card-text">loans.book_id → books.id</text>
  <text x="600" y="965" class="card-text">email·isbn 고유, 필수값·NULL 허용</text>
  <text x="600" y="996" class="card-text-small">삭제·변경 시 참조 정책과 상태 전이 정의</text>
  <text x="600" y="1018" class="card-text-small">DB 제약과 애플리케이션 규칙의 책임 구분</text>

  <rect x="812" y="856" width="330" height="176" rx="11" fill="#ffffff" stroke="#3c9a5f" stroke-width="1.5"/>
  <text x="977" y="884" class="card-title">정규화·추적성</text>
  <text x="977" y="915" class="card-text">반복되는 사실과 다중값 분리</text>
  <text x="977" y="940" class="card-text">속성은 한 가지 사실을 표현</text>
  <text x="977" y="965" class="card-text">중복·갱신 이상·종속성 검토</text>
  <text x="977" y="996" class="card-text-small">요구사항 → 엔터티·속성·규칙 연결</text>
  <text x="977" y="1018" class="card-text-small">변경 이유와 미해결 규칙도 기록</text>

  <rect x="98" y="1058" width="1004" height="52" rx="9" fill="#ffffff" stroke="#9b7bd2" stroke-width="1.2"/>
  <text x="600" y="1080" class="card-title">논리 모델 산출물</text>
  <text x="600" y="1102" class="card-text-small">엔터티별 속성·식별자 · PK/FK · 카디널리티·선택성 · 고유/필수/NULL 규칙 · 정규화 근거</text>

  <path d="M600 1134V1158" class="flow"/>

  <!-- 4. Physical model -->
  <rect x="34" y="1158" width="1132" height="304" rx="16" fill="#eefbf2" stroke="#62b47a" stroke-width="1.6"/>
  <text x="58" y="1192" class="section-title">4. 물리 모델: PostgreSQL 구현 방식 결정</text>
  <text x="420" y="1192" class="section-sub">논리 모델을 실제 이름·타입·제약조건·인덱스·운영 정책으로 변환한다</text>

  <rect x="58" y="1224" width="330" height="168" rx="11" fill="#ffffff" stroke="#3c9a5f" stroke-width="1.5"/>
  <text x="223" y="1252" class="card-title">이름·타입·기본값</text>
  <text x="223" y="1283" class="mono">BIGINT / VARCHAR / DATE / TIMESTAMP</text>
  <text x="223" y="1308" class="mono">GENERATED ... AS IDENTITY</text>
  <text x="223" y="1333" class="mono">DEFAULT CURRENT_TIMESTAMP</text>
  <text x="223" y="1364" class="card-text-small">복수형 테이블 · snake_case 컬럼</text>
  <text x="223" y="1386" class="card-text-small">시간대·문자열 길이·숫자 범위 결정</text>

  <rect x="435" y="1224" width="330" height="168" rx="11" fill="#ffffff" stroke="#7c5cc4" stroke-width="1.5"/>
  <text x="600" y="1252" class="card-title">제약조건·참조 정책</text>
  <text x="600" y="1283" class="card-text">PRIMARY KEY · FOREIGN KEY</text>
  <text x="600" y="1308" class="card-text">NOT NULL · UNIQUE · CHECK</text>
  <text x="600" y="1333" class="card-text">ON DELETE RESTRICT / CASCADE / SET NULL</text>
  <text x="600" y="1364" class="card-text-small">업무 의미에 맞는 정책을 명시</text>
  <text x="600" y="1386" class="card-text-small">DDL과 마이그레이션 순서까지 설계</text>

  <rect x="812" y="1224" width="330" height="168" rx="11" fill="#ffffff" stroke="#d69e2e" stroke-width="1.5"/>
  <text x="977" y="1252" class="card-title">성능·보안·운영</text>
  <text x="977" y="1283" class="card-text">주요 조회·JOIN·정렬 조건의 인덱스</text>
  <text x="977" y="1308" class="card-text">최소 권한·감사·보존·소프트 삭제</text>
  <text x="977" y="1333" class="card-text">백업·복구·마이그레이션 영향</text>
  <text x="977" y="1364" class="card-text-small">인덱스는 추측이 아니라 실제 질의로 검증</text>
  <text x="977" y="1386" class="card-text-small">운영 변경은 롤백 계획과 함께 관리</text>

  <rect x="140" y="1410" width="920" height="28" rx="8" fill="#dcf7e5" stroke="#62b47a" stroke-width="1.1"/>
  <text x="600" y="1429" class="card-text-small">산출물: PostgreSQL DDL · 인덱스 · 마이그레이션 · 권한·보존·복구 정책</text>

  <path d="M600 1462V1486" class="flow"/>

  <!-- 5. Validation -->
  <rect x="34" y="1486" width="1132" height="246" rx="16" fill="#f8fafc" stroke="#a8b3c4" stroke-width="1.6"/>
  <text x="58" y="1520" class="section-title">5. DDL·샘플 데이터·주요 질의로 검증</text>
  <text x="395" y="1520" class="section-sub">테이블이 생성된다는 사실만으로 모델이 요구사항을 만족하는 것은 아니다</text>

  <rect x="58" y="1552" width="330" height="122" rx="11" fill="#ffffff" stroke="#3c9a5f" stroke-width="1.5"/>
  <text x="223" y="1580" class="card-title">정상 시나리오</text>
  <text x="223" y="1608" class="card-text">회원·도서·대여·반납 저장</text>
  <text x="223" y="1633" class="card-text">JOIN으로 업무 화면과 보고서 조회</text>
  <text x="223" y="1657" class="card-text-small">기대 결과와 실제 행을 비교</text>

  <rect x="435" y="1552" width="330" height="122" rx="11" fill="#ffffff" stroke="#d69e2e" stroke-width="1.5"/>
  <text x="600" y="1580" class="card-title">경계·상태 시나리오</text>
  <text x="600" y="1608" class="card-text">미반납: returned_at IS NULL</text>
  <text x="600" y="1633" class="card-text">기간·수량·상태 전이의 경계값</text>
  <text x="600" y="1657" class="card-text-small">0건·1건·여러 건과 NULL 의미 확인</text>

  <rect x="812" y="1552" width="330" height="122" rx="11" fill="#ffffff" stroke="#d9534f" stroke-width="1.5"/>
  <text x="977" y="1580" class="card-title">오류·무결성 시나리오</text>
  <text x="977" y="1608" class="card-text">중복 email·isbn, 없는 FK 차단</text>
  <text x="977" y="1633" class="card-text">삭제 정책과 동시 처리 결과</text>
  <text x="977" y="1657" class="card-text-small">실패가 예상한 규칙으로 발생하는지 확인</text>

  <rect x="116" y="1692" width="968" height="26" rx="8" fill="#fff8e8" stroke="#d69e2e" stroke-width="1.1"/>
  <text x="600" y="1710" class="note-text">주요 CRUD와 보고서 질의를 먼저 작성해 보면 누락된 속성·관계·인덱스 후보를 더 쉽게 발견할 수 있다</text>

  <path d="M600 1732V1756" class="flow"/>
  <polygon points="600,1756 740,1800 600,1844 460,1800" fill="#fff8e8" stroke="#b7791f" stroke-width="1.8"/>
  <text x="600" y="1797" class="decision">범위·규칙·주요 질의와 테스트를 모두 만족하는가?</text>
