<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">데이터 모델링 전체 흐름</title><desc id="desc">도서 대여 시스템의 요구사항과 업무 시나리오에서 명사, 동사, 규칙을 찾아 엔터티, 속성, 관계로 분류하고 ERD와 PostgreSQL 테이블을 작성한 뒤 정상·예외 데이터로 검증하는 반복 흐름</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}.t{font-size:28px;font-weight:700;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.panel{stroke-width:1.5;rx:15}.req{fill:#eef5ff;stroke:#6fa2e8}.model{fill:#fff8e8;stroke:#d69e2e}.design{fill:#f5f1ff;stroke:#9b7bd2}.test{fill:#f2fbf5;stroke:#8bc9a0}.pt{font-size:19px;font-weight:700}.box{fill:#fff;stroke-width:1.4;rx:10}.blue{stroke:#3b82c4}.orange{stroke:#d69e2e}.green{stroke:#3c9a5f}.purple{stroke:#7c5cc4}.red{stroke:#d9534f}.gray{stroke:#64748b}.h{font-size:14px;font-weight:700;text-anchor:middle}.m{font-size:11.3px;text-anchor:middle;fill:#475569}.sql{font-family:Consolas,D2Coding,monospace;font-size:13px;font-weight:700;text-anchor:middle}.arr{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.back{stroke:#d9534f;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#a)}.decision{fill:#fff8e8;stroke:#b7791f;stroke-width:1.8}.dt{font-size:14px;font-weight:700;text-anchor:middle}.entity{fill:#fff;stroke:#3b82c4;stroke-width:1.5;rx:8}.event{fill:#fff;stroke:#d69e2e;stroke-width:1.5;rx:8}.rel{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#a)}.note{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.3;rx:9}.nt{font-size:11.4px;font-weight:700;text-anchor:middle;fill:#92400e}.core{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.5;rx:10}.cv{font-size:14.5px;font-weight:700;text-anchor:middle;fill:#166534}</style></defs><rect width="1200" height="1140" fill="#fff"/><text x="600" y="40" class="t">데이터 모델링 전체 흐름</text><text x="600" y="68" class="s">요구사항을 테이블로 바로 옮기지 않고 업무 대상·관계·규칙을 분리한 뒤 데이터와 질의로 검증한다</text><rect x="35" y="100" width="1130" height="230" class="panel req"/><text x="60" y="132" class="pt">1. 요구사항과 업무 시나리오 분석</text><rect x="70" y="160" width="1060" height="58" class="box blue"/><text x="600" y="184" class="h">도서관은 회원과 책을 관리하고, 회원은 여러 책을 대여·반납할 수 있다</text><text x="600" y="207" class="m">등록·조회·대여·반납·미반납·중복 입력 같은 정상과 예외 상황을 함께 정리</text><rect x="70" y="245" width="320" height="62" class="box blue"/><text x="230" y="269" class="h">명사 · 대상과 값 후보</text><text x="230" y="292" class="m">회원·책·대여 기록·이메일·ISBN·대여일</text><rect x="440" y="245" width="320" height="62" class="box orange"/><text x="600" y="269" class="h">동사 · 관계와 사건 후보</text><text x="600" y="292" class="m">관리한다·대여한다·반납한다</text><rect x="810" y="245" width="320" height="62" class="box green"/><text x="970" y="269" class="h">수량·조건·상태 · 업무 규칙</text><text x="970" y="292" class="m">여러 권·고유값·필수값·미반납은 NULL</text><path d="M230 218V245" class="arr"/><path d="M600 218V245" class="arr"/><path d="M970 218V245" class="arr"/><rect x="35" y="360" width="1130" height="250" class="panel model"/><text x="60" y="392" class="pt">2. 엔터티·속성·관계로 분류하고 개념 모델 작성</text><rect x="70" y="425" width="300" height="72" class="box blue"/><text x="220" y="451" class="h">엔터티</text><text x="220" y="475" class="m">독립적으로 식별하고 관리하는 대상</text><text x="220" y="491" class="m">members · books</text><rect x="450" y="425" width="300" height="72" class="box purple"/><text x="600" y="451" class="h">속성</text><text x="600" y="475" class="m">대상을 설명하는 값</text><text x="600" y="491" class="m">name · email · title · isbn</text><rect x="830" y="425" width="300" height="72" class="box orange"/><text x="980" y="451" class="h">관계·사건 엔터티</text><text x="980" y="475" class="m">대상 사이의 연결과 발생 정보</text><text x="980" y="491" class="m">loans · borrowed_at · returned_at</text><rect x="105" y="530" width="250" height="52" class="entity"/><text x="230" y="553" class="h">members</text><text x="230" y="573" class="m">회원 한 명을 식별·관리</text><rect x="475" y="520" width="250" height="72" class="event"/><text x="600" y="545" class="h">loans</text><text x="600" y="566" class="m">누가 어떤 책을 언제 대여했는지</text><text x="600" y="583" class="m">회원과 책을 연결하는 사건 기록</text><rect x="845" y="530" width="250" height="52" class="entity"/><text x="970" y="553" class="h">books</text><text x="970" y="573" class="m">책 한 권을 식별·관리</text><path d="M355 556H475" class="rel"/><path d="M725 556H845" class="rel"/><path d="M230 330V345H220V425" class="arr"/><path d="M600 330V425" class="arr"/><path d="M970 330V345H980V425" class="arr"/><rect x="35" y="640" width="1130" height="200" class="panel design"/><text x="60" y="672" class="pt">3. 논리 설계 → ERD 검토 → PostgreSQL 구현</text><rect x="65" y="705" width="300" height="90" class="box purple"/><text x="215" y="731" class="h">논리 설계</text><text x="215" y="755" class="m">테이블·컬럼·PK·FK·관계 수</text><text x="215" y="776" class="m">NOT NULL·UNIQUE·NULL 허용</text><rect x="450" y="705" width="300" height="90" class="box orange"/><text x="600" y="731" class="h">ERD 검토</text><text x="600" y="755" class="m">누락·중복·관계 방향·카디널리티</text><text x="600" y="776" class="m">요구사항을 그림으로 설명할 수 있는지 확인</text><rect x="835" y="705" width="300" height="90" class="box green"/><text x="985" y="731" class="h">물리 설계와 SQL</text><text x="985" y="755" class="m">PostgreSQL 타입·DEFAULT·제약조건</text><text x="985" y="776" class="sql">members → books → loans</text><path d="M365 750H450" class="arr"/><path d="M750 750H835" class="arr"/><rect x="35" y="870" width="1130" height="120" class="panel test"/><text x="60" y="902" class="pt">4. 샘플 데이터와 테스트 시나리오로 검증</text><rect x="65" y="925" width="300" height="42" class="box green"/><text x="215" y="951" class="m">정상 · 회원·도서·대여 저장과 JOIN 조회</text><rect x="450" y="925" width="300" height="42" class="box orange"/><text x="600" y="951" class="m">선택 상태 · 미반납 returned_at = NULL</text><rect x="835" y="925" width="300" height="42" class="box red"/><text x="985" y="951" class="m">잘못된 값 · 중복 email·isbn·없는 FK 차단</text><polygon points="600,1010 710,1040 600,1070 490,1040" class="decision"/><text x="600" y="1036" class="dt">요구사항과 규칙을 만족하는가?</text><text x="600" y="1055" class="m">모델·SQL·테스트 결과를 함께 비교</text><text x="455" y="1026" class="m">아니요</text><text x="745" y="1026" class="m">예</text><path d="M215 967V990H600V1010" class="arr"/><path d="M600 967V1010" class="arr"/><path d="M985 967V990H600" class="arr"/><path d="M490 1040H15V276H70" class="back"/><rect x="55" y="1085" width="360" height="34" class="note"/><text x="235" y="1107" class="nt">명사 찾기는 시작점이며 모든 명사가 테이블은 아님</text><rect x="785" y="1085" width="360" height="34" class="core"/><text x="965" y="1107" class="cv">요구사항 ↔ ERD ↔ SQL ↔ 검증 결과를 연결해 기록</text><path d="M710 1040H965V1085" class="arr"/></svg>