<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">요구사항에서 데이터베이스 구조까지</title>
  <desc id="desc">요구사항을 읽고 엔터티, 속성, 관계, 키를 정리한 뒤 ERD와 PostgreSQL 테이블로 구현하고 샘플 데이터와 JOIN으로 검증하는 흐름이다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#54606f" />
    </marker>
  </defs>
  <style>
    .bg { fill: #ffffff; }
    .title { font: 700 28px "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #172033; }
    .box { fill: #eef6ff; stroke: #6b9bd2; stroke-width: 2; rx: 8; }
    .sql { fill: #f4efff; stroke: #8e78c9; }
    .check { fill: #fff7d9; stroke: #d8aa34; }
    .done { fill: #edf8ef; stroke: #70a879; }
    .text { font: 700 17px "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #1f2a3d; text-anchor: middle; }
    .small { font: 14px "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #4d596b; text-anchor: middle; }
    .line { fill: none; stroke: #54606f; stroke-width: 2.4; marker-end: url(#arrow); }
    .return { fill: none; stroke: #8c6cc4; stroke-width: 2.2; stroke-dasharray: 8 6; marker-end: url(#arrow); }
  </style>
  <rect class="bg" width="1200" height="620" />
  <text class="title" x="600" y="48">요구사항에서 데이터베이스 구조까지</text>

  <g>
    <rect class="box" x="70" y="100" width="190" height="70" />
    <text class="text" x="165" y="142">요구사항 읽기</text>
    <rect class="box" x="300" y="100" width="190" height="70" />
    <text class="text" x="395" y="142">엔터티 후보 찾기</text>
    <rect class="box" x="530" y="100" width="190" height="70" />
    <text class="text" x="625" y="142">속성 정리</text>
    <rect class="box" x="760" y="100" width="190" height="70" />
    <text class="text" x="855" y="142">관계 찾기</text>
    <line class="line" x1="260" y1="135" x2="295" y2="135" />
    <line class="line" x1="490" y1="135" x2="525" y2="135" />
    <line class="line" x1="720" y1="135" x2="755" y2="135" />
  </g>

  <g>
    <rect class="box" x="880" y="245" width="190" height="70" />
    <text class="text" x="975" y="287">PK·FK 결정</text>
    <rect class="box" x="650" y="245" width="190" height="70" />
    <text class="text" x="745" y="287">ERD 작성</text>
    <rect class="box sql" x="420" y="245" width="190" height="70" />
    <text class="text" x="515" y="278">PostgreSQL</text>
    <text class="small" x="515" y="300">테이블 생성</text>
    <rect class="box sql" x="190" y="245" width="190" height="70" />
    <text class="text" x="285" y="278">샘플 데이터·JOIN</text>
    <text class="small" x="285" y="300">검증</text>
    <path class="line" d="M 855 170 L 855 205 L 975 205 L 975 240" />
    <line class="line" x1="880" y1="280" x2="845" y2="280" />
    <line class="line" x1="650" y1="280" x2="615" y2="280" />
    <line class="line" x1="420" y1="280" x2="385" y2="280" />
  </g>

  <g>
    <path class="check" d="M 600 395 L 745 465 L 600 535 L 455 465 Z" />
    <text class="text" x="600" y="455">요구사항을 올바르게</text>
    <text class="text" x="600" y="480">표현하는가?</text>
    <rect class="done" x="850" y="430" width="190" height="70" rx="8" />
    <text class="text" x="945" y="472">설계 초안 채택</text>
    <rect class="box" x="145" y="430" width="220" height="70" />
    <text class="text" x="255" y="458">엔터티·속성·관계</text>
    <text class="small" x="255" y="482">재검토</text>
    <path class="line" d="M 285 315 L 285 365 L 600 365 L 600 395" />
    <line class="line" x1="745" y1="465" x2="845" y2="465" />
    <text class="small" x="800" y="450">예</text>
    <line class="return" x1="455" y1="465" x2="370" y2="465" />
    <text class="small" x="415" y="450">아니요</text>
    <path class="return" d="M 255 430 L 255 205 L 395 205 L 395 175" />
  </g>
</svg>
