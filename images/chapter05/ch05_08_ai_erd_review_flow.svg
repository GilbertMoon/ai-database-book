<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1210" viewBox="0 0 1200 1210" role="img" aria-labelledby="title desc"><title id="title">AI 생성 ERD 검토 흐름</title><desc id="desc">AI가 생성한 ERD를 요구사항 추적, 엔터티와 속성, 키와 관계, 중복과 선택성, PostgreSQL 구현, 정상·예외 데이터와 JOIN 결과로 반복 검증한 뒤 근거와 함께 채택하는 흐름</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}.t{font-size:28px;font-weight:700;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.panel{stroke-width:1.5;rx:15}.start{fill:#eef5ff;stroke:#6fa2e8}.review{fill:#f8fafc;stroke:#a8b3c4}.build{fill:#fff8e8;stroke:#d69e2e}.test{fill:#f2fbf5;stroke:#8bc9a0}.pt{font-size:19px;font-weight:700}.box{fill:#fff;stroke-width:1.4;rx:10}.blue{stroke:#3b82c4}.orange{stroke:#d69e2e}.green{stroke:#3c9a5f}.red{stroke:#d9534f}.purple{stroke:#7c5cc4}.gray{stroke:#64748b}.h{font-size:14px;font-weight:700;text-anchor:middle}.m{font-size:11.3px;text-anchor:middle;fill:#475569}.code{font-family:Consolas,D2Coding,monospace;font-size:12.5px;font-weight:700;text-anchor:middle;fill:#334155}.arr{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.back{stroke:#d9534f;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#a)}.decision{fill:#fff8e8;stroke:#b7791f;stroke-width:1.8}.dt{font-size:14px;font-weight:700;text-anchor:middle}.note{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.3;rx:9}.nt{font-size:11.4px;font-weight:700;text-anchor:middle;fill:#92400e}.core{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.5;rx:10}.cv{font-size:14.3px;font-weight:700;text-anchor:middle;fill:#166534}</style></defs><rect width="1200" height="1210" fill="#fff"/><text x="600" y="40" class="t">AI 생성 ERD 검토 흐름</text><text x="600" y="68" class="s">AI 제안은 검증되지 않은 가설이며, 요구사항과 실행 결과가 뒷받침할 때만 설계로 채택한다</text><rect x="35" y="100" width="1130" height="190" class="panel start"/><text x="60" y="132" class="pt">1. AI 초안을 원문 요구사항과 대조</text><rect x="60" y="160" width="300" height="82" class="box blue"/><text x="210" y="187" class="h">AI 생성 ERD 초안</text><text x="210" y="211" class="m">빠른 시작점이지만 누락·오해·가정이 포함될 수 있음</text><rect x="450" y="160" width="300" height="82" class="box purple"/><text x="600" y="187" class="h">원문과 업무 시나리오</text><text x="600" y="211" class="m">회원·책·대여·반납·미반납·중복·잘못된 참조</text><rect x="840" y="160" width="300" height="82" class="box green"/><text x="990" y="187" class="h">요구사항 추적표</text><text x="990" y="211" class="m">각 문장 → 테이블·컬럼·관계·제약조건으로 연결</text><path d="M360 201H450" class="arr"/><path d="M750 201H840" class="arr"/><text x="600" y="267" class="m">그림이 그럴듯한지보다 요구사항의 모든 문장을 어디에 반영했는지 설명할 수 있어야 함</text><rect x="35" y="320" width="1130" height="300" class="panel review"/><text x="60" y="352" class="pt">2. 구조를 다섯 관점에서 검토</text><rect x="55" y="385" width="330" height="92" class="box blue"/><text x="220" y="411" class="h">엔터티</text><text x="220" y="434" class="m">독립적으로 식별·관리할 대상인가?</text><text x="220" y="456" class="code">members · books · loans</text><rect x="435" y="385" width="330" height="92" class="box purple"/><text x="600" y="411" class="h">속성 소유자</text><text x="600" y="434" class="m">email은 members, title은 books</text><text x="600" y="456" class="code">borrowed_at은 loans</text><rect x="815" y="385" width="330" height="92" class="box orange"/><text x="980" y="411" class="h">키와 제약조건</text><text x="980" y="434" class="m">PK·FK·NOT NULL·UNIQUE</text><text x="980" y="456" class="m">NULL 허용이 업무 규칙과 맞는가?</text><rect x="245" y="505" width="330" height="78" class="box red"/><text x="410" y="531" class="h">관계와 선택성</text><text x="410" y="554" class="m">1:N·N:M 변환, 0..N·정확히 1을</text><text x="410" y="574" class="m">문장으로 설명할 수 있는가?</text><rect x="625" y="505" width="330" height="78" class="box green"/><text x="790" y="531" class="h">중복과 확장성</text><text x="790" y="554" class="m">회원·책 정보가 대여마다 반복되지 않고</text><text x="790" y="574" class="m">새 관계 속성을 loans에 추가할 수 있는가?</text><text x="600" y="607" class="m">자주 발생하는 오류: members.book_id 하나로 N:M을 표현하거나 대여 날짜를 members·books에 잘못 배치</text><rect x="35" y="650" width="1130" height="165" class="panel build"/><text x="60" y="682" class="pt">3. PostgreSQL로 구현 가능한지 확인</text><rect x="60" y="715" width="315" height="62" class="box gray"/><text x="217" y="739" class="h">타입과 길이</text><text x="217" y="763" class="code">SERIAL · VARCHAR · INT · DATE</text><rect x="442" y="715" width="315" height="62" class="box blue"/><text x="599" y="739" class="h">생성 순서와 참조</text><text x="599" y="763" class="m">members·books 먼저 → loans 나중</text><rect x="825" y="715" width="315" height="62" class="box orange"/><text x="982" y="739" class="h">CREATE TABLE 제약조건</text><text x="982" y="763" class="m">PK·UK·FK·NOT NULL·NULL 허용 명시</text><text x="600" y="801" class="m">ERD를 고치면 SQL도 바꾸고, SQL에서 발견한 규칙은 ERD와 추적표에 되돌려 반영</text><path d="M600 620V650" class="arr"/><rect x="35" y="845" width="1130" height="170" class="panel test"/><text x="60" y="877" class="pt">4. 정상·선택·오류 데이터와 JOIN으로 검증</text><rect x="55" y="910" width="250" height="62" class="box green"/><text x="180" y="934" class="h">정상 사례</text><text x="180" y="958" class="m">한 회원의 여러 대여·한 책의 여러 대여</text><rect x="330" y="910" width="250" height="62" class="box orange"/><text x="455" y="934" class="h">선택 상태</text><text x="455" y="958" class="code">returned_at = NULL</text><rect x="605" y="910" width="250" height="62" class="box red"/><text x="730" y="934" class="h">오류 사례</text><text x="730" y="958" class="m">중복 email·isbn, 없는 FK 차단</text><rect x="880" y="910" width="250" height="62" class="box blue"/><text x="1005" y="934" class="h">조회 사례</text><text x="1005" y="958" class="m">JOIN으로 회원·책·대여일 복원</text><text x="600" y="998" class="m">생성 성공만 보지 않고 실제 저장 결과와 오류 차단, 필요한 조회 결과가 모두 예상과 같은지 확인</text><path d="M600 815V845" class="arr"/><polygon points="600,1035 725,1070 600,1105 475,1070" class="decision"/><text x="600" y="1065" class="dt">요구사항·ERD·SQL·결과가 일치하는가?</text><text x="600" y="1085" class="m">불일치하면 원인 단계를 구분해 다시 검토</text><path d="M180 972V1015H600V1035" class="arr"/><path d="M455 972V1035" class="arr"/><path d="M730 972V1015H600" class="arr"/><path d="M1005 972V1015H600" class="arr"/><rect x="55" y="1125" width="470" height="52" class="box red"/><text x="290" y="1147" class="h">아니요 · 수정 후 재검토</text><text x="290" y="1167" class="m">요구사항 해석·AI 초안·ERD·SQL·테스트 중 원인 확인</text><rect x="675" y="1125" width="470" height="52" class="box green"/><text x="910" y="1147" class="h">예 · 검토된 ERD 채택</text><text x="910" y="1167" class="m">요구사항·ERD·SQL·샘플·검증 결과를 같은 버전으로 기록</text><path d="M475 1070H290V1125" class="back"/><path d="M725 1070H910V1125" class="arr"/><path d="M55 1151H20V201H60" class="back"/><rect x="120" y="1190" width="960" height="16" class="core"/><text x="600" y="1203" class="cv">AI 초안 → 요구사항 추적 → 구조 검토 → SQL 구현 → 데이터 검증 → 근거와 함께 채택</text></svg>