<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">AI 생성 ERD 검토 흐름</title>
  <desc id="desc">원문 요구사항, AI 초안, 사람 검토, PostgreSQL DDL, 샘플 데이터와 JOIN 검증을 반복하는 흐름</desc>
  <style>
      .ko { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #1f2937; }
      .mono { font-family: Consolas, D2Coding, "Courier New", monospace; fill: #1f2937; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #4b5563; }
      .box-title { font-size: 18px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12.5px; }
      .card { stroke: #64748b; stroke-width: 1.6; rx: 14; ry: 14; }
      .entity { fill: #eaf3ff; }
      .attribute { fill: #ecf9ef; }
      .relation { fill: #f2ecff; }
      .decision { fill: #fff6d8; }
      .danger { fill: #ffeaea; }
      .ok { fill: #eaf8ee; }
      .pk { fill: #1d4ed8; font-weight: 700; }
      .fk { fill: #c2410c; font-weight: 700; }
      .line { stroke: #475569; stroke-width: 2; fill: none; }
      .dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
    </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="700" fill="#ffffff"/>
  <text x="600.0" y="42" text-anchor="middle" class="ko title">
    <tspan x="600.0" dy="0">AI 생성 ERD 검토 흐름</tspan>
  </text>
  <text x="600.0" y="70" text-anchor="middle" class="ko subtitle">
    <tspan x="600.0" dy="0">AI 결과는 완성된 정답이 아니라 검증해야 할 설계 초안입니다.</tspan>
  </text>
  <rect x="40" y="130" width="190" height="90" rx="14" ry="14" class="card entity"/>
  <text x="135.0" y="180" text-anchor="middle" class="ko box-title">
    <tspan x="135.0" dy="0">1. 원문 요구사항 확인</tspan>
  </text>
  <rect x="270" y="130" width="190" height="90" rx="14" ry="14" class="card relation"/>
  <text x="365.0" y="180" text-anchor="middle" class="ko box-title">
    <tspan x="365.0" dy="0">2. AI 생성 ERD 초안</tspan>
  </text>
  <rect x="500" y="105" width="240" height="140" rx="14" ry="14" class="card entity"/>
  <text x="620.0" y="155" text-anchor="middle" class="ko box-title">
    <tspan x="620.0" dy="0">3. 사람이 구조 검토</tspan>
  </text>
  <rect x="780" y="130" width="190" height="90" rx="14" ry="14" class="card attribute"/>
  <text x="875.0" y="180" text-anchor="middle" class="ko box-title">
    <tspan x="875.0" dy="0">4. PostgreSQL DDL</tspan>
  </text>
  <rect x="1010" y="130" width="150" height="90" rx="14" ry="14" class="card attribute"/>
  <text x="1085.0" y="180" text-anchor="middle" class="ko box-title">
    <tspan x="1085.0" dy="0">5. 데이터·JOIN 검증</tspan>
  </text>
  <line x1="230" y1="175" x2="270" y2="175" class="line" marker-end="url(#arrow)"/>
  <line x1="460" y1="175" x2="500" y2="175" class="line" marker-end="url(#arrow)"/>
  <line x1="740" y1="175" x2="780" y2="175" class="line" marker-end="url(#arrow)"/>
  <line x1="970" y1="175" x2="1010" y2="175" class="line" marker-end="url(#arrow)"/>
  <text x="620" y="155" text-anchor="middle" class="ko small">
    <tspan x="620" dy="0">엔터티 · 속성 · PK/FK</tspan>
    <tspan x="620" dy="24">1:N·N:M · 중복 · NULL</tspan>
  </text>
  <rect x="430" y="330" width="340" height="110" rx="14" ry="14" class="card decision"/>
  <text x="600" y="372" text-anchor="middle" class="ko box-title">
    <tspan x="600" dy="0">요구사항을 올바르게</tspan>
    <tspan x="600" dy="26">표현하는가?</tspan>
  </text>
  <line x1="1085" y1="220" x2="720" y2="330" class="line" marker-end="url(#arrow)"/>
  <rect x="850" y="500" width="260" height="95" rx="14" ry="14" class="card ok"/>
  <text x="980" y="535" text-anchor="middle" class="ko body">
    <tspan x="980" dy="0">예 → 설계 초안 채택</tspan>
    <tspan x="980" dy="26">판단 근거 기록</tspan>
  </text>
  <line x1="770" y1="385" x2="850" y2="540" class="line" marker-end="url(#arrow)"/>
  <rect x="90" y="500" width="320" height="95" rx="14" ry="14" class="card danger"/>
  <text x="250" y="535" text-anchor="middle" class="ko body">
    <tspan x="250" dy="0">아니요 → 누락·과잉·관계 오류 수정</tspan>
    <tspan x="250" dy="26">AI 요청 또는 ERD 수정</tspan>
  </text>
  <path d="M 430 385 C 330 420, 300 470, 300 500" class="line" marker-end="url(#arrow)"/>
  <path d="M 250 500 C 250 390, 365 330, 365 220" class="dash" marker-end="url(#arrow)"/>
  <text x="355" y="345" text-anchor="middle" class="ko small">
    <tspan x="355" dy="0">다시 검증</tspan>
  </text>
  <rect x="380" y="630" width="440" height="45" rx="14" ry="14" class="card decision"/>
  <text x="600" y="659" text-anchor="middle" class="ko body">
    <tspan x="600" dy="0">최종 판단은 사람이 수행합니다.</tspan>
  </text>
</svg>
