<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">AI 생성 ERD 검토 흐름</title>
  <desc id="desc">AI가 만든 ERD 초안을 요구사항, 관계, PostgreSQL DDL, 샘플 데이터와 JOIN으로 검토하고 실패하면 수정 단계로 되돌아가는 흐름이다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#54606f" />
    </marker>
  </defs>
  <style>
    .bg { fill: #ffffff; }
    .title { font: 700 28px "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #172033; }
    .req { fill: #eef6ff; stroke: #6b9bd2; stroke-width: 2; rx: 8; }
    .ai { fill: #f4efff; stroke: #8e78c9; stroke-width: 2; rx: 8; }
    .check { fill: #fff7d9; stroke: #d8aa34; stroke-width: 2; rx: 8; }
    .ok { fill: #edf8ef; stroke: #70a879; stroke-width: 2; rx: 8; }
    .fix { fill: #fff0f0; stroke: #d57979; stroke-width: 2; rx: 8; }
    .text { font: 700 17px "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #1f2a3d; text-anchor: middle; }
    .small { font: 14px "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #4d596b; text-anchor: middle; }
    .line { fill: none; stroke: #54606f; stroke-width: 2.4; marker-end: url(#arrow); }
    .return { fill: none; stroke: #8c6cc4; stroke-width: 2.2; stroke-dasharray: 8 6; marker-end: url(#arrow); }
  </style>
  <rect class="bg" width="1200" height="660" />
  <text class="title" x="600" y="48">AI 생성 ERD 검토 흐름</text>

  <rect class="req" x="80" y="115" width="230" height="90" />
  <text class="text" x="195" y="150">1. 원문 요구사항</text>
  <text class="small" x="195" y="178">범위와 규칙 확인</text>

  <rect class="ai" x="365" y="115" width="230" height="90" />
  <text class="text" x="480" y="150">2. AI ERD 초안</text>
  <text class="small" x="480" y="178">설계 가설로 사용</text>

  <rect class="req" x="650" y="95" width="260" height="130" />
  <text class="text" x="780" y="130">3. 사람이 구조 검토</text>
  <text class="small" x="780" y="160">엔터티·속성·PK/FK</text>
  <text class="small" x="780" y="188">1:N·N:M·NULL 허용</text>

  <rect class="ai" x="365" y="310" width="230" height="90" />
  <text class="text" x="480" y="345">4. PostgreSQL DDL</text>
  <text class="small" x="480" y="373">실제로 생성 가능한가</text>

  <rect class="check" x="650" y="310" width="260" height="90" />
  <text class="text" x="780" y="345">5. 샘플 데이터·JOIN</text>
  <text class="small" x="780" y="373">관계 표현 확인</text>

  <path class="check" d="M 1010 285 L 1130 355 L 1010 425 L 890 355 Z" />
  <text class="text" x="1010" y="345">요구사항을</text>
  <text class="text" x="1010" y="370">표현하는가?</text>

  <rect class="ok" x="860" y="520" width="250" height="80" />
  <text class="text" x="985" y="552">설계 초안 채택</text>
  <text class="small" x="985" y="578">판단 근거 기록</text>

  <rect class="fix" x="90" y="520" width="300" height="80" />
  <text class="text" x="240" y="552">누락·과잉·관계 오류 수정</text>
  <text class="small" x="240" y="578">AI 재요청 또는 ERD 수정</text>

  <line class="line" x1="310" y1="160" x2="360" y2="160" />
  <line class="line" x1="595" y1="160" x2="645" y2="160" />
  <path class="line" d="M 780 225 L 780 265 L 480 265 L 480 305" />
  <line class="line" x1="595" y1="355" x2="645" y2="355" />
  <line class="line" x1="910" y1="355" x2="885" y2="355" />
  <path class="line" d="M 1010 425 L 1010 515" />
  <text class="small" x="1050" y="475">예</text>
  <path class="return" d="M 890 355 L 240 355 L 240 515" />
  <text class="small" x="850" y="335">아니요</text>
  <path class="return" d="M 390 560 L 780 560 L 780 230" />
</svg>
