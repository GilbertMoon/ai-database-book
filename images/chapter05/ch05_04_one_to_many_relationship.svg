<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">1:N 관계와 외래키 위치</title>
  <desc id="desc">members와 loans의 1:N 관계에서 외래키 member_id는 N쪽인 loans 테이블에 위치한다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#54606f" />
    </marker>
  </defs>
  <style>
    .bg { fill: #ffffff; }
    .title { font: 700 28px "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #172033; }
    .one { fill: #eef6ff; stroke: #6b9bd2; stroke-width: 2; rx: 8; }
    .many { fill: #f4efff; stroke: #8e78c9; stroke-width: 2; rx: 8; }
    .note { fill: #fff7d9; stroke: #d8aa34; stroke-width: 2; rx: 8; }
    .head { font: 700 21px Consolas, D2Coding, "Courier New", monospace; fill: #1f2a3d; text-anchor: middle; }
    .code { font: 16px Consolas, D2Coding, "Courier New", monospace; fill: #263246; text-anchor: middle; }
    .text { font: 16px "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #334155; text-anchor: middle; }
    .rel { font: 700 22px "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #1f2a3d; text-anchor: middle; }
    .line { stroke: #54606f; stroke-width: 2.6; fill: none; }
    .ref { stroke: #54606f; stroke-width: 2.2; stroke-dasharray: 8 6; fill: none; marker-end: url(#arrow); }
  </style>
  <rect class="bg" width="1200" height="520" />
  <text class="title" x="600" y="48">1:N 관계와 외래키 위치</text>

  <rect class="one" x="150" y="150" width="280" height="170" />
  <text class="head" x="290" y="195">members</text>
  <text class="code" x="290" y="238">PK id</text>
  <text class="text" x="290" y="280">회원 한 명</text>

  <rect class="many" x="770" y="150" width="280" height="170" />
  <text class="head" x="910" y="195">loans</text>
  <text class="code" x="910" y="238">FK member_id</text>
  <text class="text" x="910" y="280">여러 대여 기록</text>

  <line class="line" x1="430" y1="235" x2="770" y2="235" />
  <text class="rel" x="495" y="220">1</text>
  <text class="rel" x="705" y="220">0..N</text>
  <path class="ref" d="M 830 320 C 760 405, 430 405, 360 320" />
  <text class="text" x="600" y="430">N쪽 테이블인 loans에 외래키를 둔다</text>

  <rect class="note" x="445" y="105" width="310" height="56" />
  <text class="text" x="600" y="140">loans.member_id → members.id</text>
</svg>
