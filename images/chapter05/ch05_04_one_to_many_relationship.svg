<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc"><title id="title">1:N 관계 구조</title><desc id="desc">members 한 행의 기본키를 여러 loans 행의 member_id 외래키가 반복 참조하며, 회원은 대여 기록이 없을 수도 있지만 각 대여 기록은 정확히 한 회원을 가리키는 구조와 외래키 검증을 설명하는 도식</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}.t{font-size:28px;font-weight:700;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.panel{stroke-width:1.5;rx:15}.rule{fill:#eef5ff;stroke:#6fa2e8}.rows{fill:#f8fafc;stroke:#a8b3c4}.why{fill:#fff8e8;stroke:#d69e2e}.verify{fill:#f2fbf5;stroke:#8bc9a0}.pt{font-size:19px;font-weight:700}.box{fill:#fff;stroke-width:1.4;rx:10}.blue{stroke:#3b82c4}.orange{stroke:#d69e2e}.green{stroke:#3c9a5f}.red{stroke:#d9534f}.purple{stroke:#7c5cc4}.h{font-size:14px;font-weight:700;text-anchor:middle}.m{font-size:11.4px;text-anchor:middle;fill:#475569}.code{font-family:Consolas,D2Coding,monospace;font-size:13px;font-weight:700;text-anchor:middle;fill:#334155}.arr{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.link1{stroke:#3b82c4;stroke-width:2.2;fill:none;marker-end:url(#a)}.link2{stroke:#7c5cc4;stroke-width:2.2;fill:none;marker-end:url(#a)}.dash{stroke:#d69e2e;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#a)}.table{fill:#fff;stroke:#64748b;stroke-width:1.5;rx:10}.headB{fill:#dcecff}.headO{fill:#fff1cf}.th{font-size:16px;font-weight:700;text-anchor:middle}.subh{font-size:11px;text-anchor:middle;fill:#475569}.row{stroke:#cbd5e1;stroke-width:1}.cell{font-size:11.2px;fill:#334155}.key{font-size:11.2px;font-weight:700;fill:#1d4ed8}.fk{font-size:11.2px;font-weight:700;fill:#92400e}.sample{font-size:10.7px;fill:#475569}.tag{font-size:12px;font-weight:700;text-anchor:middle}.note{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.3;rx:9}.nt{font-size:11.5px;font-weight:700;text-anchor:middle;fill:#92400e}.core{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.5;rx:10}.cv{font-size:14.5px;font-weight:700;text-anchor:middle;fill:#166534}</style></defs><rect width="1200" height="1050" fill="#fff"/><text x="600" y="40" class="t">1:N 관계 구조</text><text x="600" y="68" class="s">한 부모 행에 여러 자식 행이 연결되며, 각 N쪽 행이 자신이 속한 1쪽 행의 PK를 FK로 저장한다</text><rect x="35" y="100" width="1130" height="165" class="panel rule"/><text x="60" y="132" class="pt">1. 업무 규칙을 수량과 필수성으로 읽기</text><rect x="70" y="160" width="500" height="68" class="box blue"/><text x="320" y="186" class="h">회원 → 대여 기록</text><text x="320" y="210" class="m">회원 한 명은 대여 기록을 0건 이상 가질 수 있음</text><rect x="630" y="160" width="500" height="68" class="box orange"/><text x="880" y="186" class="h">대여 기록 → 회원</text><text x="880" y="210" class="m">각 대여 기록은 정확히 한 회원에 속함</text><text x="600" y="248" class="code">members 1 ───── 0..N loans</text><rect x="35" y="300" width="1130" height="350" class="panel rows"/><text x="60" y="332" class="pt">2. 같은 부모 PK를 여러 자식 FK가 참조</text><rect x="75" y="365" width="390" height="245" class="table"/><rect x="75" y="365" width="390" height="54" class="headB"/><text x="270" y="388" class="th">members · 1쪽 부모 테이블</text><text x="270" y="408" class="subh">회원마다 id PK로 한 행을 식별</text><line x1="75" y1="419" x2="465" y2="419" class="row"/><line x1="75" y1="477" x2="465" y2="477" class="row"/><line x1="75" y1="535" x2="465" y2="535" class="row"/><text x="100" y="448" class="key">id = 1</text><text x="245" y="448" class="cell">김민지</text><text x="100" y="506" class="key">id = 2</text><text x="245" y="506" class="cell">이준호</text><text x="100" y="564" class="key">id = 3</text><text x="245" y="564" class="cell">박서연</text><text x="270" y="596" class="m">박서연은 현재 대여 기록 0건이어도 회원으로 존재 가능</text><rect x="735" y="350" width="390" height="275" class="table"/><rect x="735" y="350" width="390" height="54" class="headO"/><text x="930" y="373" class="th">loans · N쪽 자식 테이블</text><text x="930" y="393" class="subh">각 행의 member_id가 부모 회원 한 명을 가리킴</text><line x1="735" y1="404" x2="1125" y2="404" class="row"/><line x1="735" y1="470" x2="1125" y2="470" class="row"/><line x1="735" y1="536" x2="1125" y2="536" class="row"/><text x="760" y="430" class="key">id = 101</text><text x="875" y="430" class="fk">member_id = 1</text><text x="1040" y="430" class="sample">첫 번째 대여</text><text x="760" y="496" class="key">id = 102</text><text x="875" y="496" class="fk">member_id = 1</text><text x="1040" y="496" class="sample">두 번째 대여</text><text x="760" y="562" class="key">id = 103</text><text x="875" y="562" class="fk">member_id = 2</text><text x="1040" y="562" class="sample">이준호 대여</text><text x="930" y="598" class="m">같은 member_id 값은 여러 자식 행에서 반복 가능</text><path d="M465 448H600V430H735" class="link1"/><path d="M465 448H620V496H735" class="link1"/><path d="M465 506H650V562H735" class="link2"/><text x="585" y="416" class="tag" fill="#1d4ed8">1</text><text x="690" y="416" class="tag" fill="#92400e">N</text><rect x="500" y="565" width="200" height="45" class="box green"/><text x="600" y="585" class="h">참조 조건</text><text x="600" y="603" class="code">loans.member_id → members.id</text><rect x="35" y="680" width="1130" height="170" class="panel why"/><text x="60" y="712" class="pt">3. 왜 외래키는 N쪽에 두는가?</text><rect x="65" y="745" width="500" height="70" class="box green"/><text x="315" y="769" class="h">권장 구조 · loans.member_id</text><text x="315" y="791" class="m">자식 행 하나가 자신이 속한 부모 id 하나를 저장</text><text x="315" y="808" class="m">행이 늘어나도 같은 컬럼 구조를 유지</text><rect x="635" y="745" width="500" height="70" class="box red"/><text x="885" y="769" class="h">부모에 loan_id 목록 저장</text><text x="885" y="791" class="m">대여 건수에 따라 값 개수가 변하고 한 컬럼에 여러 값이 필요</text><text x="885" y="808" class="m">조회·추가·무결성 관리가 복잡해짐</text><rect x="35" y="880" width="1130" height="95" class="panel verify"/><text x="60" y="912" class="pt">4. 새 대여 기록의 참조 검증</text><rect x="75" y="930" width="310" height="30" class="box green"/><text x="230" y="950" class="m">member_id = 1 · 부모 존재 → 저장 가능</text><rect x="445" y="930" width="310" height="30" class="box red"/><text x="600" y="950" class="m">member_id = 999 · 부모 없음 → FK 오류</text><rect x="815" y="930" width="310" height="30" class="box blue"/><text x="970" y="950" class="m">JOIN: members.id = loans.member_id</text><rect x="55" y="995" width="350" height="35" class="note"/><text x="230" y="1018" class="nt">1:N은 모든 부모가 여러 자식을 가진다는 뜻이 아님</text><rect x="425" y="995" width="350" height="35" class="note"/><text x="600" y="1018" class="nt">member_id NOT NULL이면 각 대여에 회원이 필수</text><rect x="795" y="995" width="350" height="35" class="core"/><text x="970" y="1018" class="cv">N쪽 행이 1쪽 PK를 FK로 저장</text><rect x="130" y="1038" width="940" height="8" class="core"/></svg>