<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">1:N 관계와 외래키 위치</title>
  <desc id="desc">members 한 행과 loans 여러 행의 관계에서 외래키가 N쪽 loans에 위치하는 구조</desc>
  <style>
      .ko { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #1f2937; }
      .mono { font-family: Consolas, D2Coding, "Courier New", monospace; fill: #1f2937; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #4b5563; }
      .box-title { font-size: 18px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12.5px; }
      .card { stroke: #64748b; stroke-width: 1.6; rx: 14; ry: 14; }
      .entity { fill: #eaf3ff; }
      .attribute { fill: #ecf9ef; }
      .relation { fill: #f2ecff; }
      .decision { fill: #fff6d8; }
      .danger { fill: #ffeaea; }
      .ok { fill: #eaf8ee; }
      .pk { fill: #1d4ed8; font-weight: 700; }
      .fk { fill: #c2410c; font-weight: 700; }
      .line { stroke: #475569; stroke-width: 2; fill: none; }
      .dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
    </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="560" fill="#ffffff"/>
  <text x="600.0" y="42" text-anchor="middle" class="ko title">
    <tspan x="600.0" dy="0">1:N 관계와 외래키 위치</tspan>
  </text>
  <text x="600.0" y="70" text-anchor="middle" class="ko subtitle">
    <tspan x="600.0" dy="0">외래키는 여러 행이 생기는 N쪽 테이블에 둡니다.</tspan>
  </text>
  <rect x="130" y="150" width="300" height="230" rx="14" ry="14" class="card entity"/>
  <text x="280" y="190" text-anchor="middle" class="ko box-title">
    <tspan x="280" dy="0">members · 1쪽</tspan>
  </text>
  <text x="180" y="245" text-anchor="start" class="mono body">
    <tspan x="180" dy="0" class="pk">PK  id</tspan>
    <tspan x="180" dy="38">name</tspan>
  </text>
  <rect x="770" y="130" width="300" height="270" rx="14" ry="14" class="card relation"/>
  <text x="920" y="170" text-anchor="middle" class="ko box-title">
    <tspan x="920" dy="0">loans · N쪽</tspan>
  </text>
  <text x="820" y="225" text-anchor="start" class="mono body">
    <tspan x="820" dy="0" class="pk">PK  id</tspan>
    <tspan x="820" dy="38" class="fk">FK  member_id</tspan>
    <tspan x="820" dy="38">borrowed_at</tspan>
  </text>
  <line x1="430" y1="265" x2="770" y2="265" class="line" marker-end="url(#arrow)"/>
  <text x="470" y="240" text-anchor="middle" class="ko box-title">
    <tspan x="470" dy="0">1</tspan>
  </text>
  <text x="720" y="240" text-anchor="middle" class="ko box-title">
    <tspan x="720" dy="0">0..N</tspan>
  </text>
  <path d="M 770 325 C 640 430, 440 430, 430 325" class="dash" marker-end="url(#arrow)"/>
  <text x="600" y="425" text-anchor="middle" class="ko small">
    <tspan x="600" dy="0">loans.member_id → members.id</tspan>
  </text>
  <rect x="430" y="455" width="340" height="70" rx="14" ry="14" class="card attribute"/>
  <text x="600" y="485" text-anchor="middle" class="ko body">
    <tspan x="600" dy="0">회원 id=1 → 대여 101, 102</tspan>
    <tspan x="600" dy="24">FK 반복은 정상적인 관계 표현</tspan>
  </text>
</svg>
