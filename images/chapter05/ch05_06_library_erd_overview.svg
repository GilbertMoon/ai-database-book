<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">도서 대여 시스템 핵심 ERD</title>
  <desc id="desc">members, loans, books 세 테이블의 기본키, 외래키, 주요 컬럼과 1 대 0..N 관계를 보여 주는 ERD이다.</desc>
  <style>
    .bg { fill: #ffffff; }
    .title { font: 700 28px "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #172033; }
    .table { fill: #eef6ff; stroke: #6b9bd2; stroke-width: 2; rx: 8; }
    .bridge { fill: #f4efff; stroke: #8e78c9; stroke-width: 2; rx: 8; }
    .head { font: 700 21px Consolas, D2Coding, "Courier New", monospace; fill: #1f2a3d; text-anchor: middle; }
    .code { font: 15px Consolas, D2Coding, "Courier New", monospace; fill: #263246; }
    .pk { fill: #dbeafe; }
    .fk { fill: #fff0d7; }
    .uk { fill: #edf8ef; }
    .text { font: 14px "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #334155; text-anchor: middle; }
    .rel { font: 700 18px "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #1f2a3d; text-anchor: middle; }
    .line { stroke: #54606f; stroke-width: 2.6; fill: none; }
    .ref { stroke: #8c6cc4; stroke-width: 2; stroke-dasharray: 8 6; fill: none; }
  </style>
  <rect class="bg" width="1200" height="660" />
  <text class="title" x="600" y="48">도서 대여 시스템 핵심 ERD</text>

  <rect class="table" x="70" y="155" width="300" height="300" />
  <text class="head" x="220" y="200">members</text>
  <rect class="pk" x="100" y="225" width="240" height="34" rx="5" />
  <text class="code" x="125" y="248">PK id</text>
  <text class="code" x="125" y="292">name</text>
  <rect class="uk" x="100" y="310" width="240" height="34" rx="5" />
  <text class="code" x="125" y="333">email UK</text>
  <text class="code" x="125" y="376">joined_at</text>

  <rect class="bridge" x="450" y="115" width="300" height="380" />
  <text class="head" x="600" y="160">loans</text>
  <rect class="pk" x="480" y="185" width="240" height="34" rx="5" />
  <text class="code" x="505" y="208">PK id</text>
  <rect class="fk" x="480" y="230" width="240" height="34" rx="5" />
  <text class="code" x="505" y="253">FK member_id</text>
  <rect class="fk" x="480" y="275" width="240" height="34" rx="5" />
  <text class="code" x="505" y="298">FK book_id</text>
  <text class="code" x="505" y="342">borrowed_at</text>
  <text class="code" x="505" y="386">due_at</text>
  <text class="code" x="505" y="430">returned_at NULL 가능</text>

  <rect class="table" x="830" y="155" width="300" height="300" />
  <text class="head" x="980" y="200">books</text>
  <rect class="pk" x="860" y="225" width="240" height="34" rx="5" />
  <text class="code" x="885" y="248">PK id</text>
  <text class="code" x="885" y="292">title</text>
  <text class="code" x="885" y="333">author</text>
  <text class="code" x="885" y="374">published_year</text>
  <rect class="uk" x="860" y="392" width="240" height="34" rx="5" />
  <text class="code" x="885" y="415">isbn UK</text>

  <line class="line" x1="370" y1="305" x2="450" y2="305" />
  <text class="rel" x="392" y="285">1</text>
  <text class="rel" x="430" y="285">0..N</text>
  <line class="line" x1="750" y1="305" x2="830" y2="305" />
  <text class="rel" x="770" y="285">0..N</text>
  <text class="rel" x="810" y="285">1</text>

  <path class="ref" d="M 480 247 C 430 535, 265 535, 220 455" />
  <text class="text" x="340" y="545">loans.member_id → members.id</text>
  <path class="ref" d="M 720 292 C 780 570, 940 560, 980 455" />
  <text class="text" x="860" y="585">loans.book_id → books.id</text>
  <text class="text" x="600" y="535">각 loans 행은 회원 한 명과 도서 한 건을 반드시 참조한다.</text>
</svg>
