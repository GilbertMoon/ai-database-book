<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc"><title id="title">도서 대여 시스템 ERD</title><desc id="desc">members와 books가 loans에 각각 일대다로 연결되고, 기본키와 외래키, 필수값과 고유값, NULL 허용 컬럼 및 관계 선택성을 설명하는 도서 대여 시스템 ERD</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}.t{font-size:28px;font-weight:700;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.panel{stroke-width:1.5;rx:15}.erd{fill:#f8fafc;stroke:#a8b3c4}.read{fill:#eef5ff;stroke:#6fa2e8}.trace{fill:#fff8e8;stroke:#d69e2e}.pt{font-size:19px;font-weight:700}.table{fill:#fff;stroke:#64748b;stroke-width:1.5;rx:10}.headB{fill:#dcecff}.headO{fill:#fff1cf}.th{font-size:17px;font-weight:700;text-anchor:middle}.subh{font-size:11px;text-anchor:middle;fill:#475569}.line{stroke:#cbd5e1;stroke-width:1}.cell{font-size:11.2px;fill:#334155}.type{font-size:10.5px;fill:#64748b}.pk{font-size:10.8px;font-weight:700;fill:#1d4ed8}.fk{font-size:10.8px;font-weight:700;fill:#92400e}.uk{font-size:10.8px;font-weight:700;fill:#6d28d9}.nn{font-size:10.5px;font-weight:700;fill:#166534}.nullable{font-size:10.5px;font-weight:700;fill:#b45309}.relB{stroke:#3b82c4;stroke-width:2.4;fill:none}.relO{stroke:#d69e2e;stroke-width:2.4;fill:none}.card{font-size:12px;font-weight:700;text-anchor:middle}.label{font-size:11.2px;text-anchor:middle;fill:#475569}.box{fill:#fff;stroke-width:1.4;rx:10}.blue{stroke:#3b82c4}.orange{stroke:#d69e2e}.green{stroke:#3c9a5f}.purple{stroke:#7c5cc4}.red{stroke:#d9534f}.h{font-size:14px;font-weight:700;text-anchor:middle}.m{font-size:11.4px;text-anchor:middle;fill:#475569}.code{font-family:Consolas,D2Coding,monospace;font-size:12.8px;font-weight:700;text-anchor:middle;fill:#334155}.note{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.3;rx:9}.nt{font-size:11.4px;font-weight:700;text-anchor:middle;fill:#92400e}.core{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.5;rx:10}.cv{font-size:14.3px;font-weight:700;text-anchor:middle;fill:#166534}</style></defs><rect width="1200" height="1120" fill="#fff"/><text x="600" y="40" class="t">도서 대여 시스템 ERD</text><text x="600" y="68" class="s">ERD는 테이블 목록뿐 아니라 키·제약조건·관계 수와 선택성을 함께 읽는 설계 문서다</text><rect x="35" y="100" width="1130" height="600" class="panel erd"/><text x="60" y="132" class="pt">1. 테이블·컬럼·키·관계 구조</text><rect x="50" y="170" width="320" height="390" class="table"/><rect x="50" y="170" width="320" height="58" class="headB"/><text x="210" y="194" class="th">members</text><text x="210" y="215" class="subh">회원 한 명을 한 행으로 관리</text><line x1="50" y1="228" x2="370" y2="228" class="line"/><line x1="50" y1="300" x2="370" y2="300" class="line"/><line x1="50" y1="372" x2="370" y2="372" class="line"/><line x1="50" y1="444" x2="370" y2="444" class="line"/><text x="70" y="252" class="pk">PK</text><text x="110" y="252" class="cell">id</text><text x="235" y="252" class="type">SERIAL</text><text x="330" y="252" class="nn">필수</text><text x="70" y="324" class="cell">name</text><text x="235" y="324" class="type">VARCHAR(50)</text><text x="330" y="324" class="nn">필수</text><text x="70" y="396" class="uk">UK</text><text x="110" y="396" class="cell">email</text><text x="235" y="396" class="type">VARCHAR(100)</text><text x="330" y="396" class="nn">필수</text><text x="70" y="468" class="cell">joined_at</text><text x="235" y="468" class="type">DATE</text><text x="330" y="468" class="nn">필수</text><rect x="440" y="145" width="320" height="465" class="table"/><rect x="440" y="145" width="320" height="58" class="headO"/><text x="600" y="169" class="th">loans</text><text x="600" y="190" class="subh">회원과 책 사이의 대여 사건 한 건</text><line x1="440" y1="203" x2="760" y2="203" class="line"/><line x1="440" y1="263" x2="760" y2="263" class="line"/><line x1="440" y1="323" x2="760" y2="323" class="line"/><line x1="440" y1="383" x2="760" y2="383" class="line"/><line x1="440" y1="443" x2="760" y2="443" class="line"/><line x1="440" y1="503" x2="760" y2="503" class="line"/><line x1="440" y1="563" x2="760" y2="563" class="line"/><text x="460" y="229" class="pk">PK</text><text x="500" y="229" class="cell">id</text><text x="630" y="229" class="type">SERIAL</text><text x="720" y="229" class="nn">필수</text><text x="460" y="289" class="fk">FK</text><text x="500" y="289" class="cell">member_id</text><text x="630" y="289" class="type">INT</text><text x="720" y="289" class="nn">필수</text><text x="460" y="349" class="fk">FK</text><text x="500" y="349" class="cell">book_id</text><text x="630" y="349" class="type">INT</text><text x="720" y="349" class="nn">필수</text><text x="460" y="409" class="cell">borrowed_at</text><text x="630" y="409" class="type">DATE</text><text x="720" y="409" class="nn">필수</text><text x="460" y="469" class="cell">due_at</text><text x="630" y="469" class="type">DATE</text><text x="720" y="469" class="nn">필수</text><text x="460" y="529" class="cell">returned_at</text><text x="630" y="529" class="type">DATE</text><text x="720" y="529" class="nullable">NULL 가능</text><text x="600" y="590" class="m">NULL이면 아직 반납되지 않은 대여</text><rect x="830" y="170" width="320" height="390" class="table"/><rect x="830" y="170" width="320" height="58" class="headB"/><text x="990" y="194" class="th">books</text><text x="990" y="215" class="subh">책 한 권을 한 행으로 관리</text><line x1="830" y1="228" x2="1150" y2="228" class="line"/><line x1="830" y1="282" x2="1150" y2="282" class="line"/><line x1="830" y1="336" x2="1150" y2="336" class="line"/><line x1="830" y1="390" x2="1150" y2="390" class="line"/><line x1="830" y1="444" x2="1150" y2="444" class="line"/><line x1="830" y1="498" x2="1150" y2="498" class="line"/><text x="850" y="252" class="pk">PK</text><text x="890" y="252" class="cell">id</text><text x="1020" y="252" class="type">SERIAL</text><text x="1110" y="252" class="nn">필수</text><text x="850" y="306" class="cell">title</text><text x="1020" y="306" class="type">VARCHAR(200)</text><text x="1110" y="306" class="nn">필수</text><text x="850" y="360" class="cell">author</text><text x="1020" y="360" class="type">VARCHAR(100)</text><text x="1110" y="360" class="nn">필수</text><text x="850" y="414" class="cell">published_year</text><text x="1020" y="414" class="type">INT</text><text x="1110" y="414" class="nullable">NULL 가능</text><text x="850" y="468" class="uk">UK</text><text x="890" y="468" class="cell">isbn</text><text x="1020" y="468" class="type">VARCHAR(20)</text><text x="1110" y="468" class="nn">필수</text><path d="M370 289H440" class="relB"/><text x="390" y="276" class="card" fill="#1d4ed8">1</text><text x="420" y="276" class="card" fill="#92400e">0..N</text><text x="405" y="312" class="label">회원별 대여 기록</text><path d="M830 349H760" class="relO"/><text x="810" y="336" class="card" fill="#1d4ed8">1</text><text x="780" y="336" class="card" fill="#92400e">0..N</text><text x="795" y="372" class="label">책별 대여 기록</text><rect x="210" y="630" width="780" height="42" class="box green"/><text x="600" y="650" class="code">loans.member_id → members.id · loans.book_id → books.id</text><text x="600" y="668" class="m">각 loans 행은 회원 정확히 1명과 책 정확히 1권을 참조</text><rect x="35" y="730" width="1130" height="165" class="panel read"/><text x="60" y="762" class="pt">2. 관계 기호를 문장으로 읽기</text><rect x="60" y="795" width="330" height="65" class="box blue"/><text x="225" y="819" class="h">members 1 : 0..N loans</text><text x="225" y="843" class="m">회원은 대여가 없어도 되고 여러 건을 가질 수 있음</text><rect x="435" y="795" width="330" height="65" class="box orange"/><text x="600" y="819" class="h">각 loans → members 정확히 1</text><text x="600" y="843" class="m">member_id가 NOT NULL이므로 회원 없는 대여는 불가</text><rect x="810" y="795" width="330" height="65" class="box purple"/><text x="975" y="819" class="h">books 1 : 0..N loans</text><text x="975" y="843" class="m">책은 대여 이력이 없어도 되고 여러 번 대여될 수 있음</text><text x="600" y="882" class="m">loans는 단순 연결선이 아니라 대여일·반납예정일·반납상태를 가진 업무 테이블</text><rect x="35" y="925" width="1130" height="110" class="panel trace"/><text x="60" y="957" class="pt">3. 요구사항이 ERD에 반영되었는지 추적</text><rect x="60" y="980" width="245" height="34" class="box purple"/><text x="182" y="1002" class="m">회원 이메일 중복 금지 → email UK</text><rect x="335" y="980" width="245" height="34" class="box purple"/><text x="457" y="1002" class="m">ISBN 중복 금지 → isbn UK</text><rect x="610" y="980" width="245" height="34" class="box orange"/><text x="732" y="1002" class="m">미반납 상태 → returned_at NULL</text><rect x="885" y="980" width="245" height="34" class="box green"/><text x="1007" y="1002" class="m">회원·책 연결 → 두 FK NOT NULL</text><rect x="55" y="1055" width="350" height="36" class="note"/><text x="230" y="1078" class="nt">PK · 행 식별 / UK · 업무상 중복 금지</text><rect x="425" y="1055" width="350" height="36" class="note"/><text x="600" y="1078" class="nt">FK · 관계 연결 / NOT NULL · 필수값</text><rect x="795" y="1055" width="350" height="36" class="core"/><text x="970" y="1078" class="cv">ERD의 각 요소는 요구사항과 검증 가능한 규칙에 대응</text><rect x="130" y="1103" width="940" height="8" class="core"/></svg>