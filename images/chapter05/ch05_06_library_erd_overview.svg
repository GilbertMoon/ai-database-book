<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">도서 대여 시스템 핵심 ERD</title><desc id="desc">members, loans, books 세 테이블의 주요 컬럼과 일대다 관계, 기본키, 외래키, 고유값, NULL 허용을 보여 준다.</desc><style>text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#1f2937}.m{font-family:Consolas,D2Coding,"Courier New",monospace}.t{font-size:28px;font-weight:700}.s{font-size:15px;fill:#4b5563}.h{font-size:19px;font-weight:700}.b{font-size:14px}.pk{fill:#1d4ed8;font-weight:700}.fk{fill:#c2410c;font-weight:700}.box{stroke:#64748b;stroke-width:2;rx:14}.e{fill:#eaf3ff}.r{fill:#f2ecff}.q{fill:#fff6d8}.line{stroke:#475569;stroke-width:2;fill:none}.dash{stroke:#64748b;stroke-width:2;stroke-dasharray:7 6;fill:none}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs><rect width="1200" height="680" fill="#fff"/><text x="600" y="45" text-anchor="middle" class="t">도서 대여 시스템 핵심 ERD</text><text x="600" y="75" text-anchor="middle" class="s">ERD와 실행 SQL은 같은 테이블·컬럼·관계를 사용합니다.</text><rect x="55" y="135" width="270" height="330" class="box e"/><text x="190" y="180" text-anchor="middle" class="h">members</text><text x="95" y="235" class="m b pk">PK id</text><text x="95" y="280" class="m b">name</text><text x="95" y="325" class="m b">email UNIQUE</text><text x="95" y="370" class="m b">joined_at</text><rect x="465" y="120" width="270" height="440" class="box r"/><text x="600" y="165" text-anchor="middle" class="h">loans</text><text x="505" y="220" class="m b pk">PK id</text><text x="505" y="265" class="m b fk">FK member_id</text><text x="505" y="310" class="m b fk">FK book_id</text><text x="505" y="355" class="m b">borrowed_at</text><text x="505" y="400" class="m b">due_at</text><text x="505" y="445" class="m b">returned_at NULL 가능</text><rect x="875" y="135" width="270" height="375" class="box e"/><text x="1010" y="180" text-anchor="middle" class="h">books</text><text x="915" y="235" class="m b pk">PK id</text><text x="915" y="280" class="m b">title</text><text x="915" y="325" class="m b">author</text><text x="915" y="370" class="m b">published_year</text><text x="915" y="415" class="m b">isbn UNIQUE</text><line x1="325" y1="350" x2="465" y2="350" class="line" marker-end="url(#ar)"/><text x="355" y="325" text-anchor="middle" class="h">1</text><text x="430" y="325" text-anchor="middle" class="h">0..N</text><line x1="735" y1="380" x2="875" y2="380" class="line" marker-end="url(#ar)"/><text x="770" y="355" text-anchor="middle" class="h">0..N</text><text x="840" y="355" text-anchor="middle" class="h">1</text><path d="M505 265H325" class="dash" marker-end="url(#ar)"/><path d="M735 310H875" class="dash" marker-end="url(#ar)"/><rect x="190" y="600" width="820" height="50" class="box q"/><text x="600" y="631" text-anchor="middle" class="b">각 loans 행은 회원 한 명과 도서 한 건을 반드시 참조합니다.</text></svg>