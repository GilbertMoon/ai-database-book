<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">도서 대여 시스템 핵심 ERD</title>
  <desc id="desc">members, loans, books 세 테이블의 컬럼과 일대다 관계, 기본키, 외래키, 고유값, NULL 허용을 보여 주는 ERD</desc>
  <style>
      .ko { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #1f2937; }
      .mono { font-family: Consolas, D2Coding, "Courier New", monospace; fill: #1f2937; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #4b5563; }
      .box-title { font-size: 18px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12.5px; }
      .card { stroke: #64748b; stroke-width: 1.6; rx: 14; ry: 14; }
      .entity { fill: #eaf3ff; }
      .attribute { fill: #ecf9ef; }
      .relation { fill: #f2ecff; }
      .decision { fill: #fff6d8; }
      .danger { fill: #ffeaea; }
      .ok { fill: #eaf8ee; }
      .pk { fill: #1d4ed8; font-weight: 700; }
      .fk { fill: #c2410c; font-weight: 700; }
      .line { stroke: #475569; stroke-width: 2; fill: none; }
      .dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
    </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="680" fill="#ffffff"/>
  <text x="600.0" y="42" text-anchor="middle" class="ko title">
    <tspan x="600.0" dy="0">도서 대여 시스템 핵심 ERD</tspan>
  </text>
  <text x="600.0" y="70" text-anchor="middle" class="ko subtitle">
    <tspan x="600.0" dy="0">ERD와 실행 SQL은 같은 테이블·컬럼·관계를 사용합니다.</tspan>
  </text>
  <rect x="60" y="130" width="260" height="320" rx="14" ry="14" class="card entity"/>
  <text x="190" y="175" text-anchor="middle" class="ko box-title">
    <tspan x="190" dy="0">members</tspan>
  </text>
  <rect x="470" y="130" width="260" height="420" rx="14" ry="14" class="card relation"/>
  <text x="600" y="175" text-anchor="middle" class="ko box-title">
    <tspan x="600" dy="0">loans</tspan>
  </text>
  <rect x="880" y="130" width="260" height="350" rx="14" ry="14" class="card entity"/>
  <text x="1010" y="175" text-anchor="middle" class="ko box-title">
    <tspan x="1010" dy="0">books</tspan>
  </text>
  <text x="100" y="225" text-anchor="start" class="mono body">
    <tspan x="100" dy="0" class="pk">PK  id</tspan>
    <tspan x="100" dy="40">name</tspan>
    <tspan x="100" dy="40">email  UNIQUE</tspan>
    <tspan x="100" dy="40">joined_at</tspan>
  </text>
  <text x="510" y="225" text-anchor="start" class="mono body">
    <tspan x="510" dy="0" class="pk">PK  id</tspan>
    <tspan x="510" dy="40" class="fk">FK  member_id</tspan>
    <tspan x="510" dy="40" class="fk">FK  book_id</tspan>
    <tspan x="510" dy="40">borrowed_at</tspan>
    <tspan x="510" dy="40">due_at</tspan>
    <tspan x="510" dy="40">returned_at  NULL 가능</tspan>
  </text>
  <text x="920" y="225" text-anchor="start" class="mono body">
    <tspan x="920" dy="0" class="pk">PK  id</tspan>
    <tspan x="920" dy="40">title</tspan>
    <tspan x="920" dy="40">author</tspan>
    <tspan x="920" dy="40">published_year</tspan>
    <tspan x="920" dy="40">isbn  UNIQUE</tspan>
  </text>
  <line x1="320" y1="335" x2="470" y2="335" class="line" marker-end="url(#arrow)"/>
  <text x="350" y="310" text-anchor="middle" class="ko box-title">
    <tspan x="350" dy="0">1</tspan>
  </text>
  <text x="430" y="310" text-anchor="middle" class="ko box-title">
    <tspan x="430" dy="0">0..N</tspan>
  </text>
  <line x1="730" y1="365" x2="880" y2="365" class="line" marker-end="url(#arrow)"/>
  <text x="760" y="340" text-anchor="middle" class="ko box-title">
    <tspan x="760" dy="0">0..N</tspan>
  </text>
  <text x="840" y="340" text-anchor="middle" class="ko box-title">
    <tspan x="840" dy="0">1</tspan>
  </text>
  <path d="M 510 285 C 430 285, 400 250, 320 250" class="dash" marker-end="url(#arrow)"/>
  <text x="415" y="267" text-anchor="middle" class="ko small">
    <tspan x="415" dy="0">member_id → id</tspan>
  </text>
  <path d="M 730 325 C 800 325, 810 270, 880 270" class="dash" marker-end="url(#arrow)"/>
  <text x="806" y="294" text-anchor="middle" class="ko small">
    <tspan x="806" dy="0">book_id → id</tspan>
  </text>
  <rect x="200" y="590" width="800" height="55" rx="14" ry="14" class="card decision"/>
  <text x="600" y="624" text-anchor="middle" class="ko body">
    <tspan x="600" dy="0">각 loans 행은 회원 한 명과 도서 한 건을 반드시 참조합니다.</tspan>
  </text>
</svg>
