<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc"><title id="title">ERD에서 SQL로 변환</title><desc id="desc">도서 대여 ERD의 엔터티, 속성, 키, 관계, 선택성을 PostgreSQL 테이블, 컬럼, 데이터 타입, 제약조건으로 변환하고 부모부터 생성한 뒤 샘플 데이터와 JOIN으로 검증하는 흐름</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}.t{font-size:28px;font-weight:700;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.panel{stroke-width:1.5;rx:15}.map{fill:#eef5ff;stroke:#6fa2e8}.design{fill:#f8fafc;stroke:#a8b3c4}.run{fill:#fff8e8;stroke:#d69e2e}.test{fill:#f2fbf5;stroke:#8bc9a0}.pt{font-size:19px;font-weight:700}.box{fill:#fff;stroke-width:1.4;rx:10}.blue{stroke:#3b82c4}.orange{stroke:#d69e2e}.green{stroke:#3c9a5f}.red{stroke:#d9534f}.purple{stroke:#7c5cc4}.gray{stroke:#64748b}.h{font-size:14px;font-weight:700;text-anchor:middle}.m{font-size:11.2px;text-anchor:middle;fill:#475569}.code{font-family:Consolas,D2Coding,monospace;font-size:12.4px;font-weight:700;text-anchor:middle;fill:#334155}.arr{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.back{stroke:#d9534f;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#a)}.decision{fill:#fff8e8;stroke:#b7791f;stroke-width:1.8}.dt{font-size:14px;font-weight:700;text-anchor:middle}.note{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.3;rx:9}.nt{font-size:11.4px;font-weight:700;text-anchor:middle;fill:#92400e}.core{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.5;rx:10}.cv{font-size:14.3px;font-weight:700;text-anchor:middle;fill:#166534}</style></defs><rect width="1200" height="1120" fill="#fff"/><text x="600" y="40" class="t">ERD에서 SQL로 변환</text><text x="600" y="68" class="s">ERD의 각 요소를 PostgreSQL 문법으로 대응하고, 생성 순서와 제약조건까지 실행 결과로 검증한다</text><rect x="35" y="100" width="1130" height="205" class="panel map"/><text x="60" y="132" class="pt">1. ERD 요소를 SQL 요소로 대응</text><rect x="55" y="165" width="200" height="95" class="box blue"/><text x="155" y="190" class="h">엔터티</text><text x="155" y="215" class="m">members · books · loans</text><text x="155" y="240" class="code">CREATE TABLE</text><rect x="275" y="165" width="200" height="95" class="box purple"/><text x="375" y="190" class="h">속성</text><text x="375" y="215" class="m">name · email · due_at</text><text x="375" y="240" class="code">컬럼명 + 데이터 타입</text><rect x="495" y="165" width="200" height="95" class="box blue"/><text x="595" y="190" class="h">행 식별</text><text x="595" y="215" class="m">각 테이블의 id</text><text x="595" y="240" class="code">SERIAL PRIMARY KEY</text><rect x="715" y="165" width="200" height="95" class="box orange"/><text x="815" y="190" class="h">1:N 관계</text><text x="815" y="215" class="m">N쪽 loans에 FK 배치</text><text x="815" y="240" class="code">REFERENCES 부모(id)</text><rect x="935" y="165" width="200" height="95" class="box green"/><text x="1035" y="190" class="h">업무 규칙</text><text x="1035" y="215" class="m">필수·고유·선택값</text><text x="1035" y="240" class="code">NOT NULL · UNIQUE · NULL</text><rect x="35" y="335" width="1130" height="320" class="panel design"/><text x="60" y="367" class="pt">2. PostgreSQL 물리 설계와 CREATE TABLE 작성</text><rect x="55" y="405" width="330" height="190" class="box blue"/><text x="220" y="432" class="h">members · 부모 테이블</text><text x="220" y="460" class="code">id SERIAL PRIMARY KEY</text><text x="220" y="487" class="code">name VARCHAR(50) NOT NULL</text><text x="220" y="514" class="code">email VARCHAR(100)</text><text x="220" y="537" class="code">UNIQUE NOT NULL</text><text x="220" y="566" class="code">joined_at DATE NOT NULL</text><rect x="435" y="405" width="330" height="190" class="box blue"/><text x="600" y="432" class="h">books · 부모 테이블</text><text x="600" y="460" class="code">id SERIAL PRIMARY KEY</text><text x="600" y="487" class="code">title VARCHAR(200) NOT NULL</text><text x="600" y="514" class="code">author VARCHAR(100) NOT NULL</text><text x="600" y="537" class="code">published_year INT</text><text x="600" y="566" class="code">isbn VARCHAR(20) UNIQUE NOT NULL</text><rect x="815" y="390" width="330" height="220" class="box orange"/><text x="980" y="417" class="h">loans · 자식 테이블</text><text x="980" y="445" class="code">id SERIAL PRIMARY KEY</text><text x="980" y="472" class="code">member_id INT NOT NULL</text><text x="980" y="495" class="code">REFERENCES members(id)</text><text x="980" y="522" class="code">book_id INT NOT NULL</text><text x="980" y="545" class="code">REFERENCES books(id)</text><text x="980" y="572" class="code">borrowed_at · due_at NOT NULL</text><text x="980" y="595" class="code">returned_at DATE · NULL 가능</text><path d="M385 500H410V630H980V610" class="arr"/><path d="M765 500H790V630H980" class="arr"/><text x="600" y="635" class="m">생성 순서: 참조되는 부모 members·books 먼저 → 참조하는 자식 loans 나중</text><rect x="35" y="685" width="1130" height="155" class="panel run"/><text x="60" y="717" class="pt">3. 실행 전후 구조 검증</text><rect x="60" y="750" width="245" height="55" class="box gray"/><text x="182" y="772" class="h">문장 검토</text><text x="182" y="793" class="m">타입·쉼표·괄호·참조 이름</text><rect x="335" y="750" width="245" height="55" class="box blue"/><text x="457" y="772" class="h">순서대로 실행</text><text x="457" y="793" class="m">members → books → loans</text><rect x="610" y="750" width="245" height="55" class="box orange"/><text x="732" y="772" class="h">실패 원인 확인</text><text x="732" y="793" class="m">오류 전체·기존 객체·생성 순서</text><rect x="885" y="750" width="245" height="55" class="box green"/><text x="1007" y="772" class="h">메타데이터 확인</text><text x="1007" y="793" class="m">PK·UK·FK·NULL 허용 비교</text><path d="M305 777H335" class="arr"/><path d="M580 777H610" class="arr"/><path d="M855 777H885" class="arr"/><text x="600" y="825" class="m">반복 실행을 위해 DROP할 때는 자식 loans부터 부모 books·members 방향으로 삭제</text><rect x="35" y="870" width="1130" height="145" class="panel test"/><text x="60" y="902" class="pt">4. 샘플 데이터와 JOIN으로 요구사항 검증</text><rect x="55" y="935" width="250" height="50" class="box green"/><text x="180" y="956" class="h">정상 입력</text><text x="180" y="976" class="m">회원·책 먼저, 대여 기록 나중</text><rect x="330" y="935" width="250" height="50" class="box orange"/><text x="455" y="956" class="h">선택값 입력</text><text x="455" y="976" class="m">returned_at = NULL 허용</text><rect x="605" y="935" width="250" height="50" class="box red"/><text x="730" y="956" class="h">오류 입력</text><text x="730" y="976" class="m">중복 email·isbn, 없는 FK 차단</text><rect x="880" y="935" width="250" height="50" class="box blue"/><text x="1005" y="956" class="h">JOIN 검증</text><text x="1005" y="976" class="m">회원·책·대여일을 한 결과로 조회</text><polygon points="600,1025 710,1055 600,1085 490,1055" class="decision"/><text x="600" y="1051" class="dt">요구사항·ERD·SQL·결과가 일치하는가?</text><text x="600" y="1071" class="m">불일치하면 원인 단계를 구분해 함께 수정</text><path d="M180 985V1005H600V1025" class="arr"/><path d="M455 985V1025" class="arr"/><path d="M730 985V1005H600" class="arr"/><path d="M1005 985V1005H600" class="arr"/><path d="M490 1055H20V212H55" class="back"/><rect x="55" y="1092" width="350" height="24" class="note"/><text x="230" y="1109" class="nt">테이블 생성 성공만으로 제약조건의 정확성을 보장하지 않음</text><rect x="425" y="1092" width="350" height="24" class="note"/><text x="600" y="1109" class="nt">SQL 수정 사항은 ERD와 요구사항에도 함께 반영</text><rect x="795" y="1092" width="350" height="24" class="core"/><text x="970" y="1109" class="cv">대응 → 구현 → 순서 실행 → 데이터 검증</text></svg>