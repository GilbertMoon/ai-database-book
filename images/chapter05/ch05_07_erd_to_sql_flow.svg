<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">ERD를 PostgreSQL 테이블로 변환하기</title>
  <desc id="desc">ERD의 엔터티, 속성, 기본키, 외래키를 PostgreSQL 테이블 생성 요소로 바꾸고 부모 테이블부터 생성한 뒤 샘플 데이터와 JOIN으로 검증한다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#54606f" />
    </marker>
  </defs>
  <style>
    .bg { fill: #ffffff; }
    .title { font: 700 28px "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #172033; }
    .box { fill: #eef6ff; stroke: #6b9bd2; stroke-width: 2; rx: 8; }
    .sql { fill: #f4efff; stroke: #8e78c9; stroke-width: 2; rx: 8; }
    .check { fill: #fff7d9; stroke: #d8aa34; stroke-width: 2; rx: 8; }
    .text { font: 700 17px "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #1f2a3d; text-anchor: middle; }
    .small { font: 14px "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #4d596b; text-anchor: middle; }
    .code { font: 15px Consolas, D2Coding, "Courier New", monospace; fill: #263246; text-anchor: middle; }
    .line { fill: none; stroke: #54606f; stroke-width: 2.4; marker-end: url(#arrow); }
    .return { fill: none; stroke: #8c6cc4; stroke-width: 2.2; stroke-dasharray: 8 6; marker-end: url(#arrow); }
  </style>
  <rect class="bg" width="1200" height="640" />
  <text class="title" x="600" y="48">ERD를 PostgreSQL 테이블로 변환하기</text>

  <rect class="box" x="95" y="105" width="260" height="120" />
  <text class="text" x="225" y="145">ERD</text>
  <text class="code" x="225" y="180">members 1 - N loans</text>
  <text class="code" x="225" y="205">loans N - 1 books</text>

  <rect class="box" x="470" y="85" width="260" height="165" />
  <text class="text" x="600" y="125">요소 변환</text>
  <text class="small" x="600" y="158">엔터티 → CREATE TABLE</text>
  <text class="small" x="600" y="184">속성 → 컬럼 + 타입</text>
  <text class="small" x="600" y="210">PK/FK → 제약조건</text>
  <text class="small" x="600" y="236">필수값·고유값 반영</text>

  <rect class="sql" x="845" y="105" width="260" height="120" />
  <text class="text" x="975" y="145">생성 순서</text>
  <text class="code" x="975" y="180">members → books</text>
  <text class="code" x="975" y="205">→ loans</text>

  <rect class="sql" x="300" y="340" width="260" height="95" />
  <text class="text" x="430" y="378">PostgreSQL</text>
  <text class="small" x="430" y="405">테이블 생성</text>

  <rect class="check" x="640" y="340" width="260" height="95" />
  <text class="text" x="770" y="378">샘플 데이터·JOIN</text>
  <text class="small" x="770" y="405">요구사항 표현 확인</text>

  <line class="line" x1="355" y1="165" x2="465" y2="165" />
  <line class="line" x1="730" y1="165" x2="840" y2="165" />
  <path class="line" d="M 975 225 L 975 290 L 430 290 L 430 335" />
  <line class="line" x1="560" y1="388" x2="635" y2="388" />
  <path class="return" d="M 770 435 L 770 520 L 225 520 L 225 230" />
  <text class="small" x="520" y="542">표현이 맞지 않으면 ERD 또는 SQL을 다시 조정한다</text>
</svg>
