<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">ERD를 PostgreSQL 테이블로 변환하기</title>
  <desc id="desc">ERD 요소를 PostgreSQL DDL 요소로 바꾸고 부모 테이블부터 생성한 뒤 샘플 데이터와 JOIN으로 검증하는 흐름</desc>
  <style>
      .ko { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #1f2937; }
      .mono { font-family: Consolas, D2Coding, "Courier New", monospace; fill: #1f2937; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #4b5563; }
      .box-title { font-size: 18px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12.5px; }
      .card { stroke: #64748b; stroke-width: 1.6; rx: 14; ry: 14; }
      .entity { fill: #eaf3ff; }
      .attribute { fill: #ecf9ef; }
      .relation { fill: #f2ecff; }
      .decision { fill: #fff6d8; }
      .danger { fill: #ffeaea; }
      .ok { fill: #eaf8ee; }
      .pk { fill: #1d4ed8; font-weight: 700; }
      .fk { fill: #c2410c; font-weight: 700; }
      .line { stroke: #475569; stroke-width: 2; fill: none; }
      .dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
    </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="600" fill="#ffffff"/>
  <text x="600.0" y="42" text-anchor="middle" class="ko title">
    <tspan x="600.0" dy="0">ERD를 PostgreSQL 테이블로 변환하기</tspan>
  </text>
  <text x="600.0" y="70" text-anchor="middle" class="ko subtitle">
    <tspan x="600.0" dy="0">관계는 FOREIGN KEY가 되고, 부모 테이블을 먼저 생성합니다.</tspan>
  </text>
  <rect x="40" y="145" width="245" height="310" rx="14" ry="14" class="card entity"/>
  <text x="162.5" y="190" text-anchor="middle" class="ko box-title">
    <tspan x="162.5" dy="0">ERD</tspan>
  </text>
  <text x="162.5" y="240" text-anchor="middle" class="ko body">
    <tspan x="162.5" dy="0">members 1 ─ N loans</tspan>
    <tspan x="162.5" dy="32">loans N ─ 1 books</tspan>
  </text>
  <rect x="330" y="125" width="300" height="350" rx="14" ry="14" class="card relation"/>
  <text x="480.0" y="170" text-anchor="middle" class="ko box-title">
    <tspan x="480.0" dy="0">요소 변환</tspan>
  </text>
  <text x="480.0" y="220" text-anchor="middle" class="ko body">
    <tspan x="480.0" dy="0">엔터티 → CREATE TABLE</tspan>
    <tspan x="480.0" dy="32">속성 → 컬럼 + 타입</tspan>
    <tspan x="480.0" dy="32">PK → PRIMARY KEY</tspan>
    <tspan x="480.0" dy="32">관계 → FOREIGN KEY</tspan>
    <tspan x="480.0" dy="32">필수값 → NOT NULL</tspan>
    <tspan x="480.0" dy="32">고유값 → UNIQUE</tspan>
  </text>
  <rect x="715" y="145" width="200" height="310" rx="14" ry="14" class="card attribute"/>
  <text x="815.0" y="190" text-anchor="middle" class="ko box-title">
    <tspan x="815.0" dy="0">생성 순서</tspan>
  </text>
  <text x="815.0" y="240" text-anchor="middle" class="ko body">
    <tspan x="815.0" dy="0">1. members</tspan>
    <tspan x="815.0" dy="32">2. books</tspan>
    <tspan x="815.0" dy="32">3. loans</tspan>
  </text>
  <rect x="990" y="175" width="170" height="250" rx="14" ry="14" class="card decision"/>
  <text x="1075.0" y="220" text-anchor="middle" class="ko box-title">
    <tspan x="1075.0" dy="0">검증</tspan>
  </text>
  <text x="1075.0" y="270" text-anchor="middle" class="ko body">
    <tspan x="1075.0" dy="0">샘플 데이터</tspan>
    <tspan x="1075.0" dy="32">JOIN 결과</tspan>
    <tspan x="1075.0" dy="32">요구사항 확인</tspan>
  </text>
  <line x1="285" y1="300" x2="330" y2="300" class="line" marker-end="url(#arrow)"/>
  <line x1="630" y1="300" x2="715" y2="300" class="line" marker-end="url(#arrow)"/>
  <line x1="915" y1="300" x2="990" y2="300" class="line" marker-end="url(#arrow)"/>
  <rect x="300" y="520" width="600" height="50" rx="14" ry="14" class="card ok"/>
  <text x="600" y="552" text-anchor="middle" class="ko body">
    <tspan x="600" dy="0">SQL 실행 성공 후에도 실제 관계 표현 여부를 다시 검증합니다.</tspan>
  </text>
</svg>
