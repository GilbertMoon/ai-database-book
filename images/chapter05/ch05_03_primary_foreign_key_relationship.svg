<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">기본키와 외래키로 테이블 연결하기</title>
  <desc id="desc">loans의 기본키와 두 외래키가 members와 books의 기본키를 참조하는 방향을 보여 주는 도식</desc>
  <style>
      .ko { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #1f2937; }
      .mono { font-family: Consolas, D2Coding, "Courier New", monospace; fill: #1f2937; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #4b5563; }
      .box-title { font-size: 18px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12.5px; }
      .card { stroke: #64748b; stroke-width: 1.6; rx: 14; ry: 14; }
      .entity { fill: #eaf3ff; }
      .attribute { fill: #ecf9ef; }
      .relation { fill: #f2ecff; }
      .decision { fill: #fff6d8; }
      .danger { fill: #ffeaea; }
      .ok { fill: #eaf8ee; }
      .pk { fill: #1d4ed8; font-weight: 700; }
      .fk { fill: #c2410c; font-weight: 700; }
      .line { stroke: #475569; stroke-width: 2; fill: none; }
      .dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
    </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="620" fill="#ffffff"/>
  <text x="600.0" y="42" text-anchor="middle" class="ko title">
    <tspan x="600.0" dy="0">기본키와 외래키로 테이블 연결하기</tspan>
  </text>
  <text x="600.0" y="70" text-anchor="middle" class="ko subtitle">
    <tspan x="600.0" dy="0">PK는 자기 행을 식별하고, FK는 다른 테이블의 기존 행을 참조합니다.</tspan>
  </text>
  <rect x="80" y="150" width="270" height="210" rx="14" ry="14" class="card entity"/>
  <text x="215" y="190" text-anchor="middle" class="ko box-title">
    <tspan x="215" dy="0">members</tspan>
  </text>
  <text x="118" y="240" text-anchor="start" class="mono body">
    <tspan x="118" dy="0" class="pk">PK  id</tspan>
    <tspan x="118" dy="34">name</tspan>
  </text>
  <rect x="455" y="150" width="270" height="270" rx="14" ry="14" class="card relation"/>
  <text x="590" y="190" text-anchor="middle" class="ko box-title">
    <tspan x="590" dy="0">loans</tspan>
  </text>
  <text x="493" y="240" text-anchor="start" class="mono body">
    <tspan x="493" dy="0" class="pk">PK  id</tspan>
    <tspan x="493" dy="34" class="fk">FK  member_id</tspan>
    <tspan x="493" dy="34" class="fk">FK  book_id</tspan>
    <tspan x="493" dy="34">borrowed_at</tspan>
  </text>
  <rect x="850" y="150" width="270" height="210" rx="14" ry="14" class="card entity"/>
  <text x="985" y="190" text-anchor="middle" class="ko box-title">
    <tspan x="985" dy="0">books</tspan>
  </text>
  <text x="888" y="240" text-anchor="start" class="mono body">
    <tspan x="888" dy="0" class="pk">PK  id</tspan>
    <tspan x="888" dy="34">title</tspan>
  </text>
  <path d="M 455 275 C 400 275, 400 255, 350 255" class="dash" marker-end="url(#arrow)"/>
  <text x="400" y="240" text-anchor="middle" class="ko small">
    <tspan x="400" dy="0">FK 참조</tspan>
  </text>
  <path d="M 725 330 C 790 330, 790 255, 850 255" class="dash" marker-end="url(#arrow)"/>
  <text x="790" y="305" text-anchor="middle" class="ko small">
    <tspan x="790" dy="0">FK 참조</tspan>
  </text>
  <line x1="350" y1="380" x2="455" y2="380" class="line"/>
  <line x1="725" y1="380" x2="850" y2="380" class="line"/>
  <text x="402" y="404" text-anchor="middle" class="ko small">
    <tspan x="402" dy="0">관계</tspan>
  </text>
  <text x="788" y="404" text-anchor="middle" class="ko small">
    <tspan x="788" dy="0">관계</tspan>
  </text>
  <rect x="105" y="480" width="990" height="90" rx="14" ry="14" class="card decision"/>
  <text x="600" y="515" text-anchor="middle" class="ko body">
    <tspan x="600" dy="0">loans.id: 대여 기록 자체 식별  ·  loans.member_id: 회원 참조</tspan>
    <tspan x="600" dy="26">loans.book_id: 도서 참조  ·  존재하지 않는 ID는 FK 오류 가능</tspan>
  </text>
</svg>
