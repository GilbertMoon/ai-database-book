<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">기본키와 외래키로 테이블 연결하기</title>
  <desc id="desc">loans의 member_id와 book_id 외래키가 각각 members.id와 books.id 기본키를 참조한다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#54606f" />
    </marker>
  </defs>
  <style>
    .bg { fill: #ffffff; }
    .title { font: 700 28px "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #172033; }
    .table { fill: #eef6ff; stroke: #6b9bd2; stroke-width: 2; rx: 8; }
    .bridge { fill: #f4efff; stroke: #8e78c9; stroke-width: 2; rx: 8; }
    .head { font: 700 20px Consolas, D2Coding, "Courier New", monospace; fill: #1f2a3d; text-anchor: middle; }
    .code { font: 15px Consolas, D2Coding, "Courier New", monospace; fill: #263246; text-anchor: middle; }
    .label { font: 700 14px "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #1f2a3d; text-anchor: middle; }
    .pk { fill: #dbeafe; stroke: #377ac3; }
    .fk { fill: #fff0d7; stroke: #d08a2b; }
    .line { fill: none; stroke: #54606f; stroke-width: 2.4; marker-end: url(#arrow); }
  </style>
  <rect class="bg" width="1200" height="520" />
  <text class="title" x="600" y="48">기본키와 외래키로 테이블 연결하기</text>

  <rect class="table" x="90" y="130" width="250" height="210" />
  <text class="head" x="215" y="175">members</text>
  <rect class="pk" x="145" y="210" width="140" height="38" rx="6" />
  <text class="code" x="215" y="235">PK id</text>

  <rect class="bridge" x="475" y="105" width="250" height="260" />
  <text class="head" x="600" y="150">loans</text>
  <rect class="pk" x="530" y="185" width="140" height="38" rx="6" />
  <text class="code" x="600" y="210">PK id</text>
  <rect class="fk" x="515" y="240" width="170" height="38" rx="6" />
  <text class="code" x="600" y="265">FK member_id</text>
  <rect class="fk" x="515" y="295" width="170" height="38" rx="6" />
  <text class="code" x="600" y="320">FK book_id</text>

  <rect class="table" x="860" y="130" width="250" height="210" />
  <text class="head" x="985" y="175">books</text>
  <rect class="pk" x="915" y="210" width="140" height="38" rx="6" />
  <text class="code" x="985" y="235">PK id</text>

  <path class="line" d="M 515 259 L 340 229" />
  <text class="label" x="405" y="220">member_id 참조</text>
  <path class="line" d="M 685 314 L 860 229" />
  <text class="label" x="790" y="285">book_id 참조</text>
</svg>
