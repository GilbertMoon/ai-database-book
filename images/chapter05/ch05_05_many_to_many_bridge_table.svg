<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc"><title id="title">N:M 관계와 중간 테이블</title><desc id="desc">회원과 책의 다대다 관계를 loans 중간 테이블로 풀어 두 개의 일대다 관계로 구현하고, 각 대여 행이 회원과 책의 외래키 및 대여일과 반납일을 저장하는 구조를 설명하는 도식</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}.t{font-size:28px;font-weight:700;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.panel{stroke-width:1.5;rx:15}.problem{fill:#fff5f5;stroke:#d9534f}.model{fill:#f8fafc;stroke:#a8b3c4}.rows{fill:#eef5ff;stroke:#6fa2e8}.verify{fill:#f2fbf5;stroke:#8bc9a0}.pt{font-size:19px;font-weight:700}.box{fill:#fff;stroke-width:1.4;rx:10}.blue{stroke:#3b82c4}.orange{stroke:#d69e2e}.green{stroke:#3c9a5f}.red{stroke:#d9534f}.purple{stroke:#7c5cc4}.h{font-size:14px;font-weight:700;text-anchor:middle}.m{font-size:11.4px;text-anchor:middle;fill:#475569}.code{font-family:Consolas,D2Coding,monospace;font-size:12.6px;font-weight:700;text-anchor:middle;fill:#334155}.arr{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.refL{stroke:#3b82c4;stroke-width:2.2;fill:none;marker-end:url(#a)}.refR{stroke:#d69e2e;stroke-width:2.2;fill:none;marker-end:url(#a)}.table{fill:#fff;stroke:#64748b;stroke-width:1.5;rx:10}.headB{fill:#dcecff}.headO{fill:#fff1cf}.th{font-size:16px;font-weight:700;text-anchor:middle}.subh{font-size:11px;text-anchor:middle;fill:#475569}.row{stroke:#cbd5e1;stroke-width:1}.cell{font-size:11.1px;fill:#334155}.key{font-size:11.1px;font-weight:700;fill:#1d4ed8}.fk{font-size:11.1px;font-weight:700;fill:#92400e}.note{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.3;rx:9}.nt{font-size:11.4px;font-weight:700;text-anchor:middle;fill:#92400e}.core{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.5;rx:10}.cv{font-size:14.2px;font-weight:700;text-anchor:middle;fill:#166534}</style></defs><rect width="1200" height="1080" fill="#fff"/><text x="600" y="40" class="t">N:M 관계와 중간 테이블</text><text x="600" y="68" class="s">관계 한 건을 별도 행으로 기록하면 직접 N:M 관계를 두 개의 1:N 관계로 구현할 수 있다</text><rect x="35" y="100" width="1130" height="170" class="panel problem"/><text x="60" y="132" class="pt">1. members와 books를 직접 연결할 때의 문제</text><rect x="65" y="160" width="330" height="72" class="box red"/><text x="230" y="185" class="h">members에 book_id 목록 저장</text><text x="230" y="208" class="m">한 컬럼에 여러 책 ID가 필요하고 건수가 계속 변함</text><rect x="435" y="160" width="330" height="72" class="box red"/><text x="600" y="185" class="h">books에 member_id 목록 저장</text><text x="600" y="208" class="m">대여·반납 때마다 회원 목록을 직접 수정해야 함</text><rect x="805" y="160" width="330" height="72" class="box red"/><text x="970" y="185" class="h">관계 속성을 저장하기 어려움</text><text x="970" y="208" class="m">대여일·반납예정일·실제반납일의 소유자가 불명확</text><text x="600" y="253" class="code">회원 N ↔ M 책을 직접 저장하지 않고 대여 사건 한 건을 별도 행으로 만든다</text><rect x="35" y="300" width="1130" height="365" class="panel model"/><text x="60" y="332" class="pt">2. loans를 중간 테이블이자 사건 엔터티로 배치</text><rect x="55" y="370" width="300" height="235" class="table"/><rect x="55" y="370" width="300" height="54" class="headB"/><text x="205" y="393" class="th">members · 1쪽</text><text x="205" y="413" class="subh">회원은 대여가 없어도 존재 가능</text><line x1="55" y1="424" x2="355" y2="424" class="row"/><line x1="55" y1="479" x2="355" y2="479" class="row"/><line x1="55" y1="534" x2="355" y2="534" class="row"/><text x="75" y="452" class="key">id = 1</text><text x="205" y="452" class="cell">김민지</text><text x="75" y="507" class="key">id = 2</text><text x="205" y="507" class="cell">이준호</text><text x="205" y="568" class="m">한 회원 → 0건 이상의 loans</text><rect x="430" y="345" width="340" height="285" class="table"/><rect x="430" y="345" width="340" height="54" class="headO"/><text x="600" y="368" class="th">loans · 양쪽 관계의 N쪽</text><text x="600" y="388" class="subh">대여 사건 한 건마다 한 행</text><line x1="430" y1="399" x2="770" y2="399" class="row"/><line x1="430" y1="444" x2="770" y2="444" class="row"/><line x1="430" y1="489" x2="770" y2="489" class="row"/><line x1="430" y1="534" x2="770" y2="534" class="row"/><line x1="430" y1="579" x2="770" y2="579" class="row"/><text x="450" y="427" class="key">id · PK</text><text x="620" y="427" class="cell">대여 한 건 식별</text><text x="450" y="472" class="fk">member_id · FK</text><text x="620" y="472" class="cell">members.id</text><text x="450" y="517" class="fk">book_id · FK</text><text x="620" y="517" class="cell">books.id</text><text x="450" y="562" class="cell">borrowed_at · due_at</text><text x="450" y="607" class="cell">returned_at · 관계 자체의 상태</text><rect x="845" y="370" width="300" height="235" class="table"/><rect x="845" y="370" width="300" height="54" class="headB"/><text x="995" y="393" class="th">books · 1쪽</text><text x="995" y="413" class="subh">책은 대여가 없어도 존재 가능</text><line x1="845" y1="424" x2="1145" y2="424" class="row"/><line x1="845" y1="479" x2="1145" y2="479" class="row"/><line x1="845" y1="534" x2="1145" y2="534" class="row"/><text x="865" y="452" class="key">id = 10</text><text x="995" y="452" class="cell">데이터베이스 입문</text><text x="865" y="507" class="key">id = 20</text><text x="995" y="507" class="cell">SQL 기초</text><text x="995" y="568" class="m">한 책 → 0건 이상의 loans</text><path d="M430 472H390V452H355" class="refL"/><path d="M770 517H810V452H845" class="refR"/><rect x="215" y="620" width="770" height="28" class="box green"/><text x="600" y="639" class="code">members 1 : 0..N loans · books 1 : 0..N loans</text><rect x="35" y="695" width="1130" height="190" class="panel rows"/><text x="60" y="727" class="pt">3. 중간 테이블의 행이 N:M 관계를 표현</text><rect x="65" y="755" width="330" height="88" class="box blue"/><text x="230" y="780" class="code">loan 1001</text><text x="230" y="803" class="m">member_id 1 · book_id 10</text><text x="230" y="825" class="m">김민지 → 데이터베이스 입문</text><rect x="435" y="755" width="330" height="88" class="box purple"/><text x="600" y="780" class="code">loan 1002</text><text x="600" y="803" class="m">member_id 1 · book_id 20</text><text x="600" y="825" class="m">김민지 → SQL 기초</text><rect x="805" y="755" width="330" height="88" class="box orange"/><text x="970" y="780" class="code">loan 1003</text><text x="970" y="803" class="m">member_id 2 · book_id 10</text><text x="970" y="825" class="m">이준호 → 데이터베이스 입문</text><text x="600" y="866" class="m">회원 1은 여러 책과 연결되고, 책 10도 여러 회원과 연결되지만 각 연결은 loans의 독립된 행이다</text><rect x="35" y="915" width="1130" height="90" class="panel verify"/><text x="60" y="947" class="pt">4. 저장과 조회 검증</text><rect x="65" y="965" width="330" height="26" class="box red"/><text x="230" y="983" class="m">없는 member_id·book_id → FK 오류</text><rect x="435" y="965" width="330" height="26" class="box green"/><text x="600" y="983" class="m">유효한 두 FK → 대여 관계 한 건 저장</text><rect x="805" y="965" width="330" height="26" class="box blue"/><text x="970" y="983" class="m">JOIN으로 회원·책·대여일 결합</text><rect x="55" y="1025" width="350" height="34" class="note"/><text x="230" y="1047" class="nt">loans.id는 관계 발생 한 건의 PK</text><rect x="425" y="1025" width="350" height="34" class="note"/><text x="600" y="1047" class="nt">재대여를 고려해 두 FK만 무조건 UNIQUE 처리하지 않음</text><rect x="795" y="1025" width="350" height="34" class="core"/><text x="970" y="1047" class="cv">N:M → 중간 테이블 → 두 개의 1:N</text><rect x="130" y="1068" width="940" height="8" class="core"/></svg>