<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">N:M 관계를 연결 테이블로 풀기</title>
  <desc id="desc">회원과 책의 개념상 다대다 관계를 loans 연결 테이블로 두 개의 일대다 관계로 구현하는 구조</desc>
  <style>
      .ko { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #1f2937; }
      .mono { font-family: Consolas, D2Coding, "Courier New", monospace; fill: #1f2937; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #4b5563; }
      .box-title { font-size: 18px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12.5px; }
      .card { stroke: #64748b; stroke-width: 1.6; rx: 14; ry: 14; }
      .entity { fill: #eaf3ff; }
      .attribute { fill: #ecf9ef; }
      .relation { fill: #f2ecff; }
      .decision { fill: #fff6d8; }
      .danger { fill: #ffeaea; }
      .ok { fill: #eaf8ee; }
      .pk { fill: #1d4ed8; font-weight: 700; }
      .fk { fill: #c2410c; font-weight: 700; }
      .line { stroke: #475569; stroke-width: 2; fill: none; }
      .dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
    </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="650" fill="#ffffff"/>
  <text x="600.0" y="42" text-anchor="middle" class="ko title">
    <tspan x="600.0" dy="0">N:M 관계를 연결 테이블로 풀기</tspan>
  </text>
  <text x="600.0" y="70" text-anchor="middle" class="ko subtitle">
    <tspan x="600.0" dy="0">관계 한 건마다 loans에 한 행을 생성합니다.</tspan>
  </text>
  <rect x="250" y="105" width="700" height="100" rx="14" ry="14" class="card decision"/>
  <text x="600" y="145" text-anchor="middle" class="ko box-title">
    <tspan x="600" dy="0">개념 관계</tspan>
    <tspan x="600" dy="30">members  N ───────── M  books</tspan>
  </text>
  <line x1="600" y1="205" x2="600" y2="265" class="line" marker-end="url(#arrow)"/>
  <rect x="80" y="300" width="260" height="170" rx="14" ry="14" class="card entity"/>
  <text x="210" y="345" text-anchor="middle" class="ko box-title">
    <tspan x="210" dy="0">members</tspan>
  </text>
  <text x="130" y="395" text-anchor="start" class="mono body">
    <tspan x="130" dy="0" class="pk">PK  id</tspan>
    <tspan x="130" dy="32">name</tspan>
  </text>
  <rect x="470" y="260" width="260" height="250" rx="14" ry="14" class="card relation"/>
  <text x="600" y="305" text-anchor="middle" class="ko box-title">
    <tspan x="600" dy="0">loans</tspan>
  </text>
  <text x="520" y="350" text-anchor="start" class="mono body">
    <tspan x="520" dy="0" class="pk">PK  id</tspan>
    <tspan x="520" dy="28" class="fk">FK  member_id</tspan>
    <tspan x="520" dy="28" class="fk">FK  book_id</tspan>
    <tspan x="520" dy="28">borrowed_at</tspan>
    <tspan x="520" dy="28">due_at</tspan>
    <tspan x="520" dy="28">returned_at</tspan>
  </text>
  <rect x="860" y="300" width="260" height="170" rx="14" ry="14" class="card entity"/>
  <text x="990" y="345" text-anchor="middle" class="ko box-title">
    <tspan x="990" dy="0">books</tspan>
  </text>
  <text x="910" y="395" text-anchor="start" class="mono body">
    <tspan x="910" dy="0" class="pk">PK  id</tspan>
    <tspan x="910" dy="32">title</tspan>
  </text>
  <line x1="340" y1="385" x2="470" y2="385" class="line" marker-end="url(#arrow)"/>
  <text x="375" y="362" text-anchor="middle" class="ko box-title">
    <tspan x="375" dy="0">1</tspan>
  </text>
  <text x="435" y="362" text-anchor="middle" class="ko box-title">
    <tspan x="435" dy="0">N</tspan>
  </text>
  <line x1="730" y1="385" x2="860" y2="385" class="line" marker-end="url(#arrow)"/>
  <text x="765" y="362" text-anchor="middle" class="ko box-title">
    <tspan x="765" dy="0">N</tspan>
  </text>
  <text x="825" y="362" text-anchor="middle" class="ko box-title">
    <tspan x="825" dy="0">1</tspan>
  </text>
  <rect x="170" y="550" width="860" height="60" rx="14" ry="14" class="card attribute"/>
  <text x="600" y="586" text-anchor="middle" class="ko body">
    <tspan x="600" dy="0">ID 목록을 부모 컬럼에 저장하지 않고, 두 FK와 날짜 속성을 가진 사건 행으로 기록합니다.</tspan>
  </text>
</svg>
