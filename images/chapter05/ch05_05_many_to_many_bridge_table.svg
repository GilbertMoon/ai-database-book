<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">N:M 관계를 연결 테이블로 풀기</title>
  <desc id="desc">members와 books의 N:M 관계를 loans 연결 테이블로 풀어 두 개의 1:N 관계로 표현한다.</desc>
  <style>
    .bg { fill: #ffffff; }
    .title { font: 700 28px "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #172033; }
    .entity { fill: #eef6ff; stroke: #6b9bd2; stroke-width: 2; rx: 8; }
    .bridge { fill: #f4efff; stroke: #8e78c9; stroke-width: 2; rx: 8; }
    .bad { fill: #fff0f0; stroke: #d57979; stroke-width: 2; rx: 8; }
    .head { font: 700 21px Consolas, D2Coding, "Courier New", monospace; fill: #1f2a3d; text-anchor: middle; }
    .code { font: 15px Consolas, D2Coding, "Courier New", monospace; fill: #263246; text-anchor: middle; }
    .text { font: 15px "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #334155; text-anchor: middle; }
    .rel { font: 700 18px "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #1f2a3d; text-anchor: middle; }
    .line { stroke: #54606f; stroke-width: 2.6; fill: none; }
    .badline { stroke: #b85f5f; stroke-width: 2; stroke-dasharray: 8 6; fill: none; }
  </style>
  <rect class="bg" width="1200" height="560" />
  <text class="title" x="600" y="48">N:M 관계를 연결 테이블로 풀기</text>

  <rect class="entity" x="90" y="220" width="230" height="150" />
  <text class="head" x="205" y="270">members</text>
  <text class="text" x="205" y="315">회원</text>

  <rect class="bridge" x="485" y="180" width="230" height="230" />
  <text class="head" x="600" y="230">loans</text>
  <text class="code" x="600" y="270">FK member_id</text>
  <text class="code" x="600" y="305">FK book_id</text>
  <text class="code" x="600" y="340">borrowed_at</text>
  <text class="text" x="600" y="375">대여 사건 저장</text>

  <rect class="entity" x="880" y="220" width="230" height="150" />
  <text class="head" x="995" y="270">books</text>
  <text class="text" x="995" y="315">도서</text>

  <line class="line" x1="320" y1="295" x2="485" y2="295" />
  <text class="rel" x="370" y="280">1</text>
  <text class="rel" x="440" y="280">0..N</text>
  <line class="line" x1="715" y1="295" x2="880" y2="295" />
  <text class="rel" x="760" y="280">0..N</text>
  <text class="rel" x="835" y="280">1</text>

  <rect class="bad" x="385" y="80" width="430" height="64" />
  <text class="text" x="600" y="108">직접 N:M 또는 ID 목록 저장은 피한다</text>
  <text class="code" x="600" y="132">members.book_ids = '1,2,3'</text>
  <path class="badline" d="M 205 220 C 360 105, 840 105, 995 220" />
</svg>
