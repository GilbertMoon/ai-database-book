<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc"><title id="title">WHERE 조건으로 행 필터링</title><desc id="desc">students 테이블의 각 행에 WHERE major equals 컴퓨터공학 조건을 적용하여 참인 행만 SELECT 결과로 전달하고 비교 연산자, AND와 OR, 결과 검증 및 UPDATE·DELETE 전 대상 확인 원칙을 설명하는 도식</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}.t{font-size:28px;font-weight:700;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.panel{stroke-width:1.5;rx:15}.source{fill:#f8fafc;stroke:#a8b3c4}.filter{fill:#eef5ff;stroke:#6fa2e8}.logic{fill:#fff8e8;stroke:#d69e2e}.result{fill:#f2fbf5;stroke:#8bc9a0}.pt{font-size:19px;font-weight:700}.ps{font-size:12px;fill:#475569}.box{fill:#fff;stroke-width:1.4;rx:10}.blue{stroke:#3b82c4}.green{stroke:#3c9a5f}.red{stroke:#d9534f}.orange{stroke:#d69e2e}.gray{stroke:#64748b}.h{font-size:14px;font-weight:700;text-anchor:middle}.m{font-size:11.3px;text-anchor:middle;fill:#475569}.sql{font-family:Consolas,D2Coding,monospace;font-size:14px;font-weight:700;text-anchor:middle;fill:#334155}.arr{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.yes{stroke:#3c9a5f;stroke-width:2;fill:none;marker-end:url(#a)}.no{stroke:#d9534f;stroke-width:2;fill:none;marker-end:url(#a)}.table{fill:#fff;stroke:#64748b;stroke-width:1.3;rx:8}.thead{fill:#e8eef7}.th{font-size:11.4px;font-weight:700;text-anchor:middle}.td{font-size:10.8px;text-anchor:middle;fill:#334155}.tagY{fill:#dcfce7;stroke:#3c9a5f;stroke-width:1.2;rx:7}.tagN{fill:#fee2e2;stroke:#d9534f;stroke-width:1.2;rx:7}.ty{font-size:11.2px;font-weight:700;text-anchor:middle;fill:#166534}.tn{font-size:11.2px;font-weight:700;text-anchor:middle;fill:#991b1b}.note{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.4;rx:10}.nt{font-size:11.7px;font-weight:700;text-anchor:middle;fill:#92400e}.core{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.6;rx:10}.cv{font-size:15px;font-weight:700;text-anchor:middle;fill:#166534}</style></defs><rect width="1200" height="1050" fill="#fff"/><text x="600" y="40" class="t">WHERE 조건으로 행 필터링</text><text x="600" y="68" class="s">WHERE는 각 행의 조건을 평가하고 참인 행만 다음 SELECT 결과 단계로 전달한다</text><rect x="35" y="100" width="1130" height="240" class="panel source"/><text x="60" y="132" class="pt">1. 입력 행 집합 · FROM students</text><text x="330" y="132" class="ps">학생 5명의 행을 조건 검사 대상으로 선택</text><rect x="100" y="165" width="1000" height="135" class="table"/><rect x="100" y="165" width="1000" height="30" class="thead"/><line x1="220" y1="165" x2="220" y2="300" stroke="#cbd5e1"/><line x1="420" y1="165" x2="420" y2="300" stroke="#cbd5e1"/><line x1="760" y1="165" x2="760" y2="300" stroke="#cbd5e1"/><line x1="920" y1="165" x2="920" y2="300" stroke="#cbd5e1"/><line x1="100" y1="195" x2="1100" y2="195" stroke="#cbd5e1"/><line x1="100" y1="216" x2="1100" y2="216" stroke="#e2e8f0"/><line x1="100" y1="237" x2="1100" y2="237" stroke="#e2e8f0"/><line x1="100" y1="258" x2="1100" y2="258" stroke="#e2e8f0"/><line x1="100" y1="279" x2="1100" y2="279" stroke="#e2e8f0"/><text x="160" y="185" class="th">id</text><text x="320" y="185" class="th">name</text><text x="590" y="185" class="th">major</text><text x="840" y="185" class="th">grade</text><text x="1010" y="185" class="th">조건 결과</text><text x="160" y="210" class="td">1</text><text x="320" y="210" class="td">김민지</text><text x="590" y="210" class="td">컴퓨터공학</text><text x="840" y="210" class="td">2</text><text x="160" y="231" class="td">2</text><text x="320" y="231" class="td">이준호</text><text x="590" y="231" class="td">데이터사이언스</text><text x="840" y="231" class="td">3</text><text x="160" y="252" class="td">3</text><text x="320" y="252" class="td">박서연</text><text x="590" y="252" class="td">경영학</text><text x="840" y="252" class="td">1</text><text x="160" y="273" class="td">4</text><text x="320" y="273" class="td">최현우</text><text x="590" y="273" class="td">컴퓨터공학</text><text x="840" y="273" class="td">4</text><text x="160" y="294" class="td">5</text><text x="320" y="294" class="td">정하늘</text><text x="590" y="294" class="td">AI데이터공학</text><text x="840" y="294" class="td">2</text><rect x="965" y="199" width="90" height="16" class="tagY"/><text x="1010" y="211" class="ty">TRUE</text><rect x="965" y="220" width="90" height="16" class="tagN"/><text x="1010" y="232" class="tn">FALSE</text><rect x="965" y="241" width="90" height="16" class="tagN"/><text x="1010" y="253" class="tn">FALSE</text><rect x="965" y="262" width="90" height="16" class="tagY"/><text x="1010" y="274" class="ty">TRUE</text><rect x="965" y="283" width="90" height="16" class="tagN"/><text x="1010" y="295" class="tn">FALSE</text><rect x="350" y="370" width="500" height="70" class="box blue"/><text x="600" y="398" class="sql">WHERE major = '컴퓨터공학'</text><text x="600" y="424" class="m">각 행의 major 값을 문자열 조건과 비교</text><path d="M600 340V370" class="arr"/><rect x="35" y="475" width="545" height="295" class="panel filter"/><text x="60" y="507" class="pt">2. 행별 조건 평가</text><rect x="75" y="540" width="215" height="78" class="box green"/><text x="182" y="567" class="h">김민지 · TRUE</text><text x="182" y="592" class="m">결과 후보에 포함</text><rect x="325" y="540" width="215" height="78" class="box red"/><text x="432" y="567" class="h">이준호 · FALSE</text><text x="432" y="592" class="m">결과에서 제외</text><rect x="75" y="640" width="215" height="78" class="box red"/><text x="182" y="667" class="h">박서연 · FALSE</text><text x="182" y="692" class="m">결과에서 제외</text><rect x="325" y="640" width="215" height="78" class="box green"/><text x="432" y="667" class="h">최현우 · TRUE</text><text x="432" y="692" class="m">결과 후보에 포함</text><rect x="200" y="728" width="215" height="28" class="box red"/><text x="307" y="747" class="m">정하늘 · FALSE · 제외</text><path d="M560 440V460H182V540" class="yes"/><path d="M600 440V460H432V540" class="no"/><rect x="620" y="475" width="545" height="295" class="panel result"/><text x="645" y="507" class="pt">3. SELECT 결과 집합</text><rect x="675" y="540" width="435" height="58" class="box green"/><text x="892" y="565" class="h">SELECT 목록 적용</text><text x="892" y="587" class="m">참인 행에서 요청한 컬럼만 결과에 표시</text><rect x="700" y="625" width="385" height="86" class="table"/><rect x="700" y="625" width="385" height="28" class="thead"/><line x1="815" y1="625" x2="815" y2="711" stroke="#cbd5e1"/><line x1="965" y1="625" x2="965" y2="711" stroke="#cbd5e1"/><line x1="700" y1="653" x2="1085" y2="653" stroke="#cbd5e1"/><line x1="700" y1="682" x2="1085" y2="682" stroke="#e2e8f0"/><text x="757" y="644" class="th">name</text><text x="890" y="644" class="th">major</text><text x="1025" y="644" class="th">grade</text><text x="757" y="674" class="td">김민지</text><text x="890" y="674" class="td">컴퓨터공학</text><text x="1025" y="674" class="td">2</text><text x="757" y="703" class="td">최현우</text><text x="890" y="703" class="td">컴퓨터공학</text><text x="1025" y="703" class="td">4</text><text x="892" y="742" class="h">원본 5행 → 결과 2행</text><text x="892" y="762" class="m">WHERE는 행 수를 줄이고 저장된 원본 데이터는 변경하지 않음</text><path d="M432 718V735H620" class="yes"/><rect x="35" y="800" width="1130" height="135" class="panel logic"/><text x="60" y="832" class="pt">4. 조건 작성 방식</text><rect x="60" y="855" width="245" height="54" class="box gray"/><text x="182" y="878" class="h">비교 연산자</text><text x="182" y="899" class="m">= · &lt;&gt; · &gt; · &gt;= · &lt; · &lt;=</text><rect x="335" y="855" width="360" height="54" class="box orange"/><text x="515" y="878" class="h">AND · 모든 조건이 참</text><text x="515" y="899" class="m">컴퓨터공학 AND 3학년 이상 → 최현우</text><rect x="725" y="855" width="415" height="54" class="box blue"/><text x="932" y="878" class="h">OR · 하나 이상 참</text><text x="932" y="899" class="m">컴퓨터공학 OR 데이터사이언스 → 3명</text><rect x="55" y="955" width="350" height="54" class="note"/><text x="230" y="979" class="nt">행과 열 구분</text><text x="230" y="999" class="m">WHERE는 행 제한 · SELECT 목록은 결과 열 결정</text><rect x="425" y="955" width="350" height="54" class="note"/><text x="600" y="979" class="nt">안전한 변경</text><text x="600" y="999" class="m">UPDATE·DELETE 전 같은 WHERE로 SELECT 대상 확인</text><rect x="795" y="955" width="350" height="54" class="note"/><text x="970" y="979" class="nt">정렬은 별도</text><text x="970" y="999" class="m">WHERE는 순서를 보장하지 않으므로 ORDER BY 사용</text><rect x="120" y="1020" width="960" height="24" class="core"/><text x="600" y="1036" class="cv">WHERE는 각 행의 조건을 평가해 참인 행만 결과 단계로 전달한다</text></svg>