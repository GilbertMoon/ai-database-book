<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc"><title id="title">SQL 명령어와 CRUD 흐름</title><desc id="desc">SQL을 DDL, DML, DCL, TCL로 구분하고 DML의 INSERT, SELECT, UPDATE, DELETE를 CRUD와 연결하여 students 테이블에 미치는 영향과 UPDATE·DELETE 실행 전 대상 행 확인 원칙을 설명하는 도식</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}.t{font-size:28px;font-weight:700;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.root{fill:#24497a;stroke:#17355c;stroke-width:1.8;rx:13}.rt{font-size:18px;font-weight:700;fill:#fff;text-anchor:middle}.rs{font-size:12px;fill:#dbeafe;text-anchor:middle}.panel{fill:#f8fafc;stroke:#a8b3c4;stroke-width:1.5;rx:15}.pt{font-size:18px;font-weight:700}.class{fill:#fff;stroke-width:1.5;rx:10}.ddl{stroke:#64748b}.dml{fill:#eef5ff;stroke:#3b82c4}.dcl{stroke:#7c5cc4}.tcl{stroke:#d69e2e}.ch{font-size:15px;font-weight:700;text-anchor:middle}.cm{font-size:11.5px;text-anchor:middle;fill:#475569}.crud{fill:#fff;stroke-width:1.7;rx:12}.create{stroke:#3c9a5f}.read{stroke:#3b82c4}.update{stroke:#d69e2e}.delete{stroke:#d9534f}.big{font-size:18px;font-weight:700;text-anchor:middle}.cmd{font-family:Consolas,D2Coding,monospace;font-size:15px;font-weight:700;text-anchor:middle}.sub{font-size:11.5px;text-anchor:middle;fill:#475569}.table{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.7;rx:12}.th{font-size:17px;font-weight:700;text-anchor:middle;fill:#166534}.row{fill:#fff;stroke:#94a3b8;stroke-width:1.2;rx:8}.rh{font-size:13px;font-weight:700;text-anchor:middle}.rm{font-size:11px;text-anchor:middle;fill:#475569}.check{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.4;rx:10}.ckh{font-size:13px;font-weight:700;text-anchor:middle;fill:#92400e}.ckm{font-size:11px;text-anchor:middle;fill:#475569}.arr{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.readarr{stroke:#3b82c4;stroke-width:2;fill:none;marker-end:url(#a)}.writearr{stroke:#d69e2e;stroke-width:2;fill:none;marker-end:url(#a)}.note{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.4;rx:10}.nt{font-size:11.7px;font-weight:700;text-anchor:middle;fill:#92400e}.core{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.6;rx:10}.cv{font-size:15px;font-weight:700;text-anchor:middle;fill:#166534}</style></defs><rect width="1200" height="980" fill="#fff"/><text x="600" y="40" class="t">SQL 명령어와 CRUD 흐름</text><text x="600" y="68" class="s">CRUD는 SQL 전체가 아니라 테이블 데이터를 다루는 DML의 핵심 작업이며, 명령마다 행과 열에 미치는 영향이 다르다</text><rect x="330" y="98" width="540" height="70" class="root"/><text x="600" y="126" class="rt">SQL</text><text x="600" y="150" class="rs">구조·데이터·권한·트랜잭션을 다루는 데이터베이스 언어</text><rect x="35" y="205" width="1130" height="170" class="panel"/><text x="60" y="237" class="pt">1. SQL의 역할별 분류</text><rect x="60" y="265" width="245" height="78" class="class ddl"/><text x="182" y="292" class="ch">DDL · 구조 정의</text><text x="182" y="319" class="cm">CREATE · ALTER · DROP</text><rect x="335" y="255" width="255" height="98" class="class dml"/><text x="462" y="285" class="ch">DML · 데이터 처리</text><text x="462" y="312" class="cm">INSERT · SELECT · UPDATE · DELETE</text><text x="462" y="334" class="cm">이 장에서 다루는 CRUD의 중심</text><rect x="620" y="265" width="245" height="78" class="class dcl"/><text x="742" y="292" class="ch">DCL · 권한 제어</text><text x="742" y="319" class="cm">GRANT · REVOKE</text><rect x="895" y="265" width="245" height="78" class="class tcl"/><text x="1017" y="292" class="ch">TCL · 트랜잭션 제어</text><text x="1017" y="319" class="cm">COMMIT · ROLLBACK</text><path d="M480 168V190H182V265" class="arr"/><path d="M560 168V255H462" class="arr"/><path d="M640 168V190H742V265" class="arr"/><path d="M720 168V190H1017V265" class="arr"/><rect x="35" y="405" width="1130" height="310" class="panel"/><text x="60" y="437" class="pt">2. DML과 CRUD 대응</text><rect x="55" y="475" width="245" height="150" class="crud create"/><text x="177" y="508" class="big">Create</text><text x="177" y="540" class="cmd">INSERT</text><text x="177" y="569" class="sub">students 테이블에 새 학생 행 추가</text><text x="177" y="596" class="sub">영향: 행 수 증가</text><rect x="335" y="475" width="245" height="150" class="crud read"/><text x="457" y="508" class="big">Read</text><text x="457" y="540" class="cmd">SELECT</text><text x="457" y="569" class="sub">필요한 행과 열을 조회</text><text x="457" y="596" class="sub">영향: 저장 데이터는 바뀌지 않음</text><rect x="615" y="475" width="245" height="150" class="crud update"/><text x="737" y="508" class="big">Update</text><text x="737" y="540" class="cmd">UPDATE</text><text x="737" y="569" class="sub">기존 행의 전공·학년 등 수정</text><text x="737" y="596" class="sub">영향: 선택된 행의 값 변경</text><rect x="895" y="475" width="245" height="150" class="crud delete"/><text x="1017" y="508" class="big">Delete</text><text x="1017" y="540" class="cmd">DELETE</text><text x="1017" y="569" class="sub">선택된 학생 행 제거</text><text x="1017" y="596" class="sub">영향: 행 수 감소</text><path d="M462 353V385H177V475" class="arr"/><path d="M462 353V475" class="arr"/><path d="M462 353V385H737V475" class="arr"/><path d="M462 353V385H1017V475" class="arr"/><rect x="55" y="645" width="245" height="46" class="row"/><text x="177" y="664" class="rh">실행 후 확인</text><text x="177" y="683" class="rm">영향받은 행 수·저장값·오류</text><rect x="335" y="645" width="245" height="46" class="row"/><text x="457" y="664" class="rh">결과 확인</text><text x="457" y="683" class="rm">행 수·컬럼·조건·정렬</text><rect x="615" y="645" width="245" height="46" class="check"/><text x="737" y="664" class="ckh">실행 전 SELECT</text><text x="737" y="683" class="ckm">WHERE 대상 행을 먼저 확인</text><rect x="895" y="645" width="245" height="46" class="check"/><text x="1017" y="664" class="ckh">실행 전 SELECT</text><text x="1017" y="683" class="ckm">삭제 대상 행을 먼저 확인</text><rect x="310" y="750" width="580" height="100" class="table"/><text x="600" y="780" class="th">students 테이블</text><text x="600" y="807" class="sub">행: 학생 한 명의 정보 · 열: id, name, email, major, grade 등</text><text x="600" y="830" class="sub">INSERT·UPDATE·DELETE는 저장 상태를 바꾸고 SELECT는 현재 상태를 읽는다</text><path d="M177 625V725H470V750" class="writearr"/><path d="M457 750V715" class="readarr"/><path d="M737 625V725H650V750" class="writearr"/><path d="M1017 625V725H730V750" class="writearr"/><rect x="55" y="875" width="350" height="56" class="note"/><text x="230" y="899" class="nt">용어 구분</text><text x="230" y="919" class="sub">CRUD Create = INSERT · CREATE TABLE = DDL</text><rect x="425" y="875" width="350" height="56" class="note"/><text x="600" y="899" class="nt">UPDATE·DELETE 안전</text><text x="600" y="919" class="sub">WHERE가 빠지면 여러 행이 한 번에 바뀔 수 있음</text><rect x="795" y="875" width="350" height="56" class="note"/><text x="970" y="899" class="nt">실행 판단</text><text x="970" y="919" class="sub">대상 테이블·행·열과 예상 영향을 먼저 설명</text><rect x="130" y="950" width="940" height="24" class="core"/><text x="600" y="966" class="cv">명령어 이름보다 어떤 테이블의 어떤 행과 열이 영향을 받는지 실행 전에 설명할 수 있어야 한다</text></svg>