<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc"><title id="title">INSERT로 새 행 추가하기</title><desc id="desc">students 테이블에 새 학생 행을 추가할 때 컬럼 목록과 값의 위치를 맞추고, 데이터 타입과 제약조건, 생략한 id와 created_at의 기본값을 검사한 뒤 성공 시 행을 저장하고 SELECT로 검증하는 흐름</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}.t{font-size:28px;font-weight:700;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.panel{stroke-width:1.5;rx:15}.input{fill:#eef5ff;stroke:#6fa2e8}.check{fill:#fff8e8;stroke:#d69e2e}.result{fill:#f2fbf5;stroke:#8bc9a0}.pt{font-size:19px;font-weight:700}.ps{font-size:12px;fill:#475569}.box{fill:#fff;stroke-width:1.5;rx:10}.blue{stroke:#3b82c4}.orange{stroke:#d69e2e}.green{stroke:#3c9a5f}.red{stroke:#d9534f}.purple{stroke:#7c5cc4}.gray{stroke:#64748b}.h{font-size:14px;font-weight:700;text-anchor:middle}.m{font-size:11.4px;text-anchor:middle;fill:#475569}.sql{font-family:Consolas,D2Coding,monospace;font-size:14px;font-weight:700;text-anchor:middle;fill:#334155}.arr{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.back{stroke:#d9534f;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#a)}.decision{fill:#fff8e8;stroke:#b7791f;stroke-width:1.8}.dt{font-size:14px;font-weight:700;text-anchor:middle}.table{fill:#fff;stroke:#64748b;stroke-width:1.3;rx:8}.thead{fill:#e8eef7}.th{font-size:11.5px;font-weight:700;text-anchor:middle}.td{font-size:10.8px;text-anchor:middle;fill:#334155}.note{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.4;rx:10}.nt{font-size:11.7px;font-weight:700;text-anchor:middle;fill:#92400e}.core{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.6;rx:10}.cv{font-size:15px;font-weight:700;text-anchor:middle;fill:#166534}</style></defs><rect width="1200" height="1080" fill="#fff"/><text x="600" y="40" class="t">INSERT로 새 행 추가하기</text><text x="600" y="68" class="s">컬럼과 값의 위치를 맞춘 뒤 데이터 타입·제약조건·기본값 검사를 통과한 행만 저장된다</text><rect x="35" y="100" width="1130" height="285" class="panel input"/><text x="60" y="132" class="pt">1. 입력할 컬럼과 값을 1:1로 대응</text><rect x="90" y="165" width="1020" height="58" class="box blue"/><text x="600" y="190" class="sql">INSERT INTO students (name, email, major, grade)</text><text x="600" y="211" class="m">입력할 컬럼을 명시하면 순서와 의도가 분명해지고 테이블 구조 변경에도 더 안전함</text><rect x="70" y="255" width="245" height="92" class="box blue"/><text x="192" y="283" class="h">name</text><text x="192" y="309" class="sql">'김민지'</text><text x="192" y="331" class="m">문자열은 작은따옴표</text><rect x="335" y="255" width="245" height="92" class="box purple"/><text x="457" y="283" class="h">email</text><text x="457" y="309" class="sql">'minji@example.com'</text><text x="457" y="331" class="m">UNIQUE 중복 여부 확인</text><rect x="600" y="255" width="245" height="92" class="box orange"/><text x="722" y="283" class="h">major</text><text x="722" y="309" class="sql">'컴퓨터공학'</text><text x="722" y="331" class="m">문자열 또는 NULL 가능</text><rect x="865" y="255" width="245" height="92" class="box green"/><text x="987" y="283" class="h">grade</text><text x="987" y="309" class="sql">2</text><text x="987" y="331" class="m">정수 값</text><path d="M600 223V238H192V255" class="arr"/><path d="M600 223V238H457V255" class="arr"/><path d="M600 223V238H722V255" class="arr"/><path d="M600 223V238H987V255" class="arr"/><rect x="35" y="415" width="1130" height="285" class="panel check"/><text x="60" y="447" class="pt">2. DBMS가 INSERT 문장과 테이블 규칙 검사</text><rect x="60" y="480" width="245" height="88" class="box gray"/><text x="182" y="508" class="h">컬럼·값 개수와 순서</text><text x="182" y="534" class="m">컬럼 4개 ↔ 값 4개</text><text x="182" y="555" class="m">같은 위치끼리 의미가 대응</text><rect x="335" y="480" width="245" height="88" class="box blue"/><text x="457" y="508" class="h">데이터 타입</text><text x="457" y="534" class="m">문자열·정수 등</text><text x="457" y="555" class="m">각 컬럼 형식과 일치</text><rect x="610" y="480" width="245" height="88" class="box red"/><text x="732" y="508" class="h">제약조건</text><text x="732" y="534" class="m">NOT NULL · UNIQUE</text><text x="732" y="555" class="m">중복 이메일·필수값 누락 차단</text><rect x="885" y="480" width="245" height="88" class="box orange"/><text x="1007" y="508" class="h">생략한 컬럼</text><text x="1007" y="534" class="m">기본값·NULL·오류 중</text><text x="1007" y="555" class="m">테이블 정의에 따라 결정</text><rect x="95" y="605" width="230" height="62" class="box green"/><text x="210" y="630" class="h">id 생략</text><text x="210" y="653" class="m">SERIAL로 새 번호 생성</text><rect x="355" y="605" width="230" height="62" class="box green"/><text x="470" y="630" class="h">created_at 생략</text><text x="470" y="653" class="m">현재 시각 기본값 적용</text><rect x="615" y="605" width="230" height="62" class="box orange"/><text x="730" y="630" class="h">nullable 컬럼 생략</text><text x="730" y="653" class="m">기본값이 없으면 NULL</text><rect x="875" y="605" width="230" height="62" class="box red"/><text x="990" y="630" class="h">필수 컬럼 생략</text><text x="990" y="653" class="m">기본값도 없으면 오류</text><path d="M1007 568V590H210V605" class="arr"/><path d="M1007 568V590H470V605" class="arr"/><path d="M1007 568V590H730V605" class="arr"/><path d="M1007 568V590H990V605" class="arr"/><polygon points="600,725 735,765 600,805 465,765" class="decision"/><text x="600" y="761" class="dt">모든 검사를 통과했는가?</text><text x="600" y="783" class="m">문장 구조·타입·제약조건·기본값을 함께 판단</text><path d="M182 568V700H600V725" class="arr"/><path d="M457 568V700H600" class="arr"/><path d="M732 568V700H600" class="arr"/><path d="M990 667V700H600" class="arr"/><rect x="55" y="835" width="500" height="125" class="panel result"/><text x="305" y="867" class="pt" text-anchor="middle">성공 · 새 행 저장</text><rect x="90" y="890" width="430" height="50" class="table"/><rect x="90" y="890" width="430" height="24" class="thead"/><line x1="145" y1="890" x2="145" y2="940" stroke="#cbd5e1"/><line x1="235" y1="890" x2="235" y2="940" stroke="#cbd5e1"/><line x1="365" y1="890" x2="365" y2="940" stroke="#cbd5e1"/><line x1="450" y1="890" x2="450" y2="940" stroke="#cbd5e1"/><text x="117" y="907" class="th">id</text><text x="190" y="907" class="th">name</text><text x="300" y="907" class="th">email</text><text x="407" y="907" class="th">major</text><text x="485" y="907" class="th">grade</text><text x="117" y="930" class="td">자동</text><text x="190" y="930" class="td">김민지</text><text x="300" y="930" class="td">minji@example.com</text><text x="407" y="930" class="td">컴퓨터공학</text><text x="485" y="930" class="td">2</text><text x="305" y="952" class="m">기존 행은 유지되고 행 수가 1 증가 · created_at도 자동 생성</text><rect x="645" y="835" width="500" height="125" class="panel" fill="#fff5f5" stroke="#d9534f"/><text x="895" y="867" class="pt" text-anchor="middle">실패 · 잘못된 행 미저장</text><rect x="680" y="892" width="430" height="48" class="box red"/><text x="895" y="913" class="h">오류 메시지에서 실패 유형 확인</text><text x="895" y="934" class="m">개수·순서 · 문자열·타입 · UNIQUE · NOT NULL</text><text x="895" y="953" class="m">문장을 수정한 뒤 같은 단계로 다시 실행</text><path d="M465 765H305V835" class="arr"/><path d="M735 765H895V835" class="arr"/><path d="M895 960V980H30V301H70" class="back"/><rect x="70" y="982" width="330" height="54" class="note"/><text x="235" y="1006" class="nt">여러 행 INSERT</text><text x="235" y="1027" class="m">모든 튜플은 같은 컬럼 수와 순서를 사용</text><rect x="435" y="982" width="330" height="54" class="note"/><text x="600" y="1006" class="nt">한 문장 전체 검증</text><text x="600" y="1027" class="m">한 행이 규칙을 위반하면 일반적으로 전체 INSERT 실패</text><rect x="800" y="982" width="330" height="54" class="note"/><text x="965" y="1006" class="nt">실행 후 SELECT</text><text x="965" y="1027" class="m">입력값·자동값·행 수·영향받은 행 수 확인</text><rect x="120" y="1047" width="960" height="24" class="core"/><text x="600" y="1063" class="cv">INSERT는 컬럼·값 대응과 테이블 규칙을 통과한 새 행을 추가하는 과정이다</text></svg>