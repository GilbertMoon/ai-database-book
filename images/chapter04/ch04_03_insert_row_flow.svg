<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">INSERT로 새 행 추가하기</title>
  <desc id="desc">INSERT 문에서 컬럼 목록과 값 목록이 같은 위치끼리 대응되고, DBMS 검사를 통과하면 students 테이블에 새 행이 추가되는 흐름</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
  <style>
    text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#172033}
    .title{font-size:30px;font-weight:700;text-anchor:middle;fill:#0f2d5c}.box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .insert{fill:#eef9f1;stroke:#2f9a58;stroke-width:2}.check{fill:#fffceb;stroke:#d6a600;stroke-width:2}
    .bad{fill:#fff1f1;stroke:#d64545;stroke-width:2}.cell{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.head{fill:#eef9f1;stroke:#2f9a58;stroke-width:2}
    .name{font-size:18px;font-weight:700;text-anchor:middle}.t{font-size:14px;text-anchor:middle}.mono{font-size:14px;font-weight:700;text-anchor:middle;font-family:Consolas,D2Coding,"Courier New",monospace;fill:#0f2d5c}
    .line{stroke:#475569;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.sub{font-size:14px;text-anchor:middle;fill:#475569}.note{font-size:16px;font-weight:700;text-anchor:middle;fill:#0f2d5c}
  </style></defs>
  <rect width="1200" height="720" fill="#fff"/><text x="600" y="48" class="title">INSERT로 새 행 추가하기</text>
  <rect x="150" y="95" width="900" height="150" rx="16" class="insert"/>
  <text x="600" y="127" class="name">INSERT 문</text>
  <rect x="205" y="150" width="190" height="36" class="head"/><text x="300" y="174" class="mono">name</text>
  <rect x="395" y="150" width="240" height="36" class="head"/><text x="515" y="174" class="mono">email</text>
  <rect x="635" y="150" width="210" height="36" class="head"/><text x="740" y="174" class="mono">major</text>
  <rect x="845" y="150" width="110" height="36" class="head"/><text x="900" y="174" class="mono">grade</text>
  <rect x="205" y="186" width="190" height="40" class="cell"/><text x="300" y="211" class="t">'김민지'</text>
  <rect x="395" y="186" width="240" height="40" class="cell"/><text x="515" y="211" class="t">'minji@example.com'</text>
  <rect x="635" y="186" width="210" height="40" class="cell"/><text x="740" y="211" class="t">'컴퓨터공학'</text>
  <rect x="845" y="186" width="110" height="40" class="cell"/><text x="900" y="211" class="t">2</text>
  <text x="600" y="268" class="sub">값은 같은 위치의 컬럼과 대응한다. 문자열은 작은따옴표를 사용하고 숫자는 따옴표 없이 표현한다.</text>
  <path d="M600 285V330" class="line"/>
  <rect x="380" y="335" width="440" height="72" rx="14" class="check"/><text x="600" y="364" class="name">컬럼 수·순서와 값 확인</text><text x="600" y="389" class="sub">개수와 위치가 맞아야 함</text>
  <path d="M600 407V450" class="line"/>
  <rect x="330" y="455" width="540" height="78" rx="14" class="check"/><text x="600" y="485" class="name">데이터 타입·제약조건 검사</text><text x="600" y="512" class="sub">컬럼 수 · 타입 · NOT NULL · UNIQUE · DEFAULT</text>
  <path d="M600 533V575" class="line"/>
  <rect x="390" y="580" width="420" height="68" rx="14" class="insert"/><text x="600" y="609" class="name">students 테이블에 새 행 추가</text><text x="600" y="633" class="sub">기존 행을 유지한 채 행 수 증가</text>
  <rect x="875" y="455" width="220" height="78" rx="14" class="bad"/><text x="985" y="486" class="name">저장 거부</text><text x="985" y="512" class="sub">제약조건 위반</text>
  <path d="M870 494H875" class="line"/>
  <text x="600" y="690" class="note">성공한 INSERT도 SELECT로 결과를 확인한다.</text>
</svg>
