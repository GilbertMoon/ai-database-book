<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5568"/></marker><style>text{font-family:Arial,sans-serif;fill:#1a202c}.t{font-size:24px;font-weight:700}.b{fill:#f7fafc;stroke:#4a5568;stroke-width:2;rx:12}.m{fill:#ebf8ff;stroke:#2b6cb0}.g{fill:#f0fff4;stroke:#38a169}.y{fill:#fffaf0;stroke:#d69e2e}.l{font-size:16px;text-anchor:middle;dominant-baseline:middle}.s{font-size:13px;text-anchor:middle;dominant-baseline:middle}</style></defs><rect width="100%" height="100%" fill="white"/><text x="550" y="40" text-anchor="middle" class="t">INSERT adds a new row</text><rect x="390" y="90" width="320" height="60" class="b m"/><text x="550" y="120" class="l">INSERT INTO students</text><rect x="120" y="230" width="320" height="70" class="b y"/><text x="280" y="258" class="l">columns</text><text x="280" y="282" class="s">name, email, major, grade</text><rect x="660" y="230" width="320" height="70" class="b y"/><text x="820" y="258" class="l">values</text><text x="820" y="282" class="s">student data</text><rect x="330" y="390" width="440" height="70" class="b g"/><text x="550" y="420" class="l">create one new record</text><text x="550" y="442" class="s">column order and value order must match</text><rect x="330" y="520" width="440" height="60" class="b m"/><text x="550" y="550" class="l">append to students table</text><line x1="510" y1="150" x2="280" y2="230" stroke="#4a5568" stroke-width="2" marker-end="url(#a)"/><line x1="590" y1="150" x2="820" y2="230" stroke="#4a5568" stroke-width="2" marker-end="url(#a)"/><line x1="280" y1="300" x2="470" y2="390" stroke="#4a5568" stroke-width="2" marker-end="url(#a)"/><line x1="820" y1="300" x2="630" y2="390" stroke="#4a5568" stroke-width="2" marker-end="url(#a)"/><line x1="550" y1="460" x2="550" y2="520" stroke="#4a5568" stroke-width="2" marker-end="url(#a)"/></svg