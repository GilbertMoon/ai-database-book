<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">SELECT로 필요한 컬럼 선택하기</title>
  <desc id="desc">students 테이블에서 SELECT name, major가 name과 major 컬럼만 결과 집합에 표시하도록 선택하는 과정을 보여 주는 도식</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
    <style>
      text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#172033}
      .title{font-size:30px;font-weight:700;text-anchor:middle;fill:#0f2d5c}.cell{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.6}
      .chosen{fill:#e9f2fe;stroke:#3174d0;stroke-width:2.2}.result{fill:#eef5ff;stroke:#3174d0;stroke-width:2}
      .box{fill:#fffceb;stroke:#d6a600;stroke-width:2}.name{font-size:18px;font-weight:700;text-anchor:middle}
      .t{font-size:15px;text-anchor:middle}.mono{font-size:16px;font-weight:700;text-anchor:middle;font-family:Consolas,D2Coding,"Courier New",monospace;fill:#0f2d5c}
      .line{stroke:#475569;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.sub{font-size:14px;text-anchor:middle;fill:#475569}
      .note{font-size:16px;font-weight:700;text-anchor:middle;fill:#0f2d5c}
    </style>
  </defs>
  <rect width="1200" height="620" fill="#fff"/>
  <text x="600" y="48" class="title">SELECT로 필요한 컬럼 선택하기</text>
  <text x="360" y="103" class="name">students 테이블</text>
  <rect x="130" y="125" width="110" height="55" class="cell"/><text x="185" y="158" class="t">id</text>
  <rect x="240" y="125" width="145" height="55" class="chosen"/><text x="313" y="158" class="name">name</text>
  <rect x="385" y="125" width="195" height="55" class="cell"/><text x="483" y="158" class="t">email</text>
  <rect x="580" y="125" width="150" height="55" class="chosen"/><text x="655" y="158" class="name">major</text>
  <rect x="730" y="125" width="110" height="55" class="cell"/><text x="785" y="158" class="t">grade</text>
  <rect x="130" y="180" width="110" height="52" class="cell"/><text x="185" y="211" class="t">1</text>
  <rect x="240" y="180" width="145" height="52" class="chosen"/><text x="313" y="211" class="t">김민지</text>
  <rect x="385" y="180" width="195" height="52" class="cell"/><text x="483" y="211" class="t">minji@...</text>
  <rect x="580" y="180" width="150" height="52" class="chosen"/><text x="655" y="211" class="t">컴퓨터공학</text>
  <rect x="730" y="180" width="110" height="52" class="cell"/><text x="785" y="211" class="t">2</text>
  <rect x="130" y="232" width="110" height="52" class="cell"/><text x="185" y="263" class="t">2</text>
  <rect x="240" y="232" width="145" height="52" class="chosen"/><text x="313" y="263" class="t">이준호</text>
  <rect x="385" y="232" width="195" height="52" class="cell"/><text x="483" y="263" class="t">junho@...</text>
  <rect x="580" y="232" width="150" height="52" class="chosen"/><text x="655" y="263" class="t">데이터사이언스</text>
  <rect x="730" y="232" width="110" height="52" class="cell"/><text x="785" y="263" class="t">3</text>

  <rect x="435" y="335" width="330" height="62" rx="14" class="box"/><text x="600" y="374" class="mono">SELECT name, major</text>
  <path d="M600 284V335" class="line"/>
  <path d="M600 397V445" class="line"/>

  <text x="600" y="434" class="sub">WHERE가 없으므로 행은 제외되지 않는다.</text>
  <rect x="390" y="448" width="200" height="55" class="result"/><text x="490" y="482" class="name">name</text>
  <rect x="590" y="448" width="220" height="55" class="result"/><text x="700" y="482" class="name">major</text>
  <rect x="390" y="503" width="200" height="45" class="result"/><text x="490" y="531" class="t">김민지</text>
  <rect x="590" y="503" width="220" height="45" class="result"/><text x="700" y="531" class="t">컴퓨터공학</text>
  <text x="600" y="590" class="note">SELECT 목록은 결과 컬럼과 컬럼 순서를 정하며, 원본 테이블은 변경하지 않는다.</text>
</svg>
