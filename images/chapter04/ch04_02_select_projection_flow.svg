<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc"><title id="title">SELECT와 컬럼 선택 흐름</title><desc id="desc">students 테이블에서 FROM이 입력 테이블을 정하고 SELECT 목록이 결과 컬럼과 순서를 정하는 과정을 SELECT 별표와 필요한 컬럼 명시 방식으로 비교하며 WHERE가 없으면 행 수가 유지됨을 보여 주는 도식</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}.t{font-size:28px;font-weight:700;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.panel{stroke-width:1.5;rx:15}.source{fill:#f8fafc;stroke:#a8b3c4}.all{fill:#fff8e8;stroke:#d69e2e}.pick{fill:#eef5ff;stroke:#3b82c4}.pt{font-size:18px;font-weight:700}.ps{font-size:12px;fill:#475569}.table{fill:#fff;stroke:#64748b;stroke-width:1.4;rx:9}.head{fill:#e8eef7}.head2{fill:#dcecff}.head3{fill:#fff1cf}.th{font-size:12px;font-weight:700;text-anchor:middle}.td{font-size:11.3px;text-anchor:middle;fill:#334155}.step{fill:#fff;stroke-width:1.6;rx:11}.blue{fill:#eef5ff;stroke:#3b82c4}.orange{fill:#fff8e8;stroke:#d69e2e}.green{fill:#f2fbf5;stroke:#3c9a5f}.h{font-size:15px;font-weight:700;text-anchor:middle}.m{font-size:11.7px;text-anchor:middle;fill:#475569}.sql{font-family:Consolas,D2Coding,monospace;font-size:15px;font-weight:700;text-anchor:middle;fill:#334155}.arr{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.note{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.4;rx:10}.nt{font-size:11.8px;font-weight:700;text-anchor:middle;fill:#92400e}.core{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.6;rx:10}.cv{font-size:15px;font-weight:700;text-anchor:middle;fill:#166534}.badge{font-size:12px;font-weight:700;text-anchor:middle;fill:#166534}</style></defs><rect width="1200" height="1020" fill="#fff"/><text x="600" y="40" class="t">SELECT와 컬럼 선택 흐름</text><text x="600" y="68" class="s">FROM은 읽을 테이블을 정하고, SELECT 목록은 결과에 표시할 열과 순서를 정한다</text><rect x="35" y="100" width="1130" height="250" class="panel source"/><text x="60" y="132" class="pt">1. 입력 테이블 · students</text><text x="275" y="132" class="ps">행 3개와 컬럼 5개가 저장되어 있다고 가정</text><rect x="120" y="165" width="960" height="145" class="table"/><rect x="120" y="165" width="960" height="34" class="head"/><line x1="240" y1="165" x2="240" y2="310" stroke="#cbd5e1"/><line x1="420" y1="165" x2="420" y2="310" stroke="#cbd5e1"/><line x1="680" y1="165" x2="680" y2="310" stroke="#cbd5e1"/><line x1="880" y1="165" x2="880" y2="310" stroke="#cbd5e1"/><line x1="120" y1="199" x2="1080" y2="199" stroke="#cbd5e1"/><line x1="120" y1="236" x2="1080" y2="236" stroke="#e2e8f0"/><line x1="120" y1="273" x2="1080" y2="273" stroke="#e2e8f0"/><text x="180" y="187" class="th">id</text><text x="330" y="187" class="th">name</text><text x="550" y="187" class="th">email</text><text x="780" y="187" class="th">major</text><text x="980" y="187" class="th">grade</text><text x="180" y="224" class="td">1</text><text x="330" y="224" class="td">김민지</text><text x="550" y="224" class="td">minji@example.com</text><text x="780" y="224" class="td">컴퓨터공학</text><text x="980" y="224" class="td">2</text><text x="180" y="261" class="td">2</text><text x="330" y="261" class="td">이준호</text><text x="550" y="261" class="td">junho@example.com</text><text x="780" y="261" class="td">데이터사이언스</text><text x="980" y="261" class="td">3</text><text x="180" y="298" class="td">3</text><text x="330" y="298" class="td">박서연</text><text x="550" y="298" class="td">seoyeon@example.com</text><text x="780" y="298" class="td">경영학</text><text x="980" y="298" class="td">1</text><rect x="390" y="375" width="420" height="64" class="step green"/><text x="600" y="401" class="sql">FROM students</text><text x="600" y="425" class="m">조회할 입력 테이블을 students로 결정</text><path d="M600 350V375" class="arr"/><rect x="35" y="470" width="545" height="375" class="panel all"/><text x="307" y="503" class="pt" text-anchor="middle">2A. 모든 컬럼 조회</text><rect x="90" y="530" width="435" height="64" class="step orange"/><text x="307" y="557" class="sql">SELECT *</text><text x="307" y="581" class="m">현재 테이블에 존재하는 모든 컬럼 요청</text><rect x="70" y="625" width="475" height="118" class="table"/><rect x="70" y="625" width="475" height="32" class="head3"/><line x1="125" y1="625" x2="125" y2="743" stroke="#e5d3a0"/><line x1="210" y1="625" x2="210" y2="743" stroke="#e5d3a0"/><line x1="350" y1="625" x2="350" y2="743" stroke="#e5d3a0"/><line x1="455" y1="625" x2="455" y2="743" stroke="#e5d3a0"/><line x1="70" y1="657" x2="545" y2="657" stroke="#e5d3a0"/><line x1="70" y1="686" x2="545" y2="686" stroke="#f0e2bd"/><line x1="70" y1="715" x2="545" y2="715" stroke="#f0e2bd"/><text x="97" y="646" class="th">id</text><text x="167" y="646" class="th">name</text><text x="280" y="646" class="th">email</text><text x="402" y="646" class="th">major</text><text x="500" y="646" class="th">grade</text><text x="307" y="772" class="badge">컬럼 5개 · 행 3개</text><text x="307" y="802" class="m">빠른 탐색에는 편리하지만 불필요한 열이나 민감한 값까지 포함할 수 있음</text><text x="307" y="824" class="m">테이블에 새 컬럼이 추가되면 결과 구조도 함께 달라질 수 있음</text><rect x="620" y="470" width="545" height="375" class="panel pick"/><text x="892" y="503" class="pt" text-anchor="middle">2B. 필요한 컬럼만 조회</text><rect x="675" y="530" width="435" height="64" class="step blue"/><text x="892" y="557" class="sql">SELECT name, major</text><text x="892" y="581" class="m">출력할 컬럼과 표시 순서를 직접 지정</text><rect x="720" y="625" width="345" height="118" class="table"/><rect x="720" y="625" width="345" height="32" class="head2"/><line x1="892" y1="625" x2="892" y2="743" stroke="#bfd4ef"/><line x1="720" y1="657" x2="1065" y2="657" stroke="#bfd4ef"/><line x1="720" y1="686" x2="1065" y2="686" stroke="#dbe8f7"/><line x1="720" y1="715" x2="1065" y2="715" stroke="#dbe8f7"/><text x="806" y="646" class="th">name</text><text x="978" y="646" class="th">major</text><text x="806" y="676" class="td">김민지</text><text x="978" y="676" class="td">컴퓨터공학</text><text x="806" y="705" class="td">이준호</text><text x="978" y="705" class="td">데이터사이언스</text><text x="806" y="734" class="td">박서연</text><text x="978" y="734" class="td">경영학</text><text x="892" y="772" class="badge">컬럼 2개 · 행 3개</text><text x="892" y="802" class="m">의도가 명확하고 전송·표시할 데이터가 줄어듦</text><text x="892" y="824" class="m">SELECT major, name으로 쓰면 결과 컬럼 순서도 major, name으로 변경</text><path d="M560 439V455H307V530" class="arr"/><path d="M640 439V455H892V530" class="arr"/><rect x="55" y="875" width="350" height="58" class="note"/><text x="230" y="899" class="nt">행과 열 구분</text><text x="230" y="921" class="m">WHERE가 없으므로 두 결과 모두 원본 행 3개 유지</text><rect x="425" y="875" width="350" height="58" class="note"/><text x="600" y="899" class="nt">권장 사용</text><text x="600" y="921" class="m">탐색은 SELECT * 가능 · 반복·공유 SQL은 필요한 컬럼 명시</text><rect x="795" y="875" width="350" height="58" class="note"/><text x="970" y="899" class="nt">결과 검증</text><text x="970" y="921" class="m">컬럼명·개수·순서와 예상 행 수를 결과 그리드에서 확인</text><rect x="130" y="958" width="940" height="42" class="core"/><text x="600" y="975" class="cv">SELECT 결과는 원본 테이블이 아니라 요청한 열과 행으로 만들어진 별도의 결과 집합이다</text><text x="600" y="993" class="m">컬럼 선택은 projection, 행 제한은 이후 WHERE filtering 단계에서 다룬다</text></svg>