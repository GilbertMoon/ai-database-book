<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc"><title id="title">AI 생성 SQL 검토 흐름</title><desc id="desc">AI가 생성한 SQL을 현재 PostgreSQL 환경과 대조하고 SELECT, INSERT, UPDATE, DELETE 유형별로 영향 범위를 검토한 뒤 한 문장씩 실행하여 실제 결과를 검증하는 흐름</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}.t{font-size:28px;font-weight:700;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.panel{stroke-width:1.5;rx:15}.start{fill:#eef5ff;stroke:#6fa2e8}.types{fill:#f8fafc;stroke:#a8b3c4}.common{fill:#fff8e8;stroke:#d69e2e}.verify{fill:#f2fbf5;stroke:#8bc9a0}.pt{font-size:19px;font-weight:700}.box{fill:#fff;stroke-width:1.4;rx:10}.blue{stroke:#3b82c4}.green{stroke:#3c9a5f}.orange{stroke:#d69e2e}.red{stroke:#d9534f}.purple{stroke:#7c5cc4}.gray{stroke:#64748b}.h{font-size:14px;font-weight:700;text-anchor:middle}.m{font-size:11.3px;text-anchor:middle;fill:#475569}.sql{font-family:Consolas,D2Coding,monospace;font-size:14px;font-weight:700;text-anchor:middle;fill:#334155}.arr{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.back{stroke:#d9534f;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#a)}.decision{fill:#fff8e8;stroke:#b7791f;stroke-width:1.8}.dt{font-size:14px;font-weight:700;text-anchor:middle}.note{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.3;rx:9}.nt{font-size:11.6px;font-weight:700;text-anchor:middle;fill:#92400e}.core{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.5;rx:10}.cv{font-size:14.5px;font-weight:700;text-anchor:middle;fill:#166534}</style></defs><rect width="1200" height="1040" fill="#fff"/><text x="600" y="40" class="t">AI 생성 SQL 검토 흐름</text><text x="600" y="68" class="s">AI 결과는 초안이며, 현재 환경·영향 범위·실제 실행 결과를 사람이 확인한 뒤 채택한다</text><rect x="35" y="100" width="1130" height="175" class="panel start"/><text x="60" y="132" class="pt">1. 요청과 현재 환경 대조</text><rect x="65" y="160" width="315" height="78" class="box blue"/><text x="222" y="187" class="h">원래 목표</text><text x="222" y="213" class="m">무엇을 조회·추가·수정·삭제하려는가</text><rect x="442" y="160" width="315" height="78" class="box green"/><text x="599" y="187" class="h">실제 연결</text><text x="599" y="213" class="m">PostgreSQL · 현재 DB · 스키마 확인</text><rect x="820" y="160" width="315" height="78" class="box orange"/><text x="977" y="187" class="h">문장 전체</text><text x="977" y="213" class="m">다중 문장·주석·예상 밖 DDL 확인</text><rect x="35" y="310" width="1130" height="260" class="panel types"/><text x="60" y="342" class="pt">2. SQL 유형별 영향 검토</text><rect x="55" y="375" width="255" height="150" class="box blue"/><text x="182" y="404" class="h">SELECT</text><text x="182" y="432" class="m">테이블·컬럼·WHERE</text><text x="182" y="454" class="m">정렬·행 수·민감 컬럼</text><text x="182" y="492" class="m">조회만 하더라도 과도한</text><text x="182" y="513" class="m">데이터 노출 여부 확인</text><rect x="335" y="375" width="255" height="150" class="box green"/><text x="462" y="404" class="h">INSERT</text><text x="462" y="432" class="m">컬럼·값 개수와 순서</text><text x="462" y="454" class="m">타입·기본값·제약조건</text><text x="462" y="492" class="m">예상 행 수와 자동 생성값</text><text x="462" y="513" class="m">검증 방법 확인</text><rect x="615" y="375" width="255" height="150" class="box orange"/><text x="742" y="404" class="h">UPDATE</text><text x="742" y="432" class="m">SET 값·WHERE 존재</text><text x="742" y="454" class="m">예상 대상 행 수</text><text x="742" y="492" class="m">같은 WHERE로 먼저 SELECT</text><text x="742" y="513" class="m">현재 값과 대상 확인</text><rect x="895" y="375" width="255" height="150" class="box red"/><text x="1022" y="404" class="h">DELETE</text><text x="1022" y="432" class="m">WHERE·삭제 대상·참조 관계</text><text x="1022" y="454" class="m">복구 가능성 확인</text><text x="1022" y="492" class="m">같은 WHERE로 먼저 SELECT</text><text x="1022" y="513" class="m">전체 값과 행 수 확인</text><path d="M222 238V290H182V375" class="arr"/><path d="M599 238V290H462V375" class="arr"/><path d="M599 238V290H742V375" class="arr"/><path d="M977 238V290H1022V375" class="arr"/><rect x="35" y="605" width="1130" height="150" class="panel common"/><text x="60" y="637" class="pt">3. 공통 검토</text><rect x="60" y="670" width="245" height="54" class="box gray"/><text x="182" y="692" class="h">문법·객체 존재</text><text x="182" y="713" class="m">PostgreSQL 문법과 실제 컬럼</text><rect x="335" y="670" width="245" height="54" class="box blue"/><text x="457" y="692" class="h">현재 연결</text><text x="457" y="713" class="m">의도한 DB·스키마인지 확인</text><rect x="610" y="670" width="245" height="54" class="box orange"/><text x="732" y="692" class="h">예상 영향</text><text x="732" y="713" class="m">결과와 영향 행 수 설명 가능</text><rect x="885" y="670" width="245" height="54" class="box red"/><text x="1007" y="692" class="h">민감정보 제외</text><text x="1007" y="713" class="m">비밀번호·접속 정보·개인정보 없음</text><polygon points="600,785 735,825 600,865 465,825" class="decision"/><text x="600" y="821" class="dt">안전하고 이해한 한 문장인가?</text><text x="600" y="843" class="m">모호하거나 예상 밖 문장이 있으면 수정 후 다시 검토</text><path d="M182 525V585H600V605" class="arr"/><path d="M462 525V585H600" class="arr"/><path d="M742 525V585H600" class="arr"/><path d="M1022 525V585H600" class="arr"/><path d="M182 724V765H600V785" class="arr"/><path d="M457 724V765H600" class="arr"/><path d="M732 724V765H600" class="arr"/><path d="M1007 724V765H600" class="arr"/><rect x="55" y="885" width="500" height="95" class="panel verify"/><text x="80" y="917" class="pt">4. 한 문장씩 실행</text><text x="305" y="943" class="h">연습·검증 환경에서 필요한 문장만 선택</text><text x="305" y="966" class="m">현재 연결과 실행 범위를 다시 확인한 뒤 실행</text><rect x="645" y="885" width="500" height="95" class="panel verify"/><text x="670" y="917" class="pt">5. 실제 결과 검증</text><text x="895" y="943" class="h">조회 결과·영향 행 수·저장값·오류 확인</text><text x="895" y="966" class="m">예상과 다르면 추가 실행을 멈추고 새 증거로 재검토</text><path d="M735 825H895V885" class="arr"/><path d="M465 825H305V885" class="arr"/><path d="M645 932H555" class="arr"/><path d="M895 980V995H25V199H65" class="back"/><rect x="55" y="995" width="350" height="30" class="note"/><text x="230" y="1015" class="nt">AI가 생성했다는 사실은 실행 안전성을 보장하지 않음</text><rect x="425" y="995" width="350" height="30" class="note"/><text x="600" y="1015" class="nt">여러 문장을 한 번에 실행하지 않고 범위를 확인</text><rect x="795" y="995" width="350" height="30" class="core"/><text x="970" y="1015" class="cv">최종 선택·실행·검증 책임은 사용자</text></svg>