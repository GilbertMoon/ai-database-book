<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1980" viewBox="0 0 1200 1980" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
  <title id="title">AI 생성 SQL 검토 흐름</title>
  <desc id="desc">AI가 생성한 SQL을 실행 가능한 정답이 아닌 초안으로 보고, 요청 목적과 PostgreSQL 환경, 실제 스키마를 대조한다. SELECT, INSERT, UPDATE, DELETE와 DDL·DCL을 유형별로 검토하고, 실행 전 대상 행과 예상 결과를 기록한다. 조회 SQL은 읽기 전용 환경에서, 변경 SQL은 명시적 트랜잭션에서 한 문장씩 실행해 결과를 검증한 뒤 채택하거나 롤백하는 흐름을 설명한다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c2413b"/></marker>
    <style>
      text{font-family:Malgun Gothic,NanumSquare,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}
      .title{font-size:30px;font-weight:700;text-anchor:middle}
      .subtitle{font-size:16px;text-anchor:middle;fill:#475569}
      .section-title{font-size:19px;font-weight:700}
      .section-sub{font-size:14px;fill:#475569}
      .card-title{font-size:15px;font-weight:700;text-anchor:middle}
      .card-text{font-size:13px;text-anchor:middle;fill:#475569}
      .card-text-small{font-size:12px;text-anchor:middle;fill:#475569}
      .sql{font-family:Consolas,D2Coding,Noto Sans Mono CJK KR,Menlo,monospace;font-size:14px;font-weight:700;text-anchor:middle;fill:#243b53}
      .sql-small{font-family:Consolas,D2Coding,Noto Sans Mono CJK KR,Menlo,monospace;font-size:12.2px;text-anchor:middle;fill:#334155}
      .badge{font-size:12px;font-weight:700;text-anchor:middle;dominant-baseline:middle;fill:#ffffff}
      .flow{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .retry{stroke:#c2413b;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow-red)}
      .decision{font-size:14px;font-weight:700;text-anchor:middle}
      .ok{font-size:13px;font-weight:700;text-anchor:middle;fill:#166534}
      .no{font-size:13px;font-weight:700;text-anchor:middle;fill:#b42318}
      .note-title{font-size:14px;font-weight:700;text-anchor:middle;fill:#92400e}
      .note-text{font-size:12.4px;text-anchor:middle;fill:#475569}
      .principle-label{font-size:16px;font-weight:700;text-anchor:middle;fill:#166534}
      .principle-main{font-size:16.5px;font-weight:700;text-anchor:middle;fill:#166534}
    </style>
  </defs>

  <rect width="1200" height="1980" fill="#ffffff"/>
  <text x="600" y="42" class="title">AI 생성 SQL 검토 흐름</text>
  <text x="600" y="72" class="subtitle">AI가 만든 SQL은 초안이다. 의미·환경·영향 범위·실행 결과를 사람이 확인한 뒤에만 채택한다</text>

  <rect x="34" y="98" width="1132" height="320" rx="16" fill="#eef5ff" stroke="#6fa2e8" stroke-width="1.6"/>
  <text x="58" y="132" class="section-title">1. 요청·AI 답변·현재 환경을 나란히 대조</text>
  <text x="430" y="132" class="section-sub">문법이 맞아 보여도 실제 스키마와 업무 의도에 맞는지는 별도로 확인한다</text>

  <rect x="58" y="160" width="330" height="112" rx="11" fill="#ffffff" stroke="#3b82c4" stroke-width="1.5"/>
  <circle cx="88" cy="188" r="15" fill="#2f6fad"/><text x="88" y="188" class="badge">1</text>
  <text x="223" y="191" class="card-title">원래 요청과 성공 기준</text>
  <text x="223" y="222" class="card-text">무엇을 조회·추가·수정·삭제하는가?</text>
  <text x="223" y="246" class="card-text">대상 건수와 기대 결과는 무엇인가?</text>
  <text x="223" y="264" class="card-text-small">예: 학생 1명의 grade만 3 → 4</text>

  <rect x="435" y="160" width="330" height="112" rx="11" fill="#ffffff" stroke="#7c5cc4" stroke-width="1.5"/>
  <circle cx="465" cy="188" r="15" fill="#7c5cc4"/><text x="465" y="188" class="badge">2</text>
  <text x="600" y="191" class="card-title">AI가 생성한 전체 답변</text>
  <text x="600" y="222" class="card-text">코드 블록을 처음부터 끝까지 읽기</text>
  <text x="600" y="246" class="card-text">여러 문장·주석·추가 명령을 분리</text>
  <text x="600" y="264" class="card-text-small">…·가짜 컬럼·플레이스홀더는 실행 SQL이 아님</text>

  <rect x="812" y="160" width="330" height="112" rx="11" fill="#ffffff" stroke="#3c9a5f" stroke-width="1.5"/>
  <circle cx="842" cy="188" r="15" fill="#2f855a"/><text x="842" y="188" class="badge">3</text>
  <text x="977" y="191" class="card-title">현재 PostgreSQL 환경</text>
  <text x="977" y="218" class="sql-small">SELECT current_database(),</text>
  <text x="977" y="241" class="sql-small">current_schema(), current_user;</text>
  <text x="977" y="264" class="card-text-small">DB·스키마·권한·테이블 구조 대조</text>

  <rect x="82" y="302" width="1036" height="84" rx="11" fill="#fff5f5" stroke="#d9534f" stroke-width="1.5"/>
  <text x="600" y="329" class="card-title">요청하지 않은 문장이나 외부 효과가 있으면 실행 전 중단</text>
  <text x="600" y="354" class="card-text">DROP · TRUNCATE · ALTER · GRANT/REVOKE · 확장 설치 · 파일·네트워크 접근 함수 · 여러 문장 일괄 실행</text>
  <text x="600" y="376" class="card-text-small">위험 문장을 임의로 지우기보다 왜 포함되었는지 목적과 필요성부터 다시 확인한다</text>

  <rect x="34" y="450" width="1132" height="386" rx="16" fill="#f8fafc" stroke="#a8b3c4" stroke-width="1.6"/>
  <text x="58" y="484" class="section-title">2. SQL 유형에 따라 위험과 검토 항목을 구분</text>
  <text x="430" y="484" class="section-sub">SELECT도 함수 호출·잠금·과도한 조회로 부하나 부작용이 생길 수 있다</text>

  <rect x="54" y="514" width="260" height="236" rx="12" fill="#ffffff" stroke="#3b82c4" stroke-width="1.5"/>
  <circle cx="84" cy="542" r="16" fill="#2f6fad"/><text x="84" y="542" class="badge">R</text>
  <text x="184" y="546" class="card-title">SELECT · 읽기</text>
  <text x="184" y="580" class="card-text">테이블·컬럼·JOIN·WHERE 확인</text>
  <text x="184" y="605" class="card-text">민감정보와 반환량 최소화</text>
  <text x="184" y="630" class="card-text">함수 호출·FOR UPDATE·LOCK 점검</text>
  <text x="184" y="664" class="sql-small">EXPLAIN SELECT ...</text>
  <text x="184" y="692" class="card-text-small">LIMIT은 반환량만 제한하며</text>
  <text x="184" y="714" class="card-text-small">전체 비용 감소를 보장하지 않음</text>
  <text x="184" y="736" class="card-text-small">가능하면 읽기 전용 연결 사용</text>

  <rect x="330" y="514" width="260" height="236" rx="12" fill="#ffffff" stroke="#3c9a5f" stroke-width="1.5"/>
  <circle cx="360" cy="542" r="16" fill="#2f855a"/><text x="360" y="542" class="badge">C</text>
  <text x="460" y="546" class="card-title">INSERT · 추가</text>
  <text x="460" y="580" class="card-text">컬럼과 VALUES 순서·개수</text>
  <text x="460" y="605" class="card-text">타입·NOT NULL·UNIQUE·FK</text>
  <text x="460" y="630" class="card-text">중복 입력과 자동값 확인</text>
  <text x="460" y="664" class="sql-small">INSERT ... RETURNING ...</text>
  <text x="460" y="692" class="card-text-small">예상 추가 건수와 생성된 id를</text>
  <text x="460" y="714" class="card-text-small">실행 결과로 다시 확인</text>
  <text x="460" y="736" class="card-text-small">재실행 시 중복 여부도 검토</text>

  <rect x="606" y="514" width="260" height="236" rx="12" fill="#ffffff" stroke="#d69e2e" stroke-width="1.5"/>
  <circle cx="636" cy="542" r="16" fill="#b7791f"/><text x="636" y="542" class="badge">U</text>
  <text x="736" y="546" class="card-title">UPDATE · 수정</text>
  <text x="736" y="580" class="card-text">SET 값과 WHERE 존재 확인</text>
  <text x="736" y="605" class="card-text">같은 조건으로 먼저 SELECT</text>
  <text x="736" y="630" class="card-text">PK·UNIQUE로 대상 고정</text>
  <text x="736" y="664" class="sql-small">UPDATE ... RETURNING ...</text>
  <text x="736" y="692" class="card-text-small">변경 전후 값과 유지할 컬럼을</text>
  <text x="736" y="714" class="card-text-small">명확히 설명하지 못하면 중단</text>
  <text x="736" y="736" class="card-text-small">트랜잭션·복구 기준 준비</text>

  <rect x="882" y="514" width="260" height="236" rx="12" fill="#ffffff" stroke="#d9534f" stroke-width="1.5"/>
  <circle cx="912" cy="542" r="16" fill="#c2413b"/><text x="912" y="542" class="badge">D</text>
  <text x="1012" y="546" class="card-title">DELETE · 삭제</text>
  <text x="1012" y="580" class="card-text">같은 조건으로 먼저 SELECT</text>
  <text x="1012" y="605" class="card-text">FK·CASCADE 영향 확인</text>
  <text x="1012" y="630" class="card-text">소프트 삭제·복구 가능성 검토</text>
  <text x="1012" y="664" class="sql-small">DELETE ... RETURNING ...</text>
  <text x="1012" y="692" class="card-text-small">WHERE 없는 DELETE와 예상하지 않은</text>
  <text x="1012" y="714" class="card-text-small">연쇄 삭제는 즉시 중단</text>
  <text x="1012" y="736" class="card-text-small">반환되지 않는 CASCADE도 별도 확인</text>

  <rect x="92" y="774" width="1016" height="40" rx="9" fill="#fff8e8" stroke="#d69e2e" stroke-width="1.3"/>
  <text x="600" y="799" class="note-title">CREATE·ALTER·DROP·TRUNCATE·권한 변경은 별도 고위험 검토 대상으로 분리한다</text>

  <rect x="34" y="868" width="1132" height="420" rx="16" fill="#fff8e8" stroke="#d69e2e" stroke-width="1.6"/>
  <text x="58" y="902" class="section-title">3. 실행 전에 대상·예상 결과·안전장치를 증거로 확인</text>
  <text x="500" y="902" class="section-sub">몇 행이 어떻게 바뀌는지와 실패 시 중단 기준을 실행 전에 기록한다</text>

  <rect x="58" y="932" width="1084" height="116" rx="11" fill="#ffffff" stroke="#3b82c4" stroke-width="1.5"/>
  <text x="600" y="960" class="card-title">UPDATE·DELETE 대상 미리보기 예시</text>
  <text x="600" y="991" class="sql">SELECT id, name, grade FROM students WHERE grade = 1;</text>
  <text x="600" y="1020" class="sql">SELECT COUNT(*) FROM students WHERE grade = 1;</text>
  <text x="600" y="1042" class="card-text-small">실제 값과 건수를 함께 확인하고, 가능하면 확인한 PK 조건으로 실행 SQL을 다시 좁힌다</text>

  <rect x="58" y="1076" width="330" height="150" rx="11" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="223" y="1106" class="card-title">객체·문법·실행계획</text>
  <text x="223" y="1136" class="card-text">실제 테이블·컬럼·타입 존재</text>
  <text x="223" y="1161" class="card-text">PostgreSQL 문법·따옴표·제약조건</text>
  <text x="223" y="1186" class="card-text">조회는 필요하면 EXPLAIN으로 비용 확인</text>
  <text x="223" y="1210" class="card-text-small">EXPLAIN ANALYZE는 실제 실행함</text>

  <rect x="435" y="1076" width="330" height="150" rx="11" fill="#ffffff" stroke="#7c5cc4" stroke-width="1.5"/>
  <text x="600" y="1106" class="card-title">영향 범위와 중단 기준</text>
  <text x="600" y="1136" class="card-text">예상 행 수·대상 PK·변경 전후 값</text>
  <text x="600" y="1161" class="card-text">유지되어야 할 컬럼·자식 행</text>
  <text x="600" y="1186" class="card-text">0건·초과 건수·오류 발생 시 중단</text>
  <text x="600" y="1210" class="card-text-small">BEGIN·ROLLBACK은 백업을 대신하지 않음</text>

  <rect x="812" y="1076" width="330" height="150" rx="11" fill="#ffffff" stroke="#d9534f" stroke-width="1.5"/>
  <text x="977" y="1106" class="card-title">보안·입력·권한</text>
  <text x="977" y="1136" class="card-text">비밀번호·접속 문자열을 AI에 제공 금지</text>
  <text x="977" y="1161" class="card-text">개인정보와 결과 노출 범위 최소화</text>
  <text x="977" y="1186" class="card-text">앱에서는 문자열 결합 대신 파라미터</text>
  <text x="977" y="1210" class="card-text-small">필요한 최소 권한 계정 사용</text>

  <path d="M600 1288V1312" class="flow"/>
  <polygon points="600,1312 758,1356 600,1400 442,1356" fill="#fff8e8" stroke="#b7791f" stroke-width="1.8"/>
  <text x="600" y="1351" class="decision">문장의 의미와 영향 범위를 스스로 설명할 수 있는가?</text>
  <text x="600" y="1374" class="card-text">대상·건수·변경값·복구 또는 중단 기준까지 확인</text>
  <path d="M758 1356H1168V344H1118" class="retry"/>
  <text x="818" y="1343" class="no">아니오 · 요청 또는 SQL 수정</text>
  <path d="M600 1400V1436" class="flow"/>
  <text x="620" y="1424" class="ok">예</text>

  <rect x="34" y="1436" width="1132" height="270" rx="16" fill="#f5f1ff" stroke="#9b7bd2" stroke-width="1.6"/>
  <text x="58" y="1470" class="section-title">4. SQL 성격에 맞는 안전한 공간에서 한 문장씩 실행</text>
  <text x="505" y="1470" class="section-sub">운영 데이터에서 처음 시도하지 않고 실행 전후 증거를 비교한다</text>

  <rect x="58" y="1500" width="330" height="164" rx="11" fill="#ffffff" stroke="#3b82c4" stroke-width="1.5"/>
  <circle cx="88" cy="1528" r="15" fill="#2f6fad"/><text x="88" y="1528" class="badge">R</text>
  <text x="223" y="1532" class="card-title">조회 SQL</text>
  <text x="223" y="1562" class="card-text">복제·실습 DB 또는 읽기 전용 연결</text>
  <text x="223" y="1587" class="sql-small">BEGIN READ ONLY;</text>
  <text x="223" y="1612" class="card-text">필요한 한 문장만 실행</text>
  <text x="223" y="1637" class="card-text-small">함수·잠금·비용·반환량 확인</text>

  <rect x="435" y="1500" width="330" height="164" rx="11" fill="#ffffff" stroke="#7c5cc4" stroke-width="1.5"/>
  <circle cx="465" cy="1528" r="15" fill="#7c5cc4"/><text x="465" y="1528" class="badge">W</text>
  <text x="600" y="1532" class="card-title">변경 SQL</text>
  <text x="600" y="1562" class="card-text">복제·실습 DB 또는 명시적 트랜잭션</text>
  <text x="600" y="1587" class="sql-small">BEGIN;  -- 자동 커밋 확인</text>
  <text x="600" y="1612" class="card-text">INSERT·UPDATE·DELETE 한 문장 실행</text>
  <text x="600" y="1637" class="card-text-small">가능하면 RETURNING으로 실제 행 확인</text>

  <rect x="812" y="1500" width="330" height="164" rx="11" fill="#ffffff" stroke="#3c9a5f" stroke-width="1.5"/>
  <circle cx="842" cy="1528" r="15" fill="#2f855a"/><text x="842" y="1528" class="badge">V</text>
  <text x="977" y="1532" class="card-title">실제 결과 수집</text>
  <text x="977" y="1562" class="card-text">조회·반환 행과 영향받은 행 수</text>
  <text x="977" y="1587" class="card-text">변경된 값과 유지된 데이터</text>
  <text x="977" y="1612" class="card-text">오류·제약조건·실행 시간</text>
  <text x="977" y="1637" class="card-text-small">경고가 나오면 다음 문장 실행 중단</text>

  <path d="M388 1582H435" class="flow"/>
  <path d="M765 1582H812" class="flow"/>

  <path d="M600 1706V1730" class="flow"/>
  <polygon points="600,1730 752,1772 600,1814 448,1772" fill="#fff8e8" stroke="#b7791f" stroke-width="1.8"/>
  <text x="600" y="1767" class="decision">실제 결과가 기록한 예상과 일치하는가?</text>
  <text x="600" y="1790" class="card-text">행 수·대상 PK·변경값·유지 데이터·오류를 비교</text>

  <rect x="54" y="1832" width="520" height="72" rx="13" fill="#f2fbf5" stroke="#62b47a" stroke-width="1.7"/>
  <text x="314" y="1860" class="card-title">예 · 채택 또는 COMMIT</text>
  <text x="314" y="1886" class="ok">검토 근거와 실제 결과를 남기고 다음 단계로 진행</text>

  <rect x="626" y="1832" width="520" height="72" rx="13" fill="#fff5f5" stroke="#d9534f" stroke-width="1.7"/>
  <text x="886" y="1860" class="card-title">아니오 · 중단 또는 ROLLBACK</text>
  <text x="886" y="1886" class="no">추가 실행을 멈추고 실제 결과를 바탕으로 SQL을 다시 검토</text>

  <path d="M448 1772H314V1832" class="flow"/>
  <path d="M752 1772H886V1832" class="flow"/>
  <text x="397" y="1820" class="ok">예</text>
  <text x="803" y="1820" class="no">아니오</text>
  <path d="M886 1904V1916H24V988H58" class="retry"/>

