<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">안전한 DELETE 실행 절차</title><desc id="desc">삭제 대상 행을 먼저 조회하고 정확한 한 행인지 확인한 뒤 DELETE를 실행하여 영향받은 행 수와 삭제 후 결과를 검증하는 흐름</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}.title{font-size:28px;font-weight:700;text-anchor:middle}.sub{font-size:15px;text-anchor:middle;fill:#475569}.panel{stroke-width:1.5;rx:15}.p1{fill:#eef5ff;stroke:#6fa2e8}.p2{fill:#fff8e8;stroke:#d69e2e}.p3{fill:#f5f1ff;stroke:#9b7bd2}.p4{fill:#f2fbf5;stroke:#8bc9a0}.box{fill:#fff;stroke:#64748b;stroke-width:1.4;rx:10}.head{font-size:18px;font-weight:700}.h{font-size:14px;font-weight:700;text-anchor:middle}.m{font-size:11.5px;text-anchor:middle;fill:#475569}.sql{font-family:Consolas,D2Coding,monospace;font-size:14px;font-weight:700;text-anchor:middle}.arr{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}.decision{fill:#fff8e8;stroke:#b7791f;stroke-width:1.8}.note{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.3;rx:9}.nt{font-size:11.5px;font-weight:700;text-anchor:middle;fill:#92400e}.core{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.5;rx:10}.cv{font-size:14.5px;font-weight:700;text-anchor:middle;fill:#166534}</style></defs><rect width="1200" height="900" fill="#fff"/><text x="600" y="40" class="title">안전한 DELETE 실행 절차</text><text x="600" y="68" class="sub">같은 WHERE 조건으로 삭제 전 대상과 삭제 후 결과를 확인한다</text><rect x="45" y="100" width="1110" height="150" class="panel p1"/><text x="70" y="132" class="head">1. 삭제 대상 정의</text><rect x="100" y="160" width="430" height="58" class="box"/><text x="315" y="185" class="h">대상 테이블</text><text x="315" y="207" class="sql">students</text><rect x="670" y="160" width="430" height="58" class="box"/><text x="885" y="185" class="h">식별 조건</text><text x="885" y="207" class="sql">email = 'hyunwoo@example.com'</text><rect x="250" y="285" width="700" height="78" class="box"/><text x="600" y="312" class="sql">SELECT * FROM students</text><text x="600" y="337" class="sql">WHERE email = 'hyunwoo@example.com';</text><text x="600" y="357" class="m">삭제할 행의 전체 값과 대상 행 수를 먼저 확인</text><path d="M315 218V270H600V285" class="arr"/><path d="M885 218V270H600" class="arr"/><polygon points="600,395 735,435 600,475 465,435" class="decision"/><text x="600" y="431" class="h">정확히 의도한 1행인가?</text><text x="600" y="453" class="m">0행·여러 행·다른 행이면 WHERE 수정</text><path d="M600 363V395" class="arr"/><rect x="45" y="510" width="525" height="190" class="panel p2"/><text x="70" y="542" class="head">2. 실행 전 확인</text><rect x="85" y="570" width="445" height="42" class="box"/><text x="307" y="596" class="h">필요하면 삭제 대상 값과 복구 방법 준비</text><rect x="85" y="625" width="445" height="42" class="box"/><text x="307" y="651" class="h">현재 DB·테이블·참조 관계 확인</text><rect x="630" y="510" width="525" height="190" class="panel p3"/><text x="655" y="542" class="head">3. DELETE 실행</text><rect x="670" y="570" width="445" height="70" class="box"/><text x="892" y="597" class="sql">DELETE FROM students</text><text x="892" y="622" class="sql">WHERE email = 'hyunwoo@example.com';</text><rect x="715" y="652" width="355" height="34" class="box"/><text x="892" y="674" class="h">영향받은 행 수 = 1 확인</text><path d="M735 435H892V510" class="arr"/><path d="M465 435H307V510" class="arr"/><path d="M570 605H630" class="arr"/><rect x="45" y="735" width="1110" height="95" class="panel p4"/><text x="70" y="767" class="head">4. 삭제 후 검증</text><rect x="75" y="785" width="320" height="30" class="box"/><text x="235" y="805" class="m">같은 WHERE 조회 결과 = 0행</text><rect x="440" y="785" width="320" height="30" class="box"/><text x="600" y="805" class="m">전체 행 수가 예상대로 1 감소</text><rect x="805" y="785" width="320" height="30" class="box"/><text x="965" y="805" class="m">다른 학생 행은 그대로 유지</text><path d="M892 700V735" class="arr"/><rect x="70" y="850" width="320" height="30" class="note"/><text x="230" y="870" class="nt">WHERE 없으면 모든 행이 대상</text><rect x="440" y="850" width="320" height="30" class="note"/><text x="600" y="870" class="nt">DELETE는 행만 제거하고 구조는 유지</text><rect x="810" y="850" width="320" height="30" class="note"/><text x="970" y="870" class="nt">영향 행 수와 남은 데이터 확인</text><rect x="130" y="888" width="940" height="8" class="core"/><text x="600" y="897" class="cv">삭제 전 대상 확인 → DELETE → 삭제 후 0행과 남은 데이터 확인</text></svg>