<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">ORDER BY 정렬 흐름</title><desc id="desc">WHERE로 행을 선택한 뒤 grade 기준의 ASC와 DESC 결과를 비교하고 같은 값에는 두 번째 정렬 기준을 추가하는 흐름</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}.t{font-size:28px;font-weight:700;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.p{stroke-width:1.5;rx:15}.src{fill:#f8fafc;stroke:#a8b3c4}.asc{fill:#eef5ff;stroke:#6fa2e8}.desc{fill:#fff8e8;stroke:#d69e2e}.tie{fill:#f5f1ff;stroke:#9b7bd2}.pt{font-size:19px;font-weight:700}.b{fill:#fff;stroke:#64748b;stroke-width:1.4;rx:10}.sql{font-family:Consolas,D2Coding,monospace;font-size:15px;font-weight:700;text-anchor:middle}.h{font-size:14px;font-weight:700;text-anchor:middle}.m{font-size:11.5px;text-anchor:middle;fill:#475569}.arr{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.row{fill:#fff;stroke:#94a3b8;stroke-width:1.2;rx:8}.r1{fill:#dcfce7}.r2{fill:#dbeafe}.r3{fill:#fef3c7}.note{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.3;rx:9}.nt{font-size:11.5px;font-weight:700;text-anchor:middle;fill:#92400e}.core{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.5;rx:10}.cv{font-size:14.5px;font-weight:700;text-anchor:middle;fill:#166534}</style></defs><rect width="1200" height="920" fill="#fff"/><text x="600" y="40" class="t">ORDER BY 정렬 흐름</text><text x="600" y="68" class="s">WHERE는 포함할 행을 정하고 ORDER BY는 그 결과의 표시 순서를 정한다</text><rect x="50" y="100" width="1100" height="170" class="p src"/><text x="75" y="132" class="pt">1. 조회 대상</text><rect x="90" y="155" width="1020" height="70" class="b"/><text x="600" y="181" class="h">students: 김민지 2 · 이준호 3 · 박서연 1 · 최현우 4 · 정하늘 2</text><text x="600" y="207" class="m">WHERE가 있으면 조건에 맞는 행만 먼저 남긴 뒤 정렬</text><rect x="380" y="295" width="440" height="65" class="b"/><text x="600" y="322" class="sql">ORDER BY grade</text><text x="600" y="345" class="m">정렬 컬럼과 방향을 지정</text><path d="M600 270V295" class="arr"/><rect x="50" y="395" width="520" height="300" class="p asc"/><text x="75" y="427" class="pt">2A. ASC · 작은 값부터</text><rect x="100" y="455" width="420" height="50" class="b"/><text x="310" y="486" class="sql">ORDER BY grade ASC</text><rect x="115" y="530" width="390" height="32" class="row r1"/><text x="310" y="551" class="h">1 · 박서연</text><rect x="115" y="570" width="390" height="32" class="row r2"/><text x="310" y="591" class="h">2 · 김민지</text><rect x="115" y="610" width="390" height="32" class="row r2"/><text x="310" y="631" class="h">2 · 정하늘</text><rect x="115" y="650" width="185" height="32" class="row r3"/><text x="207" y="671" class="h">3 · 이준호</text><rect x="320" y="650" width="185" height="32" class="row r1"/><text x="412" y="671" class="h">4 · 최현우</text><rect x="630" y="395" width="520" height="300" class="p desc"/><text x="655" y="427" class="pt">2B. DESC · 큰 값부터</text><rect x="680" y="455" width="420" height="50" class="b"/><text x="890" y="486" class="sql">ORDER BY grade DESC</text><rect x="695" y="530" width="390" height="32" class="row r1"/><text x="890" y="551" class="h">4 · 최현우</text><rect x="695" y="570" width="390" height="32" class="row r3"/><text x="890" y="591" class="h">3 · 이준호</text><rect x="695" y="610" width="390" height="32" class="row r2"/><text x="890" y="631" class="h">2 · 김민지</text><rect x="695" y="650" width="185" height="32" class="row r2"/><text x="787" y="671" class="h">2 · 정하늘</text><rect x="900" y="650" width="185" height="32" class="row r1"/><text x="992" y="671" class="h">1 · 박서연</text><path d="M560 360V378H310V455" class="arr"/><path d="M640 360V378H890V455" class="arr"/><rect x="50" y="730" width="1100" height="100" class="p tie"/><text x="75" y="762" class="pt">3. 같은 grade 값의 순서까지 정하기</text><rect x="90" y="785" width="430" height="32" class="b"/><text x="305" y="806" class="sql">ORDER BY grade ASC</text><rect x="555" y="785" width="555" height="32" class="b"/><text x="832" y="806" class="sql">ORDER BY grade ASC, id ASC</text><text x="305" y="842" class="m">grade가 같은 행의 상대 순서는 보장되지 않음</text><text x="832" y="842" class="m">첫 기준이 같으면 id를 두 번째 기준으로 사용</text><rect x="55" y="855" width="260" height="36" class="note"/><text x="185" y="878" class="nt">ASC는 기본값이지만 명시 권장</text><rect x="330" y="855" width="260" height="36" class="note"/><text x="460" y="878" class="nt">ORDER BY name으로 문자열 정렬 가능</text><rect x="605" y="855" width="260" height="36" class="note"/><text x="735" y="878" class="nt">정렬은 저장된 행 자체를 바꾸지 않음</text><rect x="880" y="855" width="265" height="36" class="note"/><text x="1012" y="878" class="nt">ORDER BY 없이는 행 순서 미보장</text><rect x="130" y="898" width="940" height="18" class="core"/><text x="600" y="911" class="cv">필요한 결과 순서를 보장하려면 정렬 방향과 동률 처리 기준까지 명시한다</text></svg>