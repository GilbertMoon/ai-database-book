<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc"><title id="title">안전한 UPDATE 실행 절차</title><desc id="desc">students 테이블에서 고유한 이메일 조건으로 수정 대상 한 행을 먼저 조회하고 SET과 WHERE를 검토한 뒤 UPDATE를 실행하여 영향받은 행 수와 변경 전후 값을 다시 확인하는 절차</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}.t{font-size:28px;font-weight:700;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.panel{stroke-width:1.5;rx:15}.plan{fill:#eef5ff;stroke:#6fa2e8}.check{fill:#fff8e8;stroke:#d69e2e}.run{fill:#f5f1ff;stroke:#9b7bd2}.done{fill:#f2fbf5;stroke:#8bc9a0}.pt{font-size:19px;font-weight:700}.box{fill:#fff;stroke-width:1.4;rx:10}.blue{stroke:#3b82c4}.orange{stroke:#d69e2e}.green{stroke:#3c9a5f}.red{stroke:#d9534f}.purple{stroke:#7c5cc4}.h{font-size:14px;font-weight:700;text-anchor:middle}.m{font-size:11.4px;text-anchor:middle;fill:#475569}.sql{font-family:Consolas,D2Coding,monospace;font-size:14px;font-weight:700;text-anchor:middle;fill:#334155}.arr{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.back{stroke:#d9534f;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#a)}.decision{fill:#fff8e8;stroke:#b7791f;stroke-width:1.8}.dt{font-size:14px;font-weight:700;text-anchor:middle}.table{fill:#fff;stroke:#64748b;stroke-width:1.3;rx:8}.thead{fill:#e8eef7}.th{font-size:11.4px;font-weight:700;text-anchor:middle}.td{font-size:10.9px;text-anchor:middle;fill:#334155}.note{fill:#fff8e8;stroke:#d69e2e;stroke-width:1.4;rx:10}.nt{font-size:11.7px;font-weight:700;text-anchor:middle;fill:#92400e}.core{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.6;rx:10}.cv{font-size:15px;font-weight:700;text-anchor:middle;fill:#166534}</style></defs><rect width="1200" height="1020" fill="#fff"/><text x="600" y="40" class="t">안전한 UPDATE 실행 절차</text><text x="600" y="68" class="s">같은 WHERE 조건으로 수정 전 대상과 수정 후 결과를 확인하고 영향받은 행 수까지 검증한다</text><rect x="35" y="100" width="1130" height="190" class="panel plan"/><text x="60" y="132" class="pt">1. 수정 목표를 SQL 구성요소로 분리</text><rect x="65" y="165" width="320" height="80" class="box blue"/><text x="225" y="192" class="h">대상 테이블</text><text x="225" y="220" class="sql">students</text><rect x="440" y="165" width="320" height="80" class="box purple"/><text x="600" y="192" class="h">변경 내용 · SET</text><text x="600" y="220" class="sql">grade = 4</text><rect x="815" y="165" width="320" height="80" class="box orange"/><text x="975" y="192" class="h">대상 조건 · WHERE</text><text x="975" y="220" class="sql">email = 'junho@example.com'</text><rect x="250" y="320" width="700" height="78" class="box green"/><text x="600" y="347" class="sql">SELECT * FROM students</text><text x="600" y="371" class="sql">WHERE email = 'junho@example.com';</text><text x="600" y="392" class="m">UPDATE 전에 현재 값과 대상 행 수를 먼저 확인</text><path d="M225 245V300H600V320" class="arr"/><path d="M600 245V320" class="arr"/><path d="M975 245V300H600" class="arr"/><polygon points="600,430 735,470 600,510 465,470" class="decision"/><text x="600" y="466" class="dt">정확히 의도한 1행인가?</text><text x="600" y="488" class="m">0행·여러 행·다른 행이면 WHERE를 수정</text><path d="M600 398V430" class="arr"/><rect x="35" y="545" width="545" height="250" class="panel run"/><text x="60" y="577" class="pt">2. UPDATE 실행</text><rect x="75" y="610" width="465" height="110" class="box purple"/><text x="307" y="638" class="sql">UPDATE students</text><text x="307" y="664" class="sql">SET grade = 4</text><text x="307" y="690" class="sql">WHERE email = 'junho@example.com';</text><text x="307" y="713" class="m">SET과 WHERE를 최종 확인한 뒤 실행</text><rect x="120" y="742" width="375" height="38" class="box green"/><text x="307" y="766" class="h">영향받은 행 수 = 1인지 확인</text><rect x="620" y="545" width="545" height="250" class="panel done"/><text x="645" y="577" class="pt">3. 같은 WHERE로 결과 확인</text><rect x="660" y="610" width="465" height="70" class="box green"/><text x="892" y="638" class="sql">SELECT * FROM students</text><text x="892" y="663" class="sql">WHERE email = 'junho@example.com';</text><rect x="690" y="705" width="405" height="60" class="table"/><rect x="690" y="705" width="405" height="26" class="thead"/><line x1="800" y1="705" x2="800" y2="765" stroke="#cbd5e1"/><line x1="990" y1="705" x2="990" y2="765" stroke="#cbd5e1"/><line x1="690" y1="731" x2="1095" y2="731" stroke="#cbd5e1"/><text x="745" y="723" class="th">name</text><text x="895" y="723" class="th">email</text><text x="1042" y="723" class="th">grade</text><text x="745" y="752" class="td">이준호</text><text x="895" y="752" class="td">junho@example.com</text><text x="1042" y="752" class="td">4</text><text x="892" y="786" class="m">grade만 3 → 4로 바뀌고 다른 값은 유지되었는지 확인</text><path d="M735 470H307V545" class="arr"/><path d="M580 670H620" class="arr"/><path d="M465 470H20V359H250" class="back"/><rect x="35" y="825" width="1130" height="100" class="panel check"/><text x="60" y="857" class="pt">문제가 있을 때</text><rect x="65" y="875" width="325" height="32" class="box red"/><text x="227" y="896" class="m">0행 → 조건값·현재 DB·기존 데이터 확인</text><rect x="437" y="875" width="325" height="32" class="box red"/><text x="599" y="896" class="m">여러 행 → id·UNIQUE email 등 식별자 사용</text><rect x="810" y="875" width="325" height="32" class="box red"/><text x="972" y="896" class="m">결과 불일치 → 추가 수정 전 원인·복구값 확인</text><rect x="55" y="945" width="350" height="48" class="note"/><text x="230" y="967" class="nt">WHERE 없는 UPDATE</text><text x="230" y="986" class="m">모든 행이 변경 대상이 되므로 실행 전 중단</text><rect x="425" y="945" width="350" height="48" class="note"/><text x="600" y="967" class="nt">식별 조건</text><text x="600" y="986" class="m">중복 가능한 이름보다 id 또는 UNIQUE email 권장</text><rect x="795" y="945" width="350" height="48" class="note"/><text x="970" y="967" class="nt">검증 기준</text><text x="970" y="986" class="m">성공 메시지·영향 행 수·변경 전후 값을 함께 확인</text><rect x="120" y="1000" width="960" height="16" class="core"/><text x="600" y="1012" class="cv">같은 WHERE로 실행 전 대상 확인 → UPDATE → 실행 후 결과 확인</text></svg>