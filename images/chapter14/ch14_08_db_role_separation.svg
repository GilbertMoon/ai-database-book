<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="100%" height="760" viewBox="0 0 1200 760">
  <title id="title">RAG 저장소 역할 분리</title>
  <desc id="desc">업무 데이터, 문서 원문, 벡터 인덱스, 검색 로그는 역할이 다릅니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <style>text{font-family:'Pretendard','Noto Sans KR','Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',Arial,sans-serif;fill:#111827}.t{font-size:30px;font-weight:800;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.card{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:16}.b{fill:#eff6ff;stroke:#3b82f6}.g{fill:#f0fdf4;stroke:#22c55e}.y{fill:#fffbeb;stroke:#f59e0b}.p{fill:#faf5ff;stroke:#8b5cf6}.c{fill:#ecfeff;stroke:#06b6d4}.r{fill:#fff1f2;stroke:#f43f5e}.h{font-size:19px;font-weight:700;text-anchor:middle}.m{font-size:14px;text-anchor:middle;fill:#334155}.code{font-family:Consolas,'Pretendard','Noto Sans KR','Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',Arial,sans-serif;font-size:14px;text-anchor:middle;fill:#1d4ed8;font-weight:700}.line{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}.soft{stroke:#94a3b8;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="50" class="t">RAG 저장소 역할 분리</text>
  <text x="600" y="78" class="s">업무 데이터, 문서 원문, 벡터 인덱스, 검색 로그는 역할이 다릅니다.</text>
  <rect x="70" y="150" width="230" height="130" class="card b"/>
  <text x="185" y="184" class="h">업무 RDBMS</text>
  <text x="185" y="215" class="m">사용자 · 권한</text>
  <text x="185" y="237" class="m">구조화 데이터</text>
  <rect x="355" y="150" width="230" height="130" class="card g"/>
  <text x="470" y="184" class="h">문서 저장소</text>
  <text x="470" y="215" class="m">원문 · 버전</text>
  <text x="470" y="237" class="m">출처 · 작성자</text>
  <rect x="640" y="150" width="230" height="130" class="card p"/>
  <text x="755" y="184" class="h">벡터 인덱스</text>
  <text x="755" y="215" class="m">chunk_id · embedding</text>
  <text x="755" y="237" class="m">거리 정렬 · Top-k</text>
  <rect x="925" y="150" width="230" height="130" class="card y"/>
  <text x="1040" y="184" class="h">검색 로그</text>
  <text x="1040" y="215" class="m">질문 · 거리 · 순위</text>
  <text x="1040" y="237" class="m">답변 검토</text>
  <line x1="300" y1="215" x2="355" y2="215" class="line"/>
  <line x1="585" y1="215" x2="640" y2="215" class="line"/>
  <line x1="870" y1="215" x2="925" y2="215" class="line"/>
  <rect x="350" y="430" width="500" height="120" class="card c"/>
  <text x="600" y="464" class="h">RAG 서비스</text>
  <text x="600" y="495" class="m">권한 필터 후 검색</text>
  <text x="600" y="517" class="m">답변과 출처 제공</text>
  <line x1="185" y1="280" x2="430" y2="430" class="line"/>
  <line x1="470" y1="280" x2="520" y2="430" class="line"/>
  <line x1="755" y1="280" x2="680" y2="430" class="line"/>
  <line x1="1040" y1="280" x2="770" y2="430" class="line"/>
  <rect x="250" y="640" width="700" height="70" class="card y"/>
  <text x="600" y="674" class="h">벡터 인덱스는 원문에서 재생성 가능한 파생 데이터입니다.</text>
</svg>
