<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="100%" height="760" viewBox="0 0 1200 760">
  <title id="title">L2 거리·Top-k·임계값으로 근거 후보 선택</title>
  <desc id="desc">가까운 후보와 충분히 관련 있는 문서를 구분합니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <style>text{font-family:'Pretendard','Noto Sans KR','Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',Arial,sans-serif;fill:#111827}.t{font-size:30px;font-weight:800;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.card{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:16}.b{fill:#eff6ff;stroke:#3b82f6}.g{fill:#f0fdf4;stroke:#22c55e}.y{fill:#fffbeb;stroke:#f59e0b}.p{fill:#faf5ff;stroke:#8b5cf6}.c{fill:#ecfeff;stroke:#06b6d4}.r{fill:#fff1f2;stroke:#f43f5e}.h{font-size:19px;font-weight:700;text-anchor:middle}.m{font-size:14px;text-anchor:middle;fill:#334155}.code{font-family:Consolas,'Pretendard','Noto Sans KR','Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',Arial,sans-serif;font-size:14px;text-anchor:middle;fill:#1d4ed8;font-weight:700}.line{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}.soft{stroke:#94a3b8;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="50" class="t">L2 거리·Top-k·임계값으로 근거 후보 선택</text>
  <text x="600" y="78" class="s">가까운 후보와 충분히 관련 있는 문서를 구분합니다.</text>
  <rect x="60" y="160" width="200" height="110" class="card b"/>
  <text x="160" y="194" class="h">질문 벡터</text>
  <text x="160" y="225" class="m">[0.88,0.12,0.22]</text>
  <rect x="330" y="145" width="230" height="140" class="card g"/>
  <text x="445" y="179" class="h">L2 거리 계산</text>
  <text x="445" y="210" class="m">&lt;-&gt; 또는 SQRT</text>
  <text x="445" y="232" class="m">작을수록 가까움</text>
  <rect x="630" y="145" width="220" height="140" class="card y"/>
  <text x="740" y="179" class="h">Top-k</text>
  <text x="740" y="210" class="m">가까운 k개</text>
  <text x="740" y="232" class="m">예: k = 3</text>
  <rect x="920" y="145" width="220" height="140" class="card p"/>
  <text x="1030" y="179" class="h">임계값 검토</text>
  <text x="1030" y="210" class="m">관련성 부족</text>
  <text x="1030" y="232" class="m">후보 제외 가능</text>
  <line x1="260" y1="215" x2="330" y2="215" class="line"/>
  <line x1="560" y1="215" x2="630" y2="215" class="line"/>
  <line x1="850" y1="215" x2="920" y2="215" class="line"/>
  <rect x="100" y="410" width="230" height="130" class="card c"/>
  <text x="215" y="444" class="h">1위 환불 기준</text>
  <text x="215" y="475" class="m">거리 가장 작음</text>
  <rect x="485" y="410" width="230" height="130" class="card c"/>
  <text x="600" y="444" class="h">2위 구독 취소</text>
  <text x="600" y="475" class="m">보조 근거</text>
  <rect x="870" y="410" width="230" height="130" class="card r"/>
  <text x="985" y="444" class="h">3위 이용권 변경</text>
  <text x="985" y="475" class="m">Top-k지만 관련성 확인 필요</text>
  <line x1="745" y1="285" x2="600" y2="410" class="soft"/>
  <rect x="300" y="620" width="600" height="80" class="card y"/>
  <text x="600" y="654" class="h">Top-k는 상대 순위이며 정답 보장이 아닙니다.</text>
  <text x="600" y="685" class="m">평가 데이터로 임계값과 품질을 따로 검증합니다.</text>
</svg>
