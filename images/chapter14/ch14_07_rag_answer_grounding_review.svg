<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="100%" height="760" viewBox="0 0 1200 760">
  <title id="title">검색 적합성과 답변 근거성 분리 검토</title>
  <desc id="desc">검색이 맞아도 답변이 문서 밖 주장을 만들 수 있습니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <style>text{font-family:'Pretendard','Noto Sans KR','Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',Arial,sans-serif;fill:#111827}.t{font-size:30px;font-weight:800;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.card{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:16}.b{fill:#eff6ff;stroke:#3b82f6}.g{fill:#f0fdf4;stroke:#22c55e}.y{fill:#fffbeb;stroke:#f59e0b}.p{fill:#faf5ff;stroke:#8b5cf6}.c{fill:#ecfeff;stroke:#06b6d4}.r{fill:#fff1f2;stroke:#f43f5e}.h{font-size:19px;font-weight:700;text-anchor:middle}.m{font-size:14px;text-anchor:middle;fill:#334155}.code{font-family:Consolas,'Pretendard','Noto Sans KR','Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',Arial,sans-serif;font-size:14px;text-anchor:middle;fill:#1d4ed8;font-weight:700}.line{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}.soft{stroke:#94a3b8;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="50" class="t">검색 적합성과 답변 근거성 분리 검토</text>
  <text x="600" y="78" class="s">검색이 맞아도 답변이 문서 밖 주장을 만들 수 있습니다.</text>
  <rect x="75" y="150" width="260" height="130" class="card b"/>
  <text x="205" y="184" class="h">검색 적합성</text>
  <text x="205" y="215" class="m">질문과 검색 문서가 맞는가?</text>
  <rect x="470" y="150" width="260" height="130" class="card g"/>
  <text x="600" y="184" class="h">답변 근거성</text>
  <text x="600" y="215" class="m">답변 주장이 문서에 있는가?</text>
  <rect x="865" y="150" width="260" height="130" class="card r"/>
  <text x="995" y="184" class="h">unsupported claim</text>
  <text x="995" y="215" class="m">문서 밖 주장이 있는가?</text>
  <line x1="335" y1="215" x2="470" y2="215" class="line"/>
  <line x1="730" y1="215" x2="865" y2="215" class="line"/>
  <rect x="110" y="420" width="250" height="120" class="card c"/>
  <text x="235" y="454" class="h">정상 답변</text>
  <text x="235" y="485" class="m">TRUE · TRUE · FALSE</text>
  <rect x="475" y="420" width="250" height="120" class="card y"/>
  <text x="600" y="454" class="h">근거 없는 주장</text>
  <text x="600" y="485" class="m">TRUE · FALSE · TRUE</text>
  <rect x="840" y="420" width="250" height="120" class="card p"/>
  <text x="965" y="454" class="h">부적합 검색</text>
  <text x="965" y="485" class="m">FALSE · TRUE · FALSE</text>
  <rect x="310" y="630" width="580" height="70" class="card r"/>
  <text x="600" y="664" class="h">근거가 부족하면 답변을 보류하거나 검색 조건을 조정합니다.</text>
</svg>
