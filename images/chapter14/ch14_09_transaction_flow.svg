<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="90" y="105" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#1f2a44">Transaction — 여러 SQL을 하나의 작업 단위로 묶기</text>
<text x="90" y="165" font-family="Arial, sans-serif" font-size="30" fill="#5b6475">성공하면 COMMIT, 중간에 문제가 생기면 ROLLBACK</text>
<rect x="90" y="290" rx="26" ry="26" width="250" height="120" fill="#e8eefc" stroke="#4169b2" stroke-width="3"/>
<text x="215" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#31569b">BEGIN</text>
<line x1="340" y1="350" x2="470" y2="350" stroke="#7d8798" stroke-width="8"/><polygon points="470,350 440,330 440,370" fill="#7d8798"/>
<rect x="470" y="265" rx="26" ry="26" width="330" height="170" fill="#e9f7ef" stroke="#3f8a5d" stroke-width="3"/>
<text x="635" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#32744e">SQL 1</text>
<text x="635" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#44505f">enrollments INSERT</text>
<line x1="800" y1="350" x2="930" y2="350" stroke="#7d8798" stroke-width="8"/><polygon points="930,350 900,330 900,370" fill="#7d8798"/>
<rect x="930" y="265" rx="26" ry="26" width="330" height="170" fill="#fff1e3" stroke="#d48745" stroke-width="3"/>
<text x="1095" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#a9642c">SQL 2</text>
<text x="1095" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#44505f">event INSERT</text>
<line x1="1260" y1="350" x2="1390" y2="350" stroke="#7d8798" stroke-width="8"/><polygon points="1390,350 1360,330 1360,370" fill="#7d8798"/>
<rect x="1280" y="520" rx="26" ry="26" width="250" height="120" fill="#e6f6ea" stroke="#3f8a5d" stroke-width="3"/>
<text x="1405" y="592" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#32744e">COMMIT</text>
<rect x="930" y="650" rx="26" ry="26" width="300" height="120" fill="#fde8ea" stroke="#c4535c" stroke-width="3"/>
<text x="1080" y="722" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#a63b45">ROLLBACK</text>
<path d="M1405 435 L1405 520" stroke="#3f8a5d" stroke-width="8"/><polygon points="1405,520 1385,490 1425,490" fill="#3f8a5d"/>
<path d="M1095 435 C1095 520 1080 560 1080 650" fill="none" stroke="#c4535c" stroke-width="8" stroke-dasharray="16 12"/><polygon points="1080,650 1060,620 1100,620" fill="#c4535c"/>
<text x="1290" y="490" font-family="Arial, sans-serif" font-size="27" fill="#32744e">모두 성공</text>
<text x="880" y="585" font-family="Arial, sans-serif" font-size="27" fill="#a63b45">하나라도 실패</text>
<rect x="90" y="655" rx="22" ry="22" width="650" height="130" fill="#ffffff" stroke="#cdd4df" stroke-width="2"/>
<text x="125" y="708" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#1f2a44">핵심</text>
<text x="125" y="753" font-family="Arial, sans-serif" font-size="27" fill="#4c5668">“부분 성공”이 아니라 “전체 성공 또는 전체 취소”</text>
</svg>