<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="100%" height="760" viewBox="0 0 1200 760">
  <title id="title">구조화·키워드 검색과 벡터 의미 검색</title>
  <desc id="desc">SQL 언어가 아니라 검색 기준과 방식의 차이를 비교합니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <style>text{font-family:'Pretendard','Noto Sans KR','Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',Arial,sans-serif;fill:#111827}.t{font-size:30px;font-weight:800;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.card{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:16}.b{fill:#eff6ff;stroke:#3b82f6}.g{fill:#f0fdf4;stroke:#22c55e}.y{fill:#fffbeb;stroke:#f59e0b}.p{fill:#faf5ff;stroke:#8b5cf6}.c{fill:#ecfeff;stroke:#06b6d4}.r{fill:#fff1f2;stroke:#f43f5e}.h{font-size:19px;font-weight:700;text-anchor:middle}.m{font-size:14px;text-anchor:middle;fill:#334155}.code{font-family:Consolas,'Pretendard','Noto Sans KR','Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',Arial,sans-serif;font-size:14px;text-anchor:middle;fill:#1d4ed8;font-weight:700}.line{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}.soft{stroke:#94a3b8;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="50" class="t">구조화·키워드 검색과 벡터 의미 검색</text>
  <text x="600" y="78" class="s">SQL 언어가 아니라 검색 기준과 방식의 차이를 비교합니다.</text>
  <rect x="55" y="150" width="240" height="140" class="card b"/>
  <text x="175" y="184" class="h">구조화 조건 검색</text>
  <text x="175" y="215" class="m">컬럼 값 · 범위</text>
  <text x="175" y="237" class="m">권한 · 최신성 필터</text>
  <rect x="350" y="150" width="220" height="140" class="card y"/>
  <text x="460" y="184" class="h">키워드 검색</text>
  <text x="460" y="215" class="m">문자열 포함</text>
  <text x="460" y="237" class="m">title LIKE 환불</text>
  <rect x="630" y="150" width="240" height="140" class="card g"/>
  <text x="750" y="184" class="h">벡터 의미 검색</text>
  <text x="750" y="215" class="m">임베딩 거리</text>
  <text x="750" y="237" class="m">의미가 가까운 Top-k</text>
  <rect x="925" y="150" width="220" height="140" class="card p"/>
  <text x="1035" y="184" class="h">혼합 검색</text>
  <text x="1035" y="215" class="m">필터 후 의미 순위</text>
  <text x="1035" y="237" class="m">공개 문서 Top-3</text>
  <line x1="295" y1="220" x2="350" y2="220" class="line"/>
  <line x1="570" y1="220" x2="630" y2="220" class="line"/>
  <line x1="870" y1="220" x2="925" y2="220" class="line"/>
  <rect x="320" y="430" width="560" height="110" class="card c"/>
  <text x="600" y="464" class="h">핵심</text>
  <text x="600" y="495" class="m">벡터 검색도 PostgreSQL에서는 SQL로 실행할 수 있습니다.</text>
  <text x="600" y="517" class="m">검색 방식은 서로 대체보다 보완 관계입니다.</text>
</svg>
