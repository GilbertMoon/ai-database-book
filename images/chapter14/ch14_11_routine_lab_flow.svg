<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="90" y="105" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#1f2a44">통합 실습 흐름 — 수강신청을 안전하게 처리하기</text>
<text x="90" y="165" font-family="Arial, sans-serif" font-size="30" fill="#5b6475">Transaction → Procedure → Function → INSERT → 검증을 한 번에 연결합니다.</text>

<rect x="80" y="315" rx="24" width="220" height="120" fill="#ffffff" stroke="#8a94a6" stroke-width="3"/>
<text x="190" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#1f2a44">학생 요청</text>
<text x="190" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#5b6475">course 301 신청</text>

<line x1="300" y1="375" x2="410" y2="375" stroke="#7d8798" stroke-width="8"/><polygon points="410,375 380,355 380,395" fill="#7d8798"/>
<rect x="410" y="290" rx="24" width="230" height="170" fill="#e8eefc" stroke="#4169b2" stroke-width="3"/>
<text x="525" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#31569b">BEGIN</text>
<text x="525" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#5b6475">Transaction</text>

<line x1="640" y1="375" x2="750" y2="375" stroke="#7d8798" stroke-width="8"/><polygon points="750,375 720,355 720,395" fill="#7d8798"/>
<rect x="750" y="265" rx="24" width="310" height="220" fill="#fff1e3" stroke="#d48745" stroke-width="3"/>
<text x="905" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#a9642c">Procedure</text>
<text x="905" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#5b6475">sp_register_enrollment</text>
<text x="905" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#5b6475">중복·존재 여부 확인</text>

<line x1="1060" y1="375" x2="1170" y2="375" stroke="#7d8798" stroke-width="8"/><polygon points="1170,375 1140,355 1140,395" fill="#7d8798"/>
<rect x="1170" y="290" rx="24" width="330" height="170" fill="#e9f7ef" stroke="#3f8a5d" stroke-width="3"/>
<text x="1335" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#32744e">Function</text>
<text x="1335" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#5b6475">fn_available_seats()</text>

<path d="M905 485 L905 590" stroke="#7d8798" stroke-width="8"/><polygon points="905,590 885,560 925,560" fill="#7d8798"/>
<rect x="675" y="590" rx="24" width="460" height="125" fill="#ffffff" stroke="#8a94a6" stroke-width="3"/>
<text x="905" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#1f2a44">enrollments + enrollment_events INSERT</text>
<text x="905" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#5b6475">두 작업이 함께 성공해야 함</text>

<path d="M675 653 L505 653" stroke="#3f8a5d" stroke-width="8"/><polygon points="505,653 535,633 535,673" fill="#3f8a5d"/>
<rect x="245" y="590" rx="24" width="260" height="125" fill="#e6f6ea" stroke="#3f8a5d" stroke-width="3"/>
<text x="375" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#32744e">COMMIT</text>

<path d="M1135 653 L1290 653" stroke="#c4535c" stroke-width="8" stroke-dasharray="16 12"/><polygon points="1290,653 1260,633 1260,673" fill="#c4535c"/>
<rect x="1290" y="590" rx="24" width="260" height="125" fill="#fde8ea" stroke="#c4535c" stroke-width="3"/>
<text x="1420" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#a63b45">ROLLBACK</text>

<text x="90" y="820" font-family="Arial, sans-serif" font-size="29" fill="#4c5668">성공: 신청과 이벤트 모두 저장 · 실패: 부분 데이터 없이 전체 취소</text>
</svg>