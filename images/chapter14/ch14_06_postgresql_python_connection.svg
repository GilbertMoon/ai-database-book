<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">PostgreSQL 데이터를 Python과 pandas로 읽기</title>
  <desc id="desc">개발·테스트 PostgreSQL의 분석 VIEW를 읽기 전용 계정과 환경변수, SQLAlchemy와 psycopg를 통해 pandas DataFrame으로 읽고 행 수와 자료형을 확인하는 흐름</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker>
    <style>
      text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;fill:#0f172a}.mono{font-family:Consolas,D2Coding,"Courier New",monospace}.title{font-size:29px;font-weight:800;text-anchor:middle}.sub{font-size:15px;text-anchor:middle;fill:#475569}.card{stroke-width:2;rx:14}.db{fill:#eff6ff;stroke:#3b82f6}.safe{fill:#ecfdf5;stroke:#16a34a}.env{fill:#fffbeb;stroke:#f59e0b}.code{fill:#faf5ff;stroke:#8b5cf6}.data{fill:#ecfeff;stroke:#06b6d4}.head{font-size:16px;font-weight:700;text-anchor:middle}.body{font-size:12.5px;text-anchor:middle;fill:#334155}.line{stroke:#475569;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.warn{fill:#fff1f2;stroke:#f43f5e;stroke-width:1.8;rx:12}.note{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5;rx:12}
    </style>
  </defs>
  <rect width="1200" height="650" fill="#fff"/>
  <text x="600" y="48" class="title">PostgreSQL 데이터를 Python과 pandas로 읽기</text>
  <text x="600" y="76" class="sub">접속 정보는 환경변수로 관리하고 분석 VIEW를 SELECT로 읽습니다.</text>

  <rect x="35" y="180" width="165" height="130" class="card db"/>
  <text x="117.5" y="215" class="head">PostgreSQL</text>
  <text x="117.5" y="247" class="body mono">analysis_lab</text>
  <text x="117.5" y="274" class="body">분석 VIEW</text>

  <rect x="235" y="180" width="165" height="130" class="card safe"/>
  <text x="317.5" y="215" class="head">안전한 연결</text>
  <text x="317.5" y="247" class="body">개발·테스트 DB</text>
  <text x="317.5" y="274" class="body">읽기 전용 우선</text>

  <rect x="435" y="180" width="165" height="130" class="card env"/>
  <text x="517.5" y="215" class="head mono">DATABASE_URL</text>
  <text x="517.5" y="247" class="body mono">.env</text>
  <text x="517.5" y="274" class="body">저장소 커밋 금지</text>

  <rect x="635" y="180" width="165" height="130" class="card code"/>
  <text x="717.5" y="215" class="head">연결 라이브러리</text>
  <text x="717.5" y="247" class="body mono">SQLAlchemy</text>
  <text x="717.5" y="274" class="body mono">psycopg</text>

  <rect x="835" y="180" width="165" height="130" class="card code"/>
  <text x="917.5" y="215" class="head mono">read_sql_query</text>
  <text x="917.5" y="247" class="body">검증된 SELECT</text>
  <text x="917.5" y="274" class="body">행 순서 명시</text>

  <rect x="1035" y="180" width="130" height="130" class="card data"/>
  <text x="1100" y="215" class="head">DataFrame</text>
  <text x="1100" y="247" class="body">행 수 24</text>
  <text x="1100" y="274" class="body">자료형 확인</text>

  <path d="M200 245 H235" class="line"/>
  <path d="M400 245 H435" class="line"/>
  <path d="M600 245 H635" class="line"/>
  <path d="M800 245 H835" class="line"/>
  <path d="M1000 245 H1035" class="line"/>

  <rect x="170" y="420" width="860" height="105" class="warn"/>
  <text x="600" y="455" class="head">연결 전 확인</text>
  <text x="600" y="486" class="body">비밀번호·접속 URL 코드 직접 입력 금지 · 운영 DB 직접 연결 금지</text>
  <text x="600" y="510" class="body">분석 코드에서 UPDATE · DELETE · DROP 자동 실행 금지</text>

  <rect x="260" y="565" width="680" height="48" class="note"/>
  <text x="600" y="595" class="head">연결 성공보다 어떤 DB와 계정으로 무엇을 읽는지 확인하는 것이 먼저입니다.</text>
</svg>
