<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="100%" height="760" viewBox="0 0 1200 760">
  <title id="title">pgvector와 수동 3차원 벡터 실습 비교</title>
  <desc id="desc">두 경로는 같은 7개 문서와 같은 질문 벡터를 사용합니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <style>text{font-family:'Pretendard','Noto Sans KR','Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',Arial,sans-serif;fill:#111827}.t{font-size:30px;font-weight:800;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.card{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:16}.b{fill:#eff6ff;stroke:#3b82f6}.g{fill:#f0fdf4;stroke:#22c55e}.y{fill:#fffbeb;stroke:#f59e0b}.p{fill:#faf5ff;stroke:#8b5cf6}.c{fill:#ecfeff;stroke:#06b6d4}.r{fill:#fff1f2;stroke:#f43f5e}.h{font-size:19px;font-weight:700;text-anchor:middle}.m{font-size:14px;text-anchor:middle;fill:#334155}.code{font-family:Consolas,'Pretendard','Noto Sans KR','Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',Arial,sans-serif;font-size:14px;text-anchor:middle;fill:#1d4ed8;font-weight:700}.line{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}.soft{stroke:#94a3b8;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="50" class="t">pgvector와 수동 3차원 벡터 실습 비교</text>
  <text x="600" y="78" class="s">두 경로는 같은 7개 문서와 같은 질문 벡터를 사용합니다.</text>
  <rect x="450" y="125" width="300" height="90" class="card c"/>
  <text x="600" y="159" class="h">공통 문서 7건</text>
  <text x="600" y="190" class="m">manual-demo-3d 데이터셋</text>
  <rect x="120" y="310" width="300" height="145" class="card b"/>
  <text x="270" y="344" class="h">Section A: pgvector</text>
  <text x="270" y="375" class="m">embedding vector(3)</text>
  <text x="270" y="397" class="m">&lt;-&gt; L2 거리</text>
  <text x="270" y="419" class="m">선택 실행</text>
  <rect x="780" y="310" width="300" height="145" class="card g"/>
  <text x="930" y="344" class="h">Section B: 수동 벡터</text>
  <text x="930" y="375" class="m">embedding_x · y · z</text>
  <text x="930" y="397" class="m">SQRT L2 계산</text>
  <text x="930" y="419" class="m">기본 실행</text>
  <line x1="520" y1="215" x2="300" y2="310" class="line"/>
  <line x1="680" y1="215" x2="930" y2="310" class="line"/>
  <rect x="450" y="540" width="300" height="100" class="card y"/>
  <text x="600" y="574" class="h">결과 비교</text>
  <text x="600" y="605" class="m">환불 질문 Top-3</text>
  <text x="600" y="627" class="m">순위와 거리 해석</text>
  <line x1="420" y1="455" x2="520" y2="540" class="line"/>
  <line x1="780" y1="455" x2="680" y2="540" class="line"/>
  <rect x="330" y="665" width="540" height="60" class="card p"/>
  <text x="600" y="699" class="h">CREATE EXTENSION은 설치 명령이 아니라 현재 DB에서 확장을 활성화하는 명령입니다.</text>
</svg>
