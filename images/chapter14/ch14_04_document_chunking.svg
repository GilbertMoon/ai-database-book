<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
  <title id="title">문서 청킹 구조</title>
  <desc id="desc">긴 문서를 제목, 문단, 항목과 주제 단위로 나누고 각 청크에 원문과 메타데이터 및 임베딩을 저장한 뒤 사용자 질문과 관련된 청크를 검색하는 흐름과 청크 크기의 장단점을 설명한 도식</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      text{font-family:Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}
      .title{font-size:27px;font-weight:700;text-anchor:middle}
      .subtitle{font-size:15px;text-anchor:middle;fill:#475569}
      .stage-group{fill:#f8fafc;stroke:#a8b3c4;stroke-width:1.5;rx:16}
      .stage{fill:#fff;stroke-width:1.7;rx:12}
      .stage-doc{stroke:#3b82c4}.stage-rule{stroke:#d69e2e}.stage-chunk{stroke:#7c5cc4}.stage-store{stroke:#3c9a5f}
      .badge{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:middle}
      .badge-doc{fill:#2f6fad}.badge-rule{fill:#b7791f}.badge-chunk{fill:#6b46a8}.badge-store{fill:#2f855a}
      .stage-title{font-size:16px;font-weight:700;text-anchor:middle}
      .stage-main{font-size:14px;font-weight:600;text-anchor:middle}
      .stage-sub{font-size:13px;text-anchor:middle;fill:#475569}
      .arrow{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .chunk-group{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:16}
      .group-title{font-size:18px;font-weight:700}
      .group-note{font-size:13px;text-anchor:middle;fill:#475569}
      .chunk-card{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.4;rx:10}
      .chunk-card-highlight{fill:#f2fbf5;stroke:#62b47a;stroke-width:1.6;rx:10}
      .chunk-id{font-size:13px;font-weight:700;text-anchor:middle;fill:#475569}
      .chunk-title{font-size:15px;font-weight:700;text-anchor:middle}
      .meta{font-size:12px;text-anchor:middle;fill:#64748b}
      .trade-group{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.4;rx:14}
      .trade-card{fill:#fff;stroke-width:1.5;rx:11}
      .trade-large{stroke:#d9534f}.trade-small{stroke:#d69e2e}.trade-good{stroke:#3c9a5f}
      .trade-title{font-size:15px;font-weight:700;text-anchor:middle}
      .trade-sub{font-size:13px;text-anchor:middle;fill:#475569}
      .search-box{fill:#f5f1ff;stroke:#7c5cc4;stroke-width:1.6;rx:12}
      .search-title{font-size:15px;font-weight:700;text-anchor:middle}
      .search-sub{font-size:13px;text-anchor:middle;fill:#475569}
      .principle{fill:#ecfdf3;stroke:#62b47a;stroke-width:1.6;rx:11}
      .principle-label{font-size:14px;font-weight:700;fill:#166534}
      .principle-text{font-size:16px;font-weight:700;text-anchor:middle;dominant-baseline:middle;fill:#166534}
    </style>
  </defs>

  <rect width="1200" height="980" fill="#fff"/>
  <text x="600" y="40" class="title">문서 청킹 구조</text>
  <text x="600" y="68" class="subtitle">긴 문서를 검색 가능한 의미 단위로 나누고 각 조각의 문맥과 출처를 함께 관리한다</text>

  <rect x="34" y="90" width="1132" height="220" class="stage-group"/>

  <rect x="50" y="130" width="245" height="132" class="stage stage-doc"/>
  <circle cx="74" cy="154" r="14" class="badge-doc"/><text x="74" y="154" class="badge">1</text>
  <text x="172.5" y="161" class="stage-title">긴 원문 문서</text>
  <text x="172.5" y="194" class="stage-main">서비스 운영 안내</text>
  <text x="172.5" y="219" class="stage-sub">이용권·환불·보안·문의 내용 포함</text>

  <rect x="335" y="130" width="245" height="132" class="stage stage-rule"/>
  <circle cx="359" cy="154" r="14" class="badge-rule"/><text x="359" y="154" class="badge">2</text>
  <text x="457.5" y="161" class="stage-title">청킹 기준 선택</text>
  <text x="457.5" y="194" class="stage-main">제목 · 문단 · 항목 · 주제</text>
  <text x="457.5" y="219" class="stage-sub">검색 정확성과 필요한 문맥을 함께 고려</text>

  <rect x="620" y="130" width="245" height="132" class="stage stage-chunk"/>
  <circle cx="644" cy="154" r="14" class="badge-chunk"/><text x="644" y="154" class="badge">3</text>
  <text x="742.5" y="161" class="stage-title">의미 단위 청크 생성</text>
  <text x="742.5" y="194" class="stage-main">주제별로 독립된 문서 조각</text>
  <text x="742.5" y="219" class="stage-sub">필요한 경우 앞뒤 문맥을 일부 겹침</text>

  <rect x="905" y="130" width="245" height="132" class="stage stage-store"/>
  <circle cx="929" cy="154" r="14" class="badge-store"/><text x="929" y="154" class="badge">4</text>
  <text x="1027.5" y="161" class="stage-title">청크별 저장</text>
  <text x="1027.5" y="194" class="stage-main">원문 · 메타데이터 · 임베딩</text>
  <text x="1027.5" y="219" class="stage-sub">Vector DB 또는 PostgreSQL pgvector</text>

  <path d="M 295 196 H 335" class="arrow"/>
  <path d="M 580 196 H 620" class="arrow"/>
  <path d="M 865 196 H 905" class="arrow"/>

  <rect x="34" y="334" width="1132" height="316" class="chunk-group"/>
  <text x="58" y="368" class="group-title">의미 단위 청크 예시</text>
  <text x="600" y="368" class="group-note">같은 문서에서 나왔다는 관계를 유지하면서 각 청크를 개별 검색 단위로 사용한다</text>

  <rect x="62" y="396" width="340" height="92" class="chunk-card"/>
  <text x="232" y="420" class="chunk-id">chunk 1</text>
  <text x="232" y="449" class="chunk-title">이용권 안내</text>
  <text x="232" y="474" class="meta">document_id=10 · order=1</text>

  <rect x="430" y="396" width="340" height="92" class="chunk-card-highlight"/>
  <text x="600" y="420" class="chunk-id">chunk 2</text>
  <text x="600" y="449" class="chunk-title">환불 기준</text>
  <text x="600" y="474" class="meta">document_id=10 · order=2</text>

  <rect x="798" y="396" width="340" height="92" class="chunk-card"/>
  <text x="968" y="420" class="chunk-id">chunk 3</text>
  <text x="968" y="449" class="chunk-title">계정 보안 안내</text>
  <text x="968" y="474" class="meta">document_id=10 · order=3</text>

  <rect x="62" y="514" width="340" height="92" class="chunk-card"/>
  <text x="232" y="538" class="chunk-id">chunk 4</text>
  <text x="232" y="567" class="chunk-title">고객지원 문의 방법</text>
  <text x="232" y="592" class="meta">document_id=10 · order=4</text>

  <rect x="430" y="514" width="340" height="92" class="chunk-card-highlight"/>
  <text x="600" y="538" class="chunk-id">chunk 5</text>
  <text x="600" y="567" class="chunk-title">환불 및 구독 취소 안내</text>
  <text x="600" y="592" class="meta">document_id=10 · order=5</text>

  <rect x="798" y="514" width="340" height="92" class="chunk-card"/>
  <text x="968" y="538" class="chunk-id">chunk 6</text>
  <text x="968" y="567" class="chunk-title">문의 방법</text>
  <text x="968" y="592" class="meta">document_id=10 · order=6</text>

  <text x="600" y="632" class="group-note">각 청크에는 title, content, document_id, chunk_id, 순서와 임베딩을 함께 저장한다</text>

  <rect x="34" y="674" width="1132" height="148" class="trade-group"/>
  <text x="58" y="706" class="group-title">청크 크기에 따른 차이</text>

  <rect x="62" y="726" width="330" height="72" class="trade-card trade-large"/>
  <text x="227" y="752" class="trade-title">너무 큰 청크</text>
  <text x="227" y="779" class="trade-sub">문맥은 많지만 질문과 무관한 내용도 포함</text>

  <rect x="435" y="726" width="330" height="72" class="trade-card trade-small"/>
  <text x="600" y="752" class="trade-title">너무 작은 청크</text>
  <text x="600" y="779" class="trade-sub">정확한 위치는 찾기 쉽지만 문맥이 부족</text>

  <rect x="808" y="726" width="330" height="72" class="trade-card trade-good"/>
  <text x="973" y="752" class="trade-title">의미 단위 청크</text>
  <text x="973" y="779" class="trade-sub">검색 정확성과 답변 문맥의 균형</text>

  <rect x="58" y="846" width="300" height="78" class="search-box"/>
  <text x="208" y="875" class="search-title">사용자 질문</text>
  <text x="208" y="902" class="search-sub">“환불 기준은 무엇인가요?”</text>

  <rect x="450" y="846" width="300" height="78" class="search-box"/>
  <text x="600" y="875" class="search-title">관련 청크 검색</text>
  <text x="600" y="902" class="search-sub">chunk 2 · chunk 5</text>

  <rect x="842" y="846" width="300" height="78" class="search-box"/>
  <text x="992" y="875" class="search-title">RAG 근거로 전달</text>
  <text x="992" y="902" class="search-sub">필요한 부분만 LLM 컨텍스트에 포함</text>

  <path d="M 358 885 H 450" class="arrow"/>
  <path d="M 750 885 H 842" class="arrow"/>

  <rect x="205" y="944" width="790" height="28" class="principle"/>
  <text x="230" y="958" class="principle-label">핵심 원칙</text>
  <text x="620" y="959" class="principle-text">좋은 청킹은 검색 정확성과 답변에 필요한 문맥을 함께 확보한다</text>
</svg>
