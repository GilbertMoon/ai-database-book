<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="100%" height="760" viewBox="0 0 1200 760">
  <title id="title">원문을 의미 단위 청크로 나누기</title>
  <desc id="desc">청크에는 본문뿐 아니라 출처, 버전, 권한 메타데이터가 필요합니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <style>text{font-family:'Pretendard','Noto Sans KR','Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',Arial,sans-serif;fill:#111827}.t{font-size:30px;font-weight:800;text-anchor:middle}.s{font-size:15px;text-anchor:middle;fill:#475569}.card{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:16}.b{fill:#eff6ff;stroke:#3b82f6}.g{fill:#f0fdf4;stroke:#22c55e}.y{fill:#fffbeb;stroke:#f59e0b}.p{fill:#faf5ff;stroke:#8b5cf6}.c{fill:#ecfeff;stroke:#06b6d4}.r{fill:#fff1f2;stroke:#f43f5e}.h{font-size:19px;font-weight:700;text-anchor:middle}.m{font-size:14px;text-anchor:middle;fill:#334155}.code{font-family:Consolas,'Pretendard','Noto Sans KR','Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',Arial,sans-serif;font-size:14px;text-anchor:middle;fill:#1d4ed8;font-weight:700}.line{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}.soft{stroke:#94a3b8;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="50" class="t">원문을 의미 단위 청크로 나누기</text>
  <text x="600" y="78" class="s">청크에는 본문뿐 아니라 출처, 버전, 권한 메타데이터가 필요합니다.</text>
  <rect x="60" y="160" width="230" height="130" class="card b"/>
  <text x="175" y="194" class="h">원문 문서</text>
  <text x="175" y="225" class="m">service_notice.md</text>
  <text x="175" y="247" class="m">공지 전체</text>
  <rect x="380" y="145" width="220" height="110" class="card g"/>
  <text x="490" y="179" class="h">chunk 1</text>
  <text x="490" y="210" class="m">이용권 변경</text>
  <rect x="380" y="295" width="220" height="110" class="card g"/>
  <text x="490" y="329" class="h">chunk 2</text>
  <text x="490" y="360" class="m">환불 기준</text>
  <rect x="380" y="445" width="220" height="110" class="card g"/>
  <text x="490" y="479" class="h">chunk 3</text>
  <text x="490" y="510" class="m">구독 취소</text>
  <rect x="780" y="230" width="300" height="170" class="card p"/>
  <text x="930" y="264" class="h">메타데이터</text>
  <text x="930" y="295" class="m">source · chunk_no</text>
  <text x="930" y="317" class="m">source_version</text>
  <text x="930" y="339" class="m">updated_at · 권한</text>
  <line x1="290" y1="225" x2="380" y2="200" class="line"/>
  <line x1="290" y1="225" x2="380" y2="350" class="line"/>
  <line x1="290" y1="225" x2="380" y2="500" class="line"/>
  <line x1="600" y1="350" x2="780" y2="315" class="line"/>
  <rect x="285" y="620" width="630" height="80" class="card y"/>
  <text x="600" y="654" class="h">문서가 바뀌면 청크와 임베딩도 함께 갱신해야 합니다.</text>
  <text x="600" y="685" class="m">벡터 인덱스는 원문에서 재생성 가능한 파생 데이터입니다.</text>
</svg>
