<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">개발·운영 환경과 계정 분리</title>
<desc id="desc">환경, 계정, 데이터, 백업 파일을 분리해 실수 영향을 줄인다</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>
text{font-family:"Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif;fill:#0f172a} .title{font-size:28px;font-weight:700;text-anchor:middle} .sub{font-size:14px;fill:#475569;text-anchor:middle} .box{fill:#fff;stroke:#7fb3f5;stroke-width:2;rx:14} .safe{fill:#ecfdf5;stroke:#22c55e;stroke-width:2;rx:14} .warn{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:14} .risk{fill:#fdf2f8;stroke:#db2777;stroke-width:2;rx:14} .ai{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2;rx:14} .note{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5;rx:12} .head{font-size:18px;font-weight:700;text-anchor:middle} .body{font-size:13.5px;text-anchor:middle;fill:#334155} .small{font-size:12.5px;text-anchor:middle;fill:#334155} .code{font-family:Consolas, D2Coding, "Courier New", monospace;font-size:13px;font-weight:700;text-anchor:middle;fill:#1d4ed8} .arrow{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)} .dash{stroke:#db2777;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)} .tag{font-size:12px;font-weight:700;fill:#2563eb;text-anchor:middle}
</style></defs>
<rect width="1200" height="600" fill="#ffffff"/>
<text x="600" y="48" class="title">개발·운영 환경과 계정 분리</text>
<text x="600" y="76" class="sub">환경, 계정, 데이터, 백업 파일을 분리해 실수 영향을 줄인다</text>
<rect x="110" y="150" width="280" height="145" class="safe"/>
<text x="250.0" y="182" class="head">개발 환경</text>
<text x="250.0" y="208" class="body">개발 계정</text>
<text x="250.0" y="230" class="body">가짜 또는 익명 데이터</text>
<rect x="110" y="350" width="280" height="145" class="box"/>
<text x="250.0" y="382" class="head">개발 파일</text>
<text x="250.0" y="408" class="body">.env.example</text>
<text x="250.0" y="430" class="body">샘플 백업만</text>
<rect x="810" y="150" width="280" height="145" class="risk"/>
<text x="950.0" y="182" class="head">운영 환경</text>
<text x="950.0" y="208" class="body">운영 계정</text>
<text x="950.0" y="230" class="body">실제 데이터</text>
<rect x="810" y="350" width="280" height="145" class="warn"/>
<text x="950.0" y="382" class="head">운영 보호</text>
<text x="950.0" y="408" class="body">강한 접근 통제</text>
<text x="950.0" y="430" class="body">백업 파일 보호</text>
<path d="M390 222 L810 222" class="arrow"/>
<path d="M390 422 L810 422" class="arrow"/>
<text x="600" y="210" class="tag">분리</text><text x="600" y="410" class="tag">비밀 정보 커밋 금지</text>
<rect x="405" y="520" width="390" height="45" class="note"/>
<text x="600" y="548" class="head">개발 편의가 운영 위험으로 이어지지 않게 분리한다</text>
</svg>
