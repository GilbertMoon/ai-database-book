<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">AI 보안·백업 명령 검토 흐름</title>
<desc id="desc">AI 명령은 환경, 권한, 비밀 정보, 테스트 실행을 거쳐 승인한다</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>
text{font-family:"Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif;fill:#0f172a} .title{font-size:28px;font-weight:700;text-anchor:middle} .sub{font-size:14px;fill:#475569;text-anchor:middle} .box{fill:#fff;stroke:#7fb3f5;stroke-width:2;rx:14} .safe{fill:#ecfdf5;stroke:#22c55e;stroke-width:2;rx:14} .warn{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:14} .risk{fill:#fdf2f8;stroke:#db2777;stroke-width:2;rx:14} .ai{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2;rx:14} .note{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5;rx:12} .head{font-size:18px;font-weight:700;text-anchor:middle} .body{font-size:13.5px;text-anchor:middle;fill:#334155} .small{font-size:12.5px;text-anchor:middle;fill:#334155} .code{font-family:Consolas, D2Coding, "Courier New", monospace;font-size:13px;font-weight:700;text-anchor:middle;fill:#1d4ed8} .arrow{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)} .dash{stroke:#db2777;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)} .tag{font-size:12px;font-weight:700;fill:#2563eb;text-anchor:middle}
</style></defs>
<rect width="1200" height="560" fill="#ffffff"/>
<text x="600" y="48" class="title">AI 보안·백업 명령 검토 흐름</text>
<text x="600" y="76" class="sub">AI 명령은 환경, 권한, 비밀 정보, 테스트 실행을 거쳐 승인한다</text>
<rect x="60" y="155" width="160" height="125" class="ai"/>
<text x="140.0" y="187" class="head">AI 초안</text>
<text x="140.0" y="213" class="code">GRANT</text>
<text x="140.0" y="235" class="code">pg_dump</text>
<rect x="250" y="155" width="160" height="125" class="box"/>
<text x="330.0" y="187" class="head">환경 확인</text>
<text x="330.0" y="213" class="body">테스트 DB?</text>
<rect x="440" y="155" width="160" height="125" class="warn"/>
<text x="520.0" y="187" class="head">권한 범위</text>
<text x="520.0" y="213" class="body">최소 권한?</text>
<rect x="630" y="155" width="160" height="125" class="risk"/>
<text x="710.0" y="187" class="head">비밀 정보</text>
<text x="710.0" y="213" class="body">노출 없음?</text>
<rect x="820" y="155" width="160" height="125" class="safe"/>
<text x="900.0" y="187" class="head">테스트 실행</text>
<text x="900.0" y="213" class="body">결과 확인</text>
<path d="M220 218 L250 218" class="arrow"/>
<path d="M410 218 L440 218" class="arrow"/>
<path d="M600 218 L630 218" class="arrow"/>
<path d="M790 218 L820 218" class="arrow"/>
<polygon points="600,330.0 720.0,390 600,450.0 480.0,390" class="warn"/>
<text x="600" y="384" class="head">검증 통과?</text>
<rect x="930" y="345" width="170" height="100" class="safe"/>
<text x="1015.0" y="377" class="head">사람 승인</text>
<text x="1015.0" y="403" class="body">반영</text>
<rect x="220" y="345" width="170" height="100" class="warn"/>
<text x="305.0" y="377" class="head">수정</text>
<text x="305.0" y="403" class="body">재검증</text>
<path d="M900 280 L930 385" class="arrow"/>
<path d="M480 390 L390 390" class="arrow"/>
<path d="M220 345 L300 280" class="dash"/>
<text x="845" y="370" class="tag">예</text><text x="445" y="370" class="tag">아니요</text>
</svg>
