<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">문자열 결합과 파라미터 바인딩</title>
<desc id="desc">SQL 구조와 사용자 입력을 분리하고 최소 권한으로 피해를 줄인다</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>
text{font-family:"Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif;fill:#0f172a} .title{font-size:28px;font-weight:700;text-anchor:middle} .sub{font-size:14px;fill:#475569;text-anchor:middle} .box{fill:#fff;stroke:#7fb3f5;stroke-width:2;rx:14} .safe{fill:#ecfdf5;stroke:#22c55e;stroke-width:2;rx:14} .warn{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:14} .risk{fill:#fdf2f8;stroke:#db2777;stroke-width:2;rx:14} .ai{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2;rx:14} .note{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5;rx:12} .head{font-size:18px;font-weight:700;text-anchor:middle} .body{font-size:13.5px;text-anchor:middle;fill:#334155} .small{font-size:12.5px;text-anchor:middle;fill:#334155} .code{font-family:Consolas, D2Coding, "Courier New", monospace;font-size:13px;font-weight:700;text-anchor:middle;fill:#1d4ed8} .arrow{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)} .dash{stroke:#db2777;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)} .tag{font-size:12px;font-weight:700;fill:#2563eb;text-anchor:middle}
</style></defs>
<rect width="1200" height="590" fill="#ffffff"/>
<text x="600" y="48" class="title">문자열 결합과 파라미터 바인딩</text>
<text x="600" y="76" class="sub">SQL 구조와 사용자 입력을 분리하고 최소 권한으로 피해를 줄인다</text>
<rect x="70" y="190" width="190" height="125" class="box"/>
<text x="165.0" y="222" class="head">사용자 입력</text>
<text x="165.0" y="248" class="body">email 값</text>
<text x="165.0" y="270" class="body">정렬 선택</text>
<polygon points="430,185.0 545.0,250 430,315.0 315.0,250" class="warn"/>
<text x="430" y="244" class="head">SQL 구조에 결합?</text>
<rect x="705" y="125" width="230" height="125" class="risk"/>
<text x="820.0" y="157" class="head">위험</text>
<text x="820.0" y="183" class="body">문자열 결합</text>
<text x="820.0" y="205" class="body">명령 구조 변경</text>
<rect x="705" y="345" width="230" height="125" class="safe"/>
<text x="820.0" y="377" class="head">안전 방향</text>
<text x="820.0" y="403" class="body">파라미터 바인딩</text>
<text x="820.0" y="425" class="body">허용 목록</text>
<rect x="980" y="345" width="160" height="125" class="warn"/>
<text x="1060.0" y="377" class="head">피해 축소</text>
<text x="1060.0" y="403" class="body">최소 권한</text>
<path d="M260 250 L315 250" class="arrow"/>
<path d="M545 250 L705 188" class="arrow"/>
<path d="M545 250 L705 408" class="arrow"/>
<path d="M935 408 L980 408" class="arrow"/>
<text x="625" y="190" class="tag">예</text><text x="625" y="405" class="tag">아니요</text>
<text x="600" y="535" class="head">값은 바인딩하고 동적 식별자는 허용 목록으로 제한한다</text>
</svg>
