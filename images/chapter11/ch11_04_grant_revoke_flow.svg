<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">GRANT·REVOKE와 유효 권한 확인</title>
<desc id="desc">권한 변경 후 역할 멤버십과 PUBLIC까지 확인한다</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>
text{font-family:"Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif;fill:#0f172a} .title{font-size:28px;font-weight:700;text-anchor:middle} .sub{font-size:14px;fill:#475569;text-anchor:middle} .box{fill:#fff;stroke:#7fb3f5;stroke-width:2;rx:14} .safe{fill:#ecfdf5;stroke:#22c55e;stroke-width:2;rx:14} .warn{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:14} .risk{fill:#fdf2f8;stroke:#db2777;stroke-width:2;rx:14} .ai{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2;rx:14} .note{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5;rx:12} .head{font-size:18px;font-weight:700;text-anchor:middle} .body{font-size:13.5px;text-anchor:middle;fill:#334155} .small{font-size:12.5px;text-anchor:middle;fill:#334155} .code{font-family:Consolas, D2Coding, "Courier New", monospace;font-size:13px;font-weight:700;text-anchor:middle;fill:#1d4ed8} .arrow{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)} .dash{stroke:#db2777;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)} .tag{font-size:12px;font-weight:700;fill:#2563eb;text-anchor:middle}
</style></defs>
<rect width="1200" height="560" fill="#ffffff"/>
<text x="600" y="48" class="title">GRANT·REVOKE와 유효 권한 확인</text>
<text x="600" y="76" class="sub">권한 변경 후 역할 멤버십과 PUBLIC까지 확인한다</text>
<rect x="50" y="150" width="145" height="125" class="box"/>
<text x="122.5" y="182" class="head">대상 확인</text>
<text x="122.5" y="208" class="body">역할 · 객체</text>
<rect x="220" y="150" width="145" height="125" class="warn"/>
<text x="292.5" y="182" class="head">GRANT/REVOKE</text>
<text x="292.5" y="208" class="body">경로 변경</text>
<rect x="390" y="150" width="145" height="125" class="box"/>
<text x="462.5" y="182" class="head">직접 권한</text>
<text x="462.5" y="208" class="code">명시 GRANT</text>
<rect x="560" y="150" width="145" height="125" class="box"/>
<text x="632.5" y="182" class="head">역할 멤버십</text>
<text x="632.5" y="208" class="body">pg_has_role</text>
<rect x="730" y="150" width="145" height="125" class="box"/>
<text x="802.5" y="182" class="head">PUBLIC</text>
<text x="802.5" y="208" class="body">공통 경로</text>
<rect x="900" y="150" width="145" height="125" class="box"/>
<text x="972.5" y="182" class="head">유효 권한</text>
<text x="972.5" y="208" class="body">has_*_privilege</text>
<path d="M195 212 L220 212" class="arrow"/>
<path d="M365 212 L390 212" class="arrow"/>
<path d="M535 212 L560 212" class="arrow"/>
<path d="M705 212 L730 212" class="arrow"/>
<path d="M875 212 L900 212" class="arrow"/>
<polygon points="600,322.5 715.0,380 600,437.5 485.0,380" class="warn"/>
<text x="600" y="374" class="head">정책과 일치?</text>
<path d="M972 275 L690 360" class="arrow"/>
<path d="M510 380 L150 275" class="dash"/>
<text x="600" y="500" class="head">REVOKE 후에도 다른 경로의 권한이 남을 수 있다</text>
