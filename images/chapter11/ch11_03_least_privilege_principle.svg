<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">최소 권한 설계 절차</title>
<desc id="desc">업무 작업에서 필요한 객체와 권한만 골라 부여하고 검증한다</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>
text{font-family:"Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif;fill:#0f172a} .title{font-size:28px;font-weight:700;text-anchor:middle} .sub{font-size:14px;fill:#475569;text-anchor:middle} .box{fill:#fff;stroke:#7fb3f5;stroke-width:2;rx:14} .safe{fill:#ecfdf5;stroke:#22c55e;stroke-width:2;rx:14} .warn{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:14} .risk{fill:#fdf2f8;stroke:#db2777;stroke-width:2;rx:14} .ai{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2;rx:14} .note{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5;rx:12} .head{font-size:18px;font-weight:700;text-anchor:middle} .body{font-size:13.5px;text-anchor:middle;fill:#334155} .small{font-size:12.5px;text-anchor:middle;fill:#334155} .code{font-family:Consolas, D2Coding, "Courier New", monospace;font-size:13px;font-weight:700;text-anchor:middle;fill:#1d4ed8} .arrow{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)} .dash{stroke:#db2777;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)} .tag{font-size:12px;font-weight:700;fill:#2563eb;text-anchor:middle}
</style></defs>
<rect width="1200" height="540" fill="#ffffff"/>
<text x="600" y="48" class="title">최소 권한 설계 절차</text>
<text x="600" y="76" class="sub">업무 작업에서 필요한 객체와 권한만 골라 부여하고 검증한다</text>
<rect x="70" y="160" width="170" height="130" class="box"/>
<text x="155.0" y="192" class="head">작업 정의</text>
<text x="155.0" y="218" class="body">보고 조회</text>
<text x="155.0" y="240" class="body">수강신청 입력</text>
<rect x="290" y="160" width="170" height="130" class="box"/>
<text x="375.0" y="192" class="head">객체 확인</text>
<text x="375.0" y="218" class="body">DB · 스키마</text>
<text x="375.0" y="240" class="body">테이블 · 시퀀스</text>
<rect x="510" y="160" width="170" height="130" class="safe"/>
<text x="595.0" y="192" class="head">권한 선택</text>
<text x="595.0" y="218" class="body">필요 권한만</text>
<rect x="730" y="160" width="170" height="130" class="safe"/>
<text x="815.0" y="192" class="head">역할 부여</text>
<text x="815.0" y="218" class="code">GRANT</text>
<rect x="950" y="160" width="170" height="130" class="safe"/>
<text x="1035.0" y="192" class="head">검증 기록</text>
<text x="1035.0" y="218" class="body">유효 권한</text>
<path d="M240 225 L290 225" class="arrow"/>
<path d="M460 225 L510 225" class="arrow"/>
<path d="M680 225 L730 225" class="arrow"/>
<path d="M900 225 L950 225" class="arrow"/>
<polygon points="600,330.0 725.0,390 600,450.0 475.0,390" class="warn"/>
<text x="600" y="384" class="head">과도한 권한?</text>
<text x="600" y="408" class="small">예: 다시 줄임</text>
<path d="M1035 290 L725 390" class="arrow"/>
<path d="M475 390 L365 290" class="dash"/>
</svg>
