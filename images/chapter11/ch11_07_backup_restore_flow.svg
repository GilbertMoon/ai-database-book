<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">백업 생성에서 복구 검증까지</title>
<desc id="desc">백업 파일은 별도 DB에서 복구해 행 수와 구조를 검증한다</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>
text{font-family:"Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif;fill:#0f172a} .title{font-size:28px;font-weight:700;text-anchor:middle} .sub{font-size:14px;fill:#475569;text-anchor:middle} .box{fill:#fff;stroke:#7fb3f5;stroke-width:2;rx:14} .safe{fill:#ecfdf5;stroke:#22c55e;stroke-width:2;rx:14} .warn{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:14} .risk{fill:#fdf2f8;stroke:#db2777;stroke-width:2;rx:14} .ai{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2;rx:14} .note{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5;rx:12} .head{font-size:18px;font-weight:700;text-anchor:middle} .body{font-size:13.5px;text-anchor:middle;fill:#334155} .small{font-size:12.5px;text-anchor:middle;fill:#334155} .code{font-family:Consolas, D2Coding, "Courier New", monospace;font-size:13px;font-weight:700;text-anchor:middle;fill:#1d4ed8} .arrow{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)} .dash{stroke:#db2777;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)} .tag{font-size:12px;font-weight:700;fill:#2563eb;text-anchor:middle}
</style></defs>
<rect width="1200" height="560" fill="#ffffff"/>
<text x="600" y="48" class="title">백업 생성에서 복구 검증까지</text>
<text x="600" y="76" class="sub">백업 파일은 별도 DB에서 복구해 행 수와 구조를 검증한다</text>
<rect x="60" y="155" width="160" height="135" class="box"/>
<text x="140.0" y="187" class="head">백업 생성</text>
<text x="140.0" y="213" class="code">pg_dump</text>
<rect x="245" y="155" width="160" height="135" class="box"/>
<text x="325.0" y="187" class="head">파일 보호</text>
<text x="325.0" y="213" class="body">암호화 · 접근권한</text>
<rect x="430" y="155" width="160" height="135" class="box"/>
<text x="510.0" y="187" class="head">복구 DB</text>
<text x="510.0" y="213" class="body">별도 환경</text>
<rect x="615" y="155" width="160" height="135" class="box"/>
<text x="695.0" y="187" class="head">오류 중단</text>
<text x="695.0" y="213" class="body">ON_ERROR_STOP</text>
<text x="695.0" y="235" class="body">--exit-on-error</text>
<rect x="800" y="155" width="160" height="135" class="safe"/>
<text x="880.0" y="187" class="head">검증</text>
<text x="880.0" y="213" class="body">3 · 3 · 3</text>
<text x="880.0" y="235" class="body">JOIN 3</text>
<rect x="985" y="155" width="160" height="135" class="safe"/>
<text x="1065.0" y="187" class="head">기록</text>
<text x="1065.0" y="213" class="body">RPO · RTO</text>
<path d="M220 222 L245 222" class="arrow"/>
<path d="M405 222 L430 222" class="arrow"/>
<path d="M590 222 L615 222" class="arrow"/>
<path d="M775 222 L800 222" class="arrow"/>
<path d="M960 222 L985 222" class="arrow"/>
<polygon points="600,350.0 725.0,410 600,470.0 475.0,410" class="warn"/>
<text x="600" y="404" class="head">기준 충족?</text>
<text x="600" y="428" class="small">아니요: 절차 수정</text>
