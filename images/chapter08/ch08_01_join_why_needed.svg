<?xml version="1.0" encoding="utf-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="100%"
  viewBox="0 0 1200 600"
  role="img"
  aria-labelledby="title desc"
  preserveAspectRatio="xMidYMid meet"
>
  <title id="title">정규화된 테이블에 JOIN이 필요한 이유</title>
  <desc id="desc">수강신청 한 건의 외래키를 따라 학생, 강의, 강사 정보를 조회하고 수강 상태와 결제 금액을 함께 하나의 결과 행으로 만드는 JOIN 흐름</desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="8"
      markerHeight="8"
      orient="auto"
    >
      <path d="M0 0 L10 5 L0 10 z" fill="#475569" />
    </marker>
    <style>
      text {
        font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif;
        fill: #0f172a;
      }
      .mono {
        font-family: Consolas, D2Coding, "Courier New", monospace;
      }
      .title {
        font-size: 28px;
        font-weight: 700;
      }
      .subtitle {
        font-size: 15px;
        fill: #475569;
      }
      .box {
        stroke: #334155;
        stroke-width: 2;
        rx: 16;
        ry: 16;
      }
      .base {
        fill: #dbeafe;
      }
      .lookup {
        fill: #ede9fe;
      }
      .result {
        fill: #dcfce7;
      }
      .note-box {
        fill: #f8fafc;
      }
      .label {
        font-size: 17px;
        font-weight: 700;
      }
      .text {
        font-size: 14px;
      }
      .small {
        font-size: 12.5px;
        fill: #475569;
      }
      .note {
        font-size: 14px;
        fill: #334155;
      }
      .fk-line {
        stroke: #64748b;
        stroke-width: 2.2;
        stroke-dasharray: 7 6;
        fill: none;
        marker-end: url(#arrow);
      }
      .result-line {
        stroke: #475569;
        stroke-width: 2.3;
        fill: none;
        marker-end: url(#arrow);
      }
      .route-label {
        font-size: 12.5px;
        font-weight: 700;
        fill: #475569;
      }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="600" fill="#ffffff" />

  <!-- Title -->
  <text x="600" y="42" text-anchor="middle" class="title">
    정규화된 테이블에 JOIN이 필요한 이유
  </text>
  <text x="600" y="72" text-anchor="middle" class="subtitle">
    외래키 경로를 따라 필요한 값을 조회하고, 수강신청 한 건을 기준으로 하나의 결과 행을 만듭니다.
  </text>

  <!-- Base row: enrollments -->
  <rect x="45" y="145" width="255" height="205" class="box base" />
  <text x="172.5" y="180" text-anchor="middle" class="label">수강신청 한 건</text>
  <text x="172.5" y="210" text-anchor="middle" class="text mono">enrollments</text>
  <text x="172.5" y="242" text-anchor="middle" class="text mono">student_id</text>
  <text x="172.5" y="270" text-anchor="middle" class="text mono">course_id</text>
  <text x="172.5" y="305" text-anchor="middle" class="text">status · paid_amount</text>
  <text x="172.5" y="330" text-anchor="middle" class="small">결과의 기준 행</text>

  <!-- Lookup tables -->
  <rect x="385" y="100" width="230" height="105" class="box lookup" />
  <text x="500" y="135" text-anchor="middle" class="label mono">students.id</text>
  <text x="500" y="168" text-anchor="middle" class="text">학생 이름</text>

  <rect x="385" y="245" width="230" height="125" class="box lookup" />
  <text x="500" y="280" text-anchor="middle" class="label mono">courses.id</text>
  <text x="500" y="310" text-anchor="middle" class="text">강의 제목</text>
  <text x="500" y="340" text-anchor="middle" class="text mono">FK instructor_id</text>

  <rect x="690" y="245" width="230" height="105" class="box lookup" />
  <text x="805" y="280" text-anchor="middle" class="label mono">instructors.id</text>
  <text x="805" y="313" text-anchor="middle" class="text">강사 이름</text>

  <!-- Joined result -->
  <rect x="950" y="145" width="215" height="205" class="box result" />
  <text x="1057.5" y="180" text-anchor="middle" class="label">수강신청 현황 한 행</text>
  <text x="1057.5" y="215" text-anchor="middle" class="text">학생 이름 · 강의 제목</text>
  <text x="1057.5" y="243" text-anchor="middle" class="text">강사 이름</text>
  <text x="1057.5" y="280" text-anchor="middle" class="text">상태 · 결제금액</text>
  <text x="1057.5" y="318" text-anchor="middle" class="small">기준 행 = 수강신청 한 건</text>

  <!-- FK reference paths -->
  <path d="M300 235 H340 V152 H385" class="fk-line" />
  <text x="350" y="125" text-anchor="middle" class="route-label">student_id → students.id</text>

  <path d="M300 270 H342 V307 H385" class="fk-line" />
  <text x="340" y="294" text-anchor="middle" class="route-label">course_id → courses.id</text>

  <path d="M615 307 H690" class="fk-line" />
  <text x="652.5" y="289" text-anchor="middle" class="route-label">instructor_id → instructors.id</text>

  <!-- Values projected into the result row -->
  <path d="M615 152 H880 V185 H950" class="result-line" />
  <text x="765" y="137" text-anchor="middle" class="route-label">학생 이름</text>

  <path d="M615 330 H650 V220 H920 V225 H950" class="result-line" />
  <text x="785" y="207" text-anchor="middle" class="route-label">강의 제목</text>

  <path d="M920 297 H935 V260 H950" class="result-line" />
  <text x="927" y="285" text-anchor="end" class="route-label">강사 이름</text>

  <path d="M300 325 V410 H1057 V350" class="result-line" />
  <text x="680" y="432" text-anchor="middle" class="route-label">status · paid_amount</text>

  <!-- Summary -->
  <rect x="100" y="470" width="1000" height="85" class="box note-box" />
  <text x="600" y="505" text-anchor="middle" class="label">
    정규화는 사실을 나누어 저장하고, JOIN은 조회 시점에 관계를 따라 필요한 결과를 만듭니다.
  </text>
  <text x="600" y="535" text-anchor="middle" class="note">
    테이블을 실제로 합쳐 저장하는 것이 아니라 PK와 FK를 기준으로 필요한 값을 조회합니다.
  </text>
</svg>
