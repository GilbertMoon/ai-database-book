<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="100%" viewBox="0 0 1200 580">
  <title id="title">정규화된 테이블에 JOIN이 필요한 이유</title>
  <desc id="desc">수강신청 한 건에서 학생, 강의, 강사 정보를 실제 외래키 경로로 연결해 하나의 조회 결과를 만드는 과정을 보여 주는 도식이다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 28px 'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif; fill: #0f172a; }
      .box { stroke: #334155; stroke-width: 2; rx: 16; ry: 16; }
      .label { font: 600 17px 'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif; fill: #0f172a; }
      .text { font: 14px 'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif; fill: #0f172a; }
      .note { font: 14px 'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif; fill: #334155; }
    </style>
  </defs>
  <rect x="0" y="0" width="1200" height="580" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" class="title">정규화된 테이블에 JOIN이 필요한 이유</text>
  <rect x="60" y="110" width="220" height="170" class="box" fill="#dbeafe"/>
  <text x="170" y="145" text-anchor="middle" class="label">수강신청 한 건</text>
  <text x="170" y="175" text-anchor="middle" class="text">enrollments</text>
  <text x="170" y="205" text-anchor="middle" class="text">student_id</text>
  <text x="170" y="230" text-anchor="middle" class="text">course_id</text>
  <text x="170" y="255" text-anchor="middle" class="text">status · paid_amount</text>
  <rect x="380" y="95" width="220" height="95" class="box" fill="#ede9fe"/>
  <text x="490" y="128" text-anchor="middle" class="label">students.id</text>
  <text x="490" y="160" text-anchor="middle" class="text">학생 이름</text>
  <rect x="380" y="225" width="220" height="110" class="box" fill="#ede9fe"/>
  <text x="490" y="258" text-anchor="middle" class="label">courses.id</text>
  <text x="490" y="288" text-anchor="middle" class="text">강의 제목</text>
  <text x="490" y="313" text-anchor="middle" class="text">FK instructor_id</text>
  <rect x="700" y="225" width="220" height="95" class="box" fill="#ede9fe"/>
  <text x="810" y="258" text-anchor="middle" class="label">instructors.id</text>
  <text x="810" y="290" text-anchor="middle" class="text">강사 이름</text>
  <rect x="940" y="145" width="220" height="150" class="box" fill="#dcfce7"/>
  <text x="1050" y="180" text-anchor="middle" class="label">수강신청 현황 한 행</text>
  <text x="1050" y="212" text-anchor="middle" class="text">학생 이름 · 강의 제목 · 강사 이름</text>
  <text x="1050" y="238" text-anchor="middle" class="text">상태 · 결제금액</text>
  <text x="1050" y="264" text-anchor="middle" class="text">기준 행 = 수강신청 한 건</text>
  <line x1="280" y1="170" x2="380" y2="142" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="220" x2="380" y2="275" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="280" x2="700" y2="272" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="142" x2="940" y2="190" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="280" x2="940" y2="220" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="920" y1="272" x2="940" y2="245" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="110" y="420" width="980" height="90" class="box" fill="#f8fafc"/>
  <text x="600" y="455" text-anchor="middle" class="label">정규화는 사실을 나누어 저장하고, JOIN은 조회 시점에 관계를 따라 필요한 결과를 만든다</text>
  <text x="600" y="485" text-anchor="middle" class="note">JOIN은 테이블을 실제로 합쳐 저장하지 않으며, 실제 PK와 FK 관계를 따라 값을 찾아온다</text>
</svg>
