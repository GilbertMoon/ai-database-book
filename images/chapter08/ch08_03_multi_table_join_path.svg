<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1940" viewBox="0 0 1200 1940" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
  <title id="title">여러 테이블 JOIN 경로</title>
  <desc id="desc">온라인 강의 수강신청 시스템에서 결과 한 행의 기준을 enrollments의 수강신청 한 건으로 정하고, enrollments.student_id를 students.id에, enrollments.course_id를 courses.id에, courses.instructor_id를 instructors.id에 연결해 학생명, 강의명, 강사명, 상태, 결제금액을 복원하는 여러 테이블 INNER JOIN 경로를 설명한다. 각 관계의 카디널리티, 단계별 SQL, 예상 결과 건수와 잘못된 연결을 검증하는 기준도 함께 보여 준다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2f6fad"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7c5cc4"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#b7791f"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#c2413b"/>
    </marker>
    <style>
      text{font-family:Malgun Gothic,NanumSquare,Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif;fill:#172033}
      .title{font-size:30px;font-weight:700;text-anchor:middle}
      .subtitle{font-size:16px;text-anchor:middle;fill:#475569}
      .section-title{font-size:19px;font-weight:700}
      .section-sub{font-size:14px;fill:#475569}
      .card-title{font-size:15px;font-weight:700;text-anchor:middle}
      .card-text{font-size:13px;text-anchor:middle;fill:#475569}
      .card-text-small{font-size:12px;text-anchor:middle;fill:#475569}
      .mono{font-family:Consolas,D2Coding,Noto Sans Mono CJK KR,Menlo,monospace;font-size:12.5px;text-anchor:middle;fill:#334155}
      .mono-small{font-family:Consolas,D2Coding,Noto Sans Mono CJK KR,Menlo,monospace;font-size:11.5px;text-anchor:middle;fill:#334155}
      .badge{font-size:12px;font-weight:700;text-anchor:middle;dominant-baseline:middle;fill:#ffffff}
      .flow{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .ref-blue{stroke:#2f6fad;stroke-width:2.3;fill:none;marker-end:url(#arrow-blue)}
      .ref-purple{stroke:#7c5cc4;stroke-width:2.3;fill:none;marker-end:url(#arrow-purple)}
      .ref-orange{stroke:#b7791f;stroke-width:2.3;fill:none;marker-end:url(#arrow-orange)}
      .wrong{stroke:#c2413b;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow-red)}
      .table-title{font-size:16px;font-weight:700;text-anchor:middle}
      .th{font-size:11.3px;font-weight:700;text-anchor:middle;fill:#334155}
      .cell{font-size:11.2px;text-anchor:middle;fill:#334155}
      .pk{font-size:11px;font-weight:700;text-anchor:middle;fill:#1d4ed8}
      .fk{font-size:11px;font-weight:700;text-anchor:middle;fill:#92400e}
      .line{stroke:#cbd5e1;stroke-width:1}
      .step{font-size:13px;font-weight:700;text-anchor:middle;fill:#ffffff}
      .result-head{font-size:11.3px;font-weight:700;text-anchor:middle;fill:#334155}
      .result-cell{font-size:11.3px;text-anchor:middle;fill:#334155}
      .note-title{font-size:14px;font-weight:700;text-anchor:middle;fill:#92400e}
      .note-text{font-size:12.3px;text-anchor:middle;fill:#475569}
      .principle{font-size:16.5px;font-weight:700;text-anchor:middle;fill:#166534}
      .ok{font-size:13px;font-weight:700;text-anchor:middle;fill:#166534}
      .no{font-size:13px;font-weight:700;text-anchor:middle;fill:#b42318}
    </style>
  </defs>

  <rect width="1200" height="1940" fill="#ffffff"/>
  <text x="600" y="42" class="title">여러 테이블 JOIN 경로</text>
  <text x="600" y="72" class="subtitle">기준 테이블에서 실제 FK → PK 관계를 한 단계씩 따라가며 필요한 의미를 확장한다</text>

  <rect x="34" y="98" width="1132" height="248" rx="16" fill="#eef5ff" stroke="#6fa2e8" stroke-width="1.6"/>
  <text x="58" y="132" class="section-title">1. 업무 질문과 결과 한 행의 기준(grain)을 정한다</text>
  <text x="478" y="132" class="section-sub">어느 테이블에서 출발할지가 JOIN 경로와 예상 행 수를 결정한다</text>

  <rect x="74" y="162" width="1052" height="62" rx="11" fill="#ffffff" stroke="#3b82c4" stroke-width="1.5"/>
  <text x="600" y="187" class="card-title">각 수강신청에 대해 학생명·강의명·강사명·상태·결제금액·신청일을 조회한다</text>
  <text x="600" y="211" class="card-text-small">결과 한 행 = enrollments.id로 식별되는 수강신청 한 건</text>

  <rect x="58" y="250" width="330" height="68" rx="10" fill="#ffffff" stroke="#3c9a5f" stroke-width="1.4"/>
  <text x="223" y="275" class="card-title">기준 테이블</text>
  <text x="223" y="301" class="mono">FROM enrollments AS e</text>

  <rect x="435" y="250" width="330" height="68" rx="10" fill="#ffffff" stroke="#d69e2e" stroke-width="1.4"/>
  <text x="600" y="275" class="card-title">기준 행 식별자</text>
  <text x="600" y="301" class="mono">e.id AS enrollment_id</text>

  <rect x="812" y="250" width="330" height="68" rx="10" fill="#ffffff" stroke="#7c5cc4" stroke-width="1.4"/>
  <text x="977" y="275" class="card-title">샘플 기준 건수</text>
  <text x="977" y="301" class="mono">enrollments = 5건</text>

  <path d="M600 346V370" class="flow"/>

  <rect x="34" y="370" width="1132" height="534" rx="16" fill="#f8fafc" stroke="#a8b3c4" stroke-width="1.6"/>
  <text x="58" y="404" class="section-title">2. ERD의 실제 관계를 따라 JOIN 경로를 확인한다</text>
  <text x="454" y="404" class="section-sub">컬럼 이름이 비슷하다는 이유가 아니라 정의된 FK와 참조 PK를 연결한다</text>

  <rect x="52" y="446" width="246" height="238" rx="11" fill="#ffffff" stroke="#3b82c4" stroke-width="1.5"/>
  <rect x="52" y="446" width="246" height="44" rx="11" fill="#dcecff"/>
  <text x="175" y="474" class="table-title">students AS s</text>
  <text x="80" y="522" class="pk">PK</text><text x="160" y="522" class="mono-small">id</text>
  <line x1="52" y1="538" x2="298" y2="538" class="line"/>
  <text x="175" y="568" class="mono-small">name</text>
  <line x1="52" y1="584" x2="298" y2="584" class="line"/>
  <text x="175" y="614" class="mono-small">email</text>
  <line x1="52" y1="630" x2="298" y2="630" class="line"/>
  <text x="175" y="660" class="card-text-small">학생 1명은 수강신청 0..N건</text>

  <rect x="328" y="426" width="270" height="278" rx="11" fill="#ffffff" stroke="#3c9a5f" stroke-width="1.6"/>
  <rect x="328" y="426" width="270" height="44" rx="11" fill="#dcf7e5"/>
  <text x="463" y="454" class="table-title">enrollments AS e</text>
  <text x="354" y="502" class="pk">PK</text><text x="445" y="502" class="mono-small">id</text>
  <line x1="328" y1="518" x2="598" y2="518" class="line"/>
  <text x="354" y="548" class="fk">FK</text><text x="465" y="548" class="mono-small">student_id NOT NULL</text>
  <line x1="328" y1="564" x2="598" y2="564" class="line"/>
  <text x="354" y="594" class="fk">FK</text><text x="465" y="594" class="mono-small">course_id NOT NULL</text>
  <line x1="328" y1="610" x2="598" y2="610" class="line"/>
  <text x="463" y="640" class="mono-small">status · paid_amount</text>
  <line x1="328" y1="656" x2="598" y2="656" class="line"/>
  <text x="463" y="686" class="card-text-small">각 행은 학생 1명·강의 1개를 참조</text>

  <rect x="628" y="426" width="270" height="278" rx="11" fill="#ffffff" stroke="#7c5cc4" stroke-width="1.6"/>
  <rect x="628" y="426" width="270" height="44" rx="11" fill="#ede9fe"/>
  <text x="763" y="454" class="table-title">courses AS c</text>
  <text x="654" y="502" class="pk">PK</text><text x="745" y="502" class="mono-small">id</text>
  <line x1="628" y1="518" x2="898" y2="518" class="line"/>
  <text x="654" y="548" class="fk">FK</text><text x="765" y="548" class="mono-small">instructor_id NOT NULL</text>
  <line x1="628" y1="564" x2="898" y2="564" class="line"/>
  <text x="763" y="594" class="mono-small">title</text>
  <line x1="628" y1="610" x2="898" y2="610" class="line"/>
  <text x="763" y="640" class="mono-small">level · price</text>
  <line x1="628" y1="656" x2="898" y2="656" class="line"/>
  <text x="763" y="686" class="card-text-small">강의 1개는 수강신청 0..N건</text>

  <rect x="928" y="446" width="220" height="238" rx="11" fill="#ffffff" stroke="#d69e2e" stroke-width="1.5"/>
  <rect x="928" y="446" width="220" height="44" rx="11" fill="#fff1cf"/>
  <text x="1038" y="474" class="table-title">instructors AS i</text>
  <text x="954" y="522" class="pk">PK</text><text x="1028" y="522" class="mono-small">id</text>
  <line x1="928" y1="538" x2="1148" y2="538" class="line"/>
  <text x="1038" y="568" class="mono-small">name</text>
  <line x1="928" y1="584" x2="1148" y2="584" class="line"/>
  <text x="1038" y="614" class="mono-small">specialty</text>
  <line x1="928" y1="630" x2="1148" y2="630" class="line"/>
  <text x="1038" y="660" class="card-text-small">강사 1명은 강의 0..N개</text>

  <path d="M328 548H312V502H298" class="ref-blue"/>
  <path d="M598 594H612V502H628" class="ref-purple"/>
  <path d="M898 548H912V522H928" class="ref-orange"/>

  <rect x="114" y="734" width="972" height="38" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="600" y="759" class="mono-small">e.student_id → s.id · e.course_id → c.id · c.instructor_id → i.id</text>

  <rect x="58" y="796" width="330" height="76" rx="10" fill="#ffffff" stroke="#3b82c4" stroke-width="1.4"/>
  <text x="223" y="821" class="card-title">학생 연결</text>
  <text x="223" y="846" class="card-text-small">각 e 행은 s 한 행과 정확히 매칭</text>

  <rect x="435" y="796" width="330" height="76" rx="10" fill="#ffffff" stroke="#7c5cc4" stroke-width="1.4"/>
  <text x="600" y="821" class="card-title">강의 연결</text>
  <text x="600" y="846" class="card-text-small">각 e 행은 c 한 행과 정확히 매칭</text>

  <rect x="812" y="796" width="330" height="76" rx="10" fill="#ffffff" stroke="#d69e2e" stroke-width="1.4"/>
  <text x="977" y="821" class="card-title">강사 연결</text>
  <text x="977" y="846" class="card-text-small">c를 거쳐 각 e 행에 강사 한 명 연결</text>

  <path d="M600 904V928" class="flow"/>

  <rect x="34" y="928" width="1132" height="434" rx="16" fill="#fff8e8" stroke="#d69e2e" stroke-width="1.6"/>
  <text x="58" y="962" class="section-title">3. 기준 테이블에서 관계를 한 단계씩 추가한다</text>
  <text x="430" y="962" class="section-sub">작성 순서는 경로를 읽기 쉽게 만들며, 옵티마이저의 실제 실행 순서는 달라질 수 있다</text>

  <rect x="58" y="994" width="250" height="118" rx="11" fill="#ffffff" stroke="#3c9a5f" stroke-width="1.5"/>
  <circle cx="86" cy="1022" r="15" fill="#2f855a"/><text x="86" y="1022" class="step">1</text>
  <text x="183" y="1026" class="card-title">수강신청에서 시작</text>
  <text x="183" y="1058" class="mono-small">FROM enrollments e</text>
  <text x="183" y="1083" class="card-text-small">상태·결제금액·신청일 확보</text>

  <rect x="336" y="994" width="250" height="118" rx="11" fill="#ffffff" stroke="#3b82c4" stroke-width="1.5"/>
  <circle cx="364" cy="1022" r="15" fill="#2f6fad"/><text x="364" y="1022" class="step">2</text>
  <text x="461" y="1026" class="card-title">학생 이름 추가</text>
  <text x="461" y="1058" class="mono-small">JOIN students s</text>
  <text x="461" y="1083" class="mono-small">ON e.student_id = s.id</text>

  <rect x="614" y="994" width="250" height="118" rx="11" fill="#ffffff" stroke="#7c5cc4" stroke-width="1.5"/>
  <circle cx="642" cy="1022" r="15" fill="#7c5cc4"/><text x="642" y="1022" class="step">3</text>
  <text x="739" y="1026" class="card-title">강의 제목 추가</text>
  <text x="739" y="1058" class="mono-small">JOIN courses c</text>
  <text x="739" y="1083" class="mono-small">ON e.course_id = c.id</text>

  <rect x="892" y="994" width="250" height="118" rx="11" fill="#ffffff" stroke="#d69e2e" stroke-width="1.5"/>
  <circle cx="920" cy="1022" r="15" fill="#b7791f"/><text x="920" y="1022" class="step">4</text>
  <text x="1017" y="1026" class="card-title">강사 이름 추가</text>
  <text x="1017" y="1058" class="mono-small">JOIN instructors i</text>
  <text x="1017" y="1083" class="mono-small">ON c.instructor_id = i.id</text>

  <path d="M308 1053H336" class="flow"/>
  <path d="M586 1053H614" class="flow"/>
  <path d="M864 1053H892" class="flow"/>

  <rect x="58" y="1144" width="1084" height="170" rx="11" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="600" y="1172" class="card-title">최종 SQL의 핵심 구조</text>
  <text x="600" y="1204" class="mono">SELECT e.id AS enrollment_id, s.name, c.title, i.name, e.status, e.paid_amount, e.enrolled_at</text>
  <text x="600" y="1232" class="mono">FROM enrollments AS e JOIN students AS s ON e.student_id = s.id</text>
  <text x="600" y="1260" class="mono">JOIN courses AS c ON e.course_id = c.id JOIN instructors AS i ON c.instructor_id = i.id</text>
  <text x="600" y="1288" class="mono-small">ORDER BY e.id</text>

  <path d="M600 1362V1386" class="flow"/>

  <rect x="34" y="1386" width="1132" height="456" rx="16" fill="#f2fbf5" stroke="#62b47a" stroke-width="1.6"/>
  <text x="58" y="1420" class="section-title">4. 결과의 의미와 건수를 검증한다</text>
  <text x="350" y="1420" class="section-sub">연결이 실행됐다는 사실보다 수강신청 한 건이 한 결과 행으로 유지되는지가 중요하다</text>

  <rect x="58" y="1452" width="1084" height="174" rx="11" fill="#ffffff" stroke="#3c9a5f" stroke-width="1.5"/>
  <rect x="58" y="1452" width="1084" height="40" rx="11" fill="#dcf7e5"/>
  <text x="125" y="1478" class="result-head">enrollment_id</text>
  <text x="300" y="1478" class="result-head">student_name</text>
  <text x="510" y="1478" class="result-head">course_title</text>
  <text x="720" y="1478" class="result-head">instructor_name</text>
  <text x="890" y="1478" class="result-head">status</text>
  <text x="1060" y="1478" class="result-head">paid_amount</text>
  <line x1="58" y1="1492" x2="1142" y2="1492" class="line"/>
  <line x1="205" y1="1452" x2="205" y2="1626" class="line"/>
  <line x1="395" y1="1452" x2="395" y2="1626" class="line"/>
  <line x1="620" y1="1452" x2="620" y2="1626" class="line"/>
  <line x1="810" y1="1452" x2="810" y2="1626" class="line"/>
  <line x1="970" y1="1452" x2="970" y2="1626" class="line"/>
  <line x1="58" y1="1536" x2="1142" y2="1536" class="line"/>
  <line x1="58" y1="1580" x2="1142" y2="1580" class="line"/>
  <text x="125" y="1522" class="result-cell">1</text><text x="300" y="1522" class="result-cell">김민지</text><text x="510" y="1522" class="result-cell">데이터베이스 입문</text><text x="720" y="1522" class="result-cell">문길래</text><text x="890" y="1522" class="result-cell">수강중</text><text x="1060" y="1522" class="result-cell">100000</text>
  <text x="125" y="1566" class="result-cell">2</text><text x="300" y="1566" class="result-cell">김민지</text><text x="510" y="1566" class="result-cell">정규화 실습</text><text x="720" y="1566" class="result-cell">문길래</text><text x="890" y="1566" class="result-cell">신청</text><text x="1060" y="1566" class="result-cell">120000</text>
  <text x="600" y="1610" class="card-text-small">나머지 수강신청도 같은 경로로 복원되며 ORDER BY e.id로 표시 순서를 고정</text>

  <rect x="58" y="1654" width="330" height="132" rx="11" fill="#ffffff" stroke="#3b82c4" stroke-width="1.5"/>
  <text x="223" y="1682" class="card-title">정상 건수</text>
  <text x="223" y="1712" class="mono">기준 5건 → 결과 5행</text>
  <text x="223" y="1738" class="card-text-small">NOT NULL FK와 참조 무결성이 유지되고</text>
  <text x="223" y="1760" class="card-text-small">추가 필터가 없을 때 각 e 행이 한 번 복원</text>

  <rect x="435" y="1654" width="330" height="132" rx="11" fill="#ffffff" stroke="#d9534f" stroke-width="1.5"/>
  <text x="600" y="1682" class="card-title">잘못된 우회 연결</text>
  <text x="600" y="1712" class="mono-small">e.course_id = i.id ✕</text>
  <text x="600" y="1738" class="card-text-small">강사 관계는 courses를 거쳐야 함</text>
  <text x="600" y="1760" class="card-text-small">잘못된 ON은 우연히 같은 ID를 결합할 수 있음</text>

  <rect x="812" y="1654" width="330" height="132" rx="11" fill="#ffffff" stroke="#7c5cc4" stroke-width="1.5"/>
  <text x="977" y="1682" class="card-title">행 증가·누락 점검</text>
  <text x="977" y="1712" class="card-text">예상보다 많으면 ON 조건과 관계 수 확인</text>
  <text x="977" y="1738" class="card-text-small">적으면 INNER JOIN·WHERE에 의한 제외 확인</text>
  <text x="977" y="1760" class="card-text-small">DISTINCT로 원인을 숨기기 전에 경로 검토</text>

  <rect x="110" y="1810" width="980" height="30" rx="9" fill="#ecfdf3" stroke="#62b47a" stroke-width="1.2"/>
  <text x="600" y="1830" class="ok">COUNT(*)와 COUNT(DISTINCT e.id)를 함께 비교하면 결과 중복 여부를 빠르게 점검할 수 있다</text>

  <rect x="92" y="1870" width="1016" height="42" rx="11" fill="#fff8e8" stroke="#d69e2e" stroke-width="1.4"/>
  <text x="600" y="1887" class="note-title">핵심 원칙</text>
  <text x="600" y="1905" class="principle">기준 행 → FK 경로 → 단계별 ON → 필요한 컬럼 → 예상 행 수 → 결과 의미 순서로 검증한다</text>
</svg>