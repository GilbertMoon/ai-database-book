<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">다중 테이블 JOIN 경로와 결과 행 검산</title>
  <desc id="desc">수강신청 한 건을 결과 한 행의 기준으로 정하고 enrollments의 student_id와 course_id, courses의 instructor_id가 각각 관련 테이블의 기본키로 연결되는 논리적 JOIN 경로를 보여준다. 결과 컬럼의 출처와 원본 신청 5행이 INNER JOIN 후에도 5행이어야 한다는 검산 기준, 정상적인 1대다 반복과 잘못된 중복을 구분하는 주의점을 함께 설명한다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
    <style>
      text{font-family:"Pretendard","Noto Sans KR","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",Arial,sans-serif;fill:#0f172a}
      .mono{font-family:Consolas,D2Coding,"Courier New",monospace}
      .title{font-size:30px;font-weight:800;text-anchor:middle}
      .subtitle{font-size:14px;text-anchor:middle;fill:#475569}
      .head{font-size:18px;font-weight:800;text-anchor:middle}
      .section{font-size:15px;font-weight:700;text-anchor:middle}
      .body{font-size:13px;text-anchor:middle;fill:#334155}
      .small{font-size:11.8px;text-anchor:middle;fill:#475569}
      .step{font-size:12px;font-weight:700;text-anchor:middle;fill:#ffffff}
      .card{stroke-width:2;rx:16;ry:16}
      .principle{fill:#f8fafc;stroke:#94a3b8}
      .grain{fill:#fff7ed;stroke:#f97316}
      .student{fill:#eff6ff;stroke:#3b82f6}
      .enrollment{fill:#faf5ff;stroke:#8b5cf6}
      .course{fill:#f0fdf4;stroke:#22c55e}
      .instructor{fill:#ecfeff;stroke:#06b6d4}
      .relation{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.4;rx:12;ry:12}
      .source{fill:#f8fafc;stroke:#64748b}
      .check{fill:#ecfdf5;stroke:#22c55e}
      .warn{fill:#fff1f2;stroke:#e11d48}
      .note{fill:#fffbeb;stroke:#f59e0b}
      .pk{fill:#1d4ed8;font-weight:700}
      .fk{fill:#7c3aed;font-weight:700}
      .line{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#arrow);stroke-linejoin:round}
      .connector{stroke:#94a3b8;stroke-width:1.7;fill:none;stroke-linejoin:round}
      .divider{stroke:#cbd5e1;stroke-width:1.3;stroke-dasharray:6 6}
    </style>
  </defs>

  <rect width="1200" height="1120" fill="#ffffff"/>
  <text x="600" y="46" class="title">다중 테이블 JOIN 경로와 결과 행 검산</text>
  <text x="600" y="74" class="subtitle">JOIN 문법보다 먼저 결과 한 행의 의미와 실제 PK·FK 관계를 고정합니다.</text>

  <rect x="90" y="100" width="1020" height="66" class="card principle"/>
  <text x="600" y="126" class="section">핵심 원칙</text>
  <text x="600" y="150" class="body">수강신청 현황은 enrollments 한 건이 한 행이며, 학생·강의·강사 정보가 추가되어도 이 기준은 바뀌지 않습니다.</text>

  <rect x="300" y="195" width="600" height="78" class="card grain"/>
  <text x="600" y="225" class="head">결과 한 행의 기준: 수강신청 한 건</text>
  <text x="600" y="252" class="body"><tspan class="mono">course_project.enrollments</tspan> 기준 데이터 5행 → 정상 INNER JOIN 결과도 5행</text>

  <text x="600" y="322" class="head">논리적 PK·FK JOIN 관계 경로</text>
  <line x1="35" y1="340" x2="1165" y2="340" class="divider"/>

  <rect x="35" y="370" width="220" height="190" class="card student"/>
  <text x="145" y="405" class="head">students s</text>
  <text x="145" y="437" class="mono section pk">PK id</text>
  <text x="145" y="470" class="mono body">name</text>
  <text x="145" y="500" class="small">학생 이름 제공</text>
  <text x="145" y="530" class="mono small">s.name AS student_name</text>

  <rect x="305" y="350" width="285" height="230" class="card enrollment"/>
  <circle cx="335" cy="380" r="15" fill="#8b5cf6"/>
  <text x="335" y="385" class="step">기준</text>
  <text x="447.5" y="405" class="head">enrollments e</text>
  <text x="447.5" y="437" class="mono section pk">PK id</text>
  <text x="447.5" y="467" class="mono section fk">FK student_id</text>
  <text x="447.5" y="495" class="mono section fk">FK course_id</text>
  <text x="447.5" y="525" class="mono body">status · paid_amount</text>
  <text x="447.5" y="550" class="mono body">enrolled_at</text>

  <rect x="640" y="370" width="220" height="190" class="card course"/>
  <text x="750" y="405" class="head">courses c</text>
  <text x="750" y="437" class="mono section pk">PK id</text>
  <text x="750" y="467" class="mono section fk">FK instructor_id</text>
  <text x="750" y="500" class="mono body">title</text>
  <text x="750" y="530" class="mono small">c.title AS course_title</text>

  <rect x="910" y="370" width="255" height="190" class="card instructor"/>
  <text x="1037.5" y="405" class="head">instructors i</text>
  <text x="1037.5" y="437" class="mono section pk">PK id</text>
  <text x="1037.5" y="470" class="mono body">name</text>
  <text x="1037.5" y="500" class="small">강사 이름 제공</text>
  <text x="1037.5" y="530" class="mono small">i.name AS instructor_name</text>

  <path d="M305 465 H255" class="line"/>
  <circle cx="280" cy="465" r="14" fill="#7c3aed"/>
  <text x="280" y="470" class="step">1</text>

  <path d="M590 495 H640" class="line"/>
  <circle cx="615" cy="495" r="14" fill="#7c3aed"/>
  <text x="615" y="500" class="step">2</text>

  <path d="M860 467 H910" class="line"/>
  <circle cx="885" cy="467" r="14" fill="#7c3aed"/>
  <text x="885" y="472" class="step">3</text>

  <rect x="35" y="610" width="350" height="72" class="relation"/>
  <text x="210" y="638" class="mono section"><tspan class="fk">e.student_id</tspan> = <tspan class="pk">s.id</tspan></text>
  <text x="210" y="663" class="small">수강신청에서 학생으로 이동</text>

  <rect x="425" y="610" width="350" height="72" class="relation"/>
  <text x="600" y="638" class="mono section"><tspan class="fk">e.course_id</tspan> = <tspan class="pk">c.id</tspan></text>
  <text x="600" y="663" class="small">수강신청에서 강의로 이동</text>

  <rect x="815" y="610" width="350" height="72" class="relation"/>
  <text x="990" y="638" class="mono section"><tspan class="fk">c.instructor_id</tspan> = <tspan class="pk">i.id</tspan></text>
  <text x="990" y="663" class="small">강사는 courses를 거쳐 연결</text>

  <path d="M600 682 V715" class="connector"/>
  <text x="600" y="742" class="head">SELECT 결과 컬럼의 출처</text>
  <line x1="35" y1="760" x2="1165" y2="760" class="divider"/>

  <rect x="35" y="780" width="260" height="125" class="card source"/>
  <text x="165" y="812" class="head">enrollments</text>
  <text x="165" y="842" class="mono body">enrollment_id · status</text>
  <text x="165" y="866" class="mono body">paid_amount · enrolled_at</text>
  <text x="165" y="890" class="small">결과 행의 기준과 업무 상태</text>

  <rect x="325" y="780" width="260" height="125" class="card source"/>
  <text x="455" y="812" class="head">students</text>
  <text x="455" y="845" class="mono body">student_name</text>
  <text x="455" y="875" class="small">같은 학생이 여러 신청에서 반복 가능</text>

  <rect x="615" y="780" width="260" height="125" class="card source"/>
  <text x="745" y="812" class="head">courses</text>
  <text x="745" y="845" class="mono body">course_title</text>
  <text x="745" y="875" class="small">신청이 참조한 강의 정보</text>

  <rect x="905" y="780" width="260" height="125" class="card source"/>
  <text x="1035" y="812" class="head">instructors</text>
  <text x="1035" y="845" class="mono body">instructor_name</text>
  <text x="1035" y="875" class="small">강의를 담당하는 강사 정보</text>

  <rect x="35" y="945" width="550" height="120" class="card check"/>
  <text x="310" y="978" class="head">정상 결과 검산</text>
  <text x="310" y="1007" class="mono body">enrollments 5행 → JOIN 결과 5행</text>
  <text x="310" y="1033" class="body">김민지·이준호가 두 번 나타나는 것은 여러 신청을 가진 정상적인 1:N 반복</text>
  <text x="310" y="1054" class="small">결과 한 행이 여전히 수강신청 한 건인지 확인</text>

  <rect x="615" y="945" width="550" height="120" class="card warn"/>
  <text x="890" y="978" class="head">행 수가 예상과 다르면</text>
  <text x="890" y="1007" class="body">JOIN 조건·필터·관계 차수·키 중복과 누락을 먼저 확인</text>
  <text x="890" y="1033" class="body">원인을 모른 채 <tspan class="mono">DISTINCT</tspan>를 추가해 문제를 숨기지 않음</text>
  <text x="890" y="1054" class="small">행 감소는 누락 관계나 INNER JOIN 조건도 점검</text>

  <rect x="120" y="1080" width="960" height="32" class="card note"/>
  <text x="600" y="1101" class="small">주의: 이 그림은 SQL 작성의 논리적 관계 경로이며, 실제 물리적 JOIN 순서는 DBMS 실행 계획이 결정합니다.</text>
</svg>
