<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="100%" viewBox="0 0 1200 620">
  <title id="title">수강신청 현황을 만드는 다중 JOIN 경로</title>
  <desc id="desc">enrollments에서 students, courses, instructors로 이동하는 정확한 외래키 경로와 결과 컬럼 구성을 보여 주는 도식이다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 28px 'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif; fill: #0f172a; }
      .box { stroke: #334155; stroke-width: 2; rx: 16; ry: 16; }
      .head { font: 600 17px 'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif; fill: #0f172a; }
      .text { font: 14px 'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif; fill: #0f172a; }
      .fk { font: 700 13px 'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif; fill: #7c3aed; }
      .pk { font: 700 13px 'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif; fill: #2563eb; }
    </style>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" class="title">수강신청 현황을 만드는 다중 JOIN 경로</text>
  <rect x="90" y="160" width="230" height="130" class="box" fill="#dbeafe"/>
  <text x="205" y="195" text-anchor="middle" class="head">students</text>
  <text x="205" y="225" text-anchor="middle" class="pk">PK id</text>
  <text x="205" y="255" text-anchor="middle" class="text">name</text>
  <rect x="390" y="135" width="280" height="185" class="box" fill="#dbeafe"/>
  <text x="530" y="170" text-anchor="middle" class="head">enrollments</text>
  <text x="530" y="200" text-anchor="middle" class="pk">PK id</text>
  <text x="530" y="228" text-anchor="middle" class="fk">FK student_id</text>
  <text x="530" y="256" text-anchor="middle" class="fk">FK course_id</text>
  <text x="530" y="284" text-anchor="middle" class="text">status · paid_amount</text>
  <rect x="740" y="160" width="230" height="130" class="box" fill="#ede9fe"/>
  <text x="855" y="195" text-anchor="middle" class="head">courses</text>
  <text x="855" y="225" text-anchor="middle" class="pk">PK id</text>
  <text x="855" y="252" text-anchor="middle" class="fk">FK instructor_id</text>
  <text x="855" y="279" text-anchor="middle" class="text">title</text>
  <rect x="740" y="355" width="230" height="110" class="box" fill="#ede9fe"/>
  <text x="855" y="390" text-anchor="middle" class="head">instructors</text>
  <text x="855" y="420" text-anchor="middle" class="pk">PK id</text>
  <text x="855" y="448" text-anchor="middle" class="text">name</text>
  <rect x="930" y="95" width="220" height="420" class="box" fill="#dcfce7"/>
  <text x="1040" y="130" text-anchor="middle" class="head">결과 컬럼</text>
  <text x="1040" y="170" text-anchor="middle" class="text">enrollment_id</text>
  <text x="1040" y="200" text-anchor="middle" class="text">student_name</text>
  <text x="1040" y="230" text-anchor="middle" class="text">course_title</text>
  <text x="1040" y="260" text-anchor="middle" class="text">instructor_name</text>
  <text x="1040" y="290" text-anchor="middle" class="text">status</text>
  <text x="1040" y="320" text-anchor="middle" class="text">paid_amount</text>
  <text x="1040" y="350" text-anchor="middle" class="text">enrolled_at</text>
  <line x1="390" y1="225" x2="320" y2="225" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="355" y="210" text-anchor="middle" class="fk">student_id -> students.id</text>
  <line x1="670" y1="240" x2="740" y2="240" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="705" y="225" text-anchor="middle" class="fk">course_id -> courses.id</text>
  <line x1="855" y1="290" x2="855" y2="355" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="900" y="325" class="fk">instructor_id -> instructors.id</text>
  <line x1="320" y1="260" x2="930" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="670" y1="290" x2="930" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="970" y1="410" x2="930" y2="260" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="100" y="525" width="1000" height="60" class="box" fill="#f8fafc"/>
  <text x="600" y="560" text-anchor="middle" class="text">수강신청 현황의 기준 행은 enrollments이며, 강사는 enrollments에서 직접 연결하지 않고 courses를 거쳐 instructors로 이동한다</text>
</svg>
